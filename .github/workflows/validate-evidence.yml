name: Validate evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "sessions/**"
      - "cases/**"
      - "comparators/**"
      - "research/**"
      - "proposals/**"
      - "renderer/**"
      - "schema/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "docs/project-workflow.md"
      - "docs/threads-evidence-fetch.md"
      - "README.md"
      - "CNAME"
  push:
    branches-ignore:
      - gh-pages
    paths:
      - "sessions/**"
      - "cases/**"
      - "comparators/**"
      - "research/**"
      - "proposals/**"
      - "renderer/**"
      - "schema/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "docs/project-workflow.md"
      - "docs/threads-evidence-fetch.md"
      - "README.md"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install renderer dependencies
        run: pip install -r requirements.txt

      - name: Run tool unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install browser for Threads diagnostic (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'tool/threads-evidence-fetch'
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Resolve Threads share in browser (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'tool/threads-evidence-fetch'
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://www.threads.com/share/BBtkG8GXY7/"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(8000)
              print("final_url:", page.url)
              print("title:", page.title())
              content = page.content()
              print("dom_chars:", len(content))
              print("has_thread_items:", '"thread_items"' in content)
              browser.close()
          PY

      - name: Validate schema and cross-references
        run: python renderer/render.py --check

      - name: Render site smoke test
        run: |
          python renderer/render.py --output site
          test -s site/index.html
          test -s site/sitemap.xml
          test -s site/robots.txt
          grep -Fq "https://politics-db.4649.tw/" site/sitemap.xml
          grep -Fq "Sitemap: https://politics-db.4649.tw/sitemap.xml" site/robots.txt
          grep -Fq '<link rel="canonical" href="https://politics-db.4649.tw/">' site/index.html
          grep -R -Fq 'rel="canonical" href="https://politics-db.4649.tw/sessions/' site/sessions
