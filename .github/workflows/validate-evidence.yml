name: Validate evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "sessions/**"
      - "cases/**"
      - "comparators/**"
      - "research/**"
      - "proposals/**"
      - "renderer/**"
      - "schema/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "docs/project-workflow.md"
      - "docs/threads-evidence-fetch.md"
      - "README.md"
      - "CNAME"
  push:
    branches-ignore:
      - gh-pages
    paths:
      - "sessions/**"
      - "cases/**"
      - "comparators/**"
      - "research/**"
      - "proposals/**"
      - "renderer/**"
      - "schema/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "docs/project-workflow.md"
      - "docs/threads-evidence-fetch.md"
      - "README.md"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install renderer dependencies
        run: pip install -r requirements.txt

      - name: Run tool unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Direct Threads share diagnostic (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'tool/threads-evidence-fetch'
        run: |
          python - <<'PY'
          import re
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          url = "https://www.threads.com/share/BBtkG8GXY7/"
          req = Request(url, headers={
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml",
          })
          try:
              with urlopen(req, timeout=30) as r:
                  body = r.read(2_000_000).decode("utf-8", errors="replace")
                  print("status:", r.status)
                  print("final_url:", r.geturl())
                  print("content_type:", r.headers.get("content-type"))
                  urls = sorted(set(re.findall(r'https://(?:www\\.)?threads\\.(?:com|net)/@[^"\\s<>]+/post/[A-Za-z0-9_-]+', body)))
                  print("canonical_candidates:", urls[:10])
                  print("body_bytes:", len(body.encode("utf-8")))
                  print("has_thread_items:", '"thread_items"' in body)
          except HTTPError as exc:
              print("http_error:", exc.code)
              print("location:", exc.headers.get("location"))
              print(exc.read(2000).decode("utf-8", errors="replace"))
          except URLError as exc:
              print("url_error:", exc.reason)
          PY

      - name: Validate schema and cross-references
        run: python renderer/render.py --check

      - name: Render site smoke test
        run: |
          python renderer/render.py --output site
          test -s site/index.html
          test -s site/sitemap.xml
          test -s site/robots.txt
          grep -Fq "https://politics-db.4649.tw/" site/sitemap.xml
          grep -Fq "Sitemap: https://politics-db.4649.tw/sitemap.xml" site/robots.txt
          grep -Fq '<link rel="canonical" href="https://politics-db.4649.tw/">' site/index.html
          grep -R -Fq 'rel="canonical" href="https://politics-db.4649.tw/sessions/' site/sessions
