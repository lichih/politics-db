name: Validate evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "sessions/**"
      - "cases/**"
      - "comparators/**"
      - "research/**"
      - "proposals/**"
      - "renderer/**"
      - "schema/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "docs/project-workflow.md"
      - "docs/threads-evidence-fetch.md"
      - "README.md"
      - "CNAME"
  push:
    branches-ignore:
      - gh-pages
    paths:
      - "sessions/**"
      - "cases/**"
      - "comparators/**"
      - "research/**"
      - "proposals/**"
      - "renderer/**"
      - "schema/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "docs/project-workflow.md"
      - "docs/threads-evidence-fetch.md"
      - "README.md"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install renderer dependencies
        run: pip install -r requirements.txt

      - name: Run tool unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Inspect Threads share bootstrap (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'tool/threads-evidence-fetch'
        run: |
          python - <<'PY'
          import html
          import re
          from urllib.request import Request, urlopen

          url = "https://www.threads.com/share/BBtkG8GXY7/"
          req = Request(url, headers={
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml",
          })
          with urlopen(req, timeout=30) as r:
              body = r.read(2_000_000).decode("utf-8", errors="replace")

          normalized = html.unescape(body).replace("\\/", "/")
          print("body_chars:", len(body))

          for name in ("og:url", "og:title", "og:description", "twitter:title", "twitter:description"):
              pattern = rf'<meta[^>]+(?:property|name)=["\\\']{re.escape(name)}["\\\'][^>]+content=["\\\']([^"\\\']*)'
              m = re.search(pattern, normalized, re.I)
              print(name + ":", m.group(1)[:1000] if m else None)

          m = re.search(r'<link[^>]+rel=["\\\']canonical["\\\'][^>]+href=["\\\']([^"\\\']+)', normalized, re.I)
          print("canonical_link:", m.group(1) if m else None)

          post_patterns = [
              r'https://(?:www\\.)?threads\\.(?:com|net)/@[A-Za-z0-9._-]+/post/[A-Za-z0-9_-]+',
              r'/@[A-Za-z0-9._-]+/post/[A-Za-z0-9_-]+',
          ]
          candidates = []
          for pattern in post_patterns:
              candidates.extend(re.findall(pattern, normalized))
          print("post_candidates:", sorted(set(candidates))[:30])

          for needle in ("BBtkG8GXY7", "redirect_url", "permalink", "shortcode", "post_id", "media_id"):
              print("---", needle, "---")
              start = 0
              shown = 0
              while shown < 3:
                  idx = normalized.find(needle, start)
                  if idx < 0:
                      break
                  print(normalized[max(0, idx-500):idx+1500])
                  start = idx + len(needle)
                  shown += 1
              if shown == 0:
                  print("not found")
          PY

      - name: Validate schema and cross-references
        run: python renderer/render.py --check

      - name: Render site smoke test
        run: |
          python renderer/render.py --output site
          test -s site/index.html
          test -s site/sitemap.xml
          test -s site/robots.txt
          grep -Fq "https://politics-db.4649.tw/" site/sitemap.xml
          grep -Fq "Sitemap: https://politics-db.4649.tw/sitemap.xml" site/robots.txt
          grep -Fq '<link rel="canonical" href="https://politics-db.4649.tw/">' site/index.html
          grep -R -Fq 'rel="canonical" href="https://politics-db.4649.tw/sessions/' site/sessions
