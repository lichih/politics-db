name: Validate evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "sessions/**"
      - "cases/**"
      - "comparators/**"
      - "research/**"
      - "proposals/**"
      - "renderer/**"
      - "schema/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "docs/project-workflow.md"
      - "README.md"
      - "CNAME"
  push:
    branches-ignore:
      - gh-pages
    paths:
      - "sessions/**"
      - "cases/**"
      - "comparators/**"
      - "research/**"
      - "proposals/**"
      - "renderer/**"
      - "schema/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "docs/project-workflow.md"
      - "README.md"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install renderer dependencies
        run: pip install -r requirements.txt

      - name: Validate schema and cross-references
        run: python renderer/render.py --check
