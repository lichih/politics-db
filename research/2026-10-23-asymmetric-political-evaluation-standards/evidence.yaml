sources:
  - id: S001
    source_type: commentary
    publisher: "Threads / @luxienen"
    title: "以同一格式比較藍白與綠營當局者、支持者之公開貼文"
    url: "https://www.threads.com/@luxienen/post/Dexv0pZky8k"
    published_at: "2026-10-22"
    observed_at: "2026-10-23T00:20:00+08:00"
    retrieval_status: reachable
    notes:
      - "原文依序列出：『藍白當局者:邏輯死亡、滋事擺態、獨斷獨裁、製造對立、利益親共』；『藍白支持者:邏輯死亡、盲目盲從、是非不分、裝瞎裝死、貪財怕死、維持統一』；『綠營當局者:邏輯清晰、無所作為、養癱成患、利益親美』；『綠營支持者:邏輯清晰、盲目盲從、中華台灣』。"
      - "本來源只能直接證明作者公開採用上述分類與形容詞；各形容詞所指涉的外部事實真假需另案查證。"
      - "當次頁面快照顯示原貼文約151次瀏覽、5則回覆；互動數只作觀察時點紀錄，不代表任何群體比例或同意程度。"

  - id: S002
    source_type: commentary
    publisher: "Threads / @asd0123po、@luxienen"
    title: "『反串的不錯』與作者『反串？』之公開回覆"
    url: "https://www.threads.com/@asd0123po/post/DeyvVGZmFZZ"
    published_at: "2026-10-22"
    observed_at: "2026-10-23T00:20:00+08:00"
    retrieval_status: reachable
    notes:
      - "可見回覆者留言『反串的不錯』；原作者隨後以『反串？』回覆。"
      - "此互動可用來限制『原貼文顯然是刻意反諷』的解讀，但不足以單獨證明作者所有文字皆為完全字面、無幽默或無修辭。"
      - "作者回覆網址在同一頁面可見為 https://www.threads.com/@luxienen/post/DeyybAAk375 。"

facts:
  - id: F001
    statement: "@luxienen 在同一篇公開貼文中，以四列相同版式分別評價藍白當局者、藍白支持者、綠營當局者與綠營支持者；其中藍白兩列包含『邏輯死亡』及獨裁、是非不分、裝瞎裝死、貪財怕死、親共／維持統一等負面描述，而綠營兩列均包含『邏輯清晰』，其負面描述主要包括無所作為、養癱成患與盲目盲從。"
    status: verified
    observed_at: "2026-10-23T00:20:00+08:00"
    source_ids: [S001]
    evidence_summary: "原貼文四列文字可直接確認不同陣營被套用的形容詞集合並不相同。"
    verification_notes:
      - "此 fact 描述的是文本內容與分類差異，不判斷『邏輯死亡』『獨裁』『親共』『邏輯清晰』等評價是否符合外部事實。"
      - "『主要包括』是對原文形容詞類型的摘要，不等於已完成心理、道德或政策成效的實體查核。"
    tags: ["2026", Threads, 藍白, 綠營, asymmetric-standards, text-structure]

  - id: F002
    statement: "在同一公開串文中，有回覆者將原貼文理解為『反串』，原作者以『反串？』回覆，未直接接受該反串定位。"
    status: verified
    observed_at: "2026-10-23T00:20:00+08:00"
    source_ids: [S002]
    evidence_summary: "頁面可直接觀察『反串的不錯』與作者『反串？』的相鄰互動。"
    verification_notes:
      - "作者反問並不等於完成心理狀態證明；只足以使『這明顯是作者自認的反諷文本』失去直接文本支持。"
    tags: ["2026", Threads, satire-interpretation, context]

claims:
  - id: C001
    statement: "S001可作為『表面採用對稱比較格式，但實際評價維度與負面強度跨陣營不對稱』的存在性樣本。"
    status: supported
    supports: [F001]
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "四個政治群體被放入同一格式中，但原文並未使用同一組可對照指標：藍白側被賦予認知、道德、民主程序與國家忠誠等負面判斷，綠營側同時保留『邏輯清晰』的正面前提，負面詞主要落在治理績效與盲從。此 claim 僅分類文本結構，不判定任何一側實體評價真假。"

  - id: C002
    statement: "單靠『兩邊都有批評』或把不同陣營排成相同版式，不能證明比較使用了同一把尺。"
    status: supported
    supports: [F001]
    contradicts: []
    related_facts: []
    reasoning_notes: "是否同一把尺取決於評價維度、證據門檻與可比較標準是否一致，而不是每一側是否都出現負面形容詞。F001本身即提供一個形式對稱但指標集合不同的反例。"

  - id: C003
    statement: "S001已足以證明綠營支持者整體、民進黨支持者整體或台灣某一政治陣營普遍採用不對稱判準。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002]
    reasoning_notes: "單一自然樣本只能證明此論述型態存在；沒有代表性抽樣、帳號政黨認同驗證、跨陣營baseline或群體比例資料，不能升格成群體普遍性結論。"

  - id: C004
    statement: "『表面平衡／兩邊都罵』可能在政治論述中充當一種可信度或中立感訊號，同時保留實質不對稱的舉證門檻與評價標準。"
    status: unresolved
    supports: [F001]
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "S001證明形式對稱與實質指標差異可以同時出現，但作者並未明言自己藉由『兩邊都罵』主張中立，因此目前只能把這個修辭功能保存為可檢驗 hypothesis。要升格需蒐集更多 paired cases：作者先以『我兩邊都罵／我很中立』建立credential，再在具體案件對不同陣營使用不同證據門檻。"

