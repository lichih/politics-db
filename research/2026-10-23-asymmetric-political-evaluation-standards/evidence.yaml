notes:
  - "本 research 與 research/2026-10-19-dpp-supporter-deification-attitudes/evidence.yaml 的『同一把尺』問題相鄰，但本檔專注於比較架構本身是否對稱，不重複保存既有樣本。"
  - "本 research 與 research/2026-10-21-supporter-reward-democratic-brakes/evidence.yaml 的 identity bundling、evidence-demand punishment、argument-demand punishment 等機制相鄰；目前不預設它們與本案由同一因果機制造成。"
  - "後續優先蒐集最有辨識力的 paired evidence：同一作者明示『兩邊都一樣／我都罵』，但在同類事實、程序或證據門檻上對不同陣營採用不同標準。"
