claims:
  - id: C001
    statement: "『爭議因缺乏可獨立重建的原始紀錄而長期停在unresolved』與『已證明官方沒有問題』是同一件事。"
    status: contradicted
    contradicts: [F001, F002, F004, F005, F007, F010]
    reasoning_notes: "record gap、文件形成疑義、未取得後續primary record等只能限制可判斷範圍；unresolved不得被偷換成exonerated，也不得反向偷換成guilty。"

  - id: C002
    statement: "本研究目前已可觀察到跨司法、國營事業、軍購與國安敘事的共同『auditability』問題：關鍵紀錄缺失／集中於被質疑機關、文件完整性爭議、failure state可移動或個案歸因超出公開證據鏈，都可能使外部查核停在無法有效證偽的狀態。"
    status: supported
    supports: [F001, F002, F004, F005, F006, F007, F008, F010]
    related_facts: [F003, F009]
    reasoning_notes: "支持的是跨案比較框架，不是宣稱各案法律性質相同，也不是宣稱所有官方說法皆為假。"

  - id: C003
    statement: "上述案例已證明民進黨政府有一套統一、故意設計的『不可證偽』操作策略。"
    status: unsupported
    supports: []
    related_facts: [F001, F002, F004, F005, F007, F008, F009, F010]
    reasoning_notes: "要升格為統一策略或主觀故意，仍需決策鏈、指令、跨機關協調、共同設計或其他能證明主觀目的的證據。跨案結構相似本身不足。"

  - id: C004
    statement: "高虹安案16分鐘錄音缺口本身足以證明王郁文所述『上面指示要起訴』等內容確實發生。"
    status: unsupported
    supports: []
    related_facts: [F001]
    reasoning_notes: "缺錄音只造成不可由影音重建；不能把不可證偽的指控直接升格為事實。"

  - id: C005
    statement: "檢評會確認醫院2小時未錄音談話及程序違失，即等同確認沈慶京所指逼供、洩密等全部指控成立。"
    status: contradicted
    contradicts: [F002]
    reasoning_notes: "檢評會明確區分：原請求評鑑的4項指控未成立，但另認部分程序行為不符勤慎義務。"

  - id: C006
    statement: "北檢官網PDF的影像異常已足以證明有人犯偽造公文書罪。"
    status: unsupported
    supports: []
    related_facts: [F004]
    reasoning_notes: "目前缺獨立數位鑑識、製作者、加工流程、主觀故意及刑法構成要件證據；但『日期事件為真』亦不能自動回答公開PDF形成歷程。"

  - id: C007
    statement: "法院禁止當事人未經許可自行錄音，就足以證明個案審判不公平。"
    status: unsupported
    supports: []
    related_facts: [F006]
    reasoning_notes: "現行制度同時有法院官方錄音與當事人聲請交付機制；可批評其可驗證性與比例性，但不能直接由限制自行錄音推導特定案件不公平。"

  - id: C008
    statement: "國安局2026年1月的一般認知戰報告，已足以證明2026年10月『洋流發威』15粉專、或其後特定國內政治情緒，均是中共認知作戰造成。"
    status: unsupported
    supports: []
    related_facts: [F009, F010]
    reasoning_notes: "一般威脅模型、既有組織歸因、特定帳號群個案歸因、以及對社會情緒的因果歸因是不同層級；每跨一層都需要新證據。"

  - id: C009
    statement: "反覆出現且缺乏可外部驗證終局的公權力爭議，會降低合理觀察者對制度自我說明的先驗信任。"
    status: unresolved
    supports: [F001, F002, F004, F005, F006, F007, F010]
    related_facts: [F008, F009]
    reasoning_notes: "這是目前的核心因果研究假說。案例可證明auditability gap存在，但『造成多少制度信任下降』仍需民調、實驗、歷時比較或其他社會科學證據，不能只由案例存在直接量化。"

  - id: C010
    statement: "私人政治行為人對選舉對手作『中共／境外勢力操盤』等可驗證事實歸因時，可能進入選罷法第104條刑事程序並由檢方負舉證責任；國安機關以官方身分作敵對勢力／認知作戰歸因，則不能只因具有institutional authority就自動免除可驗證性、監督與救濟問題。"
    status: supported
    supports: [F011, F012]
    related_facts: [F009, F010, F013]
    reasoning_notes: "支持的是同一把尺的公權力研究原則：制度權威不能取代證據。這不表示情報機關必須公開所有機密來源，也不表示國安局目前特定歸因必然不實或違法；真正待查的是替代性的外部監督、程序、可審計摘要與錯誤更正機制。"

  - id: C011
    statement: "國安局一旦以『國安／情資機密』理由不公開逐筆證據，就可以把任何國內政治言論認定為中共認知作戰，且外界完全沒有任何監督或救濟機制。"
    status: unsupported
    supports: []
    related_facts: [F009, F010, F013]
    reasoning_notes: "目前只能確認公開層面的個案證據鏈與方法資訊可能不足；是否存在立院秘密會議、內部稽核、跨機關覆核、司法救濟或其他監督機制，需另外查清，不能把『公開不可驗證』直接寫成『制度上完全不可監督』。"

  - id: C012
    statement: "『公權力不可證偽性』值得作為跨案件長期研究主軸，而不是單一事件結論：應比較record gap、record monopoly、document integrity、attribution opacity、movable failure state、adjacent answer、burden inversion與external audit／remedy等機制是否反覆出現。"
    status: supported
    supports: [F001, F002, F004, F005, F006, F007, F008, F010, F011, F012, F013]
    reasoning_notes: "這是研究分類法與跨案比較框架。它不預先假定所有案例皆違法、皆由同一政黨設計或皆有相同主觀目的；若新案具有透明可重建紀錄、獨立覆核或明確failure state，應作為反例納入。"

  - id: C013
    statement: "只要一審已就重大犯罪判決有罪，就可把該犯罪視為已不需要再受實質證據與法律檢驗的既成事實；上訴審至多處理量刑或枝節。"
    status: contradicted
    supports: []
    contradicts: [F014]
    related_facts: [F001, F015]
    reasoning_notes: "高虹安案提供直接反例：一審貪污罪7年4月，二審撤銷貪污有罪認定並改判偽造文書6月。這只能否定『一審有罪＝不可再質疑的事實終點』，不能反向推出任何其他一審有罪案件必然錯誤。"

  - id: C014
    statement: "高虹安案的16分鐘偵訊影音缺口已被證明是二審改判貪污無罪的原因。"
    status: unsupported
    supports: []
    related_facts: [F001, F014, F015]
    reasoning_notes: "目前可分別確認record-gap與後審反轉，但未取得足以建立兩者因果關係的裁判理由或其他證據；程序問題、證據／法律評價差異與後審結果必須分層。"

  - id: C015
    statement: "逢甲辣椒水事件可作為『涉事公權力人員的後續處置本身降低外部可驗證性』的比較案例：直接物理原因雖可確認，但動機層因未依正常證據保全、遲延報告與未即時坦承而難以由外部獨立重建。"
