notes:
  - "本檔自2026-10-21起升格為長期母題。分類維度至少包括：record gap（關鍵紀錄缺失）、record monopoly（紀錄只掌握在被質疑機關）、document integrity（公開文件形成／完整性爭議）、attribution opacity（敵對勢力／認知作戰歸因不可外部重建）、movable failure state（義務終點可持續後移）、adjacent answer（回答相鄰命題但未回答核心質疑）、burden inversion（把應由公權力證明之事項倒給被標記者自證）、external audit/remedy（是否有獨立覆核、錯誤更正與救濟）。"
  - "『民進黨政府反覆利用不可證偽結構』可作為待測的跨案hypothesis；現有F001-F013足以證明多個公權力領域出現可驗證性缺口，但仍不足以單獨證明跨機關存在統一政黨指令、共同設計或主觀故意。這個界線保留在C003。"
  - "新增選罷法baseline：sessions/2026-10-21-election-law-104-political-speech-enforcement/evidence.yaml。它用來比較私人政治言論受到刑事追訴時的構成要件、舉證與司法審查，不把『被偵辦』當成內容必然不實。"
  - "反證設計：本母題後續應主動納入不同執政黨、不同機關與能成功被外部證偽／更正的反例，以檢驗問題究竟是特定政黨的權力運用、制度性誘因，或兩者交互作用；不能只用同一陣營案例累積數量來替統一動機命題加分。"
  - "本research是父級比較節點，不取代各個session/case的authoritative細節；新增個案應優先寫回原案件，再於此處引用其mechanism。"
  - "核心方法規則：unresolved != exonerated；同時 unresolved != guilty。不可證偽不能替任何一方預支結論。"
  - "本研究刻意不把『跨案存在相似結構』升格成『執政黨故意統一操作』；後者需要額外的決策與主觀故意證據。"
  - "逢甲辣椒水子案：sessions/2026-10-21-huang-kuo-chang-public-claim-counterexamples/evidence.yaml。其用途限於比較auditability mechanism，不把政治動機升格為既成事實。"
  - "相關既有evidence：cases/2026-10-20-ko-wen-je-judicial-proceedings/evidence.yaml；sessions/2026-10-15-taipei-prosecutor-drug-case/evidence.yaml；sessions/2026-10-20-wu-nai-ren-taisugar-debt-enforcement/evidence.yaml；sessions/2026-10-20-renwu-taisugar-soil-yard-clearing/evidence.yaml；sessions/2026-10-09-defense-procurement-governance/evidence.yaml；research/2026-10-20-obligation-without-failure-state/evidence.yaml。"
  - "stopping rule：本節點不追求『收完所有案例』。只在新案例能增加新的mechanism、提供反例、或實質改變C002/C009判斷時再更新。"
