facts:
  - id: F001
    statement: "高虹安助理費案中，王郁文2023年4月12日偵訊影音存在約16分鐘中斷；公訴檢察官並未否認中斷，而主張該段未就犯罪事實訊問、屬與律師溝通及交換法律意見。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S001]
    evidence_summary: "可確認『16分鐘沒有偵訊影音』及檢方對中斷性質的公開解釋；無影音本身使該段實際談話內容無法由影音直接重建。"
    verification_notes:
      - "王郁文所稱『上面指示起訴』等內容仍屬其主張，不能因錄音缺口而升格為已證實。"
    tags: [北檢, 偵訊錄音, record-gap, 高虹安]

  - id: F002
    statement: "檢評會後續認定，林俊言2024年10月11日與沈慶京有約2小時未錄音錄影的非正式談話，另有未通知辯護律師之單獨接觸；雖原請求評鑑的4項指控未成立，部分程序行為仍被認定逾越應有分際並移請職務監督。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S002]
    evidence_summary: "此案提供一個後續外部評鑑實際確認『未錄音長時間談話／程序分際問題』的例子；但不等同確認逼供、洩密等原指控。"
    tags: [北檢, 沈慶京, 檢評會, record-gap, 外部評鑑]

  - id: F003
    statement: "北檢2025年3月18日公開新聞稿將10月11日行為描述為先行『視察／交談』、結束前始製作訊問筆錄，並以附件公文說明其事後陳報法院之程序。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S003]
    evidence_summary: "可確認北檢自己的公開程序敘事，以及其以公文附件作為對外澄清材料。"
