facts:
  - id: F001
    statement: "高虹安助理費案中，王郁文2023年4月12日偵訊影音存在約16分鐘中斷；公訴檢察官並未否認中斷，而主張該段未就犯罪事實訊問、屬與律師溝通及交換法律意見。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S001]
    evidence_summary: "可確認『16分鐘沒有偵訊影音』及檢方對中斷性質的公開解釋；無影音本身使該段實際談話內容無法由影音直接重建。"
    verification_notes:
      - "王郁文所稱『上面指示起訴』等內容仍屬其主張，不能因錄音缺口而升格為已證實。"
    tags: [北檢, 偵訊錄音, record-gap, 高虹安]

  - id: F002
    statement: "檢評會後續認定，林俊言2024年10月11日與沈慶京有約2小時未錄音錄影的非正式談話，另有未通知辯護律師之單獨接觸；雖原請求評鑑的4項指控未成立，部分程序行為仍被認定逾越應有分際並移請職務監督。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S002]
    evidence_summary: "此案提供一個後續外部評鑑實際確認『未錄音長時間談話／程序分際問題』的例子；但不等同確認逼供、洩密等原指控。"
    tags: [北檢, 沈慶京, 檢評會, record-gap, 外部評鑑]

  - id: F003
    statement: "北檢2025年3月18日公開新聞稿將10月11日行為描述為先行『視察／交談』、結束前始製作訊問筆錄，並以附件公文說明其事後陳報法院之程序。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S003]
    evidence_summary: "可確認北檢自己的公開程序敘事，以及其以公文附件作為對外澄清材料。"
    tags: [北檢, 官方說明, 視察, 訊問, 公開證據]

  - id: F004
    statement: "2025年8月有人對北檢3月18日官網PDF附件提出可具體檢查的數位文件疑點；北檢後續以北院收文紀錄證明2024年10月23日確實收件並否認變造日期，但公開回應所證明的『收文事件與日期』與『官網PDF影像的製作／加工歷程』並非完全相同的命題。"
    status: partial
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S003, S004]
    evidence_summary: "已確認存在具體影像／PDF形成疑點及北檢回應，也確認北檢取得法院紀錄支持10/23收文；本次未取得獨立數位鑑識報告證明官網PDF是否經不當合成或變造。"
    verification_notes:
      - "不能由影像異常直接下『偽造公文書』結論。"
      - "也不能用『10/23確有收文』自動回答PDF公開版本的所有形成過程問題。"
    tags: [北檢, PDF, document-integrity, adjacent-answer, unresolved]

  - id: F005
    statement: "北院2025年6月5日勘驗A1-37時直接操作原始行動硬碟；辯方主張應使用映像檔並質疑直接操作破壞證據同一性，法院與公訴檢察官則認為直接檢視原始證據並無程序問題。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S005]
    evidence_summary: "可確認數位證據保全方法出現實質爭議；現有來源不足以確認勘驗前後hash是否真的改變。"
    verification_notes:
      - "『hash被搞廢』目前不得作為verified fact。"
    tags: [A1-37, digital-forensics, chain-of-custody, hash]

  - id: F006
    statement: "現行制度一方面要求法院為公開透明及司法課責性原則上全程錄音，另一方面在庭之人（包括當事人）非經審判長許可不得自行錄音；當事人等得依法律要件聲請取得法院官方錄音。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S006, S007]
    evidence_summary: "制度採『官方集中錄製＋私人自行錄製原則受許可控制＋事後聲請取得』架構。"
    tags: [法庭錄音, auditability, 官方紀錄, 當事人]

  - id: F007
    statement: "台糖2026年6月在尚未取得可接受清償協議時撤回吳乃仁管收聲請，8月又公開表示若後續仍無合理還款計畫將再次聲請管收；9月底公開報導仍指向協商未成，而本研究截至10月20日未取得再次聲請管收的primary record。"
    status: partial
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S008, S009, S010]
    evidence_summary: "存在由台糖自行公開設定的後續trigger，但公開資訊不足以在10月20日確認該trigger之後是否已完成特定『再次聲請管收』state transition。"
    verification_notes:
      - "未找到primary record不等於從未聲請；台糖仍可能採取其他強制執行措施。"
    tags: [台糖, failure-state, enforcement-trigger, not-found]

  - id: F008
    statement: "FMS標準LOA採best efforts提供項目，MOS交期為estimated time-period，且可透過Amendment或Modification更新delivery expectations。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S011, S012]
    evidence_summary: "FMS存在交期資訊，但標準制度並非一般商業契約式固定日期一逾期即自動形成同一類型違約後果。"
    tags: [FMS, movable-failure-state, estimated-delivery]

  - id: F009
    statement: "國安局2026年1月公布的年度報告明確把『激化我國內部對立』列為中共認知戰目標之一，並具名指稱『無邊界集團』透過Facebook內容農場及Threads、X帳號吸引流量並伺機投放政治內容。"
    status: verified
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S013]
    evidence_summary: "可確認國安局的一般威脅模型與對無邊界集團的官方歸因。"
    tags: [國安局, 認知作戰, 無邊界集團, 一般威脅模型]

  - id: F010
    statement: "2026年10月『洋流發威了』15粉專事件的公開歸因，目前可查媒體主要引述不具名資安專家連結到『無邊界集團』；本研究未找到國安局針對該15粉專發布具名個案鑑識或正式認定。"
    status: partial
    observed_at: "2026-10-20T17:10:48+08:00"
    source_ids: [S013, S014]
    evidence_summary: "國安局年度報告提供背景與既有組織歸因，但不能自動替代對2026-10特定粉專群的個案證據鏈。"
    verification_notes:
      - "not_found只代表本次查詢未找到國安局個案聲明，不代表國安機關內部不存在相關情報。"
    tags: [國安局, 洋流, claim-inflation, source-proximity]

claims:
  - id: C001
    statement: "『爭議因缺乏可獨立重建的原始紀錄而長期停在unresolved』與『已證明官方沒有問題』是同一件事。"
    status: contradicted
    contradicts: [F001, F002, F004, F005, F007, F010]
    reasoning_notes: "record gap、文件形成疑義、未取得後續primary record等只能限制可判斷範圍；unresolved不得被偷換成exonerated，也不得反向偷換成guilty。"

  - id: C002
    statement: "本研究目前已可觀察到跨司法、國營事業、軍購與國安敘事的共同『auditability』問題：關鍵紀錄缺失／集中於被質疑機關、文件完整性爭議、failure state可移動或個案歸因超出公開證據鏈，都可能使外部查核停在無法有效證偽的狀態。"
    status: supported
    supports: [F001, F002, F004, F005, F006, F007, F008, F010]
    related_facts: [F003, F009]
