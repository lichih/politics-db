facts:
- id: F001
  statement: "FMS標準條款對交付採best efforts；LOA的MOS交期是estimated time-period，且可透過Amendment或Modification更新。"
  status: verified
  observed_at: "2026-10-20T12:08:00+08:00"
  source_ids: [S001, S002]
  evidence_summary: "FMS存在交期資訊，但其標準制度文字明確具有預估與可更新性。"
  tags: [FMS, deadline, estimated, best-efforts]
- id: F002
  statement: "FMS買方可請求取消案件，但退出可能由買方承擔termination costs及行政成本。"
  status: verified
  observed_at: "2026-10-20T12:08:00+08:00"
  source_ids: [S003]
  evidence_summary: "FMS不是完全沒有退出機制，但退出本身不是零成本自動補救。"
  tags: [FMS, exit-cost, cancellation]
- id: F003
  statement: "現行憲法對總統公布法律與行政院提出覆議均設10日規則，並要求覆議維持原案後行政院長『應即接受』；但第37條沒有另列副署日數期限，也沒有明文規定副署逾期即視為副署或法律自動生效。"
  status: verified
  observed_at: "2026-10-20T12:08:00+08:00"
  source_ids: [S004, S005]
  evidence_summary: "這是限定於相關現行憲法文字的absence finding，不等於認定無限期不副署合憲。"
  verification_notes:
  - "合憲性仍維持既有session的unresolved。"
  tags: [不副署, timeout, automatic-effect]
- id: F004
  statement: "現行增修條文把不信任案設為獨立政治責任機制；通過後行政院長須辭職，並可呈請總統解散立法院，因此其政治成本與一般法律案覆議程序不同。"
  status: verified
  observed_at: "2026-10-20T12:08:00+08:00"
  source_ids: [S005]
  evidence_summary: "不信任案不是一個低成本的普通法律覆決按鈕，而是政府存續層級的政治機制。"
  tags: [不信任案, 解散國會, actor-cost]
- id: F005
  statement: "台糖於2026-06-22在尚未取得清償協議時撤回吳乃仁管收聲請，依台糖官方說明，當時依據的是吳方將於之後提出協商或清償計畫的承諾。"
  status: verified
  observed_at: "2026-10-20T12:08:00+08:00"
  source_ids: [S006]
  evidence_summary: "撤回管收與取得可接受清償方案的時間順序可以由台糖自身說明確認。"
  tags: [台糖, 撤回管收, 協商]
- id: F006
  statement: "台糖2026-08-10公開表示第一次協商方案未獲接受，且若第二次仍無合理還款計畫將再次聲請管收。"
  status: verified
  observed_at: "2026-10-20T12:08:00+08:00"
  source_ids: [S007]
  evidence_summary: "台糖曾自行設定『無合理方案→再聲請管收』的公開處理門檻。"
  tags: [台糖, enforcement-trigger, 公開承諾]
- id: F007
  statement: "截至2026-09-30的公開報導仍指向第二次協商未達成協議；另有secondary source稱台糖仍進行財產調查等強制執行，但截至2026-10-20本研究未取得再次聲請管收的primary record。"
  status: partial
  observed_at: "2026-10-20T12:08:00+08:00"
  source_ids: [S008]
  evidence_summary: "可排除『撤回後完全沒有任何執行行動』的過度敘述，但不能證明已再次管收，也不能用not_found證明從未聲請。"
  tags: [台糖, 管收, not-found, unresolved]

claims:
- id: C001
  statement: "FMS交期、不副署與台糖追償在法律性質上是同一種義務，應直接套用同一法律結論。"
  status: contradicted
  contradicts: [F001, F003, F005]
  reasoning_notes: "三案分屬國際軍售契約／行政程序、憲政權力分立與國營事業民事債權執行；本research只比較制度結構，不混同法律規範。"
- id: C002
  statement: "『obligation without failure state』可作為這三案的共同研究假說：形式上的義務或預期結果若缺少明確hard deadline、外部自動transition或由責任人承擔的直接逾期成本，制度可能長期停留在pending狀態。"
  status: supported
  supports: [F001, F002, F003, F004, F005, F006]
  related_facts: [F007]
  reasoning_notes: "支持的是比較框架與可觀察結構，不是宣稱三案都已證明存在違法或故意拖延。FMS有退出機制但有買方成本；不副署的合憲性未決；台糖是否已再次聲請管收仍unresolved。"
- id: C003
  statement: "三案都已證明責任人可以合法而且無限期地不履行，且永遠不會承擔任何成本。"
  status: unsupported
  supports: []
  contradicts: [F002, F004]
  related_facts: [F003, F007]
  reasoning_notes: "這個強命題超出證據：FMS可以取消且存在成本；不信任案與其他監督工具仍存在；台糖也可能持續其他強制執行。真正可研究的是trigger與成本配置是否足以形成有效約束。"
- id: C004
  statement: "判斷一項公共義務是否具有實質約束力，不能只問『文字上有沒有義務』，還應分別檢查deadline、誰能觸發下一狀態、失敗的自動後果，以及主要成本落在責任人還是要求履行者。"
  status: supported
  supports: [F001, F002, F003, F004, F005, F006]
  related_facts: [F007]
  reasoning_notes: "這是由三案差異化比較得到的分析框架，可用來生成後續可反證問題；它本身不替個案預先下違法或失職結論。"

