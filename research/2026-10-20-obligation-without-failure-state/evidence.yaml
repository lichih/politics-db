promotion:
  cases: []
  comparators:
  - "FMS：estimated delivery / best efforts / purchaser exit cost"
  - "不副署：明文義務與覆議終點，但無副署逾期自動transition條款"
  - "台糖追償：撤回管收後的協商、財產調查與再次管收trigger"
  research:
  - "obligation-without-failure-state：deadline / external trigger / failure consequence / actor-side cost 四欄比較"

notes:
- "本research是一個比較框架，不是三案違法性的共同結論。"
- "建議後續新增案例時先填四欄：obligation或expected outcome、deadline/trigger、failure consequence、actor-side cost；缺資料者保持unresolved。"
- "最重要的反證方向：找出實際可由外部低成本啟動、且一到期就強迫state transition的制度；若存在，就會削弱『無failure state』判斷。"
- "相關既有sessions：sessions/2026-10-09-defense-procurement-governance、sessions/2026-10-13-executive-countersignature-nonexecution、sessions/2026-10-20-wu-nai-ren-taisugar-debt-enforcement。"
