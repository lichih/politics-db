  - id: S030
    source_type: commentary
    publisher: "Threads / @liminqian109"
    title: "以「藍白更貪」「光電貪，抓出來都國民黨」回應民進黨貪污批評之貼文與公開回覆"
    url: "https://www.threads.com/@liminqian109/post/DeyUaAsmpN7"
    observed_at: "2026-10-22T23:35:00+08:00"
    retrieval_status: reachable
    notes:
      - "原貼文稱：「民進黨貪污，所以我們要投給更貪的藍白？？？」「現在執政的是民進黨，所以要換成更貪的藍白？」「而且藍白沒執政都可以貪成那樣了」「光電貪，抓出來都國民黨的」，最後以「可以告訴我，你的腦子怎了嗎？小草」收尾。"
      - "本次頁面觀察快照顯示原貼文132讚、137回覆、19轉發、16分享、4,258次瀏覽；互動數會變動，也不能把每一個互動者都視為同意完整命題。"
      - "可見公開回覆中，@blackcat77977留言「有腦子怎麼會當草」，當時顯示4讚。"
      - "頁面可直接證明上述主張、稱呼與互動存在；不能單靠反藍白／稱呼「小草」推定作者或回覆者必然是民進黨支持者、實際投票者，亦不能證明「藍白更貪」或「光電貪抓出來都國民黨」為真。"

  - id: S031
    source_type: commentary
    publisher: "Threads / @yaubado537296"
    title: "老人健保爭論中，兩輪舉證要求後轉向『沒看懂』與G類型身份分類"
    url: "https://www.threads.com/@yaubado537296/post/DezoIzHErBU"
    published_at: "2026-10-23"
    observed_at: "2026-10-23T01:53:00+08:00"
    retrieval_status: reachable
    notes:
      - "上下文起於作者主張藍白以錯誤資訊豢養支持者，並以黃國昌轉貼賴清德長者健保影片為示例。"
      - "被要求具體指出『黃國昌哪一項資訊錯誤』後，作者前一輪回覆（Dezg57SkoxG）先稱提問者『根本沒看懂黃國昌在幹嘛』並要求多看；下一輪回覆（DezoIzHErBU）再稱對方屬『覺得賴清德在雙標的G1~G3選民』，預測其1128選擇不會改變，並以其『不是G4選民』說明沒有必要繼續解釋。"
      - "兩輪回覆在當回合均未列出被要求指出的具體錯誤資訊。"
      - "此來源用於研究argument sequence，不證明作者政黨身分、G分類有效性或任何支持者群體的普遍行為。"

  - id: S032
    source_type: commentary
    publisher: "Threads / @yaubado537296"
    title: "明示不回答fact-level問題，並以對方『非藍即白／來找碴』作為理由"
    url: "https://www.threads.com/@yaubado537296/post/DezpTWQkrxZ"
    published_at: "2026-10-23"
    observed_at: "2026-10-23T08:58:00+08:00"
