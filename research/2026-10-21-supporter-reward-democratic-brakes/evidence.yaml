facts:
  - id: F001
    statement: "2025-01-04，民進黨立院黨團總召柯建銘以「藍白賣台」「救台灣」框架主張罷免41席國民黨區域立委。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
    source_ids: [S001]
    evidence_summary: "中央社直接引述柯建銘的罷免範圍與國安／賣台理由。"
    tags: ["2025", 大罷免, 柯建銘, 賣台, 敵我化]

  - id: F002
    statement: "2025-01-08，王世堅公開表示個人反對「仇恨式罷免」，顯示大罷免路線在民進黨內從早期即存在可觀察異議。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
    source_ids: [S002]
    evidence_summary: "中央社記錄王世堅直接反對該類罷免。"
    tags: ["2025", 王世堅, 黨內異議, 大罷免]

  - id: F003
    statement: "2025-04-19「拒絕統戰，守護台灣」凱道活動公開高喊「挺罷免、清除中共同路人」，且多名民進黨立委在同一活動上台宣講。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
    source_ids: [S003]
    evidence_summary: "罷免動員、反統戰與「清除中共同路人」在同一大型公開活動中並列出現。"
    verification_notes:
      - "不能由共同出席推論每一位民進黨立委都個別喊出或背書該句口號。"
    tags: ["2025", 大罷免, 中共同路人, 反統戰, 民進黨]

  - id: F004
    statement: "2025-06-28，民進黨主席賴清德在全代會官方致詞中，將當年度公民自主浪潮描述為民主持續進化與「與公民同行」的力量。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
    source_ids: [S004]
    evidence_summary: "民進黨官方文件對當時公民動員給予正面民主價值定位。"
    tags: ["2025", 民進黨, 賴清德, 與公民同行, 民主深化]

  - id: F005
    statement: "2025-07-26，首波24名國民黨立委及新竹市長高虹安罷免案全數未通過。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
    source_ids: [S005]
    evidence_summary: "中央社彙整首波開票結果。"
    tags: ["2025", "726", 大罷免, 選舉結果]

  - id: F006
    statement: "726全敗後，賴清德一方面公開承擔批評、尊重投票結果並致歉，另一方面民進黨決定823罷免繼續「與公民同行」。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
    source_ids: [S006]
    evidence_summary: "同一官方回應同時包含尊重／歉意與繼續投入下一波罷免兩種行為訊號。"
    tags: ["2025", "726", "823", 民進黨, 賴清德, revealed-preference]

  - id: F007
    statement: "王世堅在726後主張823應請罷團撤案，隨後遭民進黨立委公開以「不服從命令的，滾啦」及「吃裡扒外」等語批評。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
