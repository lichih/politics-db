    notes:
      - "在先前兩輪被要求指出黃國昌哪一項資訊錯誤後，作者本輪明確表示『我本來就沒有要回答你的問題啊』。"
      - "作者把不回答的理由連結到對提問者的分類：『先入為主』『非藍即白』『來找碴』，並稱不想浪費時間在『你們這種人』身上。"
      - "此來源可用於研究明示拒答與身份／動機分類如何結合；不能單獨證明某陣營普遍如此。"

