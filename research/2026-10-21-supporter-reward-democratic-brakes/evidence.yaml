promotion:
  cases: []
  comparators:
    - proposed: "cross-party-dissent-cost-and-autonomous-political-capital"
      rationale: "後續應跨政黨比較踩煞車者在自主票源／黨資源依賴不同條件下的成本，避免只用王世堅單案推論民進黨特殊性。"
  research: []

notes:
  - "核心研究問題不是「哪個陣營有沒有瘋子」，而是：越界／激進行為在自己的陣營裡得到懲罰還是獎勵，以及政治人物會從這些回饋學到什麼。"
  - "研究鏈：political framing -> supporter response -> intra-coalition norm enforcement -> party resource allocation -> electoral reward/punishment -> subsequent strategic update。"
  - "必須區分 party-level reward、supporter-level reward、voter-level reward；三者不可互相代換。"
  - "必須區分 performance feedback（換人、改善動員、調整話術）與 normative feedback（重新判斷原路線本身是否越界／不應再做）。"
  - "survival != tolerance：異議者能存活，可能來自體系容忍，也可能來自自主選票、地方組織、名望或處理成本太高。政治生態變數必須進模型。"
  - "下一步優先建立 actor-level panel：position -> deviation_from_line -> elite_reaction -> supporter_reaction -> formal_sanction -> informal_cost -> party_resource_dependency -> autonomous_electoral_base -> later_nomination/resource -> alternative_explanations。"
  - "台北市長選舉可作 prospective test：若沈伯洋取得高票／當選，只能先證明其2025大罷免立場未使其失去競爭力；要證明選民「因大罷免而獎勵」仍需直接議題歸因證據。"
  - "既有「中共同路人」語義擴張與支持者自然樣本，分別保存在 research/2026-10-20-ccp-fellow-traveler-label-diffusion/evidence.yaml 與 research/2026-10-19-dpp-supporter-deification-attitudes/evidence.yaml；本檔不宣稱群體代表性。"
  - "「綠共」「北韓法學」不作公開 evidence 定性；如需公開研究，轉換成敵我化、安全化、陣營規範失靈、公權力工具化風險等可檢驗命題。"
  - "新增 evidence-demand punishment 維度：研究支持者是否不只獎勵特定結論，還對要求政府提出證據、區分起訴與定罪、區分中國人士與國家指揮鏈等查證行為施加羞辱或忠誠壓力。"
  - "新增 patriotic credential / identity-bundling 維度：區分『愛台灣是選黨價值標準』與『愛台灣被排他綁定為特定政黨資格』；後者已有存在性樣本，前者本身不是問題。"
  - "argument exemption 暫不升格為已證實機制。需要paired interaction證明在具體待證命題被要求證據後，回應者以愛台／抗中credential替代原本舉證。"
  - "不要用2026搜尋頁倒推『以前沒有』或直接宣稱2024-2026惡化；趨勢需要歷史baseline與可比較樣本。"
  - "紅衛兵比較只能作 mechanism-level comparator：關注上層政治正當化、敵我／純潔分類、群眾自發規範執行、忠誠競逐與對異議者的壓力；不得由部分結構相似直接推成歷史等同性。"
  - "對沈伯洋／黑熊的研究應區分 purpose、design、safeguard 與 observed effect。敵我意識／心防／政府—公民社會協作已是公開design；『壓制國內異議』仍需獨立證據。"
  - "將『沒有成本的一票』操作化時，至少分開測量 party identification、vote intention、willingness to defect/abstain、面對治理或程序失誤時的更新條件，以及同陣營對特定語言／行為的social reward。單一互罵串只能提供互動機制樣本，不能直接證明投票條件性。"
  - "研究者自身若參與公開互罵，evidence仍應保存雙向升級脈絡；不能只截取對方低級語句，再把自己造成的互動條件刪掉。"
  - "新增 supporter-mediated authority shielding 候選機制：制度層的 auditability / unfalsifiability 問題與支持者層的 evidence-demand punishment 之間，可能存在『相鄰真命題替換 -> 羞辱質疑者 -> 替公權力降低回應成本』的中介層；目前只保存為可檢驗機制，不作群體定性。"
  - "此機制與 research/2026-10-20-public-authority-auditability-unfalsifiability/evidence.yaml 應交叉閱讀：前者研究民間政治論述如何複製／放大卸責結構，後者保存公權力自身可驗證性缺口；兩者不得因結構相似就自動推定有組織指揮或共同主觀目的。"
  - "新增 brake-preserving supporter / supporter autonomy 反例維度：支持某政黨本身不等於把個案判斷權交給政黨。研究上應分開測量party identification、對己方不利資訊的更新、是否拒絕identity shortcut、是否要求個案證據，以及是否存在撤回支持／轉票／棄權條件。"
  - "新增 identity substitution after evidence demand 維度：當可驗證命題被要求指出證據時，觀察回應是否從 claim validity 轉向『你是哪一類人／你沒看懂／你本來就不會改變』。此類身份分類若形成self-sealing規則，可能降低反證造成更新的能力；目前只有存在性樣本，尚不能做陣營普遍性判斷。"
  - "新增 identity-based refusal after evidence demand 子型：不只轉移至身份分類，而是明示『不回答』，並把提問者的陣營、偏誤或動機分類當成拒答理由。研究上應區分『合理停止低價值對話』與『把對方身份當成免除原公開主張舉證責任』兩件事。"
  - "『可被政黨動員的資源』應操作化為低更新成本、高可預測、會沿陣營框架自動產生結論／擴散／規範執行等可觀察特徵；不能把政黨支持身分本身直接當成此分類。"
