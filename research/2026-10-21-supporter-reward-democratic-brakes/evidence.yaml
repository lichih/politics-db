    tags: ["2025", 王世堅, 王義川, 林楚茵, 黨內異議, 忠誠壓力]

  - id: F008
    statement: "2025-08-09，民進黨官方宣布持續投入823罷免協助，並把與罷團同行描述為「神聖的民主深化任務」。"
