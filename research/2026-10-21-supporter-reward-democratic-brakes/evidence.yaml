  - id: S026
    source_type: commentary
    publisher: "Facebook / 徐巧芯公開貼文留言串"
    title: "「肖像權」爭點轉向人格與親中羞辱的公開留言互動"
    url: "https://www.facebook.com/HsuChiaoHsin/posts/pfbid0gSHDejbqcinKUWJeyBSPo3Sn26ecFuP16vehWBdu6BoW8CEjSF4zezCsin8Pdz2xl?comment_id=1812561429678024&reply_comment_id=4505153343031573"
    published_at: "2026-10-21"
    observed_at: "2026-10-21T23:31:00+08:00"
    retrieval_status: reachable
    notes:
      - "公開留言串中，帳號「龍龍」先以「你都這樣利用別人肖像權的嗎」提出規範性質疑；後續未補充肖像權侵害的具體構成，而改以「你沒資格」「垃圾」等人格攻擊，並出現「去舔習維尼屁眼」的親中／性羞辱語句。"
      - "同一互動並非單向升級：另一方也先後以「法律只是開場道具」、「在床上大小便」及「維尼專用舔官」等語嘲諷回擊。保存此雙向脈絡，避免把自然互罵樣本誤寫成單方、無挑釁的攻擊。"
      - "此來源能證明該公開互動與語言轉向存在；不能單獨證明發言者的政黨認同、實際投票選擇、智力／學歷／年齡，也不能證明其屬於任何支持者群體。"

