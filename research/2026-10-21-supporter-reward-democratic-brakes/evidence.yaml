    evidence_summary: "民進黨官方在726後仍對第二波罷免給予高度正面規範評價與組織投入。"
    tags: ["2025", "823", 大罷免, 民進黨, 民主深化]

  - id: F009
    statement: "2025-08-23，第二波7名國民黨立委罷免案全數未通過；兩波合計31名國民黨立委罷免案全數未通過。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
    source_ids: [S009]
    evidence_summary: "中央社彙整823與兩波合計結果。"
    tags: ["2025", "823", 大罷免, 選舉結果]

  - id: F010
    statement: "2026-05-13，民進黨正式提名沈伯洋參選台北市長，賴清德稱其為台北市長「不二人選」。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
    source_ids: [S010]
    evidence_summary: "提名與最高層級正面評價可直接由民進黨官方來源確認。"
    verification_notes:
      - "此 fact 只證明2026提名與評價，不證明提名是對2025大罷免立場的獎勵。"
    tags: ["2026", 沈伯洋, 台北市長, 民進黨, 提名]

  - id: F011
    statement: "2024年韓國戒嚴事件中，民進黨團曾短暫發布把尹錫悅戒嚴的「守護自由憲政體制」理由與台灣藍白政治行為對照的貼文，隨後刪除並公開否認支持戒嚴。"
    status: verified
    observed_at: "2026-10-21T19:18:52+08:00"
    source_ids: [S011]
    evidence_summary: "同一案例同時存在安全化類比與後續正式澄清，兩者都需保留。"
    verification_notes:
      - "不能寫成「民進黨正式支持戒嚴」；也不能把原貼文降格成完全沒有政治類比內容的單純國際新聞轉貼。"
    tags: ["2024", 韓國戒嚴, 民進黨團, 安全化, 反例]

claims:
  - id: C001
    statement: "2025大罷免可作為一個已發生的案例，研究國安／敵我化框架、支持者動員與政黨組織投入如何在同一政治過程中相互連結。"
    status: supported
    supports: [F001, F003, F004, F006, F008]
    contradicts: []
    related_facts: [F005, F009]
    reasoning_notes: "本 claim 只主張這些元素在同一政治過程中可觀察地共存並先後連結，不主張國安框架是每一位參與者的唯一動機，也不主張單一因果充分性。"

  - id: C002
    statement: "726首波全數未通過後，民進黨把該結果視為足以停止823罷免動員的煞車訊號。"
    status: contradicted
    supports: []
    contradicts: [F006, F008]
    related_facts: [F005]
    reasoning_notes: "民進黨確實口頭尊重結果並致歉，但其後續組織行為是繼續投入823，不能把口頭尊重單獨解讀成停止該政治路線。"

  - id: C003
    statement: "726後民進黨完全沒有任何尊重結果、承擔責任或反省表態。"
    status: contradicted
    supports: []
    contradicts: [F006]
    related_facts: []
    reasoning_notes: "官方表態確實存在；後續研究要區分 verbal response 與 revealed behavior，而不是刪除其中一邊。"

  - id: C004
    statement: "大罷免失敗後，曾積極參與／支持該路線本身成為民進黨日後重大選舉提名的必然政治禁區。"
    status: contradicted
    supports: []
    contradicts: [F010]
    related_facts: [F003, F008, F009]
    reasoning_notes: "沈伯洋2026獲台北市長提名，至少反證「曾支持大罷免即喪失重大提名資格」這個強命題；但不能由此反推提名原因就是獎勵大罷免。"

  - id: C005
    statement: "沈伯洋獲2026台北市長提名，已足以證明民進黨因其2025大罷免立場而給予政治獎勵。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F010]
    reasoning_notes: "提名是可觀察結果，但候選人選擇存在國安形象、專業、選戰條件、黨內人選等多重解釋；需要更直接的決策證據才能建立此因果箭頭。"

  - id: C006
    statement: "王世堅對大罷免踩煞車後，確實遭到至少部分民進黨公職以忠誠／服從語言公開施加負面壓力。"
    status: supported
    supports: [F007]
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "這是 existence claim，只證明公開 norm-enforcement signal 存在，不推估其在黨內或支持者中的比例與強度。"

  - id: C007
    statement: "王世堅沒有被逐出政壇或民進黨，本身即可證明民進黨對大罷免異議具有高度容忍。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F002, F007]
    reasoning_notes: "survival != tolerance。要判斷體系容忍度，必須控制異議者的自主選票、地方組織、知名度、提名安全性、對黨資源依賴及懲罰成本；目前本 research 尚未完成這組政治生態基線。"

  - id: C008
    statement: "2025兩波31席罷免全數未通過，已足以證明所有參與者都否定大罷免的價值判斷。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F005, F009]
    reasoning_notes: "投票結果可證明罷免未通過，不能單獨還原每一位投票者或未投票者的動機，也不能直接區分程序反對、候選人評價、政黨認同與其他因素。"

  - id: C009
    statement: "民進黨從未在韓國戒嚴爭議後正式導正「支持戒嚴」的解讀。"
    status: contradicted
    supports: []
    contradicts: [F011]
    related_facts: []
    reasoning_notes: "民進黨團翌日明確否認支持戒嚴；較值得研究的問題是支持者生態中非常手段／內部敵人論述是否仍具有低羞恥成本，而不是抹除正式澄清。"

  - id: C010
    statement: "目前已足以證明民進黨支持者整體對敵我化、戒嚴或清除式政治沒有羞恥成本，並普遍給予正向獎勵。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F003, F007, F011]
    reasoning_notes: "現有資料可建立存在性案例、黨公職反應與組織行為，但不能由自然樣本推估整體支持者比例。後續需要代表性民調、系統抽樣、社群反應量化或可重複分類資料。"

