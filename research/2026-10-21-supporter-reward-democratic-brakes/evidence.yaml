    title: "以「檢察官不能給緩刑」「羈押期間本來可以抵刑期」回應翟本喬認罪誘因質疑之貼文"
    url: "https://www.threads.com/@thorhsu/post/Dex7H-Ugd1w"
    observed_at: "2026-10-22T12:07:51+08:00"
    retrieval_status: reachable
    notes:
      - "公開貼文以「不會Google、不會問AI、也不懂基本法學ABC的傳說中智商超過200的法盲」描述翟本喬，並列出兩點：『檢察官不能給緩刑，檢察官只能緩起訴，緩刑是法官的事』與『不用條件交換，羈押期間本來就可以抵刑期』。"
      - "此來源可證明發言內容、回應結構與人格／能力羞辱存在；不能單獨證明原始量刑交換推測為真，也不能單獨證明發言者的政黨認同、投票選擇或與任何政黨／機關存在指揮協調。"

  - id: S028
    source_type: commentary
