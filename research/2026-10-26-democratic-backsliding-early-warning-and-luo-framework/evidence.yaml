notes:
  - "本檔的公開核心不是『台灣已經到了最後時刻』，而是『完成態定性與早期防衛不可共用同一門檻』。"
  - "早期警戒只能合理支持相稱、低侵害、可逆且程序性的民主防衛，例如要求法源、紀錄、獨立覆核、透明度與同一標準；不能以未證實的威權風險反向授權禁言、搜索、剝奪參政權等高侵害措施。"
  - "羅世宏論述值得作為reference／claim source與hypothesis generator保存；不得因其學術身分或引用政治學文獻而降低個案證據門檻。"
