sources:
  - id: S001
    source_type: commentary
    publisher: "國立中正大學（轉載中天新聞網）"
    title: "解析「洋流」現象　羅世宏示警親和力背後潛在危機"
    url: "https://www.ccu.edu.tw/p/406-1000-96004%2Cr982.php?Lang=zh-tw"
    published_at: "2026-10-11"
    observed_at: "2026-10-26T10:54:36+08:00"
    retrieval_status: reachable
    notes:
      - "頁面整理羅世宏10月11日Facebook長文；本次未直接取得Facebook原始貼文URL，因此把此頁作為可重現的公開claim source，不升格為原始貼文primary source。"
      - "羅明確表示不應僅由外貌、學歷或親和力推定政治性質，並提出道德形象取消對手正當性、內部敵人建構、權力擴張免於法律問責、暴力道德化等檢驗方向。"
      - "羅同時保留條件：不能把所有防衛或守護敘事直接稱為類法西斯民粹，辨識仍須結合民族重生神話、政治組織、暴力實踐與對自由民主制度的態度。"

  - id: S002
    source_type: commentary
    publisher: "台灣中評網"
    title: "傳播學者分析洋流　用認知作戰對付台灣選民"
    url: "https://www.crntt.tw/doc/docDetailCreate.jsp?coluid=192&docid=160280510&kindid=0"
    published_at: "2026-10-21"
    observed_at: "2026-10-26T10:54:36+08:00"
    retrieval_status: reachable
    notes:
      - "頁面全文轉載／大段保存羅世宏10月20日「自主投票，何必言流？」論述。"
      - "羅把洋流的人設轉型、規模感營造、框架設定、情緒動員、重複曝光、群體認同等連結到認知作戰，並主張認知作戰技術已內化於民主選舉日常實踐。"

  - id: S003
    source_type: secondary
    publisher: "Journal of Democracy"
    title: "On Democratic Backsliding"
    url: "https://www.journalofdemocracy.org/articles/on-democratic-backsliding/"
    published_at: "2016-01"
    observed_at: "2026-10-26T10:54:36+08:00"
    retrieval_status: reachable
    notes:
      - "Nancy Bermeo把democratic backsliding界定為國家主導削弱或消除既有民主制度，並指出當代較常見形式包括executive aggrandizement與strategic electoral manipulation，而非只靠傳統政變。"
      - "文章指出當代倒退形式可能由民主制度本身賦予合法性，因此形式上的制度存在不能單獨排除倒退風險。"

  - id: S004
    source_type: secondary
    publisher: "V-Dem Institute"
    title: "Keeping the Democratic Façade: Contemporary Autocratization as a Game of Deception (Working Paper No. 75)"
    url: "https://www.v-dem.net/wp.html"
    published_at: "2018-08"
    observed_at: "2026-10-26T10:54:36+08:00"
    retrieval_status: reachable
    notes:
      - "V-Dem工作論文摘要指出當代autocratization常呈現民主屬性的漸進退化，並在legal façade之下發生。"
      - "該工作論文後續以'A Third Wave of Autocratization is Here: What is New About It?'發表於Democratization。"

  - id: S005
    source_type: secondary
    publisher: "V-Dem Institute"
    title: "Institutional Order in Episodes of Autocratization (Working Paper #133)"
    url: "https://www.v-dem.net/news/new-v-dem-working-paper-133/"
    published_at: "2022-10-10"
    observed_at: "2026-10-26T10:54:36+08:00"
    retrieval_status: reachable
    notes:
      - "研究69個1900至2021年的autocratization episodes，摘要指出制度衰退的一般順序先從horizontal accountability開始，其後是diagonal accountability，最後才是vertical accountability。"

  - id: S006
    source_type: secondary
    publisher: "Journal of Democracy"
    title: "The Anatomy of Democratic Backsliding"
    url: "https://www.journalofdemocracy.org/articles/the-anatomy-of-democratic-backsliding/"
    published_at: "2021-10"
    observed_at: "2026-10-26T10:54:36+08:00"
    retrieval_status: reachable
    notes:
      - "Haggard與Kaufman分析多國倒退案例，將polarization、執政者控制立法機關與incremental abuses列為核心機制；漸進式濫權會分裂並使反對力量失去共同反應節點。"

  - id: S007
    source_type: secondary
    publisher: "V-Dem Institute"
    title: "U-turns – The Hope for Democratic Resilience (Policy Brief No. 42)"
    url: "https://v-dem.net/media/publications/PB__42.pdf"
    published_at: "2025-01"
    observed_at: "2026-10-26T10:54:36+08:00"
    retrieval_status: reachable
    notes:
      - "V-Dem政策簡報彙整民主起源的autocratization episodes，指出一旦autocratization形成，約80%案例發生民主breakdown；同時指出積極、協調的民主防衛有助於U-turn，且在早期、約一個選舉週期內行動似乎尤其重要。"
      - "此為policy brief的跨國統計與政策推論，不能直接用來判定台灣目前已進入autocratization episode。"

facts:
  - id: F001
    statement: "民主倒退研究並不把『已經取消選舉、法院或國會』當成唯一辨識門檻；Bermeo指出當代倒退常透過行政權擴張與策略性選舉操弄等制度內方式發生，且可能由民主制度本身提供合法外觀。"
    status: verified
    observed_at: "2026-10-26T10:54:36+08:00"
    source_ids: [S003]
    evidence_summary: "Journal of Democracy文章摘要直接支持當代backsliding形式從傳統政變轉向較漸進、制度內且具有合法性的權力侵蝕。"
    tags: [democratic-backsliding, executive-aggrandizement, legal-legitimacy]

  - id: F002
    statement: "V-Dem研究將當代autocratization描述為民主屬性在legal façade下逐步退化，而非必然以一次性的制度廢除完成。"
    status: verified
    observed_at: "2026-10-26T10:54:36+08:00"
    source_ids: [S004]
    evidence_summary: "Working Paper No.75摘要明確描述gradual setbacks under a legal façade。"
    tags: [autocratization, legal-facade, gradualism]

  - id: F003
    statement: "V-Dem對1900至2021年69個autocratization episodes的制度順序研究指出，一般衰退模式先出現在horizontal accountability，其後才是diagonal與vertical accountability。"
    status: verified
    observed_at: "2026-10-26T10:54:36+08:00"
    source_ids: [S005]
    evidence_summary: "Working Paper #133摘要直接列出制度衰退的順序。"
    tags: [horizontal-accountability, institutional-sequence, early-warning]

  - id: F004
    statement: "Haggard與Kaufman把權力濫用的漸進性列為民主倒退的重要機制之一，並指出incremental abuses會分裂、迷惑反對力量。"
    status: verified
    observed_at: "2026-10-26T10:54:36+08:00"
    source_ids: [S006]
    evidence_summary: "Journal of Democracy文章摘要直接列出incremental nature of abuses of power及其對反對力量的效果。"
    tags: [incremental-abuse, opposition, backsliding]

  - id: F005
    statement: "V-Dem 2025政策簡報的跨國資料顯示，民主國家一旦進入autocratization episode，民主breakdown的比例很高；簡報並主張早期且協調的民主防衛，尤其在開始後約一個選舉週期內，對逆轉趨勢具有重要性。"
    status: verified
    observed_at: "2026-10-26T10:54:36+08:00"
    source_ids: [S007]
    evidence_summary: "Policy Brief No.42的Top-Level Insights直接列出約80% breakdown與早期行動的重要性。"
    verification_notes:
      - "這是跨國研究與政策簡報結論，不是台灣個案診斷，也不能推出某一具體政黨已進入威權化。"
    tags: [democratic-resilience, u-turn, early-action, policy-brief]

  - id: F006
    statement: "羅世宏的『類法西斯』論述並非單純由『沈伯洋受歡迎／有粉絲』推出法西斯；其公開論述明確把檢驗焦點放在道德形象是否取消對手正當性、內部敵人建構、權力擴張是否逃避法律問責，以及暴力是否被道德化。"
    status: verified
    observed_at: "2026-10-26T10:54:36+08:00"
    source_ids: [S001]
    evidence_summary: "中正大學公開頁面保存羅的四項檢驗框架及其限制條件，因此把其論點壓成『有粉絲＝法西斯』會遺漏核心論證。"
    tags: [羅世宏, 類法西斯, straw-man, internal-enemy, accountability]

  - id: F007
    statement: "羅世宏在另一篇洋流分析中，把人設轉型、框架設定、情緒動員、重複曝光與群體認同等競選操作連結到認知作戰，並主張認知作戰技術已內化於民主選舉的日常實踐。"
    status: verified
    observed_at: "2026-10-26T10:54:36+08:00"
    source_ids: [S002]
    evidence_summary: "公開轉載保存羅的認知作戰分類及其對洋流的應用。"
    tags: [羅世宏, 認知作戰, campaign, classification]

claims:
  - id: C001
    statement: "對民主倒退風險的『早期警戒／防衛門檻』與對特定政權作成『威權、法西斯或政治迫害』最終定性的證據門檻，應被分開處理。"
    status: supported
    supports: [F001, F002, F003, F004, F005]
    reasoning_notes: "文獻顯示倒退常漸進且先侵蝕制衡；若只在完成態才允許警戒，會把風險辨識門檻設定得晚於文獻所描述的早期變化。這不降低對『某政權已是法西斯／威權』等強事實命題的證據要求。"

  - id: C002
    statement: "『法院、國會、選舉仍存在』本身足以排除民主倒退或威權化風險。"
    status: contradicted
    contradicts: [F001, F002, F003]
    reasoning_notes: "當代backsliding/autocratization研究正是描述制度仍存在、具有合法外觀時逐步削弱其實質制衡能力的過程；形式存在可作反證之一，但不是充分條件。"

  - id: C003
    statement: "現有學術文獻與本研究所收材料，已足以判定台灣或民進黨政府目前正處於一個已成立的autocratization episode，或已構成法西斯政權。"
    status: unsupported
    related_facts: [F001, F002, F003, F004, F005]
    reasoning_notes: "本檔建立一般理論與警戒門檻，不進行台灣整體政體量化診斷。要完成個案定性仍需明確操作化指標、時間序列、跨國／跨政府baseline與對反證的處理。"

  - id: C004
    statement: "羅世宏的『類法西斯』框架可作為值得檢驗的政治學hypothesis／pattern-recognition工具，但不能因其有學術文獻backup，就把沈伯洋、洋流或民進黨直接升格為已證實的類法西斯／法西斯事實。"
    status: supported
    supports: [F006]
    related_facts: [F001, F002, F003, F004]
    reasoning_notes: "羅的框架提供『問什麼』與歷史類型比較；個案是否符合仍須逐項外部證據。這與politics-db『理論可決定查核方向、不能替代證據』的規則一致。"

  - id: C005
    statement: "羅世宏把洋流的框架設定、情緒動員、重複曝光與群體認同直接分類為『認知作戰』，目前已由其引用的技術相似性充分證明。"
    status: unresolved
    related_facts: [F007]
    reasoning_notes: "這些技術同時廣泛存在於普通競選、公關與政治傳播。若要把classification推到cognitive warfare，仍需提出足以區分一般persuasion的額外條件；本檔不預設其分類錯誤，但目前不能只靠技術重疊完成分類。"

  - id: C006
    statement: "在研究設計上，羅世宏的框架與politics-db既有公權力／民主煞車資料具有互補性：前者提供歷史與政治學的pattern hypothesis，後者應繼續獨立驗證敵人化、支持者獎勵、公權力handoff、程序auditability與基本權效果等具體節點。"
    status: supported
    supports: [F006]
    related_facts: [F001, F003, F004]
    reasoning_notes: "此claim是研究架構判斷，不宣稱兩套研究已在『民進黨是法西斯』的結論上收斂。後續應把理論一致性與個案證據獨立性分開。"

