  research:
    - "與 research/2026-10-20-public-authority-auditability-unfalsifiability/evidence.yaml 交叉：程序可審計性是早期制度風險的一個具體節點，不直接等同威權化。"
    - "與 research/2026-10-21-supporter-reward-democratic-brakes/evidence.yaml 交叉：民主負回饋與支持者獎勵可作為early-warning機制假說。"
