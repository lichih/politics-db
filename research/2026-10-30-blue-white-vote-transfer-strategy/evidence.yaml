facts:
  - id: F001
    statement: 年代民調中心三波新竹縣長民調中，徐欣瑩與鄭朝方差距由4月徐領先5.8個百分點，變為6月徐領先1.8個百分點，9月鄭領先6.4個百分點。
    status: reported
    source_ids: [S003]
  - id: F002
    statement: 2026年9月6日新竹縣藍白合作宣告破局；9月16至18日的年代民調時間在其後，但徐欣瑩在破局前4月至6月已下降。
    status: reported
    source_ids: [S003]
  - id: F003
    statement: 鄭朝方競辦委託之皮爾森10月非機率網路調查中，自認民眾黨支持者支持鄭朝方46.33%、徐欣瑩25.55%。
    status: reported
    source_ids: [S004, S005]
claims:
  - id: C001
    statement: 國民黨難以直接吸引的部分非藍非綠選民，可能被自主的民眾黨吸收，再透過可信的藍白合作參與執政聯盟。
    status: unresolved
    supports: []
    contradicts: []
    reasoning_notes: 有條件、異質性選民模型；不是所有白營選民都會投藍。
  - id: C002
    statement: 國民黨若損害藍白合作信用或第三勢力自主性，可能使原本透過合作保留的部分選票轉綠、棄投或流向其他選項；兩人對決下轉投對手對票差影響不同於棄投。
    status: unresolved
    supports: []
    contradicts: []
    reasoning_notes: 須以合作信任、投票史、候選人評價與轉移機率分群驗證。
  - id: C003
    statement: 藍白合作穩定時，王世堅個人吸引力與洋流跨陣營政治傳播對部分白營選民的邊際轉票效果可能較低。
    status: unresolved
    supports: []
    contradicts: []
    reasoning_notes: 王世堅及洋流為不同吸票路徑；對洋流的「認知作戰」定性另須證明。
  - id: C004
    statement: 國民黨限制地方跨黨助選或維護組織利益的收益，足以抵銷第三勢力合作信用流失的票數與長期聯盟成本。
    status: unresolved
    supports: []
    contradicts: []
    reasoning_notes: 反方必要的淨收益命題；現階段未有分群與淨效果數據支持。
  - id: C005
    statement: 國民黨已親手封死唯一重返中央執政的道路。
    status: unresolved
    supports: []
    contradicts: []
    reasoning_notes: 「唯一」為強命題，須納入不同選制、地區、候選人與替代聯盟配置。
