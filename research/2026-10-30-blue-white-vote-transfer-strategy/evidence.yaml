notes:
  - '核心風險：不要將現有民眾黨認同者、2022黃珊珊投票者、原偏藍白營、策略性支持藍白者混為單體。'
  - '反論失敗模式：只稱「其他原因也可能」卻沒有建構同樣有條件的競爭機制；用對己方有利的未知排除對方可能性。'
  - '真正可對抗的反方：證明國民黨維護地方組織的整體收益大於合作弱化成本；或合作穩定時相應選民轉綠率依然相近。'
  - '此檔先存論證問題與待查事項，不冒充已完成公開民調及原始聲明核查。'

  - '2026-10-30補充：年代民調三波趨勢及皮爾森白營交叉分析與合作成本假說方向相符，但前者跨期候選人組合有變、後者非機率網路調查且由一方競辦委託；均不證明9月6日破局導致選票轉移。'
  - '後續工作：取得年代三波原始問卷及交叉表，檢查不同版本候選人題組；取得皮爾森完整問卷及政黨認同分群樣本數，並對照其他委託方民調。'
