    title: "231萬餘則認知作戰爭議訊息、平台下架與司法警察查察答詢"
    url: "https://ivod.ly.gov.tw/Demand/Speech/167068"
    observed_at: "2026-10-23T02:17:00+08:00"
    retrieval_status: reachable
    notes:
      - "國安局官員稱2025年掌握231萬餘則認知作戰爭議訊息及4萬5千多筆假帳號，循專案機制通報並請平台下架；涉及其所稱「惡、假、害」時請調查局、刑事局查察。"

  - id: S004
    source_type: primary
