    observed_at: "2026-10-23T02:17:00+08:00"
    retrieval_status: reachable
    notes:
      - "蔡明彥稱國安局處理爭議訊息需達「國安層級」、不涉入選區候選人攻防；並列舉影響國家安全／社會秩序、傷害友盟合作或「誣衊我們的國家元首」等可能類型。"

