      - "蔡明彥稱鄭文燦相關外流影片案由檢調立案，國安局掌握散布源頭IP位於上海並提供檢調；蔡英文／羅致政錄音案第一時間移送調查局，趙天麟事件相關資訊也提供檢調。"
      - "這些案例包含對民進黨人物不利的內容，是單向工具化全稱假說的反向材料。"

  - id: S007
