    observed_at: "2026-10-23T02:17:00+08:00"
    retrieval_status: reachable
    notes:
      - "國安局官員稱異常帳號可能缺乏正常活動／互動、臨時註冊；爭議訊息包含與事實有出入且有其他帳號協力刻意炒作的內容。"
      - "掌握訊息後會通報、溯源；涉及違法事證時請司法警察機關依法偵處。"

  - id: S003
    source_type: primary
