promotion:
  cases: []
  comparators: []
  research: []

notes:
  - "研究式：partially-auditable national-security attribution × downstream coercive process = compounded democratic risk；這是architecture risk，不等於已證明malicious coordination。"
  - "下一步用matched cases比較政治方向不同但條件相近的訊息之國安歸因、揭露、移送、強制處分、終局結果與更正。"
  - "時間軸拆開：政治效果、偵查／強制作為、不起訴／裁判；後來不起訴不能抹除較早程序成本，較早搜索也不能預支有罪。"
