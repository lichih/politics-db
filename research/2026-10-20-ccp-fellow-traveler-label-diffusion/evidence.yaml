promotion:
  cases: []
  comparators: []
  research:
    - proposed: "political-identity-label-genealogy"
      rationale: "可後續擴充成跨詞彙比較：中共同路人、賣台、舔共、青鳥、小草、側翼等身份標籤如何從政治菁英／媒體框架進入社群日常分類。"

notes:
  - "本 research 的核心問題不是判斷所有被稱為『中共同路人』者是否無辜，而是拆分『具體中共協力證據』、『政治行為效果評價』與『身份標籤』三個不同層級。"
  - "媒體報導政治人物使用某標籤，可證明該語言被公開傳播；不能單靠報導存在推論媒體與政黨有指揮關係。"
  - "同一詞彙可能在不同使用者手上有不同門檻：有人要求直接協力／統戰證據，有人採客觀效果定義，也有人反對一概貼標。應保留這種異質性。"
  - "若要把 frame diffusion 升級成較強因果結論，優先尋找 paired evidence：同一帳號先長期接觸／轉發特定政治人物或媒體框架，後來在不提供個案證據時以相同詞彙與判定規則標記異議者。"
  - "若要討論『普遍性』或『洗腦』，需要代表性抽樣、語料時間序列、轉發網路或實驗／調查資料；大量同義留言本身不等於獨立證據。"
