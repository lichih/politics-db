facts:
  - id: F001
    statement: "現行《教育基本法》第6條要求教育中立，並禁止學校為特定政治團體從事宣傳或活動。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S001]
    evidence_summary: "法律直接設定校園政治中立與特定政治團體活動的禁止界線。"
    tags: [教育基本法, 政治中立, 校園]

  - id: F002
    statement: "現行法本來就要求各級學校推動全民國防教育；國中小正式課程由教育部編定補充教材並採融入式教學，國中小教學人員原則上由合格教師擔任。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "全民國防教育已有法定校園管道；正式國中小課程的教材與師資亦有既定制度規範。"
    verification_notes:
      - "既有制度來源只能證明管道原本存在，不能回答今日是否被新的政治目的重新使用。"
    tags: [全民國防教育, 國中小, 教材, 師資, baseline]

  - id: F003
    statement: "黑熊學院目前公開把「校園贈書」與「校園公益講座」列為公益行動，並持續提供親子及兒童民防活動。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S004]
    evidence_summary: "黑熊學院的公開業務明確包含校園與兒少教育觸角。"
    tags: [黑熊學院, 校園贈書, 校園講座, 兒少]

  - id: F004
    statement: "黑熊學院在2022募資計畫中已把「推動體制內民防教育」列為長程目標。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S005]
    evidence_summary: "這是黑熊學院早期公開目標，不是事後由外界推測出的教育制度化方向。"
    tags: [黑熊學院, 體制內民防教育, 長程目標]

  - id: F005
    statement: "黑熊學院共同製作的兒少讀物《KUMA黑熊學院少年防衛課》不只包含急救與避難，也包含戰爭、認知戰與敵我關係等政治安全認知內容。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S006, S007]
    evidence_summary: "出版社內容簡介與目錄直接列出認知戰、攻心、敵我關係等內容，並將本書定位為兒少民防與公民社會參與讀本。"
    tags: [少年防衛課, 認知戰, 敵我關係, 兒少讀物]

  - id: F006
    statement: "2024年臺北市官方「兒童閱讀優良媒材」評選把《KUMA黑熊學院少年防衛課》列入國小5至6年級推薦書單，官方公告稱評選結果供各小學閱讀相關課程運用。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S008, S009]
    evidence_summary: "官方公告與附件索引共同顯示該書已進入地方政府的國小閱讀推薦機制。"
    verification_notes:
      - "推薦書單 != 必修教材，也不證明每所學校都有採購或實際授課使用。"
      - "附件PDF本次直接開啟受阻，需保留此存取限制。"
    tags: ["2024", 臺北市, 國小, 推薦書單, 黑熊學院]

  - id: F007
    statement: "新北市立三重高中國中部的校內文件顯示，圖書館曾規劃把《KUMA黑熊學院少年防衛課》加入晨讀書箱，供導師選擇。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S010]
    evidence_summary: "校內工作報告的搜尋索引可直接讀到晨讀書箱規劃。"
    verification_notes:
      - "這是可選晨讀材料，不等於全校強制閱讀。"
      - "原PDF本次直接開啟失敗，需保留此存取限制。"
    tags: [新北市, 國中, 晨讀, 黑熊學院]

  - id: F008
    statement: "2023年桃園市大華國小校區曾協助家長辦理黑熊學院民防基礎課程，內容包括資訊戰與認知作戰，但招生明定年滿16歲，不能視為對國小學生授課。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S011]
    evidence_summary: "校園場地與校方協助確實存在，但受眾是成人／16歲以上，這是重要限制。"
    tags: ["2023", 桃園市, 校園場地, 成人課程, 黑熊學院]

  - id: F009
    statement: "2023至2024上述臺北、新北、桃園地方教育案例發生時，三地市長均為國民黨籍。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S014]
    evidence_summary: "2022地方選舉後，台北蔣萬安、新北侯友宜、桃園張善政均由國民黨執政。"
    tags: ["2022", 國民黨, 臺北市, 新北市, 桃園市, comparator]

  - id: F010
    statement: "中央內政體系曾公開澄清：警政署並未委託黑熊學院執行民防訓練，消防署韌性國家醫療整備訓練也沒有與黑熊學院合作。"
    status: verified
    observed_at: "2026-10-22T01:08:00+08:00"
    source_ids: [S012, S013]
    evidence_summary: "兩個中央機關正式澄清可作為反向證據，避免把所有政府韌性／民防政策都推定為黑熊承接。"
    tags: [內政部, 消防署, 黑熊學院, counterevidence, 政府合作]

claims:
  - id: C001
    statement: "黑熊學院及其兒少民防材料已實際進入部分K-12教育生態，包括地方政府推薦書單、校內晨讀材料規劃與校園活動。"
    status: supported
    supports: [F003, F006, F007, F008]
    contradicts: []
    related_facts: [F005]
    reasoning_notes: "這是institutional-entry的存在性結論；不同案例強度不同，推薦、可選晨讀與成人校園活動不可互相代換。"

  - id: C002
    statement: "目前已足以證明民進黨中央政府正在系統性命令、資助或強制K-12學校採用黑熊學院教材，把特定政黨版本的敵我政治灌入正式必修課程。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F002, F006, F007, F009, F010]
    reasoning_notes: "本輪未找到教育部或民進黨中央要求K-12強制採用黑熊教材的文件、採購或課綱依據；且目前最清楚的地方制度入口案例發生於國民黨執政城市。not_found不等於never_existed，後續仍可補查採購、補助與教育部函文。"

  - id: C003
    statement: "把目前觀察到的黑熊校園／兒少教育入口直接定性為「民進黨把過去黨國教育搬回校園」已超出現有證據。"
    status: supported
    supports: [F001, F002, F009, F010]
    contradicts: []
    related_facts: [F003, F004, F005, F006, F007]
    reasoning_notes: "現有事實證明教育入口與政治安全內容值得審查，但缺乏DPP中央控制、強制性、單一政黨忠誠灌輸等建立『黨國教育』定性的關鍵要件。"

  - id: C004
    statement: "黑熊學院公開追求「體制內民防教育」，且兒少材料含敵我關係與認知戰內容，因此即使其目的可由國防／民防正當性解釋，校園政治中立與教材邊界仍是合理的制度審查問題。"
    status: supported
    supports: [F001, F003, F004, F005, F006]
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "這個claim只說審查問題合理，不預設材料已違法、違反教育中立或構成政黨宣傳。"

  - id: C005
    statement: "目前可觀察到的黑熊教育材料進校現象，是民進黨執政縣市特有或由民進黨地方政府單一路線推動。"
    status: contradicted
    supports: []
    contradicts: [F006, F007, F008, F009]
    related_facts: []
    reasoning_notes: "臺北、新北、桃園的存在性案例都發生在國民黨市長任內，因此至少反證『只有民進黨地方執政才會導入』的強命題。這不回答中央政府是否另有不同管道。"

  - id: C006
