sources:
  - id: S001
    source_type: primary
    publisher: "全國法規資料庫"
    title: "教育基本法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=H0020045"
    observed_at: "2026-10-22T01:08:00+08:00"
    retrieval_status: reachable
    notes:
      - "第6條明定教育應本中立原則；學校不得為特定政治團體從事宣傳或活動，主管教育行政機關及學校不得強迫師生參加任何政治團體或活動。"

  - id: S002
    source_type: primary
    publisher: "全國法規資料庫"
    title: "全民國防教育法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=F0080014"
    published_at: "2005-02-02"
    observed_at: "2026-10-22T01:08:00+08:00"
    retrieval_status: reachable
    notes:
      - "第5條將學校教育列為全民國防教育範圍；第7條要求各級學校推動全民國防教育，並視實際需要納入課程。"

  - id: S003
    source_type: primary
    publisher: "全國法規資料庫"
    title: "各級學校全民國防教育課程內容及實施辦法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=H0140016"
    published_at: "2020-06-22"
    observed_at: "2026-10-22T01:08:00+08:00"
    retrieval_status: reachable
    notes:
      - "第6條規定國中小由教育部編定全民國防教育補充教材，學校採融入式教學。"
      - "第8條允許學校成立社團、辦理課外研習或參訪。"
      - "第10條規定國中小全民國防教育人員原則上由該教育階段合格教師擔任，師資不足時得由教育部認可之軍訓教官協助。"
      - "第13條要求教育主管機關每2至4年視導所屬學校推動情況。"

  - id: S004
    source_type: primary
    publisher: "黑熊學院"
    title: "黑熊學院首頁"
    url: "https://kuma-academy.org/"
    observed_at: "2026-10-22T01:08:00+08:00"
    retrieval_status: reachable
    notes:
      - "官方列出的公益行動包含「校園贈書」與「校園公益講座」，另有親子民防活動及兒童民防安全營。"
      - "官方將自身描述為民防教育組織，並以軍事、民防資訊與免於資訊操弄為知識推廣內容。"

  - id: S005
    source_type: primary
    publisher: "黑熊學院 / 嘖嘖"
    title: "戰爭來臨前做好最壞的打算｜黑熊學院 民間防衛訓練計畫"
    url: "https://www.zeczec.com/projects/kuma-acadamy"
    published_at: "2022-06-28"
    observed_at: "2026-10-22T01:08:00+08:00"
