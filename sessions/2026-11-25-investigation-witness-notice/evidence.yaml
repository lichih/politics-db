facts:
  - id: F001
    statement: "黃國昌於2026年11月25日公開指稱一名志工的證人通知書在當日發文、應到時間為當日上午8時30分且未載明待證事由，調查官至住處要求同行。"
    status: verified
    observed_at: "2026-11-25T14:15:00+08:00"
    source_ids: [S001]
    evidence_summary: "已證實黃國昌公開提出上述指控並表示接受委任；尚未取得通知書正本、現場錄影或調查局個案回覆。"
    verification_notes:
      - "不能把當事人轉述直接標為調查官行為已確定發生。"
  - id: F002
    statement: "刑訴法第196條之1允許司法警察官或司法警察使用通知書通知證人到場詢問，並準用第175條之證人通知規則。"
    status: verified
    observed_at: "2026-11-25T14:15:00+08:00"
    source_ids: [S002, S004]
    evidence_summary: "法律授權通知證人，與具備強制拘提、帶走證人的權力並非同一回事。"
  - id: F003
    statement: "刑訴法第175條規定證人通知應記載待證事由，且原則上最遲於應到時間24小時前送達；有急迫情形者不受24小時限制。"
    status: verified
    observed_at: "2026-11-25T14:15:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "是否具急迫事由需要個案紀錄驗證；急迫例外不等於免除全部其他必要記載。"
claims:
  - id: C001
    statement: "本案調查官已經違法強制帶走證人。"
    status: unresolved
    related_facts: [F001, F002, F003]
    reasoning_notes: "尚未取得實際通知書、到場交涉紀錄、是否發生強制同行與法律處分依據。"
  - id: C002
    statement: "通知書發文當天要求到場，一律違反24小時規定。"
    status: contradicted
    contradicts: [F003]
    reasoning_notes: "第175條設有急迫情形例外，且發文日期與實際送達時間是不同事實。"
  - id: C003
    statement: "民進黨政府為選舉目的指示調查局針對志工。"
    status: unresolved
    related_facts: [F001]
    reasoning_notes: "政治目的或指示尚無直接佐證；選前三天是重要時間背景而非指示的證明。"
  - id: C004
    statement: "調查局有義務對通知方式、待證事由、急迫性及強制同行指控提出可核對的程序說明。"
    status: supported
    supports: [F002, F003]
    reasoning_notes: "制度問責與公權力行為查核的合理要求；不預設調查機關已違法。"
