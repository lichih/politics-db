notes:
  - "人工編碼版本v1；單一評閱者；每一則僅一主要類型。A=制度法源錯置；T=替代議題或轉題；C=人物陣營攻擊與嘲諷；D=簡短應援／情緒／價值表態；E=貼圖不可評。相近類別互有灰區，數量須與下列comment_ids一併使用。"
  - "核心命中判準：不要求長文或當場附完整事證；若短句能正確指向原始主張必要前提、提出有實際反證力的事實或有效因果挑戰，即視為命中。不因只有一句便否定。"
  - "這份樣本的最強候選反例為A類2則；檢驗後，『立委不能編預算』與『老人健保補助的地方法源』未能推翻國民年金新增給付須先修法的法律條件，也未證明賴清德的具體歸責。"
  - "先檢驗最接近核心的候選反例，再對其餘留言分類與計數；不預設政治立場或把反方支持者的有無證據和原指控者舉證責任混淆。"
  - "與此前對話中的19/15/11/2推估不同，此版重新對47個ID逐則編碼後修正為A2/T13/C17/D13/E2；原先未附逐項ID的數字不得作正式基準。"
