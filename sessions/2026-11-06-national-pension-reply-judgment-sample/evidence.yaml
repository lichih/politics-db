    reasoning_notes: "這是研究者以明定判準對擷取材料逐則人工編碼的結果，非外部已驗證的客觀心理指標；0/45可判讀文字、0/47全體可見留言（含2則無法判讀者）；後者不能寫成47則全都已確定不命中。短句不因未附證據自動失分，重點是有否指向當前論證必要前提、證據或因果。"
  - id: C002
    statement: "依使用者提出的『腦外借型回應』操作定義，45則文字回應可歸為在此場景未展示命中核心的回應；2則貼圖無足夠可判讀訊息，須另列不可評。"
    status: supported
    supports: [F001, F002]
    contradicts: []
    related_facts: [F003]
    reasoning_notes: "依研究用語，外部知識被記憶或濃縮並不構成腦外借；重要是能否選出適合當前爭點的知識。類別：A制度錯置2、T轉題13、C人物陣營攻擊17、D表態情緒13、E不可評2。可判讀45則的核心命中率為0/45=0%；『未展示核心命中』45/47=95.7%，另2/47=4.3%不可評。此為行為／回應評價，不能推定個人的一般智識或是否實際讀過資料。"
  - id: C003
    statement: "這一份可見截面可用於描述此串回應型態及回饋，不能代表黃國昌或賴清德全體支持者的論述能力與比例。"
