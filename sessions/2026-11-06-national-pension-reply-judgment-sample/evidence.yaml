claims:
  - id: C001
    statement: "在反對或質疑黃國昌的12則可見回應中，沒有對國民年金新給付法源或總統對在野黨具體預算歸責提出有效直接反論；舊版把全部47則當作反論分母的0/47表示法不應再使用。"
    status: supported
    supports: [F001, F002, F006, F007]
    contradicts: []
    related_facts: [F004, F005, F008]
    reasoning_notes: "反對方向最接近制度攻防的兩則提及立委不能編預算與另案老人健保補助法源，經既有研究判為不適用於國民年金新給付的修法必要條件及總統具體歸責。採方向分層後直接反論命中率為0/12，而非0/47。另一則反對方向『去告啦』觸及造謠指控的法律究責途徑，屬相關短論述而不是對本案法源的直接反證。支持方向有無有效補強需對稱檢驗，但純應援4則不應被要求再次重證原貼文。"

  - id: C002
    statement: "初版v1.1『全部47則腦外借、0則命中核心』是把有效直接反證、相關短論述與情緒表態混成單一指標；此全面性結論已被v2反例校正。"
    status: contradicted
    supports: [F001, F002]
    contradicts: [F004]
    related_facts: [F003, F005]
    reasoning_notes: "舊版A2/T13/C17/D13/E2是當時的編碼，不能繼續解讀為全部47則都沒有任何相關論點。確認3則至少具有與本案治理、政治言論責任相關的短論述，不能因欠缺完整事證就排除。其餘44則仍未提供足以從既有檢驗中辨識之實質政策／法律／因果主張。保留舊主張並以contradicted記錄修正，不事後抹去。"

  - id: C003
    statement: "這一份可見截面可用於描述此串回應型態及回饋，不能代表黃國昌或賴清德全體支持者的論述能力與比例。"
    status: supported
    supports: [F001, F003]
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "無取樣框、未包括未顯示留言或沉默讀者，且可見回應混有不同政治立場與同一人重複留言；不能據此推論某政黨支持者人口母體比例或政治人物行為的因果。"

  - id: C004
    statement: "v2曾認定47則回應中只有3則相關短論述候選（6.4%），其餘44則未呈現此層次；v3發現漏掉一則反對方有關法律究責途徑的短論述，此統計已被修正。"
    status: contradicted
    supports: [F001, F004, F005]
    contradicts: []
    related_facts: [F002, F003]
    reasoning_notes: "這是v2已被更正的統計。v3進一步將帶嘲諷的『去告啦，不要躲在臉書汪汪叫』辨識為對黃國昌造謠指控的究責途徑挑戰；v2不應因語氣直接歸為轉題。v3分類改成R4/A2/T10/C17/D12/E2。原來三則支持方向論點仍在R類，並未被改成『不適用』。

  - id: C005
    statement: "方向分層保留全部47則，其中支持／呼應23則有3則相關短論述、反對／質疑12則有1則、方向不明12則有0則；另有支持方4則純應援不算論證失敗，排除後受檢回應43則，其中相關短論述4則（9.3%）。"
    status: supported
    supports: [F001, F006, F007]
    contradicts: []
    related_facts: [F002, F004]
    reasoning_notes: "這個有效短論述指標在正反方向採同一把尺：有可辨識且尚未被證明無關的補強、質疑、類比、制度延伸或因果提問即算；四則都不是已證實整體正確的結論。單純表示支持不是嘗試完成第二個論證，依F008四則S類不納入論證失敗分母。方向性觀察仍為P23/O12/U12，R占P3/23=13.0%、O1/12=8.3%描述比例；論證適用分母則為P19/O12/U12，R占P3/19=15.8%、O1/12=8.3%、U0/12=0%，總計4/43=9.3%；未展現新相關論述者39/43不得自動全稱為人格/理解力缺陷。此特例不是為同陣營人身攻擊或轉題提供免檢。每則保留原方向、主類別、reply target供追溯。"
  - id: C006
    statement: "狹義『命中國民年金新給付法源與賴清德對預算在野黨的具體歸責』採正反雙向對稱檢驗：支持方是否提供有針對性的補強、反對方是否提供有針對性的質疑；不能以『支持方不適用』或單看反論成功取代對支持論證的檢查。"
    status: supported
    supports: [F002, F004, F006, F007]
    contradicts: []
    related_facts: [F005]
    reasoning_notes: "四則相關短論述都切到政治協調、總統言論責任、治理防範或控告途徑。這與直接補強或推翻『5,000元新給付須修法』或『在野黨不審預算導致未發放』的法源及因果判斷不是同一項測量。不得把支持方的廣義延伸計為『完成法源補強』，卻要求反對方直接擊倒法源才算有效；若使用直接核心論證的計數，正反應各自依支持／質疑功能評分。原有反對方兩則制度錯置的檢驗仍成立，不能從0／12直接推出所有反對者整體論證能力。"

  - id: C007
    statement: "支持者單純支持屬論證參與的特例，不能被當作論證失敗；剔除4則純支持後，論證品質之受檢分母為43則（P19/O12/U12），其中可辨識相關短論述為4則（P3/O1/U0）。"
    status: supported
    supports: [F001, F006, F007, F008]
    contradicts: []
    related_facts: [F003, F004]
    reasoning_notes: "在公共討論中，認同已有論據的貼文本身無須再次證明原論點；『加油』和『你錯了、因為...』的論述功能不同。應援仍對研究Reward有意義；不能歸入判斷力失敗。相對地，即便方向是支持，若另提出人身指控、虛假比較、離題反擊，仍受適用性判準評估；反對方向同樣用有效短論述而非完整版論證檢驗。研究仍屬單篇可見留言的人工分層，不能推廣至所有支持者或作者。"

