claims:
  - id: C001
    statement: "採狹義『直接反證國民年金新增給付法源或總統具體預算歸責因果』標準，本次可見47則回應中無一則完成有效反證；不能將此0/47當成沒有任何相關短論述。"
    status: supported
    supports: [F001, F002]
    contradicts: []
    related_facts: [F004, F005]
    reasoning_notes: "兩則最接近反方制度攻防的留言，談立委不能編預算及另一項老人健保補助法源，均未推翻本案修法前提或補足賴清德的具體歸責因果。但是其他留言有關行政協調、總統言論責任與如何防止造謠的短論述，應另外用寬義關聯性判準計數。"

  - id: C002
    statement: "初版v1.1『全部47則腦外借、0則命中核心』是把有效直接反證、相關短論述與情緒表態混成單一指標；此全面性結論已被v2反例校正。"
    status: contradicted
    supports: [F001, F002]
    contradicts: [F004]
    related_facts: [F003, F005]
    reasoning_notes: "舊版A2/T13/C17/D13/E2是當時的編碼，不能繼續解讀為全部47則都沒有任何相關論點。確認3則至少具有與本案治理、政治言論責任相關的短論述，不能因欠缺完整事證就排除。其餘44則仍未提供足以從既有檢驗中辨識之實質政策／法律／因果主張。保留舊主張並以contradicted記錄修正，不事後抹去。"

  - id: C003
    statement: "這一份可見截面可用於描述此串回應型態及回饋，不能代表黃國昌或賴清德全體支持者的論述能力與比例。"
    status: supported
    supports: [F001, F003]
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "無取樣框、未包括未顯示留言或沉默讀者，且可見回應混有不同政治立場與同一人重複留言；不能據此推論某政黨支持者人口母體比例或政治人物行為的因果。"

  - id: C004
    statement: "採寬義『可辨識的命題且尚未證明與本案公共責任議題無關』標準，47則回應中有3則相關短論述候選（6.4%），其餘44則未展現此層次（93.6%）。"
    status: supported
    supports: [F001, F004, F005]
    contradicts: []
    related_facts: [F002, F003]
    reasoning_notes: "v2類型R3、A2、T11、C17、D12、E2，合計47，互斥且每ID恰一次。R包括Shen Ming行政協調比較、總統言論豁免權/究責機制、政治造謠的制度防範問句；其中只有第一則具體涉及對在野黨歸責，其餘兩則是對原貼文『造謠／道歉』的政策或責任延伸。這3則都不是已被證實正確或完成原法源反證。"

