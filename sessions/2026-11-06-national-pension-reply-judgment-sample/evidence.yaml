notes:
  - "初版已被v2更正：人工編碼版本v1.1；單一評閱者；每一則僅一主要類型。A=制度法源錯置；T=替代議題或轉題；C=人物陣營攻擊與嘲諷；D=簡短應援／情緒／價值表態；E=純貼圖／GIF（直接計入腦外借）。相近類別互有灰區，數量須與下列comment_ids一併使用。"
