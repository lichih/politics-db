notes:
  - "本樣本與同日黃國昌Facebook 265則留言是兩個不同的非隨機可見討論串，母體不混算。"
  - "主帖中借款1400萬元的存在和後續入股時序是值得認真監督的事實線索；把這段時間線直接標成『海撈』『搬走』則跨越現有證據，不能為了立場忽略。"
  - "兩則回覆的主要言語行為分別是對司法的負面評價與引用公帑遭食用意象的附和諷刺；不將文字短或沒有財務計算當作評價缺失，而只標示有無新增交易事證。"
  - "保留同一標準：既不因政治人物具關係人身分就自動推定違法，也不因其對家族借款或政府補助回應稱合法就終結原始金流與利衝程序查核。"
