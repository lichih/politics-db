claims:
  - id: C001
    statement: "蘇巧純2010年創業發生在蘇家尚未累積顯著政治資本之前，因此可作為排除家族政治資本影響的自然baseline。"
    status: contradicted
    contradicts: [F001, F002]
    reasoning_notes: "2010年前蘇貞昌已從政多年，並已任地方首長、中央黨政要職及行政院長；因此2010不能視為政治資本尚未出現的pre-treatment時點。"

  - id: C002
    statement: "自至少2010年代起，蘇家政治資本、家族企業／法人、競選商業往來、政府採購及政府／公股資金之間存在長期且反覆的可觀察交會，可作為政商關係的結構性研究對象。"
    status: supported
    supports: [F001, F002, F003, F004, F005, F006, F007, F008, F009, F011, F012, F013, F014]
    reasoning_notes: "此處『政商關係』採描述性定義：政治權力／政治活動與商業、組織及資本活動長期交會。它不等同犯罪、圖利或每筆交易均有特權。"

  - id: C003
    statement: "二三設計只要參與政府採購就一定得標，或其政府標案可由蘇家政治背景充分解釋。"
    status: unsupported
    related_facts: [F003]
    reasoning_notes: "現有採購索引顯示同時有得標與未得標紀錄；此外部分案件跨不同政黨執政地方政府。政治背景可能是研究變項，但不能以存在政治關係直接解釋每一筆得標。"

  - id: C004
    statement: "蘇家政治權力曾直接或不當介入二三設計、曠世智能的特定政府採購、補助或投資決策。"
    status: unresolved
    related_facts: [F004, F011, F012, F013, F014]
    reasoning_notes: "現有資料建立利益衝突與長期交會結構，但尚缺個案指示、關說、評選例外、金流、決策紀錄或其他足以連結政治權力與特定結果的直接證據。"

  - id: C005
    statement: "蘇貞昌與詹秀齡2021年合計800萬元家庭借款被蘇巧純用於取得或增加曠世智能股份。"
    status: unresolved
    related_facts: [F008, F009, F010]
    reasoning_notes: "借款、加入董事與持股增加在時間上接近，但目前沒有資金流向或認購文件可建立用途；時間相關不能代替金流證據。"

  - id: C006
    statement: "二三設計參與2022年桃園總圖互動多媒體項目，本身已足以證明違法轉包或桃園市政府直接指定二三設計。"
    status: unresolved
    related_facts: [F011, F012]
    reasoning_notes: "桃園市府primary主張原承包商自行尋找合作團隊且屬合法分包；外界另有指定／協調質疑。尚缺原始會議紀錄、下游契約與完整決策鏈，不能把爭議直接定性為違法或指定。"

  - id: C007
    statement: "2020年二三設計『不再投標任何層級政府標案』的自我限制，字面上也禁止公司作為主承包商下游廠商參與政府出資工程。"
    status: unsupported
    related_facts: [F004, F011, F012]
    reasoning_notes: "2022立院答辯顯示蘇貞昌採『是否直接投標政府標案』解釋承諾邊界。是否違反承諾精神屬政治評價，但不能把字面承諾自行擴張成明文禁止所有下游履約。"

  - id: C008
    statement: "共同地址、家族法人董事關係或親屬關係本身，即足以證明家族企業間存在控制、利益輸送或不當交易。"
    status: unsupported
    related_facts: [F006, F007, F009]
    reasoning_notes: "組織與地址重疊可建立網絡與查核線索，但控制關係、交易或利益輸送仍需股權、契約、金流、董事決策或其他直接證據。"

  - id: C009
    statement: "蘇巧純具有真實專業能力、私人客戶或曾在不同政黨執政政府得標，就足以排除政商關係或利益衝突查核的必要。"
    status: unsupported
    related_facts: [F003, F004, F013]
    reasoning_notes: "專業能力與政商交會可以同時存在；前者可反駁『完全無能力、純靠關係』，不能反駁政治資本與商業資本長期交會的結構性命題。"

