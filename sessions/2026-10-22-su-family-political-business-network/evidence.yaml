    reasoning_notes: "組織與地址重疊可建立網絡與查核線索，但控制關係、交易或利益輸送仍需股權、契約、金流、董事決策或其他直接證據。"

  - id: C009
    statement: "蘇巧純具有真實專業能力、私人客戶或曾在不同政黨執政政府得標，就足以排除政商關係或利益衝突查核的必要。"
    status: unsupported
    related_facts: [F003, F004, F013]
    reasoning_notes: "專業能力與政商交會可以同時存在；前者可反駁『完全無能力、純靠關係』，不能反駁政治資本與商業資本長期交會的結構性命題。"

  - id: C010
    statement: "二三設計的直接政府得標金額隨蘇貞昌政治權力提升而呈持續、單調成長。"
    status: contradicted
    contradicts: [F015, F016]
    reasoning_notes: "目前可辨識的直接競爭性得標為2013、2016、2019、2020四次；金額在2019達高點後2020下降，且2017至2018曾連續未得標。現有序列不支持『單調成長』。這不回答是否存在政治資本影響，只排除過度簡化的曲線敘事。"

  - id: C011
    statement: "2021至2023年未見二三設計直接政府投標，因此可據此排除該期間家族商業活動與政府資源的利益衝突或政商交會。"
    status: contradicted
    contradicts: [F011, F012, F013, F015]
    reasoning_notes: "直接投標只是政府資源交會的一種形式；2022桃園總圖顯示二三設計可作為主承包商下游合作團隊參與政府出資工程，另有曠世智能接受國發基金投資。故研究上應分別繪製『直接政府採購』與『政府資金／履約實質參與』兩條序列。"

  - id: C012
    statement: "『上癮的科學』案是蘇貞昌就任行政院長後，利用院長職權影響科教館評選，使二三設計得標。"
    status: contradicted
    contradicts: [F017]
    reasoning_notes: "科教館primary明載評選於2018-12-21完成，蘇貞昌2019-01-14才就任；因此『就任後以院長職權影響該次評選』在時間上不成立。此反證不排除更廣義的既有政治資本或評選當日組閣傳聞假說。"

  - id: C013
    statement: "科教館2018年12月21日評選完成時，外界尚完全沒有蘇貞昌可能組閣的公開訊息，因此評委不可能接觸到相關傳聞。"
    status: unresolved
    related_facts: [F017, F018]
    reasoning_notes: "中央社同日晚間已有組閣傳聞報導，但目前沒有評選完成精確時刻，無法證明報導／傳聞在評選前或評選後。不能把『同日』自行排成有利於任何一方的時序。"

  - id: C014
    statement: "曠世智能2024年SIIR補助可直接證明蘇貞昌在行政院長任內讓其關係人取得經濟部補助。"
    status: contradicted
    contradicts: [F021]
    reasoning_notes: "補助核准與執行均在蘇貞昌2023-01-31卸任後；因此不能作為其『行政院長任內』利益衝突的證據。若要研究卸任後政治資本或長期網絡影響，屬另一個需獨立舉證的命題。"

  - id: C015
    statement: "二三設計2020年新竹市政府6,998,250元得標，本身已足以證明蘇貞昌或中央政府不當介入地方政府評選。"
    status: unresolved
    related_facts: [F019]
    reasoning_notes: "本案確實發生於蘇貞昌任行政院長期間，也存在客觀親屬與政治權力背景；但現有資料同時顯示有4家合格競爭者、採公開評選。尚缺評選分數、委員關係、中央補助與個案決策鏈等資料，不能由結果本身直接推論介入。"

  - id: C016
    statement: "二三設計在2020選舉政治獻金會計報告中承接的支出規模約為766萬元，只是媒體轉述、沒有可重建的公開資料基礎。"
    status: contradicted
    contradicts: [F020]
    reasoning_notes: "監察院平台資料之公開GitHub鏡像可依二三設計統編25111904重建2020總額7,660,210元。候選人別的586萬／180萬拆分仍待官方逐筆明細複核，但『約766萬元總量完全無資料基礎』已不成立。"

  - id: C017
    statement: "2020年新竹市政府約700萬元標案本身就是蘇貞昌任行政院長後核給新竹市的中央補助款，再由地方政府直接發包給其女兒公司。"
    status: contradicted
    contradicts: [F023]
    reasoning_notes: "採購公告資料欄位列『是否受機關補助：否』，因此現有紀錄不支持把一般中央對新竹市補助與本案資金來源直接畫成同一筆。這不排除更廣義的中央—地方政治影響假說，但該假說必須另以評選／決策證據證明。"

