promotion:
  research:
    - "蘇家政治資本與家族商業／組織資本的長期交會網絡"
    - "政治人物近親企業之政府採購、公股投資與利益衝突baseline比較"
  cases: []
  comparators: []

notes:
  - "本session的核心不是『有錢即有罪』，而是先建立家族政治、專業、商業與資本形成時間線，再檢驗政府資源交會是否出現超出一般baseline的異常。"
  - "『政商關係』在此採描述性、結構性用法：政治活動／權力位置與商業、資本、法人、政府資源長期交會；不自動等於貪污、圖利、關說或犯罪。"
  - "重要反方／baseline：二三設計有未得標紀錄，且存在專業能力與非單一政治陣營之政府客戶；這些資料限制『每筆都是靠關係』的強主張，但不能用來否定長期政治－商業交會網絡本身。"
  - "得標成長曲線應至少同時看年度投標件數、競爭性得標件數、勝率、年度得標金額、平均案額及發標機關／執政背景；不能把契約變更重複當作新勝標。"
  - "2020自我限制後，單看直接投標曲線會系統性漏掉下游分包、政府投資、補助等公共資源交會，因此研究上另需建立『政府資金／公共工程實質參與曲線』。"
  - "利益衝突研究中的責任分配應避免兩種不可證偽：外部不能只憑猜測要求當事人證明所有負面命題不存在；但當客觀利益衝突結構已成立、關鍵程序資料又由當事人或政府獨占時，拒絕提出可解除疑慮的資料也不能再反過來作為『沒有證據所以沒問題』的理由。"
  - "下一步高價值證據：監察院政治獻金逐筆資料；政府電子採購網逐案原始公告；桃園總圖原始會議紀錄與分包契約；2021家庭借款用途與曠世持股取得金流；國發基金與臺企銀投資審議／迴避文件。"
  - "可證偽性控制：若primary時間線能直接排除特定指控，必須主動降低／移除該質疑；但反證範圍只到它實際能證明的命題，不能把『評選早於就任』擴張成『所有政治影響皆不可能』。"
  - "目前直接採購曲線的高辨識力節點應重分類：2019科教館案雖於2019公告決標，但核心評選完成於2018-12-21，不能當作蘇貞昌2019-2023院長任期內的評選勝標；2020新竹案才是目前最清楚的任內直接競爭性得標。"
  - "2024 SIIR 120萬元補助應從『蘇貞昌任內利益衝突』疑點中排除；若仍研究其意義，只能作為卸任後長期政治資本／政府資源交會的另一假說，需另找證據。"
  - "政治獻金資料目前可確認二三設計2020總量7,660,210元，但蘇巧慧與蔡英文的精確拆分仍維持partial，避免用媒體數字冒充直接官方逐筆資料。"
  - "新竹案資金來源方法邊界：『新竹市整體接受中央補助』不能自動推出『二三設計這筆標案由中央補助支應』；現有採購欄位反而列本案不受機關補助。若質疑政治影響，應轉向評選與決策鏈，而不是混同一般中央補助與特定標案資金來源。"
  - "相關單案：sessions/2026-10-22-kuangshi-public-investment/evidence.yaml。"
