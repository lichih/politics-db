claims:
  - id: C001
    statement: "蘇巧純2010年創業發生在蘇家尚未累積顯著政治資本之前，因此可作為排除家族政治資本影響的自然baseline。"
    status: contradicted
    contradicts: [F001, F002]
    reasoning_notes: "2010年前蘇貞昌已從政多年，並已任地方首長、中央黨政要職及行政院長；因此2010不能視為政治資本尚未出現的pre-treatment時點。"

  - id: C002
    statement: "自至少2010年代起，蘇家政治資本、家族企業／法人、競選商業往來、政府採購及政府／公股資金之間存在長期且反覆的可觀察交會，可作為政商關係的結構性研究對象。"
    status: supported
    supports: [F001, F002, F003, F004, F005, F006, F007, F008, F009, F011, F012, F013, F014]
    reasoning_notes: "此處『政商關係』採描述性定義：政治權力／政治活動與商業、組織及資本活動長期交會。它不等同犯罪、圖利或每筆交易均有特權。"

  - id: C003
    statement: "二三設計只要參與政府採購就一定得標，或其政府標案可由蘇家政治背景充分解釋。"
    status: unsupported
    related_facts: [F003]
    reasoning_notes: "現有採購索引顯示同時有得標與未得標紀錄；此外部分案件跨不同政黨執政地方政府。政治背景可能是研究變項，但不能以存在政治關係直接解釋每一筆得標。"

  - id: C004
    statement: "蘇家政治權力曾直接或不當介入二三設計、曠世智能的特定政府採購、補助或投資決策。"
    status: unresolved
    related_facts: [F004, F011, F012, F013, F014]
    reasoning_notes: "現有資料建立利益衝突與長期交會結構，但尚缺個案指示、關說、評選例外、金流、決策紀錄或其他足以連結政治權力與特定結果的直接證據。"

  - id: C005
    statement: "蘇貞昌與詹秀齡2021年合計800萬元家庭借款被蘇巧純用於取得或增加曠世智能股份。"
    status: unresolved
