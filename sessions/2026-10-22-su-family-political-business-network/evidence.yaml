facts:
  - id: F001
    statement: "在蘇巧純2010年成立二三設計以前，蘇貞昌已歷任省議員、屏東縣長、民進黨秘書長、立法委員、臺北縣長、總統府秘書長、民進黨主席，並於2006至2007年第一次擔任行政院長。"
    status: verified
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S001, S002, S003]
    evidence_summary: "總統府與行政院primary直接確認蘇貞昌的政治資本在2010年前已高度成熟，因此2010不能作為『家族尚無政治資本』的自然baseline。"
    tags: [政治生涯, 時間線, pre-treatment, 政治資本]

  - id: F002
    statement: "二三設計有限公司於2010年3月成立，代表人為蘇巧純；2016年公司地址變更至臺北市中山區南京東路2段160號10樓。"
    status: verified
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S004]
    evidence_summary: "經濟部公司登記可直接確認設立、代表人、資本額與地址沿革。"
    tags: [二三設計, 蘇巧純, 公司沿革]

  - id: F003
    statement: "第三方政府採購索引彙整顯示，二三設計至少參與11件政府採購，得標5件、未得標6件，得標總額約2,271.9萬元。"
    status: partial
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S005]
    evidence_summary: "資料可作baseline：二三設計不是『參與即必得標』；但因來源為第三方彙整，個別案與完整期間仍應回官方政府電子採購網核對。"
    tags: [政府採購, 二三設計, baseline, 得標, 未得標]

  - id: F004
    statement: "2020年7月，二三設計公開表示在蘇貞昌擔任行政院長期間，不再投標任何層級政府標案。"
    status: verified
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S006, S007]
    evidence_summary: "中央社與公視同期報導一致記錄該自我限制；此事本身反映當事人亦承認父親任行政院長期間政府採購存在利益衝突或觀感風險，需要額外邊界管理。"
    tags: [利益衝突, 自我迴避, 二三設計, 政府採購]

  - id: F005
    statement: "2020年公開政治獻金資料經媒體整理，二三設計曾承接蘇巧慧競選相關支出約580萬元及蔡英文競選相關支出約180萬元。"
    status: partial
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S007]
    evidence_summary: "公視明確指稱資料來自監察院政治獻金公開平台，但本輪尚未直接取回監察院逐筆廠商明細，因此保留partial。"
    tags: [政治獻金, 競選支出, 二三設計, 蘇巧慧, 蔡英文]

  - id: F006
    statement: "2021年超越文創教育基金會法人登記列詹秀齡為董事長、蘇巧純為董事，顯示蘇家成員同時存在於一個家族／政治公共活動相關法人治理結構中。"
    status: verified
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S008]
    evidence_summary: "司法院法人登記公告直接確認董事名單；董事關係本身不證明基金會與家族企業間有不當交易。"
    tags: [超越基金會, 詹秀齡, 蘇巧純, 組織網絡]

  - id: F007
    statement: "蘇巧純於2020年6月11日另設二三無限整合行銷有限公司，資本額100萬元，地址為南京東路2段160號6樓；該公司其後於2024年完成解散清算。"
    status: verified
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S009, S010]
    evidence_summary: "經濟部設立清冊與公司公示資料可直接確認設立、代表人、地址、資本額與後續解散狀態。"
    tags: [二三無限, 蘇巧純, 公司沿革, 南京東路160號]

  - id: F008
    statement: "蘇貞昌與詹秀齡的財產申報顯示，兩人於2021年4月29日分別對『蘇○純』有400萬元借貸債權，合計800萬元。"
    status: verified
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S011]
    evidence_summary: "監察院原始財產申報直接列出兩筆借貸、日期與金額；文件遮蔽完整姓名，因此本fact只忠實記錄『蘇○純』。"
    verification_notes:
      - "媒體後續將該債務人識別為女兒蘇巧純，但若要把800萬元與特定公司投資連結，仍需獨立金流證據。"
    tags: [家族借貸, 財產申報, 蘇貞昌, 詹秀齡, "800萬元"]

  - id: F009
    statement: "第三方曠世智能歷史資料顯示，蘇巧純於2021年8月新增為董事，2022年7月其持股由723,456股增加至4,991,846股；現行官方登記可確認她目前持有4,991,846股。"
    status: partial
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S013, S014]
    evidence_summary: "現況持股有官方primary；2021加入董事與2022持股變化的歷史時點目前依第三方公司歷程，仍待原始變更登記檔補強。"
    tags: [曠世智能, 董事, 持股, 蘇巧純, 時間線]

  - id: F010
    statement: "2021年4月家庭借貸、2021年8月蘇巧純加入曠世智能董事、2022年7月持股大幅增加在時間上相近，但目前沒有公開金流證據證明800萬元家庭借款被用於取得曠世智能股份。"
    status: partial
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S011, S013, S014]
    evidence_summary: "時間排序形成可查核線索；資金用途鏈尚不存在，不能把時間接近直接寫成資金流向。"
    verification_notes:
      - "需要借款契約、銀行流向、增資認購文件或股權交易文件才能進一步判定。"
    tags: [時間線, 家族資本, 曠世智能, unresolved-link]

  - id: F011
    statement: "2022年桃園市立圖書館新總館互動多媒體項目由市府與原施工廠商春原營造以契約變更方式納入，桃園市政府當時公開表示由春原自行尋找合作團隊，並主張屬合法分包而非違法轉包。"
    status: verified
    observed_at: "2026-10-22T03:11:23+08:00"
    source_ids: [S015]
