notes:
  - "本件定位為低優先級查核／方法樣本，不形成Fact獨立文章。"
  - "應還原發言時的問題、完整上下文與語句在因果論述中的作用；不能只核對孤立字面真假。"
  - "政治短評的舉證範圍以實際提出的主張為限，不任意升格為『當事人必然不懂規定』等更強命題。"
  - "模型在本次對話初步分析時，優先排除『不懂規定』的推論，卻未先追問為何列舉本不適用之場地；此為需獨立識別的查核流程缺口，不是對任何政黨行為的預設結論。"
  - "若未來重新查核，需補：11月25日沈伯洋完整原始影片；市府廣場規定的當時有效版本及限制範圍；廣場維修／場地申請紀錄；封路核准與替代方案。"
