claims:
  - id: C001
    statement: "沈伯洋提到市府廣場不能借，足以證明他不知道市府廣場的選舉活動規定。"
    status: unsupported
    related_facts: [F001, F002]
    reasoning_notes: "由引用不能借推導其內心是否知悉規定，欠缺直接支持；不能把較強的『不知道規定』命題強加給評論者後要求對方證明。"
  - id: C002
    statement: "黃揚明該句評論是在質疑沈伯洋選擇列舉『市府廣場不能借』作為場地選擇說明的合理性。"
    status: unresolved
    related_facts: [F001, F002]
    reasoning_notes: "這是有公開文本基礎的論證功能解讀，但並非黃揚明明示的完整論證；避免把解讀冒充本人承認的動機。"

