    statement: "鍾明軒2026年11月13日發文，自述曾欣賞蔡英文，後因赴中國旅行及文化身分相關言論遭抹紅、遭錯誤轉述，而對公共討論產生自我審查。"
    status: "verified"
    observed_at: "2026-11-13T19:26:00+08:00"
    source_ids:
      - "S001"
    evidence_summary: "使用者提供當事人原帖擷取，可直接確認其公開自述；不把當事人的遭遇描述直接轉寫為已證實的每一項第三方行為。"
    tags:
      - "鍾明軒"
      - "沉默螺旋"
      - "忠誠審查"
claims:
  - id: "C001"
    statement: "若承認丈夫受台灣公司指派到中國從事合法商務不等於被中國收買，就不應僅憑鍾明軒自費赴中國旅遊或使用文化詞彙推論其不愛台灣或受到中共指使；郭昱晴的嘲諷與她為丈夫的辯護，在政治身分推定上呈現不一致標準。"
    status: "supported"
    supports:
      - "F001"
      - "F003"
      - "F006"
    related_facts:
      - "F004"
    reasoning_notes: "這是以公開言論與辯護理由推導的判準一致性批評；不能推出郭有意說謊或其丈夫涉及違法。"
  - id: "C002"
    statement: "林宣廷及郭昱晴家族在中國大賺紅錢、獲得中國政治關照或統戰資金。"
    status: "unresolved"
    supports: []
    related_facts:
      - "F001"
      - "F002"
      - "F004"
      - "F005"
    reasoning_notes: "董事與中國市場商務角色、福建備案傳聞均不足以證成家族股權、實際利潤、資金來源或政治關照；不得以政黨批評冒充財務證據。"
  - id: "C003"
    statement: "因丈夫薪水由台灣總公司支付，就可以說他沒有參與中國市場商業活動。"
    status: "contradicted"
    contradicts:
      - "F001"
      - "F002"
    reasoning_notes: "薪資來源與實際服務地域或公司職務是不同維度；郭本人承認當地分公司職務。"
  - id: "C004"
    statement: "『吸台灣錢去中國做事』可直接理解為拿台灣政府預算資助中國。"
    status: "unsupported"
    related_facts:
      - "F001"
    reasoning_notes: "目前僅可確認郭稱其丈夫領台灣民間企業薪水，未查到相關政府補助或公帑轉移的事實；使用者此語在原討論是對政治標準的諷刺，不宜當作公款指控。"
