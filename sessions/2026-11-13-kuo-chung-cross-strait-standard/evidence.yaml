    evidence_summary: "本次直接確認的是該公開指控及新聞引述存在，尚未獨立檢閱2019年福建官方原始文書。"
    verification_notes:
      - "首張備案不直接等於特殊政治照顧；無法據此直接證明實際收益。"
    tags:
