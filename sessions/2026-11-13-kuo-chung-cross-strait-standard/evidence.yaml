notes:
  - "對外核心：『丈夫由台灣公司領薪赴中國拓展業務』不是政治罪責；『鍾明軒自費赴中旅遊』同樣不能被僅憑行程定性成統戰。標準應一致，政治立場不影響舉證門檻。"
  - "『吸台灣錢去中國做事』為使用者在討論中對比薪資來源及活動地點的諷刺：沒有政府公款資料，不能寫成挪用補助或台灣納稅人資金。"
  - "董事與受薪經理人可以兼具；『掛名』可能影響實際治理角色，應以登記資料、聘任合同、股權與職權確認，不能僅依頭銜推論拿到紅錢。"
  - "待查：2018/2019中國企業原始工商及藥監登記、實際董事起訖日期與職權、股權收益、2019同期報導原件；沒有這些資料不應判定受特殊關照。"
  - "當事人2026年1月言論不是2026年11月新生的指控。鍾2026年11月原帖為政治感受與沉默螺旋論述，避免拿它替代2026年1月的原始影片。"
