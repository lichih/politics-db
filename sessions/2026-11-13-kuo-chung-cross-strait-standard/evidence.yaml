facts:
  - id: "F001"
    statement: "郭昱晴2025年6月24日公開承認丈夫林宣廷曾由台灣總公司派赴中國分公司擔任專業經理人，並因公司設立在當地掛名董事；並稱領的是台灣公司的薪水。"
    status: "verified"
    observed_at: "2026-11-13T19:26:00+08:00"
    source_ids:
      - "S002"
      - "S003"
      - "S004"
    evidence_summary: "當事人的公開受訪說法經多家媒體報導，與國民黨提出的中國公司董事登記說法可互相參照。"
    verification_notes:
      - "此事實不等於丈夫在中國領取人民幣、持有公司股權，或曾取得中國政治資金。"
    tags:
      - "郭昱晴"
      - "林宣廷"
      - "兩岸商業活動"
  - id: "F002"
    statement: "2025年6月國民黨凌濤公開指林宣廷為2018年10月設立的研鷺懿生物科技（廈門）有限公司董事，並展示所稱中國工商登記資料。"
    status: "verified"
    observed_at: "2026-11-13T19:26:00+08:00"
    source_ids:
      - "S002"
    evidence_summary: "中央社確認記者會有此揭露；董事職務另由郭昱晴本人『掛名董事』說法支持。"
    verification_notes:
      - "『有人出示登記資料』與『本次已直接核對登記資料真本』須區分。"
    tags:
      - "中國公司"
      - "工商登記"
  - id: "F003"
    statement: "2026年1月郭昱晴確曾以『沒事中國人，有事台灣人』嘲諷鍾明軒歐洲退稅代碼遭誤填一事，之後就此留言公開致歉。"
    status: "verified"
    observed_at: "2026-11-13T19:26:00+08:00"
    source_ids:
      - "S005"
      - "S006"
      - "S001"
    evidence_summary: "2026年1月新聞記錄雙方言論與郭的道歉；11月鍾明軒原帖亦回顧此事。"
    verification_notes:
      - "郭昱晴道歉的存在不能被抹除；是否充分反省屬評價。"
    tags:
      - "郭昱晴"
      - "鍾明軒"
      - "政治標籤"
  - id: "F004"
    statement: "鍾明軒2026年1月在影片中反擊，指郭昱晴丈夫與家族在中國『賺紅錢』；郭昱晴否認並稱丈夫是台灣公司受薪經理人。"
    status: "verified"
    observed_at: "2026-11-13T19:26:00+08:00"
    source_ids:
      - "S005"
      - "S006"
    evidence_summary: "可確認雙方公開提出過何種說法，不以此證成鍾的家族獲利指控。"
    tags:
      - "雙方說法"
      - "待查"
  - id: "F005"
    statement: "2025年6月國民黨公開宣稱研鷺懿取得福建省首張進口非特殊用途化妝品備案憑證，並引用2019年林宣廷稱備案時間僅一個多月。"
    status: "verified"
    observed_at: "2026-11-13T19:26:00+08:00"
    source_ids:
