facts:
  - id: F001
    statement: "2026年10月31日辯論中，沈伯洋以SOGO人潮跨越市民大道前往微風廣場，說明空間及心理隔閡的縫合概念。"
    status: verified
    observed_at: "2026-10-31T15:37:11+08:00"
    source_ids: [S001, S004]
    evidence_summary: "兩個來源均呈現該例子，TVBS報導引述了相關辯論發言。"
    verification_notes: ["若日後取得正式影音或逐字稿，應再核對原句及上下文。"]
    tags: [辯論發言, 舉例]
  - id: F002
    statement: "陳智菡公開指出忠孝及復興SOGO與微風廣場並非隔著市民大道，並在留言質疑沈伯洋指涉哪一間SOGO。"
    status: verified
    observed_at: "2026-10-31T15:37:11+08:00"
    source_ids: [S002, S004]
    evidence_summary: "當事人貼文與當日新聞報導可直接確認反駁內容。"
    verification_notes: ["此項驗證的是反駁確實被提出；地理位置判斷另由地圖與實際位置核對。"]
    tags: [公開反證]
  - id: F003
    statement: "臺北市都市發展局既有政策資料明確使用『市民大道南北軸向人本環境縫合』，並指出部分地區高架道路與土地使用造成空間不連續及疏離感。"
    status: verified
    observed_at: "2026-10-31T15:37:11+08:00"
    source_ids: [S003]
    evidence_summary: "官方109年度人本環境改善先期規劃的施政願景直接記載。"
    verification_notes: ["官方資料的具體規劃核心在建國啤酒廠與中山女高附近，不能直接替沈的SOGO／微風地理舉例背書。"]
    tags: [官方政策, 都市設計]

claims:
  - id: C001
    statement: "SOGO忠孝館、復興館與微風廣場位於市民大道同側，以這些百貨隔著市民大道說明南北縫合是地理失準。"
    status: supported
    supports: [F001, F002]
    contradicts: []
    related_facts: [F003]
    reasoning_notes: "地理判斷需使用地址／地圖獨立交叉核驗；此處保留作者提出的具體反證與再核對要求，不把社群貼文等同測繪成果。"
  - id: C002
    statement: "沈伯洋舉錯SOGO與微風案例，所以市民大道不存在南北人本空間縫合問題。"
    status: contradicted
    supports: []
    contradicts: [F003]
    related_facts: [F001, F002]
    reasoning_notes: "局部例子失準不會推翻市府正式規劃中獨立存在的都市縫合問題；要區分個別示例與政策命題。"
  - id: C003
    statement: "現任市長掌握行政資料的資訊優勢，應使挑戰者在辯論中免於檢驗其公共可查證的地理事實。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002]
    reasoning_notes: "規範判準：資訊不對稱應納入攻防情境，但不構成對任何一方的事實查核豁免；亦不應把未背出行政數字自動等同政策論證錯誤。"

