facts:
  - id: F001
    statement: "2026-11-03報導指出，高院以二審階段不適用刑訴法證據保全程序、聲請無從補正為由，駁回鄭深元對彭振聲偵訊錄音檔的保全聲請，且不得抗告。"
    status: verified
    observed_at: "2026-11-03T21:57:00+08:00"
    source_ids: [S001, S002]
    evidence_summary: "兩家報導一致轉述裁定程序理由；此為裁定內容的媒體轉述，未取得裁定原文。"
    verification_notes:
      - "不得推論高院已實質認定檢方不存在不正訊問。"
    tags: [高院, 程序駁回, 證據保全]
  - id: F002
    statement: "2026-11-03報導轉述：聲請律師表示不確定訊問暫停期間錄音是否存在及其內容，高院認為無法辨明所欲證明之具體事實或究屬保全、調查證據。"
    status: verified
    observed_at: "2026-11-03T21:57:00+08:00"
    source_ids: [S001, S002]
    evidence_summary: "裁定對聲請特定性的疑慮，與時點不合法分開記錄。"
    verification_notes:
      - "仍待裁定全文確認措辭。"
    tags: [聲請特定性, 待證事實]
  - id: F003
    statement: "2025-08-28台北地院已勘驗彭振聲2024-09-03、09-04的偵訊錄音錄影；勘驗係柯文哲及辯護人聲請。"
    status: verified
    observed_at: "2026-11-03T21:57:00+08:00"
    source_ids: [S003, S004]
    evidence_summary: "一審已有聲請勘驗的具體紀錄，不能說辯方一審完全未提出錄音爭議。"
    verification_notes:
      - "勘驗聲請不等於第219-4條的證據保全聲請。"
    tags: [一審, 勘驗, 錄音錄影]
  - id: F004
    statement: "北檢2025-08-29對外表示，遭質疑的1小時13分鐘錄音中斷係彭振聲與兩位辯護律師單獨接見，依法不得錄音錄影；民眾黨則曾質疑該時段及偵訊方式。"
    status: verified
    observed_at: "2026-11-03T21:57:00+08:00"
    source_ids: [S003]
    evidence_summary: "記錄檢辯爭議與檢方說法，不把檢方說明直接寫成客觀查明的中斷原因。"
    verification_notes:
      - "是否另有不同時段、不同性質的訊問暫停，尚待對照聲請書及偵訊時間軸。"
    tags: [北檢, 錄音中斷, 律見]

