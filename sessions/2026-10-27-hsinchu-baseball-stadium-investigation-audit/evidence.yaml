sources:
  - id: S001
    source_type: secondary
    publisher: "TVBS新聞網"
    title: "拆彈新竹棒球場／高虹安市府告發後2年「檢方才拍照」引爭議　法界這樣看"
    url: "https://news.tvbs.com.tw/local/4041220"
    published_at: "2026-10-27"
    observed_at: "2026-10-27T16:35:23+08:00"
    retrieval_status: reachable
    notes:
      - "報導以新竹市政府紀錄、工務處長陳明錚說法及不具名法界人士分析，提出偵查時間線、現場證據保全、取樣分母、下包傳喚、採購單據及縮時影像數位鑑識等問題。"
      - "其中多項屬市府或不具名法界人士主張，尚未取得完整不起訴處分書、偵查卷證或傳喚／鑑識紀錄獨立驗證。"
      - "報導中的『未強制處分所以沒積極偵辦』及『羈押即可突破』屬評論性推論，不作為本 evidence 的事實基礎。"

  - id: S002
    source_type: secondary
    publisher: "中央通訊社"
    title: "新竹棒球場案林智堅不起訴　營造、監造4人緩起訴"
    url: "https://www.cna.com.tw/news/asoc/202608280335.aspx"
    published_at: "2026-08-28"
    observed_at: "2026-10-27T16:35:23+08:00"
    retrieval_status: reachable
    notes:
      - "轉述新竹地檢署偵結新聞資料：林智堅等遭告發圖利等罪嫌不足不起訴；營造、監造4人因施工日誌、監造紀錄及抽查紀錄登載不實而緩起訴。"
      - "轉述竹檢稱曾進行通訊監察、金流比對、搜索及帳務分析，未發現林智堅或市府人員與營造、監造公司間有不法金流、收賄或圖利事證。"
      - "亦轉述竹檢稱球場發現部分不符規範石塊、木材等，但數量有限，查無業者自外運入廢棄物、外運土壤變賣或詐領工程款等證據。"

  - id: S003
    source_type: primary
