      - "偵結內容細節目前由S002中央社轉述竹檢新聞資料補足，不把S003列表頁本身當作全文證據。"

  - id: S004
    source_type: primary
    publisher: "監察院"
    title: "新竹市政府辦理市立棒球場統包工程未驗收即先使用等重大違失，監察院通過糾正新竹市政府、運動部"
    url: "https://www.cy.gov.tw/News_Content.aspx?n=125&s=37720&sms=8912"
    published_at: "2026-07-17"
    observed_at: "2026-10-27T16:35:23+08:00"
    retrieval_status: reachable
    notes:
      - "監察院確認未踐行部分驗收或分段查驗即啟用、設計施工未達契約效能標準且有安全疑慮、專案管理與監造督導缺失、技術服務廠商資格問題，以及契約變更增購原招標減項內容衍生政府採購法執行錯誤態樣等重大違失。"
      - "此行政／監督調查結果不自動等於刑事圖利、貪污或詐欺構成要件已成立。"

  - id: S005
