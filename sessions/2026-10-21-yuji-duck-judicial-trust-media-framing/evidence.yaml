facts:
  - id: F001
    statement: "當事人在 2026-10-20 Threads 貼文中公開主張：自己遭人砸車、對方持瑞士刀向其頭部攻擊；自己反擊後遭依故意傷害起訴；並轉述法官曾表示該瑞士刀不具殺傷力、問其為何不跑，以及其對對方提出的故意傷人、恐嚇、殺人未遂告訴均遭駁回。"
    status: verified
    observed_at: "2026-10-21T10:33:00+08:00"
    source_ids: [S001]
    evidence_summary: "可直接驗證的是『當事人如此公開主張』，不是司法文件內容本身。"
    verification_notes:
      - "本 fact 不把當事人對法官、檢察官發言的轉述升格為已證實司法事實。"
    tags: [當事人主張, 司法信任, Threads]

  - id: F002
    statement: "當事人 Threads 個人檔案公開自述從事拳擊／格鬥，並標示『台灣格鬥聯盟｜4勝1KO』。"
    status: verified
    observed_at: "2026-10-21T10:36:00+08:00"
    source_ids: [S002]
    evidence_summary: "可作為公開背景資料；不足以單獨證明其在本案中有尋釁、傷害或其他主觀犯意。"
    verification_notes:
      - "禁止以格鬥背景直接推論動機或法律責任。"
    tags: [人物背景, 拳擊]

  - id: F003
    statement: "TVBS 2026-08-13 報導描述監視器行為序列為：駕駛下車理論後先推對方；對方隨後掏刀逼近；駕駛後退拉開距離後再踢擊；報導並稱起訴書認定其可閃避或離去，卻再次上前逼近踢擊，且對方跌倒後仍繼續踢。"
    status: partial
    observed_at: "2026-10-21T10:44:00+08:00"
    source_ids: [S003]
    evidence_summary: "此行為序列若正確，與僅以『持刀攻擊→反擊→被起訴』概括事件相比，增加了會影響正當防衛與傷害犯意判斷的重要前後脈絡。"
    verification_notes:
      - "目前來源為新聞對監視器及起訴書的描述；尚未以完整原始司法文件與完整影片逐幀核實。"
    tags: [行為序列, 正當防衛, 起訴]

  - id: F004
    statement: "TVBS 2026-08-13 報導稱，當事人對對方提告殺人未遂、傷害及毀損，其中毀損遭起訴，另外兩罪不成立。"
    status: partial
    observed_at: "2026-10-21T10:44:00+08:00"
    source_ids: [S003]
    evidence_summary: "此報導版本與 2026-10-20 Threads 貼文所列『故意傷人、恐嚇、殺人未遂通通駁回』並非完全同一組罪名與程序描述，顯示仍需原始處分書確認。"
    verification_notes:
      - "不能據此直接判定當事人說謊；不同程序、不同告訴罪名或後續進度都可能造成表面差異。"
    tags: [程序狀態, 告訴, unresolved]

  - id: F005
    statement: "2026-10-20 記者爆料網／LIFE 轉載報導以『駕駛閃過反踢遭起訴傷害罪』等語概括案件，內文明示圖片翻攝自 Threads，主要逐段轉述當事人對法官、檢察官與案件結果的說法。"
    status: verified
    observed_at: "2026-10-21T10:45:00+08:00"
    source_ids: [S005, S001]
    evidence_summary: "此篇可證明媒體將當事人公開敘事轉譯成新聞內容；現有頁面未呈現足以獨立核實相關司法發言的原始文件。"
    verification_notes:
      - "『未呈現』僅指本次觀察到的文章頁面，不等於記者採訪過程一定沒有其他資料。"
    tags: [媒體轉述, 單方敘事, 媒體信任]

  - id: F006
    statement: "TVBS 另篇 2026-08-13 報導將當事人描述為業餘拳擊手，並以『街頭自保反擊反被告傷害罪』作為標題 framing。"
    status: verified
    observed_at: "2026-10-21T10:44:00+08:00"
    source_ids: [S004]
    evidence_summary: "同一案件在媒體標題層即可被壓縮為『自保反擊卻被告』；標題本身不能取代完整行為序列。"
    tags: [媒體framing, 標題, 司法信任]

claims:
  - id: C001
    statement: "本案目前足以作為『司法濫權／司法荒謬』的正面證據。"
    status: unsupported
    contradicts: [F003, F004]
    related_facts: [F001, F005]
    reasoning_notes: "目前尚缺完整起訴書、不起訴處分書、庭訊筆錄與完整影片；而較早報導所述的完整行為序列包含主動下車推人、後退後再上前及對方倒地後繼續踢等重要脈絡，因此不能只靠當事人版本把案件定性為司法濫權。"

  - id: C002
    statement: "2026-10-20 的新聞報導對當事人所述法官、檢察官發言與程序結果完成了獨立查證。"
    status: unsupported
    contradicts: [F005]
    reasoning_notes: "可見文章主要沿用 Threads 敘事，未在頁面展示足以獨立驗證相關司法說法的原始文件。"

  - id: C003
    statement: "本案適合作為司法信任研究中的 negative control：表面上高度支持『司法欺負防衛者』的敘事，但補入較完整行為序列後，原先直覺結論明顯弱化。"
    status: supported
    supports: [F001, F003, F005, F006]
    reasoning_notes: "用途不是替司法預設無誤，而是測試研究流程能否主動排除對既有『司法不可信』主線有利、但證據不足或脈絡被壓縮的案例。"

  - id: C004
    statement: "當事人有意欺騙公眾或刻意操弄司法不信任。"
    status: unresolved
    related_facts: [F001, F003, F004]
    reasoning_notes: "現有資料可辨識公開敘事與較完整事件描述之差異，但不足以證明主觀上明知且故意欺騙。自我保護、自利敘事、記憶與理解差異等 competing hypotheses 均仍存在。"

  - id: C005
    statement: "自利敘事／自我保護是本案當事人公開版本與較完整事件描述出現落差的原因。"
    status: unresolved
    related_facts: [F001, F003, F004]
    reasoning_notes: "這是可研究的人性與社會認知 hypothesis，不是由單一案件即可確認的心理事實；需更多直接資料或跨案例比較。"

