facts:
  - id: F001
    statement: "截至2026年8月底，卓榮泰內閣已對8項立法院三讀法案拒絕副署，行政院自己統計為209案中的8案（3.8%）。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S006, S007]
    evidence_summary: "行政院公開統計與中央社整理一致。"
    tags: [不副署, 行政院, 統計]

  - id: F002
    statement: "2025年財劃法修正案在行政院覆議失敗、立法院維持原案後，卓榮泰仍拒絕副署，使法案無法公布生效。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S002, S003]
    evidence_summary: "增修條文規定覆議維持原案後院長『應即接受』；本案實際又以不副署阻止公布。"
    tags: [財劃法, 覆議, 不副署]

  - id: F003
    statement: "2025年12月19日憲法法庭恢復運作後，行政院仍在2026年間至少7次以不副署阻止三讀法案公布。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S004, S005, S007, S008, S009, S010]
    evidence_summary: "財劃法是2025-12-15首例；其餘眷改、黨產、衛廣、立院組織、兒少帳戶、有線廣電、廣電等案件發生於憲法法庭恢復後。"
    tags: [憲法法庭, 不副署, 時間線]

  - id: F004
    statement: "軍人待遇條例與警察人員人事條例均已由總統公布且由卓榮泰副署，但行政院未依修法內容編足相關預算，選擇等待憲法審查結果再決定是否追溯執行。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S011, S012, S014, S015, S016]
    evidence_summary: "兩法已完成公布程序；行政院其後明確承認暫緩編列與執行。"
    tags: [軍人待遇, 警消退休, 不執行, 預算]

  - id: F005
    statement: "立法院預算中心認為警消退休所得屬法定義務支出，若行政院認為不合時宜，應先修法後才能停止編列。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S013]
    evidence_summary: "立法院預算中心以依法行政與法定義務支出為由提出明確意見。"
    tags: [依法行政, 預算中心, 警消退休]

  - id: F006
    statement: "對另案『停砍年金』修法，即使行政院、考試院已聲請憲法審查，銓敘部仍表示在判決未出爐前依法執行並補發差額。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S005, S017]
    evidence_summary: "同為被主張違憲並聲請憲法審查的法律，行政體系並非一律採取停止執行。"
    tags: [比較案例, 年金, 釋憲]

  - id: F007
    statement: "憲法增修條文仍提供立法院過半多數對行政院長提出不信任案的終局政治制衡，但不信任案通過後總統得解散立法院。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S002]
    evidence_summary: "不信任案門檻為三分之一連署、全體二分之一贊成；通過後院長辭職，總統得解散國會。"
    tags: [不信任案, 解散國會, 制衡]

  - id: F008
    statement: "2026年立法院一般表決結構中，國民黨、民眾黨及合作無黨籍合計可達過半，但並不足以達成總統彈劾所需三分之二門檻。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S018]
    evidence_summary: "2026-05總統彈劾案56票贊成、50票反對而未達三分之二。"
    tags: [在野過半, 席次, 彈劾]

claims:
  - id: C001
    statement: "「行政院把所有在野通過的法律都擋掉。」"
    status: contradicted
    contradicts: [F001]
    reasoning_notes: "行政院自報截至2026年8月已副署201案、拒絕8案；不能描述成全部法案都被擋。"

  - id: C002
    statement: "「行政院已形成可以阻止國會法律生效的實質否決效果。」"
    status: verified
    related_facts: [F001, F002, F003]
    reasoning_notes: "不論對此權力的憲法正當性如何評價，8項三讀法案確實因行政院長拒絕副署而未公布生效；功能效果即為阻止法律生效。"

  - id: C003
    statement: "「不副署是現行憲法已明確確認的行政院對國會否決權。」"
    status: unresolved
    related_facts: [F002, F003]
    reasoning_notes: "憲法第37條明定公布法律須經副署，但增修條文第3條又明定覆議後行政院長應即接受；目前尚無憲法法庭判決直接確認卓內閣所主張的一般性不副署否決權。此為重大憲法爭議，不應當成既定法理。"

  - id: C004
    statement: "「聲請憲法審查後，行政院當然可以暫停執行已公布法律。」"
    status: unsupported
    related_facts: [F004, F005, F006]
    reasoning_notes: "目前沒有資料顯示聲請憲法審查本身具有一般性的自動停止法律效力；立法院預算中心反而主張法定義務支出應先修法後才能停編，且停砍年金案在審查中仍被執行。"

  - id: C005
    statement: "「在野過半完全沒有任何制度制衡工具。」"
    status: contradicted
    contradicts: [F007]
    reasoning_notes: "立法院仍有預算、立法、人事同意及不信任案等權力；但不信任案通過後伴隨總統解散國會風險，不能等同一般立法的日常救濟。"

  - id: C006
    statement: "「在目前的實務下，立法院過半並不能保證其三讀法律會生效或被行政院執行。」"
    status: verified
    related_facts: [F001, F002, F003, F004]
    reasoning_notes: "已有8項三讀案因不副署未生效，另有2項已公布法律未依條文內容編列執行。"

  - id: C007
    statement: "「憲法法庭恢復後，不副署實務就停止了。」"
    status: contradicted
    contradicts: [F003]
    reasoning_notes: "2026年2月至8月仍有7項三讀法案遭不副署。"

