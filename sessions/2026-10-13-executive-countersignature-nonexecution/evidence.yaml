session:
  id: 2026-10-13-executive-countersignature-nonexecution
  project: Politics
  title: "2025–2026行政院不副署、不編列與立法院多數制衡"
  started_at: "2026-10-13"
  updated_at: "2026-10-13"
  status: active

topics:
  - 行政院
  - 立法院
  - 不副署
  - 不執行
  - 覆議
  - 權力分立
  - 財政收支劃分法
  - 軍人待遇條例
  - 警察人員人事條例
  - 憲法法庭
  - 國會多數
  - 不信任案

sources:
  - id: S001
    source_type: primary
    publisher: "全國法規資料庫"
    title: "中華民國憲法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0000001"
    observed_at: "2026-10-13"
    retrieval_status: reachable
    notes:
      - "憲法第37條規定，總統依法公布法律、發布命令，須經行政院院長副署，或行政院院長及有關部會首長副署。"
      - "憲法第62、63條規定立法院為最高立法機關，具有議決法律案、預算案等權限。"

  - id: S002
    source_type: primary
    publisher: "全國法規資料庫"
    title: "中華民國憲法增修條文"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0000002"
    observed_at: "2026-10-13"
    retrieval_status: reachable
    notes:
      - "第3條第2項第2款規定，行政院對法律案、預算案、條約案認為窒礙難行時得提覆議；如全體立委二分之一以上維持原案，行政院院長『應即接受該決議』。"
      - "第3條第2項第3款規定，三分之一以上立委可提不信任案；全體立委二分之一以上贊成時，行政院長應辭職，並得呈請總統解散立法院。"
      - "第2條規定，總統在不信任案通過後得解散立法院。"

  - id: S003
    source_type: primary
    publisher: "總統府"
    title: "針對立院再咨請公布財政收支劃分法修正條文 總統批示本法修正破壞財政永續"
    url: "https://www.president.gov.tw/News/39708"
    published_at: "2025-12-15"
    observed_at: "2026-10-13"
    retrieval_status: reachable
    notes:
      - "立法院2025-11-14三讀財劃法修正，行政院提出覆議；立法院2025-12-05維持原決議。"
      - "行政院長卓榮泰其後仍決定不予副署，法案因而未公布生效。"
      - "此為現行憲政下首件以不副署阻止法律生效的法律案。"

  - id: S004
    source_type: primary
    publisher: "憲法法庭"
    title: "114年憲判字第1號（憲法訴訟法修正案）"
    url: "https://cons.judicial.gov.tw/docdata.aspx?brid=LQAqJRjF42Chw2jOOxEL2A&fid=38&id=355485"
    published_at: "2025-12-19"
    observed_at: "2026-10-13"
    retrieval_status: reachable
    notes:
      - "憲法法庭宣告2025年憲法訴訟法部分修正違憲失效，使憲法法庭恢復依原規範運作。"
      - "3名大法官另公開主張5人作成判決無效，顯示該判決本身亦存在重大程序爭議。"

  - id: S005
    source_type: primary
    publisher: "行政院公報"
    title: "行政院公報第032卷第002期附錄"
    url: "https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg032002/ch09/type9/gov01/num39/Eg.pdf"
    published_at: "2026-01-05"
    observed_at: "2026-10-13"
    retrieval_status: reachable
    notes:
      - "卓榮泰表示，因憲法法庭已恢復正常運作，對立法院通過的『反年改』法案，行政院將履行義務予以副署，同時立即聲請憲法審查。"
      - "同一段話亦表示，若國會法案被行政院認定有摧毀憲政體制、削弱國防安全、破壞財政紀律且難以回復等情況，他仍不會放棄不副署。"

  - id: S006
    source_type: secondary
    publisher: "中央社"
    title: "回應韓國瑜 政院：不副署法案僅占3.8%是被動防衛"
    url: "https://www.cna.com.tw/news/aipl/202608270325.aspx"
