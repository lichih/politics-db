facts:
  - id: F001
    statement: "NVIDIA 2026-08-10 宣布六家大型金融機構合作開發算力融資平台，目標逐步動員超過 5,000 億美元第三方資本。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S001, S002]
    evidence_summary: "官方合作公告與黃仁勳親署文章一致。"
    verification_notes: ["目標不等於已融資或 NVIDIA 借出的總額。"]
    tags: ["nvidia", "ai-financing"]
  - id: F002
    statement: "黃仁勳 2026-08-11 公開將可持續產生算力收入的 AI 機房視為可投資資產，強調 GPU 耐用及再部署能力。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S002]
    evidence_summary: "第一人稱公司戰略公開發言；證明他如此主張，不證明未來實際經濟報酬。"
    tags: ["nvidia", "asset-life"]
  - id: F003
    statement: "NVIDIA 2026 第二季 10-Q 揭露特定 AI 雲端合作在符合條件時可參與第三方營收分享，並可對部分特定專案提供有限殘值支持。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S003]
    evidence_summary: "SEC 10-Q 原文對收入分享與殘值支持做有條件描述。"
    verification_notes: ["不能概括所有 NVIDIA GPU 均提供股權或租金分潤。"]
    tags: ["nvidia", "revenue-share", "residual-value"]
  - id: F004
    statement: "Silicon Data 公開 H100 租金指數的 2026-11-13 讀數為每 GPU 小時 3.10 美元。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S004]
    evidence_summary: "來源為指數編製者的時間序列紀錄。"
    verification_notes: ["指數不是折舊後淨利，不能直接代表單一機房現金流。"]
    tags: ["H100", "rental-index"]
  - id: F005
    statement: "路透社 2026-10-01 報導部分銀行人士質疑 GPU 殘值是否足夠作擔保，預期需要強化信用保證或高信用租戶現金流。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S005]
    evidence_summary: "路透社對受訪者觀點的報導；屬外部融資質疑已被報導的事實。"
    verification_notes: ["不同融資方案條款未全部公開，不能推定每案必須額外擔保。"]
    tags: ["financing", "risk"]
  - id: F006
    statement: "TrendForce 2026-11-11 預估 2026 年第四季 PC DRAM 合約價格季增 13–18%，同時指出 PC 需求疲弱與 PC 廠商調整採購。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S006]
    evidence_summary: "研究公司當時的價格預測與市場分析。"
    verification_notes: ["這是 DRAM 合約價預測，不是 PC 整機售價已上漲同等幅度。"]
    tags: ["PC", "DRAM"]
  - id: F007
    statement: "SEC 文件記載 NVIDIA 董事會 2026-11-11 接受黃仁勳辭去總裁、執行長與董事職務。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S007]
    evidence_summary: "2026-11-12 8-K 確認人事程序。"
    tags: ["governance", "huang"]
  - id: F008
    statement: "NVIDIA 董事會於 2026-11-22 恢復黃仁勳總裁、執行長及董事職務，並於 11-23 公告，Kress 續任 CFO。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S008, S009]
    evidence_summary: "2026-11-23 8-K 與公司新聞稿相符。"
    tags: ["governance", "huang"]
  - id: F009
    statement: "NVIDIA 2026-11-23 稱董事會與黃仁勳討論後滿意其坦誠與領導能力，並參考美國政府高層意見，認為回任無國安風險；其獨立董事調查仍將繼續。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S009]
    evidence_summary: "這是董事會正式聲明的內容，不等於外部獨立證明所有指控已排除。"
    tags: ["governance", "national-security"]
  - id: F010
    statement: "NVIDIA 2026-11-17 公告 FY2027 Q3 營收 1,158 億美元、資料中心業務營收 1,076 億美元。"
    status: verified
    observed_at: "2026-11-23T23:48:26+08:00"
    source_ids: [S010]
    evidence_summary: "NVIDIA 第三季財報公告。"
    tags: ["earnings", "datacenter"]

claims:
  - id: C001
    statement: "NVIDIA 不僅賣新 GPU，還正式嘗試透過算力資產化、融資支持與部分收益分潤分享舊設備的持續經濟價值。"
    status: supported
    supports: [F001, F002, F003]
    related_facts: [F004]
    reasoning_notes: "此為商業模式方向；實際分潤盈利規模、股權配置和普遍性未獲證明。"
  - id: C002
    statement: "NVIDIA 已經成功解決 GPU 換代與機房折舊之間的利益衝突。"
    status: unsupported
    related_facts: [F003, F004, F005]
    reasoning_notes: "案例租金可上漲，仍須檢驗利用率、總成本、設備殘值、信用風險與保證支出。"
  - id: C003
    statement: "黃仁勳因為機房金融化計畫不可替代，所以董事會決定讓他回任。"
    status: unresolved
    related_facts: [F001, F008, F009]
    reasoning_notes: "董事會正式理由為坦誠、領導能力與國安風險評估，沒有證據把回任直接歸因於融資戰略。"
  - id: C004
    statement: "延長 GPU 壽命必然減緩 AI 發展且必然降低消費級 PC 價格。"
    status: unsupported
    related_facts: [F002, F006, F010]
    reasoning_notes: "延壽或降低重複採購，但融資與可用算力增加也可能擴張需求；PC 記憶體供給受資本配置及終端需求多因素左右。"
  - id: C005
    statement: "GPU 折舊是 AI 基礎建設融資風險的重要變數，但不是能夠單獨解釋所有 AI 泡沫的證據。"
    status: supported
    supports: [F002, F003, F005]
    related_facts: [F004]
    reasoning_notes: "設備殘值會影響債務融資；不能省略終端收入、算力使用率、能源和利率。"

