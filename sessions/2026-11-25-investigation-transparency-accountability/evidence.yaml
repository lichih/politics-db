    notes:
      - "轉述新竹地檢署11月25日說明：20日20:35訊問、21:28王姓律師在場諭知10萬交保、21日00:19至00:57洪姓律師協助、02:09改限制住居。"
      - "目前取得的是完整新聞引述，尚未直接取得地檢署新聞稿正本。"
  - id: S005
    source_type: secondary
