    retrieval_status: reachable
    notes:
      - "11月21日媒體標題以「坦承散布」描述案情。可證明報導存在，不能獨立證明筆錄有此供述、內容自願真實或消息源自哪個機關。"
  - id: S008
    source_type: commentary
    publisher: "徐勝凌 Facebook"
    title: "2026年11月25日程序正義應一體適用之貼文及留言"
    url: "https://www.facebook.com/XinFengWillBeBetter/posts/pfbid02jZb2DrCrG37PxYUbABvHuKQbgQwKWfU94CuqH15JAQnTJjFwLRy8tKKVRsS5qCnxl"
