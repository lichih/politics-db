    observed_at: "2026-11-25T15:26:00+08:00"
    retrieval_status: reachable
    notes:
      - "轉述新竹縣警局11月25日說明：警方稱11月20日17:30暫停筆錄等待律師、曾協助聯繫、其後經李女同意續行；否認送返時指示媒體放消息。"
      - "警方主張扣押設備與共同雲端、相關帳號有關；必要性仍須核對搜索票與扣押清單。"
  - id: S006
    source_type: primary
