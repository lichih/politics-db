notes:
  - "公共評論以既有制度違失、2024年九問、2026年三方爭議建立可驗證的說明責任，不能以2024舊案直接宣稱2026新案違法。"
  - "追蹤點：新竹縣警局錄影與同意續問、竹檢訊問筆錄、律師實際到場、扣押清單、送返通聯、2026-11-21媒體消息來源、司改會九問截至2026年的官方調查回覆。"
