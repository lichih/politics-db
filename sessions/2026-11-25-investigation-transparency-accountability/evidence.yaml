    notes:
      - "同S001調查之正式糾正公告；明載包括向媒體透露具體供述內容，且2019年以來有4名調查局人員涉嫌洩密遭起訴或緩起訴。"
facts:
  - id: F001
    statement: "監察院2024年正式糾正警政署及調查局未落實偵查不公開，包含對媒體揭露供述內容、證物或影像等具體違失。"
    status: verified
    observed_at: "2026-11-25T15:26:00+08:00"
    source_ids: [S001, S009]
    evidence_summary: "監察院調查及糾正公告為獨立監督的正式認定；不是2026年新竹個案的裁判。"
    tags: ["監察院", "偵查不公開"]
  - id: F002
    statement: "民間司改會2024年12月27日列出多筆柯文哲案起訴前報導與起訴書的對照，向北檢、高檢署及法務部提出九問。"
    status: verified
    observed_at: "2026-11-25T15:26:00+08:00"
    source_ids: [S002]
    evidence_summary: "已確認九問聲明及對照表存在；洩密者身分與法律責任不因該聲明直接確定。"
    tags: ["司改會", "九問"]
  - id: F003
    statement: "2026年11月25日徐欣瑩李姓助理公開否認製造或散布影片，指控律師陪同、搜索扣押及送返途中疑似對媒體放話存在問題。"
    status: verified
    observed_at: "2026-11-25T15:26:00+08:00"
    source_ids: [S003]
    evidence_summary: "確認當事人有此公開說法，不代表所有指控已獨立證實。"
    tags: ["徐欣瑩", "當事人陳述"]
  - id: F004
    statement: "新竹地檢署11月25日透過新聞報導公布李女訊問、辯護人到場及交保改限制住居的具體時間線。"
    status: verified
    observed_at: "2026-11-25T15:26:00+08:00"
    source_ids: [S004]
    evidence_summary: "檢方主張20日20:35李女先稱無須委任律師、21:28王姓律師在場時諭知10萬元交保，21日00:19至00:57洪姓律師協助、02:09改限制住居；為機關說法非獨立筆錄勘驗。"
    tags: ["新竹地檢署", "律師"]
  - id: F005
    statement: "新竹縣警局11月25日表示曾暫停詢問協助聯繫律師，之後經李女同意續行；否認送返途中的通話是通知媒體。"
    status: verified
    observed_at: "2026-11-25T15:26:00+08:00"
    source_ids: [S005]
    evidence_summary: "確認警方公開提出上述反證；尚待筆錄、錄音錄影、通聯及勤務紀錄比對。"
    tags: ["新竹縣警察局", "警方回應"]
  - id: F006
    statement: "刑事訴訟法第95條規定已選任辯護人而未在場時原則上停止訊問，被告同意續行則屬法定例外。"
    status: verified
    observed_at: "2026-11-25T15:26:00+08:00"
    source_ids: [S006]
    evidence_summary: "法律規則可確認；個案同意是否有效與自願仍需程序紀錄。"
    tags: ["刑事訴訟法", "程序保障"]
  - id: F007
    statement: "公視11月21日新聞以李姓助理『坦承散布不實影片』為標題，11月25日當事人則公開否認散布。"
    status: verified
    observed_at: "2026-11-25T15:26:00+08:00"
    source_ids: [S007, S003]
    evidence_summary: "可確認兩個公開陳述有表面衝突；尚未取得偵訊筆錄確認具體供述或報導消息來源。"
    tags: ["公視", "媒體", "供述"]
  - id: F008
    statement: "徐勝凌11月25日以柯文哲案支持者的經驗呼籲程序權利一體適用，並未將李女犯罪嫌疑當成已查無犯罪。"
    status: verified
    observed_at: "2026-11-25T15:26:00+08:00"
    source_ids: [S008]
    evidence_summary: "貼文原文可核對；其比較係政治及道德論證，不構成個案程序違法之證明。"
    tags: ["徐勝凌", "一致標準"]
claims:
  - id: C001
    statement: "新竹檢警在本案違法剝奪李女辯護人在場權。"
    status: unresolved
    related_facts: [F003, F004, F005, F006]
    reasoning_notes: "機關與當事人有矛盾；應勘驗各時段訊問錄影、委任及同意筆錄，不能只以兩名律師後來到場推定先前合法。"
  - id: C002
    statement: "本案偵查人員洩密，並在送返李女途中指示媒體發布消息。"
    status: unresolved
    related_facts: [F003, F005, F007]
    reasoning_notes: "警方否認電話涉及媒體；即使通話與媒體無關，也無法排除其他時段資訊外洩，需要媒體資訊來源及不同時間線核對。"
  - id: C003
    statement: "本案檢警受到政黨指示，以選舉為目的偵辦。"
    status: unresolved
    related_facts: [F003, F004, F005]
    reasoning_notes: "選前搜索與政治影響是合理監督線索，尚不足以確認有具體指示或政治目的。"
  - id: C004
    statement: "已有正式糾正與跨案具體質疑，要求機關提供可獨立檢驗的程序說明具有充分公共理由。"
    status: supported
    supports: [F001, F002, F003, F004, F005, F007]
    reasoning_notes: "說明責任不等於必須公開所有偵查秘密，更不等於把犯罪舉證責任倒置。可透過獨立監督、當事人閱卷救濟、遮蔽敏感資訊的結論報告達成。"
  - id: C005
    statement: "截至2026年11月25日，司法機關始終未對司改會2024年九問提出任何回覆或調查結果。"
    status: unresolved
    related_facts: [F002]
    reasoning_notes: "本次只核實2024-12-27聲明時的待答狀態，未完成截至今日的官方全量回覆與調查結果查找；不可寫成肯定事實。"
