      - "司改會將柯文哲案起訴前部分媒體報導與起訴書對照，提出九項具體問題；其對洩密來源的推定仍屬該會判斷。"
      - "該聲明記錄截至2024-12-27高檢署尚未發布相關調查報告，不得推論截至2026年仍未發布。"
