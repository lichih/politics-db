facts:
  - id: F001
    statement: "羅大佑在2026年11月10日前後的廣播訪談提及蔡英文、蕭美琴、陳菊的婚育狀況及賴清德子女在美國，並以之評論政治人物是否會多為下一代著想。"
    status: verified
    observed_at: "2026-11-12T14:22:00+08:00"
    source_ids: [S001]
    evidence_summary: "中央社及其他同日新聞報導可核對事件與指涉；原始影片本次未直接逐字聽證。"
    verification_notes:
      - "是對訪談內容的報導確認，不宣稱所引述為完整原音逐字稿。"
    tags: ["羅大佑", "2026-11-10"]
  - id: F002
    statement: "蔡英文2026年11月11日公開回應沒有自己的孩子但以留下更好的台灣、孩子能安心做自己及婚姻平權入法說明對下一代的關懷。"
    status: verified
    observed_at: "2026-11-12T14:22:00+08:00"
    source_ids: [S001, S002]
    evidence_summary: "民視轉載蔡英文Threads全文；中央社另有獨立新聞報導。"
    verification_notes:
      - "回應含一項具體政策成果（婚姻平權），不可寫成完全不談任何政策。"
    tags: ["蔡英文", "2026-11-11"]
  - id: F003
    statement: "內政部出生登記數2016年208,440人；2024年134,856人，兩端點相較下降約35.3%。"
    status: verified
    observed_at: "2026-11-12T14:22:00+08:00"
    source_ids: [S004, S005]
    evidence_summary: "行政院性平統計資料庫2016年數與內政部戶政司2024年累計數；(208440-134856)/208440約35.3%。"
    verification_notes:
      - "2016及2024均為全年數字，不等於蔡英文2016年5月至2024年5月任期的精確首尾對照。"
      - "總出生數受育齡人口結構等因素影響，不能以端點比較單獨證明某一政策造成下降。"
    tags: ["出生人口", "少子化"]
  - id: F004
    statement: "蔡政府曾推動0至6歲國家一起養，包括增加平價托育量能、降低教保費用、提高育兒津貼等措施。"
    status: verified
    observed_at: "2026-11-12T14:22:00+08:00"
    source_ids: [S006, S007]
    evidence_summary: "行政院2021年規劃及2022年成果報告列出多項措施與當期執行數據。"
    verification_notes:
      - "存在措施不等於已證明其對整體出生人口的淨效果。"
    tags: ["少子化對策", "托育"]

claims:
  - id: C001
    statement: "是否有親生子女不足以推定政治人物是否關心下一代。"
    status: supported
    supports: [F001, F002]
    contradicts: []
    related_facts: []
    reasoning_notes: "這是對推論是否充分的邏輯判準，不是可由人口統計直接證明的人格判斷。"
  - id: C002
    statement: "2016至2024年間台灣出生人口下降，但僅由此不能確認蔡政府具體政策的因果效果。"
    status: supported
    supports: [F003, F004]
    contradicts: []
    related_facts: []
    reasoning_notes: "出生數端點下降是事實；因果需要另控制育齡人口結構等變項，不能寫成無政策或毫無成果。"
  - id: C003
    statement: "蔡英文的個人關懷回應已證明少子化政策成功。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F002, F003, F004]
    reasoning_notes: "貼文以婚姻平權和價值承諾回應家庭背景質疑，未提出少子化政策成效檢驗；但原發言也不限於少子化，不能改寫其原意。"

