notes:
  - "本紀錄採兩案跨黨派比較，而非把兩案粗略判成同一法律結果。政府宣導使用政治人物形象，是值得檢視的權力與資源分配；不能因政策內容正當，自動免除政治中立審查。"
  - "使用者對兩個陣營都能藉公權力使政治人物曝光表示強烈反感，屬價值評價；不作為外部違法事實存證。"
  - "國軍軍隊國家化與一般行政機關中立要求須分別找具體法源、作業規範，避免只用表面『政治人物曝光』判定兩案相同法律結果。"
  - "待查：臺北市垃圾車實際MP3逐字內容、過往是否慣例由市長錄音、選前是否有避免候選人曝光的替代作法；國軍2023年認知作戰教材全片、今年實際播放時間頻率與觀看人次、使用或汰換審查紀錄，以及顧立雄一週內承諾報告。"
