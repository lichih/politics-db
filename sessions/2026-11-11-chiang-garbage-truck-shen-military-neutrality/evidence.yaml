facts:
  - id: F001
    statement: "臺北市環保局2026年11月7日聲明，垃圾車於11月2日至21日播放蔣萬安錄製之公費疫苗宣導，音檔共1分18秒，並於新聞稿附原始音檔連結。"
    status: verified
    observed_at: "2026-11-11T19:24:00+08:00"
    source_ids: [S001]
    evidence_summary: "一手官方公告可直接確認政府確曾使用現任市長聲音進行宣導，以及公開的檔期與音檔資訊。"
    verification_notes:
      - "廣播內容之獨立核實仍需下載並聆聽原音檔；本筆僅將環保局具體說法及檔案公開列為已驗證事實。"
    tags: ["臺北市", "公權力宣導", "官方聲明"]

  - id: F002
    statement: "環保局2026年11月7日否認垃圾車播放「市長選舉請支持蔣萬安」等直接拉票用語，主張實際為疫苗宣導。"
    status: verified
    observed_at: "2026-11-11T19:24:00+08:00"
    source_ids: [S001]
    evidence_summary: "可證實機關正式否認之內容；機關公開提供供外界核對的音檔。"
    verification_notes:
      - "不能把環保局自述之「絕無違反行政中立」當成已由獨立法律機關裁判的結論。"
    tags: ["爭議澄清", "公器私用指控"]

  - id: F003
    statement: "TVBS刊載廖玉蕙2026年11月9日致歉聲明；她承認當時沒有取得完整錄音及核對文字內容，就將個人聽聞理解描述成選舉拉票，並撤回貼文。"
    status: verified
    observed_at: "2026-11-11T19:24:00+08:00"
    source_ids: [S002]
    evidence_summary: "道歉文字對原始具體拉票指控形成重要反證，應與是否使用現任市長聲音宣導政策分開評估。"
    tags: ["廖玉蕙", "更正", "拉票指控"]

  - id: F004
    statement: "國防部2026年11月10日新聞稿僅說明沈伯洋曾於2024年4月第3週參與莒光園地「抖音、TikTok如何影響國家安全」節目，稱其與2026地方選舉無關。"
    status: verified
    observed_at: "2026-11-11T19:24:00+08:00"
    source_ids: [S003]
    evidence_summary: "國防部原始新聞稿明確載明2024年節目與教育目的，並將相關質疑稱為不實；這份澄清未提到2023年錄製、仍供使用的另一批教材。"
    tags: ["國防部", "莒光園地", "2024節目"]

  - id: F005
    statement: "2026年11月11日，國防部政戰局長史順文在立法院表示，沈伯洋2023年7月錄製的認知作戰國防通識輔助教材仍供新兵訓練與教召使用。"
    status: verified
    observed_at: "2026-11-11T19:24:00+08:00"
    source_ids: [S004, S005]
    evidence_summary: "兩家媒體記錄同一場立法院答詢，至少確認國防部官員承認教材持續供相關課程使用；此與2024年莒光園地單次播映為兩種不同教材脈絡。"
    verification_notes:
      - "本次未取得完整課表、影片原檔或逐場播放日誌，不能逕行推定每一梯次或每一教召都播放。"
    tags: ["國軍", "2023教材", "新訓", "教召"]

  - id: F006
    statement: "顧立雄2026年11月11日說明國軍按專業邀請來賓，舉2026年邀請國民黨立委陳永康錄製莒光園地為例。"
    status: verified
    observed_at: "2026-11-11T19:24:00+08:00"
    source_ids: [S004, S005]
    evidence_summary: "記錄國防部的非黨派邀請理由及反例；此理由可說明原錄製背景，但不能替代對選舉期間持續使用的審查。"
    tags: ["國防部回應", "跨黨派", "陳永康"]

  - id: F007
    statement: "聯合報2026年11月11日報導顧立雄承諾一週內提出沈伯洋相關影片播放次數與觀看人次資料。"
    status: verified
    observed_at: "2026-11-11T19:24:00+08:00"
    source_ids: [S006]
    evidence_summary: "已可確認有提供後續資料的公開承諾；此時尚未取得承諾報告。"
    tags: ["待追蹤", "播放次數", "觀看人次"]

claims:
  - id: C001
    statement: "臺北市垃圾車曾直接播放要求市民在市長選舉支持蔣萬安的拉票口號。"
    status: contradicted
    contradicts: [F002, F003]
    related_facts: [F001]
    reasoning_notes: "環保局公布否認及音檔，原指控者也承認未查證並道歉；截至本次資料，不足以維持『直接拉票口號確曾播出』的主張。若有其他不同時地錄音，需另行核對。"

  - id: C002
    statement: "國軍2026年新訓與教召課程仍使用包含沈伯洋的認知作戰教材。"
    status: supported
    supports: [F005]
    related_facts: [F004]
    reasoning_notes: "支持的是2023年製作的國防通識教材持續供用，而不是已證明2024年特定一集莒光園地於2026年重播；兩者不可混同。"

  - id: C003
    statement: "國防部11月10日的澄清，已完整揭露沈伯洋影像於國軍內部的所有使用情況。"
    status: contradicted
    contradicts: [F004, F005]
    reasoning_notes: "11月10日只談2024年莒光園地，翌日才揭露另有2023年認知作戰輔助教材用於新訓／教召。這是回應範圍不完整，不宜誤寫成兩段陳述對同一影片在邏輯上直接矛盾。"

  - id: C004
    statement: "任一政府宣導使用政治人物聲音或影像，即必然構成違法助選或違反行政中立。"
    status: unsupported
    related_facts: [F001, F003, F005, F006]
    reasoning_notes: "音像出現與選舉直接動員有別；兩案均需要查內容、執行目的、當時身分、時序、受眾、替代方案與對各陣營適用的同一規範。軍隊與一般市政宣導的法律與制度要求也可能不同，不能不查法源就一律認違法。"

  - id: C005
    statement: "即使政策宣導或教育具有公共目的，是否應使用候選人／現任政治人物的個人聲音影像，仍是獨立且可被檢驗的公權力正當性問題。"
    status: supported
    supports: [F001, F005]
    related_facts: [F003, F004, F006]
    reasoning_notes: "這是制度評價及一致判準，不是特定違法構成要件的既定判決。判斷要問：非使用本人不可嗎？選舉前是否有審核、替代版本、下架或公平機制？不同執政陣營是否用同一把尺？軍隊政治中立須獨立從嚴檢視。"

  - id: C006
    statement: "兩案已足以證明國民黨與民進黨行政體系分別故意以公器為候選人拉票。"
    status: unsupported
    related_facts: [F001, F002, F003, F005]
    reasoning_notes: "兩案都具有公權力搭載政治人物曝光的客觀事實基礎，但政治效果不等於可直接證明意圖與違法；仍需具體播放內容、內部決策、選舉時序與運作紀錄。"

