      - "競辦亦提出保留現有松山機場直升機運作空間，以及將新北、桃園醫療資源納入整體規劃的構想。"
      - "此來源只證明蔣方確實提出過這些構想；其可行性仍需由相關中央部會、地方政府與醫療專業進一步評估。"

