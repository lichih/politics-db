facts:
  - id: F001
    statement: "至少自1995年起，民進黨政治人物曾反覆提出松山機場遷建或存廢主張；陳水扁任台北市長時成立遷建研究小組，之後李應元、謝長廷、姚文智、顧立雄、吳怡農等不同時期政治人物亦曾提出遷建相關主張。"
    status: verified
