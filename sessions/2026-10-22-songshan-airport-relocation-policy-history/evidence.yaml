    title: "昔選市長指「台北為松機犧牲太大」被翻出 顧立雄：我現在是國防部長"
    url: "https://udn.com/news/story/6656/9813933"
    published_at: "2026-10-14"
    observed_at: "2026-10-22T18:54:14+08:00"
    retrieval_status: reachable
    notes:
      - "立法院質詢時，羅智強引述顧立雄2014年爭取民進黨台北市長提名時的遷建政見。"
      - "顧立雄當場回應松機確實造成地區發展限制，存廢可討論；但以現任國防部長身分會把軍事任務與防衛韌性列為首要考量。"
      - "2014原始政見目前尚未直接取得，故歷史部分仍屬以2026年質詢與報導回溯確認。"

  - id: S004
    source_type: primary
    publisher: "國防部軍事新聞通訊社"
    title: "顧部長赴立院專案報告　兼顧軍民需求評估機場功能重塑"
    url: "https://mna.mnd.gov.tw/news/detail/?UserKey=a5f43e01-e02d-43ce-a1e0-216f9d1d026c"
    published_at: "2026-10-14"
    observed_at: "2026-10-22T18:54:14+08:00"
    retrieval_status: reachable
    notes:
      - "國防部官方紀錄顧立雄表示，軍民合用機場功能調整應將國家防衛韌性與軍事任務列入首要考量。"
      - "官方文字說明國防部會就遷建及功能重塑提供專業意見，確保整體防衛量能不受影響。"
      - "此來源未表示松山機場『不可能遷移』。"

