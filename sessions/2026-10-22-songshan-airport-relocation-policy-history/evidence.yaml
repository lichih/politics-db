    title: "民用航空法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0090001"
    observed_at: "2026-10-22T20:59:19+08:00"
    retrieval_status: reachable
    notes:
      - "第29條規定飛行場設立、出租、轉讓或廢止，須向民航局申請並經交通部會同有關機關核准。"
      - "第30條規定航空站及飛行場兼供他用須經民航局許可；借用軍用航空站及飛行場時，交通部應與國防部協議。"
      - "這些規定可證明松機功能廢止／調整及軍民使用涉及中央法定程序，不由臺北市長單獨決定。"

