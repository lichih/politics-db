claims:
  - id: C001
    statement: "「民進黨二十多年來一直有單一、正式且一致的遷松機黨政策。」"
    status: contradicted
    contradicts: [F007, F008]
    related_facts: [F001, F002, F003, F004, F005, F006, F009]
    reasoning_notes: "可證明的是民進黨陣營長期反覆有多位政治人物主張遷建；但張景森的歷史回顧顯示黨內不同時期並非一致，2015蔡英文團隊亦對時程有疑慮。"

  - id: C002
    statement: "「2015年蔡英文本人已明確定案支持2020年底遷建松山機場。」"
    status: unresolved
    related_facts: [F006, F007]
    reasoning_notes: "contemporaneous 公開場合中姚文智以代表蔡英文身分提出2020目標；但張景森2026年第一人稱回憶稱蔡英文團隊當時有疑慮並曾試圖阻止宣布。現有證據不足以把兩者壓成單一結論。"

  - id: C003
    statement: "「國防部2026年已表示現有防務不可能遷移，因此松山機場不能遷。」"
    status: contradicted
    contradicts: [F011]
    related_facts: [F015]
    reasoning_notes: "國防部官方文字是要求審慎評估替代、願意提供專業意見並確保防衛量能；沒有作出『不可能遷』的絕對結論。"

  - id: C004
    statement: "「蔣萬安2026年的松機主張是已經決定立即搬遷，現在就要執行。」"
