  - 賴清德把『洋流』描述為溫暖、豐盛、有方向且充滿力量，並稱其能照顧各族群與家庭、帶領台北走向世界、改變選舉風氣。
  - 官方敘事邀請市民透過數位參與成為『船員』與『造浪者』。
