facts:
- id: F001
  statement: 沈伯洋競選團隊把『洋流』明確作為長期品牌戰操作；綠營幕僚稱其為從提名起啟動的198天大型行銷活動，目的在打出品牌差異化並重塑候選人形象。
  status: verified
  observed_at: '2026-10-24T21:33:09+08:00'
  source_ids:
  - S001
  - S014
  evidence_summary: 《天下》直接以競選團隊主導品牌戰描述，並引述幕僚說明行銷與品牌差異化目的；中央社另記錄正式提名前團隊即已部署組織與形象活動。
  verification_notes:
  - 可證明品牌塑造是有意識的競選策略；不能僅由『有品牌戰』推出『造神』。
  - 《天下》中的『綠營幕僚』非具名 primary source，因此策略細節仍屬高接近度二手來源。
