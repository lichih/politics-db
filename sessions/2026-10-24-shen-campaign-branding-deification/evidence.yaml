  statement: 沈伯洋競選團隊與民進黨官方不是被動接受『洋流』現象，而是主動把『洋流』納入長期品牌塑造、正式競選組織、活動設計與支持者身份系統。
  status: supported
  supports:
  - F001
  - F002
  - F003
  - F007
  contradicts: []
