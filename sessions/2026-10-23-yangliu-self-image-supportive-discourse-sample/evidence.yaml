notes:
  - "本 session 的用途是保存一個存在性樣本，不是對洋流群體作心理或道德總結。"
  - "最有辨識力的後續觀察不是作者語氣，而是作者之後是否回到原始比較命題、承認反例、修正『一個談願景，一個拚動員』，或提出雙邊可比較資料。"
  - "若作者之後補出原始公文核實結果、雙邊動員資料或政策內容比較，應新增 evidence 並更新 claims，不因目前 pattern 預支其後續仍不修正。"
