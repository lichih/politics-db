      - "吳沛憶表示公文就是廣發周知，並說未來也會更加扎實動員支持者出來投票。"

facts:
  - id: F001
    statement: "沈伯洋在2026年10月4日公開把『洋流』描述為傾聽、獨立、具批判性、進步、包容，並強調尋求共識與匯聚後持續修正。"
    status: verified
    observed_at: "2026-10-23T14:36:49+08:00"
    source_ids: [S001]
    evidence_summary: "中央社對競總成立大會致詞的逐段報導直接記錄上述自我定義。"
    tags: ["2026", "洋流", "沈伯洋", "self-definition", "critical-thinking", "revision"]

  - id: F002
    statement: "沈伯洋競選團隊公開將其品牌策略描述為理念先行、以政策論述為主軸、理性正向且淡化藍綠對決。"
    status: verified
    observed_at: "2026-10-23T14:36:49+08:00"
    source_ids: [S002]
    evidence_summary: "天下雜誌引述競辦發言人及團隊策略說明，可證明競辦曾公開採用這組品牌描述。"
    tags: ["2026", "洋流", "campaign-branding", "policy-first", "depolarization"]

  - id: F003
    statement: "@wssr0927 原始貼文以多項國民黨負面選舉素材為基礎，最後做出『一個談願景，一個拚動員』的跨黨比較結論。"
    status: verified
    observed_at: "2026-10-23T14:36:49+08:00"
    source_ids: [S003]
    evidence_summary: "原文可直接觀察其素材選擇與最後跨黨角色分配。"
    verification_notes:
      - "本fact不判定該比較結論真假，只保存文本結構與作者實際提出的命題。"
    tags: ["2026", "Threads", "cross-party-comparison", "mobilization", "vision"]

  - id: F004
    statement: "在被指出民進黨／洋流相關活動也存在地方黨部動員的反例後，@wssr0927 要求提出該動員公文。"
    status: verified
    observed_at: "2026-10-23T14:36:49+08:00"
    source_ids: [S004, S005]
    evidence_summary: "回覆鏈顯示反例提出後，作者將討論聚焦到是否能提出民進黨地方動員公文。"
    tags: ["2026", "Threads", "counterexample", "evidence-demand"]

  - id: F005
    statement: "公開報導已記錄民進黨台北市黨部主委吳沛憶承認該黨部曾就沈伯洋競總成立大會發出公文給黨公職，並將此說明為過往競總活動的黨部形式；相關報導亦記錄動員責任額總計5300人。"
    status: verified
    observed_at: "2026-10-23T14:36:49+08:00"
    source_ids: [S008, S009]
    evidence_summary: "TVBS直接引述吳沛憶表示『該公文就是發給黨公職的公文』；聯合報亦記錄其對公文與後續動員的說明。"
    verification_notes:
      - "本fact證明公文存在與黨部動員行為有當事黨部主委公開承認及媒體交叉記錄；本次查核未取得黨部原始電子公文檔案作數位鑑識。"
      - "『5300人』來源仍包括許甫公布的責任額資料與媒體轉述；吳沛憶公開回應足以支持公文存在，不等同逐欄驗證附件每一數字。"
    tags: ["2026", "沈伯洋", "民進黨台北市黨部", "mobilization", "document", "5300"]

  - id: F006
    statement: "在收到包含公文主旨、5300人責任額與吳沛憶公開證實資訊的回覆後，@wssr0927 改要求『公文本人』，且在該回合沒有回頭修正或補強原先『一個談願景，一個拚動員』的跨黨比較。"
    status: verified
    observed_at: "2026-10-23T14:36:49+08:00"
    source_ids: [S006, S007, S008, S009]
    evidence_summary: "可直接觀察到證據要求由『看民進黨地方動員的公文』進一步轉為要求『公文本人』；同一回覆未處理原始跨黨比較的量化或對稱證據。"
    verification_notes:
      - "要求原始文件本身可以是合理的更高證據標準；本fact不推定作者是惡意換門檻。"
    tags: ["2026", "Threads", "evidence-threshold", "argument-sequence", "non-revision"]

claims:
  - id: C001
    statement: "本串可作為『遇到不利反例後，原跨黨比較未被立即修正，而討論轉向提高對反例文件的證據要求』的存在性樣本。"
    status: supported
    supports: [F003, F004, F005, F006]
    contradicts: []
    related_facts: [F001, F002]
    reasoning_notes: "這是對可觀察互動序列的分類，不判定作者主觀動機。原始文件當然比媒體轉述更直接，但在公文存在已獲當事黨部主委公開承認後，要求原件不能使先前證據退回到零。"

  - id: C002
    statement: "若把本串視為與『洋流』品牌敘事同方向的支持性論述樣本，則其在『批判性／持續修正／理性論述／淡化藍綠對決』等洋流自我宣稱特質上存在可觀察張力。"
    status: supported
    supports: [F001, F002, F003, F006]
    contradicts: []
    related_facts: [F004, F005]
    reasoning_notes: "張力來自：洋流品牌強調批判性、持續修正、政策論述與淡化藍綠，而本樣本在反例出現後未於觀察回合修正跨黨角色分配，且原文自身即採強烈的『一邊願景／一邊動員』陣營二分。這不等於證明作者正式屬於洋流，也不等於證明整體洋流違反品牌宣稱。"

  - id: C003
    statement: "要求查看原始公文本身是不正當或必然代表惡意換門檻。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F005, F006]
    reasoning_notes: "原始文件是更高直接性的證據，要求查看可以出於正常核實需求。可批評的是：較高證據要求不能抹除已存在的獨立承認與媒體交叉記錄，也不能替代原先跨黨比較命題本身的舉證。"

  - id: C004
    statement: "缺少原始公文影像或電子檔，就足以把『民進黨台北市黨部曾發動員公文』重新判為沒有證據。"
    status: contradicted
    supports: []
    contradicts: [F005]
    related_facts: [F006]
    reasoning_notes: "吳沛憶以台北市黨部主委身分公開承認公文是發給黨公職的公文，並說明其用途與黨部慣例；因此即使原始檔仍值得取得，公文存在並非無證據狀態。"

  - id: C005
    statement: "此單一互動樣本足以證明洋流支持者普遍缺乏批判性、不能接受反例，或整體洋流品牌虛假。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002, F003, F006]
    reasoning_notes: "單一帳號、單一爭論只能作存在性樣本；缺乏代表性抽樣、作者自我身份確認、跨帳號baseline與反例，不能外推群體普遍性。"

  - id: C006
    statement: "@wssr0927 已被公開資料充分證明是『洋流』成員或正式支持者。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F003]
    reasoning_notes: "本串可確認其論述把一方描寫為『談願景』並正面對照國民黨，但目前未保存作者自我認同為『洋流』成員的直接證據，因此不得把品牌一致性分析升格為身份認定。"

