sources:
  - id: S001
    source_type: secondary
    publisher: "中央社"
    title: "綠營大咖齊聚　沈伯洋競總成立盼溫暖「洋流」進北市府"
    url: "https://www.cna.com.tw/news/aipl/202610040174.aspx"
    published_at: "2026-10-04"
    observed_at: "2026-10-23T14:36:49+08:00"
    retrieval_status: reachable
    notes:
      - "沈伯洋在競總成立大會表示，洋流是『傾聽的、獨立的，具備批判性、進步和包容』，並稱要尋求共識、匯聚後不斷修正往前。"
      - "同場亦表示選戰之初決定採取討論政策、不選擇負面選舉方式。"

  - id: S002
    source_type: secondary
    publisher: "天下雜誌"
    title: "2026九合一選舉》沈伯洋如何造「洋流」？一場198天的台北市長品牌戰"
    url: "https://www.cw.com.tw/article/5143220"
    published_at: "2026-10-08"
    observed_at: "2026-10-23T14:36:49+08:00"
    retrieval_status: reachable
    notes:
      - "報導引述競辦發言人稱選戰策略為理念先行、論述政策為主軸，並形容沈伯洋『理性、正向與論述清楚』。"
      - "報導並稱團隊評估北市選民不喜歡污名化對手、互潑髒水，因此採淡化藍綠對決的品牌策略。"

  - id: S003
    source_type: commentary
    publisher: "Threads / @wssr0927"
    title: "以『一個談願景，一個拚動員』比較洋流與國民黨的原始貼文"
    url: "https://www.threads.com/@wssr0927/post/De0P5Bkn5f_"
    published_at: "2026-10-23"
    observed_at: "2026-10-23T14:36:49+08:00"
    retrieval_status: reachable
    notes:
      - "原文以普發三千、餐會、麵包、炒米粉、片面訊息、假消息與資訊操作等素材描寫國民黨選舉方式。"
      - "結尾明示『一個談願景，一個拚動員』『一個希望選民思考未來，一個只需要選民在投票當天做出選擇』。"
      - "本來源只能證明作者做出上述比較，不證明任何一方實際更依賴動員或更重政策。"

  - id: S004
    source_type: commentary
    publisher: "Threads / @lichihwu"
    title: "指出跨黨比較需要同一把尺並提出民進黨地方黨部動員反例"
    url: "https://www.threads.com/@lichihwu/post/De0eM4Tj2gk"
    published_at: "2026-10-23"
    observed_at: "2026-10-23T14:36:49+08:00"
    retrieval_status: reachable
    notes:
      - "回覆指出若要成立『一個談願景，一個拚動員』，需比較雙方動員依賴與政策內容，而不能只列其中一方素材。"
      - "並提出洋流相關活動亦有民進黨地方黨部動員公文作為反例方向。"

  - id: S005
    source_type: commentary
    publisher: "Threads / @wssr0927"
    title: "要求提出民進黨地方動員公文"
    url: "https://www.threads.com/@wssr0927/post/De02T_sEcFo"
    published_at: "2026-10-23"
    observed_at: "2026-10-23T14:36:49+08:00"
    retrieval_status: reachable
    notes:
      - "作者回覆『那我也要看你所謂民進黨地方動員的公文』。"

  - id: S006
    source_type: commentary
    publisher: "Threads / @lichihwu"
    title: "提供動員公文主旨、5300人責任額及吳沛憶公開證實資訊"
    url: "https://www.threads.com/@lichihwu/post/De02uanjzOq"
    published_at: "2026-10-23"
    observed_at: "2026-10-23T14:36:49+08:00"
    retrieval_status: reachable
    notes:
      - "回覆稱民進黨台北市黨部公文主旨為協助動員支持者參加沈伯洋競總成立大會，附件為『動員責任額』，總計5300人。"
      - "並指出台北市黨部主委吳沛憶已公開證實公文存在，表示這是黨部過往競總活動的形式。"

  - id: S007
    source_type: commentary
    publisher: "Threads / @wssr0927"
    title: "在取得上述回覆後要求『公文本人』"
    url: "https://www.threads.com/@wssr0927/post/De03IqekTLV"
    published_at: "2026-10-23"
    observed_at: "2026-10-23T14:36:49+08:00"
    retrieval_status: reachable
    notes:
      - "作者回覆『拿這個出來當證據害我很失望耶，我相信你一定可以拿到公文本人的』。"
      - "該回覆沒有在同一回合重新處理原先『一個談願景，一個拚動員』的跨黨比較命題。"

  - id: S008
    source_type: secondary
