    title: "沈伯洋「洋流」靠動員？許甫爆綠5300人責任額　吳沛憶解釋了"
    url: "https://news.tvbs.com.tw/politics/4029861"
    published_at: "2026-09-30"
    observed_at: "2026-10-23T14:36:49+08:00"
    retrieval_status: reachable
    notes:
      - "報導稱許甫公布一張沈伯洋競總成立大會動員責任額公文，總額5300人。"
      - "吳沛憶受訪明確表示『該公文就是發給黨公職的公文』，並稱這是台北市黨部過往競總活動的形式。"

  - id: S009
    source_type: secondary
    publisher: "聯合報"
    title: "沈伯洋競總大會動員遭酸「人造洋流」 吳沛憶認支持度還不夠：盼民眾多宣傳"
    url: "https://udn.com/news/story/124652/9786689"
