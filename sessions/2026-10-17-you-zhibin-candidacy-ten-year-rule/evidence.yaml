claims:
  - id: C001
    statement: "游智彬直到2025-04-16都仍實際保有中國大陸戶籍。"
    status: unresolved
    related_facts: [F005, F007]
    reasoning_notes: "目前官方公開資料確認的是主管機關此前沒有其繳附證明紀錄，以及2025-04-16完成繳附；本次查詢未取得能確認其大陸戶籍實際註銷日期的原始戶籍文件。"

  - id: C002
    statement: "游智彬具有《國籍法》意義下的『雙重國籍』，因此本案只是雙重國籍資格問題。"
    status: unsupported
    related_facts: [F003, F005, F007]
    reasoning_notes: "本案中選會與移民署實際援引的是兩岸條例下的戶籍／地區人民身分與喪失原籍證明制度，不宜把『兩岸雙重戶籍／身分』直接等同普通外國籍的雙重國籍問題。"

  - id: C003
    statement: "2004年第9條之1已經明文規定：若未按時提出喪失原籍證明，日後第21條的候選人十年期間一律自補交證明日起重新計算。"
    status: contradicted
    contradicts: [F003, F010]
    reasoning_notes: "第9條之1確有單一戶籍與六個月過渡補證要求，但條文本文未寫入第21條候選人十年期間的上述起算法律效果；這個明確起算規則見於2026核釋。"

  - id: C004
    statement: "2026-04-16核釋在文字上增加了一個第21條本文沒有明寫的十年起算基準。"
    status: supported
    supports: [F008, F010]
    reasoning_notes: "這是法條與核釋的文本比較；不等於已判定核釋違法。"

  - id: C005
    statement: "2026-04-16核釋因限制被選舉權，必然違反法律保留、禁止溯及或信賴保護而無效。"
    status: unresolved
    related_facts: [F009, F010, F013, F014, F015]
    reasoning_notes: "存在實質法律爭議：關鍵在於法院如何定性該核釋是對既有法律意旨的解釋，或是實質新增候選資格限制，以及具體是否存在可保護信賴、適用時點與比例原則問題。"

  - id: C006
    statement: "司法院釋字第618號已經裁判『原大陸地區人民設籍未滿十年不得登記公職候選人』合憲。"
    status: contradicted
    contradicts: [F011]
    reasoning_notes: "第618號理由書明確排除候選人部分，只審查公務員任用限制。"

  - id: C007
    statement: "游智彬2024年曾被正式審定可參選，足以單獨證明2026核釋違法。"
    status: unsupported
    related_facts: [F004, F008, F009]
    reasoning_notes: "2024資格審查是重要法安定性與實務背景，但現有紀錄不足以證明當時已具體審查同一個十年起算法律問題，因此不能單獨推出2026核釋違法。"

  - id: C008
    statement: "即使2004年對特定既有雙重戶籍／大陸護照者已有補證義務，該義務是否違反與『第21條候選人十年從何日起算』仍是兩個需要分別論證的法律問題。"
    status: supported
    supports: [F003, F008, F010]
    reasoning_notes: "2004條文處理單一戶籍與身分後果；2026核釋才明確把繳證日期連結到第21條十年起算。"

  - id: C009
    statement: "游智彬1995年設籍時依法完全不需要任何喪失原籍證明。"
    status: unresolved
    related_facts: [F002]
    reasoning_notes: "1995母法第16、17條文字本身不足以回答所有應備文件；定居許可辦法1993原始全文是關鍵。本次已確認該辦法1993訂定、1995-08-02全文修正，但尚未取得1995-07-17當日適用版本的完整官方條文。"

