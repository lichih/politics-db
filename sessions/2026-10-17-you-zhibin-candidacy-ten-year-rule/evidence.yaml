session:
  id: 2026-10-17-you-zhibin-candidacy-ten-year-rule
  project: Politics
  title: "游智彬2026參選資格：兩岸條例第21條十年起算與2026年陸委會核釋"
  started_at: "2026-10-17T23:12:00+08:00"
  updated_at: "2026-10-17T23:12:00+08:00"
  status: active

topics:
  - "游智彬"
  - "被選舉權"
  - "兩岸人民關係條例"
  - "第21條"
  - "喪失原籍證明"
  - "兩岸單一戶籍"
  - "行政核釋"
  - "法律保留"
  - "信賴保護"
  - "候選人資格"

sources:
  - id: S001
    source_type: primary
    publisher: "總統府"
    title: "制定臺灣地區與大陸地區人民關係條例"
    url: "https://www.president.gov.tw/Page/294/36795"
    published_at: "1992-07-31"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "1992年制定時，第21條即規定大陸地區人民經許可進入臺灣地區者，非在臺灣地區設有戶籍滿十年，不得登記為公職候選人。"
      - "第2條以是否在臺灣地區或大陸地區設有戶籍作為兩地區人民身分區分的重要基準。"

  - id: S002
    source_type: primary
    publisher: "臺北市法規查詢系統"
    title: "臺灣地區與大陸地區人民關係條例（1995-07-19歷史條文）"
    url: "https://laws.gov.taipei/Law/LawSearch/LawArticleContent/FL016528?date=19950719"
    published_at: "1995-07-19"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "1995年版本第21條仍以『在臺灣地區設有戶籍滿十年』作為公職候選人資格門檻。"
      - "當時第16條包含臺灣地區人民之直系血親及配偶中年齡十二歲以下者得申請定居的規定。"
      - "本來源只證明當時母法條文，不足以確認游智彬1995年實際適用何一申請類型及其完整應備文件。"

  - id: S003
    source_type: primary
    publisher: "全國法規資料庫"
    title: "臺灣地區與大陸地區人民關係條例"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=Q0010001"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "現行第21條仍使用『非在臺灣地區設有戶籍滿十年，不得登記為公職候選人』文字。"
      - "第9條之1規定臺灣地區人民不得在大陸地區設有戶籍或領用大陸地區護照；對2004年修法施行前已有相關狀態者，設有六個月內註銷並提出證明的過渡規定。"

  - id: S004
    source_type: primary
    publisher: "中華民國大陸委員會"
    title: "原陸籍人士繳附喪失原籍證明專案已完成查核"
    url: "https://www.mac.gov.tw/News_Content.aspx?n=05B73310C5C3A632&s=5285302FAA465234&sms=1A40B00E4C745211"
    published_at: "2025-06-26"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "陸委會表示查核專案自2024-10-01開始執行，並稱其目的之一為『解決自93年3月法律修正後遲未處理之問題』。"
      - "對2004年3月前已在臺設籍者，專案共通知12,146人；截至2025-06-25，5,534人已繳附證明文件。"

  - id: S005
    source_type: primary
    publisher: "內政部移民署"
    title: "兩岸條例明定兩岸單一戶籍之法律規範 移民署：依法通知繳附喪失原籍證明"
    url: "https://www.immigration.gov.tw/5382/5385/7229/7238/390261"
    published_at: "2025-04-10"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "移民署表示，其資訊系統紀錄顯示游智彬『確實未有繳附喪失原籍證明之紀錄』，因此通知其補繳。"
      - "此說法證明的是主管機關系統中未有既往繳附紀錄；其本身並未確認游智彬實際中國大陸戶籍直到2025年仍存在。"

  - id: S006
    source_type: primary
    publisher: "桃園市選舉委員會"
    title: "桃園市選舉委員會第117次委員會議紀錄"
    url: "https://web.cec.gov.tw/api/file/a95e6dd2-6a82-4dc0-86da-e9809c0b9e4a.pdf"
    published_at: "2023-12"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "第11屆立法委員選舉候選人資格審查案中，會議紀錄記載第3選舉區『游智彬等5人，均符合規定』。"
      - "紀錄同時記載中選會曾函請多個司法、警政、國防、銓敘等機關查證候選人消極資格。"
      - "此紀錄可證明2024立委選舉前曾有正式資格審查並認定符合規定，但不足以證明當時已具體審理『喪失原籍證明繳附日是否為第21條十年起算日』這一法律爭點。"

  - id: S007
    source_type: primary
    publisher: "行政院公報／大陸委員會"
    title: "陸法字第1150400418號令：核釋兩岸條例第21條設籍滿十年起算"
    url: "https://gazette.nat.gov.tw/egFront/eguploadpubWrapper?file=%2FEG_FileManager%2Feguploadpub%2Feg032067%2Fch01%2Ftype2%2Fgov04%2Fnum1%2FEg.htm&metaid=164900"
    published_at: "2026-04-16"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "陸委會核釋第21條所稱『在臺灣地區設有戶籍滿十年』，應自當事人向主管機關完成繳附喪失原籍證明之日為始日。"
      - "核釋理由援引第17條、第2條及第9條之1，主張未提出喪失原籍證明前尚未完成兩岸身分轉換。"

  - id: S008
    source_type: primary
    publisher: "中央選舉委員會"
    title: "中選會審定115年直轄市長、直轄市議員、縣（市）長及縣（市）議員選舉候選人資格"
    url: "https://web.cec.gov.tw/central/article/65213"
    published_at: "2026-10-16"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "中選會記載游智彬出生於福建省漳浦縣，1995-07-17憑入境證設籍，為原大陸地區人民。"
      - "中選會記載游智彬於2025-04-16繳附喪失中國大陸戶籍證明。"
      - "中選會依第21條第1項、2026-04-16陸委會核釋及公職人員選舉罷免法第27條第1項第5款，以自繳附證明日起算未滿十年為由，認定其不得登記為候選人。"

  - id: S009
    source_type: primary
    publisher: "憲法法庭"
    title: "司法院釋字第618號解釋"
    url: "https://cons.judicial.gov.tw/docdata.aspx?fid=100&id=310799&rn=-3609"
    published_at: "2006-11-03"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "第618號僅審查第21條中『不得擔任公務人員』部分；理由書明載不得登記為公職候選人等其餘部分不在該號解釋範圍內。"
      - "就公務員部分，大法官把十年期間的合理性連結到對自由民主憲政體制的認識、融入臺灣社會所需適應期間，以及人民對公權力行使的信賴。"

  - id: S010
    source_type: primary
    publisher: "憲法法庭"
    title: "112年憲判字第18號"
    url: "https://cons.judicial.gov.tw/docdata.aspx?fid=38&id=351004"
    published_at: "2023-12-01"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "判決指出選舉是彰顯主權在民、落實民意政治與責任政治不可或缺的手段，乃民主政治之根基。"
      - "憲法第17條選舉權保障範圍包括選舉投票權及被選舉權。"
      - "涉及選舉權差別待遇者，目的須追求憲法上重要公共利益，分類與目的達成間須具實質關聯。"

  - id: S011
    source_type: primary
    publisher: "憲法法庭"
    title: "司法院釋字第443號解釋"
    url: "https://cons.judicial.gov.tw/docdata.aspx?fid=100&id=310624&rn=15088"
    published_at: "1997-12-26"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "釋字第443號說明，涉及人民自由權利限制者原則上應由法律規定；若授權行政命令補充，授權應具體明確。"
      - "僅屬執行法律的細節性、技術性次要事項，主管機關才有較大空間以命令規範。"

  - id: S012
    source_type: primary
    publisher: "全國法規資料庫"
    title: "行政程序法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?kw=%E8%A1%8C%E6%94%BF%E7%A8%8B%E5%BA%8F%E6%B3%95&pcode=A0030055"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "第159條將行政規則定義為非直接對外發生法規範效力的一般、抽象規定，並包含為統一解釋法令而訂頒的解釋性規定。"

  - id: S013
    source_type: primary
    publisher: "憲法法庭"
    title: "司法院釋字第525號解釋"
    url: "https://cons.judicial.gov.tw/docdata.aspx?fid=100&id=310706&rn=13778"
    published_at: "2001-05-04"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "釋字第525號指出，行政法規包括解釋性或裁量性行政規則，其廢止或變更涉及人民權利時，可能有信賴保護問題。"
      - "是否具值得保護的信賴，仍須視是否有具體信賴表現、原規範是否合法及公益等因素判斷。"

  - id: S014
    source_type: primary
    publisher: "中華民國大陸委員會"
    title: "原陸籍人士公職資格說明（李貞秀案）"
    url: "https://www.mac.gov.tw/News_Content.aspx?n=05B73310C5C3A632&s=B72C2A1437E09863&sms=1A40B00E4C745211"
    published_at: "2026-02"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "陸委會公開主張：若原大陸地區人民未完成繳附喪失原籍證明且仍保有大陸戶籍，不能開始計算第21條十年期間。"
      - "陸委會並指出過往候選人資格審查未必曾向相關行政機關查證此項資料，將此視為制度缺口。"
      - "此來源代表行政機關的法律立場，不等同法院已確認該解釋合法。"

  - id: S015
    source_type: primary
    publisher: "中華民國大陸委員會"
    title: "大陸地區人民在臺灣地區依親居留長期居留或定居許可辦法（歷史條文沿革）"
    url: "https://www.mac.gov.tw/News_Content.aspx?n=29B3D06675FAF607&s=AC90D217CCC7FA94&sms=2EB2D59F2BF0C2BE"
    observed_at: "2026-10-17T23:12:00+08:00"
    retrieval_status: reachable
    notes:
      - "官方沿革記載本辦法於1993-02-08訂定全文31條，1995-08-02修正發布全文35條。"
      - "目前取得的官方歷史頁面可確認後期版本定居應備文件包含喪失原籍證明，但本次查詢尚未取得1995-07-17游智彬設籍當日所適用之1993原始全文。"

facts:
  - id: F001
    statement: "兩岸條例第21條自1992年制定時即以『在臺灣地區設有戶籍滿十年』作為原大陸地區人民登記公職候選人的限制條件；截至2026年現行條文仍維持此文字架構。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S001, S003]
    evidence_summary: "1992年總統府公報與現行全國法規資料庫均可直接比對。"
    tags: ["第21條", "十年", "被選舉權", "法律沿革"]

  - id: F002
    statement: "1995年版本的兩岸條例第21條同樣使用『在臺灣地區設有戶籍滿十年』；中選會記載游智彬於1995-07-17憑入境證設籍。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S002, S008]
    evidence_summary: "1995歷史條文與2026中選會候選資格審定公告相互印證設籍日期及當時第21條文字。"
    verification_notes:
      - "尚未取得游智彬1995年原始定居案卷，不能僅依年齡與母法推定其當年具體申請條款與應備文件。"
    tags: ["1995", "設籍", "游智彬"]

  - id: F003
    statement: "2004年施行的第9條之1建立兩岸單一戶籍／身分規範，並對修法施行前已在大陸地區設籍或領用大陸護照者，設置六個月內註銷或放棄並向內政部提出證明的過渡要求。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S003, S004]
    evidence_summary: "現行第9條之1仍保留該過渡條款文字；陸委會2025專案亦以2004年3月法律修正為歷史基準。"
    tags: ["2004", "第9條之1", "單一戶籍", "補證"]

  - id: F004
    statement: "2024年立法委員選舉前，桃園市選委會正式候選人資格審查紀錄將第3選舉區『游智彬等5人』列為『均符合規定』。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S006]
    evidence_summary: "桃園市選委會第117次委員會議紀錄直接記載該審查結論。"
    verification_notes:
      - "此事實不等於當時選委會已針對『喪失原籍證明繳附日是否為十年起算日』作成專門法律判斷。"
    tags: ["2024立委選舉", "候選人資格", "選委會"]

  - id: F005
    statement: "移民署於2025-04-10表示，資訊系統中確實沒有游智彬先前繳附喪失原籍證明的紀錄，並因此通知其補繳。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S005]
    evidence_summary: "移民署官方新聞稿明確使用『未有繳附喪失原籍證明之紀錄』。"
    verification_notes:
      - "『未有繳附紀錄』不等同於『已查證其大陸戶籍一直存在至2025年』。"
    tags: ["2025", "移民署", "補件", "未有紀錄"]

  - id: F006
    statement: "政府自2024-10-01啟動早年設籍原陸籍人士喪失原籍證明查核專案；陸委會稱此專案處理的是『自93年3月法律修正後遲未處理之問題』，並對2004年3月前已在臺設籍者通知12,146人。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S004]
    evidence_summary: "陸委會2025-06-26官方新聞稿提供專案起始時間、對象數量及對歷史行政問題的描述。"
    tags: ["2024", "2025", "查核專案", "行政歷史"]

  - id: F007
    statement: "中選會2026年公告記載，游智彬於2025-04-16完成繳附喪失中國大陸戶籍證明。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S008]
    evidence_summary: "中選會候選資格審定公告直接記載繳附日期。"
    verification_notes:
      - "公告記載的是向臺灣主管機關繳附證明的日期，不足以直接證明中國大陸戶籍實際註銷日就是2025-04-16。"
    tags: ["2025-04-16", "繳附證明", "中選會"]

  - id: F008
    statement: "2026-04-16陸委會發布陸法字第1150400418號令，明確把第21條『在臺灣地區設有戶籍滿十年』的起算日解釋為向主管機關完成繳附喪失原籍證明之日。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S007]
    evidence_summary: "行政院公報刊載的核釋原文明定起算時點。"
    tags: ["2026-04-16", "陸委會核釋", "十年起算"]

  - id: F009
    statement: "2026年中選會依第21條、第1150400418號令及選罷法第27條第1項第5款，以游智彬自2025-04-16繳附證明後未滿十年為由，認定其不得登記為臺北市議員候選人。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S008]
    evidence_summary: "中選會2026-10-16候選人資格審定公告直接載明理由與法源。"
    tags: ["2026選舉", "候選人資格", "中選會", "游智彬"]

  - id: F010
    statement: "第21條法律本文並未寫明『自繳附喪失原籍證明日起滿十年』；這一明確起算規則出現在2026-04-16陸委會核釋。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S003, S007]
    evidence_summary: "可由現行第21條法條文字與2026核釋逐字比較確認。"
    verification_notes:
      - "此事實只描述規範文字來源；是否屬合法解釋、是否只是說明法律原本隱含之意，仍是法律評價問題。"
    tags: ["法律文字", "行政解釋", "起算點"]

  - id: F011
    statement: "司法院釋字第618號並未審查第21條對『公職候選人』的十年限制是否合憲；該號解釋只審查不得擔任公務人員部分。"
    status: verified
    observed_at: "2026-10-17T23:12:00+08:00"
    source_ids: [S009]
