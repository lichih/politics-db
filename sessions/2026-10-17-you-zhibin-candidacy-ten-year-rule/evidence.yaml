notes:
  - "本session刻意區分三件事：實際大陸戶籍是否存在、何時向臺灣主管機關繳交喪失原籍證明、以及第21條候選人十年期間如何起算。三者不得互相代替。"
  - "2004年已有單一戶籍及特定過渡補證義務，不能寫成『2025以前完全沒有補證規定』；真正於2026明確出現的是把繳證日連結為第21條十年起算日的核釋。"
  - "2024年候選資格審查與2026年相反結果構成重要法安定性背景，但不能逕稱2024已對同一法律爭點作成終局判斷。"
  - "政治評論可主張此案涉及行政權能否以解釋性規則實質改變被選舉權門檻；但 evidence ledger 應把『核釋違法／違憲』維持為 unresolved，直到司法裁判或更完整法源分析出現。"
