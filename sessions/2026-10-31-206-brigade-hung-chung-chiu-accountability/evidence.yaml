facts:
  - id: F001
    statement: "2013年8月1日公視報導記錄，顧立雄以洪家律師身分批評軍檢對高階軍官與基層士官責任追究失衡。"
    status: verified
    observed_at: "2026-10-31T15:00:00+08:00"
    source_ids: [S001]
    evidence_summary: "原始報導刊有當年顧立雄關於制度、階級與讓基層扛罪責的直接引述。"
    tags: ["2013", "洪仲丘", "顧立雄"]
  - id: F002
    statement: "2026年10月30日顧立雄公開表示206旅女中尉案經調查有管理疏失，旅長及政戰主任已調職，相關人員受到懲處。"
    status: verified
    observed_at: "2026-10-31T15:00:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "國防部官方說明及中央社採訪互相支持。"
    tags: ["2026", "206旅", "管理疏失"]
  - id: F003
    statement: "2026年10月30日國防部亦公開承認206旅另一起義務役士兵金錢糾紛有未及時向上呈報問題。"
    status: verified
    observed_at: "2026-10-31T15:00:00+08:00"
    source_ids: [S002]
    evidence_summary: "軍聞社引述顧立雄本人說明，與女中尉案須分別處理。"
    tags: ["2026", "206旅", "通報"]
  - id: F004
    statement: "2026年10月30日TVBS報導家屬認為旅長、政戰主任調職不足以回答心輔制度疑問。"
    status: verified
    observed_at: "2026-10-31T15:00:00+08:00"
    source_ids: [S004]
    evidence_summary: "能證明家屬已提出制度面質疑，不能單憑家屬陳述確定懲處程序有無完成。"
    tags: ["2026", "家屬", "心輔"]

  - id: F005
    statement: "2013年7月20日，顧立雄公開表示軍檢調查不足以給社會所有真相，並主張透過普通檢察機關介入，律師團隨後實際向桃園地檢署遞狀。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S009, S007]
    evidence_summary: "中央社當日報導保存顧立雄直接引述；自由時報後續報導確認23日實際遞狀及主張普通司法主動偵辦。"
    tags: ["2013", "顧立雄", "洪仲丘", "第三方調查", "外部司法"]
  - id: F006
    statement: "2013年7月20日，公民1985提出的核心要求包括第三方司法介入、保存關鍵證物並交專業單位鑑定、保障證人及改革軍中申訴制度；國防部副部長楊念祖公開接受並簽署承諾。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S008, S010]
    evidence_summary: "BBC與公視對當日抗議訴求及國防部接受內容相互支持。"
    tags: ["2013", "公民1985", "第三方調查", "證據保存", "制度改革"]
  - id: F007
    statement: "洪家在2013年7月18日前後即公開批評軍檢偵辦速度與資訊不足，並要求公正第三方介入調查。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S011]
    evidence_summary: "TVBS記錄洪家須透過媒體掌握進度，並直接引述希望第三方介入。"
    tags: ["2013", "洪家", "第三方調查", "資訊不足"]
  - id: F008
    statement: "桃園地檢署與高檢署之後實際進入軍營蒐證，並就湮滅證據、偽造文書等普通司法管轄事項展開調查。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S012, S014, S007]
    evidence_summary: "多家同期報導記錄普通司法介入及具體調查項目。"
    tags: ["2013", "桃檢", "湮滅證據", "偽造文書"]
  - id: F009
    statement: "2013年白衫軍初期公開訴求的重心是取得真相與制度改革，而非一開始即把國防部長下台設定為唯一或首要要求。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S008, S010]
    evidence_summary: "同期BBC與公視均列出第三方司法、證據保存、證人安全及申訴制度改革等具體訴求。"
    tags: ["2013", "白衫軍", "政治責任", "制度改革"]
  - id: F010
    statement: "2013年律師團策略不只追究死亡本身，也透過滅證、偽造文書、醫療過失等可由普通司法處理的疑點，擴大外部可檢驗範圍。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S007, S013]
    evidence_summary: "自由時報與TVBS均記錄顧立雄等律師向桃檢提出多項告發方向。"
    tags: ["2013", "律師團", "外部可檢驗性"]

