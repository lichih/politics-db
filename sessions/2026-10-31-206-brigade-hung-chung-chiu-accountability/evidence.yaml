notes:
  - "延伸既有 research/2026-10-23-asymmetric-political-evaluation-standards/evidence.yaml 的判準，但不能以單一跨案比較直接證明政黨因素造成結果差異。"
  - "後續優先核對2013年公開揭露與究責要求的實際內容，及2026年國防部已向公眾、家屬、立法院提供哪些可核對的管理事實與理由；完整內部報告或懲處令不是提出雙標質疑的前置條件。仍可查是否有合法限制揭露的理由及不同案情的反證。"
  - "本次只保存有明確來源的可重用材料；先前聊天中未重新驗證的說法不升格為verified。"
  - "2026-10-31對分析框架的修正：先前以『取得完整行政調查資料、懲處命令才能判斷雙標』為研究前提，錯將監督方取得內部資料視為先決舉證責任。更合適的問題是主管機關已公開的說明能否被核對、與2013年相同人物要求的公開標準是否一致。此為研究判準修正，不等於已證實資料未公開或刻意隱瞞。"
  - "2026-11-07歷史搜尋方法修正：跨時期政治案件應先鎖定事件年代，再使用當時的事件語彙、機關與行動搜尋，最後才用今日研究命題分類；避免直接以『雙標／公開／究責』等後設詞造成歷史原始報導漏搜。"
  - "本輪新增反證邊界：2013年初期訴求並非單純要求首長下台，也未找到顧立雄要求所有調查資料無例外全部公開的直接原話；真正可核實的是第三方介入、證據保存、真相與責任鏈的外部可檢驗性。"
  - "2026-11-07揭露序列：11/2陸軍以案情及個資不宜公開；11/3顧立雄明列家屬同意；11/4家屬書面授權後，顧改以需了解檢方態度及適當方式處理。這可支持『揭露門檻發生變化』的描述，但不足以單獨證明主觀掩蓋或包庇。"
  - "司法偵查與行政公開需分層：偵查不公開可限制具體證據、第三人資料或偵查策略，但目前沒有證據支持因此整份行政／法紀調查當然不可公開；較穩健的監督要求是說明法源、遮蔽不可公開部分並揭露其餘可審計內容。"
