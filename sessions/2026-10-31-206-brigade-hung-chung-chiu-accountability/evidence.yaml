facts:
  - id: F001
    statement: "2013年8月1日公視報導記錄，顧立雄以洪家律師身分批評軍檢對高階軍官與基層士官責任追究失衡。"
    status: verified
    observed_at: "2026-10-31T15:00:00+08:00"
    source_ids: [S001]
    evidence_summary: "原始報導刊有當年顧立雄關於制度、階級與讓基層扛罪責的直接引述。"
    tags: ["2013", "洪仲丘", "顧立雄"]
  - id: F002
    statement: "2026年10月30日顧立雄公開表示206旅女中尉案經調查有管理疏失，旅長及政戰主任已調職，相關人員受到懲處。"
    status: verified
    observed_at: "2026-10-31T15:00:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "國防部官方說明及中央社採訪互相支持。"
    tags: ["2026", "206旅", "管理疏失"]
  - id: F003
    statement: "2026年10月30日國防部亦公開承認206旅另一起義務役士兵金錢糾紛有未及時向上呈報問題。"
    status: verified
    observed_at: "2026-10-31T15:00:00+08:00"
    source_ids: [S002]
    evidence_summary: "軍聞社引述顧立雄本人說明，與女中尉案須分別處理。"
    tags: ["2026", "206旅", "通報"]
  - id: F004
    statement: "2026年10月30日TVBS報導家屬認為旅長、政戰主任調職不足以回答心輔制度疑問。"
    status: verified
    observed_at: "2026-10-31T15:00:00+08:00"
    source_ids: [S004]
    evidence_summary: "能證明家屬已提出制度面質疑，不能單憑家屬陳述確定懲處程序有無完成。"
    tags: ["2026", "家屬", "心輔"]

  - id: F005
    statement: "2013年7月20日，顧立雄公開表示軍檢調查不足以給社會所有真相，並主張透過普通檢察機關介入，律師團隨後實際向桃園地檢署遞狀。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S009, S007]
    evidence_summary: "中央社當日報導保存顧立雄直接引述；自由時報後續報導確認23日實際遞狀及主張普通司法主動偵辦。"
    tags: ["2013", "顧立雄", "洪仲丘", "第三方調查", "外部司法"]
  - id: F006
    statement: "2013年7月20日，公民1985提出的核心要求包括第三方司法介入、保存關鍵證物並交專業單位鑑定、保障證人及改革軍中申訴制度；國防部副部長楊念祖公開接受並簽署承諾。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S008, S010]
    evidence_summary: "BBC與公視對當日抗議訴求及國防部接受內容相互支持。"
    tags: ["2013", "公民1985", "第三方調查", "證據保存", "制度改革"]
  - id: F007
    statement: "洪家在2013年7月18日前後即公開批評軍檢偵辦速度與資訊不足，並要求公正第三方介入調查。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S011]
    evidence_summary: "TVBS記錄洪家須透過媒體掌握進度，並直接引述希望第三方介入。"
    tags: ["2013", "洪家", "第三方調查", "資訊不足"]
  - id: F008
    statement: "桃園地檢署與高檢署之後實際進入軍營蒐證，並就湮滅證據、偽造文書等普通司法管轄事項展開調查。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S012, S014, S007]
    evidence_summary: "多家同期報導記錄普通司法介入及具體調查項目。"
    tags: ["2013", "桃檢", "湮滅證據", "偽造文書"]
  - id: F009
    statement: "2013年白衫軍初期公開訴求的重心是取得真相與制度改革，而非一開始即把國防部長下台設定為唯一或首要要求。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S008, S010]
    evidence_summary: "同期BBC與公視均列出第三方司法、證據保存、證人安全及申訴制度改革等具體訴求。"
    tags: ["2013", "白衫軍", "政治責任", "制度改革"]
  - id: F010
    statement: "2013年律師團策略不只追究死亡本身，也透過滅證、偽造文書、醫療過失等可由普通司法處理的疑點，擴大外部可檢驗範圍。"
    status: verified
    observed_at: "2026-11-07T16:25:00+08:00"
    source_ids: [S007, S013]
    evidence_summary: "自由時報與TVBS均記錄顧立雄等律師向桃檢提出多項告發方向。"
    tags: ["2013", "律師團", "外部可檢驗性"]

claims:
  - id: C005
    statement: "2013年要求軍方充分交代責任鏈、2026年身為主管機關首長時亦應採一致的對外揭露與究責說明標準。"
    status: supported
    supports: [F001, F002]
    related_facts: [F004]
    reasoning_notes: "同一政治人物在不同角色下的公開責任標準可比較；2013年的完整發言及2026年已公開資料的範圍，仍須逐項核對。此命題主張一致可審計性，不預斷司法因果或誰必須下台。"
  - id: C006
    statement: "行政調查報告與懲處命令未完整公開，會使外部社會較難獨立核對軍方所稱管理疏失及究責是否相稱。"
    status: unresolved
    supports: [F002, F004]
    reasoning_notes: "這是可審計性判準；尚未進行公開資訊、立院送達、家屬閱覽與隱私限制等範圍的全面查詢，不可把『本次未取得』寫成『根本沒有公開』。"
  - id: C007
    statement: "公眾必須先取得完整未遮蔽的內部調查資料，才有資格質疑政治究責或資訊揭露不足。"
    status: contradicted
    contradicts: [F001, F002, F004]
    reasoning_notes: "政治監督可先依政府已確認的管理疏失、公開處置與歷史主張，檢驗主管機關是否提供足供外界核對的說明。完整原始內部文件不是提出透明度質疑的前置資格；惟涉及個資、醫療隱私、偵查不公開者，可採遮蔽或其他方式說明。"
  - id: C008
    statement: "未公布完整行政調查與懲處資料，即可證明政府內部沒有調查，或顧立雄已故意隱匿事實。"
    status: unsupported
    supports: []
    related_facts: [F002, F004]
    reasoning_notes: "公開資料不足與內部不存在、故意隱匿是不同命題，後兩者須獨立證據。"
  - id: C001
    statement: "2013年的顧立雄要求追查軍方較高層責任；2026年的國防部長顧立雄應就同類責任分配公開提出可核對的究責說明。"
    status: supported
    supports: [F001, F002]
    contradicts: []
    related_facts: [F003, F004]
    reasoning_notes: "這是由跨時期公開立場推導的一致標準要求，不等於認定兩案刑事構成要件相同。"
  - id: C002
    statement: "顧立雄在2026年已被證實把全部責任推給基層，違背2013年本人標準。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F001, F002]
    reasoning_notes: "現有證據能證明調職、懲處與部分管理疏失，不能證明責任調查的完整範圍、上級是否另有檢討或後續調查結果。"
  - id: C003
    statement: "206旅女中尉遭言語霸凌直接導致死亡，已由司法機關正式認定。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "現有材料僅能確認疑似霸凌指控及管理疏失，不能把因果推論寫成已認定事實。"
  - id: C004
    statement: "同一個旅有兩起不同事件的管理或通報問題，值得查證是否存在共同制度缺陷。"
    status: supported
    supports: [F002, F003]
    related_facts: [F004]
    reasoning_notes: "支持進一步查詢的必要性，並非已證實兩案存在共同因果。"

  - id: C009
    statement: "2013年顧立雄可被核實的標準，較精確地說是『軍方自我調查不足時，應讓外部司法介入並使證據、責任與制度問題可被外部檢驗』，而不是籠統的『所有調查資料全部公開』。"
    status: supported
    supports: [F005, F006, F008, F010]
    related_facts: [F001, F009]
    reasoning_notes: "現有同期來源直接支持第三方介入、證據保存、真相與責任追究；尚未找到顧立雄本人要求一切調查資料毫無例外全部公開的直接原話。"
  - id: C010
    statement: "把2013年標準簡化為『顧立雄要求全部公開』會降低比較的精確度。"
    status: supported
    supports: [F005, F006, F009]
    reasoning_notes: "同期訴求存在第三方司法、證物保存與制度改革等更具體內容，也承認司法偵查本身有程序邊界；比較2026時應將刑事偵查秘密與行政責任可審計性分開。"
  - id: C011
    statement: "2013與2026的雙標比較應聚焦於：軍方自我說明不足時，是否允許外部檢驗、是否交代可公開的事實與責任鏈，以及行政責任是否因司法偵查存在而被整體遮蔽。"
