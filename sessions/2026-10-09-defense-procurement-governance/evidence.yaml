facts:
  - id: F001
    statement: "『顧立雄沒當過兵』為錯誤說法；其退伍令顯示1980年入伍、1982年退伍，曾任陸軍少尉運輸排長。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S001]
    evidence_summary: "可批評其國防政策或專業，但不能以『沒當過兵』作為事實前提。"
    verification_notes:
      - "來源為事實查核中心，關鍵原始資料是顧立雄辦公室提供的退伍令。"
    tags: [顧立雄, 兵役, fact-check]

  - id: F002
    statement: "監察院2024年正式糾正國防部外島無人機反制系統委託研究案，認定國防部未循正常預算及武器獲取程序，改以委託研究向國防工業發展基金會申請預算，欲快速取得2套無人機干擾設備。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S002, S004]
    evidence_summary: "監察院將此作法明確描述為迴避正常法令規定程序，並認定國防部有違失。"
    verification_notes: []
    tags: [監察院, 糾正, 無人機反制, 程序]

  - id: F003
    statement: "監察院認定陸軍在該委託研究案遴選時，未落實要求同一團隊廠商提出合作意向書或其他書面證明，影響評選公正性與後續執行成效。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S002, S004]
    evidence_summary: "問題不只在進度，而包含遴選程序與團隊整合能力的事前把關。"
    verification_notes: []
    tags: [遴選, 評選公正性, 無人機反制]

  - id: F004
    statement: "監察院認定陸軍事前已明知參與廠商技術能力不足、無法達成預期成效，仍堅持辦理委託研究案，並遴選一家廠商進行兩套相同設備研究。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S002, S004]
    evidence_summary: "這是監察院正式違失認定，不是單純事後推測廠商能力不足。"
    verification_notes: []
    tags: [技術能力, 廠商資格, 監察院]

  - id: F005
    statement: "監察院調查文件顯示，前述科研案原被要求完成2套不同成果與部署驗收，以作為後續『陸軍外島26套無人機反制系統採購案』參考；但科研案時程延宕，後續採購規格先行訂定，研究成果已無從作為採購參考。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S003]
    evidence_summary: "兩案法律屬性不同，但在建案脈絡上存在明確前後關聯；監察院正是因其失去原定參考功能而調查公帑與程序問題。"
    verification_notes:
      - "不可把兩案寫成同一份契約；陸軍2026年亦強調兩案屬性不同。"
    tags: [科研案, 26套採購, 建案關聯]

  - id: F006
    statement: "後續26套無人機反制系統公開採購案（TK13006L188）自2024年起多次公告／更正，2025年1月由創未來科技得標，決標金額約9.8781億元。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S005]
    evidence_summary: "正式採購案在監察院2024年糾正後繼續推進並於2025年決標。"
    verification_notes:
      - "此來源為政府電子採購網資料之第三方彙整；日後可補政府採購網原始決標公告。"
    tags: [創未來, 26套, 決標, 無人機反制]

  - id: F007
    statement: "創未來在26套無人機反制系統案的交貨驗收及兩次複驗均不合格，陸軍呈報解約；顧立雄表示將依約計罰、沒收履約保證金、解除契約，且不支付任何合約價金。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S006, S007, S008]
    evidence_summary: "驗收機制最終阻止不合格裝備付款，但原定戰力未依期形成。"
    verification_notes:
      - "『三次』指首次交貨驗測加兩次複驗，不應寫成三份不同契約。"
    tags: [驗收失敗, 解約, 創未來, 戰力形成]

  - id: F008
    statement: "國防部2026年7月提交立法院的專案報告，將『廠商履約能力不足』列為軍品採購履約爭議與獲裝延宕的主要原因之一，並稱部分案件在規劃階段未能事先掌握市場供應能力、技術成熟度與廠商履約能力。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S009]
    evidence_summary: "國防部自身承認前端能力辨識不足會造成後端履約風險。"
    verification_notes: []
    tags: [國防部, 履約能力, 採購治理]

  - id: F009
    statement: "同一份國防部報告提出的精進措施包括：前期市場調查、供應鏈分析、掌握廠商履約能力、強化需求與風險評估，以及建立替代來源／第二供應來源。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S009]
    evidence_summary: "後續制度精進方向本身證明國防部認為『廠商能力的事前審查』需要補強，而不能只依靠事後驗收與解約。"
    verification_notes: []
    tags: [精進措施, 事前審查, 第二供應來源]

  - id: F010
    statement: "RDX火藥原物料採購案招標資格為合法設立、具國際貿易業營業項目及納稅證明；2025年兩次開標均僅福麥一家投標。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S010]
    evidence_summary: "資格設計主要確認公司合法性與貿易資格，輸出許可與實際履約能力則在決標後由契約條件把關。"
    verification_notes: []
    tags: [RDX, 福麥, 投標資格]

  - id: F011
    statement: "福麥得標RDX案後未能在期限內取得輸出入許可文件，國防部其後辦理解約、逾期計罰、沒收履約保證金並刊登停權，後續改以追加／年度預算擴充國內自製產線。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S011, S012]
    evidence_summary: "該案再次呈現『先決標、再以輸出許可與履約條件篩選，失敗後解約』的採購風險。"
    verification_notes:
      - "中央社報導逾期罰款與沒收履約保證金合計約8398萬元。"
    tags: [RDX, 解約, 輸出許可, 履約]

  - id: F012
    statement: "國防部說明近10年9公厘手槍彈同類採購的廠商資格，主要是合法設立、同時具槍砲彈藥刀械輸出入業與國際貿易業，以及納稅證明；決標後才要求取得外國輸出許可、經濟部進口同意並接受交貨品質與性能檢驗。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S013]
    evidence_summary: "部分『內購外貨』軍火案制度設計，確實把相當一部分供貨能力與品質風險留到決標後的履約與驗收階段處理。"
    verification_notes:
      - "這一制度安排本身不等於違法或弊案；其政策問題是是否適合高迫切性、不可延誤的軍需。"
    tags: [手槍彈, 軍火代理, 投標資格, 內購外貨]

  - id: F013
    statement: "2026年7月顧立雄一方面稱無人載具採購是『迫切需求』，另一方面26套無人機反制系統案因承商驗測與兩次複驗不合格而解約。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S008]
    evidence_summary: "這形成『需求迫切』與『採購履約失敗導致戰力延宕』之間可直接檢驗的政策張力。"
    verification_notes: []
    tags: [迫切需求, 戰力延宕, 政策一致性]

claims:
  - id: C001
    statement: "外島無人機反制案不能只用『軍購本來就難、偶爾會出包』完整解釋。"
    status: supported
    supports: [F002, F003, F004, F005, F007]
    contradicts: []
    related_facts: [F008, F009]
    reasoning_notes: "監察院已在前期正式認定存在繞程序、遴選把關不足及明知技術能力不足仍辦理等違失；後續正式採購又發生驗收與兩次複驗全部不合格。這些事實超出單純不可預見的技術失敗範圍。"

  - id: C002
    statement: "目前公開證據足以支持『國防採購治理存在結構性的廠商履約能力辨識與風險管理問題』。"
    status: supported
    supports: [F004, F007, F008, F009, F010, F011, F012]
    contradicts: []
    related_facts: []
    reasoning_notes: "監察院與國防部各自從不同角度指出前端廠商能力把關及後端履約風險；國防部2026年更把掌握廠商履約能力列為後續精進重點。"

  - id: C003
    statement: "『只要最後沒付款、沒收保證金，就代表採購治理沒有造成國安損失』。"
    status: contradicted
    supports: []
    contradicts: [F007, F013]
    related_facts: [F008]
    reasoning_notes: "不付款與沒收保證金可以降低財務損失，卻無法恢復已延誤的獲裝時間與缺失戰力；國防部自己的報告亦把履約失敗視為獲裝期程延宕問題。"

  - id: C004
    statement: "『顧立雄沒當過兵』。"
    status: contradicted
    supports: []
    contradicts: [F001]
    related_facts: []
    reasoning_notes: "退伍令與查核資料均顯示其曾服役。"

  - id: C005
    statement: "『2024監察院糾正的委託研究案』與『2025決標的26套公開採購案』是完全無關的兩件事。"
    status: contradicted
    supports: []
