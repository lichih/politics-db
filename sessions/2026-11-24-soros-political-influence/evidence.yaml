notes:
  - "本資料為取證階段，不代表使用者認同或反對索羅斯，也不是評論草稿。"
  - "避免由資助推定控制、由改革推定侵權責任，亦避免以尚未證明嚴重指控來淡化已證實的政治介入。"
  - "喬治亞、匈牙利、塞爾維亞及波蘭其餘社群貼文內容仍需進一步原始取證，不因前次回答提及便提升為verified。"
  - "待補：AIT與OSF/FOSI逐筆實際核撥及用途；美國選委會原始申報；烏克蘭清理法起草紀錄；波蘭2024年相關司法措施的基金會參與文件；戰爭與放空交易關聯。"
