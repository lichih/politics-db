facts:
  - id: F001
    statement: "2026年10月14日，台北101董事長賈永婕赴立法院財政委員會備詢時，召委賴惠員公開建議她「下次請穿得跟我們一樣，一樣的這個純樸」；賈永婕當場回應自己的穿著與委員相似，事後表示錯愕。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S001, S002]
    evidence_summary: "立法院官方會議頁確認會議與賴惠員發言，新聞影音保存現場對話。"
    tags: [賈永婕, 賴惠員, 服儀爭議]

  - id: F002
    statement: "賴惠員於10月14日事後就服儀言論公開道歉，並表示原意涉及國會場合正式性而非批評賈永婕個人穿著風格。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S002]
    evidence_summary: "TVBS報導記錄賴惠員事後說明與道歉。"
    tags: [賴惠員, 道歉]

  - id: F003
    statement: "蔡康永10月15日宣布將出席蔣萬安10月26日競總成立活動、坐在台下且不上台歌舞，並寫「有鑑於近日政壇忽然追求服裝儀容的端莊肅穆，因此康永將穿黑色西裝前往，以表重視」。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S003]
    evidence_summary: "中央社完整引述蔡康永社群文字。"
    tags: [蔡康永, 黑西裝, 端莊肅穆]

  - id: F004
    statement: "蔡康永「黑西裝／端莊肅穆」貼文發布後，賈永婕本人於該貼文下留言「哈哈哈，不要啦，要穿最閃亮的」；同日多家媒體也將蔡的服裝文字與10月14日賈永婕／賴惠員服儀爭議連結。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S004, S005]
    evidence_summary: "賈永婕本人互動與新聞時間線共同支持「近日政壇服裝儀容」至少明確存在賈永婕事件這個直接背景。"
    tags: [黑西裝, 賈永婕, 語境]

  - id: F005
    statement: "10月15日同一波網路討論中，另有部分網友把「黑色西裝」聯想到「告別式」，政治工作者周軒則以「京都式的禮貌」形容蔡康永的文字；蔡本人在該則黑西裝貼文中沒有寫「告別式」、「落選」或「蔣萬安會輸」。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S003, S005]
    evidence_summary: "可驗證的是外界另行產生告別式／京都式禮貌解讀；這些字眼不是蔡康永原貼文內容。"
    tags: [告別式, 京都式禮貌, 外界解讀]

  - id: F006
    statement: "蔡康永10月16日晚間另發「京都人」電話短文，內容是有人打電話找「京都人」，他回答沒有，對方掛掉；朋友反覆問「掛掉了？」後，結尾為「現在只剩下：嘟嘟嘟」。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S006, S008]
    evidence_summary: "兩家媒體保存已刪除貼文的主要文字內容。"
    tags: [京都人, 掛掉了, 嘟嘟嘟]

  - id: F007
    statement: "「京都式禮貌／京都人」這個標籤在蔡康永10月16日晚間發布「京都人」短文以前，就已出現在10月15日對其黑西裝貼文的外界評論中。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S005, S006]
    evidence_summary: "時間順序支持「京都人」短文至少是在回應既有網路標籤，而不是該標籤最初由蔡本人創造。"
    tags: [京都人, 時間線, 社群標籤]

  - id: F008
    statement: "沈伯洋10月16日上午已發布包含「詐騙很壞／嘟嘟嘟」的社群內容；蔡康永的「京都人／嘟嘟嘟」短文則在同日晚間出現。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S007, S008]
    evidence_summary: "公開時間線使「蔡可能看過或引用當日流行的嘟嘟嘟梗」成為可能，但時間先後本身不能證明其意圖或特定指涉。"
    tags: [沈伯洋, 嘟嘟嘟, 時間線]

  - id: F009
    statement: "10月17日蔡康永刪除「京都人」短文後，公開稱上一則是「玩笑小文字」、大家「各自望文生義」，並要求不要再用此事打擾蔣萬安；他同時稱蔣萬安一直充滿善意，自己會很感榮幸出席活動。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S009]
    evidence_summary: "蔡本人後續公開文字拒絕把該短文固定解讀為對蔣的政治攻擊，並再次確認出席。"
    tags: [蔡康永, 刪文, 望文生義, 蔣萬安]

  - id: F010
    statement: "10月9日媒體問蔣萬安是否會與蔡康永一起唱歌時，蔣的實際回答是一定會邀蔡參加競總成立並安排搖滾區；現有受訪轉錄未顯示蔣回答「會一起唱歌」。"
    status: verified
    observed_at: "2026-10-17T22:06:00+08:00"
    source_ids: [S010, S011]
    evidence_summary: "受訪逐字與中央社文字一致：蔣回答的是邀請與座位安排；「一起歡唱」另指向市民／支持者參與競選歌曲。"
    tags: [蔣萬安, 媒體問答, 一起唱歌, 搖滾區]

claims:
  - id: C001
    statement: "「蔡康永說要穿黑西裝，是在回應或嘲諷蔣萬安對他提出服裝要求。」"
    status: contradicted
    contradicts: [F003, F004]
    reasoning_notes: "現有文本把原因寫成「近日政壇」的服裝儀容風波；前一日正發生賈永婕／賴惠員事件，且賈本人直接到貼文互動。沒有證據顯示蔣萬安曾要求蔡穿黑西裝。"

  - id: C002
    statement: "「蔡康永黑西裝文的明確原意就是把蔣萬安競總當告別式，暗示蔣將落選。」"
    status: unsupported
    related_facts: [F003, F004, F005]
    reasoning_notes: "告別式／落選是外界由黑色西裝再推一步的解讀；蔡原文沒有告別式、死亡、落選等字眼。可以記錄為流行解讀，不能記成蔡本人已證實原意。"

  - id: C003
    statement: "「蔡康永10月16日『京都人／掛掉了／嘟嘟嘟』一文明确是在說蔣萬安會落選。」"
    status: unsupported
    related_facts: [F006, F007, F009]
    reasoning_notes: "「京都人」首先可直接回扣前一天外界給蔡的標籤；「掛掉」具雙關空間，但文章沒有點名蔣。蔡次日又把該文稱為玩笑、表示大家各自望文生義並強調蔣的善意。"

  - id: C004
    statement: "「蔡康永文末『嘟嘟嘟』一定是在呼應沈伯洋當日上午的『嘟嘟嘟』內容。」"
    status: unresolved
    related_facts: [F006, F008]
    reasoning_notes: "時間順序允許此解讀，而且當天網友與媒體確有如此連結；但「嘟嘟嘟」同時是電話被掛斷後最自然的擬聲詞，也屬當時流行迷因，缺乏蔡本人確認。"

  - id: C005
    statement: "「『黑西裝＝蔣萬安告別式／落選』與『京都人＝酸蔣』的社群說法是由同一中央廚房協調後大量copy-paste擴散。」"
    status: unresolved
    related_facts: [F005, F006, F007]
    reasoning_notes: "目前公開網頁可確認相同或近似詮釋大量存在並被媒體轉述，但本次尚未取得足夠的原始Threads貼文樣本、帳號關聯、精確發布時間與文字相似度資料，不能把「敘事高度一致」直接升格成「組織協調」。"

  - id: C006
    statement: "「媒體問蔣萬安會不會和蔡康永一起唱歌，等於蔣萬安自己已答應或要求蔡上台唱歌。」"
    status: contradicted
    contradicts: [F010]
    reasoning_notes: "問題內容不能取代受訪者答案；蔣回答的是邀請出席與安排搖滾區。"

