notes:
  - "紀錄截至2026-11-24；基隆案只是具保爭議，不是已發生逃亡的案件。"
  - "保全羈押之2016研議、2025修法與改革成效應區分規劃、規範、施行及評估。"
  - "同一案例可呈現多個改革面向，但不同案例不可只因棄保逃亡就推定法官違法。"
