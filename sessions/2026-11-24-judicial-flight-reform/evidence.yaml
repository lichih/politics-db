facts:
  - id: F001
    statement: "基隆地院2026-11-24表示，運輸毒品等罪嫌之李姓被告經依刑訴法101-2以60萬元具保，並限制住居、出境、出海；當庭諭知記明筆錄並通知檢察官。"
    status: verified
    observed_at: "2026-11-24T21:05:00+08:00"
    source_ids: [S001]
    evidence_summary: "未採科技設備監控；法院表示程序合法，但不能由此證明裁量充分或防逃有效。"
  - id: F002
    statement: "2026-07-09懲戒法院就鍾文智案認定陳勇松法官未宣示、送達特定裁定及其他程序違失，判處相當於一年現職月俸給總額的罰款。"
    status: verified
    observed_at: "2026-11-24T21:05:00+08:00"
    source_ids: [S002]
    evidence_summary: "前案違失已具正式判決支持；不可直接推定基隆案有相同程序違失。"
  - id: F003
    statement: "監察院2026-04-16公布葉展皓棄保潛逃案調查，指出移審與羈押制度漏洞、科技監控執行改善需求，並指出2025年法院裁定通知函對獨立審判法官可能不具拘束力。"
    status: verified
    observed_at: "2026-11-24T21:05:00+08:00"
    source_ids: [S003,S010]
    evidence_summary: "制度性缺陷經監察院正式指出，部分改善仍屬建議性質。"
  - id: F004
    statement: "2025-05-14最高檢點名朱國榮、鍾文智、徐少東等被告逃亡，建議增訂保全羈押；其說法並追溯法務部2016年已研議。"
    status: verified
    observed_at: "2026-11-24T21:05:00+08:00"
    source_ids: [S004]
    evidence_summary: "2016年的狀態為研議而非已完成立法；是否提出正式草案、歷年決策待續查。"
  - id: F005
    statement: "2025-10-17立法院三讀修正刑訴法116-2，增訂法院得通知主管機關註銷逃逸被告護照及旅行文件的措施。"
    status: verified
    observed_at: "2026-11-24T21:05:00+08:00"
    source_ids: [S005]
    evidence_summary: "這是具體修法成果，不等同所有防逃漏洞已排除。"
  - id: F006
    statement: "桃園地檢署2026-04-15公布游姓律師在科技監控下規避措施、3月22日經船隻偷渡潛逃的偵辦經過。"
    status: verified
    observed_at: "2026-11-24T21:05:00+08:00"
    source_ids: [S006]
    evidence_summary: "科技監控的實際執行和應變屬獨立於有無書面裁定的檢驗面向。"
  - id: F007
    statement: "2026-03-19中油前執行長徐漢於宣判前夕拆卸電子腳環後逃亡。"
    status: verified
    observed_at: "2026-11-24T21:05:00+08:00"
    source_ids: [S007]
    evidence_summary: "此案後續已落網，不能描述為至今在逃。"
  - id: F008
    statement: "2023-10-25民間團體拜會賴清德，記錄賴對公開對話與常設性司改監督機制表示認同、值得檢討執行。"
    status: verified
    observed_at: "2026-11-24T21:05:00+08:00"
    source_ids: [S008]
    evidence_summary: "承諾文字應精確表達為認同機制及改革方向，不能無條件寫成承諾在特定日期設置特定組織。"
  - id: F009
    statement: "2026-01-08民間司改會批評賴政府司法改革停滯、要求重啟社會對話。"
    status: verified
    observed_at: "2026-11-24T21:05:00+08:00"
    source_ids: [S009]
    evidence_summary: "這是民間團體的公開評價，非政府全部改革作為的完整查核。"
claims:
  - id: C001
    statement: "基隆案當庭諭知且未另製書面裁定，因此法官必定違法。"
    status: unsupported
    related_facts: [F001, F002, F003, F004, F005, F006, F007, F008, F009]
    reasoning_notes: "基隆院稱已當庭諭知、記錄並通知檢察官；與鍾文智案已認定程序違失不一致。"
  - id: C002
    statement: "重大刑案防逃制度漏洞已在2026年全部解決。"
    status: unsupported
    related_facts: [F001, F002, F003, F004, F005, F006, F007, F008, F009]
    reasoning_notes: "監察院2026年仍指出制度缺失，另有科技監控規避案例；但不能據此評定改革毫無成果。"
  - id: C003
    statement: "賴清德對所宣稱的司法改革監督機制負政策說明責任。"
    status: supported
    related_facts: [F001, F002, F003, F004, F005, F006, F007, F008, F009]
    reasoning_notes: "2023年民間會談紀錄可確認對改革機制表達認同；具體責任需依憲政權限區分，不涉及指示個案法官。"
  - id: C004
    statement: "基隆案已再次發生棄保潛逃。"
    status: unsupported
    related_facts: [F001, F002, F003, F004, F005, F006, F007, F008, F009]
    reasoning_notes: "截至2026-11-24取得的官方資料僅見具保裁定，未確認逃亡結果。"
