facts:
  - id: F001
    statement: "Reuters 於 2026-10-31 轉述 Financial Times 報導，OpenAI 最新一輪募資目標由 300 億美元下修約 100 億美元至約 200 億美元，期望估值由 1.4 兆美元降至 1.25 兆美元；報導並稱部分投資人縮減認購，使首輪交割預期低於 200 億美元。"
    status: partial
    observed_at: "2026-11-02T15:47:00+08:00"
    source_ids: [S001]
    evidence_summary: "可確認 Reuters 已如此報導，但核心募資數字來自 FT／消息來源，並非 OpenAI 官方公告，因此只記為媒體報導支持的部分核實事證。"
    verification_notes:
      - "可用來證明資本市場對 OpenAI 募資條件出現轉弱訊號，不足以單獨證明 AI 產業泡沫。"
      - "未把期望估值或募資目標視為已完成交易價格。"
    tags:
      - "OpenAI"
      - "募資"
      - "估值"
      - "secondary-report"
  - id: F002
    statement: "Amazon 2026 年第三季 AWS 銷售年增 39% 至 460 億美元；截至 2026-09-30 的過去十二個月營運現金流為 1,683 億美元、年增 29%，自由現金流則由前一年的正 148 億美元轉為負 424 億美元。Amazon 表示，固定資產淨購置額年增 948 億美元，主要反映人工智慧投資；公司並維持 2026 年現金資本支出約 2,200 億美元的預期。"
    status: verified
    observed_at: "2026-11-02T15:47:00+08:00"
    source_ids: [S002]
    evidence_summary: "Amazon 官方財報同時呈現強勁 AWS 收入成長與 AI 基礎建設投資造成的自由現金流轉負，可作為『需求存在但資本需求快速擴張』的直接基準線。"
    verification_notes:
      - "AWS 銷售成長不能全部歸因於 AI；本文僅用它證明雲端業務收入仍高速成長。"
      - "自由現金流為過去十二個月口徑，不與單季 Meta、Microsoft 數字直接加總比較。"
    tags:
      - "Amazon"
      - "AWS"
      - "AI investment"
      - "free cash flow"
      - "capex"
  - id: F003
    statement: "Meta 2026 年第三季營收 646.01 億美元、年增 26%；資本支出（含融資租賃本金）349.1 億美元，營運現金流 327.86 億美元，單季自由現金流為負 21.2 億美元。2026 年前九個月自由現金流仍為正 110.49 億美元。"
    status: verified
    observed_at: "2026-11-02T15:47:00+08:00"
    source_ids: [S003]
    evidence_summary: "Meta 官方財報顯示單季資本支出已高於營運現金流、使單季自由現金流轉負，但年初至今仍為正，不能把單季數字誇大成整體現金流失速。"
    verification_notes:
      - "此 fact 不把全部 Meta 資本支出都歸因於 AI。"
      - "保留九個月自由現金流仍為正的反向資訊，以免選擇性呈現。"
    tags:
      - "Meta"
      - "capex"
      - "free cash flow"
  - id: F004
    statement: "Microsoft FY2027 第一季資本支出為 452 億美元，其中約四分之三為以 CPU、GPU 為主的短期資產；現金支付不動產、廠房及設備 394 億美元，營運現金流 580 億美元，自由現金流仍為正 186 億美元。公司並預期 FY2027 維持正自由現金流。"
    status: verified
    observed_at: "2026-11-02T15:47:00+08:00"
    source_ids: [S004]
    evidence_summary: "Microsoft 官方 earnings call 提供重要反證：大規模 AI／資料中心資本支出並不必然立即導致負自由現金流。"
    verification_notes:
      - "Microsoft 指出下一季資本支出預計超過 500 億美元，顯示投資仍在加速。"
      - "正自由現金流不能單獨證明現有估值合理，只能反駁『高 AI 資本支出必然造成現金流轉負』。"
    tags:
      - "Microsoft"
      - "GPU"
      - "capex"
      - "free cash flow"

  - id: F005
    statement: "Anthropic 於 2026-11-02 向 SEC 提交的 S-1/A 揭露，截至及在 2026-09-30 之後，公司已簽訂約 8,954 億美元的採購承諾與租賃協議，幾乎全部與 compute／infrastructure 有關；其中約 4,475 億美元預計在 2030 年底前發生，約 698 億美元在 2026-09-30 後 12 個月內到期。"
    status: verified
    observed_at: "2026-11-06T20:41:00+08:00"
    source_ids: [S005]
    evidence_summary: "這是 Anthropic 自行向 SEC 申報的長期 compute／infrastructure 固定承諾，直接量化前沿模型公司的資本需求與未來支付義務。"
    verification_notes:
      - "commitments 不等於已支付成本，也不等於全部會在近期認列為費用。"
      - "S-1/A 同時揭露 2026-09-30 時流動性約 1,466 億美元，不能只列負債義務而忽略可用資金。"
    tags:
      - "Anthropic"
      - "SEC"
      - "compute commitments"
      - "infrastructure"
  - id: F006
    statement: "Anthropic 在同一份 S-1/A 明示，其部分 compute providers 與 infrastructure partners 依賴第三方融資或信用支持來取得晶片與興建容量；若該融資變得不可得或成本上升，已約定容量可能延遲、重新定價、縮減或無法交付。公司並表示其未來 compute 支付義務能否履行，取決於快速營收成長、將 compute 轉為付費 workload，以及持續取得可接受條件的外部資本。"
    status: verified
    observed_at: "2026-11-06T20:41:00+08:00"
    source_ids: [S005]
    evidence_summary: "這是公司正式風險揭露，直接支持『AI 基礎設施擴張對外部融資條件存在結構性依賴』，比媒體對資金循環的推測更強。"
    verification_notes:
      - "風險揭露證明風險結構存在，不代表融資失敗已發生。"
    tags:
      - "Anthropic"
      - "financing risk"
      - "compute"
      - "capital dependency"
  - id: F007
    statement: "Anthropic S-1/A 顯示 2026 年第三季營收約 169.6 億美元，季增 47%；前一季季增幅為 144%。公司第三季營業損失約 5.67 億美元，第二季則曾有約 9.74 億美元營業利益；公司並指出第三季額外取得 50 億美元短期 compute，壓低 revenue per dollar of compute。"
    status: verified
    observed_at: "2026-11-06T20:41:00+08:00"
    source_ids: [S005]
    evidence_summary: "同一份申報文件同時證明需求與營收仍高速成長，也顯示成長速度下降及短期 compute 成本對營運效率造成壓力。"
    verification_notes:
      - "47% 季增仍屬非常高速成長，不能把『成長放緩』寫成需求萎縮。"
    tags:
      - "Anthropic"
      - "revenue growth"
      - "operating loss"
      - "compute efficiency"
  - id: F008
    statement: "Reuters 於 2026-11-05 報導，部分潛在投資人認為 Anthropic 近期討論的 1.5 兆美元估值位於預期高端，要求更有吸引力的價格，並質疑原訂 11 月 9 日當週啟動 roadshow、11 月上市的時程能否維持。"
    status: partial
    observed_at: "2026-11-06T20:41:00+08:00"
    source_ids: [S006]
    evidence_summary: "可作為公開市場開始對前沿 AI 公司估值要求更大折價的最新訊號，但目前仍是投資人討論與 Reuters 消息來源，非正式 IPO 定價或延期公告。"
    verification_notes:
      - "不得寫成 Anthropic IPO 已延期。"
    tags:
      - "Anthropic"
      - "IPO"
      - "valuation"
      - "secondary-report"
  - id: F009
    statement: "Oracle 於 2026-11-02 宣布籌集約 200 億美元，其中約 100 億美元透過股權、約 100 億美元透過固定利率債券；Reuters 將此融資與 Oracle 的 AI／cloud infrastructure 擴張連結，並報導新股定價較前一交易日收盤價折價 11.2%。"
    status: partial
    observed_at: "2026-11-06T20:41:00+08:00"
    source_ids: [S007]
    evidence_summary: "新增一個大型科技公司為 AI／cloud 資本支出動用外部股債市場的案例，顯示資本需求正由內部現金流延伸到資本市場。"
    verification_notes:
      - "融資用途並非全部限定 AI；Oracle 表示資金亦可用於償債、併購、股利與庫藏股等一般企業用途。"
    tags:
      - "Oracle"
      - "equity financing"
      - "debt financing"
      - "AI infrastructure"

  - id: F010
    statement: "2026-11-04，美國期中選舉後第一個交易日，大型科技公司因市場預期資料中心擴張可能放慢、既有算力更稀缺且資本支出壓力降低而上漲：Amazon 漲 7.4%，Meta、Alphabet、Microsoft 漲幅約 2% 至 6.3%；相對地，Applied Digital 與 IREN 等較小型 AI infrastructure 業者下跌約 6% 至 13%。"
    status: verified
    observed_at: "2026-11-06T20:41:30+08:00"
    source_ids: [S008]
    evidence_summary: "選後第一日出現明顯的產業內分化，市場不是單純以『民主黨勝選＝科技股全面利空』交易，而是在區分既有 hyperscaler 與依賴新增 data-center buildout 的業者。"
    verification_notes:
      - "股價反應只能證明市場當日如何定價，不證明相關政策一定會落地或最終有同等經濟效果。"
    tags:
      - "midterms"
      - "hyperscalers"
      - "data centers"
      - "market repricing"
  - id: F011
    statement: "2026-11-05，Nasdaq Composite 下跌 5.52%、S&P 500 下跌 4.36%、Dow 下跌 3.44%；Nvidia 下跌超過 9%，Philadelphia Semiconductor Index 下跌超過 12%，IREN 與 Applied Digital 下跌超過 14%，CoreWeave 下跌近 10%。Reuters 報導市場將民主黨掌控國會及多州反對資料中心擴張的選舉結果，視為可能放慢 AI infrastructure buildout 的新風險。"
    status: verified
    observed_at: "2026-11-06T20:41:30+08:00"
    source_ids: [S009]
    evidence_summary: "11/5 的廣泛科技股修正，尤其半導體與資料中心鏈跌幅更深，顯示政治限制與既有 AI capex/valuation 疑慮共同進入市場定價。"
    verification_notes:
      - "Reuters 同時指出 Qualcomm 財報、機構賣壓、去槓桿與利率疑慮等其他因素，因此不得把整個跌幅單一歸因於期中選舉。"
      - "這是因果歸因的多因素事件；選舉結果應視為新增風險因子，而非唯一原因。"
    tags:
      - "Nasdaq"
      - "semiconductors"
      - "midterms"
      - "AI regulation"
      - "market selloff"
  - id: F012
    statement: "2026 美國期中選舉中，Texas 民主黨州長候選人 Gina Hinojosa 勝選；她主張在州議會完成水、電力、空氣與財產權規範前維持新資料中心 moratorium。Axios 並報導，10 州 41 項資料中心公投中，約兩打限制或阻擋開發的提案在初步結果中通過；Texas、Ohio、Georgia、Arizona 等大量 2028 新增 data-center capacity 所在州也出現支持較嚴格限制的選舉結果。"
    status: partial
    observed_at: "2026-11-06T20:41:30+08:00"
    source_ids: [S010]
    evidence_summary: "政治約束已從地方抗爭與候選人主張，進一步轉化為選舉勝負與 ballot measures，足以成為 AI buildout 模型中的實際政策風險。"
    verification_notes:
      - "部分 ballot measures 在來源發布時仍屬初步開票結果；後續應以官方認證結果更新。"
      - "勝選與公投通過不等於所有資料中心都會永久停止；許多既有或在建案可能不受影響。"
    tags:
      - "data centers"
      - "Texas"
      - "midterms"
      - "regulatory risk"

claims:
  - id: C001
    statement: "截至 2026-11-06，現有公開證據已足以證明整個 AI 產業形成不可持續的資產或估值泡沫。"
    status: unresolved
    supports: [F001, F002, F003, F005, F006, F008, F009]
    contradicts: [F004, F007]
    related_facts: [F001, F002, F003, F004, F005, F006, F007, F008, F009]
    reasoning_notes: "Anthropic 的 SEC 申報已把長期 compute commitments 與第三方融資依賴由推測提升為可直接核實的公司風險結構，OpenAI 與 Anthropic 的估值壓力亦形成多點訊號；但 Anthropic 營收仍高速成長、Microsoft 仍有正自由現金流，因此尚不足以把『風險累積』提升為『整體泡沫已成立』。"
  - id: C002
    statement: "大額 AI 投資已在至少部分大型科技公司明顯壓縮自由現金流。"
    status: supported
    supports: [F002]
    related_facts: [F002, F003]
    reasoning_notes: "Amazon 官方直接把固定資產投資增加主要歸因於 AI，並同時出現過去十二個月自由現金流轉負；Meta 亦呈現單季資本支出高於營運現金流，但本文不把 Meta 全部資本支出直接歸因於 AI。"
  - id: C003
    statement: "只要 AI 資本支出升高，大型科技公司就必然轉為負自由現金流。"
    status: contradicted
    contradicts: [F004]
    related_facts: [F002, F003, F004]
    reasoning_notes: "Microsoft 同期維持正自由現金流，顯示企業既有現金創造能力與投資效率仍會改變結果。"
  - id: C004
    statement: "OpenAI 本輪募資條件相較先前報導的目標已有轉弱。"
    status: supported
    supports: [F001]
    related_facts: [F001]
    reasoning_notes: "支持強度限於 Reuters／FT 的報導層級；尚非 OpenAI 官方確認或已完成交易結果。"

  - id: C005
