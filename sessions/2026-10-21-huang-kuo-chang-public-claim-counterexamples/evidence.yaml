claims:
  - id: C001
    statement: "黃國昌從未在公開可驗證的事實／因果主張上出現被後續較強證據明確推翻的反例。"
    status: contradicted
    contradicts: [F004]
    related_facts: [F001, F002, F005, F006, F010, F011]
    reasoning_notes: "萬里航照至少提供一個可辨識的子命題反例：『現址原無工寮／工寮外空地新建』被較完整航照與專家判讀否定。辣椒水事件經本次補查後不再作為乾淨反例，因官方結果雖確認直接物理來源為周俊銘，卻同時揭露多項不尋常執勤與事後處置；目前資料不足以從物理來源直接完成對政治動機／協調命題的否證。找到一個子命題反例仍足以否定嚴格的『從未』，但不能據此推出『經常翻車』。"

  - id: C002
    statement: "柯文哲逢甲夜市辣椒水事件已足以作為黃國昌一次被後續證據完全推翻的乾淨事實／因果翻車案例。"
    status: unresolved
    related_facts: [F001, F002, F003, F010, F011]
    reasoning_notes: "黃國昌確實在完整調查前把事件放進民進黨SOP敘事，這是超前於已驗證證據的政治歸因；但警方後續只直接確認辣椒水的物理來源與周俊銘違規處置，且周另有主動具領、4次噴灑、未即時坦承等異常。這些資料既不支持民進黨協調說，也不足以排除所有動機假說。因此可批評黃國昌premature attribution，但不能再把『分局長誤噴』本身當成已完整否證其政治動機命題的乾淨反例。"

  - id: C003
    statement: "黃國昌在萬里老宅案所稱『2003年前現址沒有舊工寮、是在工寮外空地新建』的完整判讀是正確的。"
    status: contradicted
    contradicts: [F004]
    reasoning_notes: "較完整航照與專家比對支持『2003年重建』，但否定『工寮外空地』；因此應拆成一真一錯，不能把整組主張一概判真或判假。"

  - id: C004
    statement: "《向光前行》所述2018年凌晨4時左右凱道最後只剩黃國昌與徐永明，已被目前取得的資料完全證實。"
    status: unresolved
    related_facts: [F005, F006]
    reasoning_notes: "時代力量提出具體檢方處分書案號與當年新聞稿時序形成強反證，但本次尚未直接取得處分書全文，且『最後只剩』可能存在瞬間時序語義；因此不提前壓成確定錯誤。"

  - id: C005
    statement: "憲法法庭在113年憲判字第9號否定黃國昌等人部分法律主張，即可直接證明黃國昌在事實查證上不可靠。"
    status: unsupported
    related_facts: [F007]
    reasoning_notes: "法律見解競爭與可驗證外部事實是不同問題類型；終局法律敗訴可以列為legal defeat，不能直接充當fact error。"

  - id: C006
    statement: "只要某人對黃國昌提告、政府機關發新聞稿反駁、或媒體稱其『翻車』，就足以列入黃國昌事實錯誤案例。"
    status: contradicted
    contradicts: [F008, F009]
    reasoning_notes: "蘇治芬案顯示遭提告的高爭議言論仍可能具有合理查證基礎；大同醫護案則顯示機關反駁可能只針對程序範圍，底層事實仍另有官方承認。"

  - id: C007
    statement: "現有反例足以支持『黃國昌經常翻車』或量化其公開主張錯誤率。"
    status: unsupported
    supports: []
    related_facts: [F001, F002, F004, F005, F007, F008, F009]
    reasoning_notes: "本次研究是反例搜尋，不是對黃國昌全部公開主張建立完整分母的系統抽樣；找到反例只能推翻『從未』，不能估計頻率。"

  - id: C008
    statement: "黃國昌在逢甲辣椒水事件的問題，可以精確描述為在調查完成前作出超出當時可驗證證據的政治歸因。"
    status: supported
    supports: [F001]
    related_facts: [F002, F010, F011]
    reasoning_notes: "這不等於已證明他的政治歸因為假；它只判斷當時公開證據不足以支撐把具體事件連到民進黨SOP。後續周俊銘異常行為使動機層仍需另外查。"

  - id: C009
    statement: "周俊銘在逢甲辣椒水事件中的行為可視為一般、合理的分局長正常執勤，因此不需要再對其行為鏈提出疑問。"
    status: contradicted
    contradicts: [F010, F011]
    reasoning_notes: "警方自己即指出其違反正確處置規範、未第一時間坦承並有嚴重紀律問題；不能用『誤噴』二字抹平這些已確認異常。異常仍不等於政治陰謀成立。"

  - id: C010
    statement: "2025年黃國昌蓄鬍『賣慘』事件可作為其政治對手／評論者由外觀快速推定動機、後因新事實出現而撤回並道歉的反例。"
    status: supported
    supports: [F012]
    reasoning_notes: "苗博雅在不知父喪的情況下把外貌變化解讀為政治表演，父喪事實公開後道歉。此例支持『對手有時會先過度解讀而翻車』，但不證明黃國昌自己的所有公共主張因此更可靠。"

