facts:
  - id: F001
    statement: "2026年4月20日上午，在柯文哲逢甲夜市辣椒水事件真相尚未公布前，黃國昌把事件放進『賴清德嘴裡講團結、民進黨實際作為不同』以及『找一些人以特定行徑來鬧場、配合綠媒傳播』的民進黨SOP敘事。"
    status: verified
    observed_at: "2026-10-21T13:16:11+08:00"
    source_ids: [S001]
    evidence_summary: "媒體直接轉述當日上午中廣《千秋萬事》訪談內容，語意不只是要求警方調查，而已將事件原因與民進黨操作模式連結。"
    verification_notes:
      - "目前未把此言論升格為刑法上的故意造謠；重點只在其事實／因果歸因是否被後續資料支持。"
    tags: [黃國昌, 辣椒水, 民進黨SOP, 事前歸因]

  - id: F002
    statement: "同日下午臺中市政府警察局公布調查：已排除報案人所稱共乘機車2人涉案，確認現場辣椒水係第六分局長周俊銘處置噴霧器異常時朝地面及下方噴灑所致。"
    status: verified
    observed_at: "2026-10-21T13:16:11+08:00"
    source_ids: [S002]
    evidence_summary: "官方說明載明警方調閱監視器、員警密錄器並訪查現場人士後所得結果，且對周俊銘記過、調職並函送偵辦。"
    tags: [臺中市警察局, 辣椒水, 調查結果, 周俊銘]

  - id: F003
    statement: "2026年4月22日黃國昌面對要求道歉時表示，自己『第一時間』是說交由警方好好調查，並稱民進黨在扎稻草人、轉移焦點。"
    status: verified
    observed_at: "2026-10-21T13:16:11+08:00"
    source_ids: [S003]
    evidence_summary: "中央社記錄其事後回應；此說法應與4月20日上午已存在的民進黨SOP歸因並列解讀。"
    verification_notes:
      - "『曾要求警方調查』與『同時作出民進黨SOP歸因』可以同時成立，不以其中一句自動抹除另一句。"
    tags: [黃國昌, 事後回應, 辣椒水]

  - id: F004
    statement: "2023年萬里老宅爭議中，黃國昌由1992、1996、2002、2004等航照判斷賴清德現宅為新建，並推論現址沒有老舊工寮可供改建；台灣事實查核中心擴大比對1974至2022年航照、地籍、現場訪談及遙測專家後，確認現宅確為2003年重建，但位置是在舊礦工工寮原址，而非工寮範圍外空地。"
    status: verified
    observed_at: "2026-10-21T13:16:11+08:00"
    source_ids: [S004]
    evidence_summary: "黃國昌對『2003年出現新建物』的判斷有基礎，但由較窄時間區間進一步推出『原址沒有工寮／空地新建』，被較完整的歷史航照與多源查核推翻。"
    verification_notes:
      - "同一查核也指出賴陣營只稱『修繕／整修』不精確，較符合事實的描述是舊址荒廢多年後『重建』。"
    tags: [萬里老宅, 航照, 事實查核, 部分錯誤]

  - id: F005
    statement: "黃國昌2026年新書《向光前行》描述2018年反勞基法二修抗爭約凌晨4時醒來後『身邊空了』，最後凱道只剩他與徐永明；時代力量後以臺北地檢署107年度偵字第5663號不起訴處分書及2018年當日新聞稿反駁，稱04:18第七次舉牌清場時仍記載黃國昌、洪慈庸、林昶佐、徐永明四人為現場帶頭者，警方自04:17起驅離、約04:30清場完成。"
    status: partial
    observed_at: "2026-10-21T13:16:11+08:00"
    source_ids: [S005, S006]
    evidence_summary: "目前可確認新書敘述、時力提出的具體文件案號與當年新聞稿時序；本次尚未直接取得107年度偵字第5663號不起訴處分書全文逐字核對。"
    verification_notes:
      - "因此先保存為強反證而非完全終結爭議；尤其『最後只剩』究竟指哪一瞬間，仍可能有狹義時間語義辯解空間。"
    tags: [向光前行, 2018勞基法, 時代力量, contemporaneous-record]

  - id: F006
    statement: "2026年6月5日黃國昌面對時代力量反駁時仍表示書中內容『完全呈現客觀事實』。"
    status: verified
    observed_at: "2026-10-21T13:16:11+08:00"
    source_ids: [S007]
    evidence_summary: "中央社直接記錄其回應。"
    tags: [黃國昌, 向光前行, 回應]

  - id: F007
    statement: "113年憲判字第9號中，黃國昌以立法院代表身分提交答辯並參與言詞辯論；憲法法庭最終對國會職權修法多項規定作違憲或限縮判斷。"
    status: verified
    observed_at: "2026-10-21T13:16:11+08:00"
    source_ids: [S008]
    evidence_summary: "可證明其法律主張並非總能獲終局憲法裁判採納，但法律見解被法院否定不等於其事實陳述為假。"
    tags: [國會改革, 憲法法庭, 法律爭議, 非事實翻車]

  - id: F008
    statement: "黃國昌2024年指蘇治芬替光電業者『圍事』遭提告加重誹謗後，北檢認定其發言前已有一定資訊來源、客觀上可合理相信言論內容為真並符合合理查證要求，予以不起訴。"
    status: verified
    observed_at: "2026-10-21T13:16:11+08:00"
    source_ids: [S009]
    evidence_summary: "此案可作反向baseline：爭議性、攻擊性高的指控也可能經司法程序確認具有合理查證基礎，因此不能把『被提告／被反駁』直接列為翻車。"
    tags: [蘇治芬, 光電, 不起訴, reasonable-verification]

  - id: F009
    statement: "2026年大同醫護申訴案中，工程會稱其審議只處理舊品與停權『情節重大』問題，未審中國製品，因此批評黃國昌把不同爭點拼接；但2025年資安院長曾在立法院公開承認涉案設備有舊品問題，且部分網通設備為美國品牌中國製並不符契約規格。"
    status: verified
    observed_at: "2026-10-21T13:16:11+08:00"
    source_ids: [S010, S011]
    evidence_summary: "工程會反駁的是申訴審議範圍與黃的論述連接方式，不足以把黃先前揭露的『舊品／中國製不符規格』底層事實一併判為虛假。"
    tags: [大同醫護, 工程會, 資安院, claim-scope]

  - id: F010
    statement: "周俊銘在2026年4月17日逢甲維安勤務中的辣椒水處置，並非僅有一次單純『誤噴』：依臺中市警察局公開說明，分局長原可不攜帶辣椒水，周俊銘卻主動具領；噴罐異常後仍在不同時間共4次朝地面噴灑，而依規定應封裝、停止使用並立即離開現場。"
    status: verified
    observed_at: "2026-10-21T13:31:00+08:00"
    source_ids: [S012, S013]
    evidence_summary: "臺中市警察局長與刑警大隊公開說明可直接支持主動具領、4次噴灑及正確處置規範；因此把整件事壓縮成普通、合理的分局長『測試誤噴』會漏掉重要行為異常。"
    tags: [周俊銘, 辣椒水, 分局長, 執勤異常, 四次噴灑]

  - id: F011
