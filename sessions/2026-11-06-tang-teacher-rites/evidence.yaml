facts:
  - id: F001
    statement: "《唐會要》載神龍二年（706）敕令，官學學生初入學行束脩禮，並列絹帛、酒脯規範。"
    status: verified
    observed_at: "2026-11-06T10:27:06+08:00"
    source_ids: [S001]
    evidence_summary: "可證禮制條文存在，不代表唐代所有實際師生關係都如此成立。"
  - id: F002
    statement: "《大唐開元禮》卷五十四載學生穿青衿、向先生請受業、跪拜與博士答拜的程序，亦有皇子束脩。"
    status: verified
    observed_at: "2026-11-06T10:27:06+08:00"
    source_ids: [S002]
    evidence_summary: "原典『某方受業於先生，敢請見』等儀節屬官學制度文本。"
  - id: F003
    statement: "《師說》區分童子習句讀之師和傳道解惑之師，且稱弟子不必不如師、師不必賢於弟子。"
    status: verified
    observed_at: "2026-11-06T10:27:06+08:00"
    source_ids: [S003]
    evidence_summary: "原文可直接核對，不能將《師說》直接讀成終身父子恩義規則。"
claims:
  - id: C001
    statement: "僅憑現代曾教過某人，即可推定符合古代正式拜師關係及父子般終身恩義。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002, F003]
    reasoning_notes: "官學入學禮、韓愈師道與現代師生關係應分開；也不能反向認定沒有束脩就絕無實質恩義。"
  - id: C002
    statement: "所有唐代師生關係都必須行《開元禮》所載束脩禮，否則不成立。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002]
    reasoning_notes: "官學制度規範不可概括為全部私學及日常請益實態。"
