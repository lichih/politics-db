facts:
  - id: F001
    statement: "本案當事人的公開貼文不只有『小小賴清德拿下』，亦包含『兩岸統一』『台灣是中國不可分割的一部分』『台灣是中國的』『堅持一個中國原則』等政治文字。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S002, S003]
    evidence_summary: "中央社兩篇報導均列出相關貼文文字；因此不能把本案事實主體縮減為單一句網路用語。"
    tags: ["完整事實", "統一主張", "貼文"]

  - id: F002
    statement: "移民署對本案的公開理由，是當事人標註『主張消滅我國主權之文字』，其行為被認定違背對等尊嚴原則並引發社會紛擾，而非只因『小小賴清德拿下』一句。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S001]
    evidence_summary: "移民署2026年10月16日新聞稿直接載明處分理由。"
    tags: ["移民署", "處分理由", "對等尊嚴", "主權"]

  - id: F003
    statement: "移民署已廢止王姓交換生入境許可、驅逐出境，並管制五年內不予許可申請來臺。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S001, S003]
    evidence_summary: "移民署新聞稿及中央社均確認處分結果。"
    tags: ["驅逐", "五年禁入"]

  - id: F004
    statement: "現行《大陸地區人民進入臺灣地區許可辦法》第12條第1項第15款以『從事違背對等尊嚴原則之不當行為』作為得不予許可、撤銷或廢止許可的事由；第14條對相關情形規定1年至5年的不予許可期間。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S004]
    evidence_summary: "全國法規資料庫現行條文可直接核對。"
    tags: ["法源", "第12條", "第14條"]

  - id: F005
    statement: "內政部2019年公布、為『統一認定基準』而訂的《大陸地區人民申請進入臺灣地區不予許可期間處理原則》規定：第一次從事違背對等尊嚴原則之不當行為為二年不予許可，再次從事者為五年。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S005]
    evidence_summary: "行政院公報所載處理原則第1點說明目的為統一認定基準，第2點第5款明列2年／再次5年。"
    tags: ["裁量基準", "二年", "五年", "再犯"]

  - id: F006
    statement: "截至2026年10月16日，移民署官網現行『行政規則、各類公告及函(令)釋』列表仍列有2019年《大陸地區人民申請進入臺灣地區不予許可期間處理原則》。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S006]
    evidence_summary: "移民署現行行政規則索引頁仍可見該處理原則。這只能確認目前仍被官網列示，不能單憑列表推定其對本案的全部法律適用結論。"
    tags: ["行政規則", "現行列表"]

  - id: F007
    statement: "移民署2026年10月16日公開新聞稿沒有說明為何本案選擇五年管制而非較短期間，也沒有公開個案處分書全文。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S001]
    evidence_summary: "新聞稿只公布五年管制結果與概括理由，未載個別化期間選擇理由；本次查核亦未取得處分書全文。"
    verification_notes:
      - "此事實只描述目前公開新聞稿內容，不等於正式處分書或內部會商紀錄一定沒有更完整理由。"
    tags: ["資訊缺口", "比例原則", "五年"]

  - id: F008
    statement: "當事人後來撤下貼文並發表道歉聲明，但本次查核尚未取得該道歉聲明的原始頁面。"
    status: partial
    observed_at: "2026-10-16"
    source_ids: [S003]
    evidence_summary: "中央社明確報導撤文與道歉；因未取得原始聲明，保留為partial。"
    tags: ["撤文", "道歉"]

  - id: F009
    statement: "2024年陸委會曾在西門町滋擾港人活動並發生衝突的案件中，以『違背對等尊嚴原則』及另一項入境事由消失為由驅逐兩名中國人士，並公開表示中國大陸人士入境後『不得發表對台灣自主地位有害之言論』。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S007]
    evidence_summary: "陸委會2024年10月3日說明資料直接載明。該案同時包含現場滋擾、衝突與入境事由問題，不能作為純言論案件的一對一比較。"
    tags: ["既往案例", "對等尊嚴", "主權言論"]

  - id: F010
    statement: "民進黨2022年批評中共制裁『台獨頑固分子』是在片面施加指控、製造寒蟬效應，並主張中共無權對台灣人民與民主進行制裁。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S008]
    evidence_summary: "民進黨中央官網新聞稿直接記載。"
    tags: ["民進黨", "台獨黑名單", "寒蟬效應"]

  - id: F011
    statement: "民進黨2024年批評中共『懲獨22條』與『懲獨專區』會製造寒蟬效應，並稱中共沒有權力『懲治』堅持民主自由的台灣人民。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S009]
    evidence_summary: "民進黨中央官網2024年8月7日新聞稿直接記載。"
    tags: ["民進黨", "懲獨22條", "寒蟬效應"]

  - id: F012
    statement: "民進黨2025年就沈伯洋被中國以『台獨頑固份子』『分裂國家』立案偵查一事，稱中國無權干涉台灣人民，並將其定性為『企圖以政治手段恐嚇台灣人民』。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S010]
    evidence_summary: "民進黨中央官網2025年10月28日新聞稿直接記載。"
    tags: ["民進黨", "沈伯洋", "政治手段"]

  - id: F013
    statement: "民進黨2026年7月批評中國以模糊概念要求接受單一政治敘事，稱『概念模糊、標準任意』會把思想審查法律化，並把『被限制入境』列為可造成寒蟬效應的制裁方式之一。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S011]
    evidence_summary: "民進黨中央官網2026年7月1日新聞稿直接記載。"
    tags: ["民進黨", "模糊標準", "限制入境", "寒蟬效應"]

  - id: F014
    statement: "同一份2026年7月民進黨新聞稿主張，台灣的價值是多元、自由與彼此尊重，『每個人都可以擁有不同的身分認同、歷史觀點與政治立場』。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S011]
    evidence_summary: "民進黨中央官網原文可直接核對。"
    tags: ["民進黨", "政治立場", "多元自由"]

  - id: F015
    statement: "民進黨2026年6月替沈伯洋澄清兩岸交流立場時，明確主張建立法律依據與管理機制，使執法單位得依法行政，『而非以空泛理由限制交流』。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S012]
    evidence_summary: "民進黨中央官網闢謠頁面兩度以相同文字表述。"
    tags: ["民進黨", "依法行政", "空泛理由", "限制交流"]

  - id: F016
    statement: "中國2024年『兩高三部』懲治台獨意見，以維護國家主權、統一和領土完整為總體理由，並把『頑固宣揚台獨分裂主張』列為煽動分裂國家罪的具體情形之一。"
    status: verified
    observed_at: "2026-10-16"
    source_ids: [S013]
    evidence_summary: "中國最高檢等五部門公開文件可直接核對；此處僅記錄中方制度與自我正當化理由，不認可其對台灣的管轄權主張。"
    tags: ["中國", "懲獨22條", "主權", "政治表意"]

claims:
  - id: C001
    statement: "本案處分只是因政府誤解『小小賴清德拿下』這句中國網路用語。"
    status: contradicted
    contradicts: [F001, F002]
    reasoning_notes: "官方公開理由及貼文完整內容都涵蓋統一／主權文字，因此不能把案件縮減成單一句網路梗的語意誤讀。"

  - id: C002
    statement: "本案公開處分理由把當事人的主權／統一政治表意本身納入『違背對等尊嚴原則』的處分基礎。"
    status: supported
    supports: [F001, F002, F003]
    reasoning_notes: "移民署明文以『主張消滅我國主權之文字』描述其行為並據此認定違背對等尊嚴。"

  - id: C003
