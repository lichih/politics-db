notes:
  - "研究問題是10/14至10/20整段價格下跌、接著10/20至23反彈的雙階段成因；不是10/20單日民調發布是否觸發瞬時斷點。"
  - "已取得價格/成交原始資料，仍需完成獨立全量驗算；此前所寫待查缺口標註的是原始階段，不可忽略後續F008-F009的新增觀測。"
  - "使用者提供Polymarket介面截圖：10月20日20:00游標顯示蔣56%、沈43.5%、郭0.1%，但截圖底部標示2026-11-28，與目前2026-10-30時點不一致，應檢查這是市場結算日還是視窗日期，不得直接把截圖當作逐時完整紀錄。"
  - "待查10月14日至23日逐時市場價格、成交量及大額持倉；尤其要區分發布時間和訪問時間。"
  - "Fact寫作主題宜為選戰聲量、民調支持度、當選看好度與預測市場價格的不同意義，而非未證實的認知作戰指控。"
