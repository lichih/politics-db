claims:
  - id: C001
    statement: "10月20日民調發布造成Polymarket當日蔣萬安價格低點。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "新聞發布先於使用者提供截圖所標示的20:00價格，但時間先後不足以證明因果；需逐時成交與價格資料。"
  - id: C002
    statement: "市場反彈足以證明台北選民拒絕特定認知作戰。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F003, F004]
    reasoning_notes: "市場參與者與台北合格選民並非同一母群，且價格可能受流動性、大額交易、交易規則與新資訊影響。"
  - id: C003
    statement: "多份民調有利沈伯洋就證明存在協調操縱或故意誤導。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002, F003, F004]
    reasoning_notes: "需要另外取得組織協調、樣本設計不當或刻意操弄證據；數字方向一致不能單獨證明。"

  - id: C004
    statement: "10月14至20日市場一路接近、10月20後反彈；下跌段可能受接連有利沈的宣傳與蔣政策負面訊號影響。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F005, F006, F008, F009]
    reasoning_notes: "市場價格的時間序列支持兩段走勢，但公開消息只能構成候選解釋；須再做各日事件與價格、量之密集對照。"
  - id: C005
    statement: "10月21日起市場反彈是對信民民調樣本組成與重加權問題的理性修正。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F007, F008]
    reasoning_notes: "時間上有關聯，未核實重加權議題首次公開時間和當天逐時成交價格；不可確定此為主要原因。"

  - id: C006
    statement: "10月14、19日為整段下降過程的主要日跌幅，而10月20日19時附近形成底部並於晚間回升。"
    status: supported
    supports: [F011]
    contradicts: []
    related_facts: [F008, F009]
    reasoning_notes: "截至10/23觀測窗內，這是取樣價格的描述性結論，非已證實原因；10/15 11時另有單段約3百分點下降，須避免僅因日首末大小忽略日內波動。"
  - id: C007
    statement: "10月20日上午信民民調發布直接造成晚間的最低價或反彈。"
