facts:
  - id: F014
    statement: "第二輪自原始JSON獨立重建檢驗，98份SHA-256、1303筆價格、2240筆交易及時間轉換均通過；公開成交composite duplicate為零。"
    status: partial
    observed_at: "2026-10-30T23:36:00+08:00"
    source_ids: [S011]
    evidence_summary: "PR #6 verification.json所列驗算結果；本輪工具與資料在同一研究repo，尚未外部獨立重跑。"
    excerpt: ""
    verification_notes: ["僅涵蓋已保存raw pages；非Polymarket全歷史逐筆訂單簿。"]
    tags: ["2026", "資料驗證"]
  - id: F015
    statement: "10月19日14至23時蔣萬安Yes從0.615降至0.575，37筆公開成交名目9896.02；Yes-sell proxy 8240.70，高於Yes-buy 1655.32。"
    status: partial
    observed_at: "2026-10-30T23:36:00+08:00"
    source_ids: [S011]
    evidence_summary: "成交與價格取樣方向一致；14:31–14:37及22:50的No BUY鄰近兩個價格下階。"
    excerpt: ""
    verification_notes: ["taker-side proxy不是完整雙邊訂單流，時間相鄰不能單獨證明成交造成價格改變。"]
    tags: ["2026", "Polymarket", "成交"]
  - id: F016
    statement: "10月20日19至23時蔣萬安Yes從0.565升至0.605，62筆公開成交名目9325.70；Yes-buy proxy 7792.00，高於Yes-sell 1533.70。"
    status: partial
    observed_at: "2026-10-30T23:36:00+08:00"
    source_ids: [S011]
    evidence_summary: "20:01及20:22兩筆Yes BUY名目分別1140.00與1124.18，與21時上階的時間方向相符。"
    excerpt: ""
    verification_notes: ["無歷史深度及maker flow，不能據此認定特定成交必然造成行情反彈。"]
