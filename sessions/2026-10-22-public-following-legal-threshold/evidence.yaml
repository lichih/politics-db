session:
  id: "2026-10-22-public-following-legal-threshold"
  project: Politics
  title: "公共場所跟拍的法律門檻：『須先有涉嫌不法明確事證』是否為現行法要求"
  started_at: "2026-10-22T00:57:39+08:00"
  updated_at: "2026-10-22T00:57:39+08:00"
  status: active

topics:
  - 跟拍
  - 跟追
  - 新聞採訪自由
  - 隱私權
  - 社會秩序維護法
  - 釋字689號
  - 王義川
  - 黃國昌
  - 法律構成要件

sources:
  - id: S001
    source_type: primary
    publisher: "全國法規資料庫"
    title: "社會秩序維護法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?kw=%E7%A4%BE%E6%9C%83%E7%A7%A9%E5%BA%8F%E7%B6%AD%E8%AD%B7%E6%B3%95&pcode=D0080067"
    observed_at: "2026-10-22T00:57:39+08:00"
    retrieval_status: reachable
    notes:
      - "第89條第2款規定：無正當理由，跟追他人，經勸阻不聽者，處新臺幣三萬元以下罰鍰或申誡。條文未設『開始跟拍前須已有被跟拍者涉嫌不法的明確事證』要件。"

  - id: S002
    source_type: primary
    publisher: "憲法法庭／司法院"
    title: "釋字第689號解釋"
    url: "https://cons.judicial.gov.tw/docdata.aspx?fid=100&id=310870"
    published_at: "2011-07-29"
    observed_at: "2026-10-22T00:57:39+08:00"
    retrieval_status: reachable
    notes:
      - "解釋文及理由書界定跟追與『正當理由』，並就新聞採訪自由與公共場域隱私作利益衡量。"
      - "新聞採訪者如有事實足認特定事件屬大眾關切且具一定公益性、具有新聞價值，如須以跟追方式採訪且依社會通念非不能容忍，跟追即具正當理由。"
      - "解釋理由列舉犯罪或重大不當行為揭發、政府施政妥當性、公職人員執行職務與適任性、政治人物言行可信任性等可能具公益性的事項；其中多項並不以犯罪嫌疑為前提。"
      - "解釋並指出新聞採訪自由不只保障隸屬新聞機構的記者，也保障一般人為提供具新聞價值資訊、促進公共事務討論或監督政府而從事的採訪行為。"

  - id: S003
    source_type: secondary
    publisher: "中央通訊社"
    title: "政壇跟拍風波　王義川告發黃國昌等人涉妨害秘密"
    url: "https://www.cna.com.tw/news/asoc/202510030051.aspx"
    published_at: "2025-10-03"
    observed_at: "2026-10-22T00:57:39+08:00"
    retrieval_status: reachable
    notes:
      - "中央社記錄王義川律師陳君瑋在北檢前的公開說法：跟拍一個人的前提設定是對方已涉及不法，媒體進行跟拍或跟監在法律上才能成立；若沒有任何明確事證而全面性、無差別性政治跟拍，『很明顯就已經觸法』。"
      - "此來源用於證明公開主張內容，不把律師陳述本身當作法律 authority。"

  - id: S004
    source_type: secondary
    publisher: "中央通訊社"
    title: "王義川指控遭連續性跟拍　要求徐巧芯黃國昌說明"
    url: "https://www.cna.com.tw/news/aipl/202509220149.aspx"
    published_at: "2025-09-22"
    observed_at: "2026-10-22T00:57:39+08:00"
    retrieval_status: reachable
    notes:
      - "中央社轉述王義川取得的桃園地檢署不起訴處分書：4名跟拍者受僱於凱思國際、自稱媒體，總共跟拍9天；王義川稱檢察官認為從後方拍攝沒有恐嚇或危害安全問題，因此不起訴。"
      - "本次未取得不起訴處分書原文，故只保存中央社轉述與王義川公開說法，不把具體不起訴理由升格為已直接核對的檢方全文。"

facts:
  - id: F001
    statement: "《社會秩序維護法》第89條第2款處罰要件是『無正當理由，跟追他人，經勸阻不聽』；條文沒有明文要求跟追開始前必須已有被跟追者涉嫌不法的明確事證。"
    status: verified
    observed_at: "2026-10-22T00:57:39+08:00"
    source_ids: [S001]
    evidence_summary: "現行條文可直接確認法定文字；其核心是正當理由、跟追及經勸阻不聽，而非『事前犯罪證據』門檻。"
    tags: [社維法89條, 跟追, 正當理由]

  - id: F002
    statement: "釋字第689號將『正當理由』具體化為利益衡量：須綜合跟追目的、人時地物及干擾程度，判斷侵擾是否逾越社會通念可容忍界限。"
    status: verified
    observed_at: "2026-10-22T00:57:39+08:00"
    source_ids: [S002]
    evidence_summary: "司法院解釋理由明確說明正當理由有無取決於是否存在足以合理化跟追的事由及具體侵擾程度。"
    tags: [釋字689號, 利益衡量, 社會通念]

  - id: F003
    statement: "釋字第689號對新聞採訪跟追設定的門檻是：有事實足認『特定事件』屬大眾關切並具一定公益性、具有新聞價值；如有必要以跟追方式採訪且跟追依社會通念非不能容忍，即具正當理由。"
    status: verified
    observed_at: "2026-10-22T00:57:39+08:00"
    source_ids: [S002]
    evidence_summary: "該解釋要求具體事件與公益性基礎，但沒有把『被跟拍者已涉嫌犯罪且已有明確事證』設定為一般前提。"
    tags: [釋字689號, 新聞採訪, 公益性, 新聞價值]

  - id: F004
    statement: "釋字第689號列舉可具公益性的採訪事項不只犯罪或重大不當行為，也包括政府施政妥當性、公職人員執行職務與適任性、政治人物言行可信任性等。"
    status: verified
    observed_at: "2026-10-22T00:57:39+08:00"
    source_ids: [S002]
    evidence_summary: "列舉事項本身證明大法官承認的正當公共關切範圍超過刑事犯罪調查。"
    tags: [釋字689號, 公益性, 政治人物, 公職人員]

  - id: F005
    statement: "釋字第689號明示，受新聞採訪自由保障者不限於正式新聞機構記者；一般人為提供具新聞價值資訊、促進公共事務討論或監督政府而從事的新聞採訪行為亦受保障。"
    status: verified
    observed_at: "2026-10-22T00:57:39+08:00"
    source_ids: [S002]
    evidence_summary: "因此『跟拍者不是傳統媒體記者』本身不足以排除釋字689號的採訪自由框架，仍須看行為目的與具體方式。"
    tags: [釋字689號, 新聞採訪自由, 一般人]

  - id: F006
    statement: "2025年10月3日，王義川律師陳君瑋公開主張：跟拍一個人的前提設定是對方已涉及不法，媒體跟拍或跟監在法律上才能成立；在沒有任何明確事證下進行全面性政治跟拍，『很明顯就已經觸法』。"
    status: verified
    observed_at: "2026-10-22T00:57:39+08:00"
    source_ids: [S003]
    evidence_summary: "中央社直接記錄其在北檢前對媒體的說法；此fact只證明該法律主張被公開提出。"
    tags: [王義川, 陳君瑋, 跟拍, 法律主張]

  - id: F007
    statement: "依中央社轉述王義川取得的桃園地檢署不起訴處分書，王義川案4名跟拍者總計跟拍9天且自稱媒體；檢方對該批跟拍者作不起訴處分。"
    status: partial
    observed_at: "2026-10-22T00:57:39+08:00"
    source_ids: [S004]
    evidence_summary: "不起訴結果與9天跟拍均有中央社報導，但本次未直接取得處分書全文，因此不把報導中的檢方理由逐字升格為primary fact。"
    verification_notes:
      - "若後續取得不起訴處分書原文，應補核構成要件、拍攝場所、拍攝方式及不起訴理由。"
    tags: [王義川, 桃園地檢署, 跟拍9天, 不起訴]

claims:
  - id: C001
    statement: "台灣現行法對公共利益／新聞採訪式跟拍設有一般前提：在開始跟拍前，必須已掌握被跟拍者涉嫌不法的明確事證，否則跟拍即違法。"
    status: contradicted
    contradicts: [F001, F003, F004]
    related_facts: [F002, F005, F006]
    reasoning_notes: "社維法第89條沒有此法定文字；釋字689號要求的是有事實足認特定事件具公益性與新聞價值，並衡量跟追必要性、侵擾程度與社會可容忍性。其列舉的正當採訪事項包含多種非犯罪性公共議題。因此把『已存在涉嫌不法的明確事證』當成一般法律必要條件，與現有最高層級憲法解釋不符。此結論限於一般跟追／採訪門檻，不表示任何具體長期跟拍行為當然合法，也不排除刑法、個資法、民事人格權等其他規範另有違法可能。"

  - id: C002
    statement: "只要跟拍目的聲稱是揭弊或新聞採訪，就當然具正當理由。"
    status: contradicted
    contradicts: [F002, F003]
    reasoning_notes: "釋字689號仍要求具體事件有公益性、跟追有必要性，且侵擾程度依社會通念非不能容忍；採訪名義不是自動免責。"

  - id: C003
    statement: "若完全沒有可具體指認的公共利益事件或查證線索，只是先長期跟著政治人物、期待碰巧取得可用素材，其『正當理由』會比針對具體公益事件進行比例適當的查證弱。"
    status: supported
    supports: [F002, F003, F004]
    reasoning_notes: "這是從釋字689號『有事實足認特定事件』與目的／侵擾程度衡量推出的法律分析。是否已達違法仍需個案事實，不能只靠『長期跟拍』四字直接定性。"

  - id: C004
    statement: "王義川遭跟拍9天的具體任務目的，是調查某一已知弊案、手機信令爭議、純私德問題，或一般性政治素材蒐集。"
    status: unresolved
    related_facts: [F007]
    reasoning_notes: "目前取得的公開來源可證明跟拍期間與不起訴結果，但未取得任務指示、委託內容或完整不起訴處分書，不能從後來公開的闖紅燈影像反推最初調查目的。"

