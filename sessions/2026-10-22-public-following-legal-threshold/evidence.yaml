promotion:
  cases: []
  comparators:
    - "後續可用於比較不同陣營的公共場所跟拍案件：同一標準應檢查具體公共利益事件、跟追必要性、侵擾程度、是否經勸阻及其他適用法律，而非直接以『狗仔／跟監』標籤替代構成要件。"
  research:
    - "可連結 research/2026-10-20-public-authority-auditability-unfalsifiability：若有人把『先有明確犯罪證據』設定為調查前提，應先查其法源是否存在，再分析其是否形成 self-sealing 的證據取得障礙。"

notes:
  - "本session只處理法律門檻與已知程序事實，不判斷黃國昌是否實際指揮跟拍、跟拍任務的真正目的，亦不判斷整體案件是否違反個資法、刑法315-1或國安法。"
  - "『沒有事前明確犯罪證據就不得跟拍』與『毫無具體公共利益事件、無差別長期跟拍的正當性較弱』是兩個不同命題；前者目前被法源反駁，後者受到釋字689號框架支持但仍須個案衡量。"
  - "如果未來取得桃園地檢署不起訴處分書原文，應優先補核，而不是繼續依新聞二手轉述擴張結論。"
