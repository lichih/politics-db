notes:
  - "參照：sessions/2026-10-22-kuangshi-public-investment/evidence.yaml。此檔僅保存可見社群樣本與論述形式，不將留言當作交易或違法證據。"
  - "語義分層：直接財務反論、具體文件／權責要求、訴訟門檻／策略、先行定罪式政治評價、另案轉題、群體攻擊、純支持、反諷及語義不明；不以一個『有理率』混合。"
  - "關於重複作者：261個作者標識／265留言，代表至少有重複標識，並不代表可靠去重後261名自然人；不公開作者姓名與handle。"
  - "逐則主分類尚未做人工作全樣本互斥編碼，因此只提供可核對的『19則含提告／去告／按鈴字面詞組』，不給論證有效率或陣營比例。避免用不準確比例替政治立場背書。"
  - "同一言論可同時有有效問題與侮辱（例1793471498581982），不能因一句情緒用詞抹去相關論點，亦不能因提出一個相關問題就免除其無據指控責任。"
