facts:
  - id: F001
    statement: "沈曾主張『對中國來說，所有交流都是統戰的一部分』，但其完整主張同時包含建立風險管理與法律依據，而非全面禁止交流；2026又表示無政治前提、有效益的雙城論壇可做。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S001, S002]
    evidence_summary: "『所有交流都是統戰的一部分』確有其言，但『所以所有交流都不應做』不是其完整原意。"
    excerpt: ""
    verification_notes: []
    tags: [兩岸交流]

  - id: F002
    statement: "沈2026稱自己從未主張毒品除罪化；但其2014文章確實把除罪化列為政策方案並作正面討論，且另提出社區中心、毒品與乾淨針頭等減害構想。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S003, S004]
    evidence_summary: "圖卡若寫『討論除罪化』與『現在稱從未主張』，有實質張力；但『討論』本身不等於『正式政策主張』。"
    excerpt: ""
    verification_notes:
      - "更完整的2014 contemporaneous evidence已另存 shen-drug-policy session。"
    tags: [毒品政策]

  - id: F003
    statement: "沈舊演講確曾以『國家在殺人』與反省後『死刑判不下去』的方式討論死刑；2026則明確表示死刑應謹慎、減少使用但仍要維持。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S005, S006]
    evidence_summary: "可支持其死刑態度有顯著移動；但舊演講是否等於正式主張全面廢死，仍需避免過度概括。"
    excerpt: ""
    verification_notes: []
    tags: [死刑]

  - id: F004
    statement: "沈2025批核三延役公投主文模糊、浪費公帑；2026則稱其核能原則未變，若核安、核廢料與社會共識問題改善，可再討論核能。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S007, S008]
    evidence_summary: "這是由反對一個具體延役公投轉為條件式開放核能討論，不等於無條件由反核轉挺核。"
    excerpt: ""
    verification_notes: []
    tags: [核能]

  - id: F005
    statement: "沈2025把在野推動的普發1萬元放在『癱瘓政府／共產黨的招』框架；2026支持由行政部門在不舉債、先顧弱勢、預算先編條件下普發，也主張地方有餘裕可加碼。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S009, S010]
    evidence_summary: "前後政策結論不同，但沈提出了財政與預算權限上的條件差異；因此不能只用『以前反普發、現在挺普發』概括。"
    excerpt: ""
    verification_notes:
      - "2025『共產黨的招』修辭本身遠比其後來提出的技術性區分更寬泛，仍有政治修辭一致性問題。"
    tags: [普發現金]

  - id: F006
    statement: "沈2025並非大罷免正式發起人，但確實高度支持、公開宣講、呼籲民進黨中央投入協助；2026仍承認自己『很贊成』當時的大罷免，只強調發起者是公民團體。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S011, S012, S013]
    evidence_summary: "『不是發起人』是形式上的事實；若被用來淡化其高度參與與政治支持程度，則會造成不完整印象。"
    excerpt: ""
    verification_notes: []
    tags: [大罷免]

claims:
  - id: C001
    statement: "圖卡六項都能直接證明沈伯洋『立場180度翻轉』。"
    status: contradicted
    supports: []
    contradicts: [F001, F004, F005, F006]
    related_facts: [F002, F003]
    reasoning_notes: "六項證據強度不同。毒品與死刑的敘事張力最強；兩岸、核能、普發都有可檢驗的條件差異；大罷免則主要是角色與責任敘事，不是政策立場反轉。"

  - id: C002
    statement: "這張圖可作為『沈在進入市長選戰後重新包裝過去立場』的查核索引。"
    status: supported
    supports: [F001, F002, F003, F004, F005, F006]
    contradicts: []
    related_facts: []
    reasoning_notes: "適合作為待查清單，但每一項必須回到完整語境，不能把六項都當成同強度證據。"

