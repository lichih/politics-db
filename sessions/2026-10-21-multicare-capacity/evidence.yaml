  title: 外國人從事就業服務法第四十六條第一項第八款至第十款工作資格及審查標準－多元陪伴照顧服務工作
  url: https://laws.mol.gov.tw/FLAW/FLAWDAT0201.aspx?beginpos=12&id=FL028067
