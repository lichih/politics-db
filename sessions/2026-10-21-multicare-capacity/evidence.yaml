sources:
- id: S001
  source_type: primary
  publisher: 勞動部勞動法令查詢系統
  title: 多元陪伴照顧服務試辦計畫
  url: https://laws.mol.gov.tw/FLAW/FLAWDAT0201.aspx?id=FL104236
  published_at: '2024-11-14'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 計畫目的明定由試辦單位提供短期、臨時或持續一定時間之照顧人力；試辦單位聘僱本國籍及外國籍工作者，再指派至服務契約履行地。
  - 試辦單位本身是陪伴照顧服務工作者之雇主，負擔法定雇主責任。
  - 服務單次至少四小時；申請後由試辦單位評估陪伴照顧需要並簽訂服務契約。
  - 試辦單位須設定總服務時數及服務人數（次）目標，並每月提送服務對象名冊、派案日程表與統計月報表。
  - 首次試辦成果報告與年度成果報告至少包括服務成果統計、服務對象滿意度、人力運用及成效等。
  - 累積服務滿1,000小時可申請試辦補助；核定後一年內累積達2,000、5,000、8,000及10,000小時，可分別申請績效獎金5萬元，累計最高20萬元。
  - 外國籍陪伴照顧服務工作者人數不得超過勞動部核定人數；欲增加須重新報請核定。

- id: S002
  source_type: primary
  publisher: 勞動部勞動力發展署
  title: 計畫內容簡介｜多元陪伴照顧服務計畫
  url: https://mcs.wda.gov.tw/about-us
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 官方以「臨短急」描述需求情境，舉例為長輩臨時有狀況找不到人力、外籍家庭看護空窗期短期需要人力、家人手術或病後的急性後期服務。
  - 民眾全額自費，單次至少4小時以上或全日服務。
  - 申請資格包括身心障礙、重大傷病、三個月內就醫或手術、符合家庭看護移工被看護者資格、長照2至8級等。

- id: S003
  source_type: primary
  publisher: 勞動部勞動力發展署／多元陪伴照顧服務計畫
  title: 「多元陪伴照顧」服務區域再擴大 「北北基桃」生活圈全納入
  url: https://mcs.wda.gov.tw/news/41
  published_at: '2026-01-30'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 截至新聞稿發布時，全臺13家試辦單位、服務16縣市、覆蓋率逾7成，累積服務時數逾3.4萬小時、服務人次逾3,900。
  - 官方統計服務對象以短期重大傷病及術後出院照顧占35%為最多，長照服務空窗與聘僱外籍家庭看護喘息合計占27%。
  - 官方明載申請服務頻率可從1天單次服務到1週或1個月，依個案需求提出並由試辦單位評估後派員。

- id: S004
  source_type: primary
  publisher: 勞動部統計處
  title: 114年移工管理及運用調查統計結果
  url: https://www.mol.gov.tw/1607/1632/1633/87456/?cprint=pt
  published_at: '2026-01-12'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 調查於2025年7月至8月進行，家庭雇主有效樣本4,022份。
  - 2025年6月外籍家庭看護工每月有休假者占65.8%；平均每月休假1天者占31.7%，2至3天者14.2%，4天以上者9.2%。
  - 家庭雇主於外籍看護工休假時有替代照顧方案者占85.2%；最主要替代方案為家人照顧66.9%，政府喘息或居家服務15.6%。
  - 調查註明外籍家庭看護工勞動契約訂定每7天須休假1天或2天，若休假日工作，雇主須補休或給付加班費。

- id: S005
  source_type: primary
  publisher: 勞動部勞動力發展署
  title: 表12-5 引進移工在臺人數－按開放項目及國籍分
  url: https://statdb.mol.gov.tw/html/mon/212050.pdf
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 本次PDF畫面所見表題為「115年6月底 End of June, 2026」。
  - 該期有效在臺外籍「多元陪伴照顧服務工作」46人；外籍家庭看護工212,209人。
  - 此URL為勞動部月報固定網址，內容可能隨月份更新；本紀錄僅保存本次觀察到的2026年6月底表格，不把目前URL狀態倒推到其他月份。

- id: S006
  source_type: primary
  publisher: 勞動部勞動法令查詢系統
  title: 外國技術人力工作資格及許可管理辦法－第5條立法理由
  url: https://laws.mol.gov.tw/FLAW/FLAWDOC01.aspx?flno=5&id=FL105895
  published_at: '2025-12-30'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 開放「多元陪伴照顧服務技術工作」的立法理由明載：試辦逾半年後，部分服務單位反映具經驗及專業技術之外國籍合適人力招募不易。
  - 立法理由把語言、專業能力與服務品質高度相關列為新增技術工作類別的重要理由。

- id: S007
  source_type: primary
  publisher: 勞動部勞動法令查詢系統
  title: 外國人受聘僱從事就業服務法第四十六條第一項第八款至第十一款規定工作之轉換雇主或工作程序準則
  url: https://laws.mol.gov.tw/FLAW/PrintFLAWDAT0202.aspx?id=FL026615
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 現行規則將家庭幫傭、家庭看護、家庭看護技術、機構看護、機構看護技術、多元陪伴照顧服務及多元陪伴照顧服務技術工作列為同一工作類別。
  - 因此多元陪伴之外籍人力來源可能包括既有在臺照顧／家事移工的轉換；此規則本身不能證明每一名多元陪伴工作者的實際來源或淨增人力數。

- id: S008
  source_type: primary
  publisher: 勞動部
  title: 民間團體於今日（15）針對移工雇主權益所召開之記者會，勞動部回應
  url: https://www.mol.gov.tw/1607/1632/1633/99548/post
  published_at: '2026-10-15'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 勞動部明確認知家庭看護移工若休假、失聯、重大傷病或無法工作，家庭可能陷入照護中斷困境。
  - 勞動部表示現有喘息服務與短期照顧服務合計每年約52日，並稱後續將與衛福部擴大公共照顧資源與制度銜接，盡力降低照顧中斷。

- id: S009
  source_type: primary
  publisher: 勞動部勞動法令查詢系統
  title: 外國人從事就業服務法第四十六條第一項第八款至第十款工作資格及審查標準－多元陪伴照顧服務工作
  url: https://laws.mol.gov.tw/FLAW/FLAWDAT0201.aspx?beginpos=12&id=FL028067
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 外籍多元陪伴照顧服務工作者之雇主須為符合資格之非營利法人。
  - 外籍多元陪伴工作人數不得超過中央主管機關核定總人數。
  - 初次招募人數、取得招募許可及已聘僱人數均納入核定總人數計算。

- id: S010
  source_type: primary
  publisher: 勞動部勞動力發展署／多元陪伴照顧服務計畫
  title: 「多元陪伴照顧服務試辦計畫」再添7家試辦單位
  url: https://mcs.wda.gov.tw/news/35
  published_at: '2025-09-30'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 第二階段新增單位核定後仍須招聘本、外國籍工作人員並安排職前訓練，官方當時估計最快約兩個月後才能正式提供服務。
  - 此來源可證明擴大「試辦單位數」與立即增加可派遣人力不是同一事件。

facts:
- id: F001
  statement: 多元陪伴照顧服務的法定運作模式，是由試辦單位聘僱本國籍及外國籍陪伴照顧工作者、由試辦單位負擔雇主責任，再依服務契約把工作者指派至家庭提供照顧；家庭購買的是服務，而不是直接成為該名工作者的雇主。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S009]
  evidence_summary: 試辦計畫第2、12點與審查標準直接建立「服務單位為雇主、工作者一對多指派」的制度結構。
  tags: [集中僱用, 服務提供者, 雇主責任, 一對多]

- id: F002
  statement: 正式試辦計畫把服務定位為「短期、臨時或持續一定時間」的照顧人力，服務資格涵蓋身障、重大傷病、近期就醫或手術、符合家庭看護移工被看護者資格及長照2至8級等多種情境；單次服務下限是4小時。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S002]
  evidence_summary: 「臨時」不是唯一服務型態，計畫文字本身同時允許短期與持續一定時間的需求。
  tags: [臨時, 短期, 持續服務, 服務資格]

- id: F003
  statement: 官方「臨短急」宣傳描述的是需求情境；正式程序是申請後由試辦單位評估照顧需要、簽服務契約再派員，現行試辦計畫條文未設定「臨時」等同同日、24小時內或其他固定時限必須派到人的服務水準承諾。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S002]
  evidence_summary: 可確認官方把臨短急用於需求分類，並規定評估、契約及派案程序；完整計畫未見固定到案時限。
  verification_notes:
  - 此事實只針對中央試辦計畫文本；個別試辦單位若另有自訂服務時效承諾，須另案查核。
  tags: [臨短急, SLA, 派案, 需求分類]

- id: F004
  statement: 勞動力發展署2026年1月30日公開資料明載，實際申請頻率從1天單次服務到1週或1個月都有，且長照服務空窗與聘僱外籍家庭看護喘息合計占當時申請服務對象27%。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S003]
  evidence_summary: 官方實際服務統計直接證明此制度並非只處理一次性的突發需求，也承接可持續一段時間的需求。
  tags: [重複需求, 一週, 一個月, 外看喘息, 長照空窗]

- id: F005
  statement: 現行中央《多元陪伴照顧服務試辦計畫》規定服務資格、單次最低時數、評估與契約流程，但未設定每名服務對象每週、每月或每年的通用申請次數上限、冷卻期或「只能一次性使用」限制。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S003]
  evidence_summary: 完整試辦計畫1至18點未見此類頻率上限；官方實際資料並明載1週或1個月的服務需求可依個案需要提出。
  verification_notes:
  - 未排除個別試辦單位因人力、契約或排班另設限制；中央規則沒有通用頻率上限，不等於任何時段均可成功預約。
  tags: [申請頻率, 次數上限, recurring-demand]

- id: F006
  statement: 試辦計畫的正式補助與績效獎金門檻直接與已實現的服務時數連結：累積滿1,000小時可申請試辦補助，核定後一年內累積達2,000、5,000、8,000、10,000小時可逐段申請績效獎金；試辦單位也須預先設定總服務時數及服務人數（次）目標。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001]
  evidence_summary: 正式制度明確以服務量作為補助與獎勵的重要條件。
  tags: [KPI, 服務時數, 服務人次, 績效獎金]

- id: F007
  statement: 試辦計畫要求蒐集每月服務對象名冊、派案日程表、統計月報表，並要求服務對象滿意度調查、執行成效研析及績效影響評估；因此主管機關與受託專業團體依法定計畫至少具有比公開新聞稿更細的派案與個案資料來源。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001]
  evidence_summary: 第12、16點直接要求資訊系統、派案日程、月報、滿意度與成效評估。
  verification_notes:
  - 現有條文沒有直接證明這些內部資料一定包含「申請但未成功派案」的完整統計，也沒有證明相關資料已公開。
  tags: [資料蒐集, 月報, 派案, 滿意度, 成效評估]

- id: F008
  statement: 2026年1月30日官方對外成果宣傳使用的主要量化指標包括13家試辦單位、16縣市、服務縣市覆蓋率逾7成、累積服務3.4萬小時與3,900人次。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S003]
  evidence_summary: 可確認官方對外公開的成功敘事至少大量採用供給面與已完成服務量指標。
  tags: [公開KPI, 服務時數, 服務人次, 覆蓋率]

- id: F009
  statement: 勞動部2025年家庭雇主調查顯示，外籍家庭看護工每月有休假者僅65.8%，其中平均每月只休1天者31.7%；家庭雇主在看護休假時的最主要替代方案是家人照顧（66.9%），政府喘息或居家服務為15.6%。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S004]
  evidence_summary: 國家抽樣調查顯示看護休假與替代照顧不是邊緣情境，且實務上主要由家庭自己吸收。
  tags: [外看休假, 家庭接手, 替代照顧, 官方調查]

- id: F010
  statement: 2026年10月15日勞動部仍公開承認，家庭看護移工休假、失聯、重大傷病或無法工作都可能使家庭陷入照護中斷，並表示現有喘息與短期照顧服務合計每年約52日，後續還要擴大跨部會公共照顧資源與制度銜接。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S008]
  evidence_summary: 主管機關最新公開回應本身確認「照顧中斷」仍是需要持續處理的政策問題。
  tags: [照顧中斷, 喘息服務, 短期照顧, "2026"]

- id: F011
  statement: 2026年6月底勞動部移工統計表顯示，有效在臺外籍多元陪伴照顧服務工作者46人，同期外籍家庭看護工212,209人；這個比較只反映外籍人力，不包含多元陪伴的本國籍工作者。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S005]
  evidence_summary: 同一官方統計表提供兩類外籍人力的同一時點量級基準；46與212,209約為1比4,613。
  verification_notes:
  - 不得把46人誤寫成當時多元陪伴全部工作者總數，因制度另有本國籍工作者。
  - 固定月報URL可能隨時間更新，本事實僅保存2026年6月底表格的觀察。
  tags: [人力規模, 外籍工作者, 2026年6月, baseline]

- id: F012
  statement: 2025年底新增多元陪伴照顧服務「外國技術人力」類別時，官方立法理由直接記載部分試辦單位反映「具經驗及專業技術之外國籍合適人力招募不易」。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S006]
  evidence_summary: 人力招募困難不是外部推測，而是中央法規立法理由保存的制度執行回饋。
  tags: [缺工, 招募困難, 專業人力, 外國技術人力]

- id: F013
  statement: 多元陪伴之外籍人力供給並非單一路徑：試辦單位須先以合理勞動條件招募本國勞工，未滿足部分才可申請外籍人力；外籍名額可包含初次招募，同時現行轉換規則又把家庭看護、機構看護及多元陪伴等列為同一工作類別，允許既有在臺人力在規則下轉換。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S007, S009]
  evidence_summary: 制度同時存在「新招募」與「既有人力轉換」來源，因此不能把所有新增多元陪伴名額都直接視為照顧市場的淨新增供給，也不能反向說完全沒有新增供給。
  tags: [人力來源, 國內招募, 初次招募, 轉換雇主, 淨供給]

- id: F014
