- id: S016
  source_type: primary
  publisher: 勞動部勞動力發展署
  title: 多元陪伴照顧服務試辦計畫－附件二多元陪伴照顧服務計畫書
  url: https://orsd.wda.gov.tw/download?code=eyJpdiI6IkFyY3JldkVwV2NiM1NZajFrdGRGSlE9PSIsInZhbHVlIjoiSEJFeFRsV0ZLM3pvcW5JcHRkRzFnVXBRbTI1YmZ6QzhzQzM0Q3VOSUg1bz0iLCJtYWMiOiI2OTgzZWY2NjE0MGI1YjcxZWRlNGU2Y2I3YzU5ODcwNjkyZTRmNTg2NTkxNDEwN2IwNmU4OGYzYWJlYjYyMGM0IiwidGFnIjoiIn0%3D
