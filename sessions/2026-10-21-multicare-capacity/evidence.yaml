  - 同一計畫書要求說明排班原則、24小時換班、空班時間管理及單一工作者工時規劃。
  - 這證明中央評選要求各單位設計重症優先機制；但文件不是全國統一的實際派案順位表，也未把「突然發生的照顧空窗」本身列為一律優先於規律預約需求。

facts:
- id: F001
  statement: 多元陪伴照顧服務的法定運作模式，是由試辦單位聘僱本國籍及外國籍陪伴照顧工作者、由試辦單位負擔雇主責任，再依服務契約把工作者指派至家庭提供照顧；家庭購買的是服務，而不是直接成為該名工作者的雇主。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S009]
  evidence_summary: 試辦計畫第2、12點與審查標準直接建立「服務單位為雇主、工作者一對多指派」的制度結構。
  tags: [集中僱用, 服務提供者, 雇主責任, 一對多]

- id: F002
  statement: 正式試辦計畫把服務定位為「短期、臨時或持續一定時間」的照顧人力，服務資格涵蓋身障、重大傷病、近期就醫或手術、符合家庭看護移工被看護者資格及長照2至8級等多種情境；單次服務下限是4小時。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S002]
  evidence_summary: 「臨時」不是唯一服務型態，計畫文字本身同時允許短期與持續一定時間的需求。
  tags: [臨時, 短期, 持續服務, 服務資格]

- id: F003
  statement: 官方「臨短急」宣傳描述的是需求情境；正式程序是申請後由試辦單位評估照顧需要、簽服務契約再派員，現行試辦計畫條文未設定「臨時」等同同日、24小時內或其他固定時限必須派到人的服務水準承諾。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S002]
  evidence_summary: 可確認官方把臨短急用於需求分類，並規定評估、契約及派案程序；完整計畫未見固定到案時限。
  verification_notes:
  - 此事實只針對中央試辦計畫文本；個別試辦單位若另有自訂服務時效承諾，須另案查核。
  tags: [臨短急, SLA, 派案, 需求分類]

- id: F004
  statement: 勞動力發展署2026年1月30日公開資料明載，實際申請頻率從1天單次服務到1週或1個月都有，且長照服務空窗與聘僱外籍家庭看護喘息合計占當時申請服務對象27%。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S003]
  evidence_summary: 官方實際服務統計直接證明此制度並非只處理一次性的突發需求，也承接可持續一段時間的需求。
  tags: [重複需求, 一週, 一個月, 外看喘息, 長照空窗]

- id: F005
  statement: 現行中央《多元陪伴照顧服務試辦計畫》規定服務資格、單次最低時數、評估與契約流程，但未設定每名服務對象每週、每月或每年的通用申請次數上限、冷卻期或「只能一次性使用」限制。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S003]
  evidence_summary: 完整試辦計畫1至18點未見此類頻率上限；官方實際資料並明載1週或1個月的服務需求可依個案需要提出。
  verification_notes:
  - 未排除個別試辦單位因人力、契約或排班另設限制；中央規則沒有通用頻率上限，不等於任何時段均可成功預約。
  tags: [申請頻率, 次數上限, recurring-demand]

- id: F006
  statement: 試辦計畫的正式補助與績效獎金門檻直接與已實現的服務時數連結：累積滿1,000小時可申請試辦補助，核定後一年內累積達2,000、5,000、8,000、10,000小時可逐段申請績效獎金；試辦單位也須預先設定總服務時數及服務人數（次）目標。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001]
  evidence_summary: 正式制度明確以服務量作為補助與獎勵的重要條件。
  tags: [KPI, 服務時數, 服務人次, 績效獎金]

- id: F007
  statement: 試辦計畫要求蒐集每月服務對象名冊、派案日程表、統計月報表，並要求服務對象滿意度調查、執行成效研析及績效影響評估；因此主管機關與受託專業團體依法定計畫至少具有比公開新聞稿更細的派案與個案資料來源。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001]
  evidence_summary: 第12、16點直接要求資訊系統、派案日程、月報、滿意度與成效評估。
  verification_notes:
  - 現有條文沒有直接證明這些內部資料一定包含「申請但未成功派案」的完整統計，也沒有證明相關資料已公開。
  tags: [資料蒐集, 月報, 派案, 滿意度, 成效評估]

- id: F008
  statement: 2026年1月30日官方對外成果宣傳使用的主要量化指標包括13家試辦單位、16縣市、服務縣市覆蓋率逾7成、累積服務3.4萬小時與3,900人次。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S003]
  evidence_summary: 可確認官方對外公開的成功敘事至少大量採用供給面與已完成服務量指標。
  tags: [公開KPI, 服務時數, 服務人次, 覆蓋率]

- id: F009
  statement: 勞動部2025年家庭雇主調查顯示，外籍家庭看護工每月有休假者僅65.8%，其中平均每月只休1天者31.7%；家庭雇主在看護休假時的最主要替代方案是家人照顧（66.9%），政府喘息或居家服務為15.6%。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S004]
  evidence_summary: 國家抽樣調查顯示看護休假與替代照顧不是邊緣情境，且實務上主要由家庭自己吸收。
  tags: [外看休假, 家庭接手, 替代照顧, 官方調查]

- id: F010
  statement: 2026年10月15日勞動部仍公開承認，家庭看護移工休假、失聯、重大傷病或無法工作都可能使家庭陷入照護中斷，並表示現有喘息與短期照顧服務合計每年約52日，後續還要擴大跨部會公共照顧資源與制度銜接。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S008]
  evidence_summary: 主管機關最新公開回應本身確認「照顧中斷」仍是需要持續處理的政策問題。
  tags: [照顧中斷, 喘息服務, 短期照顧, "2026"]

- id: F011
  statement: 2026年6月底勞動部移工統計表顯示，有效在臺外籍多元陪伴照顧服務工作者46人，同期外籍家庭看護工212,209人；這個比較只反映外籍人力，不包含多元陪伴的本國籍工作者。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S005]
  evidence_summary: 同一官方統計表提供兩類外籍人力的同一時點量級基準；46與212,209約為1比4,613。
  verification_notes:
  - 不得把46人誤寫成當時多元陪伴全部工作者總數，因制度另有本國籍工作者。
  - 固定月報URL可能隨時間更新，本事實僅保存2026年6月底表格的觀察。
  tags: [人力規模, 外籍工作者, 2026年6月, baseline]

- id: F012
  statement: 2025年底新增多元陪伴照顧服務「外國技術人力」類別時，官方立法理由直接記載部分試辦單位反映「具經驗及專業技術之外國籍合適人力招募不易」。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S006]
  evidence_summary: 人力招募困難不是外部推測，而是中央法規立法理由保存的制度執行回饋。
  tags: [缺工, 招募困難, 專業人力, 外國技術人力]

- id: F013
  statement: 多元陪伴之外籍人力供給並非單一路徑：試辦單位須先以合理勞動條件招募本國勞工，未滿足部分才可申請外籍人力；外籍名額可包含初次招募，同時現行轉換規則又把家庭看護、機構看護及多元陪伴等列為同一工作類別，允許既有在臺人力在規則下轉換。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S007, S009]
  evidence_summary: 制度同時存在「新招募」與「既有人力轉換」來源，因此不能把所有新增多元陪伴名額都直接視為照顧市場的淨新增供給，也不能反向說完全沒有新增供給。
  tags: [人力來源, 國內招募, 初次招募, 轉換雇主, 淨供給]

- id: F014
  statement: 外籍多元陪伴人力受中央核定總人數限制，試辦單位欲增加核定外籍人數須重新報請勞動部核定；新增試辦單位本身也不等於立即出現可派人力，2025年第二階段新單位核定後，官方仍預估招聘與職訓最快約兩個月後才能開始服務。
  status: verified
  observed_at: '2026-10-21T01:45:13+08:00'
  source_ids: [S001, S009, S010]
  evidence_summary: 試辦單位數、核定名額、實際到位並完成訓練的人力是不同層次。
  tags: [核定名額, 招募, 職訓, 上線時間, capacity]

- id: F015
  statement: 2025年4月7日正式上路時，勞動部對突發需求提供的明確時效承諾是「試辦單位於1日內與民眾聯繫」；官方文字接著是由試辦單位聯繫並安排服務，沒有把1日內聯繫寫成1日內必定派到照顧人力。
  status: verified
  observed_at: '2026-10-21T01:57:37+08:00'
  source_ids: [S011]
  evidence_summary: 官方已設定contact SLA，但沒有在同一公告設定dispatch/service SLA；兩者不得混寫。
  tags: [1日內, 聯繫, SLA, 派案]

- id: F016
  statement: 多元陪伴實際已完成服務並非以短時數為主：2026年4月官方公布24小時全日服務占55%；同年6月又公布長時數服務占58%，均為當時最多的使用型態。
  status: verified
  observed_at: '2026-10-21T01:57:37+08:00'
  source_ids: [S012, S013]
  evidence_summary: 兩個不同時間點的官方成果資料一致顯示長時數需求在已服務案件中占重要甚至最大比例。
  tags: [24小時, 長時數, 使用型態, capacity]

- id: F017
  statement: 截至2026年7月底，官方公布的已服務案件中，「單次使用」與「一至兩週1次」兩種頻率合計占76%；單次服務13至24小時占62%，涉及夜間服務占75%。
  status: verified
  observed_at: '2026-10-21T01:57:37+08:00'
  source_ids: [S014]
  evidence_summary: 官方統計直接確認計畫同時承接單次與規律週期需求，且長時數、夜間是大量實際使用型態。
  verification_notes:
  - 76%是「單次」與「每1至2週一次」合計，來源未拆分各自比例，不得把76%全算成週期性使用。
  tags: [一至兩週一次, 13至24小時, 夜間, 使用頻率]

- id: F018
  statement: 2026年9月勞動力發展署以「每週末固定4小時、持續超過1年」的多元陪伴個案作為正面成功案例公開宣傳。
  status: verified
  observed_at: '2026-10-21T01:57:37+08:00'
  source_ids: [S015]
  evidence_summary: 規律、可預測且長期重複的每週需求不只是規則上未禁止，而是已實際提供並被主管機關當作制度成功案例。
  tags: [每週, 固定需求, 超過一年, recurring-demand]

- id: F019
  statement: 中央提供給試辦申請單位的計畫書格式要求各單位提出派案原則，且須包括「重症服務對象優先服務規劃」；同時要求說明排班、24小時換班、空班管理及單一工作者工時。
  status: verified
  observed_at: '2026-10-21T01:57:37+08:00'
  source_ids: [S016]
  evidence_summary: 中央制度有要求試辦單位自行設計重症優先及排班機制，因此不能概括說完全沒有優先概念；但實際優先順序仍取決於各核定計畫與執行。
  tags: [重症優先, 派案原則, 排班, 空班管理]

claims:
- id: C001
  statement: 多元陪伴照顧服務在制度結構上已經實作「由專業服務單位當雇主、家庭購買照顧服務、工作者一對多調派」的集中僱用模式，而不是傳統家庭直接僱用單一外籍家庭看護。
  status: supported
  supports: [F001]
  contradicts: []
  related_facts: [F002]
  reasoning_notes: 這個命題只描述法律與服務架構，不等於制度已有足夠人力或可保證任何特定時段派案成功。

- id: C002
  statement: 官方所稱「臨、短、急」可以直接解讀成「符合資格的家庭臨時有事時，制度承諾在當日或固定短時限內一定派得到人」。
  status: contradicted
  supports: []
  contradicts: [F002, F003]
  related_facts: [F004]
  reasoning_notes: 正式計畫允許持續一定時間的需求，並設評估、契約與派案程序；沒有固定到案SLA。臨短急是需求情境描述，不是派案成功保證。

- id: C003
  statement: 中央試辦規則禁止符合資格的家庭每週或每月反覆申請多元陪伴服務，因此固定、可預測需求不會持續占用同一人力池。
  status: contradicted
  supports: []
  contradicts: [F004, F005, F017, F018]
  related_facts: []
  reasoning_notes: 官方不只未設通用頻率上限，實際統計包含一至兩週1次，且主管機關公開宣傳過每週固定4小時、持續超過1年的成功案例。個別單位仍可能依容量限制新申請，但「中央禁止週期性使用」已與官方實務相反。

- id: C004
  statement: 只要多元陪伴制度存在，或官方能提出累積服務時數、人次與服務縣市，就足以證明外籍家庭看護突然中斷時已存在可靠且可即時取得的備援。
  status: unsupported
  supports: []
  contradicts: []
  related_facts: [F003, F006, F007, F008, F010, F012, F014]
  reasoning_notes: 已完成服務量只能證明確實有人得到服務；要證明「可靠備援」仍至少需要申請總量、未派案率、等待時間、指定日期履約率及急案補位率等可得性資料。

- id: C005
  statement: 現行正式補助與績效獎勵制度明確獎勵已完成的服務時數與服務量，但未在試辦計畫中設置與「保留待命容量」、「未滿足需求率」或「急案指定時限補位率」直接掛鉤的對等獎勵門檻。
  status: supported
  supports: [F006]
  contradicts: []
  related_facts: [F007, F008]
  reasoning_notes: 這是對正式計畫的制度文字比較；不進一步推定試辦單位一定會因此刻意排滿所有人力，也不推定主管機關沒有其他內部管理指標。

- id: C006
  statement: 目前公開資料已足以量化多元陪伴的申請成功率、被拒或無人可派比例、平均等待時間、指定日期履約率及突發空窗補位率。
  status: unresolved
  supports: []
  contradicts: []
  related_facts: [F007, F008]
  reasoning_notes: 試辦計畫要求內部蒐集派案與月報資料，但本次官方公開搜尋尚未找到上述同口徑指標。not_found不能推論政府內部從未統計。

- id: C007
  statement: 多元陪伴照顧服務是政府主觀上故意設計的「面子工程」，目的只是宣稱「我有做」而不是解決問題。
  status: unresolved
  supports: []
  contradicts: []
  related_facts: [F006, F008, F010, F012]
  reasoning_notes: 現有資料足以檢驗制度目標、容量與KPI是否匹配，但不足以證明設計者的主觀動機。對外評論可批評「有服務不等於需求被滿足」，不應把動機提前寫成事實。

- id: C008
  statement: 2026年6月底的外籍多元陪伴人力規模，相對外籍家庭看護母體非常小；但只憑46比212,209不能直接推算所有多元陪伴服務的總可用容量。
  status: supported
  supports: [F011]
  contradicts: []
  related_facts: [F014]
  reasoning_notes: 同期外籍人力約1比4,613，但多元陪伴另有本國籍工作者，因此這個比值只能作外籍人力量級baseline。

- id: C009
  statement: 新增「多元陪伴照顧服務技術工作」這個工作類別本身，就足以證明多元陪伴的總照顧人力短缺已被解決。
  status: unsupported
  supports: []
  contradicts: [F012]
  related_facts: [F013, F014]
  reasoning_notes: 新類別的立法理由本身正是回應合適人力招募不易；人力來源還涉及既有在臺移工轉換與中央核定名額，必須看實際淨增人力與可派案量。

- id: C010
  statement: 家庭看護休假或中斷時的替代照顧需求是具體且持續存在的結構性問題，而不是只在極少數突發個案才會出現。
  status: supported
  supports: [F009, F010]
  contradicts: []
  related_facts: [F004]
  reasoning_notes: 全國家庭雇主抽樣調查與2026年勞動部最新回應都直接處理休假及照護中斷；不能由此推成每個家庭都同樣缺乏替代人力。

- id: C011
  statement: 多元陪伴同一人力池實際承接規律、可預測且反覆發生的照顧需求，並非只在不可預測的突發空窗時才啟用。
  status: supported
  supports: [F004, F017, F018]
  contradicts: []
  related_facts: [F016]
  reasoning_notes: 官方統計出現一至兩週1次的使用頻率，且官方成功案例有每週固定使用超過1年；因此週期需求占用人力池已是實際制度用途，不只是理論可能。

- id: C012
  statement: 官方「申請後1日內」的承諾足以證明家庭在1日內一定取得實際照顧人力。
  status: contradicted
  supports: []
  contradicts: [F015]
  related_facts: [F003]
  reasoning_notes: 原始公告只承諾試辦單位1日內與民眾聯繫，後續才是安排服務。聯繫時效不能替代派案成功或到案時效。

- id: C013
  statement: 已完成10萬小時、1萬人次以及93%使用者滿意度，可單獨回答「所有提出需求者有多少能在所需時間取得服務」。
  status: contradicted
  supports: []
  contradicts: []
  related_facts: [F007, F008, F017]
  reasoning_notes: 服務時數、人次與使用者滿意度的分母是已提供或已使用服務者；availability問題另需要總申請量、未派案、等待時間、指定日期履約等需求端分母。來源頁面未提供這些分母。

- id: C014
  statement: 中央制度完全沒有任何派案優先機制。
  status: contradicted
  supports: []
  contradicts: [F019]
  related_facts: []
  reasoning_notes: 試辦申請計畫書明文要求各單位規劃「重症服務對象優先服務」。但這不等於全國有統一派案順位，也不能推出「突然空窗」必然優先於固定週期需求；各單位實際核定內容仍待取得。

- id: C015
  statement: 現有中央公開資料已證明「突然發生的家庭看護空窗」在派案順位上一定優先於可預約、每週固定或長期反覆使用的案件。
  status: unresolved
  supports: []
  contradicts: []
  related_facts: [F018, F019]
  reasoning_notes: 中央評選要求的是重症優先規劃，不是「突發性優先」的一致規則；本次尚未取得13家試辦單位完整核定派案順位與實際排班資料。

