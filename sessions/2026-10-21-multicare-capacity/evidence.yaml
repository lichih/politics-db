promotion:
  cases: []
  comparators: []
  research:
  - proposed: multicare-availability-and-backup-capacity
    rationale: 可作為「服務存在」與「服務在需要時可取得」之政策成效評估基準，並持續追蹤未滿足需求、等待時間、派案成功率與人力來源。

notes:
- 本session先回答「多元陪伴到底提供什麼、由誰僱用、人力從哪裡來、需求能否重複使用、官方用什麼量測成果」，不直接下「面子工程」動機結論。
- 關鍵區分：service existence != service availability。服務時數、人次與覆蓋縣市可證明制度確實提供服務，但不能單獨證明某個家庭在指定日期或突發空窗時派得到適任照顧者。
- 「臨時」不得自動解讀為即時服務承諾；正式計畫同時允許短期及持續一定時間，且申請後仍需評估與契約程序。2025年上路公告明確承諾的是申請後1日內「聯繫」，不是1日內必定派到人。
- 2026年官方實績進一步證明同一池人力大量承接長時數、夜間與固定週期需求；每週固定4小時持續超過1年的個案甚至被主管機關當作成功案例。這會直接影響評估「突發空窗是否有可用容量」時應使用的需求模型。
- 照顧人力的可替代性不能只用總人頭衡量；個案技能、地點、時段、交通、語言、照顧難度與家庭接受度都可能縮小某一時間點真正可派的人力。這是待進一步以試辦單位派案規則與實績資料驗證的分析方向，不在本session冒充已驗證統計。
- 勞動部計畫要求月報、派案日程與成效評估，下一步最有價值的是取得或申請公開：總申請件數、未成功派案件數與原因、申請到首次服務等待時間、指定日期履約率、臨時急案補位時間及重複／固定使用占比。
- 私人家庭經驗可用來產生查核問題，但本公開evidence未收錄可識別的私人個案敘述。
