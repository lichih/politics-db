sources:
- id: S001
  source_type: primary
  publisher: 勞動部勞動法令查詢系統
  title: 多元陪伴照顧服務試辦計畫
  url: https://laws.mol.gov.tw/FLAW/FLAWDAT0201.aspx?id=FL104236
  published_at: '2024-11-14'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 計畫目的明定由試辦單位提供短期、臨時或持續一定時間之照顧人力；試辦單位聘僱本國籍及外國籍工作者，再指派至服務契約履行地。
  - 試辦單位本身是陪伴照顧服務工作者之雇主，負擔法定雇主責任。
  - 服務單次至少四小時；申請後由試辦單位評估陪伴照顧需要並簽訂服務契約。
  - 試辦單位須設定總服務時數及服務人數（次）目標，並每月提送服務對象名冊、派案日程表與統計月報表。
  - 首次試辦成果報告與年度成果報告至少包括服務成果統計、服務對象滿意度、人力運用及成效等。
  - 累積服務滿1,000小時可申請試辦補助；核定後一年內累積達2,000、5,000、8,000及10,000小時，可分別申請績效獎金5萬元，累計最高20萬元。
  - 外國籍陪伴照顧服務工作者人數不得超過勞動部核定人數；欲增加須重新報請核定。

- id: S002
  source_type: primary
  publisher: 勞動部勞動力發展署
  title: 計畫內容簡介｜多元陪伴照顧服務計畫
  url: https://mcs.wda.gov.tw/about-us
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 官方以「臨短急」描述需求情境，舉例為長輩臨時有狀況找不到人力、外籍家庭看護空窗期短期需要人力、家人手術或病後的急性後期服務。
  - 民眾全額自費，單次至少4小時以上或全日服務。
  - 申請資格包括身心障礙、重大傷病、三個月內就醫或手術、符合家庭看護移工被看護者資格、長照2至8級等。

- id: S003
  source_type: primary
  publisher: 勞動部勞動力發展署／多元陪伴照顧服務計畫
  title: 「多元陪伴照顧」服務區域再擴大 「北北基桃」生活圈全納入
  url: https://mcs.wda.gov.tw/news/41
  published_at: '2026-01-30'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 截至新聞稿發布時，全臺13家試辦單位、服務16縣市、覆蓋率逾7成，累積服務時數逾3.4萬小時、服務人次逾3,900。
  - 官方統計服務對象以短期重大傷病及術後出院照顧占35%為最多，長照服務空窗與聘僱外籍家庭看護喘息合計占27%。
  - 官方明載申請服務頻率可從1天單次服務到1週或1個月，依個案需求提出並由試辦單位評估後派員。

- id: S004
  source_type: primary
  publisher: 勞動部統計處
  title: 114年移工管理及運用調查統計結果
  url: https://www.mol.gov.tw/1607/1632/1633/87456/?cprint=pt
  published_at: '2026-01-12'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 調查於2025年7月至8月進行，家庭雇主有效樣本4,022份。
  - 2025年6月外籍家庭看護工每月有休假者占65.8%；平均每月休假1天者占31.7%，2至3天者14.2%，4天以上者9.2%。
  - 家庭雇主於外籍看護工休假時有替代照顧方案者占85.2%；最主要替代方案為家人照顧66.9%，政府喘息或居家服務15.6%。
  - 調查註明外籍家庭看護工勞動契約訂定每7天須休假1天或2天，若休假日工作，雇主須補休或給付加班費。

- id: S005
  source_type: primary
  publisher: 勞動部勞動力發展署
  title: 表12-5 引進移工在臺人數－按開放項目及國籍分
  url: https://statdb.mol.gov.tw/html/mon/212050.pdf
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 本次PDF畫面所見表題為「115年6月底 End of June, 2026」。
  - 該期有效在臺外籍「多元陪伴照顧服務工作」46人；外籍家庭看護工212,209人。
  - 此URL為勞動部月報固定網址，內容可能隨月份更新；本紀錄僅保存本次觀察到的2026年6月底表格，不把目前URL狀態倒推到其他月份。

- id: S006
  source_type: primary
  publisher: 勞動部勞動法令查詢系統
  title: 外國技術人力工作資格及許可管理辦法－第5條立法理由
  url: https://laws.mol.gov.tw/FLAW/FLAWDOC01.aspx?flno=5&id=FL105895
  published_at: '2025-12-30'
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 開放「多元陪伴照顧服務技術工作」的立法理由明載：試辦逾半年後，部分服務單位反映具經驗及專業技術之外國籍合適人力招募不易。
  - 立法理由把語言、專業能力與服務品質高度相關列為新增技術工作類別的重要理由。

- id: S007
  source_type: primary
  publisher: 勞動部勞動法令查詢系統
  title: 外國人受聘僱從事就業服務法第四十六條第一項第八款至第十一款規定工作之轉換雇主或工作程序準則
  url: https://laws.mol.gov.tw/FLAW/PrintFLAWDAT0202.aspx?id=FL026615
  observed_at: '2026-10-21T01:45:13+08:00'
  retrieval_status: reachable
  notes:
  - 現行規則將家庭幫傭、家庭看護、家庭看護技術、機構看護、機構看護技術、多元陪伴照顧服務及多元陪伴照顧服務技術工作列為同一工作類別。
  - 因此多元陪伴之外籍人力來源可能包括既有在臺照顧／家事移工的轉換；此規則本身不能證明每一名多元陪伴工作者的實際來源或淨增人力數。

