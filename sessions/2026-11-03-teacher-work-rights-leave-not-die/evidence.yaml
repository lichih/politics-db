notes:
- 本session保存的是『離職不要殉職』論述所依賴的現實前提，不把任何個案死亡原因直接歸因於工作環境。
- 台中案聘任身分因公開資料不足且涉及人身事故隱私，停止以個資識別方式追查；後續若有正式調查、工會名冊或教育局公開資料再追加。
- 分析核心：正式教師『免於任意解聘』保障強，不等於所有教師的整體工作權、續聘安全、拒絕潛規則後免受不利益或離職後再就業能力都強。
- 目前證據足以支持制度性研究與保存，但不足以把2026年10月教師死亡個案的原因歸結為家長投訴、特教壓力或工作權不足；若要寫Fact，仍缺個案因果證據與特教／普教投訴量化比較。
