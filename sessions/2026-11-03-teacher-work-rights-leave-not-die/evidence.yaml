facts:
- id: F001
  statement: Facebook貼文主張「寧願離職，不要殉職」，並建議教師自行建立下班後不回家長訊息的邊界、課題分離，且稱「工作，再找就有，錢也是再賺就有」。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S001]
  evidence_summary: 登入中的Facebook頁面可直接讀到上述文字。
  verification_notes:
  - 這是作者的規範性建議，不等於其前提已被實證支持。
  tags: [原始主張, 離職不殉職]
- id: F002
  statement: 教育部直到2026年6月17日才以函示明確要求地方與學校建立教師非上班時間的合理行政聯繫與親師溝通機制；除急迫事項外，應儘量在上班時間處理教學業務與親師溝通。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S002]
  evidence_summary: 官方學校公告明載教育部115年6月17日函號與函示意旨，並附教育部原函。
  verification_notes:
  - 函示使用「原則上應享有離線及休息權益」「應儘量利用上班時間」等語，並非明文禁止任何不利處置的法定safe harbor。
  tags: [離線權, 教育部函示, '2026']
- id: F003
  statement: 2026年10月30日教育部又把教師非出勤時間的離線權寫入職場不法侵害預防指引，並把家長密集或連續傳訊、不給合理查證處理時間列入不法侵害行為樣態。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S006, S007]
  evidence_summary: 中央社報導教育部正式發布指引；教師工會隔日主張仍需入法與課予學校、家長更明確責任。
  verification_notes:
  - 目前保存的是指引發布的新聞與工會原始聲明；如日後取得教育部指引原始全文可補為primary source。
  tags: [離線權, 職場不法侵害, 家長訊息]
- id: F004
  statement: 《教師法》的強身分保障主要適用於編制內、按月支給待遇且依法取得教師資格的專任教師；正式教師的解聘、不續聘或停聘必須符合教師法法定事由與程序。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S003]
  evidence_summary: 教師法第3條界定適用範圍，第13至16條規範解聘、不續聘與停聘事由及程序。
  verification_notes:
  - 這證明的是正式教師的免於任意解聘程序保障，不等於整體職涯安全、轉職能力或拒絕潛規則後免受任何軟性不利益。
  tags: [工作權, 正式教師, 教師法]
- id: F005
  statement: 教育部現行教師法第16條解釋令明列「親師溝通不良，且主要可歸責於教師」可能構成教學不力或不能勝任工作的具體事實之一。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S004]
  evidence_summary: 解釋令第六款直接列出親師溝通不良且主要可歸責教師。
  verification_notes:
  - 不代表下班不回LINE即可解聘；仍需綜合具體事實並達到解聘或不續聘必要程度。
  tags: [親師溝通, 工作權, 不續聘]
- id: F006
  statement: 2026年1至5月教師檢舉案件313件，較2025年同期586件減少；不受理率由18%升至35%，送校事會議比例由原本82%降至22%。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S005]
  evidence_summary: 教育部把變化歸因於具名、受理審查與案件分流等新制，並稱可避免匿名或不具體案件進入調查。
  verification_notes:
  - 此數據可證明舊制大量案件曾直接進校事會議，但不能把所有舊案都稱為惡意或濫訴。
  tags: [校事會議, 投訴, 案件分流]
- id: F007
  statement: 台灣長期存在「流浪教師／儲備教師」現象：取得教師證並不保證取得正式教職，部分教師須跨縣市反覆應試，或在正式缺不足時擔任短期代課。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S012]
  evidence_summary: 立法院專題研究直接說明「流浪教師」用來形容有教師證卻找不到正式職缺的待業老師，以及短期代課、跨縣市尋缺的處境。
  verification_notes:
  - 教師市場在2026年部分地區、科別已出現缺師，不能把2000年代供需情況直接當成2026每一科別現況；但足以否定「教師資格天然等於隨時有正式工作」這種普遍命題。
  tags: [流浪教師, 教師就業, 正式缺]
- id: F008
  statement: 離職不是單純意志選擇：65個獨立樣本、42,907人的meta-analysis發現，job embeddedness在控制工作滿意度、情感承諾與工作替代選項後，仍能預測離職意圖與實際離職。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S014]
  evidence_summary: 研究支持工作與生活連結、離職犧牲成本等因素會影響人是否真正離職。
  verification_notes:
  - 此為一般組織行為研究，非台灣教師專屬研究；應用於教師時屬一般機制證據。
  tags: [離職成本, job embeddedness, 勞動市場]
- id: F009
  statement: 「工作，再找就有」作為一般性陳述不符合勞動市場現實：勞動部112年資料中，45歲以上失業者75.2%未曾遇到工作機會。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S013]
  evidence_summary: 未遇工作機會者主要遭遇年齡限制、待遇不符與找不到想做職類等困難。
  verification_notes:
  - 這是45歲以上一般勞動市場資料，不代表年輕教師求職率；用來反駁的是「工作天然隨時再找就有」的普遍命題。
  tags: [求職困難, 勞動市場, 離職成本]
- id: F010
  statement: 全國代理暨代課教師產業工會統計，2021年9月至2026年10月底累計14起教師輕生案件，其中2026年10月有3起年輕教師離世。
  status: partial
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S008]
  evidence_summary: 目前公開資料是媒體轉述工會統計，尚未逐案取得工會完整14案清單。
  verification_notes:
  - 不應由此直接推論14案均由工作環境造成；個案因果需個別調查。
  tags: [教師職場壓力, 個案統計, 2026-10]
- id: F011
  statement: 2026年10月三案中，金門33歲教師可確認為代理教師；高雄33歲教師可確認為正式教師；台中26歲特教教師的正式／代理身分在目前公開報導中未直接標示。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S009, S010, S011]
  evidence_summary: 金門與高雄報導直接標示聘任身分；台中報導只稱特教教師、2024年分發到校。
  verification_notes:
  - 因此不能從三案硬算『只有1人有正式教師保障』或『2人是代理』。
  tags: [代理教師, 正式教師, 個案身分]
- id: F012
  statement: 台中26歲特教教師的公開線索包括「2024年分發至該校、任教兩年」；同一學年度臺中市國小正式教師甄選有35名身心障礙類特殊教育班教師缺額，但尚無公開資料可靠連結該教師本人與正式甄選分發名單。
  status: partial
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S011, S015]
  evidence_summary: 「分發」與當年正式特教缺額使正式教師身分具有可能性，但欠缺可識別且可靠的行政連結。
  verification_notes:
  - 基於人身事故隱私，不以姓名、學校等個資做侵入式追查；現階段標記為未確認。
  - not_found ≠ 不是正式教師。
  tags: [台中案, 身分未確認, 隱私]
- id: F013
  statement: 原貼文的「一天內又看到2位老師自我了斷的新聞」不能直接等同於「一天內發生兩起教師死亡」；2026年10月已知三案分別發生於月初台中、10月底金門與10月30日高雄。
  status: verified
  observed_at: '2026-11-03T13:26:39+08:00'
  source_ids: [S001, S008, S009, S010, S011]
  evidence_summary: 公開新聞的事件日期分散於10月，原句較安全的理解是作者在一天內看到多則相關新聞，而不是事件同日發生。
  verification_notes:
  - 避免把新聞曝光時間和事件發生時間混為一談。
  tags: [時間語意, 教師個案]
- id: F014
  statement: 特教教師的壓力結構具有明確的額外任務與情緒要求：法律要求團隊合作訂定IEP並與家長、專業人員協作；臺灣研究並顯示IEP、鑑定輔導、行政文書、家長與行政壓力及情緒要求均是重要壓力來源。
  status: verified
  observed_at: '2026-11-03T17:32:00+08:00'
  source_ids: [S016, S017, S018, S019, S020]
  evidence_summary: 特殊教育法建立IEP與跨專業、親師協作義務；多項臺灣研究分別從行政負荷、情緒要求、家長與行政壓力確認特教教師具有不同於一般班級教學的壓力組合。
  verification_notes:
  - 這支持「特教的壓力結構不同」，不等於證明特教教師整體壓力一定高於所有普通教師。
  tags: [特殊教育, IEP, 情緒要求, 行政負荷, 親師協作]
- id: F015
  statement: 目前臺灣直接比較研究不足以支持「特教教師整體工作壓力一定高於普通教師」的普遍命題；至少有研究發現普通教師整體工作壓力及部分構面反而高於特教教師。
  status: verified
  observed_at: '2026-11-03T17:32:00+08:00'
  source_ids: [S021]
  evidence_summary: 2017年臺灣372名國中教師研究比較普教與特教教師，結果顯示普通教師在整體工作壓力及部分構面高於特教教師。
  verification_notes:
  - 不同研究工具、教育階段與班型可能造成結果差異；應談壓力來源與結構，不宜只做單一總分排序。
  tags: [特殊教育, 普特比較, 工作壓力]
- id: F016
  statement: 特教領域的家長／照顧者對鑑定、安置、輔導及支持服務爭議具有專門的正式申訴程序，主管機關須設鑑安輔申評會處理；因此特教親師爭議具有比一般日常親師溝通更容易制度化的法律管道。
  status: verified
  observed_at: '2026-11-03T20:43:00+08:00'
  source_ids: [S023]
  evidence_summary: 特殊教育學生及幼兒申訴服務辦法第4至5條明定鑑安輔申評會及申訴權。
  verification_notes:
  - 這證明正式爭議處理管道存在，不等於證明特教家長實際申訴率或投訴率高於普通教育。
  - 特教申訴的對象可為主管機關措施或學校措施，不應自動等同於對個別教師的投訴。
  tags: [特殊教育, 家長申訴, 鑑安輔申評會, 親師爭議]
claims:
- id: C001
  statement: 「教師只要自己設好下班邊界，就能有效解決親師溝通壓力」可作為制度層面的充分解方。
  status: unsupported
  contradicts: [F002, F003, F005, F006]
  related_facts: [F004]
  reasoning_notes: 離線權直到2026年才由教育部函示並再納入指引；同時親師溝通仍可能進入人事評價與檢舉程序。個人邊界可作自保策略，但制度是否保護教師安全行使邊界是另一問題。
- id: C002
  statement: 「工作，再找就有」可作為教師普遍適用的離職前提。
  status: contradicted
  contradicts: [F007, F008, F009]
  related_facts: [F004, F011]
  reasoning_notes: 教師資格不等於正式職缺，一般勞動市場也存在求職與離職成本；實際能否離職受工作替代選項、收入、年資與生活嵌入等限制。
- id: C003
  statement: 「離職不殉職」可以作為危機時的生命提醒，但不足以替代對教師工作權、投訴程序、離線權與職場環境的制度治理。
  status: supported
  supports: [F002, F003, F004, F005, F006, F007, F008, F010]
  reasoning_notes: 生命優先的價值判斷本身不需否定；問題在於把離職描述成低成本、隨手可得的選項，會掩蓋制度與勞動市場限制。
- id: C004
  statement: 可由2026年10月三起教師案件計算出『只有1人享有正式教師工作權保障』。
  status: unsupported
  contradicts: [F011, F012]
  reasoning_notes: 目前只確定金門為代理、高雄為正式；台中身分未確認。缺資料不能補成任一身分。
- id: C005
  statement: 台中26歲特教教師是正式教師。
  status: unresolved
  related_facts: [F012]
  reasoning_notes: 「2024年分發」及當年正式特教教師缺額是支持線索，但未找到能可靠連結個案本人與正式甄選分發的公開行政資料。
- id: C006
  statement: 原貼文所稱「一天內又看到2位老師自我了斷的新聞」代表一天內實際發生兩起教師死亡。
  status: contradicted
  contradicts: [F013]
  reasoning_notes: 目前已知相關事件分布於10月不同日期；較合理的字面理解只能是作者一天內看到兩則相關新聞。
- id: C007
  statement: 台中案因為是特教教師，所以可以直接推定其整體工作壓力比普通教師更高。
  status: unsupported
  contradicts: [F015]
  related_facts: [F014]
  reasoning_notes: 特教工作具有可驗證的額外行政、IEP、情緒及跨專業協作壓力，但現有比較研究不足以把個案壓力總量直接排在普教教師之上；個案因果仍需個別證據。
- id: C008
  statement: 特教教師實際遭家長投訴或正式申訴的比例高於普通教師。
  status: unresolved
  related_facts: [F014, F016]
  reasoning_notes: 現有法規與研究可證明特教工作具有更密集的個別化義務、親師協作及正式申訴管道，但本次未找到可直接比較特教與普教教師被投訴／申訴率的全國量化資料。
- id: C009
  statement: 台中26歲特教教師個案生前曾因家長投訴、申訴或親師爭議承受壓力。
  status: unresolved
  related_facts: [F011, F012, F014, F016]
  reasoning_notes: 本次公開新聞與官方資料搜尋未找到可靠證據可把家長投訴／申訴直接連到該個案；不能由特教職務的一般壓力結構反推個案經歷。
