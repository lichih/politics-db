facts:
  - id: F001
    statement: "立法院預算中心資料顯示，台灣整體國防預算占GDP比率在2020至2025年依序約為2.04%、2.06%、2.28%、2.46%、2.38%、2.39%。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S001]
    evidence_summary: "2020-2025的整體國防預算占GDP並非持續大幅上升，2022後約落在2.28%-2.46%區間。"
    verification_notes:
      - "這是含公務、特別預算與基金的整體國防預算口徑，不宜與單純國防部年度公務預算混用。"
    tags: [國防預算, GDP, 時間序列]

  - id: F002
    statement: "2026年度國防經費按北約模式原以9495億元、占GDP 3.32%編列說明；立法院預算中心後依更新後名目GDP預估重算，占比為2.92%。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S002, S003]
    evidence_summary: "3.32%是以較早GDP預估計算；2026年5月更新GDP預估後，同一9495億元占比降為2.92%。"
    verification_notes:
      - "討論『2026國防支出破3%』時必須註明計算口徑與GDP基期。"
    tags: [國防預算, 北約口徑, GDP]

  - id: F003
    statement: "1年期義務役自2024年1月1日起恢復徵集。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S004]
    evidence_summary: "國防部稱恢復1年役的考量包含國防安全及新的戰略架構兵力需求。"
    verification_notes: []
    tags: [義務役, 動員, 人力]

  - id: F004
    statement: "2022年14天教育召集屬局部試行：約1.5萬人採14天新制，同年約9.7萬人仍採5至7天舊制。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S005]
    evidence_summary: "14天教召起步時僅覆蓋少數後備人員，主要人數仍在舊制。"
    verification_notes: []
    tags: [後備, 教召, 動員]

  - id: F005
    statement: "截至2026年10月，全民防衛動員署現行一般教召頁面以14日、136小時為標準訓練內容。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S006]
    evidence_summary: "14天教召已由2022年的局部試行擴大為現行一般教召規格。"
    verification_notes:
      - "頁面顯示現行規格，但未單獨證明何時完成『全面』切換；若要精確斷定年份，需另找年度政策文件。"
    tags: [後備, 教召, 動員]

  - id: F006
    statement: "國防部規劃的『強化防衛韌性及不對稱戰力特別預算』執行期為2026至2033年，共8年，預算上限1.25兆元。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S007]
    evidence_summary: "該計畫涵蓋防空反彈道、反裝甲、無人載具、作戰持續量能、AI/C5ISR及台美共同研發採購等核心戰力。"
    verification_notes:
      - "這表示核心戰力建置的官方時間表本身跨越2027多年。"
    tags: [特別預算, 不對稱戰力, "2027"]

  - id: F007
    statement: "66架新造F-16V Block 70的首批2架直到2026年10月2日才抵台；鳳翔專案持續性預算期程為2020至2026年。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S008, S009]
    evidence_summary: "原本屬2020-2026專案的主力戰機，在2026年第四季才開始有首批實機抵台。"
    verification_notes:
      - "來源支持『嚴重延後』與『首批很晚才抵台』；若要精確主張原定首批交付日期，需再引用原始LOA/國防部時程文件。"
    tags: [F16V, 軍購, 延誤, 空防]

  - id: F008
    statement: "台灣天然氣約99%依賴進口；法定安全存量在2025-2026為至少11天，2027起提高為至少14天。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S010, S011]
    evidence_summary: "能源政策本身承認天然氣高度依賴進口，且法定安全存量採逐年提升而非戰時長期封鎖尺度。"
    verification_notes:
      - "安全存量不等於實際總庫存，也不等於全體能源可支撐天數；不可直接把11天解讀成11天後必停電。"
    tags: [天然氣, 能源韌性, 封鎖]

  - id: F009
    statement: "核三2號機於2025年5月17日運轉執照屆期後停機，2025年5月18日起進入除役期間；政府規劃以燃氣、再生能源、儲能與需求面管理等補足供電。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S012, S013]
    evidence_summary: "在台海封鎖風險存在的同時，能源政策仍依既定法定期限停止核三2號機，並增加燃氣等替代來源。"
    verification_notes:
      - "這是政策取捨的事實，不足以單獨證明政策錯誤；核安、執照、核廢與電力系統因素仍需另行評估。"
    tags: [核能, 能源韌性, 天然氣]

  - id: F010
    statement: "總統府全社會防衛韌性委員會是在2024年6月19日宣布成立。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S014]
    evidence_summary: "政府層級的全社會防衛韌性統合機制在2024年才正式建立。"
    verification_notes: []
    tags: [全社會防衛韌性, 民防, "2024"]

  - id: F011
    statement: "2026年漢光演習出現海軍與海巡聯合反封鎖護航演練；Reuters將其描述為兩者首次聯合反封鎖行動。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S015]
    evidence_summary: "反封鎖跨部會聯合演練直到2026年才出現首次性質的明確公開紀錄。"
    verification_notes:
      - "『首次』依Reuters報導；若要升格為官方絕對歷史結論，宜再查海軍與海巡歷年演訓檔案。"
    tags: [封鎖, 漢光演習, 海軍, 海巡]

  - id: F012
    statement: "美國情報界2026年評估：中國領導人目前沒有在2027年執行侵台的計畫，也沒有固定統一時間表；若可能，北京偏好不用武力達成統一。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S016]
    evidence_summary: "2027不是美國情報界所判定的固定侵台日期。"
    verification_notes:
      - "這是2026年時點的情報評估，不等於未來不會改變，也不等於中國永遠不使用武力。"
    tags: ["2027", ODNI, 中國, 侵台風險]

  - id: F013
    statement: "五角大廈公開說法曾明確區分：2027是習近平要求解放軍具備能力的節點，不等於2027有行動意圖。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S017]
    evidence_summary: "『2027能力節點』與『2027開戰期限』不是同一命題。"
    verification_notes: []
    tags: ["2027", capability, intent]

  - id: F014
    statement: "川普2026年5月接受訪問時表示美國台灣政策未改，但同時說不希望跨9500英里打一場戰爭，並表示尚未批准一批對台軍售、可能批准也可能不批准。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S018]
    evidence_summary: "現任美國總統公開訊號並非無條件承諾介入，而是維持戰略模糊並強調距離、成本與談判。"
    verification_notes:
      - "9500英里是川普本人的說法，不作為地理距離的精確數據。"
    tags: [美國, 川普, 台海, 軍售, 戰略模糊]

  - id: F015
    statement: "同月被直接問美國是否會保衛台灣時，川普拒絕回答，並稱習近平當天也曾直接問他這個問題。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S019]
    evidence_summary: "沒有公開的現任美國總統『必然出兵保台』承諾。"
    verification_notes:
      - "拒絕回答本身也不是『不會介入』承諾；只能證明維持不確定性。"
    tags: [美國介入, 川普, 戰略模糊]

  - id: F016
    statement: "截至2026年10月7日，Reuters報導川普政府仍壓著約140億美元的新一輪對台軍售。"
    status: verified
    observed_at: "2026-10-09"
    source_ids: [S020]
    evidence_summary: "美國軍事支援不是無條件、無時程摩擦的自動機制。"
    verification_notes:
      - "此狀態具高度時效性，日後可能批准或調整，需追加新 observation 而非覆寫。"
