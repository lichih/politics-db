notes:
  - "此session的核心用途是保存『威脅迫切性』與『實際整備時程』的可驗證事實，供未來比較政治論述與政策行為是否一致。"
  - "避免把『整備很慢』直接推成『政府知道不會打』；較穩固的推論是：公開政策行為不符合把2027當成固定亡國倒數的單一解讀。"
  - "避免把『川普拒絕承諾』推成『美國一定不介入』；它只證明外援存在實質不確定性。"
