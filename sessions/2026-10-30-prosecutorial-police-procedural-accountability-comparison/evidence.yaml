facts:
  - id: F001
    statement: "2026年10月3日萬華分局搜索Commander D；警方對四名員警及兩名主管公布懲處。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S002, S008]
    evidence_summary: "4員警各申誡2次，偵查隊長記過1次，分局長申誡2次。"
  - id: F002
    statement: "北市府10月29日再次致歉，稱行政調查完成、送警政署核復，並將研訂指引及加強訓練。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S001, S007]
    evidence_summary: "行政調查與改善承諾有官方紀錄；完整調查內容尚待核對。"
  - id: F003
    statement: "蔣萬安10月6日表示市警局屬市府團隊，不因中央地方權責或警政一條鞭卸責。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S005]
    evidence_summary: "可直接比對首長承責言論。"
  - id: F004
    statement: "民進黨市議員洪健益曾於9月質詢相關酒吧爭議，但尚不能證明他是搜索的唯一促成原因。"
    status: partial
    observed_at: "2026-10-30"
    source_ids: [S005]
    evidence_summary: "議會質詢可查；警方聲請搜索與議員質詢的因果鏈未完整重建。"
  - id: F005
    statement: "沈慶京對林俊言個案評鑑請求不成立；檢評會另就偵訊涉及無關案情的倫理問題移請新北檢處理。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S003]
    evidence_summary: "評鑑與行政職務監督階段有別；後續實際處分待核。"
  - id: F006
    statement: "柯文哲與律師2026年3月3日提出京華城偵查程序的檢察官評鑑請求。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S004]
    evidence_summary: "僅證明提出請求，不代表指控成立。"
  - id: F007
    statement: "李文娟庭上主張高壓訊問，北檢正式否認。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S010]
    evidence_summary: "對立陳述應由原始錄影音及法院認定檢驗。"
  - id: F008
    statement: "檢評會於2026年2月3日公開林俊言個案評鑑結果：沈慶京提出的四項重大指控未獲成立，但另確認林俊言有三類違反勤慎執行職務義務的程序行為。"
    status: verified
    observed_at: "2026-11-16"
    source_ids: [S011]
    evidence_summary: "分別為10月11日未錄音錄影非正式長談、10月14日視察時談及無關案情、10月18日庭前單獨接觸被告未告知辯護人。"
    verification_notes:
      - "不能把倫理違失認定擴張成檢評會已確認逼供、洩密、政治指示或全部原指控成立。"

  - id: F009
    statement: "檢評會認為上述程序行為尚未達懲戒或懲處程度，但有職務監督必要，決議移請林俊言現任機關新北地檢署依法官法第95條處理。"
    status: verified
    observed_at: "2026-11-16"
    source_ids: [S011, S012]
    evidence_summary: "決議已移請監督層級；2月3日新北檢稱尚未收到公文，之後實際處理須另取得最終紀錄。"
    verification_notes:
      - "移請職務監督 != 已實施特定處分，也不等於完全沒有後續處理。"

claims:
  - id: C001
    statement: "兩類公權力發生程序爭議時，政治行政監督責任應依一致判準檢驗。"
    status: unresolved
    observed_at: "2026-10-30"
    fact_ids: [F001, F002, F003, F005, F006]
    notes:
      - "規範性比較，不意味行政首長得干預檢察官個案結論。"
  - id: C002
    statement: "北檢司法程序爭議已證明中央政府政治指揮或司法迫害。"
    status: unsupported
    observed_at: "2026-10-30"
    fact_ids: [F005, F006, F007]
    notes:
      - "政治目的及指揮鏈尚無獨立充分證據。"
  - id: C003
    statement: "林俊言程序違失已獲正式認定，但截至2026年11月16日，本研究尚未取得可公開核對的新北檢職務監督最終處理紀錄，因此不能將究責視為已完成可驗證的責任交代。"
    status: supported
    observed_at: "2026-11-16"
    fact_ids: [F005, F008, F009]
    notes:
      - "這是外部可驗證性與accountability completion的研究判定，不等於斷言未曾內部處理。"
      - "not_found != never_done；同時not_found亦不能被當成done的證明。"
      - "機關已完成法定責任與是否有公開個案結果的法律義務是不同命題；須另查保密與資訊公開規定。"

  - id: C004
    statement: "截至2026年11月16日已證實新北檢從未處理林俊言的職務監督移送，或已可斷定檢察官遭政治指示辦案。"
    status: unsupported
    observed_at: "2026-11-16"
    fact_ids: [F008, F009]
    notes:
      - "公開查詢未得處理結果，不能證明內部完全沒有處理；程序倫理違失也不直接證明黨政指揮鏈。"

  - id: C005
    statement: "只因政治人物公開說『尊重司法』，即可認定其已充分維護檢察機關的程序正義與究責。"
    status: unsupported
    observed_at: "2026-11-16"
    fact_ids: [F001, F002, F008, F009]
    notes:
      - "評價應以相同判準檢查具體違失後的調查、監督、處分及結果可驗證性，不能以尊重個別判決的表態取代。"
      - "尚未完成各黨政治人物對本次檢評會移請監督的系統性表態蒐集，不做陣營整體排名。"

searches:
  - id: Q001
    observed_at: "2026-11-16"
    platform: "web / 中央社 / 新聞搜尋"
    query: "林俊言 檢評會 移請 新北檢 職務監督 後續 處分 結果 2026"
    scope: "2026年2月檢評會決議後，截至本輪查詢可檢索公開資料"
    result: not_found
    notes: "找到2月3日檢評會正式確認程序倫理違失與移請職務監督之多篇報導；本輪搜尋未取得新北檢處理結果或處分文件。此為本輪搜尋範圍的not_found，非主管機關未曾處理的證明。"
notes:
  - "跨案資料入口，不取代既有柯文哲、無良公關個案證據。"
  - "待查林俊言評鑑原始決議與後續處分、柯文哲評鑑結果、北市府行政調查全文。"
  - "2026-11-16研究判準：違失正式確認後，不能以無從核對的可能性推定已完成究責。若主張機關已善盡監督責任，須有相應處理事證；是否負法律上的對外公開義務另行檢驗。"
  - "外部檢驗應分段：評鑑決議 -> 移送職務監督 -> 是否收文／分案 -> 監督審議 -> 具體措施或不處分理由 -> 可否公開核對。"
  - "制度評價與可驗證事實分離：尚無公開可核對究責結果，不等於確認內部未辦、違法包庇、或執政黨指示。"
