facts:
  - id: F001
    statement: "2026年10月3日萬華分局搜索Commander D；警方對四名員警及兩名主管公布懲處。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S002, S008]
    evidence_summary: "4員警各申誡2次，偵查隊長記過1次，分局長申誡2次。"
  - id: F002
    statement: "北市府10月29日再次致歉，稱行政調查完成、送警政署核復，並將研訂指引及加強訓練。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S001, S007]
    evidence_summary: "行政調查與改善承諾有官方紀錄；完整調查內容尚待核對。"
  - id: F003
    statement: "蔣萬安10月6日表示市警局屬市府團隊，不因中央地方權責或警政一條鞭卸責。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S005]
    evidence_summary: "可直接比對首長承責言論。"
  - id: F004
    statement: "民進黨市議員洪健益曾於9月質詢相關酒吧爭議，但尚不能證明他是搜索的唯一促成原因。"
    status: partial
    observed_at: "2026-10-30"
    source_ids: [S005]
    evidence_summary: "議會質詢可查；警方聲請搜索與議員質詢的因果鏈未完整重建。"
  - id: F005
    statement: "沈慶京對林俊言個案評鑑請求不成立；檢評會另就偵訊涉及無關案情的倫理問題移請新北檢處理。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S003]
    evidence_summary: "評鑑與行政職務監督階段有別；後續實際處分待核。"
  - id: F006
    statement: "柯文哲與律師2026年3月3日提出京華城偵查程序的檢察官評鑑請求。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S004]
    evidence_summary: "僅證明提出請求，不代表指控成立。"
  - id: F007
    statement: "李文娟庭上主張高壓訊問，北檢正式否認。"
    status: verified
    observed_at: "2026-10-30"
    source_ids: [S010]
    evidence_summary: "對立陳述應由原始錄影音及法院認定檢驗。"
claims:
  - id: C001
    statement: "兩類公權力發生程序爭議時，政治行政監督責任應依一致判準檢驗。"
    status: open
    observed_at: "2026-10-30"
    fact_ids: [F001, F002, F003, F005, F006]
    notes:
      - "規範性比較，不意味行政首長得干預檢察官個案結論。"
  - id: C002
    statement: "北檢司法程序爭議已證明中央政府政治指揮或司法迫害。"
    status: unsupported
    observed_at: "2026-10-30"
    fact_ids: [F005, F006, F007]
    notes:
      - "政治目的及指揮鏈尚無獨立充分證據。"
searches: []
notes:
  - "跨案資料入口，不取代既有柯文哲、無良公關個案證據。"
  - "待查林俊言評鑑原始決議與後續處分、柯文哲評鑑結果、北市府行政調查全文。"
