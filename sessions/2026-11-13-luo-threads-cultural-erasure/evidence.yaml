claims:
  - id: "C001"
    statement: "羅大佑用婚育狀況推論政治人物對下一代是否關心，論據不足，且有對未生育女性政治人物產生不公平推定的風險。"
    status: "supported"
    supports:
      - "F005"
    reasoning_notes: "邏輯判準：有無親生子女不能單獨證成關心或不關心下一代；不因此推定整段訪談所有言論均屬厭女。"
  - id: "C002"
    statement: "羅大佑也批評賴清德或卓榮泰，所以訪談不可能包含厭女的言論。"
    status: "unsupported"
    related_facts:
      - "F002"
      - "F004"
      - "F005"
    reasoning_notes: "一個人可以同時批評男性執政者，也在其他段落對女性使用不公平的性別化判準；男性受批評不是女性受偏見評價的反證。"
  - id: "C003"
    statement: "以羅大佑一段不當婚育推論，否定其所有文化貢獻，或逕認其他對執政者的批評全數無效。"
    status: "unsupported"
    related_facts:
      - "F001"
      - "F002"
      - "F003"
      - "F005"
    reasoning_notes: "不同命題須分別驗證；歷史作品、文化貢獻與某次發言的論證品質是不同證據對象。『文化貢獻』若要陳述具體歷史事實，仍須另補史料。"
  - id: "C004"
    statement: "@jayden9up 在被提醒訪談另有政治批評內容時，沒有提出逐項反駁，轉以『老男人』『文化水準低下』否定羅大佑，呈現身分貶抑取代具體論證的轉向。"
    status: "supported"
    supports:
      - "F001"
      - "F002"
      - "F003"
    reasoning_notes: "這是對可見貼文論證功能的觀察，不能進一步推定作者全部政治動機、是否明知不實或從未在其他場合論證。"
  - id: "C005"
    statement: "不同意 @jayden9up 的評論者都是因為討厭民進黨才護航羅大佑。"
    status: "unsupported"
    supports: []
    related_facts:
      - "F001"
      - "F002"
      - "F004"
    reasoning_notes: "作者有明確作出該歸因，但目前無逐一支持每位對話者動機的證據；支持部分施政批判不必等於認同婚育推論。"
  - id: "C006"
    statement: "『文化人』資格必須先接受當代某政黨支持者的政治忠誠認定。"
    status: "unsupported"
    related_facts:
      - "F001"
      - "F003"
    reasoning_notes: "此為爭議言論可能造成的政治功能之反向命題，而非任何人在原文正式主張的資格審查制度；不得當作當事人明示主張。"
