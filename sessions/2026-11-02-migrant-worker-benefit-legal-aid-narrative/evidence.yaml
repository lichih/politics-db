session:
  id: 2026-11-02-migrant-worker-benefit-legal-aid-narrative
  project: Politics
  title: 移工勞保喪葬給付、勞工法律扶助與泰博／台聯論述鏈
  started_at: '2026-11-02T13:20:00+08:00'
  updated_at: '2026-11-02T15:05:00+08:00'
  status: active

topics:
- 移工
- 泰博科技
- 陳朝旺
- 周倪安
- 台灣團結聯盟
- 勞工保險
- 家屬死亡喪葬津貼
- 就業安定基金
- 勞工訴訟扶助
- 產業移工
- 家庭看護
- 勞動權益

sources:
- id: S001
  source_type: secondary
  publisher: 中央通訊社
  title: 泰博科技勞資爭議　周倪安盼改革勞動制度
  url: https://www.cna.com.tw/news/aipl/202604010178.aspx
  published_at: '2026-04-01'
  observed_at: '2026-11-02T13:20:00+08:00'
  retrieval_status: reachable
  notes:
  - 報導記錄泰博科技董事長陳朝旺與台聯黨主席周倪安於2026年4月1日同場記者會。
  - 報導引述周倪安主張移工並非台灣國民，為民眾訂定的勞動相關法規本來就不該與移工一體適用。

- id: S002
  source_type: primary
  publisher: 台灣團結聯盟
  title: 20260401台聯新聞稿：反對特定勞權團體勾結有心外勞 製造糾紛傷害台灣
  url: https://www.tsu.org.tw/%E5%89%AF%E6%9C%AC-2025%E6%96%B0%E8%81%9E%E7%A8%BF
  published_at: '2026-04-01'
  observed_at: '2026-11-02T13:20:00+08:00'
  retrieval_status: reachable
  notes:
  - 官方新聞稿稱台聯「再次前往泰博公司」聲援，並重複「移工不應與國人勞動法規一體適用」的政策主張。
  - 同頁另有2026年2月外勞政策演講，主張「本外勞脫鉤」，並把工廠移工勞基法、勞健保與家庭看護雇主空窗期、就業安定費等議題放在同一政策框架中。

- id: S003
  source_type: secondary
  publisher: Cofacts 真的假的
  title: 台聯：外勞造假 花1000元領9.4萬
  url: https://en.cofacts.tw/article/pzHPhqEBEY7yIwhpPuQT
  published_at: '2026-06-17'
  observed_at: '2026-11-02T13:20:00+08:00'
  retrieval_status: reachable
  notes:
  - 保存周倪安公開影片逐字內容，主張越南網站販售假死亡證明，移工可花約1000元取得文件並請領平均約9.4萬元家屬死亡給付。
  - 周倪安在同一段發言中把詐領風險與「台灣給外勞保勞保」連結，並稱先前曾批評多年請領50多億元非常不合理。
  - 此來源用來證明公開主張內容，不用來證明詐領事實成立。

- id: S004
  source_type: secondary
  publisher: 台灣事實查核中心
  title: 移工請領家屬死亡津貼於法有據，網路傳言提供片面資訊誤導影響勞健保財務
  url: https://tfc-taiwan.org.tw/fact-check-reports/migrant-workers-eligible-for-family-death-benefit-facts/
  published_at: '2026-04-29'
  observed_at: '2026-11-02T13:20:00+08:00'
  retrieval_status: reachable
  notes:
  - 查核指出投保勞保的外籍被保險人依法享有家屬死亡給付，與本國勞工適用同一社會保險制度。
  - 107至113年間外籍人士家屬死亡給付約占該項給付4.7%，但占勞保整體給付支出約0.15%。
  - 查核當時未找到移工系統性詐領的可信證據，並整理外國文件需經駐外館處等驗證的程序。

- id: S005
  source_type: primary
  publisher: 勞動部
  title: 針對近期網路流傳關於勞工保險相關言論之聲明
  url: https://www.mol.gov.tw/1607/1632/2660/90256/
  published_at: '2026-04-29'
  observed_at: '2026-11-02T13:20:00+08:00'
  retrieval_status: reachable
  notes:
  - 勞動部表示114年度外籍被保險人個人負擔勞保保費總額63.4億元，各項勞保給付22.9億元。
  - 勞動部將勞保描述為納費互助、風險分攤制度，並稱本外籍被保險人權益相同。

- id: S006
  source_type: primary
  publisher: 勞動部
  title: 勞工法律及生活費用扶助
  url: https://www.mol.gov.tw/1607/28752/28774/28776/28778/30712/
  published_at: '2026-10-02'
  observed_at: '2026-11-02T13:20:00+08:00'
  retrieval_status: reachable
  notes:
  - 現行勞工訴訟扶助以「勞工」為申請主體，列有勞動事件類型、調解程序及個人月收入6.5萬元、資產300萬元等資格條件。
  - 頁面沒有把此制度描述成移工專屬法律扶助。

- id: S007
  source_type: primary
  publisher: 勞動部勞動法令查詢系統
  title: 就業安定基金收支保管及運用辦法
  url: https://laws.mol.gov.tw/FLAW/FLAWDAT0202.aspx?id=FL015134
  published_at: '2026-01-02'
  observed_at: '2026-11-02T15:05:00+08:00'
  retrieval_status: reachable
  notes:
  - 第3條明定就業安定基金下設勞工權益基金，勞工權益基金編製附屬單位預算之分預算。
  - 第4條明定就業安定基金來源包含就業安定費、孳息、勞工權益基金收入及其他收入；勞工權益基金本身另有專戶賸餘、政府預算撥款、孳息、捐贈及其他收入等法定財源。
  - 第5條明定就業安定基金用途包含促進國民就業、提升勞工福祉、外國人聘僱管理及權益保障，以及勞工權益基金支出；勞工權益基金用途包含勞工訴訟法律扶助、訴訟期間必要生活費用及其他勞工權益扶助。

- id: S008
  source_type: primary
  publisher: 勞動部勞動法令查詢系統
  title: 就業服務法第42條、第55條
  url: https://laws.mol.gov.tw/FLAW/FLAWDAT0201.aspx?id=FL015128
  published_at: '2025-01-20'
  observed_at: '2026-11-02T13:20:00+08:00'
  retrieval_status: reachable
  notes:
  - 第42條明定為保障國民工作權，聘僱外國人不得妨礙本國人就業機會、勞動條件、國民經濟發展及社會安定。
  - 第55條規定聘僱特定類別外國人的雇主應繳就業安定費，供促進國民就業、提升勞工福祉及處理外國人聘僱管理事務。

- id: S009
  source_type: primary
  publisher: 勞動部勞動力發展署
  title: 雇主繳納就業安定費注意事項
  url: https://fw.wda.gov.tw/wda-employer/home/extra-come-to-tw/index/subCategory/2c95efb39839190201983a74112f053f?locale=zh
  published_at: '2025-07-25'
  observed_at: '2026-11-02T13:20:00+08:00'
  retrieval_status: reachable
  notes:
  - 頁面於2026年8月更新，列家庭看護工每人每月2,000元；製造工作基本費率亦為每人每月2,000元，依提高核配比率另有較高級距。
  - 此來源證明家庭看護雇主與製造業雇主都可能是就業安定費繳費者，但兩者的資源位置與政策問題不能因此視為相同。

- id: S010
  source_type: primary
  publisher: 勞動部
  title: 移工請領家屬死亡給付相關議題之聲明
  url: https://www.mol.gov.tw/1607/1632/2660/93044/?cprint=pt
  published_at: '2026-06-17'
  observed_at: '2026-11-02T13:20:00+08:00'
  retrieval_status: reachable
  notes:
  - 勞保局回應越南網站販售死亡證明爭議，說明外國證明文件有駐外驗證、異常態樣勾稽、來源國數位查驗與投保單位協助申請等機制。
  - 勞保局表示若發現詐領會以偽造文書及詐欺移送法辦；此聲明承認需防堵假文件風險，但未支持「移工可普遍花1000元即領到9.4萬元」的概括說法。

- id: S011
  source_type: primary
  publisher: 勞動部
  title: 有關社群軟體流傳短影音「移工提告雇主公司老闆得付律師、翻譯費」為錯誤訊息，勞動部嚴正澄清，目前無此規定
  url: https://www.mol.gov.tw/1607/1632/2660/99858/post
  published_at: '2026-10-29'
  observed_at: '2026-11-02T14:45:00+08:00'
  retrieval_status: reachable
  notes:
  - 勞動部明確表示，目前無任何法規規定勞資爭議發生時，雇主必須負擔移工的律師費和訴訟費。
  - 勞動部同時說明，勞工法律扶助有申請資格、案件類型與資力條件，符合資格者才能申請；訴訟費用最終依訴訟結果由敗訴一方負擔。

facts:
- id: F001
  statement: 2026年4月1日泰博科技記者會中，董事長陳朝旺與台聯黨主席周倪安同場，周倪安公開主張移工並非台灣國民，為國人訂定的勞動相關法規本來就不該與移工一體適用。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S001, S002]
  evidence_summary: 中央社現場報導與台聯官方新聞稿互相印證兩人的直接公開合作及周倪安的政策主張。
  tags: [泰博科技, 陳朝旺, 周倪安, 本外勞脫鉤, 直接合作]

- id: F002
  statement: 台聯2026年公開論述將工廠移工適用勞基法與勞健保、泰博勞資爭議，以及家庭看護雇主的空窗期與就業安定費等議題放在「現行制度對本國人不公平／本外勞應脫鉤」的共同政策框架中。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S002]
  evidence_summary: 台聯官方新聞稿頁面可直接核對該跨議題論述框架；這不等於每個具體指控的資訊來源都相同。
  tags: [台聯, 政策框架, 產業移工, 家庭看護]

- id: F003
  statement: 周倪安另有公開影片主張越南網站可提供假死亡證明，使移工花約1000元請領平均約9.4萬元家屬死亡給付，並把此事與移工享有勞保及多年請領金額連結。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S003]
  evidence_summary: 可確認周倪安曾做此公開主張；是否存在大規模或系統性詐領需由其他證據判斷。
  tags: [家屬死亡給付, 9.4萬元, 假死亡證明, 公開主張]

- id: F004
  statement: 投保勞保的外籍被保險人依法享有家屬死亡給付；107至113年間外籍人士家屬死亡給付約占該項給付4.7%，但約占勞保整體給付支出0.15%。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S004]
  evidence_summary: TFC依勞保局資料整理本外籍請領比例與制度依據。
  tags: [勞保, 家屬死亡給付, 外籍被保險人, 給付比例]

- id: F005
  statement: 勞動部表示114年度外籍被保險人個人負擔勞保保費63.4億元，各項勞保給付22.9億元，並將本外籍被保險人視為同一納費互助、風險分攤制度下的被保險人。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S005]
  evidence_summary: 官方統計至少反駁「外籍被保險人完全不繳費、只從本國人勞保取走給付」的描述。
  tags: [勞保保費, 外籍被保險人, 社會保險]

- id: F006
  statement: 現行勞工訴訟扶助制度不是移工專屬；勞動部以符合案件類型、程序與資力條件的「勞工」為申請對象。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S006]
  evidence_summary: 勞動部現行說明列出一般勞工申請門檻與案件範圍，未以國籍作為專屬資格。
  tags: [法律扶助, 勞工訴訟, 資力審查, 非移工專屬]

- id: F007
  statement: 就業安定基金依法可支出勞工權益基金，而勞工權益基金用途明列勞工訴訟法律扶助及訴訟期間必要生活費用。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S007]
  evidence_summary: 現行基金運用辦法直接建立就業安定基金與勞工訴訟扶助之法定支出關係。
  tags: [就業安定基金, 勞工權益基金, 訴訟扶助]

- id: F008
  statement: 家庭看護雇主與製造業雇主都可能繳納就業安定費；現行一般家庭看護及製造工作基本費率均列每人每月2,000元，但製造業依核配比率可能適用較高費率。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S009]
  evidence_summary: 「就業安定費由雇主繳納」是真實前提，但不能因此把企業雇主與一般家庭雇主的資源位置、替代方案與工作權問題視為同一。
  tags: [就業安定費, 家庭看護, 製造業, 雇主]

- id: F009
  statement: 就業服務法明定聘僱外國人不得妨礙本國人的就業機會與勞動條件，顯示產業雇主使用外國勞動力的制度設計本身包含本國工作權考量。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S008]
  evidence_summary: 第42條提供產業移工政策分析時不可忽略的本國就業保護法定目的。
  tags: [就業服務法42條, 國民工作權, 產業移工]

- id: F010
  statement: 2026年6月假死亡證明爭議後，勞保局公開說明外國文件驗證、異常勾稽、來源國數位查驗及投保單位協助等查核機制，並表示查獲詐領會移送偽造文書及詐欺。
  status: verified
  observed_at: '2026-11-02T13:20:00+08:00'
  source_ids: [S010]
  evidence_summary: 假文件風險是行政查核問題；官方回應並未支持「移工普遍可低成本以假文件成功領取給付」。
  tags: [死亡證明, 詐領, 查核機制, 勞保局]

- id: F011
  statement: 勞動部於2026年10月29日澄清，現行法規並未規定雇主必須在勞資爭議中負擔移工的律師費或訴訟費；勞工法律扶助是符合案件與資力條件的勞工才可申請。
  status: verified
  observed_at: '2026-11-02T14:45:00+08:00'
  source_ids: [S011]
  evidence_summary: 官方澄清直接區分「個別雇主必須替移工支付訴訟費用」與「符合資格的勞工可使用公共法律扶助」兩個不同命題。
  tags: [法律扶助, 律師費, 訴訟費, 勞動部澄清, 移工]

- id: F012
  statement: 就業安定基金下設勞工權益基金；就業安定費是就業安定基金的法定收入之一，但勞工權益基金另有政府預算撥款、專戶賸餘、孳息、捐贈及其他收入等法定財源，因此不能把特定雇主繳納的就業安定費與特定勞工訴訟扶助案件逐筆對應。
  status: verified
  observed_at: '2026-11-02T15:05:00+08:00'
  source_ids: [S007]
  evidence_summary: 現行收支保管及運用辦法第3至5條顯示兩基金的預算層級、收入與用途關係；可確認就安費進入就業安定基金，但不足以把某一雇主繳費直接視為某一案件律師費來源。
  tags: [就業安定基金, 勞工權益基金, 就業安定費, 財源, 法律扶助]

claims:
- id: C001
  statement: 周倪安與陳朝旺／泰博在2026年的移工政策論述可以視為彼此完全獨立的兩個來源，互相提供獨立佐證。
  status: contradicted
  supports: []
  contradicts: [F001, F002]
  related_facts: []
  reasoning_notes: 兩人至少有直接同台與共同政策活動，且台聯官方把泰博案納入其本外勞脫鉤論述。因此兩者的公開論述不能在未另行追溯資訊來源前，當作彼此獨立來源互證。

- id: C002
  statement: 外籍移工只因不是國民，就不應與本國受僱勞工在同一勞保制度中取得同類家屬死亡給付。
  status: contradicted
  supports: []
  contradicts: [F004, F005]
  related_facts: [F003]
  reasoning_notes: 現行制度將有投保、繳費的外籍被保險人納入同一勞保給付規則。若要主張應改採國籍差別待遇，需要另提出制度與規範正當性論證，不能由「非國民」本身直接推出。

- id: C003
  statement: 「存在假死亡證明販售或個別詐領風險」足以推出「合法投保並繳費的移工不應享有家屬死亡給付」。
  status: unsupported
  supports: []
  contradicts: []
  related_facts: [F003, F004, F010]
  reasoning_notes: 假文件風險可支持加強驗證、追查詐領；目前證據不能把查核漏洞直接轉成剝奪整體合法被保險人給付資格的理由。

- id: C004
  statement: 勞工訴訟法律扶助是移工專屬、只要是移工即可免費告雇主。
  status: contradicted
  supports: []
  contradicts: [F006]
  related_facts: [F007]
  reasoning_notes: 現行勞動部專案以符合案件、程序及資力條件的勞工為對象，並非以移工身分直接取得無條件扶助。

- id: C005
  statement: 就業安定基金的資金不得依法用於勞工訴訟法律扶助。
  status: contradicted
  supports: []
  contradicts: [F007]
  related_facts: [F008]
