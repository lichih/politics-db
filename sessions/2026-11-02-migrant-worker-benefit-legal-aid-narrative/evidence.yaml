promotion:
  cases: []
  comparators: []
  research:
  - proposed: migrant-worker-rights-narrative-and-employer-asymmetry
    rationale: 可進一步分開研究產業移工／企業雇主／本國勞工，以及家庭看護移工／一般家庭雇主／被照顧者兩種不同權利與資源配置模型。

notes:
- 本 session 只保存公開可核對事證，不保存使用者與家庭看護移工的私人生活經驗或第三方家庭個案。
- 「周倪安／台聯、陳朝旺／泰博存在直接公開合作」已可確認；但目前沒有證據證明9.4萬元喪葬給付指控是陳朝旺提供，也沒有證據證明特定法律扶助說法是周倪安指示陳朝旺提出。
- 公共論述分析上，假詐領風險與合法被保險人的制度資格是不同命題；企業移工與家庭看護也應分框架分析。
- 關案主結論：法律扶助的比較單位應先區分勞工與雇主。本國勞工與移工在符合資格時均可申請勞工法律扶助；企業雇主自聘律師費的制度位置亦不因對造國籍而改變。將「企業雇主」以「你」代稱，會把原本的勞工／雇主差異誤寫成移工／台灣人差異。
