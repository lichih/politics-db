claims:
  - id: C001
    statement: "監察院寶林案糾正可作為重要調查來源，但其『北市明確違反既有採樣義務』及『3月24日仍有8人中毒可歸責於接獲通報後處置不及』等推論，仍必須接受原始SOP、法令與精確時序的獨立核對。"
    status: supported
    supports: [F005, F006, F007, F013, F014, F015]
    related_facts: [F016, F017]
    reasoning_notes: "監察院可提供調查材料，不等於其法律／因果評價具自我證明力。本案至少存在SOP文字強度與8人用餐時序兩個實質校正點。"

  - id: C002
    statement: "「3月24日8名中毒者都是因北市接獲跨縣市通報後未及時阻斷供餐而受害」不成立。"
    status: contradicted
    contradicts: [F014, F015]
    reasoning_notes: "其中6人在11:39或11:47用餐，早於12:18系統通知；只能把17:02兩人列入接獲通報後的可能責任窗口。"

  - id: C003
    statement: "「寶林案受害者都是3月19日至22日消費，3月24日已無當日受害者」不符合北檢資料。"
    status: contradicted
    contradicts: [F013]
    reasoning_notes: "北檢明列3月24日8名邦克列酸陽性用餐者。"

  - id: C004
    statement: "「3月24日店內根本不存在與案件相關、仍可追查的食品」不符合北檢調查。"
    status: contradicted
    contradicts: [F011]
    related_facts: [F012]
    reasoning_notes: "受污染粿條3月24日仍被用於製餐；但業者不實陳述／隱匿會影響稽查員未採到該批食品的可責性，兩者應同時保留。"

  - id: C005
    statement: "「一般餐飲業依法本來就必須把3月19日至22日供應過的食品留樣到3月24日供稽查」目前沒有找到相應的普遍法定義務。"
    status: unsupported
    supports: []
    related_facts: [F008]
    reasoning_notes: "舊GHP的成品留樣至有效日期要求屬食品工廠規範；餐飲業沒有找到同等一般留樣義務。這不等於調查開始後可以違反主管機關封存、保存等命令。"

  - id: C006
    statement: "「北市110年版SOP已明確、無裁量地要求3月24日立即採取所有當下食材與餐點，未採即屬明確違反SOP」證據不足。"
    status: unsupported
    supports: []
    related_facts: [F005, F006]
    reasoning_notes: "SOP原文是『依現場情形決定是否進行檢體採檢』與『應考慮列為採檢標的』，同批替代採樣亦有『以容器包裝者』限定；是否專業判斷失當仍可另行評價，但不能直接改寫成無裁量義務。"

  - id: C007
    statement: "「2024年3月24日一收到第一起跨縣市通報，法律就自動要求北市立即勒令寶林停業」不符合當時第41條的文字。"
    status: contradicted
    contradicts: [F007]
    related_facts: [F017, F018]
    reasoning_notes: "第41條使用『得』，建立的是停業、停售與封存的法定權限；何時應行使仍涉及行政與專業判斷。案後會議才進一步研議重大傷亡下更明確的停業標準。"

  - id: C008
    statement: "寶林案後新增或明確化的重大傷亡擴大採檢、停業門檻等標準，不得未經論證就倒灌為3月24日已存在的明確義務。"
    status: supported
    supports: [F017]
    related_facts: [F005, F007]
    reasoning_notes: "事件時間、規則形成時間與後續制度改善必須分開。事後修法／修SOP可用來說明制度缺口，不能反向創造過去明文義務。"

  - id: C009
    statement: "監察院以『專業警覺性不足』評價北市，單憑此一機關評價不足以證明蔣萬安所稱3月24日採集關鍵生物跡證的同仁『非常機警』必然為假。"
    status: supported
    supports: [F005, F006, F010, F014, F015, F017]
    related_facts: [F004, F016]
    reasoning_notes: "手部採證確有重大證據價值；監察院的若干法律與因果推論存在需校正之處。另一方面，17:02兩名受害者及稽查實際時序仍未完全釐清，因此也不把『整體第一時間處置非常機警』升格成已客觀證實的事實。"

  - id: C010
    statement: "「3月24日廚師手部檢體的採集具有重大證據價值」有充分公開事證支持。"
    status: supported
    supports: [F009, F010]
    reasoning_notes: "這個局部採證成果可獨立成立，不需以整體應變是否完善為前提。"

  - id: C011
    statement: "「北市3月24日整體第一時間應變可以客觀定性為『非常機警』」目前公開證據仍不足以完成事實層面的定論。"
    status: unresolved
    supports: [F010]
    contradicts: [F016]
    related_facts: [F004, F005, F006, F007, F014, F017]
    reasoning_notes: "『非常機警』本身是強度較高的政治／價值評價；支持面有關鍵手部採證，反向面有17:02仍有兩人用餐及稽查出發時序爭議，而精確到離場時間未公開解決。"

  - id: C012
    statement: "以目前已核實的SOP文字差異、8名受害者時序錯置、事後標準可能倒灌等具體問題，要求監察院說明本案調查方法是否符合其憲法上超出黨派、依法獨立行使職權之要求，具有充分的公民監督正當性。"
    status: supported
    supports: [F006, F014, F015, F017, F019, F020]
    related_facts: [F004, F016]
    reasoning_notes: "這個結論回答的是『是否足以正當啟動監督與質疑』，而不是『是否已證明監察委員有黨派目的』。監察機關本身負有較高的超然中立義務；當其糾正理由出現可驗證且可能影響結論的重要錯置時，公民要求說明、調卷、比較標準或檢驗偏頗具有制度正當性。"

  - id: C013
    statement: "目前證據已足以認定寶林案監察委員係基於支持或反對特定政黨、候選人的目的而故意作成偏頗糾正。"
    status: unsupported
    supports: []
    related_facts: [F006, F014, F015, F017, F019, F020]
    reasoning_notes: "現有材料能證明糾正論證存在重要可質疑處，但尚缺能把方法錯誤連到黨派目的、差別標準或選舉目的的直接或穩固間接事證。要升格為『行政不中立已證實』，至少宜再有同類案件比較、內部決策資料、選擇性處理模式或其他可支持目的推論的公開事實。"

  - id: C014
    statement: "2025年1月至2月作成並公告的寶林案糾正本身，已可依2026年臺北市長選舉之《公職人員選舉罷免法》第50條認定違法。"
    status: contradicted
    contradicts: [F021, F022, F023]
    reasoning_notes: "第50條以法定競選／罷免活動期間為要件；直轄市長2026年競選活動期間為11月13日至11月27日，2025年的糾正顯然不在該期間。若監察院或相關人員在2026年法定競選活動期間另以行政資源從事支持或反對特定候選人的競選宣傳，應把該『新行為』另案檢驗，不能倒推原糾正違反第50條。"

  - id: C015
    statement: "本案目前最穩健的主結論是：行政中立／超然中立的公民監督門檻已經滿足，但選罷法違法的指控門檻尚未滿足，且就2025年原糾正而言有明確的期間要件障礙。"
    status: supported
    supports: [F006, F014, F015, F017, F019, F020, F021, F022, F023]
    reasoning_notes: "『可以正當質疑』與『已證明違法』是不同命題。前者建立在可核對的重大論證問題與監察委員特別中立義務；後者必須逐一滿足具體法律構成要件。"

