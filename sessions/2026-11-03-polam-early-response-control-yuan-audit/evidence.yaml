facts:
  - id: F001
    statement: "新北市衛生局於2024年3月23日17:30接獲醫院疑似食品中毒通報；3月24日上午完成個案訪談後，監察院案文記載其於12:18透過產品通路管理資訊系統通知臺北市及食藥署，並於12:39寄送個案訪談紀錄。"
    status: verified
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S001]
    evidence_summary: "保存跨縣市通報的可核對時序；12:18為系統通知時間，12:39為訪談資料寄送時間。"
    tags: ["2024", "3月24日", "新北市", "通報", "12:18", "12:39"]

  - id: F002
    statement: "3月24日跨縣市通報所涉兩名個案均曾在寶林A13食用炒粿條並出現相似腸胃症狀，訪談資料另記載食物有苦、酸異味；監察院重建資料並記載其中一人住院休克。"
    status: verified
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S001]
    evidence_summary: "通報內容已包含同店、同品項、相似症狀與異味等風險訊號。"
    verification_notes:
      - "『一人住院休克』由監察院案文重建；現有公開資料不足以精確確認該重症資訊是在12:18系統通知、12:39訪談紀錄，或其後何一時間點明確送達北市。"
    tags: ["食品中毒", "炒粿條", "異味", "重症"]

  - id: F003
    statement: "對北市實際『接獲』通報時間，公開資料存在不同表述：監察院保存新北於12:18完成系統通知、12:39寄送訪談資料；北市衛生局後續則稱12:42接獲新北通報。"
    status: partial
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S001, S004]
    evidence_summary: "各時間可能分別對應系統傳送、資料寄送與承辦端實際收受，現有公開資料不足以證明其中一方虛構時間。"
    tags: ["通報時間", "12:18", "12:39", "12:42", "時序"]

  - id: F004
    statement: "監察院依北市稽查採樣報告、工作報告及紀錄認定，北市接獲通報後至16:30才開始準備出發，首批稽查人員於傍晚抵達並稽查約1小時；北市衛生局則反駁稱12:42接獲通報後即立即前往，約17:00完成查核與工作報告。"
    status: disputed
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S001, S004]
    evidence_summary: "兩個官方版本在『是否立即出發』上有實質衝突；目前公開資料未提供足以獨立確定稽查員實際抵達及離開寶林的精確時間。"
    verification_notes:
      - "此未解時點直接影響17:02兩名受害者是否可合理歸因於北市接獲通報後未及時阻斷供餐。"
    tags: ["稽查時序", "16:30", "17:00", "爭議", "未解"]

  - id: F005
    statement: "監察院案文所引寶林案當時適用的北市110年版食品中毒SOP文字為：稽查人員『應依現場情形決定是否進行檢體採檢』，對可能相關檢體『均應考慮列為採檢標的』；無法採到嫌疑食品剩餘食品時，『以容器包裝者』才規定採同一批或同一製造日期產品。"
    status: verified
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S001]
    evidence_summary: "舊SOP保留現場判斷空間，且同批產品替代採樣規則有『以容器包裝者』限定。"
    tags: ["SOP", "採樣", "依現場情形", "應考慮", "容器包裝"]

  - id: F006
    statement: "監察院在糾正理由後段把舊SOP概括為北市應即時針對當下食材及餐點採樣，並將無法取得剩餘食品時採同批或同製造日期產品表述為一般要求；此表述強度高於其案文前段所引的『依現場情形決定』『應考慮』及『以容器包裝者』原文。"
    status: verified
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S001]
    evidence_summary: "這是同一監察院案文內可直接比較的文字差異；它不證明監察院整體糾正必然錯誤，但使『北市明確違反無裁量採樣義務』的說法需要額外法源或專業依據。"
    tags: ["監察院", "SOP", "糾正", "文字強度", "證據邊界"]

  - id: F007
    statement: "2024年寶林案時適用的食品安全衛生管理法第41條授權地方主管機關於疑似食品中毒調查期間『得』命業者暫停作業、停止販賣、進行消毒並封存產品。"
    status: verified
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S005, S006]
    evidence_summary: "第41條建立主管機關可採取停業、停售、封存等措施的法定權限，但文字為『得』，並非一有通報即自動成立的『應立即停業』法定義務。"
    tags: ["食安法41條", "停業", "停售", "封存", "裁量"]

  - id: F008
    statement: "寶林案時適用的舊版食品良好衛生規範將食品工廠與餐飲業分章規範；『成品應留樣保存至有效日期』是食品工廠相關要求，未找到一般餐飲業者必須將數日前供應的餐點或食材普遍留樣數日、等待衛生機關日後採檢的規定。"
    status: verified
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S007, S008]
    evidence_summary: "黃揚明所稱業者沒有義務把3月19日至22日食品一路保存到3月24日，若限縮為『一般餐飲業沒有這種普遍事前留樣義務』，有規範基礎。"
    verification_notes:
      - "這不代表調查開始後業者可任意銷毀、隱匿食品，也不排除主管機關依法命封存、保存或停止販售後產生其他義務。"
    tags: ["GHP", "餐飲業", "食品工廠", "留樣", "保存義務"]

  - id: F009
    statement: "北市府早期專案報告記載，3月24日及25日進行兩次稽查；3月24日採廚師手部及砧板檢體，3月25日採菜刀及水果刀等環境檢體，當時未採得同批剩餘食品；3月26日與中央專家聯合稽查時另採35件食品檢體。"
    status: verified
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S003]
    evidence_summary: "北市確實在3月24日進行人體／環境採樣，但食材檢體直到3月26日聯合稽查才大量取得。"
    tags: ["採樣", "手部檢體", "環境檢體", "食品檢體"]

  - id: F010
    statement: "3月24日取得的廚師手部檢體後來驗出邦克列酸，並成為檢調起訴的重要證據之一。"
    status: verified
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S004]
    evidence_summary: "此事實支持『3月24日手部採證具有重大證據價值』；不因對其他應變措施有爭議而消失。"
    tags: ["廚師手部", "邦克列酸", "關鍵證據", "起訴"]

  - id: F011
    statement: "北檢起訴資料認定，受邦克列酸污染的粿條在3月24日仍存在寶林A13並持續用於製餐；約11:40起廚師使用受污染的混裝粿條製作餐點。"
    status: verified
    observed_at: "2026-11-03T19:40:52+08:00"
    source_ids: [S002]
    evidence_summary: "因此『3月24日店內根本不存在涉案食品可供追查』不符合檢方調查結果；但這不等於稽查員在業者陳述與隱匿情況下必然可以當場找到該批食品。"
