facts:
  - id: F001
    statement: "賴清德於2026年6月11日提名29人為第7屆監察委員，其中陳永興為院長被提名人、王榮璋為副院長被提名人。"
    status: verified
    observed_at: "2026-10-23T15:26:00+08:00"
    source_ids: [S001]
    evidence_summary: "總統府咨文直接確認29人名單與正副院長安排。"
    tags: [第7屆監委, 提名, 29人]

  - id: F002
    statement: "謝政達與廖婉汝在2026年6月16日先後婉拒監委提名，兩人均公開把支持廢除監察院的修憲主張列為理由，因此後續實際進入立法院表決者為27人。"
    status: verified
    observed_at: "2026-10-23T15:26:00+08:00"
    source_ids: [S002, S003, S004]
    evidence_summary: "兩人公開聲明與立法院議程上的『撤回』記載可交叉確認。"
    tags: [謝政達, 廖婉汝, 撤回, 廢除監察院]

  - id: F003
    statement: "第6屆監察委員任期於2026年7月31日屆滿；第7屆未於8月1日就任，監察院自8月起進入無監委的職權空窗。"
    status: verified
    observed_at: "2026-10-23T15:26:00+08:00"
    source_ids: [S001, S007, S008]
    evidence_summary: "總統咨文與監察院官方新聞稿均確認任期屆滿與新任未到任。"
    tags: [監委空窗, 7月31日, 8月1日]

  - id: F004
    statement: "2026年9月29日立法院就27名第7屆監委被提名人行使同意權，27人全部未達57票門檻，均未獲同意。"
    status: verified
    observed_at: "2026-10-23T15:26:00+08:00"
    source_ids: [S004, S005, S006]
    evidence_summary: "立法院會議紀錄與中央社投票結果一致。"
    tags: [9月29日, 人事同意權, 27人, 全數未過]

  - id: F005
    statement: "監委空窗期間，監察院仍可受理、登記與研析人民陳情，陽光四法的申報受理、資訊公開、檢舉、法令諮詢與查閱等一般行政服務也仍維持。"
    status: verified
    observed_at: "2026-10-23T15:26:00+08:00"
    source_ids: [S007]
    evidence_summary: "監察院官方明確區分仍可持續的一般行政與陳情服務。"
    tags: [陳情, 陽光四法, 持續運作]

  - id: F006
    statement: "監委空窗期間，監察委員接見、立案調查及相關審議程序無法進行；彈劾、糾舉、糾正等核心監察職權亦無法行使。"
    status: verified
    observed_at: "2026-10-23T15:26:00+08:00"
    source_ids: [S007, S008, S010]
    evidence_summary: "監察院官方與監察法規範可直接建立監委缺位與核心職權中斷的連結。"
    tags: [彈劾, 糾舉, 糾正, 立案調查, 職權空轉]

  - id: F007
    statement: "監委空窗期間，由監察委員組成的廉政委員會無法組成，相關陽光法案案件的審議、裁罰、行政處分及部分裁罰資訊公告暫無法辦理。"
    status: verified
    observed_at: "2026-10-23T15:26:00+08:00"
    source_ids: [S007]
    evidence_summary: "監察院官方明確指出停擺的是需要廉政委員會決定的審議、裁罰與行政處分，不是全部申報或公開業務。"
    tags: [政治獻金, 財產申報, 廉政委員會, 裁罰]

  - id: F008
    statement: "現行憲法增修條文仍明定監察院及29名監察委員制度；若要廢除監察院，須透過憲法修正程序，而非單以普通法律或人事否決即可完成。"
    status: verified
    observed_at: "2026-10-23T15:26:00+08:00"
    source_ids: [S009]
    evidence_summary: "憲法增修條文第7條直接設置監察院及監委，第12條規定修憲程序。"
    tags: [修憲, 廢除監察院, 憲法]

claims:
  - id: C001
    statement: "2026年8月起監察院完全停止所有業務，連人民陳情、政治獻金申報、財產申報與資訊公開都無法受理。"
    status: contradicted
    contradicts: [F005, F007]
    reasoning_notes: "監察院官方資料顯示陳情、檢舉與陽光四法一般行政服務仍持續；停擺的是需要監委或廉政委員會決定的調查、審議、裁罰與行政處分等。"

  - id: C002
    statement: "監委空窗不會影響彈劾、糾舉、糾正或立案調查等核心監察職權。"
    status: contradicted
    contradicts: [F006]
    reasoning_notes: "監察院官方與監察法均顯示這些職權依賴監察委員，空窗期間無法正常行使。"

  - id: C003
    statement: "2026年9月29日遭表決否決的是原始29名被提名人全部。"
    status: contradicted
    contradicts: [F002, F004]
    reasoning_notes: "原始名單29人，但謝政達與廖婉汝已先撤回／婉拒，實際表決為27人。"

  - id: C004
    statement: "謝政達與廖婉汝只是被國民黨施壓後被迫撤回，兩人本人沒有公開說明支持廢除監察院。"
    status: contradicted
    contradicts: [F002]
    reasoning_notes: "兩人都公開以支持廢除監察院修憲主張作為婉拒提名的理由；是否另受黨內溝通或壓力，需另以直接證據處理。"

  - id: C005
    statement: "監察院是憲法明定的機關，所以立法院依法不能不同意總統提出的監委人選。"
    status: contradicted
    contradicts: [F004, F008]
    reasoning_notes: "憲法增修條文第7條本身即規定監委由總統提名、經立法院同意任命；立法院同意權包含不同意的制度可能性。"

  - id: C006
    statement: "監察院空窗造成實際監督成本。"
    status: supported
    supports: [F006, F007]
    reasoning_notes: "核心調查、彈劾、糾舉、糾正及部分廉政案件裁罰確實受阻；此結論只處理空窗的功能效果，不回答27名人選是否適任、立法院是否應同意或責任應如何分配。"

