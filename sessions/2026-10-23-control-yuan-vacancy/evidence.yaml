notes:
  - "本session只處理可驗證時間線與空窗效果，不把『空窗有成本』直接推成『27人應被同意』。"
  - "同樣地，27人全數未過本身也不能自動證明每一名被提名人都不適任；若要評估立法院是否逐一合理審查，需另建候選人別理由與投票紀錄。"
  - "政治獻金／財產申報應精確區分：一般申報、公開與檢舉行政仍持續；需要廉政委員會的審議、裁罰、行政處分則停擺。"
  - "『監察院是憲法機關』只能證明現制仍應依憲法運作與廢除需修憲，不能消滅立法院對個別被提名人的同意權。"
