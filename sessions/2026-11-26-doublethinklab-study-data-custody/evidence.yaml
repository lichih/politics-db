notes:
  - "查核暫停點：使用者2026-11-26表示『我覺得後面查不到了』，因此存入現有可核實資料與未解問題，暫不將公開可得性邊界擴大成違規結論。"
  - "此案的主要責任鏈是：核定補助機構（待核）→主持人→外部協作 NGO →研究資料保管與 IRB 條款；計畫申請主體尚未證實，不可直接把臺北大學列為已確認的申請機構。"
  - "若後續取得計畫編號、核准書或外部資料處理契約，應以增補新事證方式重啟查核，不得覆寫原來的未查得歷史。"
