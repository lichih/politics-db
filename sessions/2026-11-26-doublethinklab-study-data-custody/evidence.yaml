facts:
  - id: F001
    statement: "2022-07-14 PTT 公開招募陰謀論研究受試者，列臺北大學犯罪學研究所與台灣民主實驗室，沈伯洋主持，陳韻如、曾柏瑜列為研究人員，線上網址為 lab.doublethinklab.org。"
    status: verified
    observed_at: "2026-11-26T14:00:00+08:00"
    source_ids: [S001]
    evidence_summary: "由 PTT 原始貼文的搜尋索引核對；可確認招募與公開合作關係，不能直接確認正式核定申請主體。"
    tags: ["study", "recruitment"]
  - id: F002
    statement: "劉靜怡在2026-11-24公開引用招募聲明，稱科技部補助、恩主公醫院 IRB 審查，以及匿名去連結資料由台灣民主實驗室雲端保存。"
    status: verified
    observed_at: "2026-11-26T14:00:00+08:00"
    source_ids: [S002]
    evidence_summary: "確認劉靜怡公開引用此段文字；該段文字所稱各項核准與實際執行仍須個案文件佐證。"
    tags: ["public_statement", "data_custody"]
  - id: F003
    statement: "2022-03-08 科技部規範要求申請機構負責核定研究計畫督導，並督促主持人保存原始研究資料至少至計畫執行期滿後三年。"
    status: verified
    observed_at: "2026-11-26T14:00:00+08:00"
    source_ids: [S003, S004]
    evidence_summary: "核對2022當時有效版本第二十三點及第二十六點第十一款。"
    tags: ["legal", "research_governance"]
  - id: F004
    statement: "公開討論中存在實務反駁：研究團隊使用實驗室 NAS 或租賃雲端保存研究資料可能是常見做法，不能只從雲端位置認定違規。"
    status: verified
    observed_at: "2026-11-26T14:00:00+08:00"
    source_ids: [S005]
    evidence_summary: "確認此反駁有被提出；未獨立統計國內所有研究保管實務比例。"
    tags: ["counterargument", "public_discourse"]
claims:
  - id: C001
    statement: "本計畫確由國立臺北大學擔任正式科技部補助申請機構並領取特定額度補助。"
    status: unresolved
    related_facts: [F001, F002]
    reasoning_notes: "招募公告列研究單位，仍缺核定計畫編號、核定明細及正式申請主體證明。"
  - id: C002
    statement: "恩主公醫院 IRB 已核准將去連結研究資料保存在台灣民主實驗室管理的外部雲端，且有完整存取與資料保存治理條款。"
    status: unresolved
    related_facts: [F002]
    reasoning_notes: "招募文主張 IRB 審查通過，但未取得審查編號、核准書或資料安全計畫。"
  - id: C003
    statement: "校外 NGO 實際掌握研究資料控制權，且臺北大學無法查核、調閱、移交或要求刪除。"
    status: unresolved
    related_facts: [F001, F002, F003]
    reasoning_notes: "資料存於 NGO 雲端不等於學校失去控制或督導權；需協議、權限、管理與存取紀錄。"
  - id: C004
    statement: "主持人、學校或 NGO 已違反補助規範、研究倫理或個資法，或已濫用研究資料。"
    status: unresolved
    related_facts: [F001, F002, F003, F004]
    reasoning_notes: "目前公開材料不足認定違規、外洩或濫用；同時也不能以 IRB 聲明或常見實務取代個案審核。"
  - id: C005
    statement: "當申請機構經確認後，應能具體說明外部雲端的研究資料保存、控制、稽核與銷毀安排，並不因外包或 NGO 合作免除法定督導責任。"
    status: supported
    supports: [F003]
    reasoning_notes: "依當年科技部規範的申請機構督導義務提出；不要求公開個別受試者資料。"
