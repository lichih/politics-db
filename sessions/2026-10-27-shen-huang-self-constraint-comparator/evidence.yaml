facts:
  - id: F001
    statement: "沈伯洋在 2023 年美中經濟暨安全審查委員會聽證證詞中，把『建立依賴（building dependence）』列為中國對台影響方式之一，並明確寫到中國試圖使台灣商人、地方官員、宗教團體與政治人物依賴中國；他也指出台灣商人的脆弱程度會因個別條件而不同。"
    status: verified
    observed_at: "2026-10-27T11:49:37+08:00"
    source_ids: [S001]
    evidence_summary: "這是父親爭議前的原始論述，可確認沈伯洋既有中國風險模型包含『依賴』，而非只包含是否親自赴中。"
    verification_notes:
      - "未把『存在中國交易』直接等同於『已形成依賴』；依賴程度仍需個案資料。"
    tags:
      - "沈伯洋"
      - "經濟依賴"
      - "爭議前判準"

  - id: F002
    statement: "2025-06-06 父親爭議中，沈伯洋公開表示其父親主要在厄瓜多、秘魯等地經商，生意所需設備可能向日本、台灣、中國、新加坡等地採購；他並稱 2019 年後父親不再赴中，理由是『到中國都是高風險』。"
    status: verified
    observed_at: "2026-10-27T11:49:37+08:00"
    source_ids: [S002]
    evidence_summary: "此回應把『赴中』列為主要風險軸，也以營運基地及多國採購描述父親企業。"
    verification_notes:
      - "來源未量化各國供應比重，因此不能由此判定中國供應鏈依賴程度。"
    tags:
      - "沈伯洋"
      - "父親爭議"
      - "赴中風險"

  - id: F003
    statement: "2025-06-11 沈伯洋進一步表示，因『赴中是風險』而請父親不要去中國，但仍可透過網路或電話向中國下訂單。"
    status: verified
    observed_at: "2026-10-27T11:49:37+08:00"
    source_ids: [S003]
    evidence_summary: "此說法明確把『親自赴中』與『遠端向中國採購』區分為不同情境。"
    verification_notes:
      - "這句話本身沒有評估父親企業對中國供應鏈的依賴程度，也沒有說明遠端採購在何種比例下會構成其 2023 年所稱的依賴風險。"
    tags:
      - "沈伯洋"
      - "父親爭議"
      - "遠端採購"

  - id: F004
    statement: "2026-10-15 陸委會副主委梁文傑公開表示，沈父會向中國大陸下訂單，再把貨出口至中南美洲並賺取價差；陸委會據此主張此類交易不應稱為『賺紅錢』。"
    status: verified
    observed_at: "2026-10-27T11:49:37+08:00"
    source_ids: [S004]
    evidence_summary: "可確認陸委會公開承認沈父企業存在以中國為供應端的交易；『是否賺紅錢』與『是否形成中國供應鏈依賴』是不同命題。"
    verification_notes:
      - "本 session 不採陸委會的政治用語評價作為依賴程度的證明。"
    tags:
      - "沈土城"
      - "中國供應鏈"
      - "陸委會"

  - id: F005
    statement: "2023 年黃國昌自己住宅被國產署認定占用國有地時，他公開表示『依法該怎麼處理，就怎麼處理，正面積極面對，不會迴避』；主管機關確認占用範圍後，其代理人表示願雇工拆除，並在期限前開始拆除。"
    status: verified
    observed_at: "2026-10-27T11:49:37+08:00"
    source_ids: [S005, S006]
    evidence_summary: "可觀察到其自有財產爭議中，公開表態接受主管機關依規處理，之後亦進入恢復原狀程序。"
    verification_notes:
      - "此 fact 不評價其最初是否知情，也不把事後配合自動等同於不存在其他政治爭議。"
    tags:
      - "黃國昌"
      - "國有地"
      - "依法處理"

  - id: F006
    statement: "2025-10-22 岳父建設公司被媒體指控違規時，黃國昌表示自己毫無所悉、『一切依法辦理』；同時，他另外針對媒體報導提告。"
    status: verified
    observed_at: "2026-10-27T11:49:37+08:00"
    source_ids: [S007]
    evidence_summary: "其公開回應把『建案是否違規由主管機關依法處理』與『媒體報導是否涉及侵權／失實』分成兩條處理路徑。"
    verification_notes:
      - "提告本身不證明媒體報導失實；僅記錄其採取的回應結構。"
    tags:
      - "黃國昌"
      - "岳父建案"
      - "依法處理"

  - id: F007
    statement: "北市建管處後續認定黃國昌岳父建設公司的建案存在違規並要求限期改善後，黃國昌仍公開表示『一切依法辦理』，並稱自己不會違法對主管機關施壓。"
    status: verified
    observed_at: "2026-10-27T11:49:37+08:00"
    source_ids: [S008]
    evidence_summary: "在不利的主管機關查處結果出現後，其公開處理原則未改為否認主管機關適用規則，而是維持依法辦理並另行爭執媒體面向。"
    verification_notes:
      - "此處記錄的是公開反應，不推論其私人動機。"
    tags:
      - "黃國昌"
      - "岳父建案"
      - "外部約束"

claims:
  - id: C001
    statement: "沈伯洋在父親爭議前的中國風險框架已包含『台灣商人對中國形成依賴』，因此他的既有判準不能被簡化成只有『人是否親自赴中』。"
    status: supported
    supports: [F001]
    contradicts: []
    related_facts: [F002, F003]
    reasoning_notes: "2023 原始證詞直接把 building dependence 與 Taiwanese businesspeople 放入中國影響模型；這足以證明『依賴』是一條獨立風險軸，但不證明任何特定企業已達依賴門檻。"

  - id: C002
    statement: "沈伯洋 2025 年父親案的公開回應確實區分『赴中』與『遠端採購』，但目前找到的這些回應沒有正面評估父親企業對中國供應鏈的依賴程度，也沒有把該依賴程度明確套回其 2023 年既有風險框架。"
    status: supported
    supports: [F001, F002, F003, F004]
    contradicts: []
    related_facts: []
    reasoning_notes: "這是對已找到公開回應內容範圍的判定，不等於沈伯洋從未在其他場合回答；若日後找到直接評估依賴程度的舊資料，應更新。"

  - id: C003
    statement: "黃國昌在已查得的『自己住宅占用國有地』與『岳父建案違規』兩組樣本中，都公開把違規判定與處置交回主管機關既有規則；即使他另行批評或提告媒體，也沒有以媒體爭議取代主管機關處理。"
    status: supported
    supports: [F005, F006, F007]
    contradicts: []
    related_facts: []
    reasoning_notes: "此結論限定於這兩組已查得樣本，不推廣為黃國昌所有政治事件均一致。"

  - id: C004
    statement: "就本 session 的有限樣本而言，兩人的公開回應結構存在可觀察差異：黃國昌較直接把自己／家人的爭議交回外部制度處理；沈伯洋父親案則主要以『是否赴中、是否可遠端採購、交易如何定性』等分類回應，而尚未找到其直接用自己既有的『對中依賴』判準評估父親企業。"
    status: partially_supported
    supports: [F001, F002, F003, F004, F005, F006, F007]
    contradicts: []
    related_facts: []
    reasoning_notes: "這是行為與論證結構比較，不是人格、道德或主觀動機判定。樣本數有限，且兩案法律性質不同：黃案有明確主管機關違規處理程序；沈父案目前核心較偏政治一致性與風險判準。"

