claims:
  - id: C001
    statement: "若 S001 截圖為真且屬 Meta 現行同類通知，該畫面所描述的地區性限制應理解為基於當地法律、在政府要求之後產生的限制通知，而不是單純一般用戶檢舉或純社群守則處分。"
    status: supported
    supports: [F001, F002]
    reasoning_notes: "Meta 對這類通知的公開說明直接使用 following a government request，並說明會顯示送出 takedown request 的政府機關；但本案截圖來源仍需平台或獨立重現確認。"

  - id: C002
    statement: "S001 中的『Taiwan Health Promotion Authority』可直接認定就是衛福部國民健康署（Health Promotion Administration, HPA）。"
    status: unresolved
    related_facts: [F003, F004]
    reasoning_notes: "Meta 台灣報告確有 HPA 透過內容限制管道報告內容的紀錄，增加此解釋的可能性；但 UI 名稱與國健署正式英文名稱不同，且沒有本案案件資料可完成個案對應。"

  - id: C003
    statement: "本案個別 Threads 限制要求確實由國民健康署 HPA 提出。"
    status: unresolved
    related_facts: [F001, F003, F004]
    reasoning_notes: "目前只有 UI 標籤與 HPA 一般性 Meta 報告紀錄，缺案件編號、Meta 個案通知明細或 HPA 公文。"

  - id: C004
    statement: "本案限制的法律依據就是《自殺防治法》第16條／第17條。"
    status: unresolved
    related_facts: [F005, F006, F009]
    reasoning_notes: "存在與自殺內容相關的既存法制及申訴機制，且帳號貼文確有自殺風險文字；但 S001 沒有顯示法條，現有資料也沒有案件公文。第17條網路媒體處分權文字另指向地方主管機關，不能僅憑衛生機關標籤推定法源與權限鏈。"

  - id: C005
    statement: "政府要求造成的是 formosansnoopy 整個帳號、所有貼文與留言在台灣全面不可見，而非個別內容限制。"
    status: unresolved
    related_facts: [F001, F012]
    reasoning_notes: "截圖呈現帳號頁面層級的 Content 無法在台灣顯示，帳號本人亦稱發文與留言均對台灣IP不可見；但尚缺多組台灣／海外連線測試、Meta 限制通知明細或 URL 清單。"

  - id: C006
    statement: "《54陪審團》取消 formosansnoopy 通告，是由正國會的同場來賓施壓造成。"
    status: unresolved
    related_facts: [F007, F008]
    reasoning_notes: "有排程相符的來賓表，且當事人持續如此指控；目前沒有製作單位、同場來賓或通聯紀錄證明取消原因。"

  - id: C007
    statement: "黃郁芬對 formosansnoopy 實施性騷／霸凌，且正國會高層吃案。"
    status: unresolved
    related_facts: [F009, F011, F013]
    reasoning_notes: "可確認指控存在且時間上早於10月爭議，也可確認黃郁芬與正國會的組織關係；尚缺調查、判決、第三方證詞或被指控方資料證明事件本身。"

  - id: C008
    statement: "呂建德或正國會人士介入衛福部／國健署處理流程，促成 Meta 對 formosansnoopy 的台灣地區限制。"
    status: unsupported
    related_facts: [F013, F014, F015, F017]
    reasoning_notes: "目前只有人物／派系關係與時間序列，沒有任何通聯、公文、案件流程、指示紀錄或證人可把政治關係接到個案處理決定。"

  - id: C009
    statement: "現有證據已足以證明這是為壓制政治爆料而進行的政治性訊息控管。"
    status: unresolved
    related_facts: [F001, F002, F005, F006, F009, F012, F016]
    reasoning_notes: "政府連結的地區性限制已有值得查明的具體跡象；但同時存在自殺風險內容與既存申訴法制的替代解釋。需要知道被送審的具體 URL、法源、限制範圍與決策鏈，才能判斷政治內容是否被當作目標或過度波及。"

  - id: C010
    statement: "單一 formosansnoopy 個案已足以證明台灣目前是獨裁體制。"
    status: unsupported
    related_facts: [F001, F002]
    reasoning_notes: "『獨裁體制』是制度層級結論，需要選舉競爭、權力更替、司法與媒體獨立、公民組織空間、系統性壓制等更廣泛證據；單一內容限制個案不足以完成此推論。"

