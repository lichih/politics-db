      - "衛福部114年3月11日衛部心字第1140107561A號函另說明，自114年3月14日起將該類申訴改於 NCC 委託建置之本平臺辦理。"
      - "此制度提供一條與政治動機無關的既存申訴／轉介途徑，但現階段沒有案件編號或公文證明本案實際經由此途徑。"

