    observed_at: "2026-10-15"
    retrieval_status: reachable
    notes:
      - "第16條列舉媒體不得教導自殺方法、教唆／誘使／煽惑自殺、詳細描述自殺方法及原因、誘導自殺等內容。"
      - "第17條第2項規定，廣電以外的宣傳品、出版品、網際網路或其他媒體違反第16條時，由直轄市、縣（市）主管機關處罰，並得令限期移除內容、下架或其他必要處置。"

