sources:
  - id: S001
    source_type: primary
    publisher: "使用者提供／Threads 畫面"
    title: "formosansnoopy 帳號在台灣顯示 Content 無法在台灣顯示之截圖"
    url: ""
    published_at: ""
    observed_at: "2026-10-15"
    retrieval_status: reachable
    notes:
      - "截圖文字顯示：Content 無法在台灣顯示。"
      - "理由文字顯示：這是因為我們遵守一項來自 Taiwan Health Promotion Authority 的法律要求，必須限制這則內容。"
      - "本次僅能驗證使用者提供的影像檔內容，尚未由 Meta/Threads 後台或獨立台灣／海外連線重現其真實性與限制範圍。"
      - "sha256=f102e0d120f0bdad720a13c21e6c6ac491a6ece8c8a23431f7f9ee7c4fabe4a0"

  - id: S002
    source_type: primary
    publisher: "Meta"
    title: "Meta Q1 2023 Quarterly Update on the Oversight Board"
    url: "https://about.fb.com/wp-content/uploads/2023/05/Meta-Q1-2023-Quarterly-Update-on-the-Oversight-Board.pdf"
    published_at: "2023-05"
    observed_at: "2026-10-15"
    retrieval_status: reachable
    notes:
      - "Meta 說明：2022年推出基於當地法律、following a government request 的地區性內容限制通知；2023年第1季再更新通知文字，在特定司法轄區顯示送出 takedown request 的政府機關。"
      - "這是判讀 S001 畫面屬於何種 Meta 通知類型的重要一手來源。"

  - id: S003
    source_type: primary
    publisher: "Meta Transparency Center"
