promotion:
  cases:
    - "formosansnoopy Threads 台灣地區內容限制"
  comparators:
    - "Meta Taiwan Content Restrictions：HPA 一般性內容限制通報紀錄"
  research:
    - "向 Meta／HPA／衛福部／NCC 確認 Taiwan Health Promotion Authority 在 UI 中對應的法律實體。"
    - "取得本案 Meta government request / takedown request 的日期、案件編號、送件機關、法律依據與被要求限制的 URL 清單。"
    - "確認本案是否經『落實網路防護機制申訴系統服務平臺』受理、轉介，以及申訴人身分是否依法可公開。"
    - "以台灣與海外 IP 對相同帳號／貼文／留言做同時測試，確認限制是個別 URL、帳號頁面或帳號全部內容。"
    - "向三立／54陪審團製作單位取得10/04通告與取消紀錄，確認取消時間、理由及是否有來賓施壓。"
    - "尋找正國會／黃郁芬對職場霸凌與性騷指控的正式回應、內部處理文件或外部調查資料。"

notes:
  - "本 session 嚴格區分：『有政府連結的內容限制跡象』與『政治人物指揮政府封殺』是兩個不同命題。"
  - "目前最強證據鏈是 S001 + S002：若截圖為真，Meta 自身文件支持將這類 UI 理解為基於當地法律、following a government request 的地區性限制通知。"
  - "S003 只證明 HPA 曾一般性使用 Meta 的台灣內容限制通報管道，不能直接證明本案就是 HPA。"
  - "自殺風險內容與既存自殺內容申訴制度是必須排除的替代解釋；不能因政治人物／派系關係就省略這一步。"
  - "人物關係是調查線索，不是因果證據。"
  - "評論可討論政府訊息控管的透明度、比例原則與監督門檻；不得把 C003、C004、C005、C006、C007、C008、C009 當成已證實事實。"
