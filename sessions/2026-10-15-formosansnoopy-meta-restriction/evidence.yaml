    url: "https://transparency.meta.com/reports/content-restrictions/country/TW/"
    published_at: ""
    observed_at: "2026-10-15"
    retrieval_status: blocked
    notes:
      - "直接開啟頁面時回傳 HTTP 429，故未取得完整期間與上下文。"
      - "搜尋索引片段顯示：Through the same channel, we restricted access to 2,500 items in Taiwan reported by the Health Promotion Administration (HPA) for allegedly violating ..."
      - "只能據此確認 Meta 的台灣內容限制報告曾明確記載 HPA 透過該管道報告內容並導致台灣地區限制；不得用此片段推定本案個別限制就是 HPA 所送、也不得補上被截斷的法律依據。"

