facts:
  - id: F001
    statement: "使用者提供的 formosansnoopy Threads 畫面明確顯示『Content 無法在台灣顯示』，並寫明因遵守來自『Taiwan Health Promotion Authority』的法律要求而限制內容。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S001]
    evidence_summary: "影像檔本身可直接讀取上述 UI 文句；尚未獨立驗證 Meta 後台與實際地區限制狀態。"
    verification_notes:
      - "驗證的是截圖內容，不是截圖來源真偽。"
    tags: [Threads, Meta, 台灣地區限制, 使用者截圖]

  - id: F002
    statement: "Meta 公開文件說明：其『基於當地法律的地區性內容限制』通知，是在政府要求（government request）之後使用；2023年第1季並開始在特定司法轄區的通知中顯示送出 takedown request 的政府機關。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S002]
    evidence_summary: "Meta Q1 2023 Oversight Board update 對通知機制有直接說明。"
    tags: [Meta, government_request, local_law, content_restriction]

  - id: F003
    statement: "Meta 的台灣內容限制報告搜尋索引片段顯示，Meta 曾限制台灣境內2,500項由 Health Promotion Administration (HPA) 報告的內容。"
    status: partial
    observed_at: "2026-10-15"
    source_ids: [S003]
    evidence_summary: "直接頁面因 HTTP 429 無法取得完整內容；目前只能保存搜尋索引可見片段，期間與完整法律依據尚缺。"
    verification_notes:
      - "不得將此一般性統計直接歸因到 formosansnoopy 個案。"
    tags: [Meta, Taiwan, HPA, content_restriction]

  - id: F004
    statement: "國民健康署正式英文名稱為 Health Promotion Administration (HPA)；使用者截圖顯示的是『Taiwan Health Promotion Authority』，兩者字面並不完全一致。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S001, S004]
    evidence_summary: "國健署官方英文網站與截圖 UI 可直接對照。"
    tags: [國民健康署, HPA, Meta_UI]

  - id: F005
    statement: "《自殺防治法》第16條禁止網路媒體教導自殺方法、教唆／誘使／煽惑自殺、詳細描述自殺方法及原因、誘導自殺等內容；第17條第2項對網路媒體的法定裁罰與移除／下架權限文字指向直轄市、縣（市）主管機關。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S005]
    evidence_summary: "法規條文直接支持。"
    tags: [自殺防治法, 第16條, 第17條, 下架]

  - id: F006
    statement: "台灣目前存在由 NCC 委託建置、受理衛福部主管之『網路媒體不當自殺內容』申訴平台；該平台明確以疑似違反《自殺防治法》第16條或不符自殺報導原則的內容為申訴對象。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S006]
    evidence_summary: "申訴平台與衛福部函文均直接說明制度用途。"
    tags: [衛福部, 心理健康司, NCC, 自殺內容申訴]

  - id: F007
    statement: "三立官方節目頁面確認《54陪審團》於2026年10月4日13:55播出；使用者提供的來賓表照片標示同日13:55至16:00並列出『前國會助理 土狗妹』。"
    status: verified
