    published_at: "2026-10-22"
    observed_at: "2026-10-23T00:50:00+08:00"
    retrieval_status: reachable
    notes:
      - "貼文主張2014太陽花有『先立法、再審查』訴求；2016民進黨全面執政後提出監督條例草案但八年未完成立法；黃國昌2016在時代力量、2024在民眾黨均參與相關提案。"
      - "最後以『誰背叛太陽花』作政治評價；此評價需與可驗證立法史分層處理。"

