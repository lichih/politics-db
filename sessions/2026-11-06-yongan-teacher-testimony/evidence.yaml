facts: 
  - 
    id: "F001"
    statement: "2026年11月5日前後，臉書粉專「王子的教室」有人以在永安國小服務多年之教師立場，公開表示香鬆按班分配方式已實施多年，並因遭政治化而感到憤怒與不甘。"
    status: "verified"
    observed_at: "2026-11-06T18:11:18+08:00"
    source_ids: 
      - "S001"
      - "S002"
      - "S003"
    evidence_summary: "截圖內容與兩家新聞轉述相互印證；已確認有這樣的公開陳述，不代表每項歷史細節經獨立稽核。"
    verification_notes: 
      - "原始貼文URL未確認，保留來源限制。"
  - 
    id: "F002"
    statement: "教師自述，過去家長自付午餐費與改由政府補助後，香鬆供應方式沒有改變：按班一包，教師依班級情況決定如何分配。"
    status: "partial"
    observed_at: "2026-11-06T18:11:18+08:00"
    source_ids: 
      - "S001"
      - "S003"
    evidence_summary: "為第一線教師對校內慣例的證詞；缺乏歷年菜單或配送文件獨立證明。"
  - 
    id: "F003"
    statement: "教師表示分發不必每人量秤；可由孩子自行盛取，或由打飯小天使協助，並非必然要求教師親自分裝。"
    status: "partial"
    observed_at: "2026-11-06T18:11:18+08:00"
    source_ids: 
      - "S001"
      - "S003"
      - "S005"
    evidence_summary: "教師自述與校方說明一致；不能因此推論每班皆如此。"
  - 
    id: "F004"
    statement: "永安國小在2026年11月4日澄清，每人2g是建議取用份量、非上限，欲追加者可向教師反映，由備品補充。"
    status: "verified"
    observed_at: "2026-11-06T18:11:18+08:00"
    source_ids: 
      - "S004"
      - "S005"
    evidence_summary: "中央社與台視均轉述校方正式說明。"
  - 
    id: "F005"
    statement: "永安國小稱，因學生過敏與過去分配不均問題，經午餐供應委員會討論改由廠商分袋送各班，教師引導分發；校方對標示未說清楚致歉並將檢討工作負擔。"
    status: "verified"
    observed_at: "2026-11-06T18:11:18+08:00"
    source_ids: 
      - "S004"
      - "S005"
    evidence_summary: "校方正式說明，能證明校方有此立場；個別委員會會議記錄仍待取得。"
  - 
    id: "F006"
    statement: "教師自述政治爭議引發媒體詢問與上級壓力，認為無端讓師生蒙羞、影響工作。"
    status: "partial"
    observed_at: "2026-11-06T18:11:18+08:00"
    source_ids: 
      - "S001"
      - "S002"
      - "S003"
    evidence_summary: "直接記錄教師對遭遇與壓力的感受，不將其擴張為已證實有特定外部指示或違法侵害工作權。"
  - 
    id: "F007"
    statement: "食藥署食品營養標示份量參考值指引表將香鬆列入調味料類之拌料類（5g），魚鬆列入水產類（20g），兩者官方食品分類不同。"
    status: "verified"
    observed_at: "2026-11-06T13:54:02.092+00:00"
    source_ids: 
      - "S006"
    evidence_summary: "官方食品分類及標示參考量直接支持；數值不是學童應攝取的建議份量。"
  - 
    id: "F008"
    statement: "永安國小正式說明其香鬆用作搭配米飯的調味配料，不列入午餐主食或主菜的份量計算。"
    status: "verified"
    observed_at: "2026-11-06T13:54:02.092+00:00"
    source_ids: 
      - "S007"
    evidence_summary: "引述校方2026-11-04說明；是特定學校特定品項的實際使用定位。"
  - 
    id: "F009"
    statement: "2026年11月初社群與媒體曾把臺北永安國小2g香鬆與台南約13至15g單包品項直接比較，作為地方午餐政策優劣的批評。"
    status: "verified"
    observed_at: "2026-11-06T13:54:02.092+00:00"
    source_ids: 
      - "S008"
      - "S009"
    evidence_summary: "可核實有此對比論述，但台南單包的產品確切類別、食材及營養資料仍待核實。"
  - 
    id: "F010"
    statement: "魚鬆通常可當作飯食配菜，亦可能提供蛋白質；但能否算學校午餐主菜、配菜或符合蛋白質基準，須依配方、菜單與實際份量判斷。"
    status: "partial"
    observed_at: "2026-11-06T13:54:02.092+00:00"
    source_ids: 
      - "S006"
    evidence_summary: "食品分類支持為魚類加工食品而非香鬆調味拌料；『配菜』為烹調用途描述，不等同具法律效力的所有菜單分類。"
    verification_notes: 
      - "不得宣稱所有魚鬆100%魚肉、均富含Omega-3，或15g足以充當完整主菜。"
  - 
    id: "F011"
    statement: "一名被媒體介紹為前永安國小班親代表的家長表示，部分家長不喜歡工廠現成包裝配料，希望團膳廠商自行製作；他推測這可能影響供餐安排。"
    status: "partial"
    observed_at: "2026-11-07T08:25:00+08:00"
    source_ids: 
      - "S010"
    evidence_summary: "可確認此家長觀點被媒體報導；尚無家長會提案、廠商採購文件或午餐供應委員會議紀錄證明具體決策因果。"
    verification_notes: 
      - "不能把家長對加工配料的要求直接等同於家長提出2g分裝方案。"
  - 
    id: "F012"
    statement: "校方2026-11-04說明：學校請廠商另採食材製作香鬆，因校內過敏需求未直接混入白飯；學生曾反映原先撒飯供應不均，經午餐供應委員會討論後改採分袋配送及教師引導分發。"
    status: "verified"
    observed_at: "2026-11-07T08:25:00+08:00"
    source_ids: 
      - "S004"
      - "S011"
    evidence_summary: "媒體對永安國小完整聲明之報導；證明校方已公開說明決策原因與程序，尚待取得委員會原始會議記錄。"
  - 
    id: "F013"
    statement: "永安教師黃國平表示多年來香鬆按班供應、各班可彈性處理，不是新免費午餐政策才增加的流程；並自述家長會代表每日輪流監廚及一起用餐。"
    status: "partial"
    observed_at: "2026-11-07T08:25:00+08:00"
    source_ids: 
      - "S001"
      - "S002"
      - "S012"
    evidence_summary: "教師親身經驗之公開證詞有具名報導印證；時間跨度、每天輪值的完整紀錄尚未獨立核對。"
  - 
    id: "F014"
    statement: "Facebook『掰咖老師喇低賽』一文引用永安國小香鬆分發新聞作引子，進一步主張教師長期承擔各機關政策宣導、行政與成果填報負擔。"
    status: "verified"
    observed_at: "2026-11-07T08:25:00+08:00"
    source_ids: 
      - "S013"
    evidence_summary: "只記錄作者實際提出的主張與文章結構；不是已證明該校香鬆分發屬行政機關新增工作。"
claims: 
  - 
    id: "C001"
    statement: "永安國小規定每位學生只能吃2公克香鬆且教師必須逐人秤重分裝。"
    status: "contradicted"
    contradicts: 
      - "F003"
      - "F004"
      - "F005"
    reasoning_notes: "校方正式聲明與教師說明均反對此說；除非另有具體班級或指令證據，不得繼續當成已確認事實。"
  - 
    id: "C002"
    statement: "本次爭議使基層教師承受額外輿論與行政回應壓力。"
    status: "supported"
    supports: 
      - "F006"
    reasoning_notes: "支持層級為教師自述其感受與工作情形；工作權違法侵害與責任歸屬未被證實。"
  - 
    id: "C003"
    statement: "香鬆分發方式完全沒有可改善之處。"
    status: "unsupported"
    related_facts: 
      - "F005"
    reasoning_notes: "校方已表示標示易誤解、將重新討論減輕教師負擔；不能以政治攻防失準否定作業改善空間。"
  - 
    id: "C004"
    statement: "可僅憑臺北2g香鬆與台南13至15g魚鬆／肉鬆的克數，證明臺北營養午餐品質或預算效益較差。"
    status: "unsupported"
    related_facts: 
      - "F007"
      - "F008"
      - "F009"
    reasoning_notes: "若台南品項經辨識為魚鬆／肉鬆，屬不同食品類別及使用目的，不具直接同類重量比較基準；且仍缺完整菜單、成本、營養與實際供應紀錄。"
