facts:
  - id: F001
    statement: "沈伯洋確實在2024年7月16日立法院院會說過「畢竟凌虐不一定會造成傷害」。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S001]
    evidence_summary: "立法院公報保存逐字發言。"
    excerpt: "到底凌虐跟傷害的不同在哪裡？畢竟凌虐不一定會造成傷害……"
    verification_notes:
      - "原話真實，不應以否認原句方式澄清。"
    tags:
      - 原話
      - 立法院公報

  - id: F002
    statement: "沈伯洋該句的直接上下文是刑法第277條普通傷害罪、第286條凌虐罪、兒少法第112條加重及其競合與刑度問題。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S001]
    evidence_summary: "其前文直接比較第277與第286條；緊接其後的黃國昌發言亦明確說明第286條因第277條加兒少法第112條及想像競合而在實務上幾乎被架空。"
    tags:
      - 法律語境
      - 277
      - 286
      - 競合

  - id: F003
    statement: "第286條正式立法理由明文承認可能存在「凌虐但未成傷」的情況，並將第286條成立與第277條傷害結果分開判斷。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S002]
    evidence_summary: "正式立法理由使用「凌虐但未成傷」文字，並說明若造成身體或健康傷害，可能同時成立第286條及第277條。"
    excerpt: "至於在凌虐但未成傷……"
    tags:
      - 立法理由
      - 凌虐但未成傷

  - id: F004
    statement: "法律上的「凌虐」本身並非毫無侵害性的行為；刑法第10條立法理由要求凌辱虐待達到造成身體或精神苦痛的程度。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S003]
    evidence_summary: "第10條及其立法理由對凌虐設有獨立門檻，和第277條是否另行成傷不是同一問題。"
    tags:
      - 凌虐定義
      - 精神苦痛
      - 身體苦痛

  - id: F005
    statement: "2025年3月20日中天新聞公開說明「政客爽」挖出沈伯洋該句，顯示此粉專是目前可明確定位的早期摘句傳播節點之一。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S004]
    evidence_summary: "中天影片說明直接點名「政客爽」。"
    verification_notes:
      - "此證據不能單獨證明政客爽是全網第一個摘句者。"
    tags:
      - 傳播鏈
      - 政客爽

  - id: F006
    statement: "2025年3月21日凌濤在國民黨官方記者會中直接引用「凌虐不一定會造成傷害」，並以「難道虐童致死沒有傷害嗎？」進行政治攻防。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S005]
    evidence_summary: "國民黨官方網站保存記者會文字紀錄。"
    tags:
      - 國民黨
      - 凌濤
      - 政治使用

