sources:
  - id: S001
    source_type: primary
    publisher: "立法院"
    title: "立法院公報第113卷第71期院會紀錄"
    url: "https://ppg.ly.gov.tw/ppg/PublicationBulletinDetail/download/communique1/final/pdf/113/71/LCIDC01_1137115.pdf"
    published_at: "2024-07-16"
    observed_at: "2026-10-13"
    retrieval_status: reachable
    notes:
      - "沈伯洋於第286條修法三讀發言中說：「到底凌虐跟傷害的不同在哪裡？畢竟凌虐不一定會造成傷害……」。"
      - "其前文正在比較刑法第277條普通傷害罪、第286條，以及兒少法第112條加重後的刑度與適用問題。"
      - "沈伯洋之後緊接由黃國昌發言；黃國昌說明第286條在實務上因第277條加兒少法第112條後的法定刑比較與想像競合而幾乎被架空。"

  - id: S002
    source_type: primary
    publisher: "法務部主管法規查詢系統"
    title: "中華民國刑法第286條立法理由"
    url: "https://mojlaw.moj.gov.tw/LawContentReason.aspx?LSID=FL001424&LawNo=286"
    observed_at: "2026-10-13"
    retrieval_status: reachable
    notes:
      - "2024年修法理由明文區分第286條與第277條。"
      - "立法理由使用「凌虐但未成傷」文字，並說明造成身體或健康傷害時，可能同時成立第286條及第277條第1項傷害罪。"

  - id: S003
    source_type: primary
    publisher: "法務部主管法規查詢系統"
    title: "中華民國刑法第10條立法理由"
    url: "https://mojlaw.moj.gov.tw/LawContentReason.aspx?LSID=fl001424&LawNo=10"
    observed_at: "2026-10-13"
    retrieval_status: reachable
    notes:
      - "刑法第10條對「凌虐」作一般性定義。"
      - "2019年增訂理由說明，對他人施加身體或精神上的凌辱虐待，達到造成身體上或精神上苦痛之程度，屬凌虐行為。"

