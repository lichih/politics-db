facts:
  - id: F001
    statement: "沈伯洋確實在2024年7月16日立法院院會說過「畢竟凌虐不一定會造成傷害」。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S001]
    evidence_summary: "立法院公報保存逐字發言。"
    excerpt: "到底凌虐跟傷害的不同在哪裡？畢竟凌虐不一定會造成傷害……"
    verification_notes:
      - "原話真實，不應以否認原句方式澄清。"
    tags:
      - 原話
      - 立法院公報

  - id: F002
    statement: "沈伯洋該句的直接上下文是刑法第277條普通傷害罪、第286條凌虐罪、兒少法第112條加重及其競合與刑度問題。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S001]
    evidence_summary: "其前文直接比較第277與第286條；緊接其後的黃國昌發言亦明確說明第286條因第277條加兒少法第112條及想像競合而在實務上幾乎被架空。"
    tags:
      - 法律語境
      - 277
      - 286
      - 競合

  - id: F003
    statement: "第286條正式立法理由明文承認可能存在「凌虐但未成傷」的情況，並將第286條成立與第277條傷害結果分開判斷。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S002]
    evidence_summary: "正式立法理由使用「凌虐但未成傷」文字，並說明若造成身體或健康傷害，可能同時成立第286條及第277條。"
    excerpt: "至於在凌虐但未成傷……"
    tags:
      - 立法理由
      - 凌虐但未成傷

  - id: F004
    statement: "法律上的「凌虐」本身並非毫無侵害性的行為；刑法第10條立法理由要求凌辱虐待達到造成身體或精神苦痛的程度。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S003]
    evidence_summary: "第10條及其立法理由對凌虐設有獨立門檻，和第277條是否另行成傷不是同一問題。"
    tags:
      - 凌虐定義
      - 精神苦痛
      - 身體苦痛

  - id: F005
    statement: "2025年3月20日中天新聞公開說明「政客爽」挖出沈伯洋該句，顯示此粉專是目前可明確定位的早期摘句傳播節點之一。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S004]
    evidence_summary: "中天影片說明直接點名「政客爽」。"
    verification_notes:
      - "此證據不能單獨證明政客爽是全網第一個摘句者。"
    tags:
      - 傳播鏈
      - 政客爽

  - id: F006
    statement: "2025年3月21日凌濤在國民黨官方記者會中直接引用「凌虐不一定會造成傷害」，並以「難道虐童致死沒有傷害嗎？」進行政治攻防。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S005]
    evidence_summary: "國民黨官方網站保存記者會文字紀錄。"
    tags:
      - 國民黨
      - 凌濤
      - 政治使用

  - id: F007
    statement: "「民眾之聲」是台灣民眾黨自有官方影音體系，而非與民眾黨無關的外圍頻道。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S006]
    evidence_summary: "民眾黨官網直接設置「民眾之聲」影音專區；黨大事紀記載由文宣創意部成立該YouTube頻道。"
    tags:
      - 台灣民眾黨
      - 民眾之聲
      - 官方媒體

  - id: F008
    statement: "2025年3月28日民眾黨官方「民眾之聲」《觀點相對論》以「沈伯洋稱『凌虐不一定造成傷害』？」作為標題核心，影片說明亦沿用「粉專挖出」及網友反嗆的摘句框架。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S006, S007]
    evidence_summary: "YouTube影片標題與說明均可直接確認；民眾黨官網確認「民眾之聲」之官方性質。"
    tags:
      - 台灣民眾黨
      - 民眾之聲
      - 摘句傳播

  - id: F009
    statement: "在民眾之聲該影片發布前，李頂立已任台灣民眾黨文宣部主任。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S007, S008]
    evidence_summary: "中央社於2025年2月19日記錄李頂立續任文宣部主任；影片於3月28日發布並列李頂立為主持人。"
    tags:
      - 李頂立
      - 文宣部

  - id: F010
    statement: "使用者提供的民眾之聲影片留言把「凌虐不一定會造成傷害」轉述成「凌虐不會構成傷害」，同時刪去「不一定」並將「造成」改為「構成」。"
    status: partial
    observed_at: "2026-10-13"
    source_ids: [S009]
    evidence_summary: "留言可由使用者提供的直達URL與原文定位，但本次自動檢索未獨立抓取成功。"
    verification_notes:
      - "適合作為資訊變形案例保存；若未來可獨立抓取或截圖存證，可升格為verified。"
    tags:
      - YouTube留言
      - 語意變形

  - id: F011
    statement: "《庶民大頭家》PART 2的標題與全集來賓標籤雖含張啓楷，但這些metadata本身不足以證明張啓楷在該片段親自使用「凌虐不一定會造成傷害」作為攻擊。"
    status: verified
    observed_at: "2026-10-13"
    source_ids: [S010]
    evidence_summary: "YouTube索引只能證明該集來賓名單與影片主題，不能把片段內容自動歸到每一位列名來賓。"
    tags:
      - 張啓楷
      - 證據邊界

claims:
  - id: C001
    statement: "「沈伯洋認為凌虐不會讓受害者受到任何傷害或痛苦。」"
    status: contradicted
    contradicts: [F002, F003, F004]
    related_facts: [F001]
    reasoning_notes: "原句存在，但法律上下文是第277條成傷結果與第286條凌虐罪的區分；凌虐本身仍有身體或精神苦痛的法律門檻。"

  - id: C002
    statement: "「沈伯洋說過『凌虐不會構成傷害』。」"
    status: contradicted
    contradicts: [F001, F010]
    reasoning_notes: "可驗證原話為「凌虐不一定會造成傷害」；「不會構成傷害」是後續轉述版本。"

  - id: C003
    statement: "「只有藍營在傳播這個摘句框架。」"
    status: contradicted
    contradicts: [F007, F008]
    reasoning_notes: "民眾黨官方影音體系「民眾之聲」於2025-03-28也採用該摘句作為節目標題與說明框架。"

  - id: C004
    statement: "「黃國昌本人曾用這句摘句攻擊沈伯洋。」"
    status: unresolved
    related_facts: [F002]
    reasoning_notes: "本次檢索未找到可確認的本人直接使用紀錄；原始2024院會中黃國昌反而緊接沈伯洋後說明277、286與競合問題。not_found不等於never_existed。"

  - id: C005
    statement: "「張啓楷本人在《庶民大頭家》PART 2用這句摘句攻擊沈伯洋。」"
    status: unsupported
    contradicts: [F011]
    reasoning_notes: "目前可檢索資料只有片名與全集來賓標籤，不能證明張啓楷在該片段發言。使用者另提供Gemini逐段檢視結果稱該PART 2張啓楷完全未發言，但本ledger不以該AI輸出作為獨立證據。"

