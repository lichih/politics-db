facts:
  - id: F001
    statement: "2018年法務部在第103條之1草案階段已明確質疑：草案不要求賭博行為實際影響選舉結果，卻對選舉賭客另設重刑，應釐清其特別侵害的法益、刑罰必要性，並檢驗刑法謙抑、最後手段及罪刑均衡。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S001]
    evidence_summary: "使用者目前提出的法律原則疑問，在2018年法務部正式法規諮詢意見中已有高度相同的質疑。"
    excerpt: "並未要求達影響選舉結果"
    verification_notes: []
    tags: [刑法謙抑, 最後手段, 比例原則]

  - id: F002
    statement: "特別處罰一般選舉賭客並非2026年檢警自行擴張解釋；行政院2018年已提出特別選舉賭博罪，2023年立法院完成立法並正式增訂第103條之1。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S002, S003, S004, S005, S006]
    evidence_summary: "立法者有意把單純參與選舉結果賭博者納入選罷法特別刑罰。"
    excerpt: ""
    verification_notes: []
    tags: [立法沿革]

  - id: F003
    statement: "2023年前後立法理由以選舉賭盤可能使投注者為獲利而試圖影響選舉公正、以及選舉賭盤不當影響選舉結果為主要加重處罰理由。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S003, S004]
    evidence_summary: "立法目的明顯是選舉公正與操盤誘因，而不只是一般賭博的道德或善良風俗。"
    excerpt: ""
    verification_notes: []
    tags: [保護法益, 選舉公正]

  - id: F004
    statement: "把 Polymarket 這類可交易、浮動價格的 prediction market 合約認定為選舉『賭博財物』，則包含司法解釋與適用的一步；2024年臺中地院已直接接受此分類並判刑。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S007]
    evidence_summary: "條文本身未寫 Polymarket 或 prediction market；法院把其PK對賭、USDC與選舉結果合約視為賭博。"
    excerpt: ""
    verification_notes:
      - "該簡易判決並未深入處理prediction market與傳統賭盤在法益或金融結構上的差異。"
    tags: [Polymarket, 司法解釋]

  - id: F005
    statement: "2026年立法院法制局研究承認Polymarket不同於傳統莊家設定賠率，而是以區塊鏈、類訂單簿與市場參與者形成價格；但仍從選舉賭盤及市場操縱／從眾效應風險框架分析。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S008]
    evidence_summary: "官方研究已注意到新型預測市場和傳統賭盤的結構差異。"
    excerpt: ""
    verification_notes:
      - "該文僅為法制局研究，不代表立法院正式立場。"
    tags: [預測市場, 法制局]

claims:
  - id: C001
    statement: "現行選罷法處罰單純選舉賭客只是檢察機關在2026年自行擴張法條。"
    status: contradicted
    supports: []
    contradicts: [F002]
    related_facts: [F001, F003]
    reasoning_notes: "一般賭客本來就是立法明文要處罰的對象。"

  - id: C002
    statement: "使用者對『未要求實際影響選舉、卻以前置風險重罰一般賭客』的刑法謙抑與比例原則疑問，屬於立法時就曾被官方法律機關正式提出的問題。"
    status: supported
    supports: [F001]
    contradicts: []
    related_facts: [F003]
    reasoning_notes: "法務部2018意見幾乎逐項提出相同疑問；最終立法選擇並未消除這個規範正當性問題。"

  - id: C003
    statement: "Polymarket必然與傳統地下選舉賭盤完全相同，因此無須另行論證prediction market的性質。"
    status: unsupported
    supports: []
    contradicts: [F005]
    related_facts: [F004]
    reasoning_notes: "法院已有適用先例，但2026法制局也明確認知其市場機制與傳統莊家盤不同；分類是否應完全同一仍有可討論空間。"

