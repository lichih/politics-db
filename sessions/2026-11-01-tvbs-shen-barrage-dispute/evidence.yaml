notes:
  - "本事件須與10月31日辯論後的『媒體提問題目事前提供』爭議分開保存；兩者都是主辦相關爭議，但發生時間、爭點與發言主體不同，不得混成同一證據鏈。"
  - "後續優先補沈伯洋陣營10月30日原始貼文與修改後版本、三立對彈幕授權限制的公開說法，以及若可取得的雙方授權約定或完整溝通紀錄。"
  - "TVBS官方聲明具有較高的一手性，且其公開使用『不實指控』『嚴重誤導』等措辭，使此事不宜只視為一般流程誤會；但嚴重措辭的存在與底層指控是否完全成立仍是兩個不同命題。"
