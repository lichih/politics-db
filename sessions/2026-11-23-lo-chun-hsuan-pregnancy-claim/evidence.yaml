facts:
  - id: F001
    statement: "2026年11月23日北投車掃行經東華街時，呂姓女騎士載母親與嬰兒追撞汽車。"
    status: verified
    observed_at: "2026-11-23T18:45:00+08:00"
    source_ids: [S001, S002]
    evidence_summary: "中央社引述警方調查，並有媒體現場紀錄。"
    verification_notes: []
    tags: ["北投車掃", "交通事故"]
  - id: F002
    statement: "事件發生後蔣萬安及黃瀞瑩停下車掃、現場關心，並有救護車到場將傷者送醫。"
    status: verified
    observed_at: "2026-11-23T18:45:00+08:00"
    source_ids: [S002]
    evidence_summary: "鏡週刊記錄現場停車關心及救護車送醫。"
    verification_notes: []
    tags: ["現場處置"]
  - id: F003
    statement: "羅浚晅透過社群質疑『直接先檢討孕婦？』及市長現場未緊急調度指揮。"
    status: verified
    observed_at: "2026-11-23T18:45:00+08:00"
    source_ids: [S003, S005]
    evidence_summary: "新聞引述與蘇一峰公開轉貼的貼文圖卡。"
    verification_notes:
