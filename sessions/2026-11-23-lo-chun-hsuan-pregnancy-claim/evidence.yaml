    tags: ["社群發言", "歸責"]
  - id: F004
    statement: "臺北市政府發言人魏汶宣公開表示傷者並非孕婦，且『下次騎車注意安全』不是蔣萬安所說。"
    status: verified
    observed_at: "2026-11-23T18:45:00+08:00"
    source_ids: [S003]
    evidence_summary: "此項確認的是市府作出澄清，不是公開了傷者醫療診斷報告。"
    verification_notes:
