    tags: ["市府澄清", "孕婦"]
  - id: F005
    statement: "羅浚晅於2022年10月3日由陳時中競辦公布為競選發言人，並宣示希望選舉『說出真話、看出問題』。"
    status: verified
    observed_at: "2026-11-23T18:45:00+08:00"
