sources:
  - id: S001
    source_type: primary
    publisher: "中華民國總統府"
    title: "總統提名監察委員人選　審薦小組召集人陳前副總統介紹監察院第6屆監察委員被提名人"
    url: "https://www.president.gov.tw/News/25372"
    published_at: "2020-06-22"
    observed_at: "2026-10-22T04:47:55+08:00"
    retrieval_status: reachable
    notes:
      - "第6屆監委27人均由蔡英文總統提名。"
      - "院長被提名人陳菊當時為前總統府秘書長，另有多名被提名人具有立委、政務官、總統府／行政院諮詢或中央地方政府資歷。"
      - "總統府明示提名考量包括政府職務經驗、專業學識、人權素養與性別比例。"

  - id: S002
    source_type: primary
    publisher: "監察院"
    title: "第6屆監察委員葉宜津學經歷"
    url: "https://www.cy.gov.tw/IntraGen_detailS1.aspx?file_id=27956&n=493"
    observed_at: "2026-10-22T04:47:55+08:00"
    retrieval_status: reachable
    notes:
      - "葉宜津官方簡歷直接列有民進黨黨團總召、副幹事長、幹事長、書記長、中央執行委員及中央黨部婦女部主任等經歷。"
      - "此來源只證明政治／黨務背景，不證明任監委後個案判斷受政黨指揮。"

  - id: S003
    source_type: primary
    publisher: "監察院"
    title: "監察院113年2月20日劾字第5號彈劾案審查決定書"
    url: "https://www.cy.gov.tw/DocFiles/IFDEWebBBS_CY/Docs/113/3RD/00/36/Attach/%E7%9B%A3%E5%AF%9F%E9%99%A2113%E5%B9%B42%E6%9C%8820%E6%97%A5%E5%8A%BE%E5%AD%97%E7%AC%AC5%E8%99%9F%E5%BD%88%E5%8A%BE%E6%A1%88%E5%AF%A9%E6%9F%A5%E6%B1%BA%E5%AE%9A%E6%9B%B8_%E5%85%AC%E5%B8%83%E7%89%88.pdf"
    published_at: "2024-03-13"
    observed_at: "2026-10-22T04:47:55+08:00"
    retrieval_status: reachable
    notes:
      - "陳宗彥彈劾案表決為成立2票、不成立11票。"
      - "成立：林盛豐、王麗珍；不成立：王榮璋、浦忠成、葉宜津、施錦芳、張菊芳、趙永清、賴振昌、郭文東、蕭自佑、林文程、鴻義章。"
      - "公開兩頁決定書記載案由、票數與具名名單，但未記載各審查委員認定成立或不成立的個別理由。"

  - id: S004
    source_type: primary
    publisher: "監察院主管法規共用系統"
    title: "監察院辦理糾舉彈劾案件注意事項"
    url: "https://www.cy.gov.tw/law/LawContent.aspx?id=FL000504&media=print"
    observed_at: "2026-10-22T04:47:55+08:00"
    retrieval_status: reachable
    notes:
      - "審查委員表決票須署名，並『得』附具決定理由，不是『應』附具理由。"
      - "審查會紀錄應記載審查委員表決附具理由之公告事項，但規範未要求每一票一定提出理由。"

  - id: S005
    source_type: primary
    publisher: "監察院主管法規共用系統"
    title: "監察法施行細則"
    url: "https://www.cy.gov.tw/law/LawContent.aspx?id=FL001000"
    observed_at: "2026-10-22T04:47:55+08:00"
    retrieval_status: reachable
    notes:
      - "彈劾案原則由13名監委審查，記名投票，投票委員過半數同意始成立。"
      - "審查決定書法定記載事項包括成立／不成立、票數及委員名單，但未要求記載個別委員理由。"
      - "規範另要求監委於有偏頗之虞等情形自行迴避。"

  - id: S006
