      - "此案是第6屆監察院對具民進黨政治背景人士成立彈劾的直接反例，可否定『綠營人物一律不辦』的全稱命題。"

facts:
  - id: F001
    statement: "第6屆監察院的政治任命入口非常明確：監委由總統提名、立法院同意；院長陳菊提名前為總統府秘書長，部分監委則具有明確政黨或政務背景。"
    status: verified
    observed_at: "2026-10-22T04:47:55+08:00"
    source_ids: [S001, S002]
    evidence_summary: "總統府提名資料與監察院官方履歷可直接證明政治／政務背景；背景本身不等於個案偏頗。"
    tags: [政治任命, 人事結構, 監察院]

  - id: F002
    statement: "陳宗彥彈劾案於2024年以2票成立、11票不成立，正式公開決定書揭露具名投票結果，但未揭露各監委個別投票理由。"
    status: verified
    observed_at: "2026-10-22T04:47:55+08:00"
    source_ids: [S003]
    evidence_summary: "兩頁正式決定書只有案由、票數、名單及程序資訊，無個別理由。"
    tags: [陳宗彥, 彈劾, 透明度, 具名投票]

  - id: F003
    statement: "監察院現行規範只要求彈劾審查記名投票，審查委員『得』附具決定理由，並未要求每一票必須提出可公開檢驗的理由。"
    status: verified
    observed_at: "2026-10-22T04:47:55+08:00"
    source_ids: [S004, S005]
    evidence_summary: "注意事項明文使用『並得附具決定理由』；施行細則列出審查決定書法定欄位亦未包含每位委員的理由。"
    tags: [制度設計, 理由義務, 可問責性]

  - id: F004
    statement: "監察院對陳宗彥2比11爭議的公開回應，以機關新聞稿概括主張證據可能欠具體、充分或證據能力不足，但未逐一對應11名投不成立委員的個別判斷。"
    status: verified
    observed_at: "2026-10-22T04:47:55+08:00"
    source_ids: [S006]
    evidence_summary: "機關層級說明不能回推出每一名委員實際採用的理由。"
    tags: [陳宗彥, 機關說明, individual_accountability]

  - id: F005
    statement: "陳宗彥刑事案2025年一審無罪，檢方已上訴，因此目前不能以刑事程序結果證明監察院11票不成立必然是錯誤或包庇。"
    status: verified
    observed_at: "2026-10-22T04:47:55+08:00"
    source_ids: [S007, S008]
    evidence_summary: "刑事案尚未確定，且刑事犯罪構成要件與監察／公務員失職責任並不相同。"
    tags: [陳宗彥, 刑事責任, 反證]

  - id: F006
    statement: "2026年監察院完成監委公務車自律調查後，林郁容接送子女受『院會道歉』處分，王榮璋理髮受『促其注意』處分，蘇麗瓊牙痛就醫未受處分。"
    status: verified
    observed_at: "2026-10-22T04:47:55+08:00"
    source_ids: [S009]
    evidence_summary: "監察院官方新聞稿直接記載事實認定與處分。"
    tags: [公務車, 自律, 王榮璋, 林郁容, 蘇麗瓊]

  - id: F007
    statement: "北檢後續以相關監委自費負擔車輛衍生費用、欠缺圖利或背信犯罪故意為由簽結公務車刑案。"
    status: verified
    observed_at: "2026-10-22T04:47:55+08:00"
    source_ids: [S010]
    evidence_summary: "刑事簽結縮小了犯罪指控，但不否定監察院已認定部分使用行為超出或易受質疑。"
    tags: [公務車, 刑事簽結, 法律邊界]

  - id: F008
    statement: "王榮璋第6屆任內因公務車理髮被處『促其注意』；同年稍後仍獲賴清德提名為第7屆監察院副院長。"
    status: verified
    observed_at: "2026-10-22T04:47:55+08:00"
    source_ids: [S009, S012]
    evidence_summary: "處分與後續副院長提名均有公開紀錄；此事可供評估總統府提名標準，但不能單獨證明提名不當。"
    tags: [王榮璋, 副院長提名, 自律處分]

  - id: F009
    statement: "王榮璋於2026年立院人事審查時自承，第6屆六年參與調查案件31件，是所有監委最少；他解釋原因是主要投入國家人權委員會。"
    status: verified
    observed_at: "2026-10-22T04:47:55+08:00"
    source_ids: [S011]
    evidence_summary: "此數量是可比較輸出指標，但不能忽略國家人權委員會工作量與職務分工。"
    tags: [王榮璋, 工作量, 國家人權委員會]

  - id: F010
    statement: "第6屆監察院曾以11票成立、1票不成立通過對前民進黨立委莊碩漢的彈劾。"
    status: verified
    observed_at: "2026-10-22T04:49:43+08:00"
    source_ids: [S013]
    evidence_summary: "證明第6屆監察院並非對具有民進黨政治背景者一律拒絕彈劾。"
    tags: [莊碩漢, 反例, 民進黨, 彈劾]

claims:
  - id: C001
    statement: "第6屆監察委員具有政治或政務背景，所以其所有監察決定都可直接視為黨意決定。"
    status: unsupported
    related_facts: [F001]
    reasoning_notes: "政治背景提高獨立性與迴避問題的重要性，但不能單靠履歷推定個案動機或投票指令。必須結合具名投票、理由、比較案例與利益關係。"

  - id: C002
    statement: "陳宗彥2比11的結果已證明11名監委出於政黨偏袒而包庇陳宗彥。"
    status: unresolved
    related_facts: [F001, F002, F003, F004, F005]
    reasoning_notes: "具名結果與部分監委政治背景形成可研究的anomaly，但公開決定缺乏個別理由，且刑事案一審無罪、仍在上訴，現階段無法確認11人的主觀動機或結論必然錯誤。"

  - id: C003
    statement: "監察院彈劾審查制度提供足夠的公開理由，使外界能逐一檢驗每名監委為何投成立或不成立。"
    status: contradicted
    contradicts: [F002, F003, F004]
    reasoning_notes: "制度要求記名但理由僅為可選；陳宗彥案公開決定書即只有票數與名單，機關後來的概括新聞稿不能替代11人的個別理由。"

  - id: C004
    statement: "監察委員對自身行為的紀律責任具有強而可見的外部制裁機制。"
    status: contradicted
    contradicts: [F006, F007]
    reasoning_notes: "公務車案由監察院自身紀律委員會與院會處理，已確認的非公務／不合宜使用最終最高處分僅院會道歉；刑事面另由北檢認定無犯罪。此處僅評估監委自身紀律責任，不把無犯罪等同無倫理問題。"

  - id: C005
    statement: "王榮璋遭公務車自律處分及監察調查量最低，足以證明其不適任監察院副院長。"
    status: unresolved
    related_facts: [F008, F009]
    reasoning_notes: "兩項事實均是適任性評估材料，但31件調查量有其國家人權委員會分工解釋，『促其注意』的處分程度也需與整體職務表現比較，不能單獨推出不適任。"

  - id: C006
    statement: "相較審計部，第6屆監察委員體系的制度信任更依賴個人操守，且外部可審計性較弱。"
    status: unresolved
    related_facts: [F001, F002, F003, F004, F006, F008, F009]
    reasoning_notes: "現有證據已顯示監委在個案裁量、理由公開與自律處分上有較大的個人／合議空間；但要作跨機關強結論，仍應建立一致指標比較審計部與監察委員的選任、理由義務、公開底稿、追責與錯誤修正。"

  - id: C007
    statement: "第6屆監察院對具有民進黨政治背景的人士一律不彈劾，屬於『辦藍不辦綠』的絕對模式。"
    status: contradicted
    contradicts: [F010]
    reasoning_notes: "莊碩漢案11比1成立彈劾，是直接反例。較弱的『不同政治背景案件是否存在不對稱標準』仍需建立具名投票矩陣與同類案件比較，不能由單一反例或單一爭議案決定。"

searches:
  - id: Q001
