notes:
  - "使用者在2026-11-13提出跨案核心質疑：政黨與媒體關係爭議、政治人物利用未核實爆料攻擊對手、國軍將同一政治人物作為媒體識讀講者，三者的責任標準須一致。使用者的長期政治生態評價與青鳥／洋流 reward 推論不在公開資料庫當作事實定論。"
  - "另涉及羅大佑／蔣萬安爭議中『婚育與政治效忠議題如何轉移原始政策責任』的比較；本 session 未重新調閱該完整討論，僅作研究交叉索引而非新增已核實的羅大佑事實。"
  - "待補：原影片全文、11月18日前國防部承諾的報告、沈伯洋2025年原貼文、2026年7月後完整更正紀錄、是否有較新二審裁判。"
