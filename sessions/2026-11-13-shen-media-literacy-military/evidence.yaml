sources:
  - id: S001
    source_type: primary
    publisher: "中華民國國防部政治作戰局"
    title: "國防部發布新聞稿，針對「議員爆國軍莒光日看沈伯洋影片」乙情說明"
    url: "https://www.mnd.gov.tw/publication/88191"
    published_at: "2026-11-10"
    observed_at: "2026-11-13T19:30:44+08:00"
    retrieval_status: reachable
    notes:
      - "11月10日新聞稿稱2024年4月第3週《莒光園地》播出「抖音、TikTok如何影響國家安全」，並以「不實內容」「未經查證之不實言論」回應外界質疑。"
      - "此稿未涵蓋2023年另錄、當時仍用於新訓與教召的認知作戰課程。"
  - id: S002
    source_type: secondary
    publisher: "中央社"
    title: "國防部：新訓教召使用沈伯洋3年前錄製認知作戰教材　與選舉無關"
    url: "https://www.cna.com.tw/news/aipl/202611110120.aspx"
    published_at: "2026-11-11"
    observed_at: "2026-11-13T19:30:44+08:00"
    retrieval_status: reachable
    notes:
      - "記載政戰局長史順文於11月11日立院答詢，沈伯洋2023年7月另錄認知作戰單元，目前新兵國防通識課程及教召皆使用。"
      - "顧立雄表示依專業邀請，舉2026年國民黨立委陳永康錄節目為例；此為國防部的辯護主張。"
  - id: S003
    source_type: primary
    publisher: "臺灣臺北地方法院（司法院判決書；法律人轉載）"
    title: "臺灣臺北地方法院114年度訴字第6971號民事判決（2026-07-03）"
    url: "https://lawplayer.com/judgment/TPDV%2C114%2C%E8%A8%B4%2C6971%2C20260703%2C1_43ea7d5e70f19b5526f93883447cde0685d58390"
    published_at: "2026-07-03"
    observed_at: "2026-11-13T19:30:44+08:00"
    retrieval_status: reachable
    notes:
      - "判決系爭報導標題為「獨家/跟監偷拍責任全推給林姓攝影 黃國昌狗仔圈切割策略曝光」，內含2021年前後赴港傳聞；不能誤稱本件訴訟標題為另一篇獨立赴港報導。"
      - "法院依入出境資料，認黃國昌自2014年2月15日至2025年10月31日沒有赴港紀錄；被告未能提出其他赴港證據，亦自承刊前未向黃查證。"
      - "主文命鏡報與邱銘輝連帶賠償10萬元及利息、鏡報移除系爭報導，其餘請求駁回；一審非確定判決。"
  - id: S004
    source_type: primary
    publisher: "臺灣臺北地方法院（司法院裁定；法律人轉載）"
    title: "臺灣臺北地方法院114年度訴字第6971號民事裁定（2026-08-18）"
    url: "https://lawplayer.com/judgment/TPDV%2C114%2C%E8%A8%B4%2C6971%2C20260818%2C2_abe8e4f2b61c1b3749dc7ccdca702b88d89c6ecd"
    published_at: "2026-08-18"
    observed_at: "2026-11-13T19:30:44+08:00"
    retrieval_status: reachable
    notes:
      - "裁定記載鏡報及邱銘輝已提上訴，但當時仍待補繳二審裁判費並補正理由；未核實後續是否確定。"
  - id: S005
    source_type: commentary
    publisher: "台灣放送（轉載沈伯洋2025-10-31 Facebook 貼文）"
    title: "國會速報／沈伯洋"
    url: "https://www.telltaiwan.org/17881"
    published_at: "2025-10-31"
    observed_at: "2026-11-13T19:30:44+08:00"
    retrieval_status: reachable
    notes:
      - "轉載原話包含：「然後我今天被記者問才知道，黃國昌被爆料，之前自己有在去香港」及「笑死。台灣的悲哀」。"
      - "這是公開貼文的第三方轉載，原 Facebook 全文尚未直接檢視；不能據此聲稱有與媒體事前協調。"
  - id: S006
