    publisher: "沈伯洋台北市長競選總部"
    title: "〖闢謠〗喊話驗證報導真實性 沈伯洋遭黃國昌抹黑散播假消息"
    url: "https://puma.taipei/fact-checks/fact-check-15"
    published_at: "2026-07-04"
    observed_at: "2026-11-13T19:30:44+08:00"
    retrieval_status: reachable
    notes:
