facts:
  - id: F001
    statement: "國防部2026年11月10日新聞稿僅以2024年4月《莒光園地》播出紀錄回覆近期播放質疑，並批評外界『不實言論』。"
    status: verified
    observed_at: "2026-11-13T19:30:44+08:00"
    source_ids: [S001]
    evidence_summary: "國防部當日正式新聞稿的可核對文字。"
    tags: [國防部, 澄清, 2026]
  - id: F002
    statement: "2026年11月11日國防部政戰局長確認，沈伯洋2023年7月錄製的認知作戰教材仍供國軍新訓與教召使用；這與2024年4月的《莒光園地》播出為須區分的兩組資料。"
    status: verified
    observed_at: "2026-11-13T19:30:44+08:00"
    source_ids: [S002]
    evidence_summary: "中央社報導當日立法院答詢記錄，包含錄製年月、課程性質和持續運用。"
    tags: [國軍, 教育教材, 2026]
  - id: F003
    statement: "北院114年度訴字第6971號2026年7月3日一審就《鏡報》一篇涉及黃國昌赴港傳聞的報導，認定缺乏赴港事實證據、刊登前未盡合理查證義務，命部分賠償及下架。"
    status: verified
    observed_at: "2026-11-13T19:30:44+08:00"
    source_ids: [S003]
    evidence_summary: "法院依黃國昌入出境資料及被告自承未查證的紀錄作判斷；其餘請求被駁回。"
    verification_notes:
      - "判決不等於法院裁判其他關於跟監、金流、反滲透指控的真偽。"
      - "有上訴程序，勿稱確定判決。"
    tags: [判決, 合理查證, 媒體責任]
  - id: F004
    statement: "2026年8月18日民事裁定確認被告已對一審不利部分提起上訴，當時尚待補正；本次未確認後續終局結果。"
    status: verified
    observed_at: "2026-11-13T19:30:44+08:00"
    source_ids: [S004]
    evidence_summary: "法院裁定主文與理由明載應補繳二審裁判費及上訴理由。"
    tags: [上訴, 程序]
  - id: F005
    statement: "2025年10月31日沈伯洋公開貼文的可查轉載，將黃國昌被爆料赴港與立委赴中港澳報備法案受阻並置，最後以嘲諷收尾。"
    status: verified
    observed_at: "2026-11-13T19:30:44+08:00"
    source_ids: [S005]
    evidence_summary: "有第三方轉載貼文完整段落，保留『被爆料』的不確定語法，亦可觀察其後政治評論連結。"
    verification_notes:
      - "此事實僅指2025年轉載有此文字；仍需原貼文直接核對，且不能將行文效果當作證明沈明知不實。"
    tags: [沈伯洋, 社群言論, 未經證實爆料]
  - id: F006
    statement: "2026年7月4日沈伯洋競辦頁面否認他配合散播假訊息，主張其採訪曾要求查證，頁面未針對2025年10月31日貼文政治嘲諷另行表示道歉或更正。"
    status: verified
    observed_at: "2026-11-13T19:30:44+08:00"
    source_ids: [S006]
    evidence_summary: "可確認該頁面辯護主張與未載道歉；不證明其他平台從未有更正或道歉。"
    tags: [公開回應, 更正責任]
  - id: F007
    statement: "顧立雄2026年11月11日承諾一週內提供國軍播放沈伯洋教材的次數及觀看人次等資訊。"
    status: verified
    observed_at: "2026-11-13T19:30:44+08:00"
    source_ids: [S007]
    evidence_summary: "聯合報報導立法院答詢的後續交付承諾。"
    tags: [資訊公開, 國軍]

claims:
  - id: C001
    statement: "國防部11月10日澄清對於『2026年仍播放沈伯洋影片』的疑慮，未涵蓋所有相關教材，因而不足以全面反駁。"
    status: supported
    supports: [F001, F002]
    related_facts: [F007]
    reasoning_notes: "2024年《莒光園地》與2023年另錄、2026年仍使用的新訓教召教材是不同資料；澄清範圍不完整，不直接等於可證明官員故意說謊。"
  - id: C002
    statement: "沈伯洋以『被爆料』為措辭保留，仍將未經證實的赴港傳聞用於政黨攻擊，值得依其媒體識讀標準檢視其更正責任。"
    status: supported
    supports: [F003, F005, F006]
    related_facts: [F004]
    reasoning_notes: "此為公開文字的政治功能與責任判斷；不是法院對沈伯洋的司法判決，也不證明他明知不實、事前協調。"
  - id: C003
    statement: "沈伯洋在2026年7月一審後完全沒有在任何平台道歉、更正，或與《鏡報》事前配合散播假消息。"
    status: unresolved
    related_facts: [F005, F006]
    reasoning_notes: "已見競辦否認及特定頁面未道歉，未完成所有公開平台掃描；『配合』若指共同宣傳論證功能可評論，若指事前串通則需個別外部證據。"
  - id: C004
    statement: "國軍繼續使用政治候選人的認知作戰課程，應受行政中立、講者責任與教材遴選標準的審查。"
    status: supported
    supports: [F001, F002, F005, F006, F007]
    reasoning_notes: "政策與制度責任的規範性主張，不等於已證明影片內容實際教人造謠、國防部有助選意圖或違反特定法律。"
  - id: C005
    statement: "民進黨長期控制媒體，並指示沈伯洋與媒體合作抹黑黃國昌。"
    status: unresolved
    related_facts: [F003, F005, F006]
    reasoning_notes: "使用者提出的政治生態批判背景；本 session 個案資料不足以證明具體控制鏈、指示或事前串通。"

