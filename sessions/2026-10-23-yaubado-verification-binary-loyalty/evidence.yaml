    contradicts: []
    related_facts: []
    reasoning_notes: "政府後續查察確認至少部分個案存在並作成行政處置，足以證明揭露題材有真實問題基礎；這不等於其影片每個數量、人物、動機與因果主張都已被官方證實。"

  - id: C005
    statement: "八炯／閩南狼已『端掉臺灣人申辦中國身份的地下管道』。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F004]
    reasoning_notes: "現有資料可證明政府展開調查、查獲部分持證個案並持續清查；尚未找到可證明某一特定地下申辦網絡已被完整識別、關閉，或所有同類管道均失效的官方資料。not_found != never_existed。"

  - id: C006
    statement: "被稱為『地下管道』的中國身分申辦安排，是臺灣人『唯一投誠中國的機會』。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F004]
    reasoning_notes: "『投誠中國』不是已操作化的法律或行政分類，『唯一』又是排他性全稱命題；現有來源只處理中國身分證申領與查處，沒有資料證明不存在其他取得中國身分、政治效忠、移居或合作路徑。"

  - id: C007
    statement: "八炯／閩南狼揭露或政府查處中國身分證管道，造成中國在2025大罷免後加大透過國民黨破壞台灣法制憲政的力道。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F004, F006]
    reasoning_notes: "本輪搜尋未找到能建立『身分證管道被查處 -> 中國決策 -> 國民黨行動增強』的直接文件、指揮鏈、時間序列識別或排除替代解釋的證據。即使個別國民黨行動可被批評為破壞憲政，也不能因此自動證明中國因前述事件而加大指揮力道。"

  - id: C008
    statement: "S002可作為『先以外部敵對威脅為前提，再把國內政治選項壓縮成二元忠誠分類』的存在性樣本。"
    status: supported
    supports: [F005]
    contradicts: []
    related_facts: []
    reasoning_notes: "本claim分類的是公開論述結構：作者先主張中國迫使台灣選邊，再把『相信藍白／與中國往來』和『獨立成新國家』設為兩端，並否定中間位置。它不判定任何政黨實際對中政策或國家忠誠。"

  - id: C009
    statement: "一篇以『對手支持者不求證』為核心批評的論述，如果其示範案例本身存在命題層級混淆、且後續重大因果鏈未附直接證據，具有研究『epistemic asymmetry：要求對手查證、但對己方敘事採較低舉證門檻』的價值。"
    status: supported
    supports: [F001, F005, F006]
    contradicts: []
    related_facts: [F002, F003, F004]
    reasoning_notes: "此處只主張研究價值與可操作化方向，不先判定作者所有具體主張皆為錯誤。最有辨識力的後續工作是逐項核對同一作者在對手與己方命題上接受何種證據門檻。"

  - id: C010
    statement: "黃國昌該則公開論述可合理分類為『真實引句 + 省略相鄰財政脈絡 + 跨制度比較』，而不是目前已證實的『剪接造假』。"
    status: supported
    supports: [F002, F007, F008]
    contradicts: []
    related_facts: [F003, F009]
    reasoning_notes: "賴清德確實支持屏東地方的65歲以上長者健保補助，黃引用的核心句子不是捏造；但賴在同一段中緊接著把大量福利與零舉債、還清債務連在一起。黃的貼文文字未呈現此相鄰條件，並把地方方案與中央法定支出版本並列。最精確的批評是去脈絡化與層級比較，而非在未掌握影片剪點前宣稱影片造假。"

  - id: C011
    statement: "賴清德支持『65歲以上長者健保費補助』這個政策概念本身，在屏東地方方案的語境下有直接證據。"
    status: supported
    supports: [F007]
    contradicts: []
    related_facts: [F003]
    reasoning_notes: "賴當場得知屏東明年推動65歲以上長者免健保費後表示『這樣就妥當了』，因此不能為了反駁黃國昌而否認其對地方版本的正面態度。真正待區分的是政策概念支持與中央法定版本支持。"

  - id: C012
    statement: "黃國昌把屏東地方補助與中央《老人福利法》法定補助並列，本身即可直接定性為『假資訊』。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F002, F003, F007, F008]
    reasoning_notes: "兩方案確有共同政策效果：公共財源替長者支付健保自付保費，因此政治人物可以主張兩者具有可比較性；但其財源層級、預算責任、法律拘束與規模又有重要差異。是否構成『雙標』屬政治／規範評價，需要說明比較標準；不能只因比較省略重要差異，就自動升格成可驗證的『假資訊』。因此S001拿此案作為藍白『餵食不正確資訊』的示範，仍未完成必要舉證。"

  - id: C013
    statement: "S013與S014可作為『evidence-demand -> epistemic disqualification -> identity substitution』的存在性樣本：當具體可驗證命題被要求指出錯誤資訊時，回應沒有先補上該錯誤，而改以提問者『沒看懂』、政治選民分類與預測其不會改變選擇來解釋分歧。"
    status: supported
    supports: [F010, F011]
    contradicts: []
    related_facts: [F001, F002, F007, F008]
    reasoning_notes: "本claim分類的是可觀察論證序列，不推定作者動機。身份／認知分類可以作為另外的社會心理命題研究，但不能替代『黃國昌哪一項資訊錯誤』這個原始事實命題的證明。"

  - id: C014
    statement: "只要一個人不同意作者對黃國昌的判斷，就足以證明該人屬於G1~G3、缺乏理解能力，且其未來投票選擇不可能被證據改變。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F011]
    reasoning_notes: "不同意特定政治判斷本身不足以推出完整選民類型、理解能力或未來投票不可更新。若G分類另有正式操作化定義，應依其量測條件獨立判定，不能把當前分歧本身當作分類證據。"

