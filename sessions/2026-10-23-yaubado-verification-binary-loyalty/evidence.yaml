    supports: []
    contradicts: []
    related_facts: [F002, F003, F007, F008, F009]
    reasoning_notes: "目前可確認賴清德被引用的核心句子確實說過，且黃國昌確實用它做跨制度比較；完整脈絡同時顯示賴在該句後立即把福利與屏東零舉債、還清債務連在一起。這足以支持『貼文文字去脈絡化／比較不完整』的批評，但仍未取得黃國昌實際上傳影片的可逐秒版本，不能把『剪輯本身已被證明造假或欺騙』寫成已成立事實。"

  - id: C003
    statement: "S001所舉的黃國昌／賴清德案例，已足以證明國民黨支持者整體長期被藍白餵食錯誤資訊、越來越不求證並拒絕任何正確資訊。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002, F003]
    reasoning_notes: "單一政治傳播案例無法推估整體支持者的認知行為或時間趨勢；且該示例本身至少包含『地方方案支持是否等同中央版本支持』與『剪輯是否失真』兩個需分開查核的問題。群體普遍性另需代表性抽樣、panel或可重複分類資料。"

  - id: C004
    statement: "八炯／閩南狼的中國身分證揭露確實具有外部查核價值，不能因其政治立場而直接視為純粹造謠。"
