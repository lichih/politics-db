claims:
  - id: C001
    statement: "現有公開資料足以把賴清德對屏東地方長者健保補助方案的肯定，直接等同為其支持2026-10-16立法院三讀的中央全國性法定補助版本。"
    status: unsupported
    supports: []
    contradicts: [F003]
    related_facts: [F002]
    reasoning_notes: "目前可直接確認的是賴在屏東地方福利脈絡中的正面評價；地方自行編列預算與中央法定給付在責任層級、財源與法律拘束上不同。不能用較窄的地方方案支持，自動證明其支持中央版本。"

  - id: C002
    statement: "黃國昌使用的賴清德影片片段已可確認因剪輯而構成事實失真或欺騙。"
