sources:
  - id: S001
    source_type: commentary
    publisher: "Threads / @yaubado537296"
    title: "『國民黨支持者非常不理性、被藍白餵食不正確資訊』貼文第1段"
    url: "https://www.threads.com/@yaubado537296/post/Dex2ol3EmRF"
    published_at: "2026-10-22"
    observed_at: "2026-10-23T00:38:18+08:00"
    retrieval_status: reachable
    notes:
      - "作者稱國民黨支持者建立在對民進黨與台派人士的仇恨上，長期被藍白兩黨『豢養』、餵食不正確的簡短圖文與短影音。"
      - "作者以『黃國昌剪接出來罵賴清德明明支持65歲以上健保免費的那部影片』作為上述主張的具體示例，並進一步稱這些支持者越來越不想求證、拒絕接收任何正確資訊。"
      - "當次頁面快照顯示主串約557次瀏覽、40讚、15回覆、3轉發；互動數只作觀察時點紀錄，不代表群體比例或對完整命題的同意。"

  - id: S002
    source_type: commentary
    publisher: "Threads / @yaubado537296"
    title: "『台灣人沒本錢成為中間選民』貼文第2段"
    url: "https://www.threads.com/@yaubado537296/post/Dex2q7zkmAP"
    published_at: "2026-10-22"
    observed_at: "2026-10-23T00:38:18+08:00"
    retrieval_status: reachable
    notes:
      - "作者稱台灣人沒有本錢成為其所稱G4至G6的『中間選民』，並將政治選擇表述為『支持跟中國來往、相信藍白兩黨』或『想要獨立出去成為新的國家』。"
      - "作者另以『忠誠不絕對，就是絕對的不忠誠』描述若中國統一後的中共忠誠要求。"

  - id: S003
    source_type: commentary
    publisher: "Threads / @yaubado537296"
    title: "『八炯閩南狼端掉中國身分地下管道，因此中國加大國民黨破壞憲政力道』貼文第3段"
    url: "https://www.threads.com/@yaubado537296/post/Dex2tzpEueP"
    published_at: "2026-10-22"
    observed_at: "2026-10-23T00:38:18+08:00"
    retrieval_status: reachable
    notes:
      - "作者主張罷免期間八炯與閩南狼『端掉了臺灣人申辦中國身份的地下管道』，並稱這『切斷了臺灣人唯一投誠中國的機會』。"
      - "作者進一步以『所以』連接因果，主張中國在國民黨罷免安全通關後，加大國民黨對台『破壞法制憲政』的力道。"

  - id: S004
    source_type: secondary
    publisher: "聯合報"
    title: "貼賴總統競選場宣傳65歲以上長者免健保費 黃國昌：在玩哪招？"
    url: "https://udn.com/news/story/6656/9820885"
    published_at: "2026-10-17"
    observed_at: "2026-10-23"
    retrieval_status: reachable
    notes:
      - "報導確認黃國昌曾在社群貼出賴清德於周春米屏東競總成立大會談長者健保費的片段，並據此質疑民進黨一方面反對立院修法、一方面支持長者健保補助。"
      - "報導引述黃國昌將賴清德對屏東方案的『那這樣就妥當了』與立法院《老人福利法》修正案放在同一政治比較中。"

  - id: S005
    source_type: primary
    publisher: "民主進步黨"
    title: "讚周春米『五星縣長』實至名歸　賴清德盼周春米連任"
    url: "https://www.dpp.org.tw/media/contents/11815"
    published_at: "2026-10-17"
    observed_at: "2026-10-23"
    retrieval_status: reachable
    notes:
      - "民進黨官方活動稿把賴清德當日發言置於支持屏東縣長周春米競選與評價屏東施政的脈絡中，並強調屏東在零舉債且還清債務下推動多項社會福利。"
      - "此來源可證明官方呈現的完整活動脈絡；不因其為政黨官方來源而自動證明所有政策評價正確。"

  - id: S006
    source_type: primary
    publisher: "民主進步黨"
    title: "藍白扭曲總統談話、混淆財政責任 民進黨：別只會政治操作，卻不敢面對財源問題"
    url: "https://www.dpp.org.tw/media/contents/11816"
    published_at: "2026-10-18"
    observed_at: "2026-10-23"
    retrieval_status: reachable
    notes:
      - "民進黨官方明確主張賴清德肯定的是屏東縣政府在不舉債、不排擠其他政策前提下推動長者健保費補助，並將地方政府自行編列預算與立法院修法要求中央增加支出區分為不同制度問題。"
      - "此來源證明民進黨的正式回應與其所主張的制度區分；不能單靠政黨自我陳述決定爭議的全部法律結論。"

  - id: S007
    source_type: primary
    publisher: "法務部調查局"
    title: "法務部調查局積極查察國人持有中國大陸身分證以維國家安全"
    url: "https://www.mjib.gov.tw/news/Details/1/1062"
    published_at: "2025-01-09"
    observed_at: "2026-10-23"
    retrieval_status: reachable
    notes:
      - "調查局稱，網傳『中國統戰紀錄片』談及中國以補助、貸款等手段引誘國人申辦中華人民共和國居民身分證後，該局召開會議瞭解並採取對應作為。"
      - "此來源可證明相關紀錄片揭露後政府機關確實啟動查察；不能由此自行推出某一『地下管道』已被完全端掉。"

  - id: S008
    source_type: secondary
    publisher: "中央社"
    title: "跆拳道選手李東憲等3人持中國大陸身分證 陸委會：已註銷台灣身分"
    url: "https://www.cna.com.tw/news/acn/202501230251.aspx"
    published_at: "2025-01-23"
    observed_at: "2026-10-23"
    retrieval_status: reachable
    notes:
      - "報導引述陸委會表示，八炯影片揭露後的查證中，李東憲、蘇士恩等個案經主管機關確認持有中國大陸身分證，已有3人被註銷台灣身分。"
      - "此來源證明部分個案揭露後產生實際行政查處結果；不證明所有影片中的數量主張或所有申辦管道均已查清。"

  - id: S009
    source_type: secondary
    publisher: "中央社"
    title: "逾30台灣人疑持中國身分證 內政部約談後廢止10人戶籍"
    url: "https://www.cna.com.tw/news/aipl/202502200279.aspx"
    published_at: "2025-02-20"
    observed_at: "2026-10-23"
    retrieval_status: reachable
    notes:
      - "報導記載移民署當時收到30多個案例並調查，已有10人被廢止台灣戶籍；另提及八炯與閩南狼的影片揭露有台灣人持中國身分證及台灣申辦據點。"
      - "政府持續查辦的描述，與『相關地下管道已被完全端掉』是不同命題。"

  - id: S010
    source_type: secondary
    publisher: "Newtalk新聞"
    title: "事實查核》賴清德喊「65歲免健保費妥當啦」 屏東縣目前確實零舉債"
    url: "https://newtalk.tw/news/view/2026-10-18/1066232"
    published_at: "2026-10-18"
    observed_at: "2026-10-23T00:51:46+08:00"
    retrieval_status: reachable
    notes:
      - "報導逐段引述賴清德當日相關發言：賴先稱周春米經濟、稅收增加並增加人民照顧，列舉育兒、月嫂、營養費、營養午餐、鮮乳與社宅後，提到明年65歲以上長者不用健保費並說『這樣就妥當了』。"
      - "緊接該句後，賴立即追問『工作做那麼多，你債務有增加很多嗎？』，周春米回答『零舉債』及『而且還清債務』；賴再以沒借錢、還清債務稱讚其施政。"
      - "Newtalk另查核屏東縣公開債務資料，稱近年公共債務餘額維持零舉債狀況。"

  - id: S011
    source_type: secondary
    publisher: "台視新聞"
    title: "【完整公開】LIVE 賴總統授旗 周春米競總成立大會"
    url: "https://news.ttv.com.tw/LIVE/76XlSf4G3iM"
    published_at: "2026-10-17"
    observed_at: "2026-10-23T00:51:46+08:00"
    retrieval_status: reachable
    notes:
      - "台視新聞留有2026-10-17周春米競總成立大會的完整公開直播頁，可作為後續逐秒核對原始活動影音的獨立來源。"
      - "本輪可確認完整直播存在與活動標題；目前檢索介面未提供可直接引用的逐秒字幕。"

  - id: S012
    source_type: secondary
    publisher: "知新聞"
    title: "轟綠抹黑老人免健保費！控賴清德譏『這樣就妥當了』 民眾黨斥：玩哪招？"
    url: "https://www.knews.com.tw/news/65143B47E8285E48B95F98A88687A8F0"
    published_at: "2026-10-17"
    observed_at: "2026-10-23T00:51:46+08:00"
    retrieval_status: reachable
    notes:
      - "報導轉述黃國昌臉書文字：黃稱民進黨前一日抹黑《老人福利法》修正，隔日賴清德在周春米競總『大力支持』補貼65歲以上長者健保費，並引用賴『聽說明年開始65歲以上長輩免健保費』與『那這樣就妥當了』。"
      - "該報導所轉述的黃國昌貼文文字沒有呈現賴在同一段發言中緊接著追問屏東債務、得到『零舉債／還清債務』回答的脈絡。"
      - "這只能證明貼文文字層級的選擇性呈現；不能單靠新聞轉述判定黃國昌上傳影片本身的精確剪點或長度。"

  - id: S013
    source_type: commentary
    publisher: "Threads / @yaubado537296"
    title: "被要求指出黃國昌哪一項資訊錯誤後，改稱對方『根本沒看懂』"
    url: "https://www.threads.com/@yaubado537296/post/Dezg57SkoxG"
    published_at: "2026-10-23"
    observed_at: "2026-10-23T01:53:00+08:00"
    retrieval_status: reachable
    notes:
      - "在被要求具體指出黃國昌哪一項資訊錯誤後，作者沒有在此回覆列出錯誤命題，而回稱『那就代表你根本沒看懂黃國昌在幹嘛』，並要求對方回去多看幾次。"
      - "作者另稱『看不懂就一直多看』，並把理解與否連回其原先『藍白一直在豢養著他的支持者』的群體判斷。"
      - "此來源只能證明這一輪互動如何回應舉證要求；不能據此推定作者主觀惡意或故意逃避。"

  - id: S014
    source_type: commentary
    publisher: "Threads / @yaubado537296"
    title: "再次被要求指出錯誤資訊後，以G1~G3選民與預測投票選擇分類提問者"
    url: "https://www.threads.com/@yaubado537296/post/DezoIzHErBU"
    published_at: "2026-10-23"
    observed_at: "2026-10-23T01:53:00+08:00"
    retrieval_status: reachable
    notes:
      - "在對方再次要求回答『黃國昌到底哪一項資訊是錯的』後，作者仍未在此回覆列出具體錯誤資訊。"
      - "作者改稱對方『只是用你主觀的角度去看那影片』、『根本不知道黃國昌在搞什麼』，並把對方歸為『覺得賴清德在雙標的G1~G3選民』。"
      - "作者進一步預測對方1128的選擇不會因討論改變，並以『你就不是G4選民』說明自己沒有必要再解釋。"
      - "此來源保存的是argument sequence與身份分類；不證明G分類本身有效，也不證明被分類者實際投票選擇。"

facts:
  - id: F001
    statement: "@yaubado537296 明確把『黃國昌剪接賴清德長者健保影片』作為證明藍白餵食錯誤資訊、國民黨支持者不求證的具體示例。"
    status: verified
    observed_at: "2026-10-23T00:38:18+08:00"
    source_ids: [S001]
    evidence_summary: "原貼文直接把此案例放在『餵食錯誤資訊／拒絕求證』論述中，具有示範證據角色。"
    tags: ["2026", Threads, 黃國昌, 賴清德, 長者健保, 不求證, example-premise]

  - id: F002
    statement: "黃國昌確曾公開使用賴清德在屏東為周春米站台時談『65歲以上長者免健保費／這樣就妥當了』的影片片段，並把該發言與立法院《老人福利法》中央補助版本並列，質疑民進黨雙重標準。"
    status: verified
    observed_at: "2026-10-23"
    source_ids: [S004]
    evidence_summary: "新聞報導直接記錄黃國昌貼片與其政治比較。"
    verification_notes:
      - "此 fact 只證明黃國昌的公開使用方式與主張，不判定該剪輯是否構成失真。"
    tags: ["2026", 黃國昌, 賴清德, 老人福利法, 影片]

  - id: F003
    statement: "賴清德相關發言發生在屏東縣長周春米競選活動、評價屏東地方施政與福利的脈絡；民進黨後續官方回應也明確把屏東地方自行編列預算的方案，與立法院修法要求中央增加全國性支出區分。"
    status: verified
    observed_at: "2026-10-23"
    source_ids: [S005, S006]
    evidence_summary: "兩份民進黨官方資料分別保存活動脈絡與後續制度區分立場。"
    verification_notes:
      - "政黨官方來源對其自身活動脈絡具有高來源接近性；對法律與財政效果的規範評價仍須與既有老人健保 research 的其他來源交叉閱讀。"
      - "既有 authoritative 查核另存於 sessions/2026-10-17-elderly-nhi-subsidy/evidence.yaml，本 session 不重複完整法制分析。"
    tags: ["2026", 屏東, 周春米, 地方補助, 中央補助, context]

  - id: F004
    statement: "八炯／閩南狼相關『中國統戰紀錄片』揭露中國身分證問題後，調查局明確表示已召開會議並採取對應作為；其後主管機關至少確認部分個案確實持有中國大陸身分證，並出現註銷台灣身分／戶籍的行政處置。"
    status: verified
    observed_at: "2026-10-23"
    source_ids: [S007, S008, S009]
    evidence_summary: "調查局官方說明與後續中央社報導可建立『揭露 -> 政府查察 -> 部分個案確認／處置』的可觀察程序鏈。"
    verification_notes:
      - "此 fact 不等同證明影片所稱全部人數、所有中介管道或統戰因果均已查證。"
    tags: ["2024", "2025", 八炯, 閩南狼, 中國身分證, 調查局, 移民署]

  - id: F005
    statement: "@yaubado537296 在同一串文第2段把台灣人的政治選擇表述為『支持跟中國來往、相信藍白兩黨』與『想要獨立出去成為新的國家』兩端，並據此否定中間選民位置。"
    status: verified
    observed_at: "2026-10-23T00:38:18+08:00"
    source_ids: [S002]
    evidence_summary: "原文直接以二分選項構造政治選擇空間。"
    tags: ["2026", binary-framing, 中間選民, 藍白, 獨立, 忠誠分類]

  - id: F006
    statement: "@yaubado537296 在第3段以『所以』建立因果鏈：八炯／閩南狼端掉中國身分申辦地下管道、切斷唯一投誠機會，因此中國在國民黨罷免安全通關後加大國民黨破壞台灣法制憲政的力道。"
    status: verified
    observed_at: "2026-10-23T00:38:18+08:00"
    source_ids: [S003]
    evidence_summary: "此 fact 只保存作者明示的因果結構，不把因果內容升格為外部事實。"
    tags: ["2026", causation-claim, 中國, 國民黨, 大罷免, 憲政]

  - id: F007
    statement: "賴清德在說完『明年開始65歲以上的長輩不用健保費』與『這樣就妥當了』後，緊接著詢問周春米在推動大量工作與福利下債務是否增加；周春米回答『零舉債』與『而且還清債務』，賴隨後以未借錢且還清債務稱讚其施政。"
    status: verified
    observed_at: "2026-10-23T00:51:46+08:00"
    source_ids: [S010]
    evidence_summary: "Newtalk對完整發言脈絡的逐段引述保留了『健保費補助 -> 債務狀況 -> 零舉債／還清債務』的直接相鄰語境。"
    verification_notes:
      - "S011另確認完整公開直播存在，可作未來逐秒影音核對來源。"
    tags: ["2026", 賴清德, 周春米, 屏東, 健保費, 零舉債, context]

  - id: F008
    statement: "新聞轉述的黃國昌臉書貼文文字，引用賴清德『65歲以上長輩免健保費／這樣就妥當了』並據此批評民進黨前後矛盾，但未在貼文文字中交代該句後緊接的屏東『零舉債／還清債務』問答。"
    status: verified
