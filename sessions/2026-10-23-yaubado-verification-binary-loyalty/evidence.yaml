promotion:
  cases: []
  comparators: []
  research:
    - proposed: "epistemic-asymmetry-and-binary-loyalty-framing"
      rationale: "可與既有 supporter-reward、同一把尺、identity bundling 研究交叉：追蹤『要求對手查證』與『對己方重大因果歸因的舉證門檻』是否在同一作者／同一群體中出現穩定不對稱。"
    - proposed: "identity-substitution-after-evidence-demand"
      rationale: "追蹤具體命題遭要求舉證後，是否從fact claim轉成『你是哪一類人／你不會被說服／你沒資格理解』的身份或認知分類；需要跨陣營paired cases與反例，不能由本案直接推估盛行率。"

notes:
  - "本 session 的首要價值不是證明作者『很蠢』，而是保存一個可拆解的公開論證鏈：群體不理性結論 -> 示範案例 -> 二元忠誠分類 -> 高強度中國—國民黨因果歸因。"
  - "對黃國昌影片的查核必須把『他確實剪輯／擷取片段』與『剪輯是否造成實質誤導』分開；前者可觀察，後者需完整影音比較。"
  - "對賴清德立場的描述必須區分『支持屏東地方方案』與『支持中央法定全國補助版本』；one true premise != valid conclusion。"
  - "對八炯／閩南狼亦使用同一把尺：政府後續確認部分中國身分證個案，足以提高其揭露的證據價值；但不能因此替『10萬人』『地下管道全被端掉』『唯一投誠機會』等更強命題預支正確性。"
  - "2026-10-23後續已取得賴清德相關發言的完整逐段脈絡與台視完整公開直播頁，C002因此由unresolved更新為unsupported：目前不能把『剪輯本身造假／欺騙』視為已證實；可支持的是貼文文字去脈絡化與跨制度比較不完整。若未來取得黃國昌實際影片檔，再做逐秒剪點核對。"

  - "2026-10-23新增互動pattern：原作者在兩輪被要求指出可驗證的『錯誤資訊』後，當回合均未提供具體錯誤命題，回應依序轉向『你沒看懂』與G類型／投票不可改變的身份分類。此pattern只作存在性樣本，不把沉默或拒答本身當成原主張為假的證據。"
