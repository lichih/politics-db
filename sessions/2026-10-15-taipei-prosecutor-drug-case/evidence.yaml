facts:
  - id: F001
    statement: "公開資料顯示，劉姓檢察官於2026年2月27日在新北市蘆洲遭警方查獲，背包內有含甲基安非他命殘渣袋，尿液檢驗呈安非他命及甲基安非他命陽性；其後於偵查中坦承施用。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S003, S004]
    evidence_summary: "中央社分別轉述新北地檢與北檢正式新聞稿，兩機關對查獲日期、陽性結果與坦承施用核心事實一致。"
    tags: ["2026-02-27", "甲基安非他命", "尿液陽性", "施用第二級毒品"]

  - id: F002
    statement: "蘆洲分局於2026年8月21日函送案件；新北地檢8月27日收受卷證、9月4日完成分案。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S005]
    evidence_summary: "太報逐項轉述新北地檢10月15日下午補充的官方辦案時序。"
    verification_notes:
      - "目前尚未取得蘆洲分局8月21日函文原件。"
    tags: ["蘆洲分局", "新北地檢", "函送", "分案"]

  - id: F003
    statement: "依新北地檢對外說明，承辦主任檢察官於2026年10月1日核閱案件時始知被告為北檢檢察官，隨即向檢察長陳報並口頭通報臺高檢；新北地檢10月2日再發文通報臺高檢。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S005]
    evidence_summary: "新北地檢經媒體轉述公布明確日期與處理動作。"
    tags: ["2026-10-01", "2026-10-02", "身分辨識", "臺高檢"]

  - id: F004
    statement: "北檢表示其於2026年10月5日經臺高檢通知劉姓檢察官涉毒情事，當日啟動內部行政調查；10月13日職務評定認情節重大並函請檢察官評鑑委員會進行個案評鑑，辭職令生效前其請假暫停行使檢察官職務。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S001, S004]
    evidence_summary: "北檢官網確認新聞稿存在，中央社轉述新聞稿中的10月5日與10月13日時序。"
    tags: ["北檢", "2026-10-05", "2026-10-13", "個案評鑑", "暫停職務"]

  - id: F005
    statement: "新北地檢於2026年10月13日對劉姓檢察官作成緩起訴1年6月、附命戒癮治療等條件；公開理由包括坦承犯行、無施用毒品前科、有戒癮意願及醫療機構評估。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S002, S003, S005]
    evidence_summary: "新北地檢官網確認緩起訴新聞稿；中央社與太報一致轉述處分期間、條件及主要考量。"
    tags: ["緩起訴", "1年6月", "戒癮治療", "無毒品前科"]

  - id: F006
    statement: "附命戒癮治療之緩起訴並非針對本案特設：法律明文允許施用第一、二級毒品案件採此制度，臺高檢2024年資料顯示113年1至4月此類處分占全部毒偵案件23.5%。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S008, S009, S010]
    evidence_summary: "法律與臺高檢官方統計均證明制度具有一般適用性；但23.5%是全部毒偵案件統計，不能單獨證明本案與同條件一般被告待遇完全一致。"
    tags: ["緩起訴比較", "戒癮治療", "23.5%", "一般制度"]

  - id: F007
    statement: "刑事訴訟法第256條規定，依第253-1條作成的緩起訴處分，如無得聲請再議之人，原檢察官應依職權逕送直接上級檢察署檢察長或檢察總長再議。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S007]
    evidence_summary: "現行刑事訴訟法條文直接支持。"
    verification_notes:
      - "此事實說明一般程序規則；本次尚未取得本案實際送職權再議及審核結果的文件。"
    tags: ["刑事訴訟法256", "職權再議", "上級檢察署"]

  - id: F008
    statement: "檢察官依現行法及倫理規範負有高於一般私人身分的職務信任義務：代表國家追訴犯罪，並應公正超然、勤慎執行職務、廉潔自持、謹言慎行及維護職位尊嚴。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S011, S012]
    evidence_summary: "法官法第86、89條與檢察官倫理規範第2、5條直接支持。"
    tags: ["檢察官職務信任", "法官法", "檢察官倫理規範"]

  - id: F009
    statement: "媒體報導劉姓檢察官在2月27日被查獲後至10月知情處置前仍持續辦案，並稱其9月21日重大刑案仍由其指揮；本次未取得官方分案或指揮紀錄原件。"
    status: partial
    observed_at: "2026-10-15"
    source_ids: [S006]
    evidence_summary: "太報具體報導其後續承辦案件，但欠缺官方案件分案文件；北檢則明確表示直到辭職處理時才請假暫停職務，與其此前仍在職相容。"
    tags: ["繼續辦案", "職務風險", "未取得分案原件"]

  - id: F010
    statement: "目前公開的官方時序只說警方完成鑑驗等作業後於8月21日函送，沒有公開尿液與扣案物各自的送驗日期、報告完成日期，也沒有說明2月27日至8月21日各階段實際耗時。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S005]
    evidence_summary: "新北地檢公開說明使用『完成鑑驗等作業後』概括描述警察端期間，未列鑑驗關鍵日期。"
    tags: ["資訊缺口", "鑑驗日期", "警方時序"]

  - id: F011
    statement: "一篇FTNN獨家報導稱警方移送資料未註明劉姓被告的檢察官身分，並稱承辦主任檢察官因姓名辨識出司法官同期同學；此細節目前沒有警方移送書或新北地檢官方文件可供本次查核直接驗證。"
    status: partial
    observed_at: "2026-10-15"
    source_ids: [S013]
    evidence_summary: "保留媒體具體報導作為後續調查線索，不升格為已確認官方事實。"
    tags: ["身分欄", "警方移送書", "未獨立確認"]

  - id: F012
    statement: "同一篇FTNN報導稱劉姓被告未供出毒品上游；目前未取得警方或檢方說明其毒品來源調查範圍、是否另案追查或追查結果。"
    status: partial
    observed_at: "2026-10-15"
    source_ids: [S013]
    evidence_summary: "只能確認有媒體提出『未供出上游』說法；不能據此斷言檢警沒有追查毒品來源。"
    tags: ["毒品來源", "上游", "未解問題"]

  - id: F013
    statement: "黃國昌2026年10月15日公開主張本案『一路遮掩』、『緩起訴寬典』及『包庇遮醜』，並批評劉姓檢察官2月遭查獲後仍繼續辦案、北檢直到10月13日才送個案評鑑。"
    status: partial
    observed_at: "2026-10-15"
    source_ids: [S014]
    evidence_summary: "使用者提供貼文全文，可確認本次查核針對的主張內容；Facebook原文未由工具獨立擷取。"
    tags: ["黃國昌", "公開主張", "包庇", "遮掩"]

claims:
  - id: C001
    statement: "北檢自2026年2月27日起即已知劉姓檢察官涉毒，仍故意讓其繼續辦案至10月。"
    status: contradicted
    contradicts: [F003, F004]
    related_facts: [F001, F009]
    reasoning_notes: "現有公開時序指出新北地檢10月1日始辨識其檢察官身分，北檢10月5日才接獲臺高檢通知。這只能反駁『北檢自2月即明知』的狹義命題；不能據此消除2月至10月跨機關通報與職務風險管理的問題。"

  - id: C002
    statement: "劉姓檢察官獲緩起訴本身，即可證明檢方因其檢察官身分給予特殊寬典或包庇。"
    status: unsupported
    related_facts: [F005, F006, F007]
    reasoning_notes: "法律明文允許施用一、二級毒品採附命戒癮治療緩起訴，且官方統計顯示實務上廣泛運用。要證明特殊待遇，仍需同條件一般被告比較、分案與審核資料。本案是否已完成職權再議亦待查。"

  - id: C003
    statement: "『北檢直到10月才知道』足以解消本案的制度責任問題。"
    status: contradicted
    contradicts: [F008, F009, F010]
    related_facts: [F001, F002, F003, F004]
    reasoning_notes: "北檢晚知情可以限縮北檢『明知包庇』的指控，但本案涉及具有國家追訴權的現職檢察官；2月已進入警察刑事程序而職務管理端至10月才收到資訊，仍留下跨機關識別、通報與風險控管責任問題。"

  - id: C004
    statement: "蘆洲分局2月27日至8月21日的期間已可確認是不當延宕或故意包庇。"
    status: unresolved
    related_facts: [F002, F010]
    reasoning_notes: "目前缺尿液與扣案物送驗、鑑驗完成日期，以及警方內部處理節點。六個月時間差值得查，但不能在缺關鍵日期時直接定性為不當延宕或包庇。"

  - id: C005
    statement: "尿液或扣案毒品鑑驗報告本身耗時將近六個月才完成。"
    status: unresolved
    related_facts: [F010]
