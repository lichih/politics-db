promotion:
  cases: []
  comparators:
    - "文化部／國立臺灣博物館 ICOM 2025 Dubai：原編開會、談判，後列入考察費用執行情形表"
  research:
    - "取得行政院114年7月3日院授主預彙字第1140101903A號函全文與附件"
    - "確認該表中的「考察」是狹義預算分類或因公出國監督表名"
    - "確認各中央機關對同一填報規則是否採一致口徑"

notes:
  - "本session最重要的區分：預算用途變更 != 將原用途如實列入監督／揭露表。"
  - "文化部案例與內政部案例均反證『事實上無法填』；內政部保留填表說明進一步顯示行政院函的執行附件以完成核銷計畫描述填報範疇。"
  - "行政院1140101903A號函的原函完整本文與全部附件仍未取得；在刑事責任判斷前仍應追取。"
  - "刑事責任目前不得先下結論。"
