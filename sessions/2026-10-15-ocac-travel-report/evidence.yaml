facts:
  - id: F001
    statement: "僑委會沒有編列「考察」類出國預算並非現政府才出現；至少103年度（2014）預算彙總表即顯示考察為0，另有視察、訪問、開會與進修。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S005]
    evidence_summary: "僑委會103年度官方預算彙總表直接列示各類別。"
    tags: [僑委會, 出國預算, 歷史比較]

  - id: F002
    statement: "國立臺灣博物館 ICOM 2025 Dubai 暨 ICOM NATHIST 理事會及年會，在114年度正式單位預算中列於「派員出國計畫預算類別表－開會、談判」之「定期會議」，不是「考察」類。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S002]
    evidence_summary: "正式預算文件的分類表直接支持。"
    tags: [臺博館, ICOM, 開會談判, 預算分類]

  - id: F003
    statement: "同一 ICOM 計畫在114年度預算案階段原列350千元，經審議後正式單位預算為140千元。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S002, S003]
    evidence_summary: "預算案與正式預算的數字不同；140千元才是正式預算。"
    tags: [臺博館, ICOM, 預算案, 正式預算]

  - id: F004
    statement: "文化部114年12月《因公派員出國計畫考察費用執行情形表》將上述原編「開會、談判」的 ICOM 計畫列入，並在「考察目的」欄如實寫「開會、學術發表」。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S002, S004]
    evidence_summary: "同一計畫在正式預算與後續執行情形表中可互相對照。"
    tags: [文化部, 臺博館, ICOM, 考察費用表]

  - id: F005
    statement: "文化部該執行情形表對 ICOM 計畫列示預算數140千元、執行數140千元，與正式預算140千元一致。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S002, S004]
    evidence_summary: "正式預算與執行情形表數額可直接對照。"
    tags: [文化部, 臺博館, 預算執行]

  - id: F006
    statement: "因此，至少在文化部公開行政實務中，將一筆原預算分類為「開會、談判」的案件列入名稱含「考察費用」的執行情形表，並沒有伴隨把該案用途改寫為「考察」。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S002, S004]
    evidence_summary: "原分類仍為開會、談判；表內目的仍記載開會、學術發表。"
    tags: [行政實務, 資訊揭露, 預算分類]

  - id: F007
    statement: "林楚茵於2026-10-15公開主張，僑委會未編考察預算，因此「機關自然無法填報」，並稱把視察冠上考察名義恐涉及違法挪用預算。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S001]
    evidence_summary: "立法院網站刊載其本人新聞稿。"
    tags: [林楚茵, 公開主張, 僑委會]

  - id: F008
    statement: "僑委會114年第4季《因公派員出國計畫考察費用執行情形表》實際填列「無」，並註明依行政院114年7月3日院授主預彙字第1140101903A號函辦理。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S006]
    evidence_summary: "僑委會官方表格可直接確認。"
    tags: [僑委會, 填報, 行政院函]

  - id: F009
    statement: "內政部建築研究所公開的同款執行情形表保留填表說明；該說明引用行政院1140101903A號函，並以「當月完成核銷之計畫」描述本表範疇，公開文字未以「原預算分類必須是考察」作為表內唯一範圍。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S007]
    evidence_summary: "官方PDF第5頁保留原應於公開前刪除的填表說明，可直接讀到函號與填報範疇文字。"
    tags: [內政部, 填表說明, 行政院函, 填報範圍]

  - id: F010
    statement: "內政部建築研究所同一份《因公派員出國計畫考察費用執行情形表》實際列入名稱為參加ACI 2025春季會議、2025世界建築大會等會議型出國計畫。"
    status: verified
    observed_at: "2026-10-15"
    source_ids: [S007]
    evidence_summary: "表內計畫名稱直接顯示參加國際會議的案件被填入該表。"
    tags: [內政部, 國際會議, 考察費用表, 行政實務]

claims:
  - id: C001
    statement: "「沒有考察預算，所以行政機關在事實上無法把其他出國類別填入《因公派員出國計畫考察費用執行情形表》。」"
    status: contradicted
    contradicts: [F004, F006]
    reasoning_notes: "文化部官方文件存在原編「開會、談判」而後列入該表的直接反例。"

  - id: C002
    statement: "「沒有考察預算，所以依法不能把開會、訪問或視察案件填入該表；否則即屬違法變更預算名目或挪用預算。」"
    status: unresolved
    related_facts: [F002, F004, F006, F007, F008, F009, F010]
    reasoning_notes: "文化部與內政部的官方實務均顯示會議型案件可被列入該表；內政部保留的填表說明又以『當月完成核銷之計畫』描述範疇。這已明顯削弱『自然無法填報』的說法，但刑事或最終法律判斷仍應取得行政院1140101903A號原函完整本文及附件後確認。"

  - id: C003
    statement: "「文化部把 ICOM 開會案列入該表，就代表文化部違法挪用預算。」"
    status: unsupported
    related_facts: [F002, F004, F005, F006]
    reasoning_notes: "現有文件只顯示資訊揭露表收錄該案，且目的仍寫開會、學術發表；沒有證據顯示140千元被改作另一個考察計畫。"

  - id: C004
    statement: "「僑委會填『無』已可直接認定構成刑法第213條公務員登載不實。」"
    status: unresolved
    related_facts: [F008]
    reasoning_notes: "必須先確認1140101903A號函究竟要求填哪些案件，並進一步確認客觀不實、職務上登載、主觀明知及足生損害等構成要件。現階段證據不足以作刑事定性。"

