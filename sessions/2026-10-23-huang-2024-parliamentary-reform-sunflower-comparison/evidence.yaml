sources:
  - id: S001
    source_type: commentary
    publisher: "Threads / @qweer74418"
    title: "以2024國會職權修法『違憲擴權』類比2014太陽花30秒服貿的留言"
    url: "https://www.threads.com/@qweer74418/post/DeyO5FUHaZL"
    published_at: "2026-10-22"
    observed_at: "2026-10-23T01:55:00+08:00"
    retrieval_status: reachable
    notes:
      - "留言核心主張為：太陽花重點在『30秒沒有溝通的通過』，黃國昌2024國會改革違憲擴權，等同太陽花翻版。"
      - "此留言是待查 claim source，不作事實 authority。"

  - id: S002
    source_type: primary
    publisher: "憲法法庭"
    title: "113年憲判字第9號判決"
    url: "https://cons.judicial.gov.tw/docdata.aspx?fid=52&id=352966"
    published_at: "2024-10-25"
    observed_at: "2026-10-23T01:55:00+08:00"
    retrieval_status: reachable
    notes:
      - "判決主文認定系爭修法之立法程序『雖存有瑕疵』，但整體尚難謂已完全悖離憲法公開透明與討論原則，故法律不因程序瑕疵而違憲失效。"
      - "判決理由第70至73段記錄：委員會曾聽取提案與機關報告、詢答並召開公聽會；二讀形式上有廣泛討論與逐條討論，但實質討論時間極其有限、議場常處混亂，且部分表決方式違反議事規則。"
      - "判決另就總統國情報告、質詢、調查權、聽證與刑事處罰等多項實體規定宣告違憲、失效或作限縮合憲解釋。"

  - id: S003
    source_type: primary
    publisher: "憲法法庭"
    title: "113年憲判字第9號判決摘要"
    url: "https://cons.judicial.gov.tw/docdata.aspx?fid=77&id=354002"
    published_at: "2024-10-25"
    observed_at: "2026-10-23T01:55:00+08:00"
    retrieval_status: reachable
    notes:
      - "官方摘要明示：立法過程實質討論時間極其有限、議場常處混亂，程序實難謂無瑕疵；但主要議題曾於委員會由相關機關表示意見並召開公聽會，因此不屬完全欠缺公開透明。"
      - "摘要亦整理多項實體條文違憲或失效的結論。"

