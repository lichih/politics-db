facts:
  - id: F001
    statement: "2024年國會職權修法並非完全未經委員會、機關報告或公聽會；相關提案曾進入司法及法制委員會，相關機關曾說明答詢，且至少召開多場公聽會。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S002, S004, S005, S007]
    evidence_summary: "憲法法庭判決、立法院審查報告與iVOD均直接記錄相關程序。"
    verification_notes:
      - "這不等於程序品質充分，也不等於最後院會處理沒有問題。"
    tags: ["2024", "國會改革", "委員會", "公聽會", "程序"]

  - id: F002
    statement: "憲法法庭認定2024國會職權修法的實質討論時間極其有限、二讀期間議場常處混亂，且表決方式存在議事規則上的瑕疵。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "113年憲判字第9號理由第70至73段與官方摘要明確如此認定。"
    verification_notes:
      - "因此『程序完全沒有問題』同樣不符合官方判決。"
    tags: ["程序瑕疵", "實質討論", "二讀", "表決"]

  - id: F003
    statement: "憲法法庭最終判定2024國會職權修法整體立法程序雖有瑕疵，但尚未嚴重到完全悖離憲法公開透明與討論原則，因此法律不因立法程序本身而違憲失效。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "此為113年憲判字第9號主文第一項的直接法律結論。"
    verification_notes:
      - "法院同時保留政治問責空間，明示程序是否符合民意期待仍可由人民評價。"
    tags: ["憲法法庭", "程序違憲", "公開透明", "討論原則"]

  - id: F004
    statement: "2024國會職權修法雖未因整體立法程序被宣告違憲，但多項實體規定被憲法法庭宣告違憲、失效，或必須依判決作限縮解釋才合憲。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "113年憲判字第9號分別處理總統國情報告、質詢、調查權、聽證等規定；例如部分強制總統義務、調查專案小組權限、要求人民提供證言資料及部分裁罰規定均遭判違憲或失效。"
    verification_notes:
      - "因此『違憲擴權』若指部分具體條文逾越憲法權限，有相當事實基礎；若指整部修法或整個程序均已被判違憲，則不精確。"
    tags: ["實體違憲", "權力分立", "調查權", "聽證", "國情報告"]

  - id: F005
    statement: "2014年3月17日服貿事件的直接程序爭議，是召委張慶忠在委員會混亂中以極短時間宣告服貿『視為已審查』並送院會存查；該宣告甚至未出現在當時立法院議事公報初稿。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S008, S009, S010]
    evidence_summary: "中央社同時期報導與十週年回顧相互印證2014事件核心程序事實。"
    verification_notes:
      - "常見『30秒通過服貿』是政治與媒體簡稱；更精確的程序描述是宣告視為已審查、送院會存查，並非當場完成整個協議最終三讀。"
    tags: ["2014", "張慶忠", "30秒", "服貿", "太陽花"]

  - id: F006
    statement: "黃國昌在2024年國會改革排審初期曾反對以重新召開公聽會為由延後審查，之後在已舉行3次公聽會的情況下，又主張4月15日當天務必完成委員會階段並送出委員會。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S006, S007]
    evidence_summary: "中央社 contemporaneous reports 記錄黃國昌兩個時間點的公開程序主張。"
    verification_notes:
      - "這可用來評價他對重大法案程序充分性的標準，但不能單獨證明他主觀上追求黑箱或故意排除討論。"
    tags: ["黃國昌", "公聽會", "程序標準", "2024"]

  - id: F007
    statement: "2024年民眾黨黨團原始國會改革草案由黃國昌列名提案，且原案第15條之4已要求總統於國情報告後對立委問題『依序即時答復』；該類強制總統答復設計後來在最終第15條之4被憲法法庭認定逾越立法院憲法職權。"
    status: verified
    observed_at: "2026-10-23T01:30:00+08:00"
    source_ids: [S002, S011, S012, S013]
    evidence_summary: "原始民眾黨草案、最終院會決議與113年憲判字第9號可串接此制度概念的來源與最終法律結論。"
    verification_notes:
      - "最終第15條之4是國民黨與民眾黨共同再修正動議，而非原始民眾黨版本逐字原封不動通過；但『立委提問、總統負答復義務』這一核心設計已存在於民眾黨/黃國昌原案。"
    tags: ["黃國昌", "民眾黨", "第15條之4", "國情報告", "違憲歸責"]

  - id: F008
    statement: "2024年民眾黨黨團原始草案第45條即允許委員會決議成立聽證調閱專案小組，並賦予其調查/調閱相關功能；最終第45條亦由國民黨與民眾黨共同再修正動議通過，其中『委員會得設調查專案小組』部分後被憲法法庭宣告違憲。"
    status: verified
    observed_at: "2026-10-23T01:30:00+08:00"
    source_ids: [S002, S012, S013]
    evidence_summary: "民眾黨原案已具有委員會層級專案小組設計；最終共同再修正文本延續同類制度，憲法法庭認定此部分違反立法院調查權應由立法院自為行使的憲法要求。"
    verification_notes:
      - "原案名稱為『聽證調閱專案小組』、最終法為『調查專案小組』，非逐字同一文本；可做制度概念來源連結，不宜寫成完全相同條文。"
    tags: ["黃國昌", "民眾黨", "第45條", "調查專案小組", "違憲歸責"]

  - id: F009
    statement: "民眾黨黨團原始草案第50條之2已規定受調查/備詢者攜同律師或專業人員須『經主席同意』；最終第50條之2由國民黨與民眾黨共同再修正動議通過，憲法法庭後來明確認定『經主席同意』部分違憲。"
    status: verified
    observed_at: "2026-10-23T01:30:00+08:00"
    source_ids: [S002, S012, S014]
    evidence_summary: "原始民眾黨草案與最終條文在『經主席同意』這一核心限制上高度一致；法院明示接受調查詢問者攜同律師/專業人員無須主席同意。"
    verification_notes:
      - "這是目前最直接、文本連續性最強的一條『黃國昌列名原案→藍白共同再修正→違憲』證據鏈。"
    tags: ["黃國昌", "民眾黨", "第50條之2", "律師陪同", "違憲歸責"]

  - id: F010
