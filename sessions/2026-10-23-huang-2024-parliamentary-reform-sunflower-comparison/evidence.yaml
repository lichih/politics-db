notes:
  - "本案刻意把『程序是否合法/品質如何』與『法條內容是否違憲』分開；113年憲判字第9號的結論正是兩者不對稱：程序有瑕疵但未整體違憲，多項實體規範則被宣告違憲或限縮。"
  - "對太陽花類比，最安全的結論不是『完全一樣』或『完全不同』：兩者皆有程序品質爭議，但2014的直接導火線是委員會極短宣告視為已審查；2024則已有委員會、公聽會與形式討論，只是後段實質討論非常有限。"
  - "本輪已完成第一層歸責：民眾黨/黃國昌列名原案本身即有至少三個後來遭違憲判斷打中的核心設計；最終多項相關條文也由藍白共同再修正動議通過。"
  - "下一輪若要再細，可逐條建立『原始民眾黨案→藍白共同再修正→最終條文→憲法判決』diff，並區分黃國昌個人起草、列名提案、黨團共同責任三種不同歸責層級。"
