  - id: S012
    source_type: primary
    publisher: "立法院議事暨公報資訊網"
    title: "台灣民眾黨黨團《立法院職權行使法部分條文修正草案》關係文書"
    url: "https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/01/LCEWA01_110101_00013.pdf"
    published_at: "2024-02"
    observed_at: "2026-10-23T01:30:00+08:00"
    retrieval_status: reachable
    notes:
      - "第15條之4原始草案要求總統於國情報告後就立委問題『依序即時答復』。"
      - "第25條原始草案要求行政首長以國防、外交或依法應秘密為由拒答時須『經主席同意』，並不得隱匿資訊或為虛偽答復。"
      - "第45條原始草案允許院會設聽證調閱委員會、委員會另設聽證調閱專案小組，並可要求政府機關、法人、人民團體及社會上有關係人員到會備詢、提供資料。"
      - "第50條之1原始草案對應邀人員設定出席義務；第50條之2明定攜同律師或專業人員須『經主席同意』。"

