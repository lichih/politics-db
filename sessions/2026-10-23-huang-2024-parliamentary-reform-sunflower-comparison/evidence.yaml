facts:
  - id: F001
    statement: "2024年國會職權修法並非完全未經委員會、機關報告或公聽會；相關提案曾進入司法及法制委員會，相關機關曾說明答詢，且至少召開多場公聽會。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S002, S004, S005, S007]
    evidence_summary: "憲法法庭判決、立法院審查報告與iVOD均直接記錄相關程序。"
    verification_notes:
      - "這不等於程序品質充分，也不等於最後院會處理沒有問題。"
    tags: ["2024", "國會改革", "委員會", "公聽會", "程序"]

  - id: F002
    statement: "憲法法庭認定2024國會職權修法的實質討論時間極其有限、二讀期間議場常處混亂，且表決方式存在議事規則上的瑕疵。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "113年憲判字第9號理由第70至73段與官方摘要明確如此認定。"
    verification_notes:
      - "因此『程序完全沒有問題』同樣不符合官方判決。"
    tags: ["程序瑕疵", "實質討論", "二讀", "表決"]

  - id: F003
    statement: "憲法法庭最終判定2024國會職權修法整體立法程序雖有瑕疵，但尚未嚴重到完全悖離憲法公開透明與討論原則，因此法律不因立法程序本身而違憲失效。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "此為113年憲判字第9號主文第一項的直接法律結論。"
    verification_notes:
      - "法院同時保留政治問責空間，明示程序是否符合民意期待仍可由人民評價。"
    tags: ["憲法法庭", "程序違憲", "公開透明", "討論原則"]

  - id: F004
    statement: "2024國會職權修法雖未因整體立法程序被宣告違憲，但多項實體規定被憲法法庭宣告違憲、失效，或必須依判決作限縮解釋才合憲。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "113年憲判字第9號分別處理總統國情報告、質詢、調查權、聽證等規定；例如部分強制總統義務、調查專案小組權限、要求人民提供證言資料及部分裁罰規定均遭判違憲或失效。"
    verification_notes:
      - "因此『違憲擴權』若指部分具體條文逾越憲法權限，有相當事實基礎；若指整部修法或整個程序均已被判違憲，則不精確。"
    tags: ["實體違憲", "權力分立", "調查權", "聽證", "國情報告"]

  - id: F005
    statement: "2014年3月17日服貿事件的直接程序爭議，是召委張慶忠在委員會混亂中以極短時間宣告服貿『視為已審查』並送院會存查；該宣告甚至未出現在當時立法院議事公報初稿。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S008, S009, S010]
    evidence_summary: "中央社同時期報導與十週年回顧相互印證2014事件核心程序事實。"
    verification_notes:
      - "常見『30秒通過服貿』是政治與媒體簡稱；更精確的程序描述是宣告視為已審查、送院會存查，並非當場完成整個協議最終三讀。"
    tags: ["2014", "張慶忠", "30秒", "服貿", "太陽花"]

  - id: F006
    statement: "黃國昌在2024年國會改革排審初期曾反對以重新召開公聽會為由延後審查，之後在已舉行3次公聽會的情況下，又主張4月15日當天務必完成委員會階段並送出委員會。"
    status: verified
    observed_at: "2026-10-23T01:55:00+08:00"
    source_ids: [S006, S007]
    evidence_summary: "中央社 contemporaneous reports 記錄黃國昌兩個時間點的公開程序主張。"
    verification_notes:
      - "這可用來評價他對重大法案程序充分性的標準，但不能單獨證明他主觀上追求黑箱或故意排除討論。"
    tags: ["黃國昌", "公聽會", "程序標準", "2024"]

claims:
  - id: C001
    statement: "『2024國會職權修法就是2014張慶忠30秒服貿的程序翻版，兩者在公開、審查與討論程序上沒有實質差別。』"
    status: contradicted
    supports: []
    contradicts: [F001, F003, F005]
    related_facts: [F002]
    reasoning_notes: "2024程序確有實質討論極少與表決瑕疵，但存在委員會審查、機關報告、多場公聽會及形式上的二讀廣泛/逐條討論；2014直接導火線則是委員會中約30秒宣告『視為已審查』送院會存查，且正式紀錄亦有爭議。兩者可在『程序品質遭強烈質疑』層次類比，不能說程序事實完全相同。"

  - id: C002
    statement: "『2024國會職權修法的程序完全合法、充分，沒有值得批評的程序問題。』"
    status: contradicted
    supports: []
    contradicts: [F002]
    related_facts: [F001, F003]
    reasoning_notes: "憲法法庭自己認定實質討論時間極其有限、議場混亂且表決方式有瑕疵；只是瑕疵未達整體程序違憲失效門檻。"

  - id: C003
    statement: "『憲法法庭已判2024國會職權修法整部因黑箱程序違憲。』"
    status: contradicted
    supports: []
    contradicts: [F003]
    related_facts: [F002]
    reasoning_notes: "判決主文相反：程序有瑕疵，但整體未完全悖離公開透明與討論原則，不因程序而違憲。"

  - id: C004
    statement: "『2024國會職權修法中完全沒有任何違憲擴張立法院權限的內容。』"
    status: contradicted
    supports: []
    contradicts: [F004]
    related_facts: []
    reasoning_notes: "多項實體規範因逾越立法院憲法職權、違反權力分立等理由被宣告違憲或失效。"

  - id: C005
    statement: "『把黃國昌2024國會職權修法批評為程序品質低落，完全沒有證據基礎。』"
    status: contradicted
    supports: []
    contradicts: [F002, F006]
    related_facts: [F003]
    reasoning_notes: "官方判決承認討論極其有限與議事瑕疵；黃國昌本人亦主張加速送出委員會。因此程序品質可作政治問責，但不能偷換成『法院已判整個程序違憲』。"

  - id: C006
    statement: "『因為2024有部分條文被判違憲，所以可直接推出黃國昌背叛太陽花。』"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F002, F003, F004, F006]
    reasoning_notes: "部分實體違憲可以支持對黃國昌法律判斷、權力邊界或修法品質的批評；『背叛太陽花』仍是需先定義判準的政治評價。若判準是程序民主，應比較2014與2024具體程序；若判準是憲政權力邊界，則應逐條處理被判違憲內容，而非把所有層次合併成一句標籤。"

