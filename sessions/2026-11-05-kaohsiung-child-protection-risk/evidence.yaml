notes:
  - "與 sessions/2026-11-05-shen-child-abuse-claim/evidence.yaml 的統計解讀爭議相關，但高雄行政缺失應獨立核查，不以黨派做先驗結論。"
  - "下一步核對：歷年同定義一般通報件數及分類是否有移轉、每件死亡案是否曾通報及其處理時序、內部績效與責任分工、2024年12人中1例後續重新分類的官方原始文件。"
