promotion:
  cases: []
  comparators: []
  research:
    - proposed: "media-headline-context-omission"

notes:
  - "評論摘要：最高級的誤導不一定需要捏造一句假話；把兩個都是真的材料，用省略關鍵限定語的方式拼成一個自然會被讀成另一種意思的標題，就足以改變讀者第一印象。"
  - "本案最重要的保存價值，是把『標題造成的印象』與『內文實際語境』同時存下，避免未來只剩截圖時把錯誤印象當成蔣萬安原話，也避免因內文可查而忽略標題本身的編輯責任。"
  - "不把『無恥』寫成可驗證事實；它是價值評語。可驗證部分是：必要語境被省略、標題自然造成錯誤連結、同一媒體另有較完整版本可避免誤讀。"
