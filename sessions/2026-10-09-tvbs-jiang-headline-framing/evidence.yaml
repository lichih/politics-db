facts:
  - id: F001
    statement: "TVBS文章頁與官方Facebook標題，均把『民調差距縮至8%』和『台北選民這麼不理性』直接放在同一標題，且沒有在標題中標示後一句是在談大罷免。"
    status: verified
    observed_at: "2026-10-09T16:47:00+08:00"
    source_ids: [S001, S003]
    evidence_summary: "標題的表面語法把最新民調與『選民不理性』相鄰呈現，讀者只看標題時容易形成兩者具直接關聯的理解。"
    excerpt: "TVBS民調差距縮至8%！蔣萬安直言：沒感受過台北選民這麼不理性"
    verification_notes: []
    tags: [標題, 語境省略]

  - id: F002
    statement: "文章內文清楚交代，蔣萬安的『台北選民這麼不理性』是在回顧先前大罷免時期的社會對立，而不是直接把最新49%對41%的民調結果評價為『選民不理性』。"
    status: verified
    observed_at: "2026-10-09T16:47:00+08:00"
    source_ids: [S001]
    evidence_summary: "第一段以『他回顧先前大罷免時期社會對立嚴重』導入該句；後文小標亦明示大罷免語境。"
    excerpt: "他回顧先前大罷免時期社會對立嚴重"
    verification_notes:
      - "不能據此主張蔣萬安是在罵本次民調中支持沈伯洋的選民；那不是內文所呈現的語境。"
    tags: [大罷免, 語境]

  - id: F003
    statement: "TVBS自己的即時政治列表對同一篇新聞補上『蔣萬安談大罷免』，形成比文章頁與Facebook貼文更完整、較不易誤讀的標題。"
    status: verified
    observed_at: "2026-10-09T16:47:00+08:00"
    source_ids: [S002]
    evidence_summary: "同一媒體、同一新聞，在列表版本即可用少量文字補足必要語境，顯示『大罷免』並非無法放入標題的次要資訊。"
    excerpt: "蔣萬安談大罷免：沒感受過台北選民這麼不理性"
    verification_notes: []
    tags: [標題修正, 語境]

  - id: F004
    statement: "TVBS同日上午已有另一篇報導單獨呈現民調縮小到8%的內容，顯示最新民調本身可獨立成為新聞主題，不需要與『選民不理性』的舊事件語境合併才具有新聞性。"
    status: verified
    observed_at: "2026-10-09T16:47:00+08:00"
    source_ids: [S004]
    evidence_summary: "此點不能證明編輯主觀惡意，但能說明兩個材料在編輯上原本就是可分離的新聞元素。"
    excerpt: ""
    verification_notes: []
    tags: [編輯選擇]

claims:
  - id: C001
    statement: "從TVBS這個標題，可以合理理解成蔣萬安因民調被追到只差8%而批評台北選民不理性。"
    status: supported
    supports: [F001]
    contradicts: [F002]
    related_facts: [F003]
    reasoning_notes: "此處的『supported』指標題確實會產生這種自然閱讀效果，不代表這是蔣萬安原話的真實語境。完整內文反而否定把這個理解當成蔣的實際陳述。"

  - id: C002
    statement: "蔣萬安是在針對最新民調中支持沈伯洋的台北選民說『不理性』。"
    status: contradicted
    supports: []
    contradicts: [F002]
    related_facts: [F001]
    reasoning_notes: "內文把該句明確放在回顧大罷免社會對立的脈絡；不能把標題造成的印象反過來當作蔣萬安真正說話的上下文。"

  - id: C003
    statement: "TVBS此標題具有明顯的誤導性編輯效果：每個素材都是真的，但刪除『大罷免』限定後，把兩個不同語境的真實資訊拼成容易形成錯誤因果／對象連結的句子。"
    status: supported
    supports: [F001, F002, F003, F004]
    contradicts: []
    related_facts: []
    reasoning_notes: "這是對可觀察文本結構與讀者自然解讀的評論，不主張已證明編輯者主觀故意造假。核心問題不是捏造引言，而是選擇性省略必要語境，使標題產生與內文不同的第一印象。"

  - id: C004
    statement: "因為TVBS在即時列表能補上『談大罷免』，所以文章頁／Facebook版本省略該限定可批評為一個可避免、且對敘事方向有重大影響的編輯選擇。"
    status: supported
    supports: [F001, F003]
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "不需猜測編輯動機即可成立：同一媒體已示範只增加五字左右即可大幅降低誤讀。"

