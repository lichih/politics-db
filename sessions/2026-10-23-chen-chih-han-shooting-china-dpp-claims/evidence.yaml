notes:
  - "本案核心應拆成三條彼此不能互相代替的證據鏈：① 2020館長槍擊的實際犯罪鏈（寶和會→施俊吉→劉丞浩）；② 陳明文辦公室與部分寶和會槍手增見的行政／政治關係；③ 2026黃逸豪案引發的中國跨境鎮壓類比。"
  - "對Facebook原貼最精確的判定是：『陳明文辦公室曾協助寶和會槍手增見』有事實基礎；『法院認證不起訴』的程序描述錯誤；『因此證明民進黨與寶和會為關係政黨、甚至民進黨策動館長槍擊』超出證據。"
  - "對反方『館長就是中共跨境鎮壓』同樣不能提前定性：黃逸豪案證明這種操作模式現實存在，足以使假說值得查，但館長案目前公開證據仍缺上游委託人連結。"
  - "北監接見爭議不能扁平化成『合法所以沒問題』或『有違失所以全部違法』：監察院文件同時留下行政失當／廉政程序違失、記過處分，以及刑事貪污查無事證與核准接見案件尚屬適法等不同層次結論。"
