sources:
- id: S001
  source_type: primary
  publisher: 司法院裁判書系統／臺灣臺中地方法院
  title: 臺灣臺中地方法院114年度管字第1號民事裁定
  url: https://judgment.judicial.gov.tw/FJUD/printData.aspx?id=TCDV%2C114%2C%E7%AE%A1%2C1%2C20260611%2C2
  published_at: '2026-06-11'
  observed_at: '2026-10-20T11:49:45+08:00'
  retrieval_status: reachable
  notes:
  - 法院裁定吳乃仁准予管收。
  - 裁定記載截至2025-04-30，台糖僅受償39,763,909元，尚未受償173,977,653元；吳乃仁個人遭執行約7,500,499元。
  - 法院認定吳乃仁未依命令據實報告財產、未提供擔保或遵期履行，且已有多次執行不足清償之情形，管收聲請有理由。
- id: S002
  source_type: primary
  publisher: 立法院議事暨公報資訊網／經濟部書面答復
  title: 對黃國昌委員「台糖前董事長吳乃仁賤賣土地弊案強制執行」口頭質詢之答復
  url: https://ppg.ly.gov.tw/ppg/SittingAttachment/download/2025010279/00112520506100422009.pdf
  observed_at: '2026-10-20T11:49:45+08:00'
  retrieval_status: reachable
  notes:
  - 記載最高法院於2020-02-27駁回上訴，民事損害賠償確定；台糖2020-04-28取得判決確定證明。
  - 吳乃仁等4人應賠117,969,922元及自2010-06-16起按年息5%計算利息，其中一人給付範圍內其他人免為給付。
  - 截至2024-12-31共受償39,730,557元，尚未受償171,985,179元，其中未償利息48,739,108元。
  - 文件並列2020年後至2024年間多次強制執行與受償歷程。
- id: S003
  source_type: primary
  publisher: 台灣糖業股份有限公司
  title: 債務人承諾7/20前提協商，當庭合議先撤管收聲請
  url: https://www.taisugar.com.tw/CSR/News_detail.aspx?n=11085&p=1&s=14978
  published_at: '2026-07-01'
  observed_at: '2026-10-20T11:49:45+08:00'
  retrieval_status: reachable
  notes:
  - 台糖確認2026-06-22臺中高分院抗告庭中，代理人撤回管收聲請。
  - 台糖說明理由是認為促使債務人出面協商之目的已達；吳方律師承諾最遲7/20前提出協商或清償計畫。
  - 台糖當時表示，如債務人未出面進行協商，將再向法院聲請管收。
- id: S004
  source_type: secondary
  publisher: 中央社
  title: 台糖8月下旬協商吳乃仁案 若無合理還款方案再聲請管收
  url: https://www.cna.com.tw/news/afe/202608100086.aspx
  published_at: '2026-08-10'
  observed_at: '2026-10-20T11:49:45+08:00'
  retrieval_status: reachable
  notes:
  - 台糖副總經理蕭基淵在立法院表示，7月16日第一次協商中吳方提出的還款方案未獲台糖接受。
  - 對「每月還5萬元」說法，蕭基淵表示與實際情況「不大相符」，因協商未結束不便公開細節。
  - 蕭基淵表示預計8月下旬再次協商，若仍無法提出合理還款計畫，台糖會再次聲請管收。
  - 他並表示6/22代表台糖出庭的訴訟代理人為獨立董事湯瑞科，由公司授權代理訴訟，並在法庭上作出撤回管收決定。
- id: S005
  source_type: commentary
  publisher: 立法院全球資訊網／王鴻薇委員新聞稿
  title: 台糖、吳乃仁尚未達成協議…王鴻薇：龔明鑫交代清楚 否則再申請管收
  url: https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=47012&pid=265976
  published_at: '2026-09-30'
  observed_at: '2026-10-20T11:49:45+08:00'
  retrieval_status: reachable
  notes:
  - 王鴻薇稱經濟部向其確認，截至當時台糖與吳乃仁尚未達成協議。
  - 此來源可直接證明王鴻薇公開作此主張；因本次未取得經濟部原始回函，不把「經濟部已確認」本身升格為primary fact。
- id: S006
  source_type: secondary
  publisher: 聯合報
  title: 吳乃仁欠債協商又破局 藍促管收「抓回去關」
  url: https://udn.com/news/story/6656/9784479
