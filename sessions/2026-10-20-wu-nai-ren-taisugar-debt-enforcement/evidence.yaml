  - 報導稱8月下旬第二次協商仍未達成協議。
  - 報導引述消息人士稱台糖於8/20台中地院訊問庭提請法院調查4名債務人財產，並提供資料等待法院調查後續強制執行。
  - 報導另稱9月董事會未討論還款方案，原因為第二次協商內容未通過董事會審計委員會；此部分同樣屬消息人士說法，尚缺primary source。
