facts:
- id: F001
  statement: 吳乃仁等4人對台糖的民事賠償責任於2020-02-27最高法院駁回上訴後確定，執行名義本金為117,969,922元，並自2010-06-16起按年息5%計算利息。
  status: verified
  observed_at: '2026-10-20T11:49:45+08:00'
  source_ids: [S002, S001]
  evidence_summary: 經濟部書面答復與2026管收裁定均記載同一執行名義與確定時間線。
  tags: [民事確定, 執行名義, 利息]
- id: F002
  statement: 台糖在民事責任確定後持續進行強制執行；截至2024-12-31，4名債務人合計受償39,730,557元，尚未受償171,985,179元，其中未償利息48,739,108元。
  status: verified
  observed_at: '2026-10-20T11:49:45+08:00'
  source_ids: [S002]
  evidence_summary: 立法院公開的經濟部書面答復提供受償總額、未償金額與多次執行歷程。
  tags: [強制執行, 受償, 未償債權]
- id: F003
  statement: 2026-06-11台中地院裁定吳乃仁准予管收，理由包含其未依命令據實報告財產、未提供擔保或遵期履行，且既有財產執行不足清償債權。
  status: verified
  observed_at: '2026-10-20T11:49:45+08:00'
  source_ids: [S001]
  evidence_summary: 管收要件與法院認定由裁判書primary source直接確認。
  tags: [管收, 強制執行法, 財產報告]
- id: F004
  statement: 2026-06-22吳乃仁抗告庭中，台糖代理人撤回管收聲請；台糖事後官方說明顯示，撤回當時尚未有已達成的清償協議，而是基於吳方律師承諾將在7/20前提出協商或清償計畫。
  status: verified
  observed_at: '2026-10-20T11:49:45+08:00'
  source_ids: [S003]
  evidence_summary: 台糖自己的公開說明足以確認「先撤回、後提出計畫／協商」的順序。
  tags: [撤回管收, 協商, 時間順序]
- id: F005
  statement: 台糖副總經理2026-08-10在立法院表示，7/16第一次協商中吳方提出的方案未獲台糖接受；對「每月5萬元」說法則表示與實際情況不大相符。
  status: verified
  observed_at: '2026-10-20T11:49:45+08:00'
  source_ids: [S004]
  evidence_summary: 可證明第一次協商未達成共識，也可證明「月還5萬」不能作為已確認方案使用。
  tags: [第一次協商, 5萬元, 未達共識]
- id: F006
  statement: 台糖副總經理2026-08-10表示，預計8月下旬再協商；如果對方仍無法提出合理還款計畫，台糖會再次聲請管收。
  status: verified
  observed_at: '2026-10-20T11:49:45+08:00'
  source_ids: [S004]
  evidence_summary: 此為台糖對後續處理門檻的公開陳述。
  tags: [再次管收, 公開承諾, 第二次協商]
- id: F007
  statement: 2026-09-30王鴻薇公開稱經濟部向其確認，台糖與吳乃仁截至當時仍未達成協議。
  status: partial
  observed_at: '2026-10-20T11:49:45+08:00'
  source_ids: [S005, S006]
  evidence_summary: 立委新聞稿與媒體均報導相同狀態，但本次未取得經濟部原始回函，故只確認公開主張與一致報導，不把內容升格為primary confirmation。
  tags: [第二次協商, 未達協議, secondary-confirmation]
- id: F008
  statement: 2026-09-30聯合報引述消息人士稱，台糖曾於8/20台中地院訊問庭請法院調查吳乃仁等4名債務人財產，並等待調查結果後續強制執行。
  status: partial
  observed_at: '2026-10-20T11:49:45+08:00'
  source_ids: [S006]
  evidence_summary: 此資料反駁「撤回管收後台糖完全沒有任何執行行動」的過度表述，但目前缺法院或台糖primary source確認8/20具體程序與內容。
  verification_notes:
  - 不得據此推論已再次聲請管收。
  tags: [財產調查, 強制執行, secondary]

claims:
- id: C001
  statement: 吳乃仁已確定提出「每月只還5萬元」的正式清償方案。
  status: unsupported
  supports: []
  contradicts: [F005]
  related_facts: []
  reasoning_notes: 「每月5萬」目前是外界揭露／指控；台糖公開表示與實際情況不大相符且拒絕揭露協商細節，因此不能寫成確定事實。
- id: C002
  statement: 台糖是在已取得可接受的分期清償協議後，才撤回吳乃仁的管收聲請。
  status: contradicted
  supports: []
  contradicts: [F004, F005]
  related_facts: []
  reasoning_notes: 台糖官方說明明確顯示撤回時只有未來提出協商／清償計畫的承諾；之後第一次方案仍未獲台糖接受。
- id: C003
  statement: 台糖撤回管收後即完全停止所有債權強制執行行動。
  status: unresolved
  supports: []
  contradicts: []
  related_facts: [F008]
  reasoning_notes: 9/30 secondary source顯示8/20仍有財產調查與執行程序，但缺primary source，故不能以「完全停止」或「持續積極執行」任一方向定案。
- id: C004
  statement: 截至2026-10-20，台糖已再次向法院聲請管收吳乃仁。
  status: unresolved
  supports: []
  contradicts: []
  related_facts: [F006, F007, F008]
  reasoning_notes: 台糖曾公開表示無合理方案將再次聲請管收，但本次公開查詢未找到新的管收聲請或裁定primary record。not_found不等於未聲請。
- id: C005
  statement: 截至2026-10-20，台糖與吳乃仁已簽署具拘束力的分期清償協議。
  status: unresolved
  supports: []
  contradicts: []
  related_facts: [F007]
  reasoning_notes: 9月底公開資訊仍指向未達成協議；本次未找到10月後官方宣布協議成立的資料，但不能以not_found推論法律上一定未成立。
- id: C006
  statement: 6/22撤回管收決定的公司內部授權、核准層級與事後治理程序已由公開資料完整說明。
  status: unsupported
  supports: []
  contradicts: []
  related_facts: [F004, F006]
  reasoning_notes: 目前只知獨立董事湯瑞科為公司授權訴訟代理人並在庭上作決定；尚未取得特定撤回決策是否另經事前核准、授權邊界、內部紀錄或事後董事會／審計委員會處理資料。

