notes:
- 本案需區分「確定債權與強制執行」、「管收這一特定間接執行手段」及「自願協商／分期」三個層次；撤回管收不等於債權消滅，也不等於全部強制執行停止。
- 可繼續查的核心不是「300年」口號，而是：6/22特定撤回決策的內部授權紀錄；第二次協商方案與審計委員會處理；8/20財產調查程序的primary record；9/30後是否已再聲請管收或取得新受償。
- 「每月5萬元」不得作為authoritative fact；即使做假設計算，也應明示其方案本身未經台糖證實。
