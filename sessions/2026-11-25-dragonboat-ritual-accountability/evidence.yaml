facts:
  - id: F001
    statement: "沈伯洋競選官網將2026年11月15日台北大洋流士林北投場列為正式競選行程。"
    status: verified
    observed_at: "2026-11-25T13:05:56+08:00"
    source_ids: [S001]
    evidence_summary: "官方行程明列日期、地點及車掃／市政開講。"
    excerpt: ""
    verification_notes: []
    tags: [競選造勢, 活動目的]

  - id: F002
    statement: "當次水上應援船隊有參與者邊喊當選口號邊向淡水河撒金紙；領喊前句尚未獨立逐字確認。"
    status: partial
    observed_at: "2026-11-25T13:05:56+08:00"
    source_ids: [S003]
    evidence_summary: "新聞描述現場影片及口號、撒金紙行為；尚未取得完整原始影像與音軌供逐字分析。"
    excerpt: ""
    verification_notes:
      - "不能把推測的『我們的市長』當成已核實現場逐字口號。"
    tags: [現場行為, 口號, 金紙]

  - id: F003
    statement: "社子島田野研究記錄浮洲與浮汐農曆五月初五、初七年度龍舟祭江，涉及祈安、祭祀、追念、獻江與謝江。"
    status: verified
    observed_at: "2026-11-25T13:05:56+08:00"
    source_ids: [S002]
    evidence_summary: "研究者徐碩書面意見，已由市府環評附件公開。"
    excerpt: ""
    verification_notes:
      - "年度祭江存在不能自動證實11月15日競選應援亦為同一儀式。"
      - "不排除另有非端午出航祈安習慣，惟須個案佐證。"
    tags: [民俗, 祭江, 社子島]

  - id: F004
    statement: "張景森於事件後以龍舟祭江與環保金紙說明撒紙行為，並將質疑者指為不懂或不尊重文化。"
    status: verified
    observed_at: "2026-11-25T13:05:56+08:00"
    source_ids: [S004]
    evidence_summary: "11月17日報導引述張景森11月16日公開說法。"
    excerpt: ""
    verification_notes:
      - "此項僅證明公開辯護的內容及功能，不證明作者明知不實。"
    tags: [事後論述, 張景森]

  - id: F005
    statement: "沈伯洋11月17日表示水域保護比傳統習俗更重要，未來辦活動會注意。"
    status: verified
    observed_at: "2026-11-25T13:05:56+08:00"
    source_ids: [S005]
    evidence_summary: "受訪報導直接記載其回應。"
    excerpt: ""
    verification_notes: []
    tags: [沈伯洋, 回應]

  - id: F006
    statement: "環境部長於11月18日主張仍需釐清當次是否符合民俗情境以及清理情形，尊重地方環保局權限。"
    status: verified
    observed_at: "2026-11-25T13:05:56+08:00"
    source_ids: [S006]
    evidence_summary: "受訪新聞記載彭啓明的判準，未見據此已完成裁罰之結果。"
    excerpt: ""
    verification_notes: []
    tags: [行政調查, 環保]

  - id: F007
    statement: "祭江辯護者以蔣萬安參加官方龍舟祭江的先例回應質疑。"
    status: verified
    observed_at: "2026-11-25T13:05:56+08:00"
    source_ids: [S004, S007]
    evidence_summary: "張景森報導及投書援用官方祭江先例。"
    excerpt: ""
    verification_notes:
      - "比較案例有助確認傳統儀式存在，不能直接認定兩場活動的程序、管理條件及情境相同。"
    tags: [比較案例, 論述]

claims:
  - id: C001
    statement: "2026年11月15日撒金紙就是依照該龍舟隊既有出航／謝江習俗進行。"
    status: unresolved
    supports: [F003, F004]
    contradicts: []
    related_facts: [F001, F002]
    reasoning_notes: "既有年度祭江有獨立證據，惟尚缺該船隊非端午日常出航紀錄與當次具體儀式安排；不能直接認為假，也不能當成已獨立證成。"

  - id: C002
    statement: "張景森公開辯護將原有環境及活動責任爭議轉為文化傳統與批評者是否無知的討論。"
    status: supported
    supports: [F004, F007]
    contradicts: []
    related_facts: [F002, F006]
    reasoning_notes: "可由公開論述結構判定其效果；不等於證明發言者明知祭江主張不實。"

  - id: C003
    statement: "宣稱依民俗撒金紙，便無須查明環保影響或行政責任。"
    status: unsupported
    supports: []
    contradicts: [F005, F006]
    related_facts: [F003, F004]
    reasoning_notes: "民俗背景不能直接推導出法定豁免；仍須依當時行為、材質及法規查核。"

