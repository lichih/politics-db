facts:
  - id: F001
    statement: "黃揚明於選前轉貼ETtoday台北市長封關民調，列蔣萬安48.1%、沈伯洋42.0%，蔣領先6.1個百分點。"
    status: partial
    observed_at: "2026-11-16T13:08:17.221+08:00"
    source_ids: [S001, S002]
    evidence_summary: "使用者提供之社群原貼文完整可讀，另有公開民調彙整同列這組數字。已核實『有人發布與轉述該數字』，尚未直接讀到ETtoday本次民調原始全文。"
    excerpt: ""
    verification_notes: ["ETtoday本次正式報告網址、樣本數、加權、是否封閉式會員問卷及公布的抽樣誤差，須直接讀當次原文再定稿。", "社群貼文時間為ambiguous，不用抓取時間冒充發布時間。"]
    tags: ["2026", "民調", "ETtoday", "待核原始方法"]
  - id: F002
    statement: "新台灣國策智庫11月15日公布台北市長民調，沈伯洋46.3%、蔣萬安42.2%，沈領先4.1個百分點。"
    status: verified
    observed_at: "2026-11-16T13:08:17.221+08:00"
    source_ids: [S003]
    evidence_summary: "聯合報可讀報導列明結果、調查期11/10至11/12、市話及1071份樣本。"
    excerpt: ""
    verification_notes: ["本紀錄的verified指發布結果可核，不代表民調預測已獲選舉結果驗證。"]
    tags: ["2026", "民調", "市話"]
  - id: F003
    statement: "信民協會11月16日公布封關民調，沈伯洋48.6%、蔣萬安33.8%，沈領先14.8個百分點。"
    status: verified
    observed_at: "2026-11-16T13:08:17.221+08:00"
    source_ids: [S004]
    evidence_summary: "台視報導列明結果及11/11至13住宅電話750、行動電話322、有效樣本1072之方法。"
    excerpt: ""
    verification_notes: ["該機構另有得票率模型估算，不能將模型推估區間當成支持度題直接結果。"]
    tags: ["2026", "民調", "電話"]
  - id: F004
    statement: "鋒燦傳媒11月16日公布民調，沈伯洋44.7%、蔣萬安43.0%，沈領先1.7個百分點。"
    status: verified
    observed_at: "2026-11-16T13:08:17.221+08:00"
    source_ids: [S005]
    evidence_summary: "公開報導列明調查期11/4至9、混合市話與網路樣本共2026份；差距小於公布抽樣誤差。"
    excerpt: ""
    verification_notes: ["混合調查模式與其他機構抽樣框不同。"]
    tags: ["2026", "民調", "混合模式"]
  - id: F005
    statement: "ETtoday在11月4日公布上一波結果：蔣萬安50.7%、沈伯洋41.9%，與11月16日轉述數字不同。"
    status: verified
    observed_at: "2026-11-16T13:08:17.221+08:00"
    source_ids: [S006, S001]
    evidence_summary: "TVBS轉述11/1至3封閉式網路問卷結果50.7比41.9；黃揚明11/16轉述48.1比42.0。"
    excerpt: ""
    verification_notes: ["跨時間差異不等於同一批受訪者改變立場；11/16本次抽樣方法需核實。"]
    tags: ["2026", "民調", "ETtoday", "跨期"]
  - id: F006
    statement: "11月16日前後不同機構發布的臺北市長民調領先方向不一致：ETtoday轉述蔣領先，新台灣國策智庫、信民協會、鋒燦傳媒則為沈領先。"
    status: verified
    observed_at: "2026-11-16T13:08:17.221+08:00"
    source_ids: [S001, S003, S004, S005]
    evidence_summary: "僅比較各調查公布的點估計和所述領先方向，非聯合抽樣或民調平均。"
    excerpt: ""
    verification_notes: ["各調查執行日期、訪問模式、母體、未表態處理可能不同；不能由領先方向不同直接推出任一家造假。"]
    tags: ["2026", "跨機構比較"]

