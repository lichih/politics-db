    title: "批藍用片段的標籤攻擊 沈伯洋：現在立場「支持死刑」"
    url: "https://udn.com/vote2026/story/124652/9801614"
    published_at: "2026-10-08"
    observed_at: "2026-10-08+08:00"
    retrieval_status: reachable
    notes:
      - "報導沈表示現階段立場支持死刑；長遠希望減少死刑使用。"

  - id: S006
    source_type: commentary
    publisher: "Newtalk 讀者投書"
    title: "真正值得託付的政治人物，不是保證自己不會變"
    url: "https://newtalk.tw/citizen/view/73981"
    published_at: "2026-10-01"
    observed_at: "2026-10-08+08:00"
    retrieval_status: reachable
    notes:
      - "明確以沈伯洋為對象，主張政治人物可能改變，重點應是制度能否限制權力；並肯定沈曾表示若偏離信念，希望大家『用力批評』。"
      - "這不是死刑爭議後的留言，但可作為支持者／友善論述中『改變本身不構成失格』框架的 contemporaneous evidence。"

  - id: S007
    source_type: commentary
    publisher: "民視新聞（轉述翁達瑞臉書）"
    title: "沈伯洋『超扛單挑』趙少康團戰大軍！翁達瑞揭3外掛殺招"
    url: "https://www.ftvnews.com.tw/news/detail/2026A07W0439"
    published_at: "2026-10-07"
    observed_at: "2026-10-08+08:00"
    retrieval_status: reachable
    notes:
      - "翁達瑞在沈上少康戰情室前公開稱，在『是非、學識與品格』三方面沈都佔優勢。"
      - "可作為核心支持者在爭議期間仍以『品格』正面框架沈的例子。"

  - id: S008
    source_type: commentary
    publisher: "Newtalk"
    title: "張宇韶觀點》真正的破圈，是接受不能控制的問題"
    url: "https://newtalk.tw/news/view/2026-10-08/1064350"
    published_at: "2026-10-08"
    observed_at: "2026-10-08+08:00"
    retrieval_status: reachable
    notes:
      - "友善評論把沈上異質媒體、接受不可控制提問，解讀為政治自信與接受外部檢驗。"
      - "文章把焦點轉向『願意讓政策與治理紀錄接受檢驗』，而非直接處理其 2018／2026 對《死刑肯定論》的敘事差異。"

  - id: S009
    source_type: commentary
    publisher: "民視新聞"
    title: "羅智強改打『廢死』 林俊憲酸『造謠天團』：凸顯蔣萬安不了解市政"
    url: "https://sport.ftvnews.com.tw/news/detail/2026A07W0472"
    published_at: "2026-10-07"
    observed_at: "2026-10-08+08:00"
    retrieval_status: reachable
    notes:
      - "民進黨立委林俊憲把藍營追問沈死刑立場定性為『造謠天團』與負面攻擊，並把焦點轉回市政。"
      - "這是一種陣營防衛論述，不等同回答沈自身過去與現在說法是否一致。"

  - id: S010
    source_type: commentary
    publisher: "Facebook 公開社團「爆政公社公開版」"
    title: "吳小甄：懶人包讓大家明白沈伯洋是支持死刑的…"
    url: "https://www.facebook.com/groups/2959541820966585/permalink/4515493608704724/"
    published_at: "2026-10-08"
    observed_at: "2026-10-08+08:00"
    retrieval_status: reachable
    notes:
      - "使用者提供公開貼文內容。貼文把沈伯洋目前『支持死刑但希望慢慢減少』與『支持雙城論壇但前提不能有政治立場』整理為懶人包。"
      - "同一貼文以『從小地方就能知道一個人的品行』及『體味很香很多人稱讚』作為正面人格評價，並搭配 #大罷免是公民團體發起的、#不要都扯沈伯洋。"
      - "此來源屬支持者／友善社群言論，可用來觀察支持者如何把政策立場、人格評價與陣營防衛混合在同一敘事中；不代表整體支持者母體。"

facts:
  - id: F001
    statement: "2018 年沈伯洋在法律扶助基金會《死刑肯定論》講座中，將書名形容為帶有『詐欺』意味，並說書到最後『有點諷刺』、作者『並不是那麼支持死刑』。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S001, S003]
    evidence_summary: "官方講座影片存在，2026 媒體依影片逐字摘錄沈當時對該書的解讀。"
    excerpt: "並不是那麼支持死刑"
    verification_notes:
      - "此處是在記錄沈 2018 對書的公開解讀，不等同判定森炎本人實際立場。"
    tags: [2018, 沈伯洋, 死刑肯定論]

  - id: F002
    statement: "2026-10-07 沈伯洋公開表示，《死刑肯定論》作者在辯證過程中『最後選擇了支持死刑』，並稱『這和我現在的立場比較相近』。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S004, S005]
    evidence_summary: "中央社與聯合報對沈 2026-10-07 受訪內容均有一致報導。"
    excerpt: "最後選擇了支持死刑，這和我現在的立場比較相近"
    verification_notes:
      - "沈另表示長遠希望減少死刑使用，因此其 2026 立場較準確描述為現階段支持保留死刑、長期希望減少使用。"
    tags: [2026, 沈伯洋, 支持死刑]

  - id: F003
    statement: "出版社 2018 年官方書介本身把《死刑肯定論》定位為一位重視司法品質的法官『為什麼仍然支持死刑』，並以『如果支持死刑，請用森炎的方式支持』作為宣傳文案。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S002]
    evidence_summary: "出版社同期資料可作為理解原書定位的 contemporaneous source。"
    excerpt: "如果是，請用森炎的方式支持！"
    verification_notes:
      - "這顯示 2018 沈的『詐欺書名／並不是那麼支持』是他對作品的詮釋，不宜簡化成出版社或作者明確自稱反對死刑。"
    tags: [2018, 出版社, 森炎]

  - id: F004
    statement: "公開可檢索的沈伯洋友善／支持性論述中，至少可見三種護航框架：①政治人物會改變，重點是制度與可被批評；②把沈接受異質媒體檢驗本身視為『品格／政治自信』證據；③把追問其舊立場定性為片段標籤、造謠或負面選戰，並將焦點移回市政。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S006, S007, S008, S009]
    evidence_summary: "這些來源不是抽象推測，而是 2026 選戰期間公開可見的支持／友善論述。它們可以證明存在這些防衛框架，但不能推出所有沈支持者都如此。"
    excerpt: ""
    verification_notes:
      - "目前一般搜尋引擎未找到使用者提到的精確句子『這才是市長該有的品格』；社群留言索引不完整，故不能宣稱已找到該原留言。"
      - "應區分『允許政治人物改變立場』與『替前後矛盾或對過去材料的重新描述辯護』，前者本身並非不合理。"
    tags: [支持者, 護航, 品格, 敘事框架, 問責]

  - id: F005
    statement: "2026-10-08 的一則公開支持性貼文，把沈伯洋現階段死刑與雙城論壇立場整理成『懶人包』，同時加入『從小地方就能知道一個人的品行』與『體味很香很多人稱讚』等人格／親和力讚美，並以『#不要都扯沈伯洋』對外部批評做陣營防衛。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S010]
    evidence_summary: "這是一個具體的支持者話語樣本：政策重述、人格美化、以及對批評的防衛標籤同時出現。"
    excerpt: "尤其他體味很香很多人稱讚"
    verification_notes:
      - "單一貼文不能證明整體支持者皆如此，但可作為『高度人格化／陣營化支持』的具體樣本。"
      - "『體味很香』與市長治理能力沒有可見的邏輯關聯，因此若被當作候選人品行證據，屬於低相關性的人格線索。"
    tags: [支持者, 人格化, 陣營防衛, 死刑, 雙城論壇]

claims:
  - id: C001
    statement: "沈伯洋 2018 與 2026 對《死刑肯定論》作者最終立場的公開描述存在明顯張力：2018 說『並不是那麼支持死刑』、具有諷刺意味；2026 則說作者『最後選擇了支持死刑』。"
    status: supported
    supports: [F001, F002]
    contradicts: []
    related_facts: [F003]
    reasoning_notes: "兩段話並非形式邏輯上的絕對互斥，因為一個人可以批判性／保留地支持死刑；但沈 2026 用該書作為自身現在支持死刑的佐證時，與他 2018 強調其書名具有欺騙性、作者並非那麼支持死刑的說法形成實質的敘事轉向。"

  - id: C002
    statement: "單憑『沈曾參與審定《死刑肯定論》』即可證明沈 2018 當時本人支持死刑。"
    status: contradicted
    supports: []
    contradicts: [F001]
    related_facts: [F003]
    reasoning_notes: "審定一本支持或討論死刑的書，不代表審定者採取同一立場；沈 2018 自己的講座解讀尤其不能用『曾審定』直接推成其當時支持死刑。"

  - id: C003
    statement: "2026 沈目前立場可直接描述為『主張全面廢除死刑』。"
    status: contradicted
    supports: []
    contradicts: [F002]
    related_facts: []
    reasoning_notes: "現有公開說法是現階段支持保留死刑、長期希望減少使用。"

  - id: C004
    statement: "目前公開資料足以支持『沈的部分支持／友善論述會把立場變化、接受挑戰或外部檢驗重新框成品格優點，並把追問舊立場視為負面標籤攻擊』。"
    status: supported
    supports: [F004]
    contradicts: []
    related_facts: [F001, F002]
    reasoning_notes: "這支持的是『存在此種支持者敘事機制』，不是『所有支持者都無條件忠誠』。後者若要成立，需要更廣泛、可代表性的樣本。"

  - id: C005
    statement: "因為支持者稱立場改變是成長／品格，所以可直接推論他們在任何情況下都不會批評沈伯洋。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F004]
    reasoning_notes: "目前只能證明在若干爭議中出現高度彈性的正面重框；若要證明『不可證偽的支持系統』，需持續觀察當出現明確政策失敗、違法或本人承認錯誤時，這些群體是否仍一律合理化。"

  - id: C006
    statement: "至少有部分沈伯洋支持者會把政策立場重述、人格好感與陣營防衛混合在一起，並以與治理能力低相關的個人特徵作為『品行』的正面證據。"
    status: supported
    supports: [F005]
    contradicts: []
    related_facts: [F004]
    reasoning_notes: "這個樣本支持『支持者敘事可能從政策論證滑向人格認同』，但不宜外推為所有支持者。"

