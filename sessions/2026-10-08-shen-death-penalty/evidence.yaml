    title: "沈伯洋2018曾說：死刑肯定論是詐欺書名　讓大家知道死刑是奇怪的事情"
    url: "https://tw.wa01.com/a/chen-bo-yang-2018ceng-shuo-si-xing-ken-ding-lun-shi-zha-qi-shu-ming-rang-da-jia-zhi-dao-si-xing-shi-qi-guai-de-shi-qing.html"
    published_at: "2026-10-07"
    observed_at: "2026-10-08+08:00"
    retrieval_status: reachable
    notes:
      - "報導引用 2018 法扶講座影片內容：沈稱《死刑肯定論》書名『原則上算是一個詐欺』，到最後『有點諷刺』、『並不是那麼支持死刑』。"
      - "沈並稱作者想傳達『死刑的執行是一件那麼奇怪的事情』，用書名吸引支持死刑者翻閱並思考死刑是否該存在。"

  - id: S004
    source_type: secondary
    publisher: "中央社"
    title: "香港人委託全天監控　沈伯洋：應該不只我個人"
    url: "https://www.cna.com.tw/news/aipl/202610070222.aspx"
    published_at: "2026-10-07"
    observed_at: "2026-10-08+08:00"
    retrieval_status: reachable
    notes:
      - "中央社報導沈 2026-10-07 對死刑立場的完整回應。"
      - "沈說《死刑肯定論》作者經支持／廢除的辯證後『最後選擇了支持死刑』，『這和我現在的立場比較相近』。"

  - id: S005
