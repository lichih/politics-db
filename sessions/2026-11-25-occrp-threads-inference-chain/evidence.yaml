    observed_at: "2026-11-25T11:51:14+08:00"
    source_ids: [S002, S003]
    evidence_summary: "同一作者的原貼文與後續更正；其與kinmenwalker、anna9941317屬不同發文者。"
    verification_notes: []
    tags: ["時間線", "更正", "關係圖"]
