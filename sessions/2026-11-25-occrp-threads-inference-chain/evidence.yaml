claims:
  - id: C001
    statement: "黃國昌個人接受索羅斯／OSF資金。"
    status: unsupported
    supports: []
    contradicts: [F002]
    related_facts: [F001, F005]
    reasoning_notes: "有明示指控但所出示理由只證明跨組織資助及合作；目前無個人金流資料。當事人否認不足以獨立完成反向證明，故列unsupported而非contradicted。"
  - id: C002
    statement: "OCCRP與台灣吹哨者保護協會有合作，因此台灣協會或黃國昌必然受OSF金錢資助。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F005]
    reasoning_notes: "合作事實不能推導出資金移轉或個人薪酬。"
  - id: C003
    statement: "同樣資料從暗示性反問在其他公開貼文被升級為直接個人收款指控。"
    status: supported
    supports: [F003, F004, F005]
    contradicts: []
    related_facts: [F001]
    reasoning_notes: "支持的是可見的論述表達與類型變化，不是帳號間抄襲、組織動員或事前串通。"
  - id: C004
    statement: "有組織性地協調散布此類索羅斯／黃國昌收款指控。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F003, F005, F006]
    reasoning_notes: "不同帳號使用相似資料不足以認定有指使、共同管理或協調。"
  - id: C005
    statement: "對台灣民主實驗室有直接受助紀錄的監督，與對黃國昌個人收款的推定，在證據上等價。"
    status: contradicted
    supports: []
    contradicts: [F001, F005, F006]
    related_facts: []
    reasoning_notes: "組織直接受款證據和第三方共同調查證據的性質不同。亦須避免把沈伯洋個人誤寫成該組織實際受款者。"

