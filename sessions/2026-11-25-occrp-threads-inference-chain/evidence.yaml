    verification_notes: []
    tags: ["時間線", "更正", "關係圖"]
  - id: F004
    statement: "pennnnnnny2021先將用詞由『主持』更正為『合作』，再反問OCCRP是否支薪，並否認主張任何個人接受索羅斯資金。"
