facts:
  - id: F001
    statement: "OCCRP於官方公開資料列OSF為資助者；台灣吹哨者保護協會曾參與OCCRP共同調查。"
    status: verified
    observed_at: "2026-11-25T11:56:20+08:00"
    source_ids: [S012, S013]
    evidence_summary: "可分別支持組織資助與跨組織合作兩種不同關係。"
    verification_notes:
      - "僅憑兩項關係不能推出OCCRP付款給台灣協會，更不能推出黃國昌個人收款。"
    tags: ["OCCRP", "OSF", "合作關係"]
  - id: F002
    statement: "黃國昌於2026年11月25日公開否認自己接受索羅斯資金，並稱將提告。"
    status: verified
    observed_at: "2026-11-25T11:28:38+08:00"
    source_ids: [S001]
    evidence_summary: "證明當事人有作該聲明，不直接證明財務事實的全貌。"
    verification_notes: []
    tags: ["當事人聲明", "金流爭議"]
  - id: F003
    statement: "yuhunglintw於11月24日列舉資助及合作關係，11月25日更正質詢日期，但其貼文未明言黃國昌本人接受資金。"
