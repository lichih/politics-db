    tags: ["時間線", "論證轉移"]
  - id: F005
    statement: "anna9941317直接主張黃國昌收索羅斯資金，提供的文字證據僅列出黃國昌相關協會與OCCRP合作、OSF資助OCCRP。"
    status: verified
    observed_at: "2026-11-25T11:54:32+08:00"
    source_ids: [S008, S012, S013]
    evidence_summary: "指控與所附理由之對照；可直接觀察從合作／受資助關係推論個人收款的論證缺口。"
    verification_notes:
      - "此處verified僅表示『該貼文確實提出指控及理由』，不代表黃國昌收款已證實。"
