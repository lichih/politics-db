    source_ids: [S001]
    evidence_summary: "證明當事人有作該聲明，不直接證明財務事實的全貌。"
    verification_notes: []
    tags: ["當事人聲明", "金流爭議"]
  - id: F003
    statement: "yuhunglintw於11月24日列舉資助及合作關係，11月25日更正質詢日期，但其貼文未明言黃國昌本人接受資金。"
