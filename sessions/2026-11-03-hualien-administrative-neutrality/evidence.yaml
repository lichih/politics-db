      - "第9條禁止為支持或反對特定政黨、政治團體或公職候選人而動用行政資源辦理相關活動；行政資源包含人力。"
      - "第14條規定長官不得要求公務人員從事本法禁止之行為。"
      - "第15條規定公務人員不得因拒絕從事本法禁止之行為而遭不公平對待或不利處分。"

facts:
  - id: F001
    statement: "中央社報導，朱家祥在衛生相關群組貼文稱，秘書長室秘書要他動員支持游淑貞，他拒絕後被辭退衛生局長職務，並被要求轉任參議；他拒絕轉任。"
    status: verified
    observed_at: "2026-11-03T20:37:00+08:00"
    source_ids: [S002]
    evidence_summary: "可確認朱家祥公開作出此項指控；此 fact 僅證明他曾如此陳述，不等於底層動員與因果關係已被獨立證實。"
    verification_notes:
      - "應另取得原始群組貼文、通知訊息或在場者證詞，以驗證底層事實。"
    tags: ["朱家祥", "公開指控", "動員輔選"]

  - id: F002
    statement: "朱家祥受訪稱，上週曾在饒忠辦公室與數名局處首長談到各局處舉辦縣政說明會；他詢問候選人是否會到場，並因涉及動員同仁而反對。TVBS報導其說法涉及約100名同仁，且活動後來改為選舉造勢晚會。"
    status: verified
    observed_at: "2026-11-03T20:37:00+08:00"
    source_ids: [S002, S005]
    evidence_summary: "多家媒體均直接引述朱家祥，足以確認他對會議、候選人到場與動員規模作出具體陳述。"
    verification_notes:
      - "會議內容、各局處分配人數與活動性質仍需文件或其他與會者交叉驗證。"
    tags: ["朱家祥", "縣政說明會", "約100人"]

  - id: F003
    statement: "饒忠否認曾要求朱家祥輔選，稱當時只是辦公室聊天、談到各自對選舉的看法，朱家祥可能誤認為被要求支持特定人選；並稱徐榛蔚不知道這些內容。"
    status: verified
    observed_at: "2026-11-03T20:37:00+08:00"
    source_ids: [S002, S004, S005]
    evidence_summary: "中央社、公視與TVBS均報導饒忠公開否認存在要求或施壓。"
    tags: ["饒忠", "否認", "只是聊天"]

  - id: F004
    statement: "2026年11月3日花蓮縣政府舉行一級主管人事布達；朱家祥不再擔任衛生局長。徐榛蔚稱整體屬正常人事調動，並稱朱家祥8年任內表現非常優秀。"
    status: verified
    observed_at: "2026-11-03T20:37:00+08:00"
    source_ids: [S002]
    evidence_summary: "中央社報導縣府當日人事布達及徐榛蔚公開回應。"
    verification_notes:
      - "徐榛蔚未在該報導中具體說明朱家祥人事異動與拒絕動員指控之間是否存在因果關係。"
    tags: ["人事異動", "徐榛蔚"]

  - id: F005
    statement: "游淑貞競選辦公室聲明，對花蓮縣府人事無權干涉且完全不知情，並稱依法行政與行政中立是不可妥協原則。"
    status: verified
    observed_at: "2026-11-03T20:37:00+08:00"
    source_ids: [S003]
    evidence_summary: "中央社直接報導游淑貞競選辦公室的正式回應。"
    tags: ["游淑貞", "競選辦公室", "不知情"]

  - id: F006
    statement: "《公務人員行政中立法》第6條禁止利用職務權力、機會或方法要求他人參加相關選舉活動；第9條禁止為支持或反對特定候選人而動用行政資源辦理相關活動，且行政資源明定包含人力；第14條禁止長官要求公務人員從事本法禁止行為；第15條禁止因拒絕從事本法禁止行為而遭不公平對待或不利處分。"
    status: verified
    observed_at: "2026-11-03T20:37:00+08:00"
    source_ids: [S006]
    evidence_summary: "全國法規資料庫現行條文直接支持上述法律規範內容。"
    tags: ["公務人員行政中立法", "第6條", "第9條", "第14條", "第15條"]

  - id: F007
    statement: "『花蓮縣府高層曾要求局處首長動員公務人員支持游淑貞』目前屬爭議事實：朱家祥提出具體指控，饒忠公開否認曾有要求。"
    status: disputed
    observed_at: "2026-11-03T20:37:00+08:00"
    source_ids: [S002, S004, S005]
    evidence_summary: "公開資訊存在明確相反版本；目前沒有取得會議紀錄、動員通知、群組訊息或其他局處首長證詞足以定案。"
    verification_notes:
      - "優先追查同場局處首長、秘書長室通知、活動名單、人數分配、活動流程與候選人出席安排。"
    tags: ["爭議事實", "行政動員"]

  - id: F008
    statement: "『朱家祥因拒絕動員輔選而遭調離衛生局長職務』目前屬爭議因果：朱家祥明確主張兩者有關；饒忠否認輔選與人事有關，徐榛蔚稱屬正常人事調動。"
    status: disputed
    observed_at: "2026-11-03T20:37:00+08:00"
    source_ids: [S002, S004, S005]
    evidence_summary: "時間上兩件事相近且朱家祥提出直接因果指控，但縣府方面否認或未承認此因果；尚缺人事簽核、決策時間與決策理由等文件。"
    verification_notes:
      - "應追查人事案提出、核定、通知的時間序列，以及有無會議紀錄、簽呈或其他可驗證決策資料。"
    tags: ["爭議因果", "不利處分", "人事調動"]

claims:
  - id: C001
    statement: "目前公開資料已形成值得正式調查的行政中立爭議，但不足以直接認定花蓮縣府已違法。"
    status: supported
    supports: [F001, F002, F003, F004, F006, F007, F008]
    contradicts: []
    related_facts: [F005]
    reasoning_notes: "指控具有人物、會議、動員對象、規模與後續人事變動等具體細節，且與行政中立法第6、9、14、15條可能相關；但關鍵底層事實與因果仍有相反說法。"

  - id: C002
    statement: "若能證實縣府長官要求局處動員公務人員參加支持特定候選人的活動，將直接涉及《公務人員行政中立法》第6、9、14條；若再證實朱家祥因拒絕而遭不利處分，則可能涉及第15條。"
    status: supported
    supports: [F006]
    contradicts: []
    related_facts: [F007, F008]
    reasoning_notes: "此為條件式法律判斷；是否實際構成仍取決於動員要求、活動性質、相關人員法律身分與人事因果等事實。"

  - id: C003
    statement: "目前公開資料不足以支持『游淑貞本人指示、知情或參與縣府動員』。"
    status: supported
    supports: [F005]
    contradicts: []
    related_facts: [F001, F002, F007]
    reasoning_notes: "現有報導集中在朱家祥與縣府高層之間的互動；游淑貞競辦明確否認知情。除非取得新證據，不應把候選人本人指示或串連寫成已知事實。"

  - id: C004
    statement: "『花蓮縣府已確定違反行政中立法』目前尚未被公開證據充分證實。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F006, F007, F008]
    reasoning_notes: "主要待證事實是是否存在實際動員要求，以及朱家祥人事異動是否因其拒絕配合而發生；另需確認相關人員的法定身分與適用條文。"

