  - "文章呈現及其論證有效性需分別裁判；陳方隅指出政府操控證據不足的反擊有效，不代表其他論點自動成立。"
  - "不得因後續未再回覆就定性為逃避；名人是否有義務持續回答亦與論證真偽無關。"
