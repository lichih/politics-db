facts:
  - id: F001
    statement: "11/06美媒已有美國情報備忘錄與黃樂被指接近黃仁勳的報導，11/08 NVIDIA 董事會宣告因外國情報活動報導展開調查，但無理由相信國安或公司秘密已受損。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S001, S002]
    evidence_summary: "確認這些公開報導與董事會聲明的時間及內容，不把匿名情報報導的指控本身升格為經官方認定的間諜事實。"
    tags: ["2026", "情報報導", "NVIDIA", "11月"]
  - id: F002
    statement: "11/09 沈伯洋稱事件是中國經典手法，同時保留是否造成利益侵害待查；范雲主張尊重隱私、證據說話。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S003]
    evidence_summary: "中央社具名記者採訪報導。"
    tags: ["2026", "沈伯洋", "范雲"]
  - id: F003
    statement: "11/09 胡采蘋評論黃仁勳可能早已遭洗腦，將對中政策與私人關係聯結；該說法是推測，未提出可直接證明對中政策因女方而改變的個案資料。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S004]
    evidence_summary: "TVBS引述公開評論；『缺少直接因果個案資料』僅限所引用評論內容。"
    tags: ["2026", "胡采蘋", "媒體評論"]
  - id: F004
    statement: "11/11 民進黨團莊瑞雄要求用證據釐清可能的間諜、洩密與違反管制；黃捷就黃樂入境台灣質詢內政部，劉世芳宣布廢止其證件。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S005, S006]
    evidence_summary: "台灣具名政治發言與本國行政處分，與黃仁勳是否違法的證明是不同命題。"
    tags: ["2026", "莊瑞雄", "黃捷", "劉世芳", "職權"]
  - id: F005
    statement: "11/12 美國司法部長明確表示未就黃樂是否間諜達成結論，FBI持續查核；同日《自由評論網》刊出將她稱作中國女間諜、並以戀愛腦解釋黃仁勳政策的評論。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S008, S009]
    evidence_summary: "路透記錄美國官方當日立場，評論原文記錄作者確定式稱呼與因果推測；兩者並列不是斷言作者已知官方新說法。"
    tags: ["2026", "司法部", "林修民", "證據落差"]
  - id: F006
    statement: "11/16 由商務部與司法部聯合聲明可知美方早自2024年調查Megaspeed潛在出口管制問題，NVIDIA 2025年6月將其列入不銷售名單。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S011]
    evidence_summary: "路透直接引述兩部聯合聲明；公司層級的合規風險有實質官方依據。"
    tags: ["2026", "Megaspeed", "出口管制"]
  - id: F007
    statement: "11/22 紐約時報引述知情人士稱黃樂2025至2026年間與中國國安部官員保持聯繫，屬後來新增的重要情報報導；尚非公開的司法終局判決。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S012]
    evidence_summary: "核實『來源曾報導這個命題』；不是獨立核實秘密情報內容。"
    tags: ["2026", "情報報導", "11月"]
  - id: F008
    statement: "11/23 NVIDIA董事會經考量政府意見決議黃仁勳回任，不認為復職造成國安風險，惟獨立調查繼續；川普宣稱政府已有徹底調查、黃仁勳沒有做錯事。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S013, S014]
    evidence_summary: "確認董事會的特定風險評估與川普政治宣示，兩者皆非完整的司法定讞或情報報告公開。"
    tags: ["2026", "川普", "NVIDIA", "復職"]
  - id: F009
    statement: "11/23 美國商務部將Megaspeed等企業列入出口管制實體清單；這是已採行的商貿行政處分，不能單憑此認定黃仁勳洩密或黃樂間諜身分。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S015]
    evidence_summary: "路透報導美國商務部實際發布的管制措施。"
    tags: ["2026", "Megaspeed", "實體清單"]
  - id: F010
    statement: "11/24沈伯洋說調查尚未結束前不需要深入評論，並說仍要看中國手法、企業影響的最後調查結果；尚未見這段訪談有明確撤回11/09評論。"
    status: verified
    observed_at: "2026-11-24T12:44:02+08:00"
    source_ids: [S003, S016]
    evidence_summary: "依照11/09與11/24兩次具名報導比對；限定為所核對的這兩次公開發言，不推定其他平台從無澄清。"
    tags: ["2026", "沈伯洋", "發言前後"]

claims:
  - id: C001
    statement: "11/09沈伯洋評論時，公開資訊中完全沒有美國情報機構相關資料或合理疑點。"
    status: contradicted
    supports: []
    contradicts: [F001]
    related_facts: [F002]
    reasoning_notes: "11/06-08已有媒體報導不具名消息和NVIDIA啟動調查。需分辨『有風險線索』和『定案』。"
  - id: C002
    statement: "黃樂已被美國司法機關正式確認為中國間諜，且黃仁勳已因私人關係把輝達技術機密交給中國。"
    status: unsupported
    supports: []
    contradicts: [F005]
    related_facts: [F001, F007, F008]
    reasoning_notes: "公開情報報導與司法正式認定不同；黃仁勳是否洩密仍無此項可核對官方結論。"
  - id: C003
    statement: "黃仁勳對中國晶片出口政策是受到黃樂操控、戀愛腦或洗腦造成。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F003, F005]
    reasoning_notes: "因果主張須能區分一般市場動機及具體外部施壓或行為改變，現有評論未提供可直接支撐此強度的個案材料。"
  - id: C004
    statement: "11/23川普說已經調查徹底，代表FBI、司法部與NVIDIA各自全部調查都已正式結案。"
    status: contradicted
    supports: []
    contradicts: [F008]
    related_facts: [F005]
    reasoning_notes: "NVIDIA明示獨立調查還在進行，川普的說法不能冒充司法結案通知。"
  - id: C005
    statement: "11/23 Megaspeed列入實體清單，可直接證明黃仁勳犯罪或中國間諜行動個案已成立。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F006, F009]
    reasoning_notes: "企業出口管制處分有實質依據，但與個人犯意、情報關係是不同的證明標的。"
  - id: C006
    statement: "沈伯洋11/24『調查前不評論』表示他已直接撤回11/09『中國經典手法』的評論。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F002, F010]
    reasoning_notes: "11/24仍使用中國手法的語境，但11/09本來就對損害結果保留判斷；不可稱完全改口或已自認原說法不實。"
  - id: C007
    statement: "現有台灣評論者與媒體的發言足以證明民進黨中央統一指示抹黑黃仁勳。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F002, F003, F004, F005]
    reasoning_notes: "政治人物、獨立評論者、新聞媒體的身份與外部可驗證組織指令不同。"
  - id: C008
    statement: "川普的『Never even a suggestion』證明黃樂不是間諜。"
    status: contradicted
    supports: []
    contradicts: [F008]
    related_facts: [F007]
    reasoning_notes: "逐字稿此語回答的是『黃仁勳是否有意去中國發展／被中國挖角』，不能移作情報認定。"

