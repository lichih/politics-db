notes:
  - "研究結論：教學身分、職務上下屬、具體提攜、受教者感念、媒體所賦予的『恩師』定位，是不同層次的命題，不可未舉證就相互替代。"
  - "尤其要避免歸責錯置：本次證據能確認『媒體稱李為恩師』，但不能據此說『李源德本人自稱柯的恩師』。"
  - "適合未來討論媒體標題權威框架，不以單則批評或人物政治立場取代論證。未開立 Fact 文章。"
