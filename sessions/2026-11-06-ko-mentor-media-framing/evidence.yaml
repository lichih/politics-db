facts:
  - id: F001
    statement: "2023 年 10 月三立及品觀點 報導曾以『恩師』稱李源德；2026 年 4 月民視仍沿用『台大恩師』，但所查報導未具體列出李對柯的個別提攜事例。"
    status: verified
    observed_at: "2026-11-06T00:23:17+08:00"
    source_ids: [S002, S003, S004]
    evidence_summary: "對三份新聞標題及內文逐一比對，可證明媒體使用稱號及當篇所提供的事證範圍。"
    verification_notes:
      - "不能因此斷言任何媒體文章之外不存在李對柯的具體恩惠。"
    tags: [媒體用語, 恩師, 標題]

  - id: F002
    statement: "李源德公開評論柯文哲時使用『在我的學生中』，但該句只直接表明李自認師生關係，不構成特殊恩義關係的個別提攜證明。"
    status: verified
    observed_at: "2026-11-06T00:23:17+08:00"
    source_ids: [S005, S003]
    evidence_summary: "Cofacts 保存相關評論文字及原臉書貼文線索，品觀點亦引用；師生關係與『恩師』稱號需分開論證。"
    excerpt: "在我的學生中"
    verification_notes:
      - "目前並未找到李源德本人自稱『柯文哲恩師』的原話，不能將媒體的稱號直接歸於李本人。"
      - "本次未直接核對李源德臉書原留言的完整上下文。"
    tags: [師生關係, 恩師]

  - id: F003
    statement: "朱樹勳在 2018 年接受中央社採訪時明確稱，他擔任臺大醫院外科主任期間指定柯文哲負責加護病房，並調整其門診及收住院病人工作。"
    status: verified
    observed_at: "2026-11-06T00:23:17+08:00"
    source_ids: [S006, S007]
    evidence_summary: "當事人受訪兩度說明具體職涯安排，證據較一般『教過』主張具體。"
    tags: [朱樹勳, 職涯提攜, 加護病房]

  - id: F004
    statement: "2025 年 2 月朱樹勳過世，民眾黨透過柯文哲的社群帳號發布追思文字，公開感謝朱的提攜與教誨，稱『沒有朱P就沒有柯文哲』。"
    status: verified
    observed_at: "2026-11-06T00:23:17+08:00"
    source_ids: [S008]
    evidence_summary: "中央社核對民眾黨代理發文；為柯方陣營公開承認特殊師徒關係的紀錄。"
    verification_notes:
      - "因當時柯被羈押禁見，屬政黨代表表態，非柯本人當日親自敲寫。"
    tags: [朱樹勳, 恩師, 提攜]

  - id: F005
    statement: "臺大醫院網站人物專文記載朱於 1999 年離開臺大接任亞東醫院院長。"
    status: verified
    observed_at: "2026-11-06T00:23:17+08:00"
    source_ids: [S009]
    evidence_summary: "臺大官網轉載文章描述朱的醫界經歷與轉任，另有直接採訪佐證他對柯的實際職涯安排。"
    verification_notes:
      - "院方轉載文章對轉任原因的概述，不能單獨證明當時不存在人事競爭。"
    tags: [朱樹勳, 臺大醫院]

  - id: F006
    statement: "臺大醫院官方歷任院長列表顯示，李源德擔任院長的期間為 1998 年 8 月至 2004 年 7 月。"
    status: verified
    observed_at: "2026-11-06T00:23:17+08:00"
    source_ids: [S010]
    evidence_summary: "院方官方歷任院長年表。"
    tags: [李源德, 臺大醫院]

  - id: F007
    statement: "2026 年 11 月 5 日 Facebook 討論貼文明言李源德『在台大把朱樹勳鬥走』，但貼文及附圖沒有提供可驗證該因果的直接資料。"
    status: verified
    observed_at: "2026-11-06T00:23:17+08:00"
    source_ids: [S001]
    evidence_summary: "已開啟社團頁與使用者 deterministic 擷取的文字相符；這是對貼文內容的記錄，不是對指控本身的認定。"
    tags: [社群指控, 因果推論]

  - id: F008
    statement: "2013年5月8日已有PTT轉錄文本，據稱柯文哲約十年前於課堂多次對李源德發表高度負面評論，亦提及朱李競爭。"
    status: verified
    observed_at: "2026-11-06T00:29:25+08:00"
    source_ids: [S012]
    evidence_summary: "可確定2013年文字存在，不能將原始發言年份、逐字真實性視為已核實；多段話仍屬同一份轉錄。"
    tags: [關係背景, 2013年, 轉錄限制]

  - id: F009
    statement: "2021年5月新聞即記載李源德批評柯文哲徵召退離醫護是在要大家幫忙作秀。"
    status: verified
    observed_at: "2026-11-06T00:29:25+08:00"
    source_ids: [S013]
    evidence_summary: "Cofacts收錄當年的Newtalk報導摘要；證明2023年『恩師』標題前已存在公開負面評價紀錄。"
    tags: [2021年, 公開批評]

  - id: F010
    statement: "臺大校友中心記載1999年臺大醫院與亞東醫院建教合作、朱樹勳轉任亞東醫院院長。"
    status: verified
    observed_at: "2026-11-06T00:29:25+08:00"
    source_ids: [S014]
    evidence_summary: "提供1999年朱轉職的官方制度背景，不足以證明或否定所有院內人事競爭。"
    tags: [朱樹勳, 職涯安排]

claims:
  - id: C001
    statement: "李源德教過或曾任柯文哲的老師，所以可以直接證成李是柯的『恩師』。"
    status: unsupported
    supports: [F002]
    contradicts: []
    related_facts: [F001, F003, F004]
    reasoning_notes: "『老師』或主管關係是客觀背景，『恩師』在報導語境增添特殊栽培、感念及評價權威的意涵；不能只憑『在我的學生中』跨越這個證據缺口。這不等於證明李不可能有恩於柯。"

  - id: C002
    statement: "朱樹勳在柯文哲醫師職涯與其陣營公開敘事中，具有具體可查的特殊師徒關係。"
    status: supported
    supports: [F003, F004, F005]
    contradicts: []
    related_facts: []
    reasoning_notes: "既有職涯安排、朱本人受訪及柯方悼念相互印證。不得從此推論柯只能有一位恩師。"

  - id: C003
    statement: "李源德當年在臺大『把朱樹勳鬥走』。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F005, F006, F007, F008, F010]
    reasoning_notes: "已查到 1999 年朱轉任亞東及李任臺大院長的時間脈絡，但未找到能直接支持『李使朱離開』的可靠因果證據；官方人物專文描述朱接受新挑戰亦不足以反證所有內部矛盾。不可寫為已證實。"

  - id: C004
    statement: "媒體稱李源德『恩師』會為其批評柯文哲的言論增加特殊的師徒權威感，但報導需有相稱的具體事證支持。"
    status: supported
    supports: [F001, F002]
    contradicts: []
    related_facts: [F003, F004]
    reasoning_notes: "此為可觀察媒體用語所帶來的論證功能及公共評論判準，不是已證明記者刻意誤導，也不判定李本人自封恩師。李對柯的實質批評仍應按所舉事實獨立檢驗。"

  - id: C005
    statement: "媒體將已有不睦公開紀錄的師生關係，包裝成『恩師批學生』，產生特殊的批評權威感，且未交代重要反向背景。"
    status: supported
    supports: [F001, F008, F009]
    contradicts: []
    related_facts: [F002]
    reasoning_notes: "可針對標題效果與省略關係背景提出明確專業批評；不等於已證明編輯知情故意隱瞞。2013年是未獨立核實原始錄音的轉錄。"

  - id: C006
    statement: "李源德本人自稱是柯文哲『恩師』，或與媒體串通以此稱謂建立批評權威。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F001, F002]
    reasoning_notes: "已查得李稱『在我的學生中』，未查得李本人自封恩師或參與標題編輯的證據。"

  - id: C007
    statement: "相關媒體使用『恩師』稱謂出於特定政黨指示。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F001, F008, F009]
    reasoning_notes: "可評價標題的政治性敘事功能與專業失當；黨派指示或事先協調則是需要另行證明的具體外部事實。"

