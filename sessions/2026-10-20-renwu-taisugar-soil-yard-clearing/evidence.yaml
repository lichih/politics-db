facts:
- id: F001
  statement: 2026年10月6日高雄市議會官方總質詢摘要記載，仁武區文武路、新莊路周遭仁新段多處地號遭大面積砍樹、整地；陳其邁答詢稱該處為台糖土地，業者承租整地後向工務局申請設置土資場。
  status: verified
  observed_at: '2026-10-20T11:34:54+08:00'
  source_ids: [S001]
  evidence_summary: 事件地點、台糖地主身分、私人業者承租整地及其後申請土資場之基本責任鏈可由市議會primary source確認。
  verification_notes:
  - 此事實不等同市府或台糖已核准砍樹，也不等同承租人依法有權砍樹。
  tags: [事件主體, 時間順序, 台糖, 土資場]
- id: F002
  statement: 聯合報2026年10月7日報導引述工務局長稱該處為「台糖造林地」、已由私人承租，土資場案件當時尚未核准。
  status: partial
  observed_at: '2026-10-20T11:34:54+08:00'
  source_ids: [S002]
  evidence_summary: 可作為同日議會答詢的secondary account，補充「造林地」稱呼與當時尚未核准的程序狀態；精確法律性質仍需原始地籍、造林計畫與案卷確認。
  verification_notes:
  - 「台糖造林地」是官員答詢用語，不自行等同森林法上的森林或林地。
  - 「地主砍樹無法干涉」僅保存為官員說法，不採為完整法律結論。
  tags: [程序狀態, 造林地, secondary]
- id: F003
  statement: 《高雄市營建工程剩餘土石方管理自治條例》第33條要求申請設置土資場者於初審檢附土地權利證明；土地非申請人所有時，應同時檢附土地使用權同意書，僅公有土地可延至複審檢附。
  status: verified
  observed_at: '2026-10-20T11:34:54+08:00'
  source_ids: [S003]
  evidence_summary: 土資場申請制度留下可驗證地主同意的文件節點。
  tags: [土資場, 初審, 土地使用權同意書, 程序]
- id: F004
  statement: 台糖公司為法人組織形態之國營事業，其公司所有土地不因台糖為國營事業即屬《土地法》所稱公有土地。
  status: verified
  observed_at: '2026-10-20T11:34:54+08:00'
  source_ids: [S004, S005]
  evidence_summary: 土地法公地定義與地方地政機關官方解釋一致；因此土資場第33條「公有土地得延後補同意書」例外不能僅因地主是台糖就直接適用。
  tags: [公有土地, 台糖, 土地法]
- id: F005
  statement: 台糖高雄區處目前公開的農業用地租賃契約範本，不授予承租人任意改變地貌的權利：未經台糖書面同意變更地形、地貌或挖取土石可構成終止契約事由，正常使用如必須整地亦須先取得台糖書面同意；該範本並禁止將農地供堆置收納營建剩餘土石方等非農業用途。
  status: verified
  observed_at: '2026-10-20T11:34:54+08:00'
  source_ids: [S006]
  evidence_summary: 公開契約基準直接反駁「只要承租台糖農地就當然可自行整地或改作土資場」的泛化理解；但本案實際契約尚未取得。
  verification_notes:
  - 不得把範本直接當成本案實際契約。
  tags: [農地租約, 書面同意, 整地, 用途限制]
- id: F006
  statement: 台糖2022年曾就仁武區仁新段0083-0-2地號、仁梓農場40耕區公告農地租賃，面積0.1公頃、農業區、指定林下養蜂；該標案後來停標。
  status: verified
  observed_at: '2026-10-20T11:34:54+08:00'
  source_ids: [S007]
  evidence_summary: 確認仁新段83地號內至少曾存在台糖農業租賃標的，但時間、面積與標案狀態均不足以連結到2026本案。
  verification_notes:
  - 不能據此推論2026本案就是農業租約，也不能識別2026承租人。
  tags: [仁新段83, 歷史租賃, 農業區]
- id: F007
  statement: 林業保育署對平地造林20年期滿並非採取「期滿即一律可清除」政策；現行後續方案依生態棲地、景觀與生產價值等分流，台糖具生物棲地及景觀價值區位有持續維護機制，其具農林生產價值區位則可轉型友善農業或混農林業。
  status: verified
  observed_at: '2026-10-20T11:34:54+08:00'
  source_ids: [S008]
  evidence_summary: 20年期滿本身不是自動清除許可；但本案是否屬該平地造林計畫及適用哪一類仍未確認。
  tags: [平地造林, 20年期滿, 台糖, 分流輔導]
- id: F008
  statement: 目前公開可查的高雄市議會primary source只確認爭議地點為仁武區文武路、新莊路周遭「仁新段多處地號」；「仁新段83等多筆地號」的精確描述目前來自媒體報導，尚未由本次取得的primary source獨立確認。
  status: verified
  observed_at: '2026-10-20T11:49:45+08:00'
  source_ids: [S001, S011]
  evidence_summary: 重查後將地號精度分層，避免把secondary detail回填成官方已確認事實。
  verification_notes:
  - S007只能證明仁新段83地號內歷史上曾有台糖農地標租標的，不能用來反向證明該地即為2026爭議基地。
  tags: [地號, source-proximity, evidence-audit]
claims:
- id: C001
  statement: 本案大面積砍樹、整地的直接行為主體是私人承租業者，而非高雄市政府直接施工。
  status: supported
  supports: [F001]
  contradicts: []
  related_facts: [F002]
  reasoning_notes: 市議會官方摘要支持私人業者承租整地；但直接行為主體與地主、主管機關是否負其他責任是不同問題。
- id: C002
  statement: 因為土地是私人承租，所以承租人本來就有權自行把樹砍光、整地。
  status: unsupported
  supports: []
  contradicts: []
  related_facts: [F005]
  reasoning_notes: 本案實際租約尚未取得，不能直接判違約；但台糖公開農地租約基準明確要求特定整地／地貌變更先取得書面同意，因此「承租即當然有權」目前沒有證據支持。
- id: C003
  statement: 本案使用的是台糖一般農業用地租約，且承租人已違反租約。
  status: unresolved
  supports: []
  contradicts: []
  related_facts: [F005, F006]
  reasoning_notes: 缺本案實際租約、租賃用途、承租範圍與台糖書面同意文件。
- id: C004
  statement: 台糖已對本案土資場用途出具土地使用權同意書。
  status: unresolved
  supports: []
  contradicts: []
  related_facts: [F003, F004]
  reasoning_notes: 如果案件已以完整文件正式進入第33條初審，因台糖土地非公有土地，理應有土地使用權同意書；但目前公開資訊只說「申請／審查中」，不足以確認形式審查階段與文件是否齊備。
- id: C005
  statement: 本案砍樹本身已構成違法伐採或其他行政違法。
  status: unresolved
  supports: []
  contradicts: []
  related_facts: [F002]
  reasoning_notes: 尚缺涉案地號完整清單、都市計畫／使用編定、森林法上林地或森林認定、造林計畫身分、伐採許可及其他可能適用的原始文件。
- id: C006
  statement: 高雄市政府在砍樹整地前已核准或授權這次砍樹。
  status: unsupported
  supports: []
  contradicts: []
  related_facts: [F001, F002]
  reasoning_notes: 目前取得來源只確認業者承租整地後申請土資場，且截至10月6日土資場尚未核准；未找到市府事前核准砍樹之文件。not_found不等於不存在。
- id: C007
  statement: 只要台糖平地造林滿20年，原有樹木就可不經其他判斷自由清除。
  status: contradicted
  supports: []
  contradicts: [F007]
  related_facts: []
  reasoning_notes: 現行政策採分流輔導，期滿不是一律自由清除；但這不表示本案土地必然被要求永久維持林相。
- id: C008
  statement: 「私人整理承租土地」足以排除台糖、主管機關或土地使用程序的其他責任問題。
  status: unsupported
  supports: []
  contradicts: []
  related_facts: [F001, F003, F004, F005]
  reasoning_notes: 私人直接施工只回答actor；是否有地主書面同意、租約權限、土資場土地使用同意、伐採或土地使用許可仍是獨立問題。
