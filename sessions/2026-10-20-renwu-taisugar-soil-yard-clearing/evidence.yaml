  observed_at: '2026-10-20T11:34:54+08:00'
  retrieval_status: reachable
  notes:
  - 第33條規定土資場初審須檢附土地權利證明；土地非申請人所有者應同時檢附土地使用權同意書，僅公有土地得延至複審檢附。
  - 第34條規範初審通過後之複審文件；第35條規範審查核准後發給設置許可。
