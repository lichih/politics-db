  notes:
- 本案主論點不是「先證明承租人違法／違約」，而是：已知事件已碰到台糖自己明文高度控制的整地、地貌變更與土資場類用途，因此台糖不能以「私人承租」退出管理與說明責任。
- 證據主幹依序為：F001（實際發生大面積砍樹整地後申請土資場）→ F005（台糖公開農地規範對整地與土資場類用途的嚴格限制）→ F010/F011（出租後仍有巡查、維護、異常使用防範與履約管理責任）。
- 本案實際租約未取得，只限制「能否直接判定承租人違約」，不應反過來稀釋已成立的台糖管理責任與已知制度衝突。
- 本案最關鍵待公開文件為：實際租約／契約類型、整地或地貌變更書面同意、巡查與履約紀錄、土資場申請案中的土地使用權同意書及程序狀態。
- 土地使用權同意書若存在，只能先證明台糖同意特定土地供申請用途使用；其內容、日期與範圍仍須另行檢查，不能自動等同事前同意砍樹。
- 「直接施工者是私人」與「台糖是否負管理責任」必須分層；前者已確認，後者亦由台糖自身制度直接支持。
- 樹木是否依法可砍、是否屬森林法或特定造林計畫、完整地號等仍可 unresolved；除非未來論點改成「砍樹本身違法／不當」，否則不得讓這些周邊未解問題沖掉目前主論點。
- 2026-10-20重構 evidence graph：修正先前模型過度讓「實際租約未取得」與周邊 caveat 佔據主線的問題，將事件與台糖自身規範的直接衝突、以及台糖持續管理責任提升為主要 claims；法律違法與個案違約仍獨立維持 unresolved。
