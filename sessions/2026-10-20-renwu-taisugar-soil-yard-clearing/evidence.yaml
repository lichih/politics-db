  published_at: '2024-09-19'
  observed_at: '2026-10-20T11:34:54+08:00'
  retrieval_status: reachable
  notes:
  - 說明所有權屬國家或地方自治團體之土地為公有土地；台糖等法人組織形態國營事業之土地非屬公地。
