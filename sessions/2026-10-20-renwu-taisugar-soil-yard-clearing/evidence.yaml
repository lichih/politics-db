  observed_at: '2026-10-20T11:34:54+08:00'
  retrieval_status: reachable
  notes:
  - 第4條以國有、直轄市有、縣市有、鄉鎮市有土地定義公有土地。
- id: S006
  source_type: primary
  publisher: 台灣糖業股份有限公司
  title: 台糖公司高雄區處農業用地租賃契約書（範本）
  url: https://www.taisugar.com.tw/upload/UserFiles/Property/42980/639083216762919155.pdf
  observed_at: '2026-10-20T11:34:54+08:00'
  retrieval_status: reachable
  notes:
  - 公開範本文本列示最近修訂至2025-10-22；第10條將未經台糖書面同意變更土地地形、地貌或挖取土石列為得終止契約之違約情事。
  - 第11條規定如正常使用非整地不可，須經台糖書面同意後始得整地；填土亦須事先取得書面同意。
  - 第2條用途限制明列不得供堆置收納營建剩餘土石方、水庫河川淤泥資源再生利用處理設施、採取土石或其他非農業使用。
  - 此為公開範本，不等同本案實際租約，不能單憑範本判定本案違約。
