notes:
  - "可重用的研究命題為：媒體對現場聲音發話者的歸因，是否有足以支持具體身分的證據？"
  - "最終定性須分開評估：一、標題與正文差異；二、實際發話者身分；三、社群傳播是否有協調操作。三者證據門檻不同。"
  - "後續優先補：三立影音與文字稿的原始 URL、發布與修改時間、影音關鍵幀、現場可辨識的發話方向及第三方佐證。"
