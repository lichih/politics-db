facts:
  - id: F001
    statement: "2026-10-29 黃揚明在公開 Facebook 貼文主張，現場喊話者是為堵訪收音而喊話的某媒體攝影記者，並指稱有媒體將發話者歸為蔣萬安隨行人員。"
    status: verified
    observed_at: "2026-10-29T16:34:00+08:00"
    source_ids: [S001]
    evidence_summary: "已從開啟的 Facebook 分頁讀到原文；可證明黃揚明作出此主張，不能單憑貼文證明喊話者身分。"
    excerpt: "這句是現場某媒體攝影記者為求堵訪收音而喊"
    verification_notes:
      - "原文另批評媒體及網路擴散；『網軍』描述未另行查證。"
    tags: ["原始貼文", "主張存在"]
  - id: F002
    statement: "先前同一對話辨識三立文字稿稱『有人大吼』，但影音標題曾稱『隨行人員嗆』或『工作人員突吼』。"
    status: partial
    observed_at: "2026-10-29T16:37:42+08:00"
    source_ids: [S002, S003]
    evidence_summary: "歸檔的是先前核對所得的媒體文本對照線索；影音完整原始網址與畫面尚需補強，不將其升格為完成獨立查核的事實。"
    verification_notes:
      - "核對兩類標題是否為同一影片、是否有後續更正，並確認新聞正文沒有其他身分證據。"
    tags: ["標題與內文落差", "待補原始影音"]

claims:
  - id: C001
    statement: "發話者實際上是現場媒體攝影記者，而非蔣萬安隨行／工作人員。"
    status: unresolved
    related_facts: [F001]
    reasoning_notes: "目前直接可見的是黃揚明的指認；需完整現場畫面、同步收音與獨立在場證詞。"
  - id: C002
    statement: "媒體在文字新聞未證明身分時，於影音標題將發話者歸為蔣萬安隨行／工作人員。"
    status: unresolved
    related_facts: [F002]
    reasoning_notes: "先前對話有一致的文本落差線索，待保存影音原始頁面與文字稿快照後再升格。"
  - id: C003
    statement: "有組織的網軍接續操作該錯誤歸因。"
