promotion:
  research:
    - "人事同意權僵局中的『逢賴必反』與提名品質競爭解釋"
  cases: []
  comparators:
    - "陳瑞敏審計長112比0 vs. 兩輪大法官全數未過"

notes:
  - "本session不替任何一輪大法官被提名人預先判定適任或不適任。核心是檢驗『無論提誰都不會過』這個全稱政治敘事。"
  - "陳瑞敏案例的直接反證力只到：同一屆立法院並非對所有賴清德提名都必然否決。不能自行推出『大法官案失敗全因總統選人差』。"
  - "第一輪劉靜怡是重要反例：她是賴清德正式提名人，卻由民進黨團反對、民眾黨支持，因此『14人全遭否決＝14人全被藍白共同封殺』不是精確描述。更重要的是，民進黨團總召公開把她長期批評民進黨及黨內政治人物列為反對理由，並以開除黨籍威脅要求51席一致投不同意，這使該次投票成為『政黨忠誠判準介入憲政職位適任審查』的直接案例。"
  - "第二輪國民黨與民眾黨整批反對仍是強烈的政黨政治證據；不應因陳瑞敏112比0而假裝國會人事案沒有黨爭。"
  - "較完整的因果模型應至少包含：在野黨團政治對抗、被提名人職位適配與爭議、總統府選人品質、執政黨內部支持程度、跨黨協調與被提名人既有公信力。"
