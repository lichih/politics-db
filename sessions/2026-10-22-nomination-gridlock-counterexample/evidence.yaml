facts:
  - id: F001
    statement: "陳瑞敏2019年由蔡英文首次提名為審計長，2025年再由賴清德提名續任。"
    status: verified
    observed_at: "2026-10-22T04:32:50+08:00"
    source_ids: [S001, S002]
    evidence_summary: "總統府primary直接確認兩次提名的總統不同，第二次仍屬賴清德正式提名。"
    tags: [陳瑞敏, 蔡英文, 賴清德, 提名]

  - id: F002
    statement: "2025年9月30日立法院以112票同意、0票不同意、0票無效，同意賴清德提名的陳瑞敏續任審計長。"
    status: verified
    observed_at: "2026-10-22T04:32:50+08:00"
    source_ids: [S002, S003, S004]
    evidence_summary: "總統府確認賴清德提名；立法院公報直接確認112比0投票結果。"
    tags: [人事同意權, 112比0, 審計長, 反例]

  - id: F003
    statement: "第一輪7名大法官被提名人全數未過，但其中劉靜怡獲民眾黨8票同意，反而遭民進黨團投不同意。"
    status: verified
    observed_at: "2026-10-22T04:32:50+08:00"
    source_ids: [S005, S006, S007]
    evidence_summary: "第一輪全數未過的總體結果，至少有一名被提名人的失敗不能完整歸因於藍白共同反對。"
    tags: [大法官, 劉靜怡, 民進黨, 民眾黨]

  - id: F004
    statement: "民進黨團公開說明反對劉靜怡的理由包含她過去對民進黨及其政治人物的強烈批評；黨團並祭出黨紀要求一致反對，柯建銘公開表示黨籍立委若投劉靜怡同意票就開除黨籍。柯建銘事前曾向賴清德報告，賴表示尊重黨團自主。"
    status: verified
    observed_at: "2026-10-22T04:41:10+08:00"
    source_ids: [S007, S011]
    evidence_summary: "此為民進黨團總召公開說法，可直接證明該次黨團否決劉靜怡時，公開採取的判準包含她對民進黨及黨內政治人物的批評，並以黨紀強制一致投票。"
    tags: [劉靜怡, 民進黨團, 黨紀, 提名協調]

  - id: F005
    statement: "第二輪7名大法官被提名人全數未過；國民黨、民眾黨均整批反對，但民進黨自己對陳慈陽、詹鎮榮並未統一支持，而是開放投票。"
    status: verified
    observed_at: "2026-10-22T04:32:50+08:00"
    source_ids: [S008, S009]
    evidence_summary: "第二輪存在高度在野黨團一致反對，同時也存在執政黨對部分自家總統提名人未形成統一支持的事實。"
    tags: [大法官, 第二輪提名, 黨團投票]

  - id: F006
    statement: "2026年5月，總統府秘書長潘孟安公開以前兩輪14名大法官人選均遭否決為背景，反問是否還要再送第三批提名。"
    status: verified
    observed_at: "2026-10-22T04:32:50+08:00"
    source_ids: [S010]
    evidence_summary: "可證明總統府方面確曾把前兩次全面否決結果拿來回應後續提名義務／必要性的質疑。"
    tags: [潘孟安, 大法官, 第三度提名, 政府敘事]

  - id: F007
    statement: "同一屆立法院既曾對賴清德提名的陳瑞敏投出112比0，也曾兩度使賴清德提出的大法官名單全數未過。"
    status: verified
    observed_at: "2026-10-22T04:32:50+08:00"
    source_ids: [S002, S003, S005, S006, S008, S009]
    evidence_summary: "不同職位的同意權門檻與職務性質不同，但事實上同一政治結構並非對所有賴清德提名一律投反對。"
    tags: [比較案例, 人事同意權, 同一立法院]

claims:
  - id: C001
    statement: "在目前這一屆立法院，只要是賴清德提名的人，不論人選是誰，都不可能通過同意權。"
    status: contradicted
    contradicts: [F001, F002, F007]
    reasoning_notes: "陳瑞敏是賴清德2025年正式續提的人選，最終獲112票同意、0票反對，足以直接反駁『任何賴清德提名都不可能通過』這個全稱命題。"

  - id: C002
    statement: "兩輪大法官提名全部失敗，可以完整且單一地歸因於藍白『逢賴必反』，總統府的選人、提名品質與政治協調無須納入原因。"
    status: contradicted
    contradicts: [F003, F004, F005, F007]
    reasoning_notes: "第一輪劉靜怡由民進黨自己反對、民眾黨支持；第二輪民進黨對兩名自家總統提名人也未統一支持。這些事實足以否定『失敗原因只有在野黨』的單因敘事，但不能證明在野黨團沒有高度政治性整批反對。"

  - id: C003
    statement: "兩輪大法官提名失敗主要是因賴清德提名的人選品質普遍不佳。"
    status: unresolved
    related_facts: [F003, F004, F005, F007]
    reasoning_notes: "目前證據可確定提名品質／適任性與協調必須進入原因模型，但無法由投票結果本身量化它在14人失敗中的權重；國民黨、民眾黨整批反對也是重要競爭解釋。"

  - id: C004
    statement: "陳瑞敏112比0足以證明大法官被提名人若夠優秀，也一定會獲相同票數通過。"
    status: unsupported
    related_facts: [F002, F007]
    reasoning_notes: "審計長與大法官的職務性質、政治爭議、資格判斷與國會審查情境不同。陳瑞敏案例只能反駁『誰都不會過』，不能直接建立所有職位的充分條件。"

  - id: C005
    statement: "總統府後續以『前兩次都被否決』回應第三度提名質疑時，可以把前兩輪失敗直接當成國會不可能通過任何新人選的證據。"
    status: contradicted
    contradicts: [F002, F003, F004, F005, F006, F007]
    reasoning_notes: "同一立法院後來對賴清德提名的陳瑞敏112比0同意，且前兩輪大法官中有執政黨自行反對／不統一支持的情況；因此『過去失敗→未來任何提名都無意義』不是由既有資料必然推出的結論。"

  - id: C006
    statement: "國民黨與民眾黨在人事同意權上沒有任何政黨性封殺或政治考量。"
    status: contradicted
    contradicts: [F003, F005]
    reasoning_notes: "國民黨第一輪整批反對，第二輪國民黨與民眾黨均整批反對，顯示黨團政治考量是重要因素。陳瑞敏反例不能反過來洗掉這項事實。"

  - id: C007
    statement: "民進黨團反對劉靜怡時，公開提出的主要理由是她的法律專業、司法能力或大法官職位適任性不足，而不是她批評民進黨及黨內政治人物。"
    status: contradicted
    contradicts: [F004]
    reasoning_notes: "柯建銘公開列舉的是劉靜怡一路批評民進黨、蔡英文、蘇貞昌及王義川等，並以黨紀要求一致反對、違者開除黨籍。這不排除個別立委另有專業疑慮，但黨團公開說明不能描述成以專業適任性為主。"

