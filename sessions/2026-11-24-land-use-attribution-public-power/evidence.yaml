facts:
  - id: F001
    statement: "2023年新北市政府認定汐止水源段162地號保護區土地遭未經許可作停車用途，對違規行為人即承租者裁罰；163地號為道路用地，兩筆土地法定用途不同。"
    status: verified
    observed_at: "2026-11-24T15:46:48+08:00"
    source_ids: [S003, S004]
    evidence_summary: "中央社2023-08-28引述交通局：7/31與8/24對承租人罰3,000與9,000元；城鄉局另對承租人罰60,000元。2023-07-26報導區分162地號保護區、163地號道路用地。"
    verification_notes:
      - "已確認的是土地使用違規與承租者受罰，不能等同黃國昌本人違法設置、經營或持有停車場設施。"
      - "行政處分書正本未取得，證據層級為主管機關發言之新聞報導。"
    tags: ["責任主體", "土地使用", "2023"]
  - id: F002
    statement: "2023-07-26新北市交通局稱勘查時未發現收費事實，無事證直接認定為收費停車場；同日報導指出地主接獲通知後表示已轉告承租人合法使用。"
    status: verified
    observed_at: "2026-11-24T15:46:48+08:00"
    source_ids: [S004]
    evidence_summary: "主管機關當時區分『有停車』與『收費停車場』的證明，也記錄地主收函後的回應。"
    verification_notes:
      - "此為2023-07-26查核時間點，不代表此後沒有新增證據。"
    tags: ["收費事實", "地主回應"]
  - id: F003
    statement: "2026-11-24黃國昌公開指控林國漳投資的建案涉及農牧用地作停車用途，並發布聲稱現勘的貼文。"
    status: verified
    observed_at: "2026-11-24T15:46:48+08:00"
    source_ids: [S001, S002]
    evidence_summary: "可證明政治人物已提出特定指控與公開貼文，尚不能證明地號、土地用途、使用人或違法成立。"
    tags: ["政治指控", "待核實"]
  - id: F004
    statement: "林國漳陣營公開承認250萬元投資並表示合法，且針對炒地相關指控提出將提告的回應。"
    status: verified
    observed_at: "2026-11-24T15:46:48+08:00"
    source_ids: [S005, S006]
    evidence_summary: "可確認有投資承認及否認炒地的公開回應；尚未獨立取得完整投資契約、分紅及土地登記資料。"
    tags: ["投資", "當事人回應"]
  - id: F005
    statement: "刑事訴訟法第161條將被告犯罪事實的舉證責任置於檢察官；檢察官倫理規範要求不受政治關係影響、調查有利及不利證據，並遵守比例原則。"
    status: verified
    observed_at: "2026-11-24T15:46:48+08:00"
    source_ids: [S007, S008]
    evidence_summary: "刑訴法161條明定檢察官負舉證責任；倫理規範第6、9、10條規定政治中立、雙向查證、強制處分比例原則。"
    tags: ["公權力", "舉證責任", "正當程序"]

claims:
  - id: C001
    statement: "黃國昌本人曾違法經營或設置汐止停車場。"
    status: unsupported
    related_facts: [F001, F002]
    reasoning_notes: "本次來源可確認承租人被認定為違規行為人並受罰；不能由地主身分與土地使用違規推出地主本人為經營者、設置者或違規人。unsupported不是反向證明絕不可能有其他責任。"
  - id: C002
    statement: "林國漳本人違法將農牧用地作停車場。"
    status: unresolved
    related_facts: [F003, F004]
    reasoning_notes: "投資事實及黃國昌現勘主張，均不足單獨確定違規地號、土地使用人與林國漳法律責任；待宜蘭縣政府紀錄與土地資料。"
  - id: C003
    statement: "民進黨政府已在此次林國漳／黃國昌停車場爭議中指示檢調，使用國家機器進行司法迫害。"
    status: unsupported
    related_facts: [F003, F004, F005]
    reasoning_notes: "本次取得的貼文、新聞與法規未出示此事件存在政府指示、檢調偵查或強制處分的具體資料；不可由一般司法迫害風險推導本案已發生。未查得不等於從未存在。"
  - id: C004
    statement: "政治懷疑或媒體攻擊可直接充當國家強制處分與刑事定罪的充分依據。"
    status: contradicted
    contradicts: [F005]
    reasoning_notes: "刑訴法舉證與檢察官職務規範要求獨立查證、正當程序。判斷特定強制處分是否合法仍需檢查其個別要件和卷證。"
  - id: C005
    statement: "以2023年承租者受罰紀錄，反推黃國昌個人違法，再以此評價支持者，是正確的事證推論。"
    status: contradicted
    contradicts: [F001, F002]
    reasoning_notes: "錯置責任主體與證據命題；此為本次對話中明確修正的查核方法錯誤，不得再當成個人違規已證實。"

