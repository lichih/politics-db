  - 待查原始監察院政治獻金各筆日期、捐款人、金額、捐款年度與法人關係；避免把記者會轉述當成已直接讀到申報原件。
  - 待查高雄市新世代教育基金會設立及捐助人董事登記原始資料。
  - 待用立法院議事暨公報資料核查修法提案、賴瑞隆擔任召委期間實際程序及利益範圍。
  - 待確認公開偵查處理狀態，區分 not_found 與 never_existed。
