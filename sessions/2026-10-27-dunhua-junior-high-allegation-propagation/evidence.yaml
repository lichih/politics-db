notes:
  - "本 session 刻意區分『同一事件內反覆出現／擴散』與『跨事件穩定 pattern』。前者已有可觀察樣本；後者需更多彼此獨立事件。"
  - "本 session 不把『洋流』當成有明確會員名冊的正式組織；除非有外部證據，不把個別發文帳號自動標記為洋流成員。"
  - "pattern test 必須同時保存反例。沈伯洋本人在本案要求先釐清事實，是重要反例，不能因與假說不符而省略。"
  - "『造謠』若作政治傳播行為描述，仍應至少先固定可觀察行為：未證實內容是否被當成事實傳播、是否在反證出現後修正；若涉及法律責任或主觀故意，須另行檢驗構成要件與 knowledge state。"
