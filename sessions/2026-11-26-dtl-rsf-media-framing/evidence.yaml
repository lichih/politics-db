notes:
  - "本案是媒體引用與資訊分類的研究，不應和2022年科技部研究雲端保存疑點合併成同一條違規指控。"
  - "已證明的作用是DTL研究者參與RSF敘事中的觀點解釋，經自由時報轉述；未證明其對全篇內容或媒體流程具有編輯控制。"
  - "以政治人物為嘲諷對象不能單憑內容斷定中國操作；但DW另有特定帳號協同行為線索，亦不應全部忽略。"
