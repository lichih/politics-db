facts:
  - id: F001
    statement: "民視在至少4個彼此無直接關聯的沈伯洋事件中，反覆以『格局』作為標題或正文核心人格評價：店家簽名爭議、滷肉飯盲測、爭取黃珊珊／蔣萬安支持者、以及路人比中指事件。"
    status: verified
    observed_at: '2026-10-24T21:49:09+08:00'
    source_ids: [S001, S002, S003, S004]
    evidence_summary: "不同事件分別被框成『真有格局的未來市長』『超有格局』『超大格局／格局讓人折服』『心胸與格局』。"
    verification_notes:
      - "部分『格局』句子來自網友留言，S003則有媒體正文自行使用『超大格局』。"
      - "本 fact 證明人格標籤跨事件重複出現；不直接證明人格真實性或媒體主觀偏袒。"
    tags: ["2026", "沈伯洋", "民視", "格局", "personality-essentialization", "repetition"]

  - id: F002
    statement: "民視也反覆把沈伯洋不同能力片段整合成『學霸／全能』敘事，包括童年與大學軼事、未特別準備辯論、繞口令與英文表現。"
    status: verified
    observed_at: '2026-10-24T21:49:09+08:00'
    source_ids: [S005, S006, S007, S008]
    evidence_summary: "媒體以『學霸』『傳奇軼事』『學霸發言』『真學霸』『用英文辯論也沒問題』『還有什麼不會的』串連跨領域能力印象。"
    verification_notes:
      - "『還有什麼不會的』原話來自馬郁雯；媒體將其選為標題。"
      - "『真學霸／英文辯論也沒問題』主要來自網友，媒體以其作報導焦點。"
    tags: ["2026", "沈伯洋", "學霸", "all-round-ability", "media-amplification"]

  - id: F003
    statement: "在民進黨政治盟友的公開推薦中，沈伯洋曾被描述為『全才型市長候選人』，並以『國民黨瑟瑟發抖』把對手恐懼作為能力／競爭力的附加背書；多家媒體以此作標題與重點傳播。"
    status: verified
    observed_at: '2026-10-24T21:49:09+08:00'
    source_ids: [S009, S010]
    evidence_summary: "NOWnews與台視交叉記錄高嘉瑜同一段『全才＋敵人害怕』政治推薦。"
    verification_notes:
      - "這是政治盟友的競選修辭，不是獨立第三方能力評鑑。"
    tags: ["2026", "全才", "enemy-fear-endorsement", "高嘉瑜", "media-amplification"]

  - id: F004
    statement: "蔡其昌公開把沈伯洋形容為『能力超強』『百年難得一見的練武奇才』『瑰寶』，三立系報導以『沈伯洋有多強？』作框架傳播。"
    status: verified
    observed_at: '2026-10-24T21:49:09+08:00'
    source_ids: [S011]
    evidence_summary: "屬唯一性、稀有性與高能力本質化的明顯政治修辭，被媒體完整放大。"
    tags: ["2026", "沈伯洋", "uniqueness", "能力超強", "練武奇才", "瑰寶"]

  - id: F005
    statement: "自由電子報曾把沈伯洋一次與中風長者的互動以『暖哭萬人』作標題，並集中選錄謙遜、細心與感動等情緒／人格評價。"
    status: verified
    observed_at: '2026-10-24T21:49:09+08:00'
    source_ids: [S012]
    evidence_summary: "此例主要展現『情緒加權』：事件資訊被包進高情緒反應與人格評價。"
    tags: ["2026", "自由時報", "emotion-weighting", "暖哭", "humility"]

  - id: F006
    statement: "同一批媒體樣本中也存在資訊量高、可直接檢驗的正面報導，例如政策島具體列出政策架構；因此『正面／高評價』本身不能等同人格造神。"
    status: verified
    observed_at: '2026-10-24T21:49:09+08:00'
    source_ids: [S013]
    evidence_summary: "政策島報導同時包含可檢驗的94項政策細節與極端支持留言；兩者需分開 coding。"
    tags: ["2026", "counterexample", "policy-content", "information-rich"]

  - id: F007
    statement: "民視也曾刊出對蔣萬安的正面人格故事，但同篇立即加入反向材料與質疑，顯示『媒體有人格故事』並非沈伯洋獨有，且單篇不足以判斷系統性差異。"
    status: verified
    observed_at: '2026-10-24T21:49:09+08:00'
    source_ids: [S014]
    evidence_summary: "蔣萬安學弟稱其『平凡、沉穩、踏實』，但報導主軸轉為重修／學霸形象破滅及帳號背景質疑。"
    tags: ["2026", "baseline", "蔣萬安", "民視"]

  - id: F008
    statement: "民視曾直接以『超神片段』框架沈伯洋一次市場政策即席回答；另在與市政無關的電影翻譯題材中，也集中呈現『有問必答』『知識太廣』的反應，顯示『廣博／隨問即答』能力人格被跨領域事件重複強化。"
    status: verified
    observed_at: '2026-10-24T22:10:25+08:00'
    source_ids: [S015, S016]
    evidence_summary: "S015是媒體自身標題使用『超神片段』；S016則是另一領域事件被接入『有問必答／知識廣』模板。"
    verification_notes:
      - "市場政策回答本身具有可檢驗資訊，不能因『答得具體』本身判為造神；高權重部分是媒體進一步使用『超神』以及把跨領域事件反覆接到總體能力人格。"
    tags: ["2026", "沈伯洋", "民視", "超神", "knowledge-breadth", "cross-domain-essentialization"]


claims:
  - id: C001
    statement: "在已蒐集的民視樣本中，存在跨多種互不相干事件反覆把沈伯洋吸收到『格局』『高EQ』『學霸／全能』等穩定人格／能力標籤的敘事 pattern。"
    status: supported
    supports: [F001, F002, F008]
    contradicts: []
    related_facts: [F006]
    reasoning_notes: "鑑別力不在單一『格局』或『學霸』字詞，而在跨事件重複以同一不可量化人格標籤整合不同事實。"

  - id: C002
    statement: "媒體生態中另存在『全才＋敵人害怕』『百年難得一見練武奇才／瑰寶』等全能化、唯一化、敵人恐懼背書的高強度候選人敘事。"
    status: supported
    supports: [F003, F004]
    contradicts: []
    related_facts: []
    reasoning_notes: "原始評價主要出自政治盟友，媒體的可證明角色是選擇、標題化與再傳播；不應改寫成新聞機構自行完成全部判斷。"

  - id: C003
    statement: "若把『造神敘事』操作化為：將有限事件外推成難以由明確反例推翻的人格／整體能力本質，並由情緒、權威、全能化、唯一化或敵人恐懼背書加權，則本 session 已找到多個符合其中兩項以上的媒體／媒體放大樣本。"
