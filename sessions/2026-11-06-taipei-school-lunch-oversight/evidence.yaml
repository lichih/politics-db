facts: 
  - 
    id: "F001"
    statement: "《學校衛生法》第23-2條規定，高級中等以下學校辦理午餐應設供應會或相當組織，現任家長占至少四分之一。"
    status: "verified"
    observed_at: "2026-11-06T16:52:47+08:00"
    source_ids: 
      - "S001"
    evidence_summary: "中央法律明文規定家長比例。"
  - 
    id: "F002"
    statement: "臺北市立國小午餐供應委員會家長代表不得少於全體委員二分之一，委員人數七至十九人。"
    status: "verified"
    observed_at: "2026-11-06T16:52:47+08:00"
    source_ids: 
      - "S002"
    evidence_summary: "臺北市執行要點第三點。"
  - 
    id: "F003"
    statement: "臺北市午餐供應委員會每學期召開二次，主任委員由校長擔任，執行秘書由營養師擔任，無營養師者由教師或行政人員兼任。"
    status: "verified"
    observed_at: "2026-11-06T16:52:47+08:00"
    source_ids: 
      - "S002"
    evidence_summary: "執行要點第三、四點。"
  - 
    id: "F004"
    statement: "臺北市學校午餐菜單由合格營養師按營養原則與契約規劃，再交午餐供應委員會審議；菜單應事先公告並通知法定代理人。"
    status: "verified"
    observed_at: "2026-11-06T16:52:47+08:00"
    source_ids: 
      - "S002"
      - "S003"
    evidence_summary: "地方行政規則與教育局問答相符。"
  - 
    id: "F005"
    statement: "臺北市教育局指示，對學校午餐菜色的建議可直接反映給各校學務處衛生組，教育局業務電話為1999分機6394。"
    status: "verified"
    observed_at: "2026-11-06T16:52:47+08:00"
    source_ids: 
      - "S004"
    evidence_summary: "教育局公開常見問答。"
  - 
    id: "F006"
    statement: "臺北市教育局提供學校午餐委員會、監廚及查核作業、滿意度調查及回饋等標準作業流程文件。"
    status: "verified"
    observed_at: "2026-11-06T16:52:47+08:00"
    source_ids: 
      - "S005"
    evidence_summary: "官方文件清單有明確列示。"
  - 
    id: "F007"
    statement: "Threads留言者自述曾任午餐監督委員並在其學校參觀、檢查廚房。"
    status: "partial"
    observed_at: "2026-11-06T16:52:47+08:00"
    source_ids: 
      - "S006"
    evidence_summary: "只能證明留言者曾如此陳述，未獨立查核其參與資格及實際活動。"
    verification_notes: 
      - "不得擴張為每校皆有同樣現場開放方式。"
claims: 
  - 
    id: "C001"
    statement: "臺北市所有家長均可直接報名成為午餐委員或任意進入廚房試吃。"
    status: "unsupported"
    related_facts: 
      - "F002"
      - "F006"
    reasoning_notes: "法律保障家長代表比例及設置監廚流程，但實際遴選、進場與試吃須依各校安排；不能推定個別家長有無條件進場權。"
  - 
    id: "C002"
    statement: "臺北市家長有正式參與學校午餐決策及反映意見的制度途徑。"
    status: "supported"
    supports: 
      - "F001"
      - "F002"
      - "F004"
      - "F005"
