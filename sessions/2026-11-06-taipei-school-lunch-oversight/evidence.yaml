notes: 
  - "制度與個別學校的實際執行情形須區分；本研究未稽核特定學校的監廚紀錄。"
  - "公開發言應說明向學務處衛生組詢問委員遴選、監廚及進場程序，避免宣稱可以直接入廚或必然獲准試吃。"
