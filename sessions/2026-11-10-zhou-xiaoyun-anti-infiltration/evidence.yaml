notes:
  - "研究截止時間：2026-11-10T21:52:36+08:00；本筆是當時公開可核對資料與未決問題的起始基線，應依後續偵查、起訴或判決增補時間版本。"
  - "論證應分兩條獨立證據鏈：A. 犯罪嫌疑形成與構成要件；B. 偵查資訊如何流入媒體。即使後續證明違法犯罪，也不使任何違法洩密正當；即使有洩密也不能自動證明涉案者無罪。"
  - "待查：2025年9月廈門團體旅遊具體人員、費用來源、活動內容及與2026選舉的聯繫；檢方最初獲報、搜索票聲請及核發時點；搜尋票本身；媒體各篇首發時間與案情來源；Meta 帳號封鎖事由。"
  - "本紀錄未宣告偵查機關有介選動機、媒體為側翼、周曉芸受滲透來源資助或與特定幫派存在實際合作關係。"
