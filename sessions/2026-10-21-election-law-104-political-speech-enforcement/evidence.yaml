facts:
  - id: F001
    statement: "現行《公職人員選舉罷免法》第104條把選舉／罷免中的特定不實傳播列為刑事犯罪，基本型最高可處5年有期徒刑；以候選人、被罷免人或罷免領銜人本人之深度偽造聲音、影像或電磁紀錄犯之者，最高可處7年。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S001]
    evidence_summary: "第104條不是單純行政澄清或平台治理規範，而是可進入刑事偵查與處罰程序的實體刑罰規定。"
    tags: [選罷法, 第104條, 刑事責任, 深度偽造]

  - id: F002
    statement: "2026年10月『信民協會假民調電話』案中，曾姓男子因Threads貼文遭調查局追查；二手報導載有搜索住居所，桃檢則確認其遭約談、漏夜訊問、10萬元交保並扣押手機；桃檢當時明列選罷法第104條為涉嫌罪名之一。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S002, S004]
    evidence_summary: "這是非常接近『網路政治貼文→刑事強制程序』的現行案例；搜索細節來自聯合報，約談、交保、扣押手機與第104條嫌疑則由桃檢primary source確認。"
    tags: [Threads, 假民調, 搜索, 約談, 交保, 扣押手機, 第104條]

  - id: F003
    statement: "同一信民協會假民調案於2026年10月15日偵查終結時，桃檢僅以刑法第310條第2項加重誹謗罪起訴曾○承並求刑8月，偵結新聞稿未列選罷法第104條。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S003]
    evidence_summary: "本案能證明第104條曾被用作偵查與強制程序階段的犯罪嫌疑基礎之一，但不能描述成第104條起訴或定罪案例。"
    tags: [Threads, 假民調, 起訴, 加重誹謗, 程序狀態]

  - id: F004
    statement: "吳秉叡Dcard影射性侵案中，北檢2024年先搜索並約談蕭姓發文者，聲押禁見獲准；其後再兵分5路搜索，洪姓公司負責人亦遭羈押禁見，蔣欣璋100萬元交保；北檢最後依違反選罷法起訴蔣欣璋等4人。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S005]
    evidence_summary: "本案可直接證明涉及選舉不實資訊的第104條類型案件，實務上會出現搜索、約談、羈押禁見、具保與起訴等刑事強制程序。"
    tags: [吳秉叡, Dcard, 搜索, 羈押禁見, 交保, 起訴]

  - id: F005
    statement: "吳秉叡Dcard案截至2026年4月30日二審，蕭姓男子因意圖營利使候選人不當選而傳播不實之事維持判刑6月；蔣欣璋、鄧姓總幹事、洪姓被告3人則維持無罪。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S006, S007]
    evidence_summary: "同一案件中曾遭搜索、交保或羈押的不同被告，後續審判結果並不一致；強制處分與起訴不能倒推為有罪。"
    verification_notes:
      - "目前來源只確認二審結果，不把蕭姓男子的6月刑期描述為定讞。"
    tags: [吳秉叡, 二審, 有罪, 無罪, 程序區分]

  - id: F006
    statement: "2025年魯明哲罷免案的AI深偽錄音事件中，魯明哲團隊以選罷法第104條告發後，檢調向法院聲請搜索票並查緝王姓罷團成員到案；但公開報導載明訊後函送罪名為偽造文書、妨害名譽，未顯示第104條成為後續起訴罪名。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S008]
    evidence_summary: "此案可證明第104條告發能進入搜索／查緝流程，但現有公開資料不足以把它列為第104條起訴或定罪案例。"
    tags: [魯明哲, 罷免, AI深偽, 搜索票, 查緝, 第104條]

  - id: F007
    statement: "新北市議員王威元因2024立委選舉期間指稱李坤城向廠商『敲竹槓』，2025年8月遭新北地檢署依選罷法第104條起訴；2026年2月新北地院一審認定證據不足且相關內容屬質疑與評論，判決無罪。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S009, S010]
    evidence_summary: "第104條確實被用於政治攻防言論的刑事起訴，但法院可以因『不實』或言論性質等要件未證明而判無罪。"
    verification_notes:
      - "2026-02-04報導明示全案仍可上訴；本次未查到更後續確定結果。"
    tags: [王威元, 李坤城, 起訴, 一審無罪, 第104條]

  - id: F008
    statement: "邱毅曾因2010高雄市長選舉期間對陳菊的公開言論，被檢方以選罷法第104條與誹謗罪起訴；一審判無罪，2017年二審維持無罪。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S011]
    evidence_summary: "高雄高分院認邱毅已有一定查證基礎，若要求其達到偵查機關才能取得的證據程度，會過度限縮言論自由。"
    tags: [邱毅, 陳菊, 起訴, 無罪, 言論自由, 第104條]

  - id: F009
    statement: "賴惠員因2019年補選期間稱陳筱諭選舉『都是國共在操盤』遭選罷法第104條起訴，一審判4月；二審認定檢方未證明不實與真正惡意而改判無罪，最高法院2023年駁回檢方上訴，無罪確定。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S012, S013]
    evidence_summary: "此案是『中共操盤』政治歸因本身進入第104條刑事訴追、但最終無罪的直接案例，也提供法院對檢方舉證責任的明確說明。"
    tags: [賴惠員, 陳筱諭, 中共操盤, 第104條, 無罪確定]

  - id: F010
    statement: "張雅屏在2014屏東縣長選舉不實文宣案中，因違反選罷法散布謠言等被判刑2年10月、褫奪公權5年並定讞入監；司法院資料確認其確定終局判決適用選罷法第104條及第113條第3項。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S014, S015, S016]
    evidence_summary: "這是第104條不只啟動偵查或起訴，而確實走到定讞實刑與入監的歷史案例。"
    tags: [張雅屏, 潘孟安, 第104條, 定讞, 入監]

  - id: F011
    statement: "法院實務並不把『被第104條偵辦或起訴』視為不實言論或有罪的充分證明；邱毅、賴惠員、王威元與吳秉叡案部分被告都出現無罪結果，臺南高分院並明確指出『不實』及『真正惡意』應由檢方負完全舉證責任。"
    status: verified
    observed_at: "2026-10-21T10:24:00+08:00"
    source_ids: [S007, S010, S011, S012, S013]
    evidence_summary: "刑事程序本身與實體真偽判斷必須分層；這也是比較國家對政治資訊進行其他形式官方歸因時的重要基準。"
    tags: [舉證責任, 真正惡意, 無罪推定, 言論自由]

claims:
  - id: C001
    statement: "選罷法第104條只是紙上刑罰，實務上不會因政治言論或網路貼文啟動搜索、扣押、約談、具保或羈押等刑事程序。"
    status: contradicted
    supports: []
    contradicts: [F002, F004, F006, F010]
    related_facts: [F001]
