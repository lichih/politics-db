facts:
  - id: F001
    statement: "@lichihwu 的 2026-10-17 貼文在說明「比較認同柯文哲那一套」時，具體把認同對象描述為一套做事方法：面對政策問題應提出問題定義、數據、點位、限制與方案；文中沒有以柯文哲的人格完美、司法無罪或不可質疑作為支持理由。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S001]
    evidence_summary: "原文的正面主張集中在方法流程，並以條通個案要求問題與解法之間的可驗證連結。"
    tags: [柯文哲, 方法論, SOP, 專業]

  - id: F002
    statement: "在同串有人以「柯文哲都要去關了 還在造神」回覆後，@lichihwu 明確回答自己談的是「一套做事方法值不值得參考」，並主張一個人的司法案件與某套政策方法是否合理是不同命題。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "「造神」標籤與作者對自己命題範圍的澄清均可由同串原始 Threads 內容直接確認。"
    tags: [造神, 司法案件, 政策方法, 命題分離]

  - id: F003
    statement: "民進黨在 2026-05-13 正式提名沈伯洋時，賴清德以「一流人才」「市長不二人選」推薦，並以「國際視野的高度、跨域治理的廣度、對市民的溫度」及「法學的專業、溫暖的性格、對人性的深刻關懷」描述沈伯洋。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S004]
    evidence_summary: "民進黨官方提名新聞稿直接結合能力、專業與人格特質進行候選人推薦。"
    tags: [民進黨, 沈伯洋, 人格, 專業, 能力]

  - id: F004
    statement: "2026-09-29 民進黨官方新聞稿記錄沈伯洋把「洋流」描述為「溫暖」「充滿勇氣」「具備明確方向」，並把該象徵連結到民主前輩、新世代接棒與守護台灣。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S005]
    evidence_summary: "「洋流」在官方公開敘事中不只是活動名稱，也承載勇氣、溫暖、方向與民主傳承等價值意涵。"
    tags: [洋流, 勇氣, 溫暖, 民主敘事]

  - id: F005
    statement: "2026-09-30 民進黨官方新聞稿記錄賴清德把「洋流」描述為「溫暖、豐盛、有方向且充滿力量」，並稱其能照顧各族群與家庭、帶領台北走向世界、改變選舉風氣及擺脫負面攻擊。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S006]
    evidence_summary: "民進黨主席公開把候選人品牌符號同時連結人格／價值與治理能力。"
    tags: [洋流, 賴清德, 溫暖, 正面選舉]

  - id: F006
    statement: "2026-10-04 民進黨官方新聞稿記錄賴清德稱沈伯洋「始終把市民放在第一位」、展現謙卑、不走負面攻擊捷徑，並以替對手解圍等例子稱「這就是沈伯洋的高度」；同文又稱他把對手攻擊當成展開對話的起點。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S007]
    evidence_summary: "官方競選敘事直接把具體競選行為上升為謙卑、正向與「高度」等人格評價。"
    tags: [謙卑, 高度, 正向, 人格敘事]

  - id: F007
    statement: "2026-10-05 民進黨官方新聞稿由發言人吳崢稱沈伯洋的「溫暖正面的選舉模式」獲市民信任肯定，並以「小水滴匯聚成為洋流」描述支持者與候選人品牌。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S008]
    evidence_summary: "「溫暖正面」與「小水滴／洋流」是黨中央官方使用的公開競選敘事。"
    tags: [民進黨, 洋流, 溫暖正面, 支持者]

  - id: F008
    statement: "2026-10-04 沈伯洋競總成立大會上，副總統蕭美琴公開稱沈伯洋是「行動知識庫」且「無比謙卑」，並希望支持者以溫暖堅定的腳步跟著洋流走。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S009]
    evidence_summary: "中央社對公開站台致詞的報導，同時記錄知識能力與謙卑人格的稱讚。"
    tags: [蕭美琴, 行動知識庫, 謙卑, 洋流]

claims:
  - id: C001
    statement: "@lichihwu 的 2026-10-17 貼文是以「柯文哲人格完美、司法無罪或不可質疑」作為政策主張可信的理由。"
    status: contradicted
    supports: []
    contradicts: [F001, F002]
    related_facts: []
    reasoning_notes: "原文與後續澄清把評價對象限定在方法／政策分析流程；是否稱得上「造神」仍可作修辭爭論，但不能把文本改寫成對人格完美或司法無罪的主張。"

  - id: C002
    statement: "民進黨與主要站台者在沈伯洋 2026 台北市長競選公開敘事中，反覆把候選人品牌與溫暖、謙卑、勇氣、高度、正向，以及知識／專業能力等特質綁定。"
    status: supported
    supports: [F003, F004, F005, F006, F007, F008]
    contradicts: []
    related_facts: []
    reasoning_notes: "這是對多個官方／公開站台文本的可重複內容歸納；不等於判定這些稱讚為虛假。"

  - id: C003
    statement: "上述公開敘事已足以在事實層直接證明民進黨正在「造神」，或沈伯洋被塑造成「聖人神」。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F003, F004, F005, F006, F007, F008]
    reasoning_notes: "「造神」「聖人神」屬政治評價，需要先定義操作標準並處理一般候選人正面行銷的比較基準；facts 可證明人格／能力品牌存在，但不能把評價詞直接當事實。"

  - id: C004
    statement: "把 S001 稱為「SOP／方法論崇拜」比把它描述成「以柯文哲人格不可錯為核心」更符合原始文本。"
    status: supported
    supports: [F001, F002]
    contradicts: []
    related_facts: []
    reasoning_notes: "此處只比較兩種文本描述的貼合程度；「SOP神」仍是修辭性標籤，不是資料庫事實分類。"

