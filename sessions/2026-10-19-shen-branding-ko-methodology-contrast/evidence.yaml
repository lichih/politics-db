notes:
  - "既有 sessions/2026-10-18-shen-tiaotong-quote/evidence.yaml 已保存沈伯洋10月17日條通回應的原話證據，本檔不重複建立同一事實。"
  - "本檔區分「有人使用造神標籤」、候選人品牌實際使用哪些人格／能力描述，以及「是否構成造神」三個層次。"
