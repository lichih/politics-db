facts:
  - id: F001
    statement: "ercx93 在 2026-10-18 原貼文明確表示：「討厭某個政黨不是你無條件支持其他政黨的理由」；同文又表示，若不想投給他所稱「已經紅到不行」的國民黨與民眾黨，「那我只剩下民進黨可以投」。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S001]
    evidence_summary: "原始 Threads 貼文本身直接支持這兩段文字同時存在。"
    tags: [政黨支持, 民進黨, 國民黨, 民眾黨]

  - id: F002
    statement: "ercx93 的可見 profile 樣本中，2026-10-04 至 10-05 有多篇針對國民黨、蔣萬安或相關政治行為的負面評論；包括稱國民黨「早就變質」、存在「親共舔共派」，稱台北市有「有牌的流氓」，以及稱大規模抗爭的「始作俑者是變了質的國民黨」。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S002]
    evidence_summary: "連接瀏覽器回傳的 profile 文字直接列出上述可見貼文與日期。"
    tags: [公開發言, 國民黨, 蔣萬安, 負面評價]

  - id: F003
    statement: "ercx93 在 2026-09-29 可見貼文中批評「深藍的人」心裡有「既定的、政黨餵給他們的、改變不了的答案」，並稱即使答案已被告知錯誤、已闢謠仍不改變。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S002]
    evidence_summary: "profile 可見原文直接包含此一對政治支持者認知模式的批評。"
    tags: [深藍, 政黨認同, 查證標準]

  - id: F004
    statement: "ercx93 在 2025-08-27 可見貼文中主張「思考的意義不是急著下定論」，批評政治討論以帶有定論色彩的觀點作為論據，並認為簡單強烈的政治口號容易被直接接受。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S002]
    evidence_summary: "profile 可見原文直接陳述其對政治思考、查證與口號的標準。"
    tags: [思考, 查證, 政治口號]

  - id: F005
    statement: "在 2026-10-19 連接瀏覽器回傳的 ercx93 可見 profile 樣本中，本次未觀察到明確批評民進黨的貼文。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S002]
    evidence_summary: "這是對當次已載入可見樣本的查詢結果，不是對帳號全部歷史內容的全稱判斷。"
    verification_notes:
      - "not_found != never_existed；不能據此寫成「ercx93 從未批評民進黨」。"
      - "若作者提出可核對的反例，應追加來源與更新判斷。"
    tags: [not_found, 民進黨, 公開發言樣本]

  - id: F006
    statement: "ercx93 在同串後續貼文把「自己是否無條件支持民進黨」交由他人說明推論方式，並以「你認識我嗎」反問。"
    status: verified
    observed_at: "2026-10-19T12:24:00+08:00"
    source_ids: [S003]
    evidence_summary: "原始後續 Threads 貼文直接記載此反問；是否足以反駁外部歸納另屬推論問題。"
    tags: [無條件支持, 推論, 舉證]

claims:
  - id: C001
    statement: "ercx93 的公開發言足以證明他一生從未批評過民進黨。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F005]
    reasoning_notes: "本次只檢視瀏覽器當下回傳的可見 profile 樣本；未找到反例只能記錄 bounded not_found，不能上升為帳號全歷史的全稱命題。"

  - id: C002
    statement: "截至本次可見樣本，ercx93 的公開政治發言呈現明顯不對稱：可見多篇對國民黨／蔣萬安的負面評論，同一樣本內未見明確批評民進黨。"
    status: supported
    supports: [F002, F005]
    contradicts: []
    related_facts: [F003, F004]
    reasoning_notes: "這只描述本次可見公開樣本的方向性，不推定私人想法，也不等於證明永遠或無條件支持任何政黨。"

  - id: C003
    statement: "「只剩民進黨可以投」在該貼文中是以政黨為選擇單位，而不是以特定候選人或單一政策為選擇單位的表述。"
    status: supported
    supports: [F001]
    contradicts: []
    related_facts: []
    reasoning_notes: "句子直接以國民黨、民眾黨、民進黨三個政黨作為排除與選擇對象；不因此自動推出其所有選舉皆只看政黨。"

  - id: C004
    statement: "現有資料已足以把 ercx93 的內心狀態定性為「無條件支持民進黨」。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F001, F002, F005, F006]
    reasoning_notes: "公開行為可支持強烈政黨傾向與樣本不對稱的歸納；「無條件」若被理解為任何情境都不撤回支持，仍是更強命題。若作者能提出同一標準批評民進黨的反例，應納入修正。"

