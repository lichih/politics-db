    observed_at: "2026-10-17T16:05:00+08:00"
    retrieval_status: reachable
    notes:
      - "第54條規定總預算未於期限完成審議時，仍得覈實辦理『履行其他法定義務收支』。"
      - "第79條規定各機關因『依法律增加業務或事業致增加經費』時，得請求提出追加歲出預算；第80條規定追加歲出經費由中央財政主管機關籌劃財源平衡。"
      - "第91條規定立法委員所提法律案大幅增加歲出或減少歲入者，應先徵詢行政院意見，指明彌補資金來源；必要時並應同時提案修正其他法律。"

