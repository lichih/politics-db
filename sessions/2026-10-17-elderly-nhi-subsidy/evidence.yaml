notes:
  - "本題首要分析順序：先確認修法前誰在付保費，再比較中央與地方的財政層級；不能直接把約400億元全描述成新增加在青壯年身上的既有保費負擔。"
  - "地方『彈性』主要描述政策可撤回性與責任分配，不代表成本消失。"
  - "中央法定化的代價是壓縮未來年度財政裁量；其政策價值則是提高全國保障的一致性與穩定性。"
  - "『排富』回答的是誰有資格被公共財源補助，不等於回答修法前的自付保費究竟由老人本人還是扶養家庭實際承擔。"
  - "中央財源與地方財源不是『全民稅金 vs 地方自己的錢』的乾淨二分；統籌分配稅款即是國稅依法轉為地方稅課收入。"
  - "對中央執政者的政治效果具有雙面性：法定給付會壓縮行政財政裁量，但若施行，中央政府也是實際執行全國福利的政府，且該福利較不易被年度預算單獨撤回。這是分析，不記為事實動機。"
  - "必須嚴格區分法律案與預算案：本次先由《老人福利法》創設實體法義務，後續年度預算才處理履行該義務所需經費。憲法第70條不得增加支出的直接文義對象是行政院所提預算案。"
  - "立委提法律案造成大額歲出仍非沒有財政限制；《財政紀律法》第5條、《預算法》第91條及《財政收支劃分法》第38條之1共同要求財源規劃／徵詢程序。至本案是否已充分履行這些要求，以及違反時的法律效果，維持 unresolved。"
  - "預算法第54條及第79條顯示，制度上存在『法律義務先成立、年度預算或追加預算再提供財源』的結構；因此法律案與預算案不能互相代換。"
  - "2026-10-17重新逐一複核地方政見：可安全使用的精確措辭是黃世杰全面補助、鄭朝方全額補助不排富、莊競程免費、陳品安全額補助、陳素月全額補助、劉建國免繳且主張地方負擔、王美惠僅確認補助、陳亭妃加碼不排富；林俊憲為2025初選歷史政見；周春米2027取消排富但每月最高826元；賴清德2026-10-17公開稱屏東方案『這樣就妥當了』。"
  - "成本語言必須拆開：行政院399.65億元是新制度下中央預估所需經費；不是新增醫療服務成本，也不能在沒有原付款人與既有補助重疊資料前稱為399.65億元的淨社會成本或精確移轉額。"
  - "衛福部長石崇良稱修法對健保『實質挹注一點都沒有增加』，可作為『健保基金收入與保費付款責任是兩件事』的直接證據；評論不得把中央替被保險人付保費寫成健保憑空多得到400億元。"
  - "403萬×65歲以上平均自付保費9912元約為399.45億元，與399.65億元高度接近，但因未取得官方計算底稿，此處只能作數值檢核，不得宣稱已確認官方公式。"
  - "健保署113年表45提供重要量化基準：老人專屬地方補助列項約143.89億元，連同中央70歲以上中低收入與離島65歲以上老人約158.47億元。它證明修法前已有相當規模公共支出，但不得拿113年數字直接扣2026的399.65億元。"
