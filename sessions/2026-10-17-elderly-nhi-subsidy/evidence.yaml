claims:
  - id: C001
    statement: "「這次修法就是拿年輕人繳的健保費去替老人做福利。」"
    status: contradicted
    contradicts: [F001, F004]
    reasoning_notes: "三讀文字是由中央主管機關補助符合條件者保費；是否以保費、稅收或其他總預算調整承擔屬財源問題。對依附投保家庭而言，修法前已有子女家庭負擔。"

  - id: C002
    statement: "「地方政府出錢就不是全民稅金，與其他縣市人民無關。」"
    status: contradicted
    contradicts: [F012, F013]
    reasoning_notes: "地方財源包含由國稅統籌分配而來的稅課收入及中央補助；不能把地方預算理解為完全封閉於該縣市居民繳納的財源。"

  - id: C003
    statement: "「地方補助比較有彈性，所以已解決世代負擔或財政成本問題。」"
    status: unsupported
    related_facts: [F004, F008]
    reasoning_notes: "地方彈性改變的是誰承擔與能否撤回政策，沒有使原本的保費成本消失；地方縮減補助時，成本可回到老人本人或扶養家庭。"

  - id: C004
    statement: "「中央法定補助與地方年度補助的核心差異只是誰出錢。」"
    status: contradicted
    contradicts: [F006, F007, F008, F009]
    reasoning_notes: "差異還包括全國或地方的保障基準、法律拘束程度、年度可撤回性與地域差異。"

  - id: C005
    statement: "「民進黨完全不敢在自己執政縣市提出由地方政府補助老人健保。」"
    status: contradicted
    contradicts: [F011]
    reasoning_notes: "台南陳亭妃與屏東周春米是直接反例。可討論政見分布是否大量集中在非民進黨執政縣市，但不能寫成絕對命題。"

  - id: C006
    statement: "「目前民進黨地方參選人的相關政見分布是6個非執政縣市＋2個執政縣市。」"
    status: contradicted
    contradicts: [F010, F011]
    reasoning_notes: "重新逐一核實後，至少可確認7個非民進黨現任執政縣市案例，加上台南、屏東兩個民進黨執政案例；先前聊天中的6+2計數不應再沿用。"

  - id: C007
    statement: "「把這項補助法定化後，立法院未來任何情況都絕對不能調整這筆支出。」"
    status: contradicted
    contradicts: [F006, F007]
    reasoning_notes: "法定化提高變更門檻，但法律仍可經立法程序修改或廢止；正確說法是不能只靠年度預算決定就消滅法律義務。"

  - id: C008
    statement: "「不立法等於完全沒有任何老人健保補助。」"
    status: contradicted
    contradicts: [F008, F011]
    reasoning_notes: "地方或行政政策仍可提供補助；差異是欠缺全國一致且較難以年度政策撤回的法定保障。"

  - id: C009
    statement: "「只要立法委員提出的法律案會增加中央政府支出，就當然違反憲法第70條。」"
    status: contradicted
    contradicts: [F014, F015, F016]
    reasoning_notes: "憲法第70條直接規範行政院所提預算案；釋字391明確區分法律案與預算案，而財政紀律法第5條另行規範立委所提、會大幅增加歲出的法律案。是否另有權力分立或財政憲法上的違憲問題，仍須依具體法律內容與憲法判斷，不能僅以第70條文字直接推出。"

  - id: C010
    statement: "「本次老人福利法修法就是立法院在預算案中替中央增加近400億元支出。」"
    status: contradicted
    contradicts: [F014, F015]
    reasoning_notes: "本次三讀標的是《老人福利法》修正法律案；近400億元是行政院估計未來履行法律義務所需的年度財政支出，不是立法院在年度預算案中直接加列同額科目。"

  - id: C011
    statement: "「立法院只要用法律增加政府支出，就是繞過預算權，因此法律本身當然無效。」"
    status: contradicted
    contradicts: [F018, F019, F020]
    reasoning_notes: "現行預算法不但預設法律可先增加業務並由追加預算接續，亦另以第91條規範立委增加歲出法律案的財源程序。真正問題是程序與權力分立界線，不是『增加支出即當然無效』。"

  - id: C012
    statement: "「本案既然是法律案，就不需要交代財源。」"
    status: contradicted
    contradicts: [F016, F020]
    reasoning_notes: "法律案與預算案雖不同，但增加歲出的法律案仍受財政紀律法第5條、預算法第91條及財政收支劃分法第38條之1等財源規範。"

  - id: C013
    statement: "「這次修法創造了約400億元新的健保醫療成本或讓健保基金多支出／多取得約400億元。」"
    status: contradicted
    contradicts: [F034, F036, F038]
    reasoning_notes: "約399.65億元是中央替符合資格者負擔自付健保費的預估財政需求。老人原本即有自付保費，且中央與地方已有部分補助；石崇良更明言修法對健保實質挹注一點都沒有增加。醫療給付成本與『誰替被保險人支付保費』是不同帳。"

  - id: C014
    statement: "「約400億元就是精確的家庭／地方向中央移轉規模。」"
    status: unsupported
    related_facts: [F034, F035, F036, F039]
    reasoning_notes: "目前尚缺403萬預估受益者的原付款人分布，以及新制與既有中央、地方補助的逐人重疊額。可確認中央毛支出規模，不能把全部399.65億元直接指定為某一來源的淨移轉。"

  - id: C015
    statement: "「三讀後每名20至64歲年輕人依法一定每年多繳約2690元健保費。」"
    status: contradicted
    contradicts: [F037]
    reasoning_notes: "2690元是衛福部假設全部經費改由健保保費支應後，以20至64歲人口平均分攤的情境值；不是三讀法律設定的定額加收。"

  - id: C016
    statement: "「中央補助一定會從65歲以下者的健保費籌措。」"
    status: contradicted
    contradicts: [F037]
    reasoning_notes: "衛福部同時提出保費與中央稅收兩種情境，顯示財源並未由三讀條文鎖定為青年健保費。後續實際財源仍待預算與政策決定。"

  - id: C017
    statement: "「地方政府補助老人健保，不會使用或影響年輕世代負擔；只有中央補助才會。」"
    status: contradicted
    contradicts: [F012, F013, F034]
    reasoning_notes: "地方方案同樣使用公共財源，且地方財源包含統籌分配稅款與中央補助。能合理區分的是財政責任層級、地方政策可逆性與全國保障程度，而非『地方沒有世代負擔、中央才有』。"

  - id: C018
    statement: "民進黨2026-10-21官方貼文所稱『在野黨並沒有寫下排富規則』，若理解為三讀條文本身沒有所得資格限制，與已確認的三讀內容不符。"
    status: contradicted
    contradicts: [F001, F041, F044]
    reasoning_notes: "三讀已有未達申報標準或綜所稅率未達20%的資格條件。可爭論門檻是否過寬，但那是排富強度問題，不是有無所得限制。"

  - id: C019
    statement: "民進黨官方貼文把每名年輕人每年多繳約2690至3000元直接寫成不附條件、法律已確定的修法結果。"
    status: contradicted
    contradicts: [F043]
    related_facts: [F037]
    reasoning_notes: "貼文原文有明確寫『如果由健保費支出』，因此不能批評它在這一數字上完全抹去條件。真正需要檢驗的是後續如何由多種財源情境推到單一的世代不正義評價。"

  - id: C020
    statement: "僅憑約400億元中央支出估算與2690元等財源情境，就足以把本次修法客觀定性為嚴重的世代不正義。"
    status: unsupported
    related_facts: [F004, F005, F034, F037, F042, F043, F045]
    reasoning_notes: "若要判斷代際淨負擔，至少還需知道修法前實際付款人分布、既有中央與地方補助重疊、最終財源，以及不同世代同時作為納稅人、扶養者與受益人的效果。現有400億元是中央毛支出需求，2690元是特定財源假設，兩者不足以單獨完成代際淨效果分析。"

  - id: C021
    statement: "憲法第70條本身可以直接證明本次老人福利法修正法律案因增加中央支出而違反憲法。"
    status: contradicted
    contradicts: [F018, F019, F020, F021, F022]
    reasoning_notes: "第70條直接限制的是立法院對行政院所提預算案增加支出；本案是法律案。增加歲出的立委法律案仍受預算法91條、財政紀律法5條與財劃法38條之1等規範，但不能只靠第70條完成違憲結論。"

  - id: C022
    statement: "長者健保費補助在制度上本來就必須由地方政府依財力自行負擔，中央建立全國補助基準屬於違反既定中央地方分工。"
    status: unsupported
    related_facts: [F010, F011, F012, F013, F014, F015, F016, F034]
    reasoning_notes: "『中央負責制度、地方依財力擴大照顧』可以是政策分工主張；現有法制與實務同時存在中央補助、地方補助及中央法律建立全國義務的制度空間，不能把一種政策偏好寫成唯一法定分工。"

  - id: C023
    statement: "「民進黨對本次長者健保中央補助的地方立場是一致反對，只有在野黨支持由中央承擔。」"
    status: contradicted
    contradicts: [F046, F047]
    reasoning_notes: "至少嘉義縣長翁章梁與台南市政府均公開對中央承擔符合條件長者健保費表示正面支持。這不自動證明中央黨政立場『雙標』，但足以證明民進黨內部存在可觀察的中央—地方立場張力，不能把黃國昌提出此矛盾的比較直接定性為虛構。"

