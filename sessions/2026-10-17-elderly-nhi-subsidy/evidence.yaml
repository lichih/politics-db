    observed_at: "2026-10-17T15:40:00+08:00"
    retrieval_status: reachable
    notes:
      - "第5條規定：中央政府各級機關、立法委員所提法律案大幅增加政府歲出或減少歲入者，應先具體指明彌補資金之來源。"
      - "此規定明確以「立法委員所提法律案大幅增加政府歲出」作為可受財政紀律規範的議案類型。"

