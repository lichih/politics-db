facts:
  - id: F001
    statement: "2026-10-16立法院三讀修正《老人福利法》第22條，符合最近一年綜合所得未達申報標準或綜所稅率未達20%條件的65歲以上長者，其全民健康保險費由中央主管機關全額補助。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S001]
    evidence_summary: "三讀內容由中央社報導確認。"
    tags: [老人福利法, 健保費, 中央補助, "2026"]

  - id: F002
    statement: "現行《全民健康保險法》將無職業之直系血親尊親屬列為眷屬；第一類至第三類被保險人的眷屬保險費由被保險人繳納，最多計三口。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S002, S003]
    evidence_summary: "全民健康保險法第2條、第18條及施行細則第18條直接規定眷屬資格與依附投保。"
    tags: [全民健保, 眷屬, 父母, 依附投保]

  - id: F003
    statement: "對一般受僱者，現行健保法規的本人及眷屬保費負擔並非全由家庭承擔；法定比例為被保險人及眷屬自付30%、投保單位60%、中央政府補助10%。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S002]
    evidence_summary: "全民健康保險法第27條。"
    tags: [全民健保, 保費負擔, 雇主, 政府補助]

  - id: F004
    statement: "因此，對父母以眷屬身分依附工作中子女投保的家庭，老人健保自付保費在修法前即可能形成子女家庭的既有支出；中央補助不是把全部成本從零新增到青壯年身上。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S002, S003]
    evidence_summary: "眷屬保費由被保險人繳納，故至少對依附投保家庭存在既有家庭負擔；但目前未取得403萬預估受益者中依附投保者比例。"
    tags: [家庭負擔, 青壯年, 眷屬投保, 負擔移轉]

  - id: F005
    statement: "目前沒有查到足以支持『403萬預估受益長者大多數原本都由子女繳健保費』的官方比例資料。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S001, S002]
    evidence_summary: "現行法可證明依附投保機制存在，但現有來源不足以量化本次預估受益者中的依附投保占比。"
    tags: [資料缺口, 依附投保, 受益人口]

  - id: F006
    statement: "《預算法》第5條所稱法定經費，是依設定條件於法律存續期間按年支用，其設定、變更或廢止須以法律為之。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S004]
    evidence_summary: "預算法第5條直接規定。"
    tags: [預算法, 法定經費, 法定保障]

  - id: F007
    statement: "若《老人福利法》第22條三讀修正內容完成公布施行，中央對符合條件者的補助義務將具有法律上的持續性；欲變更補助條件原則上需透過修法，而非單靠某一年度不編列或刪減政策預算即可消滅法律義務。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S001, S004]
    evidence_summary: "三讀條文創設中央補助義務；預算法第5條說明法定經費的持續性與變更方式。法案目前仍須完成後續憲政程序。"
    tags: [老人福利法, 法定經費, 年度預算, 保障強度]

  - id: F008
    statement: "地方政府自行辦理老人健保費補助，與中央依法建立全國性補助的制度效果不同：前者可因地方財力與政策選擇形成不同補助標準，後者則將符合條件者的基本補助責任提升為全國共同規則。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S001, S006, S012]
    evidence_summary: "現有各縣市標準不一已為朝野共同承認；修法目的之一即為統一條件，而劉建國明確主張地方依財政能力自行推動。"
    tags: [地方自治, 中央補助, baseline, 地域差異]

  - id: F009
    statement: "中央補助與地方補助並非互斥；中央建立全國基本補助後，地方仍可用地方預算加碼更寬的資格或更高補助。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S014]
    evidence_summary: "陳亭妃在中央三讀後即表示台南未來仍要加碼不排富，提供中央補助與地方加碼並存的直接案例。"
    tags: [中央地方, 加碼, baseline]

  - id: F010
    statement: "截至2026-10-17再次逐一複核，至少可確認七名民進黨縣市長參選人在民進黨非現任地方執政的縣市提出長者健保補助或免繳政見：桃園黃世杰、新竹縣鄭朝方、新竹市莊競程、苗栗陳品安、彰化陳素月、雲林劉建國、嘉義市王美惠。"
    status: verified
    observed_at: "2026-10-17T20:46:03+08:00"
    source_ids: [S030, S025, S023, S026, S024, S031, S032]
    evidence_summary: "逐一重新查得候選人政見報導；王美惠僅確認有老人健保費補助，不擴張其補助強度。此處使用『至少』，不宣稱已窮盡所有民進黨參選人。"
    tags: [民進黨, 地方選舉, 長者健保, 政見, "2026"]

  - id: F011
    statement: "民進黨現任執政縣市也存在地方承擔長者健保補助的確認案例：台南陳亭妃主張既有制度再加碼不排富；屏東現任縣長周春米宣布2027年起取消排富、65歲以上長者每月最高補助826元。"
    status: verified
    observed_at: "2026-10-17T20:46:03+08:00"
    source_ids: [S033, S028]
    evidence_summary: "台南與屏東是不能忽略的反例，因此不得寫成『民進黨從不在自己執政縣市推地方買單』；屏東並非無上限全額補助，而是每月最高826元。"
    tags: [民進黨, 台南, 屏東, 反例, 地方補助]

  - id: F012
    statement: "地方政府的財源不能簡化為『與其他縣市人民無關的地方自己的錢』；現行《財政收支劃分法》明定部分所得稅、營業稅與貨物稅等國稅收入進入中央統籌分配後成為地方稅課收入。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S005]
    evidence_summary: "財劃法第8條與第16條之1直接規定統籌分配稅款來源與地方列帳方式。"
    tags: [財劃法, 統籌分配稅款, 地方財源, 國稅]

  - id: F013
    statement: "屏東全面補助案例中，周春米公開將政策擴張與中央支持地方的稅款、補助款增加及縣府財政餘裕連結；2027年全面補助預估由縣府負擔約15.5億元。"
    status: verified
    observed_at: "2026-10-17T14:41:10+08:00"
    source_ids: [S015]
    evidence_summary: "周春米施政報告相關報導直接記載其財源說明。"
    tags: [屏東, 周春米, 財源, 地方預算]

  - id: F014
    statement: "2026-10-16三讀的《老人福利法》第22條修正屬法律案，不是年度預算案；其內容先以實體法創設中央補助義務，後續年度經費再進入預算編列與審議。"
    status: verified
    observed_at: "2026-10-17T15:40:00+08:00"
    source_ids: [S001, S017]
    evidence_summary: "本案為修正《老人福利法》的法律案；釋字391明確區分法律案與預算案之提案權、內容與效力。"
    tags: [法律案, 預算案, 老人福利法, 制度區分]

  - id: F015
    statement: "憲法第70條文字直接限制的是『立法院對於行政院所提預算案』不得增加支出；不能僅因某法律案未來增加政府支出，就把該法律案直接等同於預算案而套用第70條。"
    status: verified
    observed_at: "2026-10-17T15:40:00+08:00"
    source_ids: [S016, S017]
    evidence_summary: "憲法第70條及釋字391均將限制對象界定在行政院所提預算案，並明確區別通常法律案。"
    tags: [憲法70條, 法律案, 預算案, 增加支出]

  - id: F016
    statement: "《財政紀律法》第5條明文處理『立法委員所提法律案大幅增加政府歲出或減少歲入』的情形，要求先具體指明彌補資金來源。"
    status: verified
    observed_at: "2026-10-17T15:40:00+08:00"
    source_ids: [S018]
    evidence_summary: "財政紀律法第5條直接規定。"
    tags: [財政紀律法, 立法委員提案, 財源, 增加歲出]

  - id: F017
    statement: "法律若已生效，且構成要件具備並未授予行政機關是否給付的決策或選擇裁量，依釋字520所述，行政機關原則上即負有實現該法律效果的義務；年度預算與實體法義務屬不同層次。"
    status: verified
    observed_at: "2026-10-17T15:40:00+08:00"
    source_ids: [S019]
    evidence_summary: "釋字520區分法律效果與法定預算的授權功能，並指出無裁量時行政機關有依法作成行為的義務。"
    tags: [依法行政, 法律義務, 法定預算, 釋字520]

  - id: F018
    statement: "《預算法》明文預設『法律先創設義務、預算再提供履行經費』的情形：第79條允許因法律增加業務或事業致增加經費時提出追加歲出預算，第80條再由中央財政主管機關籌劃財源平衡。"
    status: verified
    observed_at: "2026-10-17T16:05:00+08:00"
    source_ids: [S020]
    evidence_summary: "預算法第79條、第80條直接規定。"
    tags: [預算法, 追加預算, 法律義務, 財源]

  - id: F019
    statement: "《預算法》第54條在總預算未於期限完成審議時，仍允許履行其他法定義務之收支，顯示法定義務並不因年度預算尚未完成而當然消失。"
    status: verified
    observed_at: "2026-10-17T16:05:00+08:00"
    source_ids: [S020]
    evidence_summary: "預算法第54條直接規定；此條適用情境是總預算逾期未完成審議，不能擴張成所有預算被刪減情境。"
    tags: [預算法54條, 法定義務, 總預算]

  - id: F020
    statement: "立委提出會大幅增加歲出的法律案並非無程序限制；除《財政紀律法》第5條外，《預算法》第91條要求先徵詢行政院意見並指明彌補資金來源，《財政收支劃分法》第38條之1亦要求增加財政負擔時事先籌妥經費或於立法時明文規定相對收入來源。"
    status: verified
    observed_at: "2026-10-17T16:05:00+08:00"
    source_ids: [S018, S020, S021]
    evidence_summary: "三部法律形成對增加支出法律案的財政程序規範；不是一律禁止，而是要求財源與程序控制。"
    tags: [預算法91條, 財政紀律法, 財政收支劃分法38條之1, 財源]

  - id: F021
    statement: "立法院預算中心指出，《財政紀律法》第5條對何謂『大幅增加』尚無明確定義，且缺乏專責機關監督追蹤增加歲出法律案之替代財源規劃，因此僅憑條文字面仍不足以直接判定個案違反後的法律效果。"
