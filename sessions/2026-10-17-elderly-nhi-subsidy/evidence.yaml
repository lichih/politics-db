  - id: S017
    source_type: primary
    publisher: "憲法法庭"
    title: "司法院釋字第391號解釋"
    url: "https://cons.judicial.gov.tw/docdata.aspx?fid=100&id=310572"
    observed_at: "2026-10-17T15:40:00+08:00"
    retrieval_status: reachable
    notes:
      - "解釋明確區分法律案與預算案：法律案可由關係院或立法委員提案，預算案僅得由行政院提出；法律具有持續反覆規範效力，預算案以年度具體數字授權支出。"
      - "立法院審議行政院所提預算案時受憲法第70條限制，不得增加支出。"

