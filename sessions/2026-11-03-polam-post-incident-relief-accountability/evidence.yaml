notes:
  - "本session刻意以『事件後續救濟與責任追究』為論證中心；不得拿後續處置成果直接洗掉或證明前端食安應變是否『第一時間非常機警』。"
  - "目前證據整體上支持北市府在後續救濟面向有具體且產生結果的行動；證據不要求形式上的正反平衡，而要求結論強度與事實強度一致。"
  - "假扣押爭議應維持權利主體與證據邊界：可證明市府早期提供協助、家屬及相關團體未提出聲請；公開資料僅可證寶林自述為虧損狀態，不能自行擴張成完全無資產可扣。"
  - "跨session總結邊界：前端應變與事後救濟須分開評價。前端是否足以稱為『第一時間非常機警』，見 sessions/2026-11-03-polam-early-response-control-yuan-audit/evidence.yaml，該session目前結論為證據不足以支持如此強的整體評價；本session則支持北市府在後續受害者救濟、民事求償與責任追究上有具體且產生結果的行動。不得以後者反推前者，也不得因前者有爭議而抹去後者成果。"
  - "目前不將本案直接promotion成Fact公開文章；politics-db已足以保存證據與結論邊界，是否形成Fact文章留待另行判斷。"
