facts:
  - id: F001
    statement: "北市法務局於2024年3月27日啟動消保行政調查，3月28日邀集寶林、大食代、遠百及相關產險公司說明；3月29日確認遠百商業綜合責任保險承保範圍包含A13寶林，4月1日確認大食代公共意外責任保險附加食品中毒條款亦涵蓋該店，4月2日再邀集業者、產險與保險公證人研商理賠程序。"
    status: verified
    observed_at: "2026-11-03T19:10:00+08:00"
    source_ids: [S001]
    evidence_summary: "市府在寶林自身保險失效之外，早期即另行盤點百貨與美食街相關保險，並建立後續理賠協調路徑。"
    tags: ["2024", "寶林茶室", "保險理賠", "消保行政調查"]

  - id: F002
    statement: "北市法務局於2024年3月28日起即提供受害者及家屬法律諮詢與假扣押律師費協助；2024年6月3日並表示，家屬如有委任律師聲請假扣押需求可獲費用協助，而當時犯保協會與消基會經評估均無提出假扣押規劃。"
    status: verified
    observed_at: "2026-11-03T19:10:00+08:00"
    source_ids: [S002, S007]
    evidence_summary: "公開紀錄顯示假扣押並非事後才被提出，而是早期法律協助選項之一；當時未實際提出聲請，不能直接等同市府未考慮財產保全。"
    tags: ["2024", "假扣押", "法律協助", "犯保協會", "消基會"]

  - id: F003
    statement: "寶林受害者民事損害賠償債權的假扣押，原則上應由具有請求權的債權人依法聲請；北市府並非受害者，不能僅因主管機關身分逕以自己名義保全家屬的民事損害賠償債權。"
    status: verified
    observed_at: "2026-11-03T19:10:00+08:00"
    source_ids: [S002, S007]
    evidence_summary: "此事實處理的是權利主體與程序；不代表市府完全沒有協助財產保全的能力，市府可提供法律諮詢與律師費補助。"
    tags: ["假扣押", "民事訴訟", "權利主體", "法律程序"]

  - id: F004
    statement: "北市法務局於2024年4月19日提供團訟意願書、5月1日函詢消基會是否協助團訟；消基會自身紀錄確認於5月20日正式函覆同意，在受讓20人以上損害賠償請求權後提起團體訴訟。"
    status: verified
    observed_at: "2026-11-03T19:10:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "市府與消基會雙方資料可交叉確認團訟協作時序。"
    tags: ["2024", "團體訴訟", "消基會", "民事求償"]

  - id: F005
    statement: "寶林自身產品責任險及公共意外責任險失效後，北市法務局持續協調百貨業者、產險公司、保險公證人及保險法專家，並多次召開調解會議；最終6名亡者家屬中5名經市府消費爭議調解獲償，另1名私下和解。"
    status: verified
    observed_at: "2026-11-03T19:10:00+08:00"
    source_ids: [S006, S007, S009]
    evidence_summary: "後續保險與調解路徑產生實際獲償結果；中央社報導與市府資料一致。"
    verification_notes:
      - "『亡者家屬皆獲償』僅指6名亡者家屬，不應擴張為所有傷者及家屬均已完成賠償。"
    tags: ["理賠", "調解", "亡者家屬", "實際獲償"]

  - id: F006
    statement: "市府先以重大災害民間賑災捐款代墊重症醫療費983萬8,457元，後由社會局委任律師代位求償；百貨業者及產險公司於2025年6月13日將代墊費用全數匯回善款專戶。"
    status: verified
    observed_at: "2026-11-03T19:10:00+08:00"
    source_ids: [S006, S007, S009]
    evidence_summary: "民間捐款在此項目扮演緊急代墊角色，後續款項已追回；不能描述成由善款最終承擔業者應負的醫療費責任。"
    tags: ["醫療費", "代墊", "代位求償", "善款"]

  - id: F007
    statement: "消基會於2024年12月11日代表30名受害者及家屬向台北地方法院提起團體訴訟，求償293,019,053元；消基會最新公開進度表列有2025年7月22日一審言詞辯論及2026年2月13日、4月24日調解庭，案件尚無終結紀錄。"
    status: verified
    observed_at: "2026-11-03T19:10:00+08:00"
    source_ids: [S004, S005, S007, S009]
    evidence_summary: "亡者家屬部分已有調解／和解結果，但其他受害者的團體訴訟仍在進行，兩者不能混為同一完成狀態。"
    tags: ["團體訴訟", "30人", "293019053", "訴訟進行中"]

  - id: F008
    statement: "北市衛生局就寶林案未投保、提供不實資料、逾期食品及技術證照人員比例不符等違規，曾公布累計裁罰406萬元；北市法務局於2026年表示6件行政裁罰均已移送法務部行政執行署強制執行。"
    status: verified
    observed_at: "2026-11-03T19:10:00+08:00"
    source_ids: [S006, S007, S008, S009]
    evidence_summary: "行政究責不只停留在裁罰決定，6件裁處已進入行政執行程序。"
    tags: ["行政裁罰", "406萬元", "行政執行", "衛生局"]

  - id: F009
    statement: "北市法務局2024年4月公開紀錄僅記載寶林公司說明其資產負債情形為『虧損狀態』；該資料本身不足以直接證明『資產淨值為負、完全無財產可供扣押』。"
    status: verified
    observed_at: "2026-11-03T19:10:00+08:00"
    source_ids: [S001]
    evidence_summary: "保存假扣押爭議的證據邊界：官方公開文字可支持『虧損狀態』，不宜自行升格成『空殼、完全無資產可扣』。"
    tags: ["假扣押", "資產狀況", "證據邊界"]

claims:
  - id: C001
    statement: "北市府在寶林案後續受害者救濟與責任追究上，形成了可由公開資料驗證的行動—結果鏈：法律協助與保險盤點、醫療費緊急代墊與追回、亡者家屬實際獲償、團體訴訟進入法院，以及行政裁罰移送執行。"
    status: supported
    supports: [F001, F002, F004, F005, F006, F007, F008]
    reasoning_notes: "此結論限於『後續救濟與責任追究』。它不替代對事件前端食安通報、採樣與停業時序的獨立評價。"

  - id: C002
    statement: "「寶林案亡者家屬至今未獲得賠償」與目前公開資料不符。"
    status: contradicted
    contradicts: [F005]
    reasoning_notes: "6名亡者家屬中5名調解獲償、1名私下和解；但不得因此改寫成所有傷者及家屬均已獲賠。"

  - id: C003
    statement: "「北市府沒有自行替家屬聲請假扣押，因此可推論市府自始未考慮財產保全、也未提供相關協助」與公開時序不符。"
    status: contradicted
    contradicts: [F002, F003]
    related_facts: [F009]
    reasoning_notes: "市府非家屬民事債權的債權人，不能逕以自己名義聲請；同時公開紀錄顯示3月28日起已提供假扣押法律與律師費協助。是否應採取更多協助仍可討論，但不能把『未由市府自行聲請』等同『未考慮／未協助』。"

  - id: C004
    statement: "「市府用民間捐款替業者支付寶林案醫療賠償」會誤導款項最終負擔狀態。"
    status: contradicted
    contradicts: [F006]
    reasoning_notes: "善款是緊急代墊，後續已透過代位求償全數匯回專戶。"

  - id: C005
    statement: "「北市府在寶林案真正有權力或實際能做的只有開罰」不符合後續處置紀錄。"
    status: contradicted
    contradicts: [F001, F002, F004, F005, F006, F007, F008]
    reasoning_notes: "市府實際進行消保行政調查、保險協調、消費爭議調解、法律協助、醫療代墊與代位求償、團訟協作及行政裁罰移送等多條處置路徑。"

  - id: C006
    statement: "「北市府已讓寶林案所有受害者完成賠償」不成立。"
    status: contradicted
    contradicts: [F007]
    related_facts: [F005]
    reasoning_notes: "亡者家屬已有獲償／和解成果，但30名受害者及家屬的團體訴訟仍在進行。"

