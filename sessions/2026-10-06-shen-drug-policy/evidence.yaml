facts:
  - id: F001
    statement: "2014-09-01 想想論壇文章作者署名『撲馬』，作者簡介明載本名沈伯洋。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S001]
    evidence_summary: "原始頁面直接標示作者、作者本名與發布日期。"
    excerpt: ""
    verification_notes: []
    tags: [沈伯洋, 2014原文]

  - id: F002
    statement: "2014 文章把毒品政策分成 A『非法化／懲罰』、B『除罪化＋協助＋管制』、C『處理吸毒的社會原因並協助』三類。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S001]
    evidence_summary: "原文第 34-36 行列出 A/B/C。"
    excerpt: "B：將毒品除罪化，對有毒癮者予以協助，並對毒品管制。"
    verification_notes: []
    tags: [除罪化, 政策分類]

  - id: F003
    statement: "2014 文章明確批判 A 類懲罰政策，並在提出社區中心方案前質問政府為何遇到毒品問題『只會大叫處罰』。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S001]
    evidence_summary: "原文第 38、42-43 行的論述把政府政策描繪為高度偏向懲罰與排除。"
    excerpt: "為什麼毒品的問題出來，政府只會大叫處罰"
    verification_notes:
      - "此為作者對政策取向的評價，不等同於『2014 台灣客觀上完全沒有任何減害政策』。"
    tags: [政府政策, 懲罰, 脈絡]

  - id: F004
    statement: "2014 文章寫道：若 B 政策的除罪化對某些人太偏激，台灣至少可效仿某些國家，建立社區中心，提供吸毒者毒品與乾淨針頭，並導入社工協助。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S001]
    evidence_summary: "這是目前爭議核心的原始文字；『效仿某些國家』『社區中心』『毒品』『乾淨的針頭』『社工』均同段出現。"
    excerpt: "建立社區中心，提供吸毒者毒品與乾淨的針頭"
    verification_notes: []
    tags: [社區中心, 乾淨針頭, 提供毒品, 減害]

  - id: F005
    statement: "2014 文章另寫『把毒品和藥品劃上等號』，並以 drugs 的概念主張應從用藥者背後的原因與管制方式處理。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S001]
    evidence_summary: "原文第 51 行。"
    excerpt: "首先，把毒品和藥品劃上等號吧！"
    verification_notes:
      - "此 fact 只記錄作者文字；其法律與醫療概念是否精確另列 claim 評估。"
    tags: [毒品, 藥品, 概念]

  - id: F006
    statement: "2014 原文沒有出現『美沙冬』一詞，也沒有直接把第 F004 段的『毒品』指定為美沙冬。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S001]
    evidence_summary: "逐頁檢視原文；頁面全文可見『毒品』『針頭』『除罪化』等詞，但未出現『美沙冬』。"
    excerpt: ""
    verification_notes:
      - "這只能證明文本未明示，不足以單獨證明作者當時心中絕對不可能想到美沙冬。"
    tags: [美沙冬, 文本證據]

  - id: F007
    statement: "台灣清潔針具政策在 2005 年已開始試辦；2005-11-01 正式發出第一份針具，2006 年擴大至全國。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S002, S003, S005]
    evidence_summary: "疾管署 2005、2006 年 contemporaneous 官方資料可交叉確認。"
    excerpt: ""
    verification_notes:
      - "2005 年試辦地區包含台北市、台北縣、桃園縣、台南縣。"
    tags: [清潔針具, 台灣, 時序]

  - id: F008
    statement: "台灣美沙冬替代療法首位收治病患為 2006-02-10 於衛生署桃園療養院；2006 年後續擴大試辦與推廣。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S004, S005]
    evidence_summary: "疾管署當年官方新聞稿明載日期、院所與試辦擴張。"
    excerpt: ""
    verification_notes: []
    tags: [美沙冬, 台灣, 時序]

  - id: F009
    statement: "台灣官方減害政策把『清潔針具』與『美沙冬／丁基原啡因替代或維持治療』列為不同措施；美沙冬在治療中為口服並受醫療專業監督。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S004, S006, S007, S010]
    evidence_summary: "2006 與 2026 官方資料均分開描述兩類措施；多份資料明確指出口服美沙冬。"
    excerpt: ""
    verification_notes: []
    tags: [美沙冬, 清潔針具, 減害, 醫療]

  - id: F010
    statement: "2026-10-03 沈伯洋公開回應時，主動把『針頭交換』與『美沙冬治療計畫』連在一起，並稱對手把他十幾年前『介紹這些政策的文章』拿來製造恐慌。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S008, S009]
    evidence_summary: "新聞報導與官方來源觀測站保存的 Threads 文字一致。"
    excerpt: "把我十幾年前介紹這些政策的文章拿來製造恐慌？"
    verification_notes:
      - "原 Threads 目前抓取遇到 429；保留 secondary + mirror 雙來源。"
    tags: [2026回應, 美沙冬, 針頭交換]

  - id: F011
    statement: "2026 北市衛生局公開主張，現行美沙冬維持療法與清潔針具政策，和沈 2014 所寫『社區中心提供吸毒者毒品與乾淨針頭』並非同一做法。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S010]
    evidence_summary: "北市衛生局以官方新聞稿說明現行服務的執行地點、醫療監督與口服美沙冬。"
    excerpt: ""
    verification_notes:
      - "這是北市政府在選戰爭議中的政策立場／事實說明；應與中央衛福部資料交叉使用，不把其『完全不同』評價單獨當成中立結論。"
    tags: [台北市, 美沙冬, 清潔針具]

  - id: F012
    statement: "美沙冬在台灣可同時落在兩套法律語境：依管制藥品制度列第二級管制藥品；衛福部資料亦指出依毒品危害防制條例屬第二級毒品。醫療使用時則以管制藥品／藥品制度管理。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S011, S012]
    evidence_summary: "官方分級資料與衛福部替代治療專刊明確呈現雙重法制分類。"
    excerpt: ""
    verification_notes:
      - "因此『美沙冬是不是毒品』若脫離法律情境直接作單一詞義回答，容易混淆醫療使用與非法施用的規範界線。"
    tags: [美沙冬, 管制藥品, 毒品危害防制條例]

  - id: F013
    statement: "Oregon Measure 110 將多數少量持有管制物質的刑責降為違規，2021-02-01 生效；2024 HB 4002 又提高持有刑責並建立 deflection 方案，構成對除罪化架構的部分回撤。"
    status: verified
    observed_at: "2026-10-06+08:00"
    source_ids: [S013, S014, S015]
    evidence_summary: "Oregon 官方行政與立法資料均記載 Measure 110 與 HB 4002 的法制變化。"
    excerpt: ""
    verification_notes:
      - "此案例針對的是除罪化／轉介治理架構，不等同於美沙冬或清潔針具療效被推翻。"
    tags: [Oregon, Measure110, 除罪化]

claims:
  - id: C001
    statement: "沈伯洋 2014 年『提供吸毒者毒品』中的『毒品』就是指美沙冬。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F004, F006, F008, F009, F010]
    reasoning_notes: "2026 沈確實以美沙冬＋針頭交換回應，但 2014 原文沒有寫美沙冬，也沒有把『毒品』明確定義為替代治療藥物。現有證據不足以把事後解釋回填成 2014 文本的唯一含義。"

  - id: C002
    statement: "沈伯洋 2014 年那一段只是介紹台灣當時既有的美沙冬與清潔針具政策。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F003, F004, F006, F007, F008, F010]
    reasoning_notes: "台灣 2005-2006 已有兩項政策，但 2014 原文的語法是『效仿某些國家』並批評政府政策偏向懲罰；文本沒有說『台灣已有、應擴大』。這使『只是介紹既有政策』缺乏直接文本支持，但仍不宜宣稱邏輯上絕無可能。"

  - id: C003
    statement: "美沙冬治療與清潔針具是同一項措施，或美沙冬需要用清潔針頭施打。"
    status: contradicted
    supports: []
    contradicts: [F009]
    related_facts: [F007, F008]
    reasoning_notes: "官方資料長期把兩者分列；台灣美沙冬替代／維持治療為口服。"

  - id: C004
    statement: "只要批評沈伯洋 2014 年『提供毒品』的文字，就是反對美沙冬或反對清潔針具減害。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F004, F009, F010]
    reasoning_notes: "批評對象可能是『提供毒品』的具體含義、除罪化、醫療與非法毒品的概念界線，並不必然包含對既有美沙冬／針具政策的反對。需要逐一檢查批評者實際說了什麼。"

