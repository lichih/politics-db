claims:
  - id: C001
    statement: "沈伯洋 2014 年『提供吸毒者毒品』中的『毒品』就是指美沙冬。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F004, F006, F008, F009, F010]
    reasoning_notes: "2026 沈確實以美沙冬＋針頭交換回應，但 2014 原文沒有寫美沙冬，也沒有把『毒品』明確定義為替代治療藥物。現有證據不足以把事後解釋回填成 2014 文本的唯一含義。"

  - id: C002
    statement: "沈伯洋 2014 年那一段只是介紹台灣當時既有的美沙冬與清潔針具政策。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F003, F004, F006, F007, F008, F010]
    reasoning_notes: "台灣 2005-2006 已有兩項政策，但 2014 原文的語法是『效仿某些國家』並批評政府政策偏向懲罰；文本沒有說『台灣已有、應擴大』。這使『只是介紹既有政策』缺乏直接文本支持，但仍不宜宣稱邏輯上絕無可能。"

  - id: C003
    statement: "美沙冬治療與清潔針具是同一項措施，或美沙冬需要用清潔針頭施打。"
    status: contradicted
    supports: []
    contradicts: [F009]
    related_facts: [F007, F008]
    reasoning_notes: "官方資料長期把兩者分列；台灣美沙冬替代／維持治療為口服。"

  - id: C004
    statement: "只要批評沈伯洋 2014 年『提供毒品』的文字，就是反對美沙冬或反對清潔針具減害。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F004, F009, F010]
    reasoning_notes: "批評對象可能是『提供毒品』的具體含義、除罪化、醫療與非法毒品的概念界線，並不必然包含對既有美沙冬／針具政策的反對。需要逐一檢查批評者實際說了什麼。"

  - id: C005
    statement: "2014 年台灣政府客觀上只有懲罰毒品使用者，沒有減害措施。"
    status: contradicted
    supports: []
    contradicts: [F007, F008, F009]
    related_facts: [F003]
    reasoning_notes: "若把 2014 文中『政府只會大叫處罰』理解為字面政策事實，會與 2005-2006 已存在的清潔針具與美沙冬政策衝突；較合理的是把它視為作者對政策主軸的批判性概括。"

  - id: C006
    statement: "美沙冬在任何語境下都只能叫『藥品』，絕不能叫『毒品』。"
    status: contradicted
    supports: []
    contradicts: [F012]
    related_facts: []
    reasoning_notes: "台灣現行法制存在雙重分類；但在合法醫療情境把『管制藥品』直接修辭化成『政府發毒品』仍可能抹除重要的醫療／法律條件。法律分類事實不等於任何政治表述都精確。"

  - id: C007
    statement: "Oregon Measure 110 的回撤證明美沙冬替代治療或清潔針具政策失敗。"
    status: contradicted
    supports: []
    contradicts: [F013]
    related_facts: [F009]
    reasoning_notes: "Measure 110/HB 4002 的政策核心是持有除罪化、刑責與 deflection；不能直接外推成對美沙冬或針具交換療效的否定。"

  - id: C008
    statement: "Oregon 的政策回撤至少證明『反對或質疑毒品除罪化已經是過時立場』不是可直接當成事實的說法。"
    status: supported
    supports: [F013]
    contradicts: []
    related_facts: []
    reasoning_notes: "這只支持『除罪化仍是可爭論政策問題』，不支持任何特定反對理由自動成立，也不支持把減害措施一併否定。"

  - id: C009
    statement: "2014 原文的上下文對『2026 美沙冬只是既有政策說』形成文本上的張力。"
    status: supported
    supports: [F003, F004, F006, F007, F008, F010]
    contradicts: []
    related_facts: []
    reasoning_notes: "作者先批判政府懲罰導向，接著說台灣『至少可以效仿某些國家』建立社區中心；若意指已實施多年的本國政策，文本通常更自然的寫法會是指出既有政策並主張擴大。這是文本推論，不是直接事實。"

  - id: C010
    statement: "加拿大 B.C. 2023–2026 試辦的終止，可作為『毒品除罪化仍是可被經驗檢驗、可因成效不佳而回撤的政策』之案例。"
    status: supported
    supports: [F014]
    contradicts: []
    related_facts: [F013]
    reasoning_notes: "此案例能反駁『質疑除罪化本身已屬過時』這類過度概括，但不能直接外推成美沙冬、清潔針具或其他減害工具無效。"

  - id: C011
    statement: "把 Oregon 說成『2023 就廢掉 Measure 110』並不精確；2023 是回撤壓力與地方限制，2024 HB 4002 才是 statewide 的 possession recriminalization。"
    status: supported
    supports: [F015, F016]
    contradicts: []
    related_facts: [F013]
    reasoning_notes: "時間線應分兩階段：2023 政治／地方修正訊號；2024 州法正式反轉。"

