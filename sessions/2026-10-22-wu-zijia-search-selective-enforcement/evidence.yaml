facts:
  - id: F001
    statement: "2026-10-22，新竹地檢署指揮調查局人員搜索美麗島電子報董事長吳子嘉位於台北市的辦公室及住處；竹檢對外表示吳姓被告涉嫌違反選舉罷免法案件仍在偵辦，基於偵查不公開暫不說明案情。"
    status: verified
    observed_at: "2026-10-22T18:09:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "搜索行動本身及竹檢『案件偵辦中、暫不說明』的公開立場可由多家報導交叉確認。"
    verification_notes:
      - "截至本次觀察，竹檢尚未發布完整案件新聞稿說明搜索原因、搜索票聲請內容與扣押物。"
    tags: [吳子嘉, 搜索, 新竹地檢署, 選罷法]

  - id: F002
    statement: "FTNN 2026-10-22報導稱，檢方在搜索吳子嘉之前，已先傳喚一名街頭發放相關文宣者，訊後向新竹地院聲請羈押獲准；之後再依相關證據與供詞溯源，向新竹地院聲請搜索吳子嘉辦公室及住居所並獲准。"
    status: partial
    observed_at: "2026-10-22T18:09:00+08:00"
    source_ids: [S003]
    evidence_summary: "此報導若正確，表示搜索前存在中間偵查步驟，並非僅憑鄭朝方提出告訴即直接搜索吳子嘉。"
    verification_notes:
      - "目前為單一具體新聞來源對偵查程序的描述，尚缺竹檢正式新聞稿、法院裁定或搜索票等 primary source 獨立確認。"
      - "不得由『羈押獲准／搜索票獲准』反推吳子嘉犯罪成立。"
    tags: [前置偵查, 羈押, 搜索票, partial]

  - id: F003
    statement: "依現行刑事訴訟法，搜索原則上應使用搜索票；偵查中檢察官認有搜索必要時，原則上應以書面敘明理由向法院聲請核發，搜索票由法官簽名。"
    status: verified
    observed_at: "2026-10-22T18:09:00+08:00"
    source_ids: [S004]
    evidence_summary: "刑事訴訟法第128條、第128-1條直接規範一般偵查搜索之搜索票與法院審查程序。"
    verification_notes:
      - "法律另有無票搜索等例外；本 fact 僅表述一般原則。"
    tags: [刑事訴訟法, 搜索票, 法官保留]

  - id: F004
    statement: "2026-10-06，吳子嘉就鄭朝方胞弟鄭朝名公開發文中的『用命去跟你們拼』、『到了陰間，你會被割舌頭好幾次』等言詞提出恐嚇告訴。"
    status: verified
    observed_at: "2026-10-22T18:09:00+08:00"
    source_ids: [S005, S006]
    evidence_summary: "聯合報與中央社均記錄吳子嘉已提出告訴及其所指涉的公開言詞。"
    verification_notes:
      - "此 fact 只證明提出告訴，不證明恐嚇罪成立。"
      - "截至本次查詢，尚未找到檢警就該告訴偵辦進度所作的公開 primary-source 說明。"
    tags: [吳子嘉, 鄭朝名, 恐嚇告訴]

  - id: F005
    statement: "2022年選舉期間，臉書粉專『無良公關』發布一份指稱國民黨組建網軍、跟拍陳時中的企畫書，內容出現蔣萬安、徐巧芯等人簽名；徐巧芯等人提告後，台北地檢署於2023-07第一次作不起訴處分。"
    status: verified
    observed_at: "2026-10-22T18:09:00+08:00"
    source_ids: [S007]
    evidence_summary: "中央社報導記錄貼文內容、告訴罪名及北檢第一次不起訴處分。"
    tags: [無良公關, 徐巧芯, 選罷法, 不起訴]

  - id: F006
    statement: "『無良公關』案經再議發回後，北檢於2024-11再次作不起訴處分；其後案件再經發回續查，北檢於2025-09對其中陳姓管理員依選罷法意圖使人不當選等罪起訴。"
    status: verified
    observed_at: "2026-10-22T18:09:00+08:00"
    source_ids: [S008, S009]
    evidence_summary: "公開報導可確認同一核心爭議至少歷經兩次不起訴，之後第三次偵查才對一名管理員起訴。"
    verification_notes:
      - "不同被告的最終處理可能不同；此處僅就報導可確認的陳姓管理員與相關被告程序沿革概括。"
    tags: [無良公關, 再議, 起訴, 程序時間線]

  - id: F007
    statement: "台北地方法院於2026-02-25就『無良公關』陳姓管理員案件一審判處有期徒刑6月、褫奪公權2年，當時仍可上訴。"
    status: verified
    observed_at: "2026-10-22T18:09:00+08:00"
    source_ids: [S010]
    evidence_summary: "中央社記錄一審判決結果及尚可上訴之程序狀態。"
    verification_notes:
      - "不得把一審判決寫成已確定有罪。"
    tags: [無良公關, 一審, 選罷法]

  - id: F008
    statement: "徐巧芯於2026-10-22公開將吳子嘉遭搜索、自己『無良公關』舊案處理時程、以及吳子嘉對鄭朝名提出恐嚇告訴三者並列，進而主張『辦藍，不辦綠』、『司法早就淪為當權者的選舉鷹犬』。"
    status: verified
    observed_at: "2026-10-22T18:09:00+08:00"
    source_ids: [S001]
    evidence_summary: "可確認的是徐巧芯確實提出此政治主張與比較框架；其因果與制度定性需另行驗證。"
    tags: [徐巧芯, 政治主張, 選擇性執法]

claims:
  - id: C001
    statement: "吳子嘉此次遭搜索足以證明司法存在『辦藍、不辦綠』的選擇性執法，或已淪為執政者的選舉工具。"
    status: unresolved
    related_facts: [F001, F002, F003, F004, F005, F006, F007, F008]
    reasoning_notes: "目前可確認不同案件的程序速度與強制處分表面上存在差異，但案件結構、證據保全需求、涉嫌行為持續性、被告身分與已掌握證據均可能不同。F002還提供搜索前已有發文宣者遭偵辦與羈押、再向上溯源的 competing explanation。現有資料不足以從速度差直接推出政治選擇性或執政黨介入。"

  - id: C002
    statement: "鄭朝方一提出告訴，檢方即未經其他偵查步驟而直接跨縣市搜索吳子嘉。"
    status: unresolved
    contradicts: [F002]
    related_facts: [F001]
    reasoning_notes: "目前具體報導稱搜索前已有發文宣者遭傳喚、羈押及證據溯源，與『一告就直接搜索』敘事衝突；但因該程序細節尚缺 primary source 完整確認，暫保留 unresolved。"

  - id: C003
    statement: "吳子嘉2026-10-06提出的恐嚇告訴遭司法『置若罔聞』、完全沒有偵辦。"
    status: unresolved
    related_facts: [F004]
    reasoning_notes: "目前只能確認告訴已提出，以及本次公開查詢未找到後續偵辦進度。偵查可能未公開；not_found 不等於沒有偵辦，不能據此把『未見公開進度』升格為『司法置若罔聞』。"

  - id: C004
    statement: "吳子嘉案與徐巧芯『無良公關』舊案在公開可見的偵查／處分時間線上存在明顯速度差，值得進一步做同類案件比較。"
    status: supported
    supports: [F001, F005, F006, F007]
    related_facts: [F002, F003]
    reasoning_notes: "『時間線差異存在』可由公開程序紀錄支持；但『差異由政治選擇性造成』是另一個需要控制案件結構、證據狀態與強制處分必要性的因果命題。"

