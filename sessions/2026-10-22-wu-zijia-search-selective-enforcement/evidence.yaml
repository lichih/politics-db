facts:
  - id: F001
    statement: "2026-10-22，新竹地檢署指揮調查局人員搜索美麗島電子報董事長吳子嘉位於台北市的辦公室及住處；竹檢對外表示吳姓被告涉嫌違反選舉罷免法案件仍在偵辦，基於偵查不公開暫不說明案情。"
    status: verified
    observed_at: "2026-10-22T18:09:00+08:00"
    source_ids: [S002, S003]
    evidence_summary: "搜索行動本身及竹檢『案件偵辦中、暫不說明』的公開立場可由多家報導交叉確認。"
    verification_notes:
      - "截至本次觀察，竹檢尚未發布完整案件新聞稿說明搜索原因、搜索票聲請內容與扣押物。"
    tags: [吳子嘉, 搜索, 新竹地檢署, 選罷法]

  - id: F002
    statement: "FTNN 2026-10-22報導稱，檢方在搜索吳子嘉之前，已先傳喚一名街頭發放相關文宣者，訊後向新竹地院聲請羈押獲准；之後再依相關證據與供詞溯源，向新竹地院聲請搜索吳子嘉辦公室及住居所並獲准。"
    status: partial
    observed_at: "2026-10-22T18:09:00+08:00"
