    statement: "彭姓被告是因派報公司僱用外籍移工發送文宣而被刑事羈押禁見。"
    status: unsupported
    related_facts: [F009, F013, F014, F019]
    reasoning_notes: "目前竹檢公開說法把彭的刑事嫌疑表述為選罷法『意圖使人不當選等罪』，未公開說明外籍移工就是羈押原因。外籍人士從事第45條行為確受第56條禁止，但第110條對第56條本身配置行政罰鍰。吳子嘉的外籍移工版本屬當事人說法；在取得羈押裁定、搜索票或竹檢完整案由前，不得把二者直接串成因果。"

