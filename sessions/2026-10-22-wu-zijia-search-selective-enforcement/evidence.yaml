  - id: S012
    source_type: primary
    publisher: "全國法規資料庫"
    title: "公職人員選舉罷免法（115年7月1日修正）"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0020010"
    observed_at: "2026-10-23T10:50:00+08:00"
    retrieval_status: reachable
    notes:
      - "第104條規定：意圖使候選人當選或不當選，以文字、圖畫、錄音、錄影、演講或他法散布謠言或傳播不實之事，足以生損害於公眾或他人者，處五年以下有期徒刑。"
      - "第45條第4款列舉『印發、張貼宣傳品為候選人…宣傳』；第56條第4款禁止邀請外國人民、大陸地區人民或香港、澳門居民為第45條各款行為。"
      - "第110條對違反第56條配置行政罰鍰：特定選舉主體及其受僱人、代理人或使用人20萬至200萬元；其他人10萬至100萬元。"

  - id: S013
    source_type: primary
    publisher: "司法院裁判書系統"
    title: "最高法院111年度台上字第4362號刑事判決"
    url: "https://judgment.judicial.gov.tw/FJUD/printData.aspx?id=TPSM%2C111%2C%E5%8F%B0%E4%B8%8A%2C4362%2C20230218%2C1"
    published_at: "2023-02-18"
    observed_at: "2026-10-23T10:50:00+08:00"
    retrieval_status: reachable
    notes:
      - "最高法院就選罷法第104條指出，『散布謠言或傳播不實之事』以虛構具體事實為客觀構成要件，並以真正惡意為主觀構成要件。"
      - "判決明示檢察官應證明客觀不實及主觀真正惡意至無合理懷疑程度；政治性公共議題言論之解釋應兼顧憲法言論自由，語意多義時原則採有利行為人解釋。"

