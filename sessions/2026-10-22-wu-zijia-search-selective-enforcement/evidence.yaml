notes:
  - "本 session 先保存可驗證事實與待證主張，不先採納『司法鷹犬／政治迫害』定性。"
  - "後續若要判斷搜索是否異常，核心需補：實際文宣內容、涉嫌不實之具體句子、文宣發放規模與持續性、搜索票待證事項、扣押物類型、發文宣者羈押裁定，以及同類選罷法案件通常何時使用搜索。"
  - "『搜索票由法院核發』只能證明存在司法審查程序，不代表搜索必然合比例或實體上正確；反之，搜索發生也不能直接證明政治迫害。"
