    title: "刑事訴訟法第122條、第128條、第128-1條"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=C0010001"
    observed_at: "2026-10-22T18:09:00+08:00"
    retrieval_status: reachable
    notes:
      - "第122條規定搜索被告或犯罪嫌疑人之身體、物件、電磁紀錄及住宅或其他處所以必要時為限。"
      - "第128條原則要求搜索使用搜索票，搜索票由法官簽名；第128-1條規定偵查中檢察官認有搜索必要時，原則上應敘明理由向法院聲請核發搜索票。"

