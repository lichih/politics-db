facts:
  - id: F001
    statement: "2026年1月雷虎科技對 Cheap 採取刑事告訴與1億元民事求償，當時至少有部分公開評論把『被上市公司提告、公司法務能力、委任律師』本身當作 Cheap 案情風險很高的訊號。"
    status: verified
    observed_at: "2026-10-24T15:14:00+08:00"
    source_ids: [S002, S004, S005]
    evidence_summary: "雷虎重大訊息確認刑事告訴與1億元求償；李怡貞與486先生的公開評論均把企業法務、委任律師、訴訟壓力或可能刑責納入對 Cheap 的負面風險判斷。"
    verification_notes:
      - "此 fact 描述『評論者使用過什麼判準／風險訊號』，不判定其當時主觀動機。"
      - "不同評論者的具體理由不完全相同，不應把所有人簡化成同一句話。"
    tags: ["2026", "Cheap", "雷虎科技", "lawsuit", "risk-inference", "corporate-legal-team"]

  - id: F002
    statement: "林智群在雷虎宣布提告 Cheap 後，公開以『有聲量後就開始飄了』對 Cheap 作負面評價。"
    status: verified
    observed_at: "2026-10-24T15:14:00+08:00"
    source_ids: [S003]
    evidence_summary: "2026年1月12日三立新聞報導直接引述林智群該說法。"
    tags: ["2026", "Cheap", "林智群", "commentary", "lawsuit"]

  - id: F003
    statement: "雷虎對 Cheap 的1億元民事求償於2026年9月23日一審遭台北地院駁回；法院認定相關事實陳述有相當理由確信為真實、已盡合理查證義務，評論部分屬可受公評之事的善意評論。"
    status: verified
    observed_at: "2026-10-24T15:14:00+08:00"
    source_ids: [S006]
    evidence_summary: "臺北地院115年度重訴字第123號判決主文及理由直接支持。"
    verification_notes:
      - "這是民事一審判決，並非所有刑事程序的終局結果。"
      - "因此它能反證『只因大公司重手提告即可可靠推定內容違法／必敗』，但不能證明企業提告本身必然是濫訴。"
    tags: ["2026", "Cheap", "雷虎科技", "judgment", "reasonable-verification", "fair-comment"]

  - id: F004
    statement: "2026年10月24日，Emmy 自述因其對統一／星巴克相關影片收到刑事警察局通知，涉及著作權法、妨害信用與加重誹謗；她同時明示『提告者還在確認』。"
    status: verified
    observed_at: "2026-10-24T15:14:00+08:00"
    source_ids: [S007]
    evidence_summary: "Emmy 自己的節目說明直接記錄上述程序狀態與保留。"
    verification_notes:
      - "這是當事人自述，尚未取得刑事警察局通知書、告訴狀或檢警案卷。"
      - "不得把節目標題中的疑問句『遭統一集團提告？』改寫成已確認由統一企業或特定統一體系法人提出告訴。"
    tags: ["2026", "Emmy", "星巴克", "刑事警察局", "copyright", "defamation", "credit"]

  - id: F005
    statement: "Emmy 所評論的星巴克客製化收費確實在2026年10月形成公開消費爭議，至少包括少冰／去冰補奶加收15元及消費者對杯量的批評。"
    status: verified
    observed_at: "2026-10-24T15:14:00+08:00"
    source_ids: [S008]
    evidence_summary: "聯合新聞網記錄新制上路時間、收費方式與公開爭議。"
    verification_notes:
      - "這只證明議題屬公開消費爭議，不證明 Emmy 影片中每一項事實或措辭均有充分依據。"
    tags: ["2026", "Starbucks", "consumer-dispute", "public-comment"]

  - id: F006
    statement: "依2026年10月現行法，刑法妨害名譽及信用罪章屬告訴乃論；智慧財產局亦說明現行著作權侵害原則上屬告訴乃論，現行非告訴乃論例外範圍有限。"
    status: verified
    observed_at: "2026-10-24T15:14:00+08:00"
    source_ids: [S009, S010]
    evidence_summary: "刑法第314條及智慧財產局2026年9月15日解釋資料直接支持。"
    verification_notes:
      - "不能因此直接確定 Emmy 案的具體告訴人身份；只能排除把妨害信用／加重誹謗理解成完全不需要告訴即可一路追訴的說法。"
      - "著作權部分仍需確認實際涉案條文與行為態樣。"
    tags: ["2026", "complaint-required", "刑法314", "著作權法", "procedure"]

  - id: F007
    statement: "Cheap 在2026年10月24日貼文中明確把 Emmy 案當成對2026年1月雷虎案評論者的同一判準測試，要求過去強調大企業提告、法務實力、找律師與訴訟風險的人，面對 Emmy 案時採取一致標準。"
    status: verified
    observed_at: "2026-10-24T15:14:00+08:00"
    source_ids: [S001]
    evidence_summary: "Cheap 貼文的逐人反問結構直接顯示其論證目的。"
    verification_notes:
      - "本 fact 只保存 Cheap 的比較設計與要求，不等於判定被點名者已經雙標。"
    tags: ["2026", "Cheap", "Emmy", "consistency-test", "same-standard"]

claims:
  - id: C001
    statement: "『被大公司提告、對方有強大法務、被告找律師』本身足以可靠推定被告的公開評論違法、案件必敗或內容高度不可信。"
    status: contradicted
    supports: []
    contradicts: [F003]
    related_facts: [F001, F002]
    reasoning_notes: "Cheap 案提供直接反例：企業確實重手提告並求償1億元，但民事一審仍認定其已盡合理查證、評論屬可受公評範圍。這不證明企業提告都無理由，只反證『提告強度本身可替代實體證據』。"

  - id: C002
    statement: "Cheap—Emmy 兩案目前具有作為『判準一致性 paired case／自然實驗』的研究價值。"
    status: supported
    supports: [F001, F003, F004, F005, F007]
    contradicts: []
    related_facts: [F002, F006]
    reasoning_notes: "兩案都包含網路意見領袖評論大型企業／公共消費或公司治理議題、企業或權利人採取法律程序、被評論者面臨刑民事風險等結構。Cheap 案已有較後期法院結果，Emmy 案則處早期程序，適合觀察同一評論者是否維持『提告即高風險／找律師即事情大條』等判準。兩案法律構成與事實並不完全相同，因此比較的是評論判準，不是預測 Emmy 案結果必與 Cheap 相同。"

  - id: C003
    statement: "目前已足以判定 Cheap 貼文點名的所有評論者在 Emmy 案上構成雙重標準。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F007]
    reasoning_notes: "目前只確認部分評論者在 Cheap 案使用過的判準，尚需觀察其對 Emmy 案的實際公開回應、是否修正舊判準、是否提出足以區分兩案的實體理由。沉默本身尤其不能直接證明雙標。"

  - id: C004
    statement: "Emmy 收到刑事警察局通知可以解讀成『沒有任何權利人／被害人提出告訴，國家仍自行以妨害信用與加重誹謗一路追訴』。"
    status: contradicted
    supports: []
    contradicts: [F006]
    related_facts: [F004]
    reasoning_notes: "妨害信用與加重誹謗所在章依刑法第314條屬告訴乃論。Emmy 自己又說提告者身份仍在確認，因此合理保留應是『誰告』而不是把案件描述成完全沒有告訴人。著作權部分仍須看具體罪名與例外。"

  - id: C005
