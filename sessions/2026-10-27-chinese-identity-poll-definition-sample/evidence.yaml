notes:
  - "本 session 的用途是保存論證／測量行為的存在性樣本，不是建立人物負面檔案。"
  - "最有辨識力的後續觀察是：作者是否會重新定義投票選項、承認分母讀法問題、區分ROC國家認同／PRC政治身分／文化或民族認同，或重做投票。"
  - "若作者之後正面回答『中國人』操作定義、修正原文數字或重新設計題目，應追加 evidence 並更新 claims；不得用本樣本預支其後續仍不修正。"
