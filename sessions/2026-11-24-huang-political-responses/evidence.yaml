facts:
  - id: F001
    statement: "NVIDIA 董事會於11月8日表示將調查黃仁勳可能受到外國情報活動鎖定的報導；11月11日接受黃仁勳辭職；11月22日決議回任，11月23日宣布。回任時獨立調查尚未結束。"
    status: verified
    observed_at: "2026-11-24T12:36:04+08:00"
    source_ids: [S001, S002, S003]
    evidence_summary: "董事會兩次聲明與SEC 8-K固定程序時間線及調查狀態。"
    tags: ["2026", "NVIDIA", "董事會", "國安"]
  - id: F002
    statement: "川普於11月23日CNBC訪談稱黃仁勳是美國的國家瑰寶，擔心遭排擠後可能被中國延攬；中國挖角屬川普假設，他回答記者時表示沒有實際跡象。"
    status: verified
    observed_at: "2026-11-24T12:36:04+08:00"
    source_ids: [S004]
    evidence_summary: "官方完整逐字稿同時呈現川普的國家競爭力判斷與對假設性的明確承認。"
    verification_notes:
      - "川普說He's got a little blood in him；[Chinese]是部分媒體加入的上下文補語，不是川普逐字原文。"
    tags: ["2026", "川普", "CNBC", "國家利益"]
  - id: F003
    statement: "11月9日沈伯洋公開將黃仁勳事件評論為中國經典手法，同時表示有無造成利益侵害須待調查；范雲則主張尊重私人生活及依法調查、讓證據說話。"
    status: verified
    observed_at: "2026-11-24T12:36:04+08:00"
    source_ids: [S005]
    evidence_summary: "中央社同日現場採訪記錄兩人說法。"
    tags: ["2026", "沈伯洋", "范雲", "政治言論"]
  - id: F004
    statement: "11月11日黃捷就黃樂入境台灣及防諜制度向內政部長劉世芳質詢；11月12日林修民撰文把間諜疑雲與黃仁勳對中晶片政策相聯；11月13日自由財經報導詹凌瑀批評黃仁勳欠全世界一個交代。"
    status: verified
    observed_at: "2026-11-24T12:36:04+08:00"
    source_ids: [S006, S007, S008]
    evidence_summary: "區分有明確本國主管機關監督標的的質詢、獨立評論者的推論、媒體轉述。"
    verification_notes:
      - "林修民與詹凌瑀之政治組織關係及是否受指示，未有相關證據。"
    tags: ["2026", "媒體評論", "入境管理", "國安"]
  - id: F005
    statement: "11月24日沈伯洋對黃仁勳復任表示仍應等待調查、金融穩定比選舉重要；前一日卓榮泰召集金融及產業代表座談。黃仁勳回任消息後台股早盤大幅反彈。"
    status: verified
    observed_at: "2026-11-24T12:36:04+08:00"
    source_ids: [S009, S010, S011]
    evidence_summary: "媒體當日具名訪談、行政院座談報導與市場數據。"
    verification_notes:
      - "國安基金及穩市措施不能用以證明民進黨所有人物表態一致；盤勢反彈不能單獨作因果證明。"
    tags: ["2026", "沈伯洋", "台股", "政府因應"]

claims:
  - id: C001
    statement: "現有公開資料已足以認定黃仁勳遭中國情報機構操控或已造成NVIDIA洩密。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F003, F004]
    reasoning_notes: "啟動調查、一般情報手法、評論者推測，均非特定情報行動成立的證據；目前調查未完。"
  - id: C002
    statement: "台灣政治人物及媒體對黃仁勳事件採取了程度不同的言論與查證標準，應分別依具體命題檢驗。"
    status: supported
    supports: [F003, F004, F005]
    contradicts: []
    related_facts: [F001]
    reasoning_notes: "國安管理質詢、情報定性、個人判斷能力指控與等待調查的聲明，在來源及推論強度上存在差異。"
  - id: C003
    statement: "這些評論已證明民進黨中央統一部署攻擊黃仁勳。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F003, F004]
    reasoning_notes: "具名評論存在，但缺少指令、協調或金流等直接外部事證；政治論述功能評價不等於組織指揮關係。"
  - id: C004
    statement: "川普關於中國挖角黃仁勳的說法已獲得真實接觸或邀約證據支持。"
    status: contradicted
    supports: []
    contradicts: [F002]
    related_facts: []
    reasoning_notes: "川普在同段訪談承認沒有任何相關暗示。"

