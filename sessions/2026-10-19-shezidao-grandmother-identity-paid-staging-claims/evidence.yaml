facts:
- id: F001
  statement: 『臺灣非賣藥電台』原始Facebook貼文附圖，以肯定式標題把下跪阿嬤描述為『擺拍阿嬤』，並寫『根本不住台北還民進黨籍』；圖卡內另嵌入文字稱該阿嬤是『住三峽郭桂英女士，民進黨籍』，並以『到底領多少？』暗示有償配合。
  status: verified
  observed_at: '2026-10-19T13:10:19+08:00'
  source_ids:
  - S001
  evidence_summary: 此 fact 只證明圖卡提出了哪些具體指控，不證明任何一項身分、黨籍或付費內容為真。
  verification_notes:
  - 原始Facebook相片URL與頁面帳號已由連接瀏覽器確認；貼文日期為2026-10-19，精確發布時刻尚未取得。
  tags:
  - 圖卡
  - 郭桂英
  - 三峽
  - 民進黨籍
  - 薪水
  - 具體事實指控
- id: F002
  statement: 2020年2月27日公視報導社子島開發案抗議時，直接將一位公開發言者標示為『社子島居民洪阿嬤』，其發言內容是反對區段徵收並擔心失去家園。
  status: verified
  observed_at: '2026-10-19T13:10:19+08:00'
  source_ids:
  - S002
  evidence_summary: 至少在2020年，已有洪姓年長女性以社子島居民身分公開參與反徵收陳情；這項紀錄早於2026台北市長選舉多年。
  verification_notes:
  - 本 fact 不自行以影像辨識判定2020年的洪阿嬤與2026年下跪者一定是同一人。
  tags:
  - 社子島
  - 洪阿嬤
  - 反徵收
  - 歷史紀錄
- id: F003
  statement: 2026年10月18日，評論者『漂浪島嶼』公開主張本次向沈伯洋下跪的阿嬤姓洪、是社子島在地居民，且六年前就已隨反徵收自救會上街；TVBS、中天、民視等媒體在10月18至19日轉述該主張。
  status: verified
  observed_at: '2026-10-19T13:10:19+08:00'
  source_ids:
  - S003
  - S004
  - S005
  evidence_summary: 可確認『漂浪島嶼』已提出一套與圖卡不同的身分敘述；多家媒體轉述一致。
  verification_notes:
  - 多家媒體的底層來源相同，不能因媒體數量增加就視為多份獨立身分確認。
  - 仍欠缺阿嬤本人、家屬或社子島自救會具名第一手身分確認。
