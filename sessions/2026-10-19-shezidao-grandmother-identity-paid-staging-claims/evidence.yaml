    rationale: 需要建立原始訊息→KOL／政治人物→媒體擴散時間線，並與既有選罷法104條案例比較合理查證與真正惡意門檻。
notes:
- 本案目前最關鍵的未解問題不是『拍背代表什麼』，而是可直接查證的具體身分與報酬主張：下跪者究竟是誰、是否為社子島居民／自救會成員、是否有任何付費安排。
- 對外評論若現在就寫，應只說『圖卡與林杏兒已提出可證偽的具體事實主張，但目前公開證據不足；反方向已有多年反徵收歷史與洪姓居民的材料』，不應提前寫成『已證實造謠』。
- 身分澄清應遵守最小揭露原則；若自救會或本人能確認『洪姓社子島居民／長期自救會成員』已足以反駁錯誤套用，就沒有必要公開長者的身分證、完整地址、電話等敏感資料。
- 林杏兒2025年與自救會的在地／非在地爭議是背景事實，只能影響後續查證方向，不能直接替2026年的主觀惡意要件作結論。
- 『誰主張、誰舉證』在本專案可作預設的查核／論辯規範：提出『她是郭桂英』『住三峽』『領薪水』等具體事實者，應至少交代可檢驗的來源；但不能把對方一時拿不出證據，自動轉換成相反命題已被證明。法律上也須區分民事舉證責任與刑事檢方證明責任。
- 本案存在明顯資訊不對稱：阿嬤本人、自救會或受理陳情的陣營可能比外部觀察者更容易確認身分；因此道德／政治討論中的舉證期待可以依資訊控制能力調整，而不必把『誰先主張』當成絕對硬規則。
