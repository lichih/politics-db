  retrieval_status: reachable
  notes:
  - 使用者提供原始相片 URL；已透過連接瀏覽器登入狀態直接讀取該貼文與留言串。
  - 頁面名稱為『臺灣非賣藥電台』，帳號路徑為 @taiwan.9991；先前 evidence 誤記為『台灣非營養電台』，本次更正。
