  - 貼文正文可直接讀到：『到底要領多少，才願意這樣出賣自己的靈魂？』『被輕輕拍一下肩膀，就能當場跪下，對著沈伯洋求神拜佛，這演技未免也太浮誇！』『請問我現在跪下去，也有機會面試月薪20萬的黨公職嗎？』『怎麼每次選舉一到，民進黨就像在舉辦大型演員徵選大會？』
  - 圖卡本身可讀到『這阿嬤根本不住那裡，他住三峽郭桂英女士，民進黨籍』與『擺拍阿嬤遭起底 根本不住台北還民進黨籍』等文字；此 source 只證明該粉專如此主張，不證明內容為真。
  - 2026-10-19T13:21:23+08:00 觀察時，貼文介面顯示約 4,011 個反應、839 則留言、304 次分享；這可證明單篇貼文已有顯著互動，不等於所有互動者均相信或支持其指控。
