  cases:
  - proposed: 2026-shezidao-grandmother-election-misinformation
    rationale: 若後續由本人／自救會第一手確認身分，並取得圖卡原始發布者與林杏兒完整影音，本案可能具備升格為選舉具體不實資訊案例的價值。
