notes:
  - "本 session 的核心方法限制：案例可以反證全稱命題，但不能用選取案例估計整體合作率。若要判斷『少數』『極低機率』『附隨組織』，下一步應建立第11屆完整記名表決資料集，事先定義程序票、實體法案、共同提案、行政院版、棄權、缺席與黨團版本的編碼規則。"
  - "合作成功件數不能直接當作單方合作意願的代理變數；至少要區分誰先提案、是否存在相近版本、協商階段、誰拒絕、最後是否因票數或程序失敗。"
  - "對『民進黨自己打掉合作』的描述應逐案使用：禁伐補償可直接看到民眾黨支持既有朝野共識與民進黨立委提案、而民進黨團反對；國會改革與法庭直播則只能說存在政策交集但民進黨黨團未支持最後方案，不宜概括成所有責任均在民進黨。"
