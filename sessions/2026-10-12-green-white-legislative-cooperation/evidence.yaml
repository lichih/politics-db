facts:
  - id: F001
    statement: "2024年原民禁伐補償修法中，民眾黨沒有提出自己的版本，而是表明支持先前朝野協商的每公頃6萬元結論；最後院會以「審查會與委員陳瑩等提案條文」表決通過。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S001, S002]
    evidence_summary: "官方表決頁與中央社報導可互相核對：民眾黨是支持既有協商與他黨立委提案，而不是只能支持自己的或國民黨版本。"
    verification_notes:
      - "此事實不足以單獨估算綠白整體合作頻率，只能作為『從未支持民進黨來源主張』的反例。"
    tags: [原民禁伐補償, 跨黨合作, 反例]

  - id: F002
    statement: "同一禁伐補償案最後60票贊成、46票反對；民進黨團主張反對，但民進黨立委伍麗華、陳瑩仍投贊成票。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S001, S003]
    evidence_summary: "此案顯示『提案來源』『黨團立場』『個別立委投票』可能分離，不能把單一法案簡化成固定藍綠白三塊。"
    verification_notes: []
    tags: [原民禁伐補償, 黨團紀律, 個別投票]

  - id: F003
    statement: "2024年立法院長選舉前，游錫堃對民眾黨提出的多項國會改革表示贊同，但明確說是個人立場、不代表民進黨；柯建銘隔日亦表示黨團有黨團立場。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S004, S005]
    evidence_summary: "存在明確政策交集，但未轉化成民進黨黨團的正式承諾。"
    verification_notes:
      - "這只能證明當時合作窗口與黨內立場落差存在，不能單獨證明後續所有國會改革衝突均由民進黨造成。"
    tags: [國會改革, 游錫堃, 合作窗口]

  - id: F004
    statement: "2024年再生醫療法由行政院、民進黨立委、民眾黨黨團與國民黨立委等多版本併案審查，最後完成三讀。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S006]
    evidence_summary: "這是第11屆國會中藍綠白與行政院版本共同進入同一立法程序並完成立法的明確案例。"
    verification_notes:
      - "併案三讀不等於每一黨的原始條文均被採納；但足以反證『綠白完全沒有法案合作』。"
    tags: [再生醫療法, 三讀, 跨黨合作]

  - id: F005
    statement: "公益揭弊者保護法的關聯議案包括民進黨林月琴等人版本、民眾黨黨團版本及多位國民黨立委版本，最後完成三讀。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S007]
    evidence_summary: "這是另一個綠白及其他黨派版本共同進入立法程序並產出法律的案例。"
    verification_notes:
      - "最終條文多處採藍白再修正動議，故不應把此案描述成『民進黨版本獲民眾黨完整支持』。"
    tags: [公益揭弊者保護法, 三讀, 跨黨合作]

  - id: F006
    statement: "2017年司改國是會議官方追蹤決議已要求研議法庭直播的範圍與條件；2025年民眾黨提出分層公開的法庭直播修法時，民進黨團與司法院均反對，最後由藍白59票對49票三讀通過。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S008, S009, S010]
    evidence_summary: "可確認政府主導的司改體系早有法庭直播研議方向，也可確認2025年民進黨團反對民眾黨具體版本。"
    verification_notes:
      - "司改國是會議決議不等於民進黨黨綱或黨團正式承諾，因此只能作為政策脈絡與合作交集證據，不能簡化成『民進黨自己法案後來反對』。"
    tags: [法庭直播, 司法改革, 制度改革, 政策脈絡]

  - id: F007
    statement: "2025年底中選會7人提名案中，民進黨團明確表示自己沒有向行政院推薦人選；行政院正式提名名單中則納入國民黨與民眾黨推薦者。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S011]
    evidence_summary: "因此把未通過的胡博硯、黃文玲、陳宗義直接稱為『民進黨推薦人選』並不精確。"
    verification_notes: []
    tags: [中選會, 人事同意權, 提名程序]

  - id: F008
    statement: "2026年3月11日中選會人事同意權黨團協商可確認的是投票程序安排；本次查核未在正式協商紀錄中找到各黨互相承諾支持特定人選的交換條款。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S012]
    evidence_summary: "現有原始紀錄不足以支持『藍白先答應互相放行、之後欺騙民進黨』的說法。"
    verification_notes:
      - "此處採嚴格表述：只記錄本次正式協商紀錄中未見交換條款，不推論私下絕對沒有任何政治溝通。"
    tags: [中選會, 黨團協商, 程序]

  - id: F009
    statement: "2026年3月13日中選會同意權表決中，游盈隆、李禮仲、蘇嘉宏、蘇子喬均獲112票同意；游盈隆並非國民黨或民眾黨推薦人選。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S013, S014]
    evidence_summary: "這直接反證『藍白只通過藍白推薦人選』。"
    verification_notes: []
    tags: [中選會, 人事同意權, 反例]

  - id: F010
    statement: "2025年軍人待遇修法中，民眾黨對國民黨志願役齊頭式加給3萬元版本投棄權，但對義務役月薪不得低於最低工資的國民黨版本投贊成。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S015]
    evidence_summary: "同一議題內即可觀察到民眾黨對國民黨不同條文採不同投票選擇，不能把所有藍白投票視為機械式同一。"
    verification_notes:
      - "棄權不是反對票；因此此事實不能反證『民眾黨沒有投反對票』這個更窄命題，但可以反證『國民黨版本一律照單全收』。"
    tags: [軍人待遇, 藍白差異, 棄權]

  - id: F011
    statement: "2026年5月黃國昌公開表示，若國民黨再推動黨產條例修法，民眾黨不會支持。"
    status: verified
    observed_at: "2026-10-12"
    source_ids: [S016]
    evidence_summary: "這是藍白存在政策邊界的公開證據，但不是院會記名表決紀錄。"
    verification_notes: []
    tags: [黨產條例, 藍白差異, 政策立場]

claims:
  - id: C001
    statement: "第11屆國會中，民眾黨與民進黨之間完全沒有任何法案合作。"
    status: contradicted
    supports: []
    contradicts: [F001, F004, F005]
    related_facts: [F002]
    reasoning_notes: "再生醫療法與公益揭弊者保護法均有兩黨版本共同進入立法程序並完成三讀；禁伐補償案又有民眾黨支持民進黨立委提案與既有朝野共識的明確反例。"

  - id: C002
    statement: "民眾黨只要看到國民黨提案就一律照單全收。"
    status: contradicted
    supports: []
    contradicts: [F010, F011]
    related_facts: []
    reasoning_notes: "軍人待遇案中民眾黨對國民黨不同版本分別採棄權與贊成；另有公開表態不支持國民黨後續黨產修法。若要進一步檢驗『是否從不投反對票』，仍需完整記名表決資料。"

  - id: C003
    statement: "藍白在中選會人事同意權案先談好互相放行，之後只通過藍白推薦人選、封殺民進黨推薦人選。"
    status: contradicted
    supports: []
    contradicts: [F007, F008, F009]
    related_facts: []
    reasoning_notes: "民進黨團自己表示沒有推薦人選；正式協商紀錄未見互相放行條款；游盈隆不是藍白推薦卻獲112票同意。"

  - id: C004
    statement: "綠白成功合作在第11屆國會只占『極低機率』或『少數』。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F001, F004, F005, F006]
    reasoning_notes: "目前已找到成功合作、政策交集、合作失敗等代表案例，但尚未建立完整母體、分類規則與逐案表決資料，因此不能從選取案例估算頻率，更不能使用『機率』一詞作統計推論。"

  - id: C005
    statement: "若綠白最終成功合作案件較少，就足以證明是民眾黨沒有合作意願。"
    status: unsupported
    supports: []
    contradicts: [F001, F003, F006]
    related_facts: [F004, F005]
