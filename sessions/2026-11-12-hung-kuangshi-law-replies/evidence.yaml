facts:
  - id: F001
    statement: "使用者提供之決定性Facebook擷取，包含洪毓祥質詢主文1篇與可見回覆18篇，全部回覆有唯一ID；其中2篇為留言下巢狀回覆，全部時間標記未知。"
    status: verified
    observed_at: "2026-11-12T10:45:03.563+08:00"
    source_ids: [S001]
    evidence_summary: "檔案共19個item，root1，16筆直接對root與2筆對其他留言；未掌握整體總留言數、抽樣程序或留言發生順序。"
    tags: [Facebook, 原始擷取, "18則留言", 可見樣本]

  - id: F002
    statement: "洪毓祥主文指出，對於股票投資是否屬利衝法第14條交易，葉俊顯以條文沒列『投資』及須由主管機關認定為由，不做關係人揭露審查；並以未來所有公務人員關係人申請國發基金可能不揭露為制度疑問。"
    status: verified
    observed_at: "2026-11-12T10:45:03.563+08:00"
    source_ids: [S001, S003, S004, S005]
    evidence_summary: "可確證洪毓祥公開作上述指控，同日報導和AI轉錄亦有對應主委問答；具體法律結論仍須依第14條和個案交易要件審認。"
    tags: [洪毓祥, 葉俊顯, 利衝法, 制度性質疑]

  - id: F003
    statement: "第14條第1項文字包括其他具有對價之交易行為；第14條第2項僅以第1項但書第1至3款補助或交易作特定事前揭露義務基礎，不能將交易有對價等同每種投資都當然應依第2項揭露。"
    status: verified
    observed_at: "2026-11-12T10:55:11.618+08:00"
    source_ids: [S002, S006]
    evidence_summary: "應分別確立雙方交易、被認定的監督機關、適用第14條原則／例外及第2項揭露適用範圍；法務部2020函釋反對完全封閉式列舉解讀。"
    tags: [第14條, 對價行為, 身分揭露, 法條辨析]

  - id: F004
    statement: "留言『想請問0.5數字怎麼來的』及其回覆提供具體可核查的數字出處問題、票面金額與股份認購成本之區別；後者另指國發會未提供股東名冊及實際單價明細，但本次未另證明該機關全部相關資料未提供。"
    status: verified
    observed_at: "2026-11-12T10:45:03.563+08:00"
    source_ids: [S001, S004]
    evidence_summary: "comment_id=1037743899357132與2651966598594463；前者是真正的資訊查證提問，後者指出票面金額只屬帳面數字且需逐輪對帳，並附帶一項須查證的機關行為指控。"
    tags: [0.5元, 票面價, 查證提問, 有效反論]

  - id: F005
    statement: "留言『不是投資？連投資都不算』將『投資是否適用特定利衝法條』轉述為『官員不認為它是投資』，不完全符合葉俊顯答詢之實際分歧。"
    status: verified
    observed_at: "2026-11-12T10:45:03.563+08:00"
    source_ids: [S001, S004, S005]
    evidence_summary: "comment_id=933908012991539；須保留原句的問號、修辭與不精確轉述，不把它重新命名為當事人已確認的利益輸送證據。"
    tags: [命題轉換, 對價, 法律適用]

  - id: F006
    statement: "留言中有直接政治支持、司法要求與已預設官員違法的陳述，也有針對官員或其家人的粗暴辱罵；各表達不一定嘗試建立完整法律論證。"
    status: verified
    observed_at: "2026-11-12T10:45:03.563+08:00"
    source_ids: [S001]
    evidence_summary: "如comment_id=2037177476945806『謝謝洪委員』，1186598114032915在無裁罰判斷前稱『這些違法官員』，1770658434049305包含對家屬惡毒詛咒；不依短或情緒直接推斷心智能力。"
    tags: [Reward, 先定性, 粗暴辱罵, 無新增證據]

  - id: F007
    statement: "台企銀創投代表質詢中自述有九次實地查訪，洪毓祥要求一週內交投後管理報告；查訪是否實施、成效及報告實際交付尚無公開文件核實。"
    status: partial
    observed_at: "2026-11-12T10:55:11.618+08:00"
    source_ids: [S003, S004]
    evidence_summary: "AI轉錄有相關段落；存在質詢紀錄與索件要求，但若未見逐次查核紀錄，不能因次數推定管理無缺。"
    tags: [投後管理, "9次查訪", 要求文件, 待查]

claims:
  - id: C001
    statement: "這份Facebook貼文所述『投資必有對價』足以不經其他檢驗直接斷言曠世智能案已違反利衝法第14條，且應依第2項揭露。"
    status: unsupported
    related_facts: [F002, F003]
    reasoning_notes: "經濟上互換股票與價款是必要查核起點；特定交易相對人、關係人、監督關係、條文但書及揭露適用是不同法律條件。"

  - id: C002
    statement: "因第14條沒寫『投資』兩字，國發會不用就任何涉及公職人員關係人的創投投資進行利益衝突審查，也不用回應制度是否有缺口。"
    status: unsupported
    related_facts: [F002, F003]
    reasoning_notes: "第14條有其他具對價交易概括規定，且內控與投資公平可有獨立治理義務；個案適用未完成，不能用單一未列名詞排除整類風險審查。"

  - id: C003
    statement: "公開留言『0.5元』與約499萬股已能證明蘇巧純僅花250萬元取得這些股份。"
    status: unsupported
    related_facts: [F004]
    reasoning_notes: "股票票面價不等同實際認購價；留言指出須看各次增資溢價、股數及交易對價，與質詢中0.5元推定入股成本應分開。"

  - id: C004
    statement: "留言中要求司法追究或稱『違法官員』，是案件已經成立違法、圖利或司法故意不辦的獨立事證。"
    status: unsupported
    related_facts: [F005, F006]
    reasoning_notes: "社群留言可作政治表達、Reward或對原說法的理解樣本，不構成犯罪要件及機關失職證明。"

  - id: C005
    statement: "因台企銀自述實地查訪9次，所以投後風險處理已全部合規且監管完善。"
    status: unsupported
    related_facts: [F007]
    reasoning_notes: "次數本身不是完整度、警示處置、投後回收及獨立監督的評價，須索取日期、內容、發現事項、改善追蹤及退場規劃。"

