notes:
  - "權威法源、具體質詢事證與社群留言分三層；原始股票價格和資金流之權威仍見 sessions/2026-10-22-kuangshi-public-investment/evidence.yaml。"
  - "用同一把尺審視雙方：葉俊顯以『沒寫投資』排除全類法適用理由不足，洪毓祥以『有對價』直接導向第14條必有揭露義務也跳過條件；有效制度質疑不因此消失。"
  - "可見留言中有人實質核查0.5元來源，亦有人把法條適用問題錯讀成『根本不是投資』，有的支持與批判只是社交言語行為，不應硬算推理及格率。"
  - "此18則不能與黃國昌貼文265則或Eve Hsieh貼文2則混算，三者人群、貼文及問題方向不同。"
  - "本次不為18則做假精準全量互斥有效率統計；已保存每則完整文字、ID、父節點供日後依一致方法重複編碼。"
