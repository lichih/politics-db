facts:
  - id: F001
    statement: "中央社報導，何姓男子於2026-10-13在Threads相關新聞串文下公開留言「煙蛋我出，吸一吸去殺賴清德比較屌」；北檢於10月19日指揮搜索、拘提，並於10月21日依刑法第151條恐嚇公眾、第153條第1款煽惑他人犯罪及第305條恐嚇危害安全等罪起訴，建請法院量處6月以上有期徒刑。"
    status: verified
    observed_at: "2026-10-21T11:28:00+08:00"
    source_ids: [S001]
    evidence_summary: "可確認公開報導中的留言文字、程序時間線與北檢所選罪名；尚不是法院對構成要件成立的判斷。"
    verification_notes:
      - "『涉罪／起訴』與『有罪』必須分開。"
      - "目前未取得起訴書原件。"
    tags: [何男案, Threads, 起訴, 程序狀態]

  - id: F002
    statement: "北檢透過媒體公開呈現的核心論述，是將「煙蛋我出」理解為何男聲稱可提供毒品，並將其與鼓吹他人施用毒品後殺害總統、公眾恐慌及總統與公眾安全危害連結。"
    status: verified
    observed_at: "2026-10-21T11:28:00+08:00"
    source_ids: [S001, S002]
    evidence_summary: "這證明檢方目前如何解讀該句，而非獨立證明何男實際已有毒品煙彈、出資計畫或交付對象。"
    verification_notes:
      - "應避免把檢方定性直接當作客觀事實。"
    tags: [檢方主張, 資源承諾, 語意]

  - id: F003
    statement: "壹蘋報導稱何男留言不到10分鐘即刪除；搜索時查得微量三級毒品K他命殘渣。現有公開報導未證明該K他命殘渣就是留言所稱的『煙彈』，也未呈現已存在特定受煽惑者、交付對象、交付行為或具體殺人計畫。"
    status: partial
    observed_at: "2026-10-21T11:28:00+08:00"
    source_ids: [S002, S001]
    evidence_summary: "已找到『短時間刪文』及『K他命殘渣』報導；對於是否另有未公開偵查資料不能由公開資料的沉默推論不存在。"
    verification_notes:
      - "not_found != never_existed；最後一句僅限於目前公開報導未呈現。"
      - "K他命殘渣不能自動等同可供交付的喪屍煙彈。"
    tags: [實行能力, 可行性, 資源, unresolved]

  - id: F004
    statement: "現行刑法第151條文字要求恐嚇公眾且『致生危害於公安』；第153條第1款處罰公然煽惑他人犯罪；第305條要求恐嚇他人且『致生危害於安全』。"
    status: verified
    observed_at: "2026-10-21T11:28:00+08:00"
    source_ids: [S003]
    evidence_summary: "三個罪名的構成要件不同，不能因同一言論整體觀感惡劣就互相替代各罪所需證明的要件。"
    tags: [法條, 構成要件, 刑法]

  - id: F005
    statement: "最高法院109年度台上字第3695號判決認為，刑法第153條第1款雖屬抽象危險犯，仍應依刑法最後手段性限縮：煽惑內容須客觀上足以使他人形成可得特定之犯罪決意或助長既有犯罪決意，並足以引發公眾對真實犯罪的聯想；如內容過於荒謬、實現顯無可能等欠缺可行性，應認不該當。判決另表示美國法對煽動違法言論所強調的『立即性及可能性』值得參考。"
    status: verified
    observed_at: "2026-10-21T11:28:00+08:00"
    source_ids: [S004]
    evidence_summary: "這是目前研究『實行能力／可行性是否與煽惑罪界線相關』最重要的最高法院直接依據；它支持把可行性納入判斷，但不能簡化成『沒有武器就當然無罪』。"
    verification_notes:
      - "判決並未把『行為人本人有無親自實行能力』列成獨立的法定要件。"
      - "正確命題是：客觀可行性、立即性與犯罪發生可能性對第153條限縮解釋具有重要性。"
    tags: [最高法院, "109台上3695", 可行性, 立即性, 可能性, 最後手段性]

  - id: F006
    statement: "2026年台北地院一案中，被告先後三度在Threads發布「先殺青鳥蟾蜍，斬首賴清德，東亞就和平了」、「斬首賴清德救台灣，該你上場了」、「殺青鳥，救台灣，一人一彈，斬首賴清德，你我有責！」等語，法院一審認定構成恐嚇公眾罪，判刑2月、緩刑2年。"
    status: partial
    observed_at: "2026-10-21T11:28:00+08:00"
    source_ids: [S005]
    evidence_summary: "可作為同一年度對殺害總統言論採有罪處理的比較案例；完整構成要件理由仍需原判決。"
    verification_notes:
      - "此比較案未包含第153條煽惑罪的判決認定。"
    tags: [比較案例, 賴清德, 有罪, 恐嚇公眾]

  - id: F007
    statement: "2026年彰化地院另一案中，被告在Threads接續發布「要殺賴清德」等語；法院一審認為言論雖具恐嚇意味，但針對特定個人而非公眾，且未標註對方帳號、要求轉傳，也無證據證明被恐嚇對象確實收到惡害通知，因此就恐嚇公眾、恐嚇危害安全等起訴罪名判無罪；彰檢表示將上訴。"
    status: partial
    observed_at: "2026-10-21T11:28:00+08:00"
    source_ids: [S006]
    evidence_summary: "顯示同類『殺總統』網路言論在第151條、第305條適用上存在值得追蹤的下級審界線差異。"
    verification_notes:
      - "此案尚非確定判決。"
      - "仍需取得原判決及後續上訴結果。"
    tags: [比較案例, 賴清德, 無罪, 恐嚇公眾, 恐嚇危害安全]

  - id: F008
    statement: "2017年基隆地檢署就臉書「要殺掉蔡總統」留言作成不起訴；中央社報導其理由包括蔡英文總統本人未得知該言論，不符恐嚇罪構成要件，且對總統發洩政治不滿之過度用語，如無具體危害元首安危情形，不宜動輒以恐嚇言論看待。"
    status: partial
    observed_at: "2026-10-21T11:28:00+08:00"
    source_ids: [S007]
    evidence_summary: "可作跨任期比較的歷史基準；但何男案另有『煙彈我出／吸一吸去殺』的第三人鼓動結構，不能直接視為同案型。"
    verification_notes:
      - "目前依中央社轉述，未取得不起訴處分書原件。"
    tags: [比較案例, 蔡英文, 不起訴, 政治言論]

  - id: F009
    statement: "陳之漢『斬首總統』案審理中，辯方曾以被告無實施斬首行動可能性、並希望函詢國安局是否因言論調升維安層級作為辯護；檢方則主張無須函詢，認為恐嚇罪處罰惡害告知而非『膽量檢測』。"
    status: verified
    observed_at: "2026-10-21T11:28:00+08:00"
    source_ids: [S008]
    evidence_summary: "此案直接呈現『實行能力／實際效果是否重要』的攻防，但目前只是雙方訴訟主張，不能當作法院已確立標準。"
    verification_notes:
      - "應與F005最高法院對第153條可行性的法律見解分開；第151、305與第153的要件不可混同。"
    tags: [比較案例, 實行能力, 維安效果, 訴訟主張]

claims:
  - id: C001
    statement: "在刑法第153條煽惑他人犯罪的判斷中，『現實可行性／犯罪發生可能性』是法律上可忽略的因素。"
    status: contradicted
    contradicts: [F005]
    related_facts: [F003, F009]
    reasoning_notes: "最高法院109台上3695明確要求限縮解釋，並指出欠缺可行性、實現顯無可能時不該當；但這不等於要求證明行為人本人具備完整犯罪實行能力。"

  - id: C002
    statement: "只要言論字面包含『殺總統』，即可不問脈絡、可行性、傳達方式或實際危害而直接判定刑法第151條、第153條、第305條全部成立。"
    status: contradicted
    contradicts: [F004, F005, F007, F008]
    related_facts: [F006]
    reasoning_notes: "三罪構成要件不同；既有案例亦顯示對傳達、對象、公眾性與危險性存在不同判斷。"

  - id: C003
    statement: "何男案目前公開資料已足以證明何男確有可供交付的喪屍煙彈、特定受煽惑者、交付安排或具體殺人計畫。"
    status: unsupported
    contradicts: [F003]
    related_facts: [F001, F002]
    reasoning_notes: "公開資料證明檢方如此解讀『煙蛋我出』並查得K他命殘渣，但尚未公開上述更具體的實行鏈；若偵查卷內另有未公開資料，應隨後續審判更新。"

  - id: C004
    statement: "若言論由抽象鼓吹進一步變成具體出資、提供武器／毒品或安排交付，這類資源承諾會增加其客觀可行性與使犯罪實現的能力，因此在第153條限縮判斷中具有高度相關性。"
    status: supported
    supports: [F005]
    related_facts: [F002, F003]
    reasoning_notes: "這是依最高法院要求檢查『可得特定犯罪決意、真實犯罪聯想、立即性／可能性、可行性』所作的法律推論。它不是說任何『我出』字樣都自動成立犯罪；仍須確認語境與承諾的真實性。"

  - id: C005
    statement: "目前可以僅憑何男案公開新聞資料斷定北檢的起訴必然違法或構成政治迫害。"
    status: unsupported
    contradicts: [F001, F002, F003, F004, F005]
    reasoning_notes: "現階段可以提出比例性、危險性與構成要件是否被充分證明的質疑，但未取得起訴書、完整偵查證據與法院判斷前，不能把這些質疑升格成違法或政治迫害定性。"

  - id: C006
    statement: "2026年目前已可觀察到『殺害總統』類網路言論在下級司法實務中存在不同處理結果，因此建立跨案件比較基準具有研究價值。"
    status: supported
    supports: [F006, F007, F008]
    related_facts: [F001, F009]
    reasoning_notes: "差異不等於雙標；需控制言論內容、發布次數、對象、公眾性、通知、實行能力、資源承諾、是否有人響應、實際維安效果與程序狀態後再比較。"

