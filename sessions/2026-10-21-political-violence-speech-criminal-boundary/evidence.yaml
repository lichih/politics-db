  - id: F010
    statement: "Brandenburg v. Ohio建立美國煽動非法行為的核心標準：政府不得處罰僅僅倡議使用武力或違法的言論，除非該倡議是以促成『立即的違法行動』（imminent lawless action）為目的，且具有促成該行動的可能性。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S009]
    evidence_summary: "美國對incitement採非常高的憲法門檻，將mere advocacy與可罰的imminent incitement明確區分。"
    tags: [美國, Brandenburg, incitement, imminence, likelihood]

  - id: F011
    statement: "Hess v. Indiana認為，充其量只是在鼓吹未來某個不確定時間的違法行動，且未指向特定個人或群體的言論，不符合Brandenburg的立即性要求。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S010]
    evidence_summary: "『未來再做』與『現在就去做』在美國incitement判準上有實質差異；言論是否 directed to 某個可行動受眾也重要。"
    tags: [美國, Hess, incitement, audience, imminence]

  - id: F012
    statement: "Watts v. United States直接處理對總統的暴力語句。最高法院認為，被告在反戰集會所說若被徵召、第一個想瞄準的是總統LBJ，依其政治語境、條件式表達及現場聽眾反應，屬粗鄙的政治反對與political hyperbole，而非可罰的true threat。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S011]
    evidence_summary: "這是『殺／射總統』語句不應只看字面，而應看完整語境、條件性及受眾反應的最直接美國比較案例。"
    tags: [美國, Watts, true-threat, 總統, political-hyperbole, context]

  - id: F013
    statement: "NAACP v. Claiborne Hardware中，政治動員者曾使用『抓到你去那些店就打斷你的脖子』等暴力修辭；最高法院仍認為其演說未越過Brandenburg界線，並強調缺乏演說之外的證據證明其授權、批准或直接威脅暴力，且被辨識出的暴力事件與爭議演說在時間上並未形成足夠連結。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S012]
    evidence_summary: "強烈甚至暴力的政治修辭本身不等同實質煽動；法院要求把言論與暴力行為的因果、授權、時間鏈結具體化。"
    tags: [美國, Claiborne, political-speech, causation, authorization, violence]

  - id: F014
    statement: "Virginia v. Black將true threats概括為說話者意在傳達對特定個人或群體施以非法暴力之嚴肅表達；法院同時指出，構成true threat不要求說話者實際打算把威脅付諸實行。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S013]
    evidence_summary: "對威脅罪而言，『是否真的有能力或打算親自執行』不是唯一或必要門檻；需與incitement問題區分。"
    tags: [美國, Virginia-v-Black, true-threat, intent, intimidation]

  - id: F015
    statement: "Counterman v. Colorado進一步要求true-threats刑事責任至少具有recklessness的主觀門檻：政府須證明說話者有意識地忽視其言論會被理解為暴力威脅的重大風險，不必證明更高程度的特定恐嚇故意。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S014]
    evidence_summary: "美國true-threat doctrine同時保留客觀脅迫性與主觀心態的緩衝區，以降低寒蟬效果。"
    tags: [美國, Counterman, true-threat, recklessness, mens-rea, chilling-effect]

  - id: F016
    statement: "歐洲人權法院2026年Article 10官方指南整理其暴力言論判例時指出：核心問題是言論是否可能加劇或正當化暴力、仇恨或不寬容；判斷須同時考量用語、發布脈絡與潛在影響，並特別考量政治／社會背景、是否為直接或間接暴力呼籲或暴力正當化。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S015]
    evidence_summary: "ECHR不是採美國式單一硬門檻，而是將內容、脈絡與potential impact放在同一個比例性框架內。"
    tags: [歐洲, ECHR, Article-10, context, potential-impact, violence]

  - id: F017
    statement: "Zana v. Turkey中，歐洲人權法院認為前市長在當地高度緊張、且其訪談恰與PKK對平民的致命攻擊同時期發表支持PKK為『民族解放運動』的言論，可能加劇已經爆炸性的局勢，因此其定罪未違反Article 10。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S016, S015]
    evidence_summary: "ECHR會把說話者身分／影響力、現實暴力背景、時間接近性及可能效果一起納入。"
    tags: [歐洲, ECHR, Zana, context, speaker-influence, timing]

  - id: F018
    statement: "Öztürk v. Turkey與Şener v. Turkey反向顯示：即使處於反恐或國安背景，只要爭議言論本身不能被合理分類為煽動暴力，國家仍不能僅以國安、領土完整或防止犯罪等抽象理由動用刑法；國內法即使不要求實際具體效果，也不免除Article 10下對必要性與比例性的審查。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S018, S019, S015]
    evidence_summary: "『社會很緊張／涉及恐怖主義』不是自動通行證；仍需證明該言論與暴力風險的關聯。"
    tags: [歐洲, ECHR, necessity, proportionality, terrorism, no-incitement]

  - id: F019
    statement: "Leroy v. France中，歐洲人權法院接受對一則肯定911攻擊的諷刺圖文所為制裁，重點包括發表距攻擊僅兩天、刊登地區本身對恐怖主義高度敏感，以及該表達在當地可能激化暴力與公共秩序風險。"
    status: verified
    observed_at: "2026-10-21T12:10:34+08:00"
    source_ids: [S020, S015]
    evidence_summary: "此案顯示ECHR不像美國Brandenburg那樣要求嚴格imminence，但仍實質依賴時點、地區、背景與可能影響，而非只看字面冒犯性。"
    tags: [歐洲, ECHR, Leroy, terrorism, timing, potential-impact]

claims:
  - id: C001
    statement: "在刑法第153條煽惑他人犯罪的判斷中，『現實可行性／犯罪發生可能性』是法律上可忽略的因素。"
    status: contradicted
    contradicts: [F005]
    related_facts: [F003, F009]
    reasoning_notes: "最高法院109台上3695明確要求限縮解釋，並指出欠缺可行性、實現顯無可能時不該當；但這不等於要求證明行為人本人具備完整犯罪實行能力。"

  - id: C002
    statement: "只要言論字面包含『殺總統』，即可不問脈絡、可行性、傳達方式或實際危害而直接判定刑法第151條、第153條、第305條全部成立。"
    status: contradicted
    contradicts: [F004, F005, F007, F008]
    related_facts: [F006]
    reasoning_notes: "三罪構成要件不同；既有案例亦顯示對傳達、對象、公眾性與危險性存在不同判斷。"

  - id: C003
    statement: "何男案目前公開資料已足以證明何男確有可供交付的喪屍煙彈、特定受煽惑者、交付安排或具體殺人計畫。"
    status: unsupported
    contradicts: [F003]
    related_facts: [F001, F002]
    reasoning_notes: "公開資料證明檢方如此解讀『煙蛋我出』並查得K他命殘渣，但尚未公開上述更具體的實行鏈；若偵查卷內另有未公開資料，應隨後續審判更新。"

  - id: C004
    statement: "若言論由抽象鼓吹進一步變成具體出資、提供武器／毒品或安排交付，這類資源承諾會增加其客觀可行性與使犯罪實現的能力，因此在第153條限縮判斷中具有高度相關性。"
    status: supported
    supports: [F005]
    related_facts: [F002, F003]
    reasoning_notes: "這是依最高法院要求檢查『可得特定犯罪決意、真實犯罪聯想、立即性／可能性、可行性』所作的法律推論。它不是說任何『我出』字樣都自動成立犯罪；仍須確認語境與承諾的真實性。"

  - id: C005
    statement: "目前可以僅憑何男案公開新聞資料斷定北檢的起訴必然違法或構成政治迫害。"
    status: unsupported
    contradicts: [F001, F002, F003, F004, F005]
    reasoning_notes: "現階段可以提出比例性、危險性與構成要件是否被充分證明的質疑，但未取得起訴書、完整偵查證據與法院判斷前，不能把這些質疑升格成違法或政治迫害定性。"

  - id: C006
    statement: "2026年目前已可觀察到『殺害總統』類網路言論在下級司法實務中存在不同處理結果，因此建立跨案件比較基準具有研究價值。"
    status: supported
    supports: [F006, F007, F008]
    related_facts: [F001, F009]
    reasoning_notes: "差異不等於雙標；需控制言論內容、發布次數、對象、公眾性、通知、實行能力、資源承諾、是否有人響應、實際維安效果與程序狀態後再比較。"

  - id: C007
    statement: "美國最高法院對『煽動第三人犯罪』與『對特定人形成真實威脅』採相同的一套標準。"
    status: contradicted
    contradicts: [F010, F011, F012, F014, F015]
    reasoning_notes: "incitement以Brandenburg的目的、立即性與可能性為核心；true threat則看是否為真實暴力威脅及至少recklessness的主觀門檻。兩條doctrine不能混用。"

  - id: C008
    statement: "在美國incitement分析中，說話者本人是否具有親自完成目標犯罪的能力，是憲法判準的核心。"
    status: contradicted
    contradicts: [F010, F011]
    related_facts: [F013]
    reasoning_notes: "Brandenburg/Hess主要檢查言論是否directed to促成imminent lawless action，以及該行動是否likely發生；焦點是受眾與因果風險，而不是說話者本人能不能親手完成犯罪。資源承諾則可能作為提高可行性與likely effect的證據。"

  - id: C009
    statement: "歐洲人權法院採與Brandenburg相同的嚴格『立即性』必要條件，沒有立即違法行動就不能限制言論。"
    status: contradicted
    contradicts: [F016, F017, F019]
    related_facts: [F018]
    reasoning_notes: "ECHR採Article 10比例性與context/potential impact框架；imminence可影響判斷，但不是像美國Brandenburg那樣的獨立硬門檻。"

  - id: C010
    statement: "比較美國與ECHR判例後，『煙彈我出／我出錢』這類資源承諾的法律重要性，較精確地說不是證明說話者本人能親自殺人，而是可能把抽象政治暴言轉化為更可行的犯罪促成行為，增加受眾實行的可能性、言論的嚴肅性及潛在效果。"
    status: supported
    supports: [F010, F011, F013, F016]
    related_facts: [F002, F003, F014, F015, F017, F019]
    reasoning_notes: "這是比較法上的分析命題，不等於目前何男案已證明該資源承諾是真實的；仍須以個案證據確認其語意、資源、受眾與後續行為。"

