    - "實行能力、資源承諾與實際效果在政治言論刑事化中的角色"

notes:
  - "後續意見文不應把『言論令人厭惡』直接等同『國家得以刑罰』；應分別檢查第151、153、305條各自的構成要件與最高法院限縮標準。"
  - "『要不要先確認他的實行能力』可改寫為可驗證問題：說話者是否具備或承諾提供使犯罪更可行的資源？是否有特定受煽惑者、聯絡、交付、計畫、響應或維安反應？"
  - "反向也不能把『沒有親自殺人的能力』當成一律免責。若說話者角色是出資、供應毒品、武器或其他犯罪資源，其相關能力應按該角色判斷。"
  - "『煙蛋我出』與假設語句『煙彈我出錢』不能混同；後者若有真實出資承諾，會明顯提高犯罪促成與客觀可行性的證據強度，但何男原句目前仍需依完整語境及外部行為判斷。"
