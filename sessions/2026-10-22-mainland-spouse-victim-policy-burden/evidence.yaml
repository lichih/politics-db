notes:
  - "本session刻意區分三層：中國端可能造成的人身安全／脅迫風險；臺灣行政制度造成的身分或參政權不利益；是否存在主觀迫害目的。前兩層已有直接證據，第三層目前沒有。"
  - "『受害者』是沈伯洋的政治描述，不把所有中國配偶客觀分類為受害者；『加害者』若使用，只能在公開論述中明確限定為造成臺灣端制度性不利益的政治責任描述，不能偷換成犯罪或故意迫害。"
  - "重要反證：政府不是完全要求所有人赴陸取得單一形式文件；2025年已設具結替代與展延制度。後續若批評制度，應集中檢驗替代程序是否實際可用、個案是否獲通知與補正、以及2026年第21條核釋如何處理具結替代者。"
  - "F004至F006均為修法提案／連署事實，不得描述成已通過生效的法律。"
  - "後續關鍵未解問題：2025年以具結方式完成替代程序者，在2026年陸委會第21條核釋下，十年起算日如何認定；目前本session未取得主管機關明確公開規則。"
