facts:
  - id: F001
    statement: "2025年4月9日，沈伯洋在立法院就補繳喪失原籍證明政策質詢移民署時，明確指出部分對象返陸辦理文件可能有人身安全風險，並要求政府儘速提出配套。"
    status: verified
    observed_at: "2026-10-22T13:23:28+08:00"
    source_ids: [S001]
    evidence_summary: "立法院IVOD逐字稿直接記錄沈伯洋與移民署長的問答。"
    tags: [沈伯洋, 陸配, 返陸風險, 補證, 配套]

  - id: F002
    statement: "2025年4月16日，陸委會正式承認部分補證對象可能無法安全赴陸或可能從未在陸設籍，因此設置具結替代方案；適用類型明列『赴陸恐有人身安全疑慮』及『在中國出生、學齡前返臺、主張從未在陸設籍並經審核確認』。"
    status: verified
    observed_at: "2026-10-22T13:23:28+08:00"
    source_ids: [S002]
    evidence_summary: "陸委會官方新聞稿直接列出具結替代類型，證明政府制度上承認安全風險與『原本就沒有大陸戶籍』兩種可能。"
    tags: [具結替代, 人身安全, 從未設籍, 陸委會]

  - id: F003
    statement: "移民署2025年5月21日表示，對已接獲補繳通知但消極不配合辦理者，將依兩岸條例相關規定註銷其臺灣戶籍。"
    status: verified
    observed_at: "2026-10-22T13:23:28+08:00"
    source_ids: [S003]
    evidence_summary: "移民署官方新聞稿明確將補證程序與註銷臺灣戶籍的法律不利益連結。"
    verification_notes:
      - "這是行政機關公開宣示的執行後果；個案是否符合註銷要件仍須依具體處分與救濟程序判斷。"
    tags: [移民署, 戶籍, 權利不利益, 補證]

  - id: F004
    statement: "2024年12月的選罷法修正草案主張，大陸地區及港澳地區人民參選時應辦理放棄原有國籍並提出喪失國籍證明，否則不得登記為候選人；草案另設非可歸責於當事人而無法取得證明的例外，沈伯洋為連署人。"
    status: verified
    observed_at: "2026-10-22T13:23:28+08:00"
    source_ids: [S004]
    evidence_summary: "立法院議案關係文書直接記載修法內容、例外及提案／連署名單。"
    tags: [選罷法, 參政權, 喪失國籍證明, 沈伯洋, 修法草案]

  - id: F005
    statement: "2025年4月，沈伯洋為國籍法第20條修正草案提案人之一；草案主張受國籍限制的公職人員應於就職前完成喪失外國國籍或境外政治實體公民身分，並提出證明文件。"
    status: verified
    observed_at: "2026-10-22T13:23:28+08:00"
    source_ids: [S005]
    evidence_summary: "立法院議案關係文書直接確認沈伯洋提案身分及證明文件要求。"
    verification_notes:
      - "本草案適用對象不限於陸配，不能單獨當成專門針對陸配的措施。"
    tags: [國籍法, 公職, 身分證明, 沈伯洋]

  - id: F006
    statement: "2025年4月的兩岸條例第17條修正草案主張，大陸地區配偶定居設籍後若欲取得我國國民身分，仍應放棄原國籍並出具證明；草案理由同時以其可能受境外敵對勢力脅迫為政策理由之一，沈伯洋為連署人。"
    status: verified
    observed_at: "2026-10-22T13:23:28+08:00"
    source_ids: [S006]
    evidence_summary: "同一份立法院議案文書同時呈現『可能被脅迫』風險判斷與更嚴格身分／證明要求。"
    verification_notes:
      - "這是立委提案，不能描述為已通過或已生效法律。"
    tags: [兩岸條例第17條, 陸配, 脅迫風險, 放棄原國籍, 沈伯洋]

  - id: F007
    statement: "2026年5月16日，沈伯洋公開把里長、宮廟及『可能被威脅的中國配偶』描述為應受法治保護的被害者，並表示政府政策應保護這些對象。"
    status: verified
    observed_at: "2026-10-22T13:23:28+08:00"
    source_ids: [S007]
    evidence_summary: "現場採訪報導直接記錄其公開說法；目前來源層級為secondary。"
    verification_notes:
      - "此fact只證明沈伯洋的公開政治主張，不證明所有陸配客觀上均為受害者。"
    tags: [沈伯洋, 被害者, 中國配偶, 政策論述]

  - id: F008
    statement: "2026年4月16日，陸委會以行政核釋把兩岸條例第21條『在臺灣地區設有戶籍滿十年』解釋為自完成繳附喪失中國大陸戶籍證明之日起算。"
    status: verified
    observed_at: "2026-10-22T13:23:28+08:00"
    source_ids: [S008]
    evidence_summary: "行政院公報刊載之陸委會令直接載明起算規則。"
    verification_notes:
      - "此fact證明行政機關採取的解釋與其法律效果；是否逾越法律解釋界線，屬另行法律評價。"
    tags: [第21條, 十年起算, 行政核釋, 被選舉權]

claims:
  - id: C001
    statement: "沈伯洋一方面明確承認部分陸配／原陸籍人士可能因赴陸辦理身分文件而遭遇危險，並在政治論述中把可能被威脅的中國配偶定位為應受保護的被害者；另一方面，他本人也曾提案或連署要求更嚴格的身分消除、證明文件與參政資格條件。"
    status: supported
    supports: [F001, F004, F005, F006, F007]
    reasoning_notes: "這是可直接由其質詢、公開說法及立法院議案交叉確認的政策張力；不因此自動證明主觀惡意或法律違法。"

  - id: C002
    statement: "在2025至2026年的喪失原籍證明與參政資格制度中，陸配／原陸籍人士承受的臺灣端權利不利益，不只是中國政府可能造成的風險；臺灣政府自己的補證、戶籍處理與第21條起算核釋也是直接制度來源。"
    status: supported
    supports: [F002, F003, F008]
    related_facts: [F001, F007]
    reasoning_notes: "政府一方面承認赴陸風險與從未設籍情形，另一方面將補證不配合連結至臺灣戶籍不利益，並以繳附證明日決定部分參政資格起算。此處『直接制度來源』描述的是行政措施與法律效果，不等於刑法上的加害者概念。"

  - id: C003
    statement: "把『民進黨是加害者』限定解釋為『民進黨執政下的公權力，在這一具體制度爭議中是第二層身分／參政權不利益的政治責任主體』，具有事實基礎。"
    status: supported
    supports: [F003, F008]
    related_facts: [F001, F002, F004, F005, F006, F007]
    reasoning_notes: "支持範圍限於政治責任與公權力措施造成的臺灣端不利益；不把『加害者』提升為犯罪、違法或故意迫害的法律結論。執政黨政治責任仍屬政治評價，不等於各機關行為皆由黨中央直接指揮。"

  - id: C004
    statement: "沈伯洋所支持的相關制度方向『都只跟透明化有關係』，不包含實質身分或參政資格限制。"
    status: contradicted
    contradicts: [F004, F005, F006]
    related_facts: [F007]
    reasoning_notes: "可確認的立法提案包括放棄原國籍／境外政治實體公民身分、提出證明、不得登記候選人或不得擔任特定公職等實質資格條件；這不代表法律上一定屬『處罰』，但不能精確描述為只有資訊透明化。"

  - id: C005
    statement: "政府在補繳喪失原籍證明政策中完全不承認赴陸安全風險、文件取得困難或『從未在陸設籍』的可能，也完全沒有替代程序。"
    status: contradicted
    contradicts: [F002]
    related_facts: [F001, F003]
    reasoning_notes: "2025年4月16日陸委會已正式設置具結替代與延期類型，因此批評政策時不能忽略這項反證。"

  - id: C006
    statement: "上述證據已足以證明民進黨或沈伯洋主觀上就是要迫害陸配，或相關措施必然違憲、違法。"
    status: unsupported
    related_facts: [F001, F002, F003, F004, F005, F006, F007, F008]
    reasoning_notes: "現有資料可證明政策設計、權利效果與政治責任張力，但主觀迫害目的需要額外決策鏈或意圖證據；違法或違憲則需進一步處理法律保留、授權範圍、比例原則、時間適用及個案程序。"

