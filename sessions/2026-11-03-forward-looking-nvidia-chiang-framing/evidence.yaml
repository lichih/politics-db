facts:
  - id: F001
    statement: "2017年3月23日行政院公開的前瞻基礎建設規劃，已列出軌道、水環境、綠能、數位、城鄉等主要領域，並估算8年8,824.9億元；因此把當時狀態描述成「完全不知道要花到哪裡」過度概括。"
    status: verified
    observed_at: "2026-11-03T22:44:00+08:00"
    source_ids: [S001, S002]
    evidence_summary: "行政院在條例完成立法前即已公開五大領域與整體規模；立法院法案評估亦針對具體規劃與程序提出評估。"
    verification_notes:
      - "這不代表2017年時每一筆未來個案都已核定，也不代表立委對計畫詳細度的批評沒有依據。"
    tags: ["2017", "前瞻", "預算", "時間線"]
  - id: F002
    statement: "2017年4月至5月立法院審查的是前瞻基礎建設特別條例及相關整體規劃；蔣萬安當時參與審查並質疑大額特別預算的規劃資訊過於概要。"
    status: verified
    observed_at: "2026-11-03T22:44:00+08:00"
    source_ids: [S003, S004]
    evidence_summary: "立法院議程與公報可直接確認審查標的及蔣萬安質詢內容。"
    tags: ["2017", "蔣萬安", "前瞻", "立法院"]
  - id: F003
    statement: "前瞻特別條例最終於2017年7月公布施行，採前4年上限4,200億元、後續4年經立法院同意後續編且不超過前期規模的架構，並涵蓋八大建設主軸。"
    status: verified
    observed_at: "2026-11-03T22:44:00+08:00"
    source_ids: [S005]
    evidence_summary: "行政院現行官方整理記載條例與預算架構。"
    tags: ["2017", "前瞻", "特別條例"]
  - id: F004
    statement: "輝達「人工智慧創新研發中心計畫」是在2021年核定，總經費約243億元，其中經濟部補助67億元；執行期程自2022年至2027年。"
    status: verified
    observed_at: "2026-11-03T22:44:00+08:00"
    source_ids: [S006]
    evidence_summary: "中央社引述經濟部技術處資料，明確提供核定年份、總經費與補助金額。"
    verification_notes:
      - "本次尚未找到經濟部原始核定文件，但中央社直接引述經濟部技術處資料，且多家報導一致。"
    tags: ["2021", "輝達", "NVIDIA", "大A+", "67億元"]
  - id: F005
    statement: "2017年前瞻條例攻防發生時，2021年才核定的輝達AI研發中心67億元補助案尚不存在。"
    status: verified
    observed_at: "2026-11-03T22:44:00+08:00"
    source_ids: [S002, S003, S004, S006]
    evidence_summary: "立法院紀錄固定2017年的審查時間；輝達案核定時間為2021年，兩者相隔約4年。"
    tags: ["時間線", "蔣萬安", "輝達", "前瞻"]
  - id: F006
    statement: "2026年媒體報導稱輝達67億元政府補助全數由前瞻基礎建設相關預算支應；本次查核尚未取得對應原始預算明細，因此資金來源細節保留為部分核實。"
    status: partial
    observed_at: "2026-11-03T22:44:00+08:00"
    source_ids: [S007]
    evidence_summary: "自由財經明確報導67億元全數由前瞻經費支應，但本次未取得原始預算明細交叉確認。"
    tags: ["輝達", "前瞻", "67億元", "待補原始文件"]
  - id: F007
    statement: "前瞻各期均留下立法、預算、決算及審計資料；審計部已公開第4期與第5期特別決算審核資訊，提供後續重新檢視個別計畫執行與缺失的制度性資料基礎。"
    status: verified
    observed_at: "2026-11-03T22:44:00+08:00"
    source_ids: [S009, S010]
    evidence_summary: "審計部依法對前瞻特別決算進行審核並公開報告，因此未來若要重查個別計畫，可從既有官方審計與決算資料往下追。"
    verification_notes:
      - "審計缺失不等於犯罪，存在可追溯資料也不等於任何特定人將被起訴。"
    tags: ["前瞻", "審計", "決算", "可追溯性"]

claims:
  - id: C001
    statement: "「蔣萬安2017年擋前瞻」可以直接表述成「蔣萬安當時擋輝達67億元補助案」。"
    status: contradicted
    supports: []
    contradicts: [F002, F004, F005]
    related_facts: [F006]
    reasoning_notes: "2017年的審查標的是前瞻條例與整體規劃；具體輝達案到2021年才核定。可以討論制度與後續資金來源的政治一致性，但不能把後來才出現的個案倒灌成2017年已知的審查標的。"
  - id: C002
    statement: "若2017年國民黨成功擋下前瞻條例，輝達後來必然不會在台設立AI研發中心或擴大布局。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F004, F006]
    reasoning_notes: "這是反事實因果命題。即使確認67億元來自前瞻，也仍需排除一般預算、其他科專、後續重新立法或其他政策工具等替代路徑，才能主張「必然不會發生」。"
  - id: C003
    statement: "2017年前瞻計畫當時「根本沒人知道具體要花到哪裡」。"
    status: contradicted
    supports: []
    contradicts: [F001]
    related_facts: [F002]
    reasoning_notes: "當時已有五大領域、整體規模與部分規劃資料；較精確的批評應是具體個案、細節與預算成熟度不足，而不是完全沒有方向。"
  - id: C004
    statement: "政黨輪替後，前瞻計畫會有「很多人被辦」。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F007]
    reasoning_notes: "現有資料只支持前瞻具有大量可追溯的決算、審計與計畫紀錄，可供未來加強查核；無法由此推定將有多少刑事案件、多少人被調查或被起訴。審計缺失、政策失敗、採購異常與犯罪必須分層判斷。"
  - id: C005
    statement: "前瞻計畫適合建立跨期風險地圖，按計畫、主管機關、補助、採購、履約、變更、驗收、審計缺失與司法結果持續追蹤。"
    status: supported
    supports: [F007]
    contradicts: []
    related_facts: [F001, F003]
    reasoning_notes: "前瞻具跨年度、跨部會、中央與地方、多期特別預算特性，且官方保有立法、決算與審計資料；建立結構化追蹤可把政治攻防轉成可核對的治理與風險分析。"

