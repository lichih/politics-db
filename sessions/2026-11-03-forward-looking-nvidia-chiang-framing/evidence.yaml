notes:
  - "本 session 主要目的不是替蔣萬安或前瞻政策背書，而是防止把2017年的條例攻防與2021年才核定的輝達個案混成同一時間點。"
  - "對外若談「前瞻換政府後可能被重查」，可主張存在大量可追溯資料與審計切口；不可在沒有個案證據時預告犯罪人數或把審計缺失直接寫成貪污。"
  - "後續值得補：輝達67億元補助的原始預算科目／核定文件，以及計畫執行KPI、千人研發團隊、Taipei-1算力開放與實際成果。"
