    published_at: "2021-03-03"
    observed_at: "2026-10-22T02:37:00+08:00"
    retrieval_status: reachable
    notes:
      - "第六點規定國發基金對同一事業投資金額以不超過新臺幣2,000萬元為原則；若新創事業已取得累計募集資金或管理資產達美金10億元以上之國內外投資機構承諾投資，初次投資金額得提高至3,000萬元，但不得超過該投資機構投資金額。"
      - "因此2,000萬元不只是數字上限，而是一般初次投資與特定條件下得提高額度之間的制度邊界；這仍不能單獨證明個案主觀上有規避意圖。"
      - "方案另要求共同投資之天使投資人應充分揭露與申請事業之利害關係。"
      - "此版本早於2022年曠世智能投資；若要判定2022年決策當日的精確適用文字，仍應再取得當時最新版本比對。"

