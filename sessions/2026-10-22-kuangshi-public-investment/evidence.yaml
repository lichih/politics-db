    observed_at: "2026-10-22T02:37:00+08:00"
    source_ids: [S001]
    evidence_summary: "現行官方公司登記直接確認董事身分、持股與負責人。"
    verification_notes:
      - "目前公示經理人欄查無資料，不能倒推歷史上從未擔任營運長。"
