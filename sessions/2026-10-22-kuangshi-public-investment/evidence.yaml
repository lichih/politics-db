  - id: S007
    source_type: primary
    publisher: "法務部全國法規資料庫"
    title: "公職人員利益衝突迴避法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0070008"
    observed_at: "2026-10-22T02:37:00+08:00"
    retrieval_status: reachable
    notes:
      - "第2條將政務人員納入公職人員範圍。"
      - "第3條將公職人員二親等以內親屬，以及該等親屬擔任負責人、董事、獨立董事、監察人、經理人或相類似職務之營利事業等，納入關係人範圍。"
      - "第6條規範知有利益衝突之公職人員自行迴避；第12、13條分別規範利用職權圖利關係人及關係人不當請託關說。"
      - "本法的具體違反與否仍須對照實際決策行為、職權、交易型態、揭露與迴避資料，不能由親屬與董事身分本身直接推出。"

  - id: S008
    source_type: primary
    publisher: "法務部全國法規資料庫"
    title: "行政院國家發展基金收支保管及運用辦法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030241"
    observed_at: "2026-10-22T02:37:00+08:00"
    retrieval_status: reachable
    notes:
      - "第3條規定本基金主管機關為行政院，管理機關為國家發展委員會。"
      - "第6條規定基金設管理會，置委員11至13人，召集人與副召集人由行政院院長就相關人員中派兼或聘兼；重大決議應報行政院核定。"
      - "第7條列管理會掌理基金運用、投資案件審議及監督等事項。"
      - "制度上的主管與任命關係不能直接證明行政院長介入某一個別投資案。"

