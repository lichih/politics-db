facts:
  - id: F001
    statement: "截至本次查詢，經濟部公司登記公示資料列蘇巧純為曠世智能股份有限公司董事，持有4,991,846股；公司負責人／董事長為劉韋男。"
    status: verified
    observed_at: "2026-10-22T02:37:00+08:00"
    source_ids: [S001]
    evidence_summary: "現行官方公司登記直接確認董事身分、持股與負責人。"
    verification_notes:
      - "目前公示經理人欄查無資料，不能倒推歷史上從未擔任營運長。"
    tags: [公司登記, 董事, 蘇巧純]

  - id: F002
    statement: "第三方公司歷史資料列蘇巧純於2021年8月新增為曠世智能董事；官方現行登記可確認她目前仍為董事。"
    status: partial
    observed_at: "2026-10-22T02:37:00+08:00"
    source_ids: [S001, S002]
    evidence_summary: "2021年8月的新增董事時點來自第三方歷史彙整，現任董事身分由官方公示確認；尚缺2021年原始變更登記檔作歷史時點的primary驗證。"
    tags: [公司沿革, 董事, "2021"]

  - id: F003
    statement: "蘇貞昌於2019年1月14日至2023年1月31日擔任行政院院長。"
    status: verified
    observed_at: "2026-10-22T02:37:00+08:00"
    source_ids: [S009]
    evidence_summary: "行政院歷任院長官方資料直接列示任期。"
    tags: [行政院長, 蘇貞昌, 時間線]

  - id: F004
    statement: "國發基金季報列曠世智能投資日期為2022年11月，投資餘額為19,999千元，持股比例8.55%；該投資發生於蘇貞昌2019-2023年行政院長任期內。"
    status: verified
    observed_at: "2026-10-22T02:37:00+08:00"
    source_ids: [S003, S004, S009]
    evidence_summary: "國發基金官方季報直接列出投資日期、金額與持股比例；行政院官方資料提供任期。時間重疊是可驗證事實，不等於介入或圖利。"
    tags: [國發基金, 公股投資, 曠世智能, 時間線]

  - id: F005
    statement: "創業天使投資方案的單一事業投資原則上限至少自2019年已由1,000萬元提高為2,000萬元；2021年3月3日版本明定一般初次投資以不超過2,000萬元為原則，但在取得累計募集資金或管理資產達美金10億元以上之國內外投資機構承諾投資等條件下，初次投資額得提高至3,000萬元且不得超過該投資機構投資額。"
    status: verified
    observed_at: "2026-10-22T02:37:00+08:00"
    source_ids: [S005, S006]
