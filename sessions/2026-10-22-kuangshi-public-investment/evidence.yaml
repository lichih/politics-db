  - id: F005
    statement: "創業天使投資方案的單一事業投資原則上限至少自2019年已由1,000萬元提高為2,000萬元；2021年3月3日版本明定一般初次投資以不超過2,000萬元為原則，但在取得累計募集資金或管理資產達美金10億元以上之國內外投資機構承諾投資等條件下，初次投資額得提高至3,000萬元且不得超過該投資機構投資額。"
