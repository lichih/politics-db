    observed_at: "2026-10-22T02:37:00+08:00"
    source_ids: [S005, S006]
    evidence_summary: "2,000萬元不是本輪已查得的『揭露門檻』，但它具有實質制度效果：留在2,000萬元內屬一般初次投資範圍；超過該額度則須落入方案另定的提高額度條件。"
    verification_notes:
      - "『2,000萬元是上限／原則』不能推出個案不存在規避或邊界操作；是否刻意選擇1,999.9萬元以避免超額條件，仍須查申請、評估、協商及審議紀錄。"
      - "若要判斷2022年11月決策當日的精確條文版本，仍應補當時最新方案全文。"
    tags: [創業天使投資方案, 投資上限, "2000萬元"]

