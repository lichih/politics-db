facts:
  - id: F001
    statement: "2026年10月20日，Threads帳號a728728728以『台北的菜市場柱子是黃金做的嗎？』重新傳播台北市場與前鎮漁港的經費／規模比較框架。"
    status: verified
    observed_at: "2026-10-22T03:32:11+08:00"
    source_ids: [S001]
    evidence_summary: "可證明這套比較在2026年仍持續於社群流通；社群貼文只作傳播脈絡，不作工程數據authority。"
    tags: [Threads, 再流通, 政治圖卡, 社群傳播]

  - id: F002
    statement: "2023年8月8日，民進黨立委許智傑公開將台北第一果菜市場163億元與前鎮漁港81億元直接對照，並主張高雄花費約為台北一半、功能是5倍、土地是10倍。"
    status: verified
    observed_at: "2026-10-22T03:32:11+08:00"
    source_ids: [S002]
    evidence_summary: "媒體對廣播節目發言的同期報導保留了明確比較句，可證明政治人物曾把『土地10倍』作為兩案經費攻防的論據。"
    verification_notes:
      - "本輪未取得廣播節目完整原始影音，因此發言事實以同期secondary記錄；若日後取得節目原檔可升級來源接近度。"
    tags: [許智傑, 民進黨, 前鎮漁港, 第一果菜市場, 政治比較]

  - id: F003
    statement: "2023年8月4日，時任台北市議員吳沛憶也曾把台北市場163億元與前鎮漁港81億元並列作政治回應，但同時明確表示預算合理性應從工程內容討論，而非只拿數字帶風向。"
    status: verified
    observed_at: "2026-10-22T03:32:11+08:00"
    source_ids: [S003]
    evidence_summary: "可證明163億／81億對照不是2026社群臨時生成；至少2023年已進入政治人物公開論述。吳沛憶本人的附帶說明也限制了對其主張的過度解讀。"
    tags: [吳沛憶, 民進黨, 政治比較, 來源沿革]

  - id: F004
    statement: "臺北市第一果菜及萬大魚類批發市場改建案官方所列7.53公頃，是改建工程的基地面積；其主體為地下1層、地上6層與8層的立體批發市場建築。"
    status: verified
    observed_at: "2026-10-22T03:32:11+08:00"
    source_ids: [S004]
    evidence_summary: "臺北市新工處工程介紹直接定義7.53公頃為『基地面積』，並列樓層與工程功能。"
    tags: [台北, 基地面積, 第一果菜市場, 萬大魚市, 建築]

  - id: F005
    statement: "前鎮漁港82.24公頃官方口徑是整體漁港／都市計畫範圍，其中26.63公頃為水域、55.61公頃為陸域，且陸域明確包含碼頭與道路。"
    status: verified
    observed_at: "2026-10-22T03:32:11+08:00"
    source_ids: [S005]
    evidence_summary: "高雄市都市計畫primary直接拆分82.24公頃的構成；該數字不是單一市場建築基地或建築施工面積。"
    tags: [前鎮漁港, 都市計畫, 水域, 陸域, 面積口徑]

  - id: F006
    statement: "前鎮漁港81.37億元專案涵蓋深水碼頭與浚深、下水道及周邊社區、卸魚場與多功能運銷中心、船員中心、交通與環境改善等多類工程，不是單一魚市場大樓造價。"
    status: verified
    observed_at: "2026-10-22T03:32:11+08:00"
    source_ids: [S006, S007]
    evidence_summary: "漁業署primary直接說明總預算範圍與主要分項；以『81億元／82.24公頃』當作單一建築每公頃造價會把大量非建築工程混入分子與分母。"
    tags: [前鎮漁港, 工程範圍, 81億元, 深水碼頭, 下水道, 運銷中心]

  - id: F007
    statement: "前鎮漁港專案中約27億餘元用於既有卸魚場整建及新建約3.9萬平方公尺多功能水產品運銷中心；另約25億元為碼頭／浚深、15億餘元為下水道。"
    status: verified
    observed_at: "2026-10-22T03:32:11+08:00"
    source_ids: [S007]
    evidence_summary: "分項金額顯示81億元總額不能直接視為一棟市場建築的造價；不同工項需要分別找對應規模指標才有可比性。"
    tags: [工程分項, 前鎮漁港, 運銷中心, 碼頭, 下水道]

claims:
  - id: C001
    statement: "許智傑曾在政治攻防中採用『台北第一果菜市場163億 vs 前鎮漁港81億』，並以『土地10倍』強化高雄工程較便宜的比較。"
    status: supported
    supports: [F002]
    reasoning_notes: "此命題只處理公開論述是否存在，不主張許智傑製作了最初圖表，也不推定其主觀上明知數據口徑有問題。"

  - id: C002
    statement: "把台北改建案的7.53公頃與前鎮漁港82.24公頃當作同一種類的施工／建築面積，據此稱前鎮土地規模約為台北10倍。"
    status: contradicted
    contradicts: [F004, F005]
    reasoning_notes: "7.53公頃是台北市場改建基地面積；82.24公頃則是包含26.63公頃水域及碼頭、道路等的整體漁港都市計畫範圍。兩者定義不一致，不能直接作相同面積指標的倍數比較。"

  - id: C003
    statement: "前鎮漁港81億元可直接視為82.24公頃市場建築的改建成本，並與台北7.53公頃市場建築總經費作每公頃效率比較。"
    status: contradicted
    contradicts: [F005, F006, F007]
    reasoning_notes: "81.37億元包含碼頭浚深、下水道、周邊社區、道路、運銷中心與船員中心等；82.24公頃又是整體港區規劃範圍。分子與分母都不是單一建築造價／建築面積口徑。"

  - id: C004
    statement: "僅由『台北163億、前鎮81億、前鎮面積約10倍』即可推出台北市場改建較浪費或前鎮工程效率顯著更高。"
    status: unsupported
    related_facts: [F004, F005, F006, F007]
    reasoning_notes: "兩案工程類型、預算範圍與面積定義均不同。若要比較成本效率，至少需把相同工項、樓地板面積、工程規格、地下層／結構、機電冷鏈、中繼設施、碼頭與下水道等重新標準化。現有圖表式總額／土地面積並列不足以支持效率結論。"

  - id: C005
    statement: "這套比較可以描述為一個『比較基準／概念口徑偷換』案例：真實存在的個別數字被放入不同定義的欄位後，產生看似可直接比較的倍數結論。"
    status: supported
    supports: [F002, F004, F005, F006]
    reasoning_notes: "此處『偷換概念』描述的是論證結構，不推定製圖者或轉傳者的主觀故意。核心問題是基地面積與整體港區面積、單一立體市場與複合港區建設被當成同質比較單位。"

  - id: C006
    statement: "最初製作這張比較圖的人就是許智傑、吳沛憶或特定媒體。"
    status: unresolved
    related_facts: [F001, F002, F003]
    reasoning_notes: "目前證據足以證明2023年政治人物已公開採用相關對照，且2026年仍再流通；本session未建立最初圖表製作者的可驗證來源。原作者身分不影響比較口徑是否成立的判斷。"

