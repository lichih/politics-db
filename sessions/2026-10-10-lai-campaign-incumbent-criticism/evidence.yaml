notes:
  - "保存目的：不以媒體標題代替原始紀錄，優先保存總統府與政黨官方頁面的事件日期、場合、角色標示與短摘錄，供日後比較不同政治人物在國慶、政黨活動與競選站台的發言標準。"
  - "方法限制：本 session 不是「賴清德所有站台發言」的完整清單；它只記錄2026-10-10本次查詢已核實的代表性案例。"
  - "角色區分很重要：「在總統任內參與站台」不等於每一場都「以總統職權身分發言」；因此另以F003、F005保存當場明示總統身分的例子。"
