sources:
  - id: S001
    source_type: primary
    publisher: "僑務委員會"
    title: "僑委會駁斥不實指控：百位僑委連署邀請、未動用公帑，批特定人士扭曲事實、破壞僑界團結"
    url: "https://www.ocac.gov.tw/OCAC/Pages/Detail.aspx?nodeid=346&pid=92219523"
    published_at: "2026-10-24"
    observed_at: "2026-10-24T21:41:00+08:00"
    retrieval_status: reachable
    notes:
      - "僑委會表示，10月22日惜別晚宴邀請徐佳青，是回應超過百位僑務委員於10月21日連署的邀請意願。"
      - "僑委會表示，當日適逢徐佳青生日，與會僑務委員自發唱歌並播放免費紀念短片祝福，『未額外支用公務預算，亦未增加任何經費支出』。"
      - "同一新聞稿說明會議住宿、場地、設備及餐飲等均依相關程序辦理核銷，並說明僑務委員會議的政策研商、僑情建言與凝聚僑界共識等公務目的。"
      - "僑委會另主張歷屆惜別晚宴亦曾邀請前任委員長；本 session 尚未獨立核對具體歷屆案例。"

  - id: S002
    source_type: primary
    publisher: "僑務委員會"
    title: "上百位僑務委員連署邀請前委員長參加之連署書（官方公開影像）"
    url: "https://www.ocac.gov.tw/OCAC/file/attach/92219523/file_599435_s.jpg"
    published_at: "2026-10-24"
    observed_at: "2026-10-24T21:41:00+08:00"
    retrieval_status: reachable
    notes:
      - "連署書提案標題為『邀請徐佳青前委員長出席僑務委員會惜別晚宴』。"
      - "案由寫明為感謝徐佳青任內對全球僑胞的關懷與付出，『建請僑務委員會邀請徐佳青前委員長出席10月22日惜別晚宴』，讓僑務委員表達謝意與祝福。"
      - "建議事項再次寫明『建請僑務委員會邀請徐佳青前委員長出席10月22日惜別晚宴』。因此文件內容不是僑委彼此私下邀約，而是向機關提出由機關邀請的要求。"
      - "公開影像可辨識提案委員及多名連署簽名；本 session 不以影像辨識結果建立個別簽署人的法律責任。"

  - id: S003
    source_type: primary
    publisher: "僑務委員會"
    title: "115年僑務委員會議惜別晚宴 李姸慧籲團結僑社力量建立民主韌性"
    url: "https://www.ocac.gov.tw/OCAC/Pages/Detail.aspx?nodeid=346&pid=92146814"
    published_at: "2026-10-22"
    observed_at: "2026-10-24T21:41:00+08:00"
    retrieval_status: reachable
    notes:
      - "僑委會當日晚宴新聞稿描述10月22日專題演講、研討與惜別晚宴，並稱代理委員長李姸慧感謝全球僑務委員返臺及支持政策。"
      - "該篇當日公開稿未提徐佳青、生日祝福或個人紀念短片。這只能證明當時官方公開稿沒有呈現該段活動，不能單獨證明機關有意隱匿。"

  - id: S004
    source_type: primary
    publisher: "僑務委員會"
    title: "僑務委員會議20日登場 聚焦『建構韌性僑社 守護民主臺灣』"
    url: "https://www.ocac.gov.tw/OCAC/Pages/Detail.aspx?nodeid=346&pid=91685651"
    published_at: "2026-10-12"
    observed_at: "2026-10-24T21:41:00+08:00"
    retrieval_status: reachable
    notes:
      - "會前官方資料將115年僑務委員會議目的描述為僑情建言、政策研商、僑社韌性、國際參與、經貿佈局、文化外交、教育與人才，以及增進僑領對國家發展與政策的理解。"
      - "此來源提供判斷後續臨時新增安排是否可納入原公務目的的 baseline，但不能單憑議程說明排除所有合理的交流或禮節安排。"

  - id: S005
    source_type: primary
    publisher: "中華民國總統府"
    title: "總統令：僑務委員會委員長徐佳青已准辭職，應予免職"
    url: "https://www.president.gov.tw/Page/294/50436"
    published_at: "2026-10-21"
    observed_at: "2026-10-24T21:41:00+08:00"
    retrieval_status: reachable
    notes:
      - "總統令日期為2026年10月12日，內容明載徐佳青已准辭職，應予免職。"
      - "因此10月22日惜別晚宴時，徐佳青已非僑委會現任委員長。"

  - id: S006
    source_type: primary
    publisher: "全國法規資料庫"
    title: "公務員服務法第20條、第21條、第23條、第25條"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0020038"
    observed_at: "2026-10-24T21:41:00+08:00"
    retrieval_status: reachable
    notes:
      - "第20條規定：公務員非因職務之需要，不得動用行政資源。"
      - "第21條規定：公務員對職務上所管理之行政資源應負善良管理人責任，不得毀損、變換、私用或借給他人使用。"
      - "第23條規定違反本法者依情節懲戒或懲處，觸犯刑事法令者另依刑事法令處罰；第25條並處理長官知情而不依法處置的責任。"
      - "本法提供行政資源使用的一般規範，但是否適用及是否構成違反，仍須先確認本案具體決策、資源範圍、職務需要及核准流程。"

  - id: S007
    source_type: secondary
    publisher: "台灣政府採購與標案情報站"
    title: "115年僑務委員會議之住宿、場地、設備及餐飲（案號1150040112C）"
    url: "https://ezbid.tw/detail/3.19/1150040112C"
    published_at: "2026-09-17"
    observed_at: "2026-10-24T21:41:00+08:00"
    retrieval_status: reachable
    notes:
      - "頁面記錄本案得標廠商為圓山大飯店，決標金額887萬元，履約期2026年10月19日至10月23日。"
      - "此為政府採購資料的第三方整理站，故分類為 secondary；可用於核對圓山住宿、場地、設備與餐飲採購規模，但不是1492萬元整體會議支出的官方總表。"

  - id: S008
    source_type: commentary
    publisher: "Facebook / 釣叟・第三方觀點"
    title: "僑委會公布連署書後的政治評論貼文"
    url: "https://www.facebook.com/photo?fbid=1576512694497976&set=a.347766704039254"
    published_at: "2026-10-24"
    observed_at: "2026-10-24T21:41:00+08:00"
    retrieval_status: reachable
    notes:
      - "貼文將僑委會公布的連署書解讀成『100%犯罪文書』，並稱『主犯、從犯都有了』。"
      - "該貼文同時保留並放大『拿公費幫徐佳青辦送別晚宴』的政治定性；此來源用來保存公共論述樣本，不用來證明犯罪成立。"

  - id: S009
    source_type: secondary
    publisher: "TVBS新聞網"
    title: "陳智菡爆僑委會『砸千萬辦徐佳青壽宴』！僑胞怒了：公帑這樣花"
    url: "https://news.tvbs.com.tw/politics/4040477"
    published_at: "2026-10-24"
    observed_at: "2026-10-24T21:41:00+08:00"
    retrieval_status: reachable
    notes:
      - "報導轉述陳智菡稱整場僑務委員會議總花費約1492萬元，並把徐佳青的歡送、慶生安排與該總額並置。"
      - "報導同時記錄生日歌、回顧影片、藏頭文字、獻花及徐佳青發言等現場指控；其中部分活動已被僑委會承認，但1492萬元不是目前已取得的『徐佳青個人活動支出』。"

facts:
  - id: F001
    statement: "2026年10月21日，超過百位僑務委員連署提出『建請僑務委員會邀請徐佳青前委員長出席10月22日惜別晚宴』；僑委會10月24日公開承認，本次邀請是回應該連署意願。"
    status: verified
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S001, S002]
    evidence_summary: "官方公開的連署書與僑委會後續新聞稿互相印證：連署的請求對象是僑委會，內容是請機關邀請徐佳青，而僑委會亦承認其邀請行為是回應該連署。"
    verification_notes:
      - "這建立的是『僑委提出要求 → 機關回應並邀請』的決策鏈，不等於連署人因此負有行政或刑事責任。"
    tags: ["2026", "僑務委員會", "徐佳青", "連署", "邀請", "decision-chain"]

  - id: F002
    statement: "連署書的明示理由是感謝徐佳青任內對全球僑胞的關懷與付出，並讓僑務委員在官方惜別晚宴當面表達謝意與祝福。"
    status: verified
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S002]
    evidence_summary: "連署書案由與建議事項均直接記載上述目的。"
    verification_notes:
      - "連署書沒有直接寫『生日慶生』，因此不能把所有後續慶生活動都視為連署文本本身明示要求。"
    tags: ["2026", "連署書", "惜別晚宴", "公務目的", "祝福"]

  - id: F003
    statement: "10月22日晚宴當日確有針對徐佳青的生日祝福安排；僑委會承認與會僑務委員共同唱歌並播放免費紀念短片，但主張這些屬僑委自發行為且沒有額外支用公務預算。"
    status: verified
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S001]
    evidence_summary: "僑委會10月24日官方澄清直接承認生日歌與紀念短片存在，同時提出『自發』『免費』『未額外支用公務預算』的辯解。"
    verification_notes:
      - "『沒有額外支出』只處理邊際成本；尚未回答是否使用既有公費場地、設備、活動時間、人力或流程，也未回答該使用是否屬職務需要。"
      - "紀念短片由誰製作、誰提供播放、誰核准納入流程，目前仍未確認。"
    tags: ["2026", "生日", "紀念短片", "no-extra-cost", "administrative-resources"]

  - id: F004
    statement: "僑委會在10月22日當日發布的惜別晚宴新聞稿，將晚宴公開描述為感謝全球僑務委員返臺、支持政策與貢獻國家的活動，未在該篇公開稿中提到徐佳青、生日祝福或個人紀念短片。"
    status: verified
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S003]
    evidence_summary: "10月22日僑委會官方稿可直接核對其當時公開呈現的活動內容與對象。"
    verification_notes:
      - "這是『官方公開稿未呈現』的事實，不能單獨推出『故意隱匿』的主觀動機。"
    tags: ["2026", "official-reporting", "惜別晚宴", "scope"]

  - id: F005
    statement: "115年僑務委員會議在會前公開的核心目的包括僑情建言、政策研商、僑社韌性、凝聚僑界共識及增進僑領對國家政策的理解。"
    status: verified
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S004]
    evidence_summary: "僑委會10月12日會前新聞稿直接列出會議主題、研討內容與政策目的。"
    verification_notes:
      - "此 baseline 不排除官方會議包含合理的聯誼、禮節或前首長交流；但臨時新增的個人致意／慶生若被主張為公務目的，仍需要能說明其與職務目的的連結。"
    tags: ["2026", "meeting-purpose", "baseline", "僑務政策"]

  - id: F006
    statement: "徐佳青於10月12日已由總統令准辭並免職，因此10月22日出席惜別晚宴時已非僑委會現任委員長。"
    status: verified
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S005]
    evidence_summary: "總統府公報中的10月12日總統令直接支持。"
    tags: ["2026", "徐佳青", "免職", "former-official"]

  - id: F007
    statement: "《公務員服務法》第20條以『職務之需要』作為動用行政資源的一般規範，第21條另禁止對職務上管理的行政資源私用或借給他人使用；條文並非以『有無新增支出』作為唯一判準。"
    status: verified
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S006]
    evidence_summary: "現行法條文字直接規定行政資源使用的職務需要與管理義務。"
    verification_notes:
      - "此 fact 只確認規範內容，不直接判定本案已構成違反。具體適用仍需確認何人作成決定、使用哪些資源、是否有職務需要及相關核准依據。"
    tags: ["2026", "公務員服務法", "行政資源", "職務需要", "legal-standard"]

  - id: F008
    statement: "目前可核對的圓山飯店『住宿、場地、設備及餐飲』採購決標金額為887萬元；公開政治／媒體敘事中的1492萬元則是整場僑務委員會議總支出的說法，不能直接等同於徐佳青個人歡送或慶生活動的支出。"
    status: partial
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S007, S009]
    evidence_summary: "第三方採購資料可核對887萬元會議住宿、場地、設備與餐飲契約；1492萬元目前主要來自政治人物指控與媒體轉述，尚未取得完整官方總支出表，更沒有資料顯示1492萬元全數為徐佳青個人活動所支出。"
    verification_notes:
      - "887萬元來源目前為採購資料第三方整理站，後續若取得政府電子採購網原始決標公告應替換或補強。"
      - "1492萬元的完整構成與官方核銷明細仍待取得。"
    tags: ["2026", "1492萬", "887萬", "procurement", "cost-allocation"]

  - id: F009
    statement: "僑委會主張歷屆僑務委員會議惜別晚宴亦曾邀請前任委員長，但目前本 session 尚未獨立確認具體年份、前任委員長與活動性質是否與本案相同。"
    status: partial
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S001]
    evidence_summary: "官方新聞稿確實提出歷屆先例主張，但尚缺具體案例資料供 baseline 比對。"
    verification_notes:
      - "不可把『機關聲稱有先例』直接升格成『已證明本案做法符合一貫慣例』。"
    tags: ["2026", "precedent", "baseline", "unverified-history"]

  - id: F010
    statement: "僑委會公布連署書後，已有公開評論將連署書直接稱為『100%犯罪文書』並把簽署者描述成主犯、從犯；但現有資料只證明簽署者要求機關邀請徐佳青，尚未建立任何具體犯罪構成要件。"
    status: verified
    observed_at: "2026-10-24T21:41:00+08:00"
    source_ids: [S008, S002]
    evidence_summary: "Facebook公開貼文提供該政治定性的樣本；官方連署書本身則顯示其內容是邀請建議。兩者對照可區分『存在連署』與『連署即犯罪』兩個不同命題。"
    verification_notes:
      - "本 fact 保存公共論述與文件內容的落差，不對貼文作者的主觀惡意作判斷。"
    tags: ["2026", "overclaim", "crime-label", "連署", "commentary-sample"]

claims:
  - id: C001
    statement: "『僑務委員會花1492萬元替徐佳青辦歡送兼慶生』可以把整場會議總支出直接視為徐佳青個人活動支出。"
    status: unsupported
    supports: []
    contradicts: [F008]
    related_facts: [F003]
    reasoning_notes: "現有證據最多能證明公費會議中確實出現徐佳青個人致意與生日祝福安排；不能把整場會議、住宿、場地、機票等總成本全部歸因給該個人活動。這是成本歸屬與用途兩個不同問題。"

  - id: C002
    statement: "徐佳青出席10月22日惜別晚宴純屬僑委之間的私人自發安排，僑委會沒有作成任何邀請決定。"
    status: contradicted
    supports: []
    contradicts: [F001, F002]
    related_facts: []
    reasoning_notes: "官方連署書明寫『建請僑務委員會邀請』，僑委會又公開承認『本次邀請是應超過百位僑務委員連署』。因此至少邀請本身存在機關回應與決定環節。"

  - id: C003
    statement: "只要徐佳青相關安排沒有增加額外經費，就足以排除公務資源使用是否合法或適當的問題。"
    status: contradicted
    supports: []
    contradicts: [F007]
    related_facts: [F003, F005]
    reasoning_notes: "《公務員服務法》第20條的文字判準是職務需要，第21條處理行政資源管理與私用；『沒有新增支出』只能回答邊際成本，不能單獨取代公務目的、職務需要與資源用途的檢驗。"

  - id: C004
