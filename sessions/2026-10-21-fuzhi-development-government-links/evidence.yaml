facts:
  - id: F001
    statement: "統編89168543之公司於2022-11-15以『璽田建設開發有限公司』設立，代表人為詹筱涵、資本額100萬元；2024-12-27遷址至高雄市岡山區岡山路267號14樓之1，2026-08-13更名為『富畤開發建設有限公司』。"
    status: verified
    observed_at: "2026-10-21T13:18:00+08:00"
    source_ids: [S001, S002, S003]
    evidence_summary: "公司統編、代表人、資本額及2024遷址可由政府公司變更清冊與多個公司資料彙整頁交叉確認；2026更名由近期公司資料頁一致列示。"
    verification_notes:
      - "因此搜尋歷史政府往來時必須同時以統編89168543與舊名『璽田建設開發有限公司』檢索，不能只查2026年8月才啟用的現名。"
    tags: [公司沿革, 統編89168543, 更名, 遷址]

  - id: F002
    statement: "該公司登記營業項目包含投資興建公共建設、新市鎮／新社區開發、都市更新、區段徵收及市地重劃代辦等可能涉及公部門程序的業務。"
    status: verified
    observed_at: "2026-10-21T13:18:00+08:00"
    source_ids: [S002]
    evidence_summary: "公司登記營業項目確有相關類別；營業項目只表示可經營範圍，不能證明實際承作政府案件、取得特許或參與特定開發案。"
    tags: [營業項目, 公共建設, 都市更新, 重劃]

  - id: F003
    statement: "該公司2022年至2024年使用的登記地址『高雄市三民區民族一路80號27樓之2』是大量公司共址地址；經濟部公示資料對該地址至少顯示70家核准設立公司。"
    status: verified
    observed_at: "2026-10-21T13:18:00+08:00"
    source_ids: [S003, S004]
    evidence_summary: "這降低了以舊地址本身推導關係網的證據力；共址可形成後續查核線索，但不是控制、合作或利益關係的證明。"
    tags: [共址, 公司登記, evidence-boundary]

  - id: F004
    statement: "本輪以統編89168543、現名『富畤開發建設有限公司』及舊名『璽田建設開發有限公司』搜尋一般網頁、政府網域及多個標案索引網站，未找到可核實的政府標案得標紀錄。"
    status: partial
    observed_at: "2026-10-21T13:18:00+08:00"
    source_ids: [S005]
    evidence_summary: "公開索引搜尋未命中具體採購案，但政府電子採購網動態查詢結果未能由本次工具直接取回，故只能記錄『此次搜尋未找到』，不能寫成『該公司從未得標』。"
    verification_notes:
      - "not_found != never_existed。"
      - "最終確認仍應以政府電子採購網用廠商統編89168543直接查詢全部期間之得標廠商與投標廠商紀錄。"
    tags: [政府採購, 標案, not_found, unresolved]

  - id: F005
    statement: "本輪以公司現名、舊名、統編及代表人姓名搭配『台糖』『橋頭』『土地』『建照』『起造人』『補助』『都更』『重劃』等關鍵字搜尋，未找到可直接證明該公司參與橋頭糖廠、高雄新市鎮第三期、台糖土地或特定政府開發案的公開資料。"
    status: partial
    observed_at: "2026-10-21T13:18:00+08:00"
    source_ids: [S001, S002, S003]
    evidence_summary: "目前只有公司位於岡山、營業項目涵蓋開發業務等背景事實；沒有找到把公司與橋頭／台糖個案連起來的契約、標案、建照、土地文件或官方名單。"
    verification_notes:
      - "搜尋不到不是證明不存在；若有土地謄本、建照資料、都市計畫事業單位名冊或契約當事人名單，應另行加入。"
    tags: [台糖, 橋頭, 高雄新市鎮, not_found, unresolved]

  - id: F006
    statement: "2026-08-13的變更登記在現有資料中呈現為同一統編89168543之公司名稱由『璽田建設開發有限公司』改為『富畤開發建設有限公司』；負責人詹筱涵、登記地址高雄市岡山區岡山路267號14樓之1及資本額100萬元均未隨此次變更而改變。"
    status: verified
    observed_at: "2026-10-21T13:41:39+08:00"
    source_ids: [S002, S003, S006]
    evidence_summary: "這是同一公司主體的名稱變更，而不是以新統編另設公司；因此若目標是切斷既有公司法律身分、債務或以公司識別碼追蹤的政府紀錄，單純改名的能力有限。"
    verification_notes:
      - "此事實本身不能回答改名的主觀動機。"
      - "名稱變更仍可能影響只用公司名稱進行的一般網路搜尋與人工查找。"
    tags: [更名, 統編, 法律主體, 搜尋可見性]

claims:
  - id: C001
    statement: "富畤開發建設有限公司已可被證明是政府標案承包商或與政府存在特殊採購關係。"
    status: unresolved
    related_facts: [F004]
    reasoning_notes: "目前一般公開搜尋未找到具體標案，且官方政府電子採購網的廠商統編查詢結果尚未成功直接取回；證據不足以支持，也不足以斷言從未存在。"

  - id: C002
    statement: "富畤開發建設有限公司已可被證明參與橋頭糖廠、高雄新市鎮第三期或台糖土地開發。"
    status: unsupported
    contradicts: [F005]
    reasoning_notes: "本輪未找到契約、標案、土地或建築許可等直接連結。公司所在地與營業項目不能填補這個證據缺口。"

  - id: C003
    statement: "富畤／璽田的登記地址可直接證明其與同地址公司形成政商或控制關係。"
    status: unsupported
    contradicts: [F003]
    reasoning_notes: "舊址本身至少70家公司共址，現址亦有大量公司共址；地址重合的辨識力低，須另有股權、董事、交易、電話、網站、契約或金流等關係證據。"

  - id: C004
    statement: "現有公開資料已足以把同名『詹筱涵』之個人政治獻金歸屬於富畤開發建設有限公司代表人。"
    status: unsupported
    related_facts: [F001]
    reasoning_notes: "第三方資料頁明示政治獻金欄是姓名比對且可能非同一人；在沒有可區別身分的額外資料前不得歸屬。"

  - id: C005
    statement: "富畤開發建設有限公司在2026-08-13改名，是為了規避既有法律責任、政府採購拒絕往來資格或其他以公司主體為基礎的公法責任。"
    status: unsupported
    contradicts: [F006]
    reasoning_notes: "現有資料只證明同一統編公司改名，未見另設新公司、換統編、換負責人或同步進行其他可切斷主體連續性的變更。政府採購拒絕往來資料亦具有廠商代碼欄位，因此單純改名不是有效證明『洗掉』公司主體紀錄的方法。若要成立規避論，仍須找到改名前已存在的具體責任或資格障礙，以及改名後實際避開該障礙的證據。"

  - id: C006
    statement: "2026-08-13改名可能具有降低一般名稱搜尋可見性、重置品牌或切斷舊名稱聲譽連結的效果。"
    status: unresolved
    related_facts: [F006]
    reasoning_notes: "名稱改變客觀上會使只搜『璽田建設』或只搜『富畤開發』的查詢產生不同結果，因此在機制上可能降低name-only搜尋的連續性；但目前沒有找到改名前的負面事件、爭議、裁罰、訴訟或標案障礙可作為改名動機的trigger，故不能進一步認定其目的就是聲譽洗白或規避查核。"

