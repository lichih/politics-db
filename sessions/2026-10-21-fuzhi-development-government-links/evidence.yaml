notes:
  - "對『改名是不是規避手段』應拆成兩個不同命題：法律主體／資格規避與搜尋／聲譽可見性規避。現有證據不支持前者；後者在技術上可能，但尚缺觸發事件與動機證據。"
  - "下一步證據優先序：政府電子採購網以統編89168543直接查全期間得標／投標紀錄；高雄市建管或建築執照資料以公司名、統編反查；如研究橋頭／台糖個案，再從都市計畫書、土地權屬、標售／設定地上權／合作開發契約與起造人名冊反向找公司。"
  - "目前最重要的邊界是：公司營業項目含公共建設與重劃，不等於實際承接政府開發；位於岡山，也不等於參與橋頭案。"
