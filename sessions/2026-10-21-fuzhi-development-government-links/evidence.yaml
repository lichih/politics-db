      - "頁面另列出多家與現址相同的公司／商號；共址本身不能證明彼此有控制、交易或政商關係。"
      - "頁面有『詹筱涵』同姓名政治獻金資料，但網站明示名稱比對可能不是同一人，故本session不將該紀錄歸屬於公司代表人。"

