facts:
- id: F001
  statement: 賴清德於2023年9月21日競選政見明確承諾「三班護病比入法，上任2年內完成入法，任內完成配套措施實施」。
  status: verified
  observed_at: '2026-10-20T17:21:00+08:00'
  source_ids: [S001]
  evidence_summary: 原始政見同時包含兩個不同期限：兩年內完成入法，以及任內完成配套措施實施。
  tags: [政見, 時間線, 賴清德]
- id: F002
  statement: 衛福部在2013、2014年先進行三班護病比試評；2015年正式納入醫院評鑑時採用的是全日平均護病比（醫學中心1:9、區域1:12、地區1:15，醫學中心另有白班1:7）。
  status: verified
  observed_at: '2026-10-20T17:21:00+08:00'
