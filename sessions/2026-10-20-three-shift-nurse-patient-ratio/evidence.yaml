    rationale: 可作為「獎勵型政策與強制最低標準的差異」「結果完成與政治歸責分離」「利益關係人代表比例與決策權」的長期比較案例。
notes:
- 最重要的防呆：『結果在期限內成法』不自動等於『承諾者／行政部門主動履約』。每次引用都必須分開檢查提案來源、政府當時立場、最後通過版本、公布／副署與實施狀態。
- 『入法』在本議題曾被用於不同層級：2019年全日平均護病比納入《醫療機構設置標準》、2026年三班護病比明文進《醫療法》。對任何『已入法／未入法』說法都先問法律層級與法律效果。
- 2024三班護病比獎勵政策並非毫無效果；院級資料可找到真實補充夜班人力的醫院。不能因支持強制入法，就抹掉這些反例。
- 反之，院級平均達標不等於逐病房逐班達標；不要用較粗的公開資料粒度推出更細的現場結論。
- 1/3與≥1/2應作治理結構分析：可確定席次權重不同；不能在缺乏議事規則時直接宣稱1/2必然具有法律否決權，也不能假設其餘2/3全是醫院代表。
- 醫院是否增減病床、人力與財務規劃屬醫院經營治理程序；但『護理師承受工作量』與『管理端決定資源配置』的更完整因果鏈，若要公開成為法律／治理結論，仍應補醫院內部治理與勞動實證。
- 具名民進黨政治人物確有『被賣／被騙』等攻防語言；匿名抹紅、威脅是否由政黨組織指揮目前未證，不得升格定性。
- 不保存使用者或其家人的私人護理職涯 anecdote；公開 evidence 只保留可外部查核資料。

- 2026-10-29追加薪資／AI爭議：2025年官方年薪／12月均呈現方式已被立法院指出容易與每月經常性實領混淆。它與2026陳相國聲稱的『政府上台後加薪3至5萬元』是兩個不同的量，不得拿其中一者直接證明另一者。
- 薪資增加與AI減輕紀錄負荷有可能是實際改善，但須分別驗證醫院、期間、母體、薪資構成、記錄效率與臨床交班完整性。新聞反彈、護理團體聲明、部長待求證本身都不是『全國零改善』的證據。
- 這案首先放在護病比／醫療治理的決策代表性與指標透明度下；不得只為套上公權力不可證偽母題，就把本可用薪資及交班工時反證的主張說成邏輯上不可證偽。
