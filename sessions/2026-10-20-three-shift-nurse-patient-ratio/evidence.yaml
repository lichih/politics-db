claims:
- id: C001
  statement: 若只把賴清德2023政見中的「上任2年內完成入法」理解為在兩週年前完成母法公布，該窄命題在形式上已完成。
  status: supported
  supports: [F001, F012, F013]
  contradicts: []
  related_facts: [F017]
