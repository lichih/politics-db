notes:
  - "範圍與權威：本檔專門稽核 AI 作者之證據使用、論證一致性、版本與修正行為，不是證明沈伯洋或其他政治人物有罪、雙標或受到組織指揮的外部證據。"
  - "雙標檢驗的必要問題：（1）有沒有具體可核對的相似案例；（2）客觀差異是否足以解釋差別待遇；（3）換掉政黨和人物身分，是否仍採同一推論門檻；（4）有沒有真能改變結論的反例；（5）論斷是否超出個案來源；（6）作者是否把當事人的自我辯護誤認反證。"
  - "假中立警訊：不可將『未知是否另有案例』『不是母體代表樣本』『形式上沒有矛盾』等在當前命題無承擔作用的說法，反覆拿來降低個案證據權重。"
  - "反向迎合警訊：使用者指出問題後，AI 仍必須自行核對證據，不得因為批評方向相符就把具體差異推成全面定性。"
  - "落實規則：先寫待證命題，再以同一條件審查反方與正方；每一個限制條件都要回答『它削弱哪項具體推論』。若答不出，不作為文章中的平衡但書。"
