claims:
  - id: C001
    statement: "作者早期過度強調形式邏輯相容性，忽略其在不同政治案例的非對稱運用。"
    status: supported
    supports: [F001, F002]
    reasoning_notes: "這是對文章論證安排的具體稽核，不是政治人物道德定性的獨立證據。"
  - id: C002
    statement: "三個定向查得的案例若要進行個案雙標比較，必須先證明可代表當事人的全部歷史言論。"
    status: contradicted
    contradicts: [F002, F003]
    reasoning_notes: "統計代表性僅對『大多數發言』『整體比例』等母體概括命題必要；對可核對個案的差異比較，應查個案可比性、客觀差異、實際反例與推論門檻。將母體要求套在個案比較上屬不相關保留，可能造成假中立。"
  - id: C003
    statement: "當事人自行說『交流者不一定參與統戰』就足以作為其沒有雙標的反證。"
    status: unsupported
    related_facts: [F001, F002]
    reasoning_notes: "宣示只能確立當事人自稱採用的原則。需要看對不同陣營的實際適用，不能自動替當事人免責。"
  - id: C004
    statement: "使用者指出論證問題，即證明 AI 受到使用者洗腦或政治指揮。"
    status: unsupported
    related_facts: [F001, F002, F004]
    reasoning_notes: "修改是可核對的作者行為，不可從接受批評推定心理操控；應由獨立來源與對稱標準評估修訂後內容。"
  - id: C005
    statement: "已查到三個定向案例，即能推論當事人所有發言都呈相同分布。"
    status: unsupported
    related_facts: [F003]
    reasoning_notes: "只有主張整體歷史言論分布時才需要母體抽樣；也不應把個案比較自動擴張成無例外的全稱結論。"

