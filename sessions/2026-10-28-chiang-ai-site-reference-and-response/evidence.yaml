notes:
  - "此 session 核心是把『參考對手網站』、『是否侵權』、『平台審核能力』及『應對論述是否對題』拆開；不可因政治立場把它們合併。"
  - "使用者明確表示不認為研究、參考對手網站是問題，反認為競選團隊不研究對手才不稱職；但這不代表不能批評蔣團隊的審核與回應能力。這是使用者的政治評價，不是 sources 所證明的客觀事實。"
  - "不可把『北韓習氣』回答直接定性為針對特定 AI 提示詞指控；已查得報導顯示它至少也涉及活動形式模仿之爭。"
  - "下一步：保存爭議作品的實際頁面、AI 提示詞完整內容、時間序及程式碼／素材授權，並確定『島主』身分與競總審核流程。"
