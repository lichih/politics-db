notes:
  - "本 session 的核心用途是建立可重用時間線與政策成熟度比較基準，不替任何政黨或人物預設結論。"
  - "『提出過很多次』、『願景寫得很具體』、『已完成可行性驗證』是三個不同命題，必須分開。"
  - "土地再利用、AI園區、公園、住宅、捷運等屬遷移後願景；桃園機場承接、國防、離島交通、救災救難、醫療後送、民航功能、跨機關權責等屬遷移本身的核心可行性鏈。"
  - "Specificity != feasibility；detail != evidence；vision != plan。"
  - "本次證據支持『民進黨相關候選人長期多次提出松機遷移』，但不支持把民進黨所有人物與所有執政時期概括成一致立場。"
