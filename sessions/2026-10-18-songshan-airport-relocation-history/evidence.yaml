facts:
  - id: F001
    statement: "2002年，民進黨台北市長參選人李應元提出『遷移松山機場，打造首都中央公園』競選政見，主張將原有航線移往當時的中正機場，並以松機原址進行大型公園與都市發展規劃。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S001]
    evidence_summary: "2002年選戰同期報導直接記錄李應元的松機遷移與中央公園政見。"
    tags: ["2002", 李應元, 民進黨, 松機遷移, 中央公園]

  - id: F002
    statement: "2006年台北市長選舉期間，民進黨參選人謝長廷提出『松山機場再生計畫』，描述松機退場後將部分土地作中央森林公園，其他部分規劃文化創意、藝術、體育等用途。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S002, S015]
    evidence_summary: "2006年同期報導保存謝長廷方案內容；2007立院紀錄亦把謝長廷列為曾主張松機遷移的台北市長參選人。"
    tags: ["2006", 謝長廷, 民進黨, 松機再生]

  - id: F003
    statement: "2014年民進黨台北市長初選辯論中，姚文智主張廢除松山機場、推動大規模公辦都更，並把松機改造成超過400公頃的中央公園。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S003]
    evidence_summary: "公視對初選辯論的同期報導直接記錄姚文智發言。"
    tags: ["2014", 姚文智, 民進黨, 中央公園]

  - id: F004
    statement: "2015年臺北市政府『首都圈論壇』中，姚文智以蔡英文總統候選人代表身分表示，該主張經民進黨內部研討，並公開主張2020年松山機場遷移；這可證明當時蔡英文陣營代表曾在正式論壇公開承擔該立場，但不等同於自動證明其後每一時點的民進黨正式黨綱都採相同立場。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S004]
    evidence_summary: "官方逐字實錄保存姚文智自述代表身分、黨內研討與2020遷移主張。"
    tags: ["2015", 姚文智, 蔡英文, 民進黨, 2020遷移]

  - id: F005
    statement: "同一場2015論壇中，民航局代表明確指出松機同時具有民航、國防、救災救難、國內離島與商務等功能，並警告桃園機場容量不能用簡單加總處理；當時並認為2020年以既有兩條跑道無法直接承接全部松機航空器，主張政策需經整體、確實評估才有可行性。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S004]
    evidence_summary: "官方會議實錄同時保存支持遷移的政治主張與民航專業機關提出的容量、國防、救災、運輸限制。"
    tags: ["2015", 民航局, 桃園機場容量, 國防, 救災, 可行性]

  - id: F006
    statement: "2017至2018年姚文智再把松機遷移／廢除列為台北市長選舉核心政見，並提出政策確定、設計競圖、機場退場與中央公園施工等競選時程；這些時程是候選人的政策目標，不等同於已完成跨部會可行性驗證。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S005]
    evidence_summary: "中央社保存姚文智的選舉政見與時程；來源本身沒有證明相關中央機關已完成核定或替代功能方案。"
    tags: ["2017", "2018", 姚文智, 時程, 政見]

  - id: F007
    statement: "2018年民進黨台北市長初選內部對松機存廢並無一致立場：姚文智支持遷移並改為中央公園，呂秀蓮則主張保留松機，理由包含國際門戶、國防與離島／花東交通等功能。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S006]
    evidence_summary: "同一黨內初選辯論呈現相反政策立場，足以反駁『民進黨歷來在此議題始終一致』的過度概括。"
    tags: ["2018", 民進黨, 姚文智, 呂秀蓮, 黨內分歧]

  - id: F008
    statement: "2022年民進黨立委補選參選人吳怡農主張配合桃園機場第三跑道時程遷移松機，原址全區作公園，並提出2024年前完成規劃與政策定案、中央與雙北成立專責機構等執行構想。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S007]
    evidence_summary: "中央社完整記錄吳怡農政策發布內容。"
    tags: ["2022", 吳怡農, 民進黨, 第三跑道, 專責機構]

  - id: F009
    statement: "吳怡農提出松機遷移後，民進黨政府的交通部長王國材公開指出，松機仍承擔大量離島／東部旅次、軍民合用與首都防衛、空勤總隊緊急救援及離島運送等功能，不能只從單一城市發展角度判斷遷建。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S008]
    evidence_summary: "同一政治陣營執政下的交通主管機關對本黨候選人方案提出功能替代與國家層級限制。"
    tags: ["2022", 交通部, 王國材, 離島交通, 國防, 空勤救援]

  - id: F010
    statement: "2022年12月，尚未就任台北市長的蔣萬安就吳怡農松機遷移政見表示，議題涉及民用、軍用、商用、都市發展與在地需求，須中央地方完善溝通並提出兼顧國土與地方需求的具體方案，重大議題不應只在選舉期間倉促提出。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S009]
    evidence_summary: "蔣萬安本人2022年公開建立了對松機遷移案的可行性與跨機關說明門檻，可作為2026檢驗其自身方案的一致性基準。"
    tags: ["2022", 蔣萬安, 一致性基準, 具體方案, 跨機關]

  - id: F011
    statement: "交通部109年交通年鑑記載：2015年完成松機2030整體規劃後，因臺北市政府主張遷建，行政院2016年要求民航局加強地方溝通；民航局研析後認為北部維持兩座機場較佳，確立不遷建松機的政策立場，並於2020年啟動松機2040整體規劃。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S010]
    evidence_summary: "交通部官方年鑑證明：地方遷建主張長期存在，但中央民航政策在2016後曾明確採取維持兩機場、松機不遷建路線。"
    tags: ["2016", "2020", 交通部, 兩機場政策, 2040規劃]

  - id: F012
    statement: "民航局2026年說明，2023年松機2040整體規劃仍把松機定位為首都國際商務機場與國內航空樞紐；北市府2023年曾表示長期遷建有利都市規劃、希望中央納入思考，同時對中央當時的松機規劃表達尊重。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S011, S014]
    evidence_summary: "可同時排除兩個極端說法：蔣市府在2026前不是完全未曾表達遷建偏好，但2023也不是已啟動松機遷建執行計畫。"
    tags: ["2023", 蔣市府, 2040規劃, 國際商務機場, 國內航空樞紐]

  - id: F013
    statement: "2026年10月8日蔣萬安正式提出松機遷移願景，北市府新聞稿具體列出機場及周邊約300公頃的下游土地利用：100公頃AI產業聚落、90公頃住宅及支援性公共設施、110公頃公園綠地，並主張釋放570公頃航高禁限建都市更新地區及重新布局交通路網。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S012]
    evidence_summary: "北市府第一手新聞稿證明方案並非『只有一句廢松機』，至少對遷移後土地用途與都市願景已有大量具體描述。"
    tags: ["2026", 蔣萬安, AI園區, 土地利用, 都市願景]

  - id: F014
    statement: "截至蔣萬安2026年10月提出方案後的中央說明，北市府在其任內過去數年並未主動與交通部或民航局展開松機遷移的專業協調；2023的接觸是交通部就2040規劃主動徵詢，北市府表達遷建有利城市發展並請中央納入思考。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S013, S014]
    evidence_summary: "中央說法顯示2026宣布前曾有政策偏好表達，但尚不能據此認定已存在持續、正式的跨部會遷建可行性工作。"
    tags: ["2023", "2026", 跨部會協調, 可行性]

  - id: F015
    statement: "從2002李應元、2006謝長廷、2014與2017-18姚文智、2015蔡英文陣營代表主張，到2022吳怡農，松機遷移／退場與原址再利用在民進黨相關候選人與陣營中至少跨二十年反覆被提出；因此2026蔣萬安提出『遷移松機』這個方向本身不是首次出現的新政策概念。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S001, S002, S003, S004, S005, S007]
    evidence_summary: "多個不同年份的同期或官方來源形成連續時間線。這項事實只證明政策構想長期存在，不證明任一版本已具可行性。"
    tags: [歷史脈絡, 民進黨, 跨年份, 重複主張]

  - id: F016
    statement: "不同年份對松機遷移的反對或保留理由高度重複，至少包括桃園機場承接容量、民航與離島／東部交通、軍事與首都防衛、空勤／救災、跨機關權責與整體國土規劃；這些問題在2015官方論壇與2022交通部回應中均已明確存在。"
    status: verified
    observed_at: "2026-10-18T12:36:37+08:00"
    source_ids: [S004, S008, S009]
    evidence_summary: "核心可行性問題並非2026政治攻防才新出現，而是長期政策討論中反覆被主管機關與政治人物提出。"
    tags: [可行性, 桃園機場容量, 國防, 離島交通, 救災, 跨機關]

