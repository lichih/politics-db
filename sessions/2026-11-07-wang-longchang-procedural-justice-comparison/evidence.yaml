  - "待補王隆昌再審判決115年度再字第3號全文、2012原確定判決及監察院2013調查原件；比較原審如何處理課表反證及黃維安供述瑕疵。"
  - "區分『救濟出現改善』與『預防錯判未充分實現』，避免將政黨輪替當成原因已證明。"
