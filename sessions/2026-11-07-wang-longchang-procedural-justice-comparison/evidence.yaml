facts:
  - id: F001
    statement: "王隆昌遭判刑7年8月，2012年12月有罪確定；2026年10月1日高院115年度再字第3號再審改判無罪，11月2日高檢署表示不上訴，無罪確定。"
    status: verified
    observed_at: "2026-11-07T21:13:00+08:00"
    source_ids: [S001, S002, S003, S004]
    evidence_summary: "案件橫跨逾十年，終局結果已由高檢署不上訴訊息與司改會聲明互相印證。"
    tags: [王隆昌, 再審, 無罪確定]
  - id: F002
    statement: "再審判決（據中央社引述）指出未查得王隆昌收受賄款的金流、與黃維安之通聯或見面交款影像；黃維安曾稱2003年11月4日晚間見面，但校方授課資料顯示王當時固定授課且無請假紀錄。"
    status: verified
    observed_at: "2026-11-07T21:13:00+08:00"
    source_ids: [S001, S004]
    evidence_summary: "客觀課表與證人特定見面日期相衝突；法院認為證詞多次不一、欠缺補強證據，不能據以不利認定。"
    verification_notes:
      - "verified 指可確認媒體如此引述再審判決；仍須取得115年度再字第3號全文核對語句及全部其他證據。"
    tags: [客觀反證, 補強證據, 污點證人]
  - id: F003
    statement: "監察院2013年已對王隆昌案提出疑點；2015年檢察總長提非常上訴遭駁回；2024年高檢署有罪確定案件審查會建議再審；2025年6月高院曾駁回再審，2026年5月才裁定開始再審。"
    status: verified
    observed_at: "2026-11-07T21:13:00+08:00"
    source_ids: [S001, S003, S004]
    evidence_summary: "從早期監察院意見至正式開啟再審，先後經過多個救濟節點，具有救濟時滯比較意義。"
    tags: [非常上訴, 再審, 救濟時滯]
  - id: F004
    statement: "王隆昌案2012年定讞後，經歷2016年國民黨轉民進黨的中央執政政黨輪替，以及2024年民進黨內總統交接，2026年才獲無罪確定；同時2024年高檢署有罪確定案件審查機制協助推動再審，不能直接稱司法救濟制度完全沒有改善。"
    status: verified
    observed_at: "2026-11-07T21:13:00+08:00"
    source_ids: [S001, S002, S004, S009]
    evidence_summary: "時間順序與制度運作的比較事實；對『制度未改善』的規範性總結另存 claims，不作證據事實。"
    tags: [政黨輪替, 制度改善, 司法救濟]
  - id: F005
    statement: "politics-db既有柯文哲司法程序研究已保存陳俊源認罪考量時間與負擔、李文娟對偵訊壓力的庭上描述，以及彭振聲偵訊錄音勘驗和二審保全聲請遭程序駁回的新聞轉述。"
    status: verified
    observed_at: "2026-11-07T21:13:00+08:00"
    source_ids: [S008]
    evidence_summary: "此為 repo 既有研究內容的索引，不表示檢方被認定不正訊問；參見 cases/2026-10-20-ko-wen-je-judicial-proceedings/evidence.yaml、sessions/2026-11-03-peng-interrogation-recordings/evidence.yaml。"
    verification_notes:
      - "完整外部來源與相應不確定性以兩份原有 evidence.yaml 為準，不複製、改寫或擴張既有認定。"
    tags: [柯文哲, 供述形成, 訴訟負擔]
  - id: F006
    statement: "柯文哲京華城等案2026年3月26日一審判有罪並仍可上訴；依2026年4月11日中央社整理，一審判決就檢方指控的1500萬元現金交付認為缺乏確實交付之補強證據。"
    status: verified
    observed_at: "2026-11-07T21:13:00+08:00"
    source_ids: [S005, S007]
    evidence_summary: "同案對個別犯罪指控之補強證據分析，不等於所有犯罪事實均不成立；與已確定無罪的王隆昌案程序狀態不同。"
    tags: [京華城案, 補強證據, 一審]

claims:
  - id: C001
    statement: "政黨輪替後，刑事程序正義完全沒有任何改善。"
    status: unsupported
    supports: []
    contradicts: [F003, F004]
    related_facts: [F001, F002]
    reasoning_notes: "王隆昌案證明重大程序問題可延續多次輪替及救濟多年，但2024高檢審查與2026法院改判屬實質糾錯，不能從單案推導全制度零改善。"
  - id: C002
    statement: "政黨輪替本身未能保證及時防止錯判、及時糾正刑事證據不足的確定判決。"
    status: supported
    supports: [F001, F002, F003, F004]
    contradicts: []
    related_facts: [F005, F006]
    reasoning_notes: "王案多年救濟歷程直接顯示輪替並非充分條件；這是對制度充分性而非各任政府主觀動機的判斷。"
  - id: C003
    statement: "王隆昌案的再審無罪可以直接證明柯文哲京華城案也是冤案。"
    status: contradicted
    supports: []
    contradicts: [F001, F006]
    related_facts: [F002, F005]
    reasoning_notes: "兩案可以共用證據補強、合理懷疑、供述形成與程序救濟的檢驗標準，但個別證據與程序狀態不同，不能互相代替定罪或無罪審查。"
  - id: C004
    statement: "原審司法官故意枉法、黃維安故意偽證，或當年政治干預導致王隆昌錯判。"
    status: unresolved
    supports: []
    contradicts: []
    related_facts: [F002, F003]
    reasoning_notes: "再審認定證據不足不自動等於偽證、枉法裁判或政治干預；此類具體外部事實指控需要獨立材料。"

