sources:
  - id: S001
    source_type: commentary
    publisher: "天下獨立評論"
    title: "羅煊：社會住宅蓋越多越好嗎？台灣住宅政策該放下「戶數迷思」了"
    url: "https://opinion.cw.com.tw/blog/profile/445/article/17914"
    published_at: "2026-10-29"
    observed_at: "2026-10-30T23:08:42+08:00"
    retrieval_status: reachable
    notes:
      - "原文同時討論柯文哲八年五萬戶與賴清德新增十三萬戶，批評單純以戶數問責；提出租補、包租代管及永久社宅應依需求分流。"
      - "原文承認非營利住宅在有替代性的市場可影響私人租金成長；並未明言全面取消社宅。"
  - id: S002
    source_type: primary
    publisher: "內政部國土管理署"
    title: "百萬租屋家庭支持計畫114–121年社宅多元興辦，目標維持13萬戶"
    url: "https://www.nlma.gov.tw/ch/titlelist/news/17633"
    observed_at: "2026-10-30T23:08:42+08:00"
    retrieval_status: reachable
    notes:
      - "官方表示第一階段117年前再興辦3萬戶、114至121年興辦13萬戶總目標維持；後續改以都更分回、容積獎勵及地方整體開發等多元取得。"
      - "官方目標與已交付入住戶數不同，不得混用。"
  - id: S003
    source_type: primary
    publisher: "內政部國土管理署"
    title: "中央地方攜手推動 社會住宅目標穩健推進"
    url: "https://www.nlma.gov.tw/ch/titlelist/clear/17616"
    observed_at: "2026-10-30T23:08:42+08:00"
    retrieval_status: reachable
    notes:
      - "截至115年7月底直接興辦126656戶：中央70359戶、地方56297戶；稱將增加都更分回等多元取得管道。"
  - id: S004
    source_type: primary
    publisher: "全國法規資料庫"
    title: "住宅法（第15、16條）"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0070195"
    observed_at: "2026-10-30T23:08:42+08:00"
    retrieval_status: reachable
    notes:
      - "第15條公益出租人每屋每月最高15000元租金收入免納綜所稅；減免所用租約資料除用於租稅減免外，不得作為查核其租賃所得依據。"
      - "第16條規範房屋稅及地價稅優惠，地方自治條例細節仍須另查。"
  - id: S005
    source_type: secondary
    publisher: "公視新聞網／新聞實驗室"
    title: "社宅包租代管上路9年，有解決「租不起、租不好、租不到」的問題嗎？"
    url: "https://news.pts.org.tw/article/833239"
    published_at: "2026-10-28"
    observed_at: "2026-10-30T23:08:42+08:00"
    retrieval_status: reachable
    notes:
      - "引述OURs試算，50年、通膨1.5%情境下每戶租補279萬、直接興建社宅298萬、包租代管652萬。"
      - "模型是假設性的第三方估算，非同口徑、已核定的完整政府成本效益評估；未取得模型完整成本、殘值、折現與收入明細。"
      - "報導引述政府住宅需求動向調查，包租代管承租人接近九成認為主要效益是租補減輕壓力。"
      - "截至115年8月底包租代管弱勢戶占41.05%，但報導也記錄高齡及精神障礙房客實務媒合困難的訪談。"
  - id: S006
    source_type: primary
    publisher: "內政部國土管理署"
    title: "朝向多元化的社會住宅供給，內政部持續滾動檢討及調整"
    url: "https://www.nlma.gov.tw/ch/titlelist/clear/17143"
    observed_at: "2026-10-30T23:08:42+08:00"
    retrieval_status: reachable
    notes:
      - "115年2月底直接興辦122757戶、包租代管曾協助107615戶家庭，經濟或社會弱勢戶43%。"
      - "官方將包租代管納入廣義社宅供給；分析必須分清直接興辦、包租代管及純租補。"

