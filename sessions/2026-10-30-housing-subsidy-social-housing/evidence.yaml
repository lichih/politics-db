facts:
  - id: F001
    statement: "羅煊2026-10-29投書主張不應僅依社宅戶數衡量政策，並以柯文哲與賴清德的未達／變更目標作例，倡議按家戶需求選擇租補、包租代管或永久社宅。"
    status: verified
    observed_at: "2026-10-30T23:08:42+08:00"
    source_ids: [S001]
    evidence_summary: "原文可直接確認作者如何提出例子與政策工具分類。"
    verification_notes:
      - "這只能證明原文論證，不能推定作者想全面廢止社宅或有其他政治動機。"
    tags: ["言論紀錄", "政策論證"]
  - id: F002
    statement: "內政部2026年表示114至121年13萬戶社宅興辦目標仍在，但由直接興辦擴及都更分回、容積獎勵及地方整體開發等多元取得方式。"
    status: verified
    observed_at: "2026-10-30T23:08:42+08:00"
    source_ids: [S002, S003]
    evidence_summary: "國土署公開說明13萬目標不變及多元取得措施。"
    verification_notes:
      - "不能把執行方式調整等同最終13萬戶已正式取消；也不能把興辦戶數當成完工入住。"
    tags: ["政策承諾", "官方資料"]
  - id: F003
    statement: "國土署公布截至115年7月底全國直接興辦社宅126656戶，其中中央70359戶、地方56297戶。"
    status: verified
    observed_at: "2026-10-30T23:08:42+08:00"
    source_ids: [S003]
    evidence_summary: "國土署的行政統計口徑為直接興辦，並非全部已完工。"
    tags: ["社宅存量", "統計口徑"]
  - id: F004
    statement: "住宅法第15條明訂符合條件的公益出租人租金收入每屋每月最高15000元免綜所稅，且相關租賃契約資料不得用於查核其租賃所得；第16條另涉及地方房地稅優惠。"
    status: verified
    observed_at: "2026-10-30T23:08:42+08:00"
    source_ids: [S004]
    evidence_summary: "直接核對住宅法第15、16條條文。"
    verification_notes:
      - "法定資料使用限制不等於房東一律不須申報所得，也不等於租客申請補貼會使房東必然加租。"
    tags: ["法規", "稅務優惠"]
  - id: F005
    statement: "公視2026-10-28報導引用OURs的50年試算：通膨1.5%情境下，租補每戶279萬、直接興建社宅298萬、包租代管652萬元。"
    status: verified
    observed_at: "2026-10-30T23:08:42+08:00"
    source_ids: [S005]
    evidence_summary: "可核實報導及其引述的試算數字，尚不能直接核實模型全部參數。"
    verification_notes:
      - "這是『研究團體試算曾如此呈現』的事實，不是『包租代管必然最昂貴』的普遍因果結論。"
      - "需補原始OURs模型，確認土地、折現率、租金收入、維護費、殘值與受益戶定義。"
    tags: ["成本估算", "待覆核模型"]
  - id: F006
    statement: "公視2026-10-28報導指出，截至115年8月底包租代管弱勢承租戶占41.05%，並記錄媒合獨居高齡與精神障礙房客遇到的限制。"
    status: partial
    observed_at: "2026-10-30T23:08:42+08:00"
    source_ids: [S005, S006]
    evidence_summary: "41.05%與相關訪談可見於報導，尚未獨立取得該期行政統計原始表。"
    verification_notes:
      - "115年2月底官方資料43%與115年8月底報導41.05%為不同時間截面，不可視為直接矛盾。"
    tags: ["弱勢保障", "媒體報導"]
  - id: F007
    statement: "國土署2026年公告以直接興建、都更分回、容積獎勵等多元方式推動社宅，並與租金補貼及包租代管並行。"
    status: verified
    observed_at: "2026-10-30T23:08:42+08:00"
    source_ids: [S002, S006]
    evidence_summary: "官方公開描述三種供給／支持工具同時推進。"
    tags: ["政策工具"]

  - id: F008
    statement: "賴清德2023-07-06提出未來8年增加13萬戶社會住宅，並明確說明因地方量能不足，政策已改由中央站第一線；新增13萬戶約三分之二由中央、三分之一由地方負責。"
    status: verified
    observed_at: "2026-10-31T12:10:00+08:00"
    source_ids: [S007]
    evidence_summary: "總統府原始新聞稿直接記錄13萬戶承諾、地方量能不足判斷及中央地方分工。"
    tags: ["政策承諾", "中央地方量能", "時間序"]
  - id: F009
    statement: "柯文哲2019年已公開承認八年五萬戶與當時進度不符，並針對預算至執行時間、物價上漲、流標等問題提出減項施作、預付款及公宅戰情中心等行政調整。"
    status: verified
    observed_at: "2026-10-31T12:10:00+08:00"
    source_ids: [S008]
    evidence_summary: "北市府2019-05-20專案報告同時記錄進度落差、困難與行政處置。"
    tags: ["柯文哲", "行政執行", "社宅進度"]
  - id: F010
    statement: "柯文哲2022年公開表示社宅從發包設計到出租最快約4年，若一年開工2500戶則5萬戶需20年，並主張制定20年長期計畫逐步推進。"
    status: verified
    observed_at: "2026-10-31T12:10:00+08:00"
    source_ids: [S009]
    evidence_summary: "北市府原始新聞稿可直接確認其對工期、合理速度與長期推進的公開態度。"
    tags: ["柯文哲", "行政態度", "長期計畫"]
  - id: F011
    statement: "臺北市政府2023-05-15盤點：柯文哲八年任內規劃完工4954戶，另有10332戶仍在施工、待開工、招標或規劃中。"
    status: verified
    observed_at: "2026-10-31T12:10:00+08:00"
    source_ids: [S010]
    evidence_summary: "北市都發局在柯卸任後的官方盤點提供可驗收的完工與後續工程管線數字。"
    verification_notes:
      - "不能把10332戶全部寫成已完工；也不能把郝任內1566戶算成柯任內新增完工。"
    tags: ["柯文哲", "社宅成果", "統計口徑"]
  - id: F012
    statement: "賴清德2023年提出13萬戶後，柯文哲隔日即就社宅成果與地方量能公開反駁；同年12月總統政見會與辯論會，兩人仍直接以社宅政策互相攻防。"
    status: verified
    observed_at: "2026-10-31T12:10:00+08:00"
    source_ids: [S011, S012, S014]
    evidence_summary: "時間序顯示柯文哲社宅經驗不是與賴清德承諾無關的舊案，而是2023總統選舉中的直接政策爭點。"
    tags: ["選舉攻防", "社宅", "時間序"]
  - id: F013
