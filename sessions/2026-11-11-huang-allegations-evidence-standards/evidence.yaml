promotion:
  cases: []
  comparators:
    - proposed: "huang-revelation-vs-reverse-accusation-proof-thresholds"
      rationale: "將相同證據門檻、對錯誤的後續處理、證明命題強度的差異用於跨陣營對照。"
  research: []
notes:
  - "本session保存2026-11-11對話中的研究方向：使用者認為針對黃國昌的抹紅與抹黑頻繁而離譜，要求反向檢查黃國昌爆料證據層次，不能用『雙方都會攻擊』代替證據比較。此為待檢驗假說而非 verified fact。"
  - "證據層級不是固定四階分數：法院確定事實／司法程序進度、原始文書與金流、間接截圖或匿名爆料、政治立場聯想，必須各自對應所支持的命題。起訴非定罪、民事判決非刑事定罪，消息來源與政黨組織關係不得任意連結。"
  - "『質疑→更正』與『反證後繼續以其他理由攻擊』需不同評價。若要判定刻意抹黑，特別追查反證何時公開、本人是否知悉、是否撤回或更正、是否維持被反證的同一事實指控。"
  - "與 research/2026-10-20-ccp-fellow-traveler-label-diffusion/evidence.yaml 的抹紅語義與 research/2026-10-23-asymmetric-political-evaluation-standards/evidence.yaml 的同一把尺相互參照；原始證據仍由各自source記錄。"
