facts:
  - id: F001
    statement: "臺北地院2026-08-31於114年度訴字第6611號民事一審判決，就鏡週刊／鏡新聞相關報導判命被告賠償黃國昌54萬元、鄭凱燁6萬元，移除附表1至4報導，並在兩網站刊登判決全文30日；附表5未列入移除命令。"
    status: verified
    observed_at: "2026-11-11T22:44:14+08:00"
    source_ids: [S001]
    evidence_summary: "判決主文第一至七項直接載明36萬、18萬、6萬、移除附表1至4及刊登30日。"
    verification_notes:
      - "民事一審的法律與證據判斷，不等於刑事定罪，也未證明民進黨中央指揮媒體。"
      - "完整主文有刊登30日；讀取截斷摘錄時不得誤記為沒有。"
      - "本次未核實判決是否已確定或上訴；下次引用需再確認程序狀態。"
    tags: ["2026", 黃國昌, 鏡週刊, 民事判決, 媒體, 證據層次]
  - id: F002
    statement: "該判決理由逐段比對記者訪談譯文與報導內容，認定附表1至4的部分重要指控缺乏客觀合理查證依據，例如從尋找公開資料推論為侵入戶政系統、從零散對話推論有組織駭客與酬勞；法院對附表5則另作區別判斷。"
    status: verified
    observed_at: "2026-11-11T22:44:14+08:00"
    source_ids: [S001]
    evidence_summary: "判決事實及理由四之㈣比對證言、訪談問答、對話截圖及具體報導命題，區分可支持與不能支持的推論。"
    verification_notes:
      - "不可概括為『五篇全被法院認定侵權』；附表5的請求遭駁回。"
      - "此處保存法院認定的證據落差，而不是逕認所有對黃國昌的批評均屬造謠。"
    tags: ["2026", 鏡週刊, 推論落差, 合理查證, 法院]
  - id: F003
    statement: "2023-05-18黃國昌指稱im.B主嫌相關大樓曾被陳歐珀作為後援會／服務處；陳歐珀同日承認曾接受免費場所贊助，表示不知情且否認與詐騙有不法關係。"
    status: verified
    observed_at: "2026-11-11T22:44:14+08:00"
    source_ids: [S003]
    evidence_summary: "中央社同篇記載具體場所關聯與當事人回應。"
    verification_notes:
      - "證實曾使用或接受免費場所，不能自動證明收受不法利益時具有詐騙知情或參與犯意。"
      - "黃國昌對『詐騙集團利益』的較強定性須與具體資產使用事實分開。"
    tags: ["2023", 黃國昌, 陳歐珀, im.B, 利益往來]
  - id: F004
    statement: "2024-06-24農業部針對黃國昌所稱日本進口雞蛋短少約600萬顆提出反證，稱差額源自兩批資料分別以10公斤及12公斤每箱換算，兩批的總重量均為1843.2公噸、總顆數均為3081萬顆。"
    status: verified
    observed_at: "2026-11-11T22:44:14+08:00"
    source_ids: [S002, S006]
    evidence_summary: "官方發布具體換算口徑及相同總重量、總顆數，中央社同日完整報導雙方主張。"
    verification_notes:
      - "可直接證明有具體、可計算的反證；若要裁斷整體採購案仍需完整採購與報關資料。"
      - "不能把這一數字爭議推廣為黃國昌所有揭弊不實。"
    tags: ["2024", 黃國昌, 超思, 農業部, 反證]
  - id: F005
    statement: "2025-02-27南檢就台鹽綠能公司相關非常規交易與涉嫌背信等，對陳姓前董事長等提出公訴。"
    status: verified
    observed_at: "2026-11-11T22:44:14+08:00"
    source_ids: [S005]
    evidence_summary: "檢署正式起訴新聞稿列出涉案人員與涉嫌交易方式。"
    verification_notes:
      - "此事可作弊案確有後續刑事追訴的獨立依據，不能取代逐條對照黃國昌早期爆料原文，也不代表任何特定指控已經定讞。"
    tags: ["2025", 台鹽綠能, 檢察署, 起訴]
  - id: F006
    statement: "2024-01-08柯文哲競選總部承認『電子媒體未報導』相關圖卡與發言有誤，在公開聲明中更正並致歉；黃國昌曾參與當日相關記者會。"
    status: verified
    observed_at: "2026-11-11T22:44:14+08:00"
    source_ids: [S004]
    evidence_summary: "TVBS刊載柯競總更正啟事全文並報導參與者；屬『質疑—反證—公開更正』明確樣本。"
    verification_notes:
      - "不因更正就否認曾出錯，也不因原先出錯就自動定性為蓄意抹黑。"
    tags: ["2024", 柯文哲, 黃國昌, 更正, 競選]
claims:
  - id: C001
    statement: "研究政治攻擊品質，應區分一般質疑、事實錯誤後更正、遭反證後維持負面敘事、以及有證據證明明知不實仍散布；不能把四者混為『互相抹黑』。"
    status: supported
    supports: [F006, F001, F002]
    contradicts: []
    related_facts: [F003, F004]
    reasoning_notes: "是比較方法與分析分類，不是單一來源陳述；要比較後續處理，必須同時保存原始指控、反證出現時間及後續回應。"
  - id: C002
    statement: "鏡週刊養駭客民事判決構成可具體檢驗的『指控強度超過證據承載力』樣本。"
    status: supported
    supports: [F001, F002]
    contradicts: []
    related_facts: []
    reasoning_notes: "以法院核對訪談譯文、對話紀錄及特定報導命題的推論鏈作判準；只涵蓋判決涉及的言論與民事侵權認定。"
  - id: C003
    statement: "現有樣本已足以證明黃國昌的每一次揭弊都有高度證據支持、其批評者的每一次指控都沒有證據。"
    status: unsupported
    supports: []
    contradicts: [F004]
    related_facts: [F001, F002, F003, F005]
    reasoning_notes: "im.B的場所事實有當事人承認；台鹽案有檢方起訴；雞蛋箱數則有可核算反證。各案各命題應分別評級，禁止跨案件預支可信度。"
  - id: C004
    statement: "這些案例已能證明民進黨中央組織、出資或指示媒體不實攻擊黃國昌。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002]
    reasoning_notes: "法院處理鏡傳媒／鏡電視的責任，未據此認定民進黨中央指揮或資助；組織、指示、金流指控需要個別外部證據。"
  - id: C005
    statement: "黃國昌爆料與針對黃國昌的抹黑／抹紅，存在可量化的證據品質及更正行為不對稱。"
    status: unresolved
    supports: [F001, F002, F003, F005, F006]
    contradicts: [F004]
    related_facts: []
    reasoning_notes: "目前是存在性樣本，不能推出全體或頻率大小。後續應按同一抽樣窗口蒐集兩邊具體命題，依原始文件／司法確認／間接證據／政治聯想分級，追蹤更正、撤回、換題及維持指控。"
  - id: C006
    statement: "政治人物或支持者把不同立法選擇直接稱為『中共同路人』，其證據層次不同於已證明受中共指示、收受資金或有組織代理關係。"
    status: supported
    supports: []
    contradicts: []
    related_facts: []
    reasoning_notes: "概念命題；已有相關存在性材料於 research/2026-10-20-ccp-fellow-traveler-label-diffusion/evidence.yaml，不重抄其原始事證；政治效果評價不等於可驗證的外部組織關係。"
