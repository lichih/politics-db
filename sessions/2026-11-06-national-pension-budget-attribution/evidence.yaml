notes:
  - "本 session 目的：評估賴清德對國民年金未如期調高之『在野黨不審預算』具體因果歸責，而非抽象爭論預算是不是必要條件。"
  - "先前對話曾錯將問題改寫成『預算也必要，所以總統說法可成立』；此處以原始發言命題重新檢驗，保留可追溯的修正。"
  - "用『沒完成修法』否定任何預算可能造成的時程影響，同樣過度；保留進一步考察總預算遲延與追加預算提出日之反事實因果的空間。"
  - "區分當事人公開發言、可驗證法律/程序事實、因果推論、政治評價及故意等主觀判斷。"
  - "2026-11-06補查出原有 ledger 未充分列出的反向事證：行政院8月、10月公開將總預算延宕與追加預算時程連結，並規劃回溯7月1日；發文時應主動交代此事，避免用11月已通過的狀態抹除先前的延宕。"
  - "截至本次查詢，民進黨團11月6日拒絕當天提前三讀的完整直接說明及賴清德11月3日逐字影音尚未完成核對。可引用已記錄的報導與影片入口，但不得稱已取得雙方完整逐字原文。"
