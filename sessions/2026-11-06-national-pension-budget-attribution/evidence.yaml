facts:
  - id: F001
    statement: "2026年11月3日賴清德在南投輔選時談到老農津貼及國民年金規劃7月調高，稱尚未領到是立法院預算未通過，並指向在野黨立委。"
    status: verified
    observed_at: "2026-11-06T17:00:24+08:00"
    source_ids: [S001, S008]
    evidence_summary: "中央社11月3日當天的現場報導及11月6日回顧均記載『為何我還沒領到』接著歸因立法院未通過預算及在野黨。"
    verification_notes:
      - "確認的是公開報導所記發言，並非逐字影音比對。"
    tags: ["原始發言", "因果歸責"]
  - id: F002
    statement: "行政院2026年1月22日公告國民年金法修正草案，明示調高額度係修法後實施；所需經費須待115年度總預算完成法定程序，再以追加預算編列。"
    status: verified
    observed_at: "2026-11-06T17:00:24+08:00"
    source_ids: [S002]
    evidence_summary: "行政院原始發布文本分別寫明修法、總預算與追加預算程序，亦請衛福部與黨團協調盡速修法。"
    verification_notes:
      - "官方政策程序說明不能被解讀為已完成立法。"
    tags: ["行政院", "法源", "預算"]
  - id: F003
    statement: "查詢時國民年金法第54條之1保留原基數及CPI調整機制；行政院2026年欲將部分給付調高至5000元的方案仍在修法程序。"
    status: verified
    observed_at: "2026-11-06T17:00:24+08:00"
    source_ids: [S003, S005, S006, S008]
    evidence_summary: "官方法條未出現此次擬議的5000元固定基本額度，10月14日調幅條文保留協商，11月6日報導亦確認修正案尚未完成。"
    verification_notes:
      - "此處檢驗本次方案之新法源，不排除既有法律下的定期CPI調整。"
    tags: ["法律", "立法程序"]
  - id: F004
    statement: "115年度中央政府總預算於2026年8月14日經立法院三讀，9月18日由總統公布。"
    status: verified
    observed_at: "2026-11-06T17:00:24+08:00"
    source_ids: [S004]
    evidence_summary: "財政部官方財政專區列出通過及公布日期。"
    verification_notes:
      - "必須區分已通過的總預算與尚待審議的追加預算。"
    tags: ["總預算", "時序"]
  - id: F005
    statement: "行政院2026年9月3日院會通過115年度中央政府總預算追加預算案，並送請立法院審議。"
    status: verified
    observed_at: "2026-11-06T17:00:24+08:00"
    source_ids: [S004, S010]
    evidence_summary: "財政部及行政院官方頁面均記載9月3日追加預算案時間。"
    verification_notes:
      - "『9月提出』與『7月規劃開始調高』存在時序落差；不能僅據此斷定所有延誤的唯一成因。"
    tags: ["追加預算", "時序"]
  - id: F006
    statement: "立法院已排定2026年11月4日及5日由七個委員會聯席審查115年度追加預算案。"
    status: verified
    observed_at: "2026-11-06T17:00:24+08:00"
    source_ids: [S007]
    evidence_summary: "立法院官方開會通知明列『審查』追加預算案、11月4日詢答及11月5日處理。"
    verification_notes:
      - "官方議程證明有排定審查；不單憑議程證明預算已三讀或所有細項均已審畢。"
    tags: ["立法院", "追加預算"]
  - id: F007
    statement: "2026年10月14日立法院衛環委員會已完成國民年金法修正草案委員會審查，但調高額度等爭議條文送黨團協商。"
    status: verified
    observed_at: "2026-11-06T17:00:24+08:00"
    source_ids: [S005, S006]
    evidence_summary: "立法院官方議程及中央社當日審查結果報導相互補充。"
    verification_notes:
      - "委員會審查完成不等於院會三讀完成。"
    tags: ["國民年金法", "立法程序"]
  - id: F008
    statement: "2026年11月6日朝野未於當天完成國民年金法三讀，而同意11月13日上午由院長召開黨團協商，未有結論則儘速處理。"
    status: verified
    observed_at: "2026-11-06T17:00:24+08:00"
    source_ids: [S008]
    evidence_summary: "中央社報導當日協商結論，並載明協商冷凍期尚未屆滿。"
    verification_notes:
      - "不能單憑『未同意當天三讀』推出任何一黨反對調高金額。"
    tags: ["議事程序", "朝野協商"]
  - id: F009
    statement: "黃國昌2026年11月6日公開貼文指控賴清德把未發給付歸因在野黨不審預算不實，並以民進黨團未同意當日處理修法加以反擊。"
    status: verified
    observed_at: "2026-11-06T16:37:36+08:00"
    source_ids: [S009, S008]
    evidence_summary: "使用者擷取之黃國昌原始貼文及中央社當日新聞記錄其說法。"
    verification_notes:
      - "證實的是黃國昌確實提出此指控；不代表其所有因果推論均獲證實。"
    tags: ["黃國昌", "政治攻防"]

  - id: F010
    statement: "行政院在2026年10月2日公開主張115年總預算審議延宕超過9個月，直到8月14日三讀，因此行政院在9月3日才提出115年追加預算；此為行政院就時序提出的因果說法。"
    status: verified
    observed_at: "2026-11-06T17:11:09.701+08:00"
    source_ids: [S013, S004]
    evidence_summary: "中央社10月2日引述行政院發言人李慧芝，明言總預算延宕超過9個月，8月14日三讀後提出追加預算；財政部官方日期相符。"
    verification_notes:
      - "核實的是政府曾提出這項說明及日期，尚未以反事實分析證明總預算若早過就必定7月發放。"
      - "這是可能支持總統預算延誤說法的對立證據，不得在對外文章省略。"
    tags: ["政府解釋", "總預算延宕", "反向事證"]
  - id: F011
    statement: "行政院8月13日公開說明擬將老農津貼、國民年金及六大社福津貼調升追溯自7月1日補發，待總預算三讀後再公布追加預算。9月3日追加預算案亦載明相關經費追溯7月1日調高。"
    status: verified
    observed_at: "2026-11-06T17:11:09.701+08:00"
    source_ids: [S012, S010]
    evidence_summary: "行政院8月13日受訪及9月3日官方行政院新聞稿一致載明追溯7月1日。"
    verification_notes:
      - "追溯發放是行政院規劃與追加預算內容，當時不是已生效的請求權；仍須法律及預算完成。"
    tags: ["追溯", "7月1日", "預算"]
  - id: F012
    statement: "在原定2026年7月1日前，衛福部長已於5月表示國民年金提高至5000元涉及修法，施行時間仍視立法院立法進度。行政院主計總處10月1日再次確認修法後始得動支。"
    status: verified
    observed_at: "2026-11-06T17:11:09.701+08:00"
    source_ids: [S014, S011]
    evidence_summary: "公視5月26日引述衛福部長石崇良說法；10月1日主計總處正式澄清明載。"
    verification_notes:
      - "證明政府早已知道修法是獨立要件；不否定預算程序可能同時延後。"
    tags: ["修法必要", "行政院", "事前知情"]

claims:
  - id: C001
    statement: "賴清德2026年11月3日所指『在野黨不審預算』是原定7月調高國民年金未發放的充分原因。"
    status: unsupported
    supports: [F001]
    contradicts: [F002, F003, F004, F005, F006, F007]
    related_facts: [F008, F010, F011, F012]
    reasoning_notes: "對11月3日無法領取的單一歸責仍欠完整說明：修法尚未三讀，是獨立門檻；當年總預算雖於8月三讀，但此前確實長期延宕，行政院於8月13日、10月2日把總預算延宕連結追加預算提出時程。故不可寫成預算延誤全無事實基礎，也不可從預算延宕跳到『若沒有在野黨就已依法發放』。宜要求總統區分總預算、追加預算及修法未完成各自造成的影響。其『他們就不審』的語意應在完整影音脈絡下判讀，不能偷換成『完全未審國民年金法』。"
  - id: C002
    statement: "本次調高至5000元的方案，需要相關法律修正及經費預算程序，兩者為不同門檻。"
    status: supported
    supports: [F002, F003, F005]
    contradicts: []
    related_facts: [F004]
    reasoning_notes: "行政院1月22日已清楚區分修法與追加預算。"
  - id: C003
    statement: "115年度中央政府總預算在2026年11月3日仍未通過。"
    status: contradicted
    supports: []
    contradicts: [F004]
    related_facts: [F005, F006]
    reasoning_notes: "總預算8月14日三讀、9月18日公布。若指追加預算，須明說追加預算，並交代9月3日行政院始提出與11月已排審事實。"
  - id: C004
    statement: "民進黨團不同意11月6日立即三讀，足以證明民進黨反對調高國民年金或承認總統造謠。"
    status: unsupported
    supports: [F009]
    contradicts: [F008]
    related_facts: [F007]
    reasoning_notes: "無法直接由議事選擇推定反對政策本身或承認某人說謊；仍可就是否願意加速提出政治質疑。"
  - id: C005
