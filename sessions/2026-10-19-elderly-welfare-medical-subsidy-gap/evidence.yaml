session:
  id: 2026-10-19-elderly-welfare-medical-subsidy-gap
  project: Politics
  title: "老人福利法第22條三讀後弱勢老人醫療補助法源爭議"
  started_at: "2026-10-19T08:31:18+08:00"
  updated_at: "2026-10-19T09:04:43+08:00"
  status: active

topics:
  - 老人福利法
  - 弱勢老人
  - 健保部分負擔
  - 非健保醫療費用
  - 中低收入老人
  - 中低收入戶
  - 社會救助法
  - 全民健康保險法
  - 法規命令
  - 地方自治
  - 法源
  - 法律生效時間
