notes:
  - "本session與 sessions/2026-10-17-elderly-nhi-subsidy/evidence.yaml 有關，但問題不同：前者主要處理老人保費中央補助的付款責任／財政；本session專門處理第22條重寫後弱勢老人部分負擔與未涵蓋醫療費用的法源coverage。"
  - "時間軸硬約束：2026-10-16完成三讀；截至2026-10-19查詢，官方現行法仍是舊第22條。不得用預期未來生效效果描述成當下已失效。"
  - "目前最穩健法律結論：若三讀文字依現有轉錄原樣生效，舊第22條對另外兩類醫療費用的明文法定義務與舊第二項授權會出現實質缺口；但其他法律仍提供部分重疊保障，不能寫成『所有補助全部無法源』。"
  - "同樣不能接受『社救法完全承接所以零缺口』：中低收入老人與中低收入戶不是同一集合，補助項目、嚴重傷病條件、費用門檻、排除項目、比例與期限也不同。"
  - "地方一般自治權限與中央法律設定的全國最低義務必須分層：地方可能仍能自辦福利，不表示人民仍享有原第22條同等且全國一致的法定保障。"
  - "老人福利法第20條不是醫療補助條款；以第20條直接反駁法源疑義屬引法錯誤。"
  - "舊老人補助辦法的授權基礎若因新法縮限會如何處理，應區分『授權鏈出現問題』、『部分規定可能無效』與『命令正式廢止』，目前不得把三者混成自動全面失效。"
  - "是否為故意刪除、急就章疏失或其他動機維持unresolved；下一步應優先取得10月16日再修正動議原件與正式公報全文。"
  - "沈伯洋個案可用於角色一致性評論：他長期以『保留立委職位是為了持續履職』作為不辭立委理由，10月16日卻把不出席重大修法表決本身當成政治表態。這可以質疑其不辭職論述的一致性，但在最後版本送達時間未釘死前，不得指控他明知或有充分機會看到弱勢保障文字被刪仍放棄審查。"
