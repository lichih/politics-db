facts:
  - id: F001
    statement: "截至2026-10-19 08:31（+08:00）查詢，全國法規資料庫仍將《老人福利法》最近修正日標為2025-08-01，現行有效第22條仍明列保險費、健保部分負擔及健保給付未涵蓋醫療費用三類，並要求地方主管機關對無力負擔者補助。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S001]
    evidence_summary: "2026-10-16三讀不等於已公布生效；query-as-of時點的官方現行法仍是舊第22條。"
    verification_notes:
      - "此次搜尋未找到2026-10-16三讀修正已由總統公布的資料；只能記錄本次查詢未找到，不推論未來不會公布。"
    tags: [query-as-of, 現行法, 生效時間]

  - id: F002
    statement: "立法院官方公報初稿明載2026-10-16完成《老人福利法》第22條三讀。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S002, S003]
    evidence_summary: "程序狀態可由立法院primary source直接確認。"
    tags: [三讀, 立法院, "2026-10-16"]

  - id: F003
    statement: "目前可取得的三讀文字轉錄與中央社對三讀效果的報導一致顯示，新第22條第一項聚焦符合所得條件長者之健保保險費中央全額補助；賴中強轉錄的第二項則僅授權『前項補助』的對象、項目、基準等。"
    status: partial
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S004, S005, S002]
    evidence_summary: "立法院primary source已確認完成三讀，但本次尚未從官方可檢索頁面取得完整逐字三讀條文；精確文字目前以當事人重聽IVOD轉錄與媒體一致報導交叉確認，待正式公報全文或總統公布文本補強。"
    verification_notes:
      - "不得把secondary/commentary轉錄冒充已取得的正式公布法律文本。"
    tags: [三讀文字, 部分確認, 待正式文本]

  - id: F004
    statement: "現行《老人參加全民健康保險無力負擔費用補助辦法》明文以《老人福利法》第22條第2項作為授權依據，並實際規範低收入戶老人及中低收入老人的健保部分負擔與健保未涵蓋醫療費用補助。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S006]
    evidence_summary: "子法授權鏈與保障項目均由中央法規primary source直接確認。"
    tags: [授權子法, 部分負擔, 非健保醫療]

  - id: F005
    statement: "舊老人專屬補助辦法所稱『中低收入老人』，係引用《中低收入老人生活津貼發給辦法》，其一般所得門檻可到最低生活費2.5倍；《社會救助法》的『中低收入戶』則以1.5倍為所得上限，因此兩個資格集合並不相同。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S006, S007, S008]
    evidence_summary: "法規交叉引用與兩套所得門檻直接顯示：不能用『社救法中低收入戶仍有救濟』推論所有原中低收入老人均受同等覆蓋。"
    tags: [中低收入老人, 中低收入戶, 資格差異, 2.5倍, 1.5倍]

  - id: F006
    statement: "《全民健康保險法》第49條對符合《社會救助法》低收入戶資格者的門診、住院健保部分負擔另有中央補助法源，因此低收入戶老人的這一類部分負擔並非僅依賴《老人福利法》第22條。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S010]
    evidence_summary: "存在獨立法源，故『所有弱勢老人部分負擔補助都完全無法源』過度概括。"
    tags: [健保法49條, 低收入戶, 獨立法源]

  - id: F007
    statement: "《社會救助法》第18至20條另有醫療補助制度，但其資格與老人專屬制度並不等價：一般非低收入戶須涉及嚴重傷病及無力負擔；縣（市）中低收入戶實施辦法另要求最近3個月費用達3萬元。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S008, S009]
    evidence_summary: "社救法提供替代／重疊法源，但條件不是原老人制度的完整複製。"
    tags: [社會救助法, 醫療補助, 覆蓋差異]

  - id: F008
    statement: "縣（市）《醫療補助辦法》雖補助健保部分負擔與健保未涵蓋醫療費用，但明文排除義齒、鑲牙等項目；中低收入戶補助80%，申請期限3個月。舊老人專屬辦法則沒有同一份排除清單，並給6個月申請期，補助比例由地方財政狀況訂定。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S006, S009]
    evidence_summary: "兩套制度在項目、比例與程序上存在明確差異；不能稱社救法子法『原封不動承接』老人專屬補助。"
    verification_notes:
      - "縣（市）醫療補助辦法不直接決定各直轄市標準；直轄市須逐一查其規範。"
      - "舊老人中央辦法沒有列義齒排除，不等於已證明所有地方在舊法下都實際補助活動假牙；實際地方給付仍待逐地查核。"
    tags: [coverage-matrix, 義齒, 申請期限, 補助比例]

  - id: F009
    statement: "地方政府對社會福利與社會救助具有一般自治事項與規劃地方福利方案的權限；因此即使中央法的特定義務或授權改變，也不能直接推出地方政府從此完全無權提供相關醫療補助。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S001, S013, S014]
    evidence_summary: "地方仍有一般福利自治權限；但這與是否仍存在原第22條的全國法定最低義務是不同問題。"
    tags: [地方自治, 社會福利, 權限, 法定義務]

  - id: F010
    statement: "現行《老人福利法》第20條內容是前三條居家式、社區式、機構式服務提供者的資格及服務準則授權，不能作為『第20條本身就是弱勢老人醫療／假牙補助法源』的文字依據。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S001]
    evidence_summary: "Facebook反駁將老人福利法第20條描述為醫療補助一般授權，與現行條文內容不符。"
    tags: [老人福利法20條, 錯誤引法]

  - id: F011
    statement: "法規命令原則上須有法律授權且不得逾越授權；相關法律修正導致命令失去依據時，中央法規標準法要求檢討修正或在失去依據且無單獨施行必要時廢止，但命令廢止仍由原發布機關依程序為之。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S011, S012]
    evidence_summary: "因此若新第22條生效，舊辦法中超出新授權文字的部分會產生明顯授權基礎問題；但不能不經分析直接說整部辦法在生效瞬間自動全部消滅。"
    tags: [法規命令, 授權, 廢止, 行政程序]

  - id: F012
    statement: "至少三個較早的立法版本在增加中央老人健保保費補助時，都保留了原本的部分負擔及健保未涵蓋醫療費用補助文字，部分版本甚至改由中央全額補助。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S015, S016, S017]
    evidence_summary: "立法沿革顯示『中央承擔老人保費』與『刪掉另外兩類弱勢醫療補助文字』不是文字上必然綁在一起。"
    verification_notes:
      - "此事實不能單獨證明最終刪除是故意、疏失或具有特定動機；動機維持未解。"
    tags: [立法沿革, 早期版本, 保留保障]

  - id: F013
    statement: "《老人福利法》須經總統公布；現行法第55條規定自公布日施行，而中央法規標準法第13條規定此類法規自公布日起算至第3日起發生效力。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S001, S012]
    evidence_summary: "時間軸上，三讀完成與法律生效不是同一事件。"
    tags: [公布, 生效, 時間軸]

  - id: F014
    statement: "民眾黨團在2026-10-18公開反駁『弱勢補助法源全失』說法；衛福部次長林靜儀則公開指出修法前欠缺行政溝通，影響範圍與補救措施未充分討論，但未在相關報導中對完整法源覆蓋作最終法律認定。"
    status: verified
    observed_at: "2026-10-19T08:31:18+08:00"
    source_ids: [S018, S019]
    evidence_summary: "保存主要爭議雙方公開立場；其法律結論仍需用原始法規獨立驗證。"
    tags: [民眾黨, 衛福部, 公開立場]

  - id: F015
    statement: "2026-10-09沈伯洋公開表示不會在台北市長選舉投票前辭去立委，理由之一是立委身分同樣承載選民期待，直到最後都要把工作做好。"
    status: verified
    observed_at: "2026-10-19T09:04:43+08:00"
    source_ids: [S021]
    evidence_summary: "其不辭立委的公開正當化理由，明確建立在繼續履行立委職務與選民期待上。"
    tags: [沈伯洋, 不辭立委, 選民期待, 履職]

  - id: F016
    statement: "2026-10-16老人福利法第22條修法表決，沈伯洋未參與；他隔日公開說明，對該案選擇『不予出席』，理由涉及其對修法方式、財政與預算法的反對。"
    status: verified
    observed_at: "2026-10-19T09:04:43+08:00"
    source_ids: [S022]
    evidence_summary: "缺席不是僅從表決名單推測，而是本人事後明確說明為政治選擇。"
    verification_notes:
      - "目前未證明他在做出不出席決定前已取得或有合理時間審閱最後再修正動議文字。"
    tags: [沈伯洋, 不出席, 不投票, 老人福利法]

  - id: F017
    statement: "2026-06沈伯洋談參選台北市長期間不辭立委時，也曾以人民賦予的立委責任為理由，表示即使投入市場拜票仍可回立法院質詢，並以『當一天和尚敲一天鐘』描述。"
    status: verified
    observed_at: "2026-10-19T09:04:43+08:00"
    source_ids: [S023]
    evidence_summary: "不辭立委與持續履職之間的連結並非10月臨時說法，至少6月已有相同公開論述。"
    tags: [沈伯洋, 台北市長, 不辭立委, 履職]

claims:
  - id: C001
    statement: "「2026-10-16三讀後，弱勢老人原有的健保部分負擔與非健保醫療補助已在2026-10-19當下立即失效。」"
    status: contradicted
    contradicts: [F001, F013]
    related_facts: [F002, F003]
    reasoning_notes: "三讀不是生效時點。query-as-of 2026-10-19官方現行法仍是舊第22條；本次亦未找到總統公布新修正的資料。"

  - id: C002
    statement: "「若2026-10-16三讀文字依目前轉錄內容原樣完成公布並生效，原第22條對無力負擔之部分負擔費用與健保未涵蓋醫療費用所設的全國法律明文及對應第二項授權將不再出現在第22條。」"
    status: supported
    supports: [F003, F004, F012, F013]
    related_facts: [F011]
    reasoning_notes: "這是條文文字與授權鏈的比較。最終精確措辭仍待正式公布／公報全文補強，但目前證據高度一致。"

  - id: C003
    statement: "「三讀文字生效後，低收入與中低收入老人所有相關醫療補助在全台都完全失去任何法源，地方也不能再補助。」"
    status: contradicted
    contradicts: [F006, F007, F009]
    related_facts: [F005, F008, F011]
    reasoning_notes: "健保法49條、社會救助法醫療補助及地方自治福利權限均提供部分獨立法源；但其覆蓋不等同舊老人專屬制度。"

  - id: C004
    statement: "「因為社會救助法與地方制度仍存在，所以原老人福利法第22條的弱勢醫療補助保障被完整、等價地保留下來，沒有任何保障缺口。」"
    status: contradicted
    contradicts: [F005, F007, F008]
    related_facts: [F004, F009]
    reasoning_notes: "中低收入老人與中低收入戶資格集合不同，社救法及縣市醫療補助另有嚴重傷病、金額門檻、排除項目、比例與期限差異；地方自治的一般權限也不等於原本全國法律的『應予補助』義務。"

  - id: C005
    statement: "「現行老人無力負擔費用補助辦法本身即可在新第22條生效後，毫無授權問題地繼續支撐原部分負擔與未涵蓋醫療費用補助。」"
    status: unsupported
    contradicts: [F004, F011]
    related_facts: [F003]
    reasoning_notes: "該辦法第1條直接以老人福利法第22條第2項為授權依據；若新第2項只授權『前項』的保費補助，其餘規定至少產生授權範圍是否仍存在的明顯問題。"

  - id: C006
    statement: "「新第22條一生效，現行老人無力負擔費用補助辦法就會在同一瞬間自動全部失效或全部無效。」"
    status: unresolved
    related_facts: [F011, F003, F004]
    reasoning_notes: "相關法要求命令因上位法修正而檢討修正／廢止，命令廢止也有程序；是否部分條文可由其他權限維持、是否構成部分無效、以及行政機關如何處理，尚無本案權威解釋。不能把『授權基礎出現問題』直接等同『整部命令自動消滅』。"

  - id: C007
    statement: "「老人福利法第20條本身可以取代被刪掉的第22條，作為地方弱勢老人部分負擔與假牙等醫療補助的直接授權法源。」"
    status: contradicted
    contradicts: [F010]
    related_facts: [F009]
    reasoning_notes: "第20條的文義是服務提供者資格與服務準則。地方仍可能依其他一般自治／福利法源自辦補助，但不是因為第20條具有Facebook留言所稱的醫療補助內容。"

  - id: C008
    statement: "「社會救助法所稱中低收入戶與老人補助辦法所稱中低收入老人是同一群人。」"
    status: contradicted
    contradicts: [F005]
    reasoning_notes: "前者所得上限1.5倍最低生活費；後者一般資格可至2.5倍且另有消費支出與資產條件，集合明顯不同。"

  - id: C009
    statement: "「較早草案都已經刪掉部分負擔與未涵蓋醫療費用，因此最終三讀只是延續原本共同設計。」"
    status: contradicted
    contradicts: [F012]
    reasoning_notes: "至少多個20%或12%版本明文保留相關補助，甚至改由中央全額承擔。"

  - id: C010
    statement: "「最終文字漏掉兩類醫療補助是立法者故意犧牲弱勢，或反之只是單純筆誤。」"
    status: unresolved
    related_facts: [F012, F002, F003, F014]
    reasoning_notes: "文字結果與過往版本可以確認，但目前沒有足夠原始證據判定主觀動機。應查10月16日再修正動議原件、協商／院會完整紀錄與提案人事後說明。"

  - id: C011
    statement: "「沈伯洋不辭立委的公開正當化理由，與其在重大修法表決中把刻意不出席本身作為政治表態之間，存在可受公共檢驗的角色一致性張力。」"
    status: supported
    supports: [F015, F016, F017]
    reasoning_notes: "這是對其本人兩組公開說法的比較：保留席次的理由是持續履行立委責任，而後又明言以不出席表決表態。此張力足以成為政治評論，但不能進一步推成『一次缺席即證明其不適任或失去全部正當性』。"

  - id: C012
    statement: "「因沈伯洋刻意缺席，所以可以認定他本來有充分機會看到最後再修正動議，卻沒有發現弱勢醫療保障文字被拿掉。」"
    status: unresolved
    related_facts: [F016, F003]
    reasoning_notes: "目前仍缺最後再修正動議出現時間、各黨團取得時間及沈伯洋離場／決定不出席時點。沒有這些程序時間線，不能把沒抓到最後文字副作用直接歸責於他。"

searches:
  - id: Q001
    observed_at: "2026-10-19T08:31:18+08:00"
    platform: web
    query: "老人福利法 2026-10-16 三讀 第22條 完成三讀 立法院公報"
    scope: "立法院議事暨公報資訊網"
    result: found
    notes: "找到官方公報初稿目錄與會議頁，可確認完成三讀；可檢索頁尚未取得完整逐字三讀條文。"

  - id: Q002
    observed_at: "2026-10-19T08:31:18+08:00"
    platform: web
    query: "總統府 2026-10-16至2026-10-19 老人福利法第22條 公布"
    scope: "總統府、全國法規資料庫，recency 7 days"
    result: not_found
    notes: "此次查詢未找到2026-10-16三讀修正已由總統公布的紀錄；全國法規資料庫仍顯示2025-08-01版本。not_found不等於未來不會公布。"

  - id: Q003
