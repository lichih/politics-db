    published_at: "2024"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "該12%版本第一項創設中央保費補助，第二項仍明列無力負擔之健保部分負擔及健保未涵蓋醫療費用由中央全額補助，第三項再授權訂辦法。"
      - "此版本同樣證明前述兩類醫療費用並非所有中央補助版本都預定刪除。"

  - id: S017
    source_type: primary
    publisher: "立法院議事暨公報資訊網"
    title: "第11屆第1會期第5次會議老人福利法第22條修正草案"
