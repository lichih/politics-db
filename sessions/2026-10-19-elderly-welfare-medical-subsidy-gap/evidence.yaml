sources:
  - id: S001
    source_type: primary
    publisher: "全國法規資料庫"
    title: "老人福利法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050037"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "查詢當下頁面仍標示修正日期為民國114年8月1日；現行第22條仍同時規定保險費、部分負擔費用及健保給付未涵蓋醫療費用，對無力負擔者由地方主管機關補助。"
      - "現行第22條第二項授權中央主管機關訂定補助對象、項目、基準等辦法。"
      - "第20條規範居家式、社區式與機構式服務提供者的資格及服務準則，不是醫療費用補助的一般授權條款。"
      - "第4、5、8條另規範中央與地方老人福利職掌及各主管機關得以補助、委託等方式提供老人服務照顧。"
      - "第55條規定本法自公布日施行。"

  - id: S002
    source_type: primary
    publisher: "立法院議事暨公報資訊網"
    title: "第11屆第6會期第6期公報初稿"
    url: "https://ppg.ly.gov.tw/ppg/publications/official-gazettes-draft/11/06/06/01/details"
    published_at: "2026-10-16"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "立法院公報初稿目錄明載2026-10-16『老人福利法修正第二十二條條文─完成三讀─』。"
      - "本次查詢取得完成三讀的程序狀態，但未從該頁的可檢索文字取得完整三讀逐字條文。"

  - id: S003
    source_type: primary
    publisher: "立法院議事暨公報資訊網"
    title: "第11屆第6會期第3次會議"
    url: "https://ppg.ly.gov.tw/ppg/sittings/2026101417/details?meetingDate=115%2F10%2F16"
    published_at: "2026-10-16"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "會議頁確認老人福利法第22條相關多案與陳超明等17人新提案均排入2026-10-16院會討論事項。"

  - id: S004
    source_type: secondary
    publisher: "中央社"
    title: "立院三讀修正老人福利法 綜所稅率未達20%長者健保費中央補助"
    url: "https://www.cna.com.tw/news/aipl/202610160144.aspx"
    published_at: "2026-10-16"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "報導確認2026-10-16三讀通過的核心效果為：符合最近一年所得申報／20%稅率條件的長者，由中央主管機關全額補助健保保險費。"
      - "報導未說明原第22條的部分負擔及健保未涵蓋醫療費用文字如何處理。"

  - id: S005
    source_type: commentary
    publisher: "台灣放送／賴中強"
    title: "藍白不仁，以中低收入老人為芻狗"
    url: "https://www.telltaiwan.org/29491"
    published_at: "2026-10-18"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "賴中強表示其重聽2026-10-16院會IVOD後，轉錄三讀第22條為：第一項只處理符合所得條件者的健保保險費中央全額補助，第二項授權『前項補助』之對象、項目、基準等由中央主管機關定之。"
      - "其主張原條文的部分負擔及健保給付未涵蓋醫療費用補助法源被刪除。此來源用來保存原始爭議主張與三讀文字轉錄，不把其法律結論直接當作已證實事實。"

  - id: S006
    source_type: primary
    publisher: "全國法規資料庫"
    title: "老人參加全民健康保險無力負擔費用補助辦法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050174"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "第1條明文：本辦法依老人福利法第22條第2項規定訂定。"
      - "第2條的『中低收入老人』不是直接引用社會救助法中低收入戶，而是引用中低收入老人生活津貼發給辦法。"
      - "第4條規範低收入戶老人之保費、部分負擔及健保未涵蓋醫療費用；第5條規範中低收入老人之保費、部分負擔及健保未涵蓋醫療費用。"
      - "中低收入老人申請部分負擔或未涵蓋醫療費用，以疾病、傷害事故所生且最近3個月自付累計5萬元以上為限，補助比例由地方依財政狀況訂定。"
      - "第9條要求於就醫／出院後6個月內申請，並附收據與醫療必要證明；第10條排除重複政府補助。"

  - id: S007
    source_type: primary
    publisher: "全國法規資料庫"
    title: "中低收入老人生活津貼發給辦法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050045"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "第2條一般資格的家庭平均每人每月收入上限可至最低生活費2.5倍，另受臺灣地區平均每人每月消費支出1.5倍及財產限額約束。"
      - "符合社會救助法低收入戶或中低收入戶者申請本津貼時，免重複審查該所得財產條件。"
      - "因此『中低收入老人』資格集合可包含未達社會救助法『中低收入戶』資格、但符合老人生活津貼2.5倍等條件者。"

  - id: S008
    source_type: primary
    publisher: "全國法規資料庫"
    title: "社會救助法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050078"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "第4條之1：中低收入戶家庭平均每人每月收入不得超過最低生活費1.5倍，並有家庭財產限制。"
      - "第18條：低收入戶傷病患者，以及患嚴重傷病且醫療費用非本人或扶養義務人所能負擔者，可申請醫療補助；可由健保取得之醫療給付不得重複申請。"
      - "第19條：低收入戶健保保費由中央補助，中低收入戶自付健保保費中央補助二分之一。"
      - "第20條：醫療補助給付項目、方式及標準，由中央、直轄市主管機關定之。"

  - id: S009
    source_type: primary
    publisher: "全國法規資料庫"
    title: "縣（市）醫療補助辦法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050082"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "本辦法依社會救助法第20條訂定，適用縣（市）醫療補助。"
      - "中低收入戶須患嚴重傷病、費用無力負擔，且最近3個月相關醫療費累計3萬元以上。"
      - "補助範圍包括健保部分負擔及健保未涵蓋醫療費用，但明文排除義肢、義眼、義齒、配鏡、鑲牙、整容、指定醫材、掛號費、看護費、指定病房等項目。"
      - "中低收入戶補助比例為80%，申請期限為出院或就醫後3個月。"
      - "此中央辦法是縣（市）規範；直轄市依社會救助法第20條另定其標準，不能把本辦法細節直接套用到所有直轄市。"

  - id: S010
    source_type: primary
    publisher: "全國法規資料庫"
    title: "全民健康保險法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0060001"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "第49條明文：符合社會救助法之低收入戶成員，依健保法第43、47條應自付之門診／住院部分負擔，由中央社政主管機關編列預算補助；不經轉診等情形有例外。"
      - "因此低收入戶老人之健保部分負擔至少存在獨立於老人福利法第22條的法定補助來源。"

  - id: S011
    source_type: primary
    publisher: "全國法規資料庫"
    title: "行政程序法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030055"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "第150條：法規命令係行政機關基於法律授權，對不特定多數人民作成之抽象對外規範；內容應明列法律授權依據且不得逾越授權範圍與立法精神。"
      - "第151條：法規命令修正、廢止等準用訂定程序。"
      - "第158條規定法規命令牴觸法律、或無法律授權而剝奪限制權利等情形之無效，以及部分無效的處理。"

  - id: S012
    source_type: primary
    publisher: "全國法規資料庫"
    title: "中央法規標準法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030133"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "第4條：法律應經立法院通過、總統公布。"
      - "第11條：命令不得牴觸憲法或法律。"
      - "第13條：明定自公布或發布日施行者，自公布或發布日起算至第3日起發生效力。"
      - "第20條規定因有關法規修正或廢止而應配合修正者，法規應修正。"
      - "第21條第3款：法規因有關法規廢止或修正致失其依據、而無單獨施行必要者，應廢止。"
      - "第22條：命令之廢止由原發布機關為之。"

  - id: S013
    source_type: primary
    publisher: "全國法規資料庫"
    title: "地方制度法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0040003"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "第18、19條將直轄市、縣（市）社會福利、公益慈善及社會救助列為地方自治事項。"
      - "因此中央老人福利法特定法定義務是否消失，與地方是否仍有一般自治權限自辦福利，必須分開判斷。"

  - id: S014
    source_type: primary
    publisher: "全國法規資料庫"
    title: "社會福利基本法"
    url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050213"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "第16條要求地方政府規劃、制定並執行地方社會福利政策、自治法規與方案；第18條指出各級政府社會福利支出負擔依各該法律規定。"
      - "此法支持地方仍有規劃福利方案的一般職權，但不等同原老人福利法第22條『應予補助』的特定全國法定最低義務。"

  - id: S015
    source_type: primary
    publisher: "立法院議事暨公報資訊網"
    title: "第11屆第1會期第14次會議老人福利法第22條及第25條修正草案"
    url: "https://ppg.ly.gov.tw/ppg/download/agenda1/02/pdf/11/01/14/LCEWA01_110114_00077.pdf"
    published_at: "2024"
    observed_at: "2026-10-19T08:31:18+08:00"
    retrieval_status: reachable
    notes:
      - "該較早提案保留現行第22條第一項對保險費、部分負擔及健保未涵蓋醫療費用的地方補助義務，另新增中央對符合20%所得條件者的保費補助。"
      - "因此實現中央老人保費補助在文字技術上不必然要求刪除原本兩類醫療費用補助。"

  - id: S016
    source_type: primary
    publisher: "立法院議事暨公報資訊網"
    title: "第11屆第2會期第4次會議老人福利法第22條修正草案"
