promotion:
  cases: []
  comparators: []
  research:
    - proposed: "threads-political-engagement-amplification"
      rationale: "若後續取得liker identity、like growth curve、views/impressions、推薦來源或prospective out-of-sample觀察，可升格研究平台推薦、人工動員與自動化互動放大的可辨識特徵。"

notes:
  - "目前最穩健的總結是：@robinhoodspirit與@eczht_tw皆出現post-level selective burst；異常形狀成立，但bot／網軍attribution目前不成立，cause仍unresolved。"
  - "就現有證據的相對解釋力，內容特性、平台推薦與真人擴散比『已證實固定bot帳號池』更強；但沒有平台內部推薦日志，因此仍只屬工作解釋，不是已證實因果。"
  - "S007在S008 quote前已完成主要reply growth，削弱『quote後兩篇才一起被放大』；S008自身則呈較慢長尾reply growth。"
  - "同帳號高量quote沒有固定interaction recipe：S010為高reply快速成長型，S008／S009為低reply慢熱型。這削弱固定engagement-generator強模型，但不排除只操作likes的弱模型或hybrid。"
  - "真正能顯著提升attribution強度的新資料主要剩兩類：liker-level identity／timestamp／同步行為網路，或事前定義、可重現的prospective sampling用來估計不同陣營／內容類型selective burst prevalence。"
  - "『selective amplification』在本檔是描述結果集中於少數貼文的cause-neutral用語，不等於已證實外部操弄。"
  - "最簡單的keyword trigger模型已被同作者多篇沈伯洋相關低讚貼文削弱；若存在外部自動化，至少需要post-level selector或其他挑選條件。"
  - "author-wide boost模型被F002直接反駁；若使用author cache/watchlist假說，cache只能解釋『被持續發現』，不能解釋為何只有部分貼文爆量。"
  - "liker overlap是區分固定帳號池最直接的觀測之一，但目前公開／Meta AI可用工具未提供liker list；因此本輪無法檢驗。"
  - "回覆文字沒有明顯AI痕跡並不能反證『只負責likes的帳號池』，因為該hypothesis本來就不要求bot留言；但F003證明高讚文同時獲得大量可見回覆，會降低『只有likes被孤立灌高』模型的必要性。"
  - "下一步證據價值最高的是prospective test：事前固定作者與判準，完整記錄未來貼文，不依結果挑樣本；若再次out-of-sample出現『低基線 -> 特定政治文數千讚 -> 低基線 -> 特定政治文數千讚』，證據力高於事後案例搜尋。"
