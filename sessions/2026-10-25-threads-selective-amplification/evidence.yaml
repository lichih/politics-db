  - id: F010
    statement: "@eczht_tw四篇低量quote對照S011至S014目前likes約11至67，fetch_comments records_count為0至3；被quote原文current likes約1.1K至4.3K，顯示『quote到已有一定互動的原文』本身不足以讓quote文起量。"
    status: verified
