notes:
  - "目前最穩健的描述是：@robinhoodspirit出現post-level selective burst，但原因unresolved。"
  - "『selective amplification』在本檔是描述結果集中於少數貼文的cause-neutral用語，不等於已證實外部操弄。"
  - "最簡單的keyword trigger模型已被同作者多篇沈伯洋相關低讚貼文削弱；若存在外部自動化，至少需要post-level selector或其他挑選條件。"
  - "author-wide boost模型被F002直接反駁；若使用author cache/watchlist假說，cache只能解釋『被持續發現』，不能解釋為何只有部分貼文爆量。"
  - "liker overlap是區分固定帳號池最直接的觀測之一，但目前公開／Meta AI可用工具未提供liker list；因此本輪無法檢驗。"
  - "回覆文字沒有明顯AI痕跡並不能反證『只負責likes的帳號池』，因為該hypothesis本來就不要求bot留言；但F003證明高讚文同時獲得大量可見回覆，會降低『只有likes被孤立灌高』模型的必要性。"
  - "下一步證據價值最高的是prospective test：事前固定作者與判準，完整記錄未來貼文，不依結果挑樣本；若再次out-of-sample出現『低基線 -> 特定政治文數千讚 -> 低基線 -> 特定政治文數千讚』，證據力高於事後案例搜尋。"
