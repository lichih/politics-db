facts:
  - id: F001
    statement: "S001的Threads內建投票於觀察時已結束，共11,683票；結果為挺洋流15%、挺安安85%。"
    status: verified
    observed_at: "2026-10-24T16:25:25+08:00"
    source_ids: [S001]
    evidence_summary: "Threads公開頁面直接顯示投票票數與15%／85%結果。"
    verification_notes:
      - "此fact只記錄該線上投票結果，不把它升格為代表性民意調查。"
      - "投票參與者是自選且受平台曝光路徑影響；缺乏抽樣框與母體校正。"
    tags: ["2026", Threads, poll, 洋流, 沈伯洋, 蔣萬安]

  - id: F002
    statement: "@robinhoodspirit在2026-10-21 16:12至2026-10-22 02:20的連續11篇原始貼文，Meta AI fetch_posts所回報likes依序為17、9、33、11、170、6400、8、12、2、4700、3800；三篇>=3800的貼文集中在約9小時內，中間仍穿插8、12、2等低互動貼文。"
    status: verified
    observed_at: "2026-10-25T00:50:56+08:00"
    source_ids: [S002, S003, S004]
    evidence_summary: "同一作者極低baseline窗口中出現多次高讚貼文，而高讚之間並非整體帳號所有貼文同步抬升。"
    verification_notes:
      - "本序列來自Meta AI對Threads fetch_posts的逐篇整理；低讚貼文URL與內容曾在同一DM查核過程逐篇列出。"
      - "此fact描述的是觀察序列，不判斷是平台推薦、真人轉傳、人工動員或自動化帳號造成。"
      - "T0前最近4篇17、9、33、11的median為14；先前Meta AI曾誤算為22，公開evidence採校正值14。"
    tags: ["2026", Threads, selective-burst, author-baseline, 沈伯洋]

  - id: F003
    statement: "經post ID／media_id重新校驗後，S002、S003、S004的fetch_comments total_count分別為380、55、140；三篇高讚貼文的可見回覆量均明顯高於同作者同窗口多數低讚貼文的0至3則回覆。"
    status: verified
    observed_at: "2026-10-25T00:50:56+08:00"
    source_ids: [S002, S003, S004]
    evidence_summary: "高讚三篇不只是likes增加；可見回覆亦同步從作者低基線的0–3升至55–380。"
    verification_notes:
      - "曾發生一次手動media_id對應錯誤：380與137／140被配到錯誤post；本fact使用後續按post ID與media_id重新校正的數值。"
      - "fetch_comments回傳筆數略低於total_count：S002 347/380、S003 54/55、S004 137/140；工具回報has_next_page=False，差額可能來自刪除／權限等不可見record。"
      - "此fact不把回覆者一律視為支持者，也不推論所有回覆均為真人；只記錄可見互動總量。"
    tags: ["2026", Threads, comments, measurement, correction, interaction]

  - id: F004
    statement: "在針對S002、S003、S004所做的公開傳播路徑搜尋中，未找到可確認的大型帳號、候選人、媒體或組織直接quote／repost三篇原文的鏈條；此結果僅代表該次搜尋未找到，不等於不存在任何轉傳或推薦來源。"
    status: verified
    observed_at: "2026-10-25T00:50:56+08:00"
    source_ids: [S002, S003, S004]
    evidence_summary: "bounded search未找到直接大型公開擴散鏈。"
    verification_notes:
      - "not_found != never_existed；Threads搜尋工具本身有結果數與排序限制。"
      - "repost／quote總數欄位在該工具中 unavailable，因此不能由未找到search result推成零轉貼。"
    tags: ["2026", Threads, search-limit, propagation, not-found]

  - id: F005
    statement: "S003的女性安全審計素材在約11小時後另有S005取得約15,000 likes；S004相近的『沈伯洋相較蔣萬安更會做事』framing，在約16小時前另有S006取得約4,800 likes。"
    status: verified
    observed_at: "2026-10-25T00:50:56+08:00"
    source_ids: [S003, S004, S005, S006]
    evidence_summary: "至少兩篇@robinhoodspirit高互動內容存在相近時間的獨立高互動同素材／近似framing案例。"
    verification_notes:
      - "S005與S003為相同政策素材但非直接quote；S006與S004為近似framing而非相同文字。"
      - "此fact削弱『只有原作者單篇異常、題材本身完全沒有其他高互動』的強命題，但不能決定因果機制。"
    tags: ["2026", Threads, parallel-virality, matched-content, competing-explanation]

claims:
  - id: C001
    statement: "S001的15%／85%線上投票結果本身足以證明一般洋流／沈伯洋貼文的高likes是機器帳號灌出的。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001]
    reasoning_notes: "單一Threads poll是自選且非代表性樣本；即使投票行為與like的操作成本不同，也只能形成值得解釋的channel differential，不能單靠該結果完成bot因果歸因。"

  - id: C002
    statement: "@robinhoodspirit在該窗口存在post-level selective burst／selective virality：少數貼文從低baseline跳到數千likes，但同一時間附近其他貼文仍維持個位數至百餘likes。"
    status: supported
    supports: [F002]
    contradicts: []
    related_facts: [F003]
    reasoning_notes: "這是cause-neutral的描述性結論；『被選擇性放大』只表示互動結果集中於個別貼文，不指定是平台演算法、真人擴散、人工動員或外部自動化。"

  - id: C003
    statement: "該窗口是author-wide boost：作者一旦進入某種推薦或目標名單，所有後續貼文整體baseline都同步上升。"
    status: contradicted
    supports: []
    contradicts: [F002]
    related_facts: []
    reasoning_notes: "6400之後仍出現8、12、2，再出現4700、3800；T0後多數貼文未同步抬升，與『所有新文一起被加權』不符。"

  - id: C004
    statement: "三篇高讚貼文只是likes單獨暴增，沒有同步的人類可見互動增加。"
    status: contradicted
    supports: []
    contradicts: [F003]
    related_facts: []
    reasoning_notes: "校正後三篇fetch_comments total_count為380、55、140，相較同作者低baseline貼文0–3則回覆均明顯增加。這不排除likes中另有非自然成分，但排除『只有like counter上升、其他互動完全不動』的強命題。"

  - id: C005
    statement: "存在外部自動化流程『discovery -> author cache/watchlist -> periodic polling -> post-level selection -> account-pool like dispatch』，且它是F002 selective burst的實際原因。"
    status: unresolved
    supports: [F002]
    contradicts: [F003, F005]
    related_facts: [F004]
    reasoning_notes: "此工程模型可以產生『高讚間穿插低讚』的觀察形狀，因此仍是可反證hypothesis；但目前缺liker identity、like timestamps、views/impressions與直接帳號池證據。F003顯示高讚同時伴隨大量回覆，F005則提供至少部分內容的自然／演算法virality替代解釋。"

  - id: C006
    statement: "Threads自身推薦機制、真人轉傳／人工動員足以完整解釋F002，外部自動化可被排除。"
    status: unresolved
    supports: [F003, F005]
    contradicts: []
    related_facts: [F002, F004]
    reasoning_notes: "F003與F005提高自然／平台擴散解釋的可信度，但缺曝光曲線、推薦來源、views與liker資料，尚不能證明它們已解釋全部異常或排除混合模型。"

  - id: C007
    statement: "目前Meta AI Threads content_search結果可以用來估計pro-沈與pro-蔣／反沈小帳號發生selective burst的盛行率差異。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: []
    reasoning_notes: "多輪測試中，content_search即使要求50筆，每個時間切片實際僅回傳2–3筆；中性人名16次搜尋合併30位作者，排除媒體／官方／大帳號後只剩9位且全被分類為pro-沈，與已知可另外找到的反沈小帳號不相容於代表性母體假設。工具適合case discovery，不足以建立prevalence denominator。"

