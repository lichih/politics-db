  - id: F011
    statement: "S007目前Threads shared-post card顯示約21K likes、355留言、569轉發、610分享；S007與S008皆呈現多維互動，而不是只有like counter單獨升高。"
    status: verified
    observed_at: "2026-10-25T13:55:00+08:00"
    source_ids: [S007, S008]
    evidence_summary: "兩個核心高量節點在目前UI皆同時有大量留言、轉發與分享。"
    verification_notes:
      - "這只能反駁『likes alone』強命題；不能單獨排除likes中存在自動化或人工放大成分。"
    tags: ["2026", Threads, interaction-mix, viral, likes-only]

claims:
  - id: C001
    statement: "S001的15%／85%線上投票結果本身足以證明一般洋流／沈伯洋貼文的高likes是機器帳號灌出的。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001]
    reasoning_notes: "單一Threads poll是自選且非代表性樣本；即使投票行為與like的操作成本不同，也只能形成值得解釋的channel differential，不能單靠該結果完成bot因果歸因。"

  - id: C002
    statement: "@robinhoodspirit在該窗口存在post-level selective burst／selective virality：少數貼文從低baseline跳到數千likes，但同一時間附近其他貼文仍維持個位數至百餘likes。"
    status: supported
    supports: [F002]
    contradicts: []
    related_facts: [F003]
    reasoning_notes: "這是cause-neutral的描述性結論；『被選擇性放大』只表示互動結果集中於個別貼文，不指定是平台演算法、真人擴散、人工動員或外部自動化。"

  - id: C003
    statement: "該窗口是author-wide boost：作者一旦進入某種推薦或目標名單，所有後續貼文整體baseline都同步上升。"
    status: contradicted
    supports: []
    contradicts: [F002]
    related_facts: []
    reasoning_notes: "6400之後仍出現8、12、2，再出現4700、3800；T0後多數貼文未同步抬升，與『所有新文一起被加權』不符。"

  - id: C004
    statement: "三篇高讚貼文只是likes單獨暴增，沒有同步的人類可見互動增加。"
    status: contradicted
    supports: []
    contradicts: [F003]
    related_facts: []
    reasoning_notes: "校正後三篇fetch_comments total_count為380、55、140，相較同作者低baseline貼文0–3則回覆均明顯增加。這不排除likes中另有非自然成分，但排除『只有like counter上升、其他互動完全不動』的強命題。"

  - id: C005
    statement: "存在外部自動化流程『discovery -> author cache/watchlist -> periodic polling -> post-level selection -> account-pool like dispatch』，且它是F002／F006 selective burst的實際原因。"
    status: unresolved
    supports: [F002, F006]
    contradicts: [F003, F005, F007, F008, F009, F011]
    related_facts: [F004, F010]
    reasoning_notes: "此工程模型仍能產生『高讚間穿插低讚』的形狀，因此不能由目前資料排除；但現有資料沒有liker identity、like timestamps或直接帳號池證據。F007顯示核心source在quote前已先快速累積大量replies，F008／F011顯示高量節點同時有大量可見轉發／分享／留言，F009則顯示同帳號高量quote沒有固定reply propagation recipe。這些資料降低『固定帳號池是必要解釋』的權重，但不排除hybrid或只操作likes的模型。"

  - id: C006
    statement: "Threads自身推薦機制、真人轉傳／人工動員足以完整解釋F002／F006，外部自動化可被排除。"
    status: unresolved
    supports: [F003, F005, F007, F008, F009, F010, F011]
    contradicts: []
    related_facts: [F002, F004, F006]
    reasoning_notes: "新資料明顯提高內容／推薦／真人擴散作為正常解釋的可信度：核心source在quote前已先快速累積大量replies，高量節點有多維互動，且同帳號高量quote呈不同propagation shape；但缺平台推薦日志、views/impressions、liker資料與完整share graph，仍不能證明自然／平台機制已解釋全部異常或排除hybrid。"

  - id: C007
    statement: "目前Meta AI Threads content_search結果可以用來估計pro-沈與pro-蔣／反沈小帳號發生selective burst的盛行率差異。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: []
    reasoning_notes: "多輪測試中，content_search即使要求50筆，每個時間切片實際僅回傳2–3筆；中性人名16次搜尋合併30位作者，排除媒體／官方／大帳號後只剩9位且全被分類為pro-沈，與已知可另外找到的反沈小帳號不相容於代表性母體假設。工具適合case discovery，不足以建立prevalence denominator。"


  - id: C008
    statement: "@eczht_tw高量quote由同一固定engagement generator以近似互動配方放大，因此應呈現相近的reply propagation shape。"
    status: contradicted
    supports: []
    contradicts: [F009]
    related_facts: [F008]
    reasoning_notes: "S008與S009屬低reply慢熱型，S010則為高reply快速成長型；同一作者的高量quote沒有單一共同reply curve。這反駁『所有互動維度由同一固定recipe同步生成』的強模型，但不反駁只操作likes、其餘互動自然形成的較弱模型。"

  - id: C009
    statement: "S007是在@eczht_tw S008 quote發生後才進入主要viral growth，兩篇可能主要由quote後的共同放大才一起起量。"
    status: contradicted
    supports: []
    contradicts: [F007]
    related_facts: [F008]
    reasoning_notes: "S007在quote前163分鐘已累積194則direct replies，約佔目前records的62.2%，主要reply growth明顯早於quote。這不告訴我們當時likes數，但足以反駁『source主要在quote後才開始高互動』的強命題。"

  - id: C010
    statement: "目前已取得的Threads證據足以把post-level selective burst歸因為bot／網軍灌讚。"
    status: unsupported
    supports: []
    contradicts: [F003, F005, F007, F008, F009, F010, F011]
    related_facts: [F002, F006]
    reasoning_notes: "selective burst本身已被重複觀察，但attribution仍缺liker-level network、like timestamps、帳號建立／同步行為、完整曝光曲線與可重現母體sampling。現有多維互動與不同propagation shape提供強替代解釋，因此不能由burst形狀直接升格成bot／網軍結論。"

  - id: C011
    statement: "就目前已取得資料，內容特性、Threads推薦與真人擴散是比『已證實固定bot帳號池灌讚』更強的工作解釋。"
    status: supported
    supports: [F005, F007, F008, F009, F010, F011]
    contradicts: []
    related_facts: [F002, F006]
    reasoning_notes: "這是相對解釋力判斷，不是已證實因果。核心source在quote前已先高互動、同素材／近似framing存在其他viral案例、高量quote的互動結構多樣，且高量節點有大量可見repost/share/reply；因此正常virality/recommendation目前比bot attribution需要較少額外假設。但沒有平台內部推薦日志，不能把它升格為fully supported。"

