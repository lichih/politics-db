facts:
  - id: F001
    statement: "遠見On AIR專訪中，沈伯洋稱臺北兒虐問題看起來愈來愈嚴重，並說『兒虐不當事件』應是六都居首；主持人追問是否與區域性或造成問題的環節有關，沈接著表示手上沒有數據，只能用猜的。"
    status: partial
    observed_at: "2026-11-05"
    source_ids: [S001, S007]
    evidence_summary: "有新聞報導提供連續問答脈絡；尚未取得原始全片時間碼，不能逕認『用猜的』必然專指六都排名或專指成因。"
    verification_notes:
      - "原始排名與『沒有數據』兩段在同次對話中出現，應一併呈現，不需為任一方先做語意免責。"
      - "應取得遠見完整專訪原片、逐字稿與時間碼。"
    tags: ["沈伯洋", "原話", "待原片核對"]
  - id: F002
    statement: "衛福部2024年113保護專線兒少保護案件通報件數：新北1431、臺中1048、桃園891、高雄833、臺北747、臺南493；臺北在六都列第五。"
    status: verified
    observed_at: "2026-11-05"
    source_ids: [S002, S003]
    evidence_summary: "直接核對官方113通報件數分析表；統計區間2024-01-01至2024-12-31，單位件數。"
    verification_notes:
      - "此數據只能反證『若所指是2024年113專線兒少保護通報件數則臺北不是第一』，不能直接涵蓋沈未定義的所有『不當事件』。"
      - "通報件數不等於實際兒虐發生人數，也不構成治理成效的單一排名。"
    tags: ["衛福部", "113專線", "2024", "統計口徑"]
  - id: F003
    statement: "衛福部官方統計分別處理113保護專線通報、兒少保護通報及分流、家內受虐致死等不同指標；不能將不同母體混成同一六都排名。"
    status: verified
    observed_at: "2026-11-05"
    source_ids: [S002, S003, S004, S008]
    evidence_summary: "官方定義顯示通報、介入與家內受虐致死屬不同事件集合。"
    tags: ["統計口徑", "政策判準"]
  - id: F004
    statement: "2026-11-04沈伯洋競辦發言人蔡一愷已公開回應爭議，稱不應斷章取義，並轉談兒虐制度預防及夏莉絲幼兒園13件1999陳情；該篇公開回應未提供『六都之首』具體統計口徑或數據，也未見道歉。"
    status: verified
    observed_at: "2026-11-05"
    source_ids: [S005]
    evidence_summary: "核對太報22:06報導的競辦回應內容。『未見』只限本篇報導及此次查詢，不等於從未有任何其他公開解釋。"
    verification_notes:
      - "有公開回應，不可描述成『完全沒有說明／完全沒有回應』。"
      - "尚待持續追蹤本人是否補證、修正排名或公開致歉。"
    tags: ["競辦回應", "追蹤"]
  - id: F005
    statement: "臺北市教育局稱夏莉絲幼兒園權管的13件1999陳情中，事發前7件多涉及收費、師生比、教學場地，而非13件全部都是事發前的兒虐通報；並稱每件均有依程序處理。"
    status: verified
    observed_at: "2026-11-05"
    source_ids: [S006, S009]
    evidence_summary: "確認教育局有正式公開上述說法；處理是否充分仍須逐案資料核查，不能只依機關自述結案。"
    verification_notes:
      - "13件是陳情數，不能在缺乏明細時直接等同13次虐童通報。"
    tags: ["夏莉絲", "1999", "教育局"]
  - id: F006
    statement: "王鴻薇與蔣萬安陣營公開批評沈伯洋以猜測提出兒虐六都排名，並援引家內受虐致死數據反駁。"
    status: verified
    observed_at: "2026-11-05"
    source_ids: [S007]
    evidence_summary: "記錄政治攻防雙方公開主張；家內致死數據與不當照護事件並非相同母體。"
    tags: ["政治攻防", "資料口徑"]
  - id: F007
    statement: "國發會社會安全網查證報告將兒童受虐及受虐致死上升、主動關懷及保護仍待提升列為治理待改進事項。"
    status: verified
    observed_at: "2026-11-05"
    source_ids: [S010]
    evidence_summary: "國發會官方查證報告摘要之待改進事項。"
    verification_notes:
      - "此為全國政策檢視，不可直接作為特定縣市漏報或介入成效優劣的證明。"
    tags: ["社安網", "政策評估"]

  - id: F008
    statement: "沈伯洋競辦於11月4日晚間回應時，指責蔣萬安陣營拿兒虐悲劇做政治攻防，但同一回應又要求若無心解決就換人做，並質疑官員戀棧權位或蔣市長放縱。"
    status: verified
    observed_at: "2026-11-05T09:36:59+08:00"
    source_ids: [S005, S011, S012]
    evidence_summary: "ETtoday貼文標題與太報同時期逐段引述顯示，競辦一方面宣示不應以悲劇作政治攻防，另一方面仍提出針對市長和官員的政治責任追究。"
    verification_notes:
      - "指出語用上的張力不等於主張不可追究市長責任；實際爭點在於攻擊是否由證據支持，以及有否回答原本的六都排名舉證。"
    tags: ["競辦回應", "政治攻防", "責任標準"]
  - id: F009
    statement: "ETtoday 11月4日23:31報導，蔣萬安競辦再度回應沈辦所稱『坦率表示尚未掌握完整數據』，質疑既然未掌握數據，為何先公開以兒虐問題批評臺北市政。"
    status: partial
    observed_at: "2026-11-05T09:36:59+08:00"
    source_ids: [S013]
    evidence_summary: "ETtoday文章標題及第三方索引摘要可核；原文全文仍待直接核對。"
    verification_notes:
      - "此處是蔣辦對沈辦的反擊，非政府機關核定的事實認定。"
    tags: ["蔣辦回應", "媒體追蹤"]

claims:
  - id: C001
    statement: "臺北市的『兒虐不當事件』是六都之首。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002, F003]
    reasoning_notes: "目前未見沈伯洋提供定義、年度、分母、資料來源或排名計算；2024年113專線兒少通報數恰為第五，但指標未必等同其未定義的『不當事件』，不宜寫成所有指標都已證偽。"
  - id: C002
    statement: "臺北市2024年113保護專線兒少保護案件通報件數居六都第一。"
    status: contradicted
    supports: []
    contradicts: [F002]
    related_facts: [F003]
    reasoning_notes: "2024官方同口徑數字顯示臺北第五；僅限此特定子指標。"
  - id: C003
    statement: "通報數越高就越證明市政治理失敗；或零死亡必然證明所有通報均獲妥善處理。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F003, F007]
    reasoning_notes: "通報量受到發生率、通報意願、制度可近性、發現能力、重複通報及分流影響；死亡數則受案件規模及嚴重程度等影響。應比較通報後調查、開案、介入時效、再犯、死亡及漏報風險，不可從單一數字直接推因果。"
  - id: C004
    statement: "沈伯洋藉無來源的六都排名強化臺北市政負面印象、迴避原排名舉證，是抹黑式論證。"
    status: unresolved
    supports: [F001, F004]
    contradicts: []
    related_facts: [F002, F003]
    reasoning_notes: "這是對可觀察發言結構與回應效果的政治評價／目的推論，有公開事證可供討論，但不能寫成已查明其主觀故意或明知數據相反。"
  - id: C005
    statement: "若不是有意藉猜測抹黑，則顯露市長候選人對兒少統計與政策判斷的能力風險。"
    status: unresolved
    supports: [F001, F003, F004]
    contradicts: []
    related_facts: [F002, F007]
    reasoning_notes: "這是公共治理的條件式評價：統計判讀能力影響行政督導與資源配置；尚不能據此直接認定個人全面缺乏治理能力。"
  - id: C006
    statement: "沈伯洋截至2026-11-05完全沒有回應或解釋爭議。"
    status: contradicted
    supports: []
    contradicts: [F004]
    related_facts: []
    reasoning_notes: "競辦在11/04 22:06報導已有回應；比較精確的未解決問題是未見對原『六都之首』排名提出證據或明確撤回。"

  - id: C007
    statement: "沈伯洋競辦稱遭斷章取義，足以排除對原『兒虐不當事件六都之首』主張的舉證責任。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F004, F008, F009]
    reasoning_notes: "即使『只能用猜的』主要回答主持人的成因追問，對『六都之首』原排名主張也仍須提出定義與同期同口徑數據。引入夏莉絲個案與家長版1999新政策可另論，但不構成排名之證據。"
  - id: C008
    statement: "沈辦宣稱別拿兒虐悲劇作政治攻防，但其回應同時有政治問責和要求換人的內容，構成雙重標準的論證問題。"
    status: unresolved
    supports: [F008]
    contradicts: []
