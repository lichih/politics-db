claims:
  - id: C001
    statement: "臺北市的『兒虐不當事件』是六都之首。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F001, F002, F003]
    reasoning_notes: "目前未見沈伯洋提供定義、年度、分母、資料來源或排名計算；2024年113專線兒少通報數恰為第五，但指標未必等同其未定義的『不當事件』，不宜寫成所有指標都已證偽。"
  - id: C002
    statement: "臺北市2024年113保護專線兒少保護案件通報件數居六都第一。"
    status: contradicted
    supports: []
    contradicts: [F002]
    related_facts: [F003]
    reasoning_notes: "2024官方同口徑數字顯示臺北第五；僅限此特定子指標。"
  - id: C003
    statement: "通報數越高就越證明市政治理失敗；或零死亡必然證明所有通報均獲妥善處理。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F003, F007]
    reasoning_notes: "通報量受到發生率、通報意願、制度可近性、發現能力、重複通報及分流影響；死亡數則受案件規模及嚴重程度等影響。應比較通報後調查、開案、介入時效、再犯、死亡及漏報風險，不可從單一數字直接推因果。"
  - id: C004
    statement: "沈伯洋藉無來源的六都排名強化臺北市政負面印象、迴避原排名舉證，是抹黑式論證。"
    status: unresolved
    supports: [F001, F004]
    contradicts: []
    related_facts: [F002, F003]
    reasoning_notes: "這是對可觀察發言結構與回應效果的政治評價／目的推論，有公開事證可供討論，但不能寫成已查明其主觀故意或明知數據相反。"
  - id: C005
    statement: "若不是有意藉猜測抹黑，則顯露市長候選人對兒少統計與政策判斷的能力風險。"
    status: unresolved
    supports: [F001, F003, F004]
    contradicts: []
    related_facts: [F002, F007]
    reasoning_notes: "這是公共治理的條件式評價：統計判讀能力影響行政督導與資源配置；尚不能據此直接認定個人全面缺乏治理能力。"
  - id: C006
    statement: "沈伯洋截至2026-11-05完全沒有回應或解釋爭議。"
    status: contradicted
    supports: []
    contradicts: [F004]
    related_facts: []
    reasoning_notes: "競辦在11/04 22:06報導已有回應；比較精確的未解決問題是未見對原『六都之首』排名提出證據或明確撤回。"

  - id: C007
    statement: "沈伯洋競辦稱遭斷章取義，足以排除對原『兒虐不當事件六都之首』主張的舉證責任。"
    status: unsupported
