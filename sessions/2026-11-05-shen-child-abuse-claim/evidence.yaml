    reasoning_notes: "即使『只能用猜的』主要回答主持人的成因追問，對『六都之首』原排名主張也仍須提出定義與同期同口徑數據。引入夏莉絲個案與家長版1999新政策可另論，但不構成排名之證據。"
  - id: C008
    statement: "沈辦宣稱別拿兒虐悲劇作政治攻防，但其回應同時有政治問責和要求換人的內容，構成雙重標準的論證問題。"
    status: unresolved
    supports: [F008]
    contradicts: []
    related_facts: [F001, F004]
    reasoning_notes: "是基於同次公開發言的目的與標準一致性評價；並非所有針對兒虐的政治究責都不正當。對同一政治目的適用相同事證門檻才是判準。"
  - id: C009
    statement: "112年（2023年）臺北市幼兒園不當對待通報數為六都第一。"
    status: unresolved
    supports: []
    contradicts: [F012]
    related_facts: [F010, F011]
    reasoning_notes: "若教育部六都415與臺北教育局48為同年度同母體，數學上已可否定臺北第一；現階段仍缺六都逐市原始表確認通報定義相同，因此保留 unresolved，不能冒稱無條件反證。"
  - id: C010
    statement: "因為談的是幼兒園不當對待，而不是家內死亡，臺北『六都之首』的排名就已獲證實。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F010, F011, F012, F014]
    reasoning_notes: "限定到幼兒園是合理統計口徑修正，不能自行補齊2024、2025或2026年的排名證明。"

  - id: C011
    statement: "臺北幼兒園在園幼生六都第五，所以即使沒有案件數據，也可證明不可能有六都最多的幼兒園不當對待通報。"
    status: unsupported
    supports: []
    contradicts: []
    related_facts: [F015, F016, F017]
    reasoning_notes: "分母較小只影響沒有差異率模型下的基準預期，不能限制現實中的通報率或案件總數；臺北若每名幼生通報率顯著較高，仍可能總件數第一。"
  - id: C012
    statement: "臺北園數與幼生數比部分直轄市少，意味無額外高通報率證據時，憑印象直接猜『通報總件數六都第一』欠缺基準率支持。"
    status: supported
    supports: [F015, F016]
    contradicts: []
    related_facts: [F010, F011, F012, F017]
    reasoning_notes: "作為論證方法評價成立：在相同每園或每幼生通報率的基準模型下，較小暴露母體的總量預期較低；不是證明不可能第一，也不是以總量替代每名幼生率或真正治理成效。"

  - id: C013
    statement: "貼文所稱高雄6,822、臺北4,078與每萬人165、100是2025年（去年度）的兒少保護通報統計。"
