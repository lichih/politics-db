facts:
  - id: F001
    statement: "遠見On AIR專訪中，沈伯洋稱臺北兒虐問題看起來愈來愈嚴重，並說『兒虐不當事件』應是六都居首；主持人追問是否與區域性或造成問題的環節有關，沈接著表示手上沒有數據，只能用猜的。"
    status: partial
    observed_at: "2026-11-05"
    source_ids: [S001, S007]
    evidence_summary: "有新聞報導提供連續問答脈絡；尚未取得原始全片時間碼，不能逕認『用猜的』必然專指六都排名或專指成因。"
    verification_notes:
      - "原始排名與『沒有數據』兩段在同次對話中出現，應一併呈現，不需為任一方先做語意免責。"
      - "應取得遠見完整專訪原片、逐字稿與時間碼。"
    tags: ["沈伯洋", "原話", "待原片核對"]
  - id: F002
    statement: "衛福部2024年113保護專線兒少保護案件通報件數：新北1431、臺中1048、桃園891、高雄833、臺北747、臺南493；臺北在六都列第五。"
    status: verified
    observed_at: "2026-11-05"
    source_ids: [S002, S003]
    evidence_summary: "直接核對官方113通報件數分析表；統計區間2024-01-01至2024-12-31，單位件數。"
    verification_notes:
      - "此數據只能反證『若所指是2024年113專線兒少保護通報件數則臺北不是第一』，不能直接涵蓋沈未定義的所有『不當事件』。"
      - "通報件數不等於實際兒虐發生人數，也不構成治理成效的單一排名。"
    tags: ["衛福部", "113專線", "2024", "統計口徑"]
  - id: F003
    statement: "衛福部官方統計分別處理113保護專線通報、兒少保護通報及分流、家內受虐致死等不同指標；不能將不同母體混成同一六都排名。"
    status: verified
    observed_at: "2026-11-05"
    source_ids: [S002, S003, S004, S008]
    evidence_summary: "官方定義顯示通報、介入與家內受虐致死屬不同事件集合。"
    tags: ["統計口徑", "政策判準"]
  - id: F004
    statement: "2026-11-04沈伯洋競辦發言人蔡一愷已公開回應爭議，稱不應斷章取義，並轉談兒虐制度預防及夏莉絲幼兒園13件1999陳情；該篇公開回應未提供『六都之首』具體統計口徑或數據，也未見道歉。"
    status: verified
    observed_at: "2026-11-05"
    source_ids: [S005]
    evidence_summary: "核對太報22:06報導的競辦回應內容。『未見』只限本篇報導及此次查詢，不等於從未有任何其他公開解釋。"
    verification_notes:
      - "有公開回應，不可描述成『完全沒有說明／完全沒有回應』。"
      - "尚待持續追蹤本人是否補證、修正排名或公開致歉。"
    tags: ["競辦回應", "追蹤"]
