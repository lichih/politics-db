facts:
- id: F001
  statement: 2022年11月選舉期間，「無良公關」粉專張貼一份自稱國民黨內部「網軍建置計畫企劃書」的文件，內容涉及操作社群、攻擊候選人及找狗仔跟拍，並出現蔣萬安、徐巧芯等人的簽名。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S001
  - S007
  evidence_summary: 二審判決與中央社均記載該貼文及文件之主要內容；二審並記載文件及其上簽名事後被證實為偽造。
  tags:
  - '2022'
  - 網軍建置計畫企劃書
  - 選舉
- id: F002
  statement: 截至2024年11月14日，臺北地檢署對陳冠宇等人就本案已兩度作成不起訴處分；第一次不起訴經再議發回後，北檢續查仍再次不起訴。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S005
  - S007
  evidence_summary: 太報與中央社均確認兩度不起訴及再議發回之程序歷程。
  tags:
  - 不起訴
  - 再議
  - 北檢
- id: F003
  statement: 2024年第二次不起訴時，公開報導所載北檢理由包括：被告等人並非文件或簽名真偽鑑定專業者，因簽名外觀相符而誤信文件為真並非違常，難以認定具有虛構、捏造、誹謗或使候選人不當選之主觀犯意。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S005
  evidence_summary: 太報報導具體轉述第二次不起訴處分的證據評價與主觀犯意判斷。
  verification_notes:
  - 尚未取得該次不起訴處分書原文；此fact只記錄可信媒體所報導的處分理由，不把媒體轉述當成原始處分書。
  tags:
  - 第二次不起訴
  - 簽名辨識
  - 主觀犯意
- id: F004
  statement: 第二次再議發回後，北檢於2025年9月第三次偵查改依選罷法起訴陳冠宇，公開報導所載核心理由是其作為政治粉專管理者對重大選舉指控的查證程度明顯不足；其他轉貼、評論者仍獲不起訴。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S006
  - S007
  evidence_summary: TVBS與中央社一致記載第三次偵查的起訴結果及陳冠宇與其他轉貼者之處理差異。
  tags:
  - 第三次偵查
  - 起訴
  - 查證義務
- id: F005
  statement: 臺北地院114年度訴字第1248號於2026年2月25日依選罷法第104條判陳冠宇有期徒刑6月、得易科罰金，褫奪公權2年。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S002
  - S007
  evidence_summary: 一審官方裁判與中央社報導一致確認判決結果。
  tags:
  - 一審
  - 有罪
  - 選罷法104條
- id: F006
  statement: 臺灣高院115年度上訴字第2173號於2026年8月20日撤銷原判決，但仍認定陳冠宇犯意圖使候選人不當選而以文字傳播不實之事罪，量處有期徒刑6月、得易科罰金、褫奪公權2年；撤銷理由包括原判決漏論同一行為同時侵害徐巧芯與蔣萬安之品行、人格及社會評價的想像競合。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S001
  - S008
  evidence_summary: 二審官方裁判及全文轉載一致記載撤銷改判理由與相同刑度。
  tags:
  - 二審
  - 撤銷改判
  - 想像競合
- id: F007
  statement: 二審判決認定，陳冠宇發文前對陌生網友僅詢問消息來源與真實性，另自行目視比對徐巧芯簽名，沒有向候選人或政黨進一步查證；法院據此認為未盡合理查證義務，並認定具有真正惡意。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S001
  - S008
  evidence_summary: 二審判決具體列出Messenger對話、簽名比對及未進一步查證等事實後，作成真正惡意之認定。
  tags:
  - 真正惡意
  - 合理查證
  - Messenger
- id: F008
  statement: 二審判決就文件可辨識程度採取高度不利於陳冠宇的評價，明載本案文件「客觀上一望即知係偽造」，並以其學經歷及長期經營政治粉專的經驗，認為其應可合理判斷文件不實。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S001
  - S008
  evidence_summary: 二審判決以文件內容、來源、被告經驗及查證方式綜合認定其應能識別文件高度可疑。
  tags:
  - 文件可辨識程度
  - 一望即知
  - 證據評價
- id: F009
  statement: 二審判決將文件中「網軍攻擊、側翼攻防、狗仔跟拍、黑金賄選桃色議題潑髒水」等內容，定性為對徐巧芯、蔣萬安個人品行、人格等私德領域的攻訐，認為逾越公眾團體事務及一般公共利益範疇，與公益無關。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S001
  - S008
  evidence_summary: 二審判決在私德／公共利益分析中逐項引述文件內容後作成上述分類。
  tags:
  - 私德
  - 公共利益
  - 言論自由
- id: F010
  statement: 二審判決明確區分陳冠宇與其他同案轉貼者：陳冠宇以「收到獨家爆料、內部流出」等肯定式文字發布；其他人則有以詢問澄清或單純評論方式發布，法院據此認為行為態樣並不相同。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S001
  - S008
  evidence_summary: 二審判決直接比較陳冠宇與張朝龍、杜承哲、謝立聖等人的貼文用語與處理方式。
  tags:
  - 同案比較
  - 發文語氣
  - 差異處理
- id: F011
  statement: 最高法院111年度台上字第4362號就選罷法第104條表示，散布或傳播虛構具體事實為客觀構成要件，真正惡意為主觀構成要件；即使被告未能自行證明真實或已盡查證，檢察官或自訴人仍負有證明真正惡意的舉證責任。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S003
  evidence_summary: 最高法院明確說明真正惡意、合理查證、無罪推定及檢方舉證責任的關係。
  tags:
  - 最高法院
  - 真正惡意
  - 舉證責任
- id: F012
  statement: 憲法法庭112年憲判字第8號將「私德」描述為通常涉及個人生活習性、修養、價值觀、人格特質並與私生活及隱私權密切相關；同時指出涉及公共利益的事實性言論，在合理查證且無明知或重大輕率惡意時，受較高言論自由保障。
  status: verified
  observed_at: '2026-10-26T03:52:32+08:00'
  source_ids:
  - S004
  evidence_summary: 憲法法庭對私德／公共利益及合理查證的憲法界線提供一般性判準。
  tags:
  - 憲法法庭
  - 私德
  - 公共利益
  - 重大輕率

claims:
- id: C001
  statement: 本案已形成可實質檢驗的「證據評價一致性」問題：北檢第二次不起訴認為一般人因簽名外觀而誤信並不違常，二審則認為文件客觀上一望即知係偽造；兩者對文件可辨識程度及由此推導的主觀犯意有明顯方向差異。
  status: supported
  supports:
  - F003
  - F008
  related_facts:
  - F002
  - F004
  - F006
  reasoning_notes: 這是對公開理由差異的描述，不等同認定任何一方違法。若要判斷是否屬不合理翻案，仍須取得兩次不起訴處分、兩次再議發回理由及第三次偵查新增證據。
- id: C002
  statement: 第二次不起訴到第三次起訴之間，存在一項已公開可識別的關鍵新增證據，足以完整解釋北檢由「主觀犯意不足」改為「重大輕率惡意」。
  status: unresolved
  supports: []
  contradicts: []
  related_facts:
  - F003
  - F004
  - F007
  - F008
  reasoning_notes: 目前公開裁判大量引用111、112年間早期偵查卷證；本次尚未取得兩次不起訴處分書與兩次再議發回理由，不能由「未在公開資料看到新增關鍵證據」推成「沒有新增證據」。
- id: C003
  statement: 二審將「候選人是否參與政黨網軍、側翼攻防、狗仔跟拍與選舉攻擊計畫」歸為與公益無關的私德，與憲法法庭對私德通常涉及個人私生活／隱私，以及政治人物行為可能因公共信任而具有公共利益的判準之間，存在值得進一步法律檢驗的實質張力。
  status: supported
  supports:
  - F009
  - F012
  reasoning_notes: 此claim只指出法理分類張力，不直接宣告二審適用法律違法。仍需進一步分析選罷法第104條與刑法誹謗罪真實性抗辯在本案的具體關係，以及上級審若有裁判將如何處理。
- id: C004
  statement: 因二審以「未盡查證義務」等事實推論真正惡意，所以該判決在法律方法上必然違反最高法院111年度台上字第4362號。
  status: unsupported
  related_facts:
  - F007
  - F011
  reasoning_notes: 最高法院本身允許以資料來源、查證程度與整體情狀判斷真正惡意；問題在於檢方是否證明到排除合理懷疑，而不是法院一使用查證因素就當然違法。
- id: C005
  statement: 最高法院111年度台上字第4362號允許把「被告沒有完成查證」本身直接視為選罷法第104條主觀犯意的充分證明，並把舉證責任轉由被告負擔。
  status: contradicted
  contradicts:
  - F011
  reasoning_notes: 最高法院明確保留檢察官或自訴人對真正惡意的舉證責任；被告無法自證真實或合理查證，不等於檢方當然完成主觀犯意證明。
- id: C006
  statement: 其他轉貼者獲不起訴、只有陳冠宇被起訴並判刑，本身即可證明同案同事實被選擇性追訴。
  status: contradicted
  contradicts:
  - F010
  related_facts:
  - F004
  reasoning_notes: 二審判決辨識出肯定式「獨家爆料／內部流出」與詢問澄清、單純評論等行為差異；是否仍存在選擇性執法須另以相似行為、相似主觀證據及處理基準比較，不能只看處分結果不同。
- id: C007
  statement: 本案目前證據足以證明檢察、法院處理受到政治指示或政治目的介入，構成司法迫害或政治迫害。
  status: unsupported
  related_facts:
  - F002
  - F004
  - F006
  - F008
  - F009
  reasoning_notes: 現有材料可支持程序與法律評價上的質疑，但尚無指令、協調、決策鏈、選舉目的或其他能把異常連到政治介入的證據。
- id: C008
  statement: 本案適合作為選舉假訊息執法一致性的 comparator，但比較時應拆分「是否明確造假」「消息來源與查證」「發文語氣」「是否主動澄清／下架」「檢警強制處分」「起訴與不起訴門檻」等維度，而不能只比較最後有罪或不起訴。
  status: supported
  supports:
  - F002
  - F004
  - F007
  - F010
  - F011
  reasoning_notes: 本案內部即存在不同發文態樣與不同處理結果，顯示若不控制行為與證據差異，容易把結果差異誤寫成執法雙標。

