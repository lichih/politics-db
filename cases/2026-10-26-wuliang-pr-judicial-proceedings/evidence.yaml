promotion:
  comparators:
  - 2022「無良公關」假國民黨網軍企畫書案
  research:
  - 取得兩次不起訴處分書與兩次高檢署再議發回理由，逐項比較證據、待查事項與法律評價。
  - 比對第三次起訴書114年度選偵續一字第1號與前兩次不起訴之卷證新增項目，回答翻案是否來自新證據或同證據之重新評價。
  - 追蹤115年度上訴字第2173號是否上訴最高法院；目前歷審僅有兩筆不得推論已確定。
  - 將二審「網軍／狗仔選舉計畫屬私德且與公益無關」之分類，與最高法院選舉政治言論及憲法法庭私德／公共利益判準作完整法律分析。
  - 建立跨陣營選舉假訊息第104條案件baseline，控制發文肯定程度、查證來源、候選人身分、散布規模及強制處分等差異。

notes:
- 本case升級自既有legacy comparator；legacy檔保留歷史研究脈絡，不再作authoritative evidence source。
- 「兩度不起訴、第三次起訴、兩審有罪」是程序事實；「為何翻案」必須回到不起訴處分、再議理由與新增卷證，不能只由結果倒推。
- 「程序／證據評價一致性值得質疑」與「司法迫害／政治介入已證明」是不同命題；後者目前沒有足夠證據。
- 二審以真正惡意定罪的方法不能簡化成「查證不足＝犯罪」；最高法院仍要求檢方對真正惡意負舉證責任。
- 二審對私德／公共利益的分類是目前最值得持續法律查核的爭點之一，但在上級審或更完整法律分析前，不寫成「判決違法」。
