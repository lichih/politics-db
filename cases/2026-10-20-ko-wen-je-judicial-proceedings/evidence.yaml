claims:
- id: C001
  statement: 本案中『被告或關係人認罪』可以直接等同於『犯罪事實已被獨立證明』。
  status: contradicted
  contradicts:
  - F008
  related_facts:
  - F001
  - F002
  - F004
  - F005
  reasoning_notes: 刑訴法第156條明定被告或共犯自白不得作為有罪判決唯一證據，仍須調查補強證據；認罪可具有證據與程序意義，但不能取代對其他證據的審查。
- id: C002
  statement: 本案至少已有公開資料顯示，認罪決策可能受到犯罪事實判斷以外的程序成本或訴訟負擔影響。
  status: supported
  supports:
  - F002
  - F004
  related_facts:
  - F009
  reasoning_notes: 陳俊源本人明示『考量時間及負擔』後認罪；李文娟律師對一審無罪的100萬元部分明示『為不浪費司法資源』仍認罪。這足以反駁『認罪決策只反映對犯罪事實真偽的判斷』，但不足以證明其認罪為虛假。
- id: C003
  statement: 陳俊源確實是在前四次均否認、第五次訊問才因壓力改為認罪。
  status: unresolved
  related_facts:
  - F004
  - F007
  reasoning_notes: 目前可確認柯文哲庭上如此主張，也可確認陳俊源將時間與負擔列為認罪考量；但尚未取得完整偵訊筆錄與每次傳訊內容，無法獨立確認『前四次否認／第五次才認』的完整時間鏈。
- id: C004
  statement: 北檢在京華城案中刻意透過反覆訊問、羈押或訴訟成本，逼取其明知不實的認罪或自白。
  status: unresolved
  related_facts:
  - F004
  - F006
  - F007
  - F008
  reasoning_notes: 現有資料足以支持『程序成本可能影響認罪決策』並留下供述形成過程的疑問，但尚不足以證明檢方主觀上以不正方法逼供、被告自白為虛假，或存在系統性策略。需取得偵訊錄音錄影、筆錄、傳訊時序、羈押關聯及法院對自白任意性的具體判斷。
- id: C005
  statement: 李文娟2026年10月19日全部認罪，是因為她『沒錢沒時間』而被迫低頭。
  status: unsupported
  related_facts:
  - F001
  - F002
  - F009
  reasoning_notes: 目前找到的公開說法是律師稱『為不浪費司法資源』，並另有解除限制出境與科技監控的聲請；本次未找到李文娟或律師公開表示『沒錢』。
- id: C006
  statement: 李文娟二審連一審未判有罪的100萬元部分也認罪，顯示認罪範圍與法院先前完成的實體證據判斷可以出現分離，不能以『認了』取代逐項證據分析。
  status: supported
  supports:
  - F002
  - F003
  - F008
  reasoning_notes: 一審未就該100萬元判有罪，二審被告仍基於『不浪費司法資源』將其納入認罪範圍；這不決定二審實體結果，但足以說明認罪範圍不是法院既有證據判斷的同義詞。
- id: C007
  statement: 李文娟的全部認罪本身，即足以直接證明柯文哲對相關公益侵占犯罪具有共同犯意與全部犯罪事實。
  status: unsupported
  related_facts:
  - F001
  - F008
  reasoning_notes: 共同被告的認罪或自白仍須回到各被告的犯罪構成要件與補強證據；本次未以李文娟的認罪重新審查柯文哲各項主觀知情、指示及共同犯意證據，不能從她的程序選擇直接跳到另一被告的犯罪成立。
