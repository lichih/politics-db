notes:
- 本case作為柯文哲京華城／政治獻金司法案件的長期 evidence ledger 起點；後續應追加而非重新建立世界。
- 『訴訟成本會影響認罪決策』與『檢方以不正方法逼取虛假自白』是兩個不同命題。前者已有本案具體公開材料支持；後者目前維持 unresolved。
- 認罪、緩起訴、量刑利益、解除強制處分等程序選擇應與犯罪構成要件的實體證明分層。
- Facebook私密社團貼文只保存為查核起點；公開 evidence 的核心事實均另以法院、法規或公開庭訊報導支撐。
- 翟本喬2026-10-21貼文採拆解保存：其中可核實的認罪範圍與2025-09-23庭上壓力陳述回到獨立來源；選舉目的、量刑交換與『無言抗議』均不因敘事完整而升格。
