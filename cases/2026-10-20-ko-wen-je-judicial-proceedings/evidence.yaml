- 「司法迫害／政治迫害」維持重大待證指控：600萬元案可作為選擇性執法或證據門檻異常的hypothesis generator，但不得因法律推理有疑點就提前寫成政治動機結論。
- 顏萬進案作為反方comparator，防止把政黨幹部侵占黨政治獻金的刑事路徑誤寫成柯案首創；下一步比較重點是兩案具體侵占行為與不法所有意圖證據強度。
