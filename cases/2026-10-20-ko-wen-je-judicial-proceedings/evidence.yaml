- id: S017
  source_type: primary
  publisher: 全國法規資料庫
  title: 政治獻金法
  url: https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0020049
  observed_at: '2026-10-22T23:52:04+08:00'
  retrieval_status: reachable
  notes:
  - 全國法規資料庫顯示本法最近修正日期為2018-06-20，故本次引用之第10、14、15、17、27、30條規範在2022年事件時已存在，非以後來規則倒推。
  - 第10條第2項要求金錢政治獻金於收受後15日內存入專戶；第14條要求超過10萬元現金捐贈以支票或金融機構匯款為之。
  - 第15條對不符規定之政治獻金設有返還或繳庫機制；第30條對未將政治獻金存入專戶另設6萬元以上120萬元以下罰鍰及限期命存入等行政法律效果。
  - 此法源可證明政治獻金法上的行政義務與行政處罰結構；不能單獨回答刑法公益侵占是否成立。

- id: S018
  source_type: primary
  publisher: 司法院裁判書系統／最高法院
  title: 最高法院114年度台上字第4613號刑事判決
  url: https://judgment.judicial.gov.tw/FJUD/printData.aspx?id=TPSM%2C114%2C%E5%8F%B0%E4%B8%8A%2C4613%2C20250925%2C1
  published_at: '2025-09-25'
  observed_at: '2026-10-22T23:52:04+08:00'
  retrieval_status: reachable
  notes:
  - 判決重申侵占罪須先合法持有他人之物，主觀上意圖排除權利人而以所有人自居，客觀上並須有足以表現變易持有為所有之行為；不以積極處分為限，但仍須同時判斷不法所有意圖與外部行為。
  - 本來源用於界定一般侵占罪構成要件，不直接決定柯文哲600萬元個案之證據是否充分。

- id: S019
  source_type: primary
  publisher: 最高行政法院／臺北市法規查詢系統
  title: 最高行政法院104年度判字第728號行政判決
  url: https://www.laws.taipei.gov.tw/law/Judge/JudgeExport/F%2C104%2C%E5%88%A4%2C728%2C001?type=7
  observed_at: '2026-10-22T23:52:04+08:00'
  retrieval_status: reachable
  notes:
  - 判決記載郭銓慶於2005年為贊助民進黨選舉，將500萬元交付時任民進黨副秘書長顏萬進；顏未轉繳黨部而侵占入己，業務侵占刑事判決已確定。
  - 此案可作為「政黨幹部代收捐給政黨之政治獻金後侵占」並非柯案首創之 comparator。
  - 其事實與柯案之證據結構、款項流向、行為時政治獻金法版本及被告辯解並不完全相同，不能以此 comparator 直接證明柯案有罪或無罪。

