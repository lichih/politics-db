notes:
  - "此case保存的是公開可驗證互動與推論鏈，不把參與者的私人恩怨、喜惡或主觀動機寫成事實。"
  - "案例的工程意義：需同時追蹤premise validity、inference validity、claim ownership與conversation provenance；修正前兩者不保證後兩者同步正確。"
  - "可抽象成失效鏈：loaded prompt -> unchecked premise -> inference amplification -> evidence correction -> substantive repair -> provenance drift -> attribution correction。"
  - "本case與sessions/2026-10-19-elderly-welfare-medical-subsidy-gap/evidence.yaml共用政策背景，但此處研究對象是論證／模型行為，不重複保存老人福利法本體的法律證據。"
