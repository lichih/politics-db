facts:
  - id: F001
    statement: "現行公職人員選舉罷免法第103條之1處罰單純透過網路以選舉、罷免結果為標的賭博財物，不要求實際影響選舉結果或具體操盤行為。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S003]
    evidence_summary: "構成要件文字本身未設實際危害、操盤能力或介選意圖要件。"
    excerpt: ""
    verification_notes: []
    tags: [第103條之1, 抽象危險]

  - id: F002
    statement: "法務部2018年已正式指出：若草案不要求達影響選舉結果，應釐清選舉賭客特別侵害何種法益、何以重罰，以及是否符合刑法謙抑、最後手段與罪刑均衡。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S001]
    evidence_summary: "這不是事後才產生的批評，而是立法草案階段官方法律機關已提出的同類疑義。"
    excerpt: "本項增訂刑事處罰規定，並未要求達影響選舉結果，則此賭博行為所特別侵害之法益為何？"
    verification_notes: []
    tags: [刑法謙抑, 最後手段, 罪刑均衡]

  - id: F003
    statement: "行政院推動特別選舉賭博罪的主要理由，是一般賭博處罰過輕，且選舉賭盤可能不當影響選舉結果。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S002]
    evidence_summary: "立法目的可辨識為保護選舉公正，而非單純反賭博。"
    excerpt: ""
    verification_notes: []
    tags: [立法目的, 選舉公正]

  - id: F004
    statement: "立法院法制局2026年研究已明確認知Polymarket等去中心化預測市場在市場結構上不同於傳統由莊家設定賠率的選舉賭盤。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S004]
    evidence_summary: "官方研究指出其利用區塊鏈與類訂單簿機制，由市場參與者交易形成價格。"
    excerpt: ""
    verification_notes:
      - "法制局研究不代表立法院正式立場。"
    tags: [Polymarket, prediction-market]

  - id: F005
    statement: "台灣民眾黨官方線上陳情系統可受理政策建議與立委協助，且可附佐證資料；公職人員選舉罷免法的實質審查委員會為立法院內政委員會。"
    status: verified
    observed_at: "2026-10-08+08:00"
    source_ids: [S005, S006]
    evidence_summary: "可作為把本案從研究紀錄提升成實際修法建議的正式提交路徑。"
    excerpt: ""
    verification_notes: []
    tags: [民眾黨, 提案管道, 內政委員會]

claims:
  - id: C001
    statement: "選舉賭盤具有操盤與介選風險，因此所有一般小額參與者一律以刑罰處理即當然符合比例原則。"
    status: unsupported
    supports: []
    contradicts: [F002]
    related_facts: [F001, F003]
    reasoning_notes: "正當的管制目的與具體手段的必要性必須分開檢驗；2018年法務部已要求說明為何一般賭客需要特別刑罰。"

  - id: C002
    statement: "重新檢討第103條之1，不等於主張全面開放地下選舉賭盤。"
    status: supported
    supports: [F002, F004]
    contradicts: []
    related_facts: [F003]
    reasoning_notes: "可同時維持對組織賭盤、操盤、內線與實際介選的強力管制，並對低危害的一般參與者採取較小侵害手段。"

  - id: C003
    statement: "本案適合從research提升到proposals分區。"
    status: supported
    supports: [F002, F004, F005]
    contradicts: []
    related_facts: [F001, F003]
    reasoning_notes: "已有明確法律疑義、官方既有資料、新型市場情境、具體修法方向與可提交管道，已超過單純待查問題。"

