session:
  id: 2026-10-08-election-prediction-market-reform
  project: Politics
  title: "選舉預測市場與選罷法第103條之1修法建議"
  started_at: "2026-10-08+08:00"
  updated_at: "2026-10-08+08:00"
  status: active

topics:
  - 公職人員選舉罷免法
  - 第103條之1
  - 選舉賭盤
  - 預測市場
  - Polymarket
  - 刑法謙抑
  - 比例原則
  - 修法建議

proposal:
  summary: "不是主張全面開放選舉賭博，而是要求重新區分『一般小額 prediction-market 參與者』與『組織賭盤、操盤、內線、利益衝突或實際介選者』的法律責任。"
  problem: "現行第103條之1只要透過公共場所或網際網路，以選舉、罷免結果為標的賭博財物，即可成立犯罪；不要求行為人有操盤意圖、具備影響選舉能力，或實際造成任何選舉危害。2026年Polymarket案件顯示，現行規範已直接套用到可交易、即時浮動價格的prediction market，而非僅限傳統地下組頭賭盤。"
  legal_opinion:
    - "保護選舉公正具有正當目的；選舉賭盤確實可能創造操盤、內線、利益衝突與介選誘因。"
    - "但『存在高風險使用方式』不當然證明所有一般參與者均有足夠法益侵害，足以使用刑罰。"
    - "法務部早在2018年草案階段即正式質疑：若不要求達到影響選舉結果，選舉賭客特別侵害的法益為何、何以單獨重罰，是否符合刑法謙抑、最後手段及罪刑均衡。"
    - "因此爭點不是法院能否依現行明文判刑，而是現行立法將抽象風險前置到何種程度，是否仍符合比例原則與刑罰最後手段。"
    - "Polymarket等prediction market與傳統莊家賭盤結構不同；立法院法制局2026年研究也已明確認知其由市場參與者形成價格、類似訂單簿交易。是否應完全等同傳統賭盤，值得重新論證。"
  recommendations:
    - "要求內政部、法務部就2018年法務部既有疑義提出正式檢討報告，說明第103條之1對一般參與者使用刑罰的必要性與比例性。"
    - "修法時區分一般參與者與高風險行為：對組織賭盤、營利聚賭、候選人／幕僚利益衝突、內線資訊、大額操盤、虛假掛單或實際介選行為維持或加強刑責。"
    - "對無介選、無操盤、無內線的一般小額參與者，評估改採行政罰、設定金額／身分門檻，或其他較小侵害手段，而非一律刑事處罰。"
    - "另就prediction market建立明確定義與規範，不應只因標的是選舉結果，就省略其市場結構、資訊聚合功能與操縱風險的個別評估。"
    - "修法前至少先由立法院內政委員會舉行公聽會或專題報告，邀法務部、內政部、中選會、刑法學者、金融／預測市場研究者共同釐清法益與替代手段。"
  submission_channels:
    - name: "台灣民眾黨線上陳情／政策建議"
      role: "首選正式入口"
      url: "https://helpyou.tpp.org.tw/HelpYou"
      notes: "官方受理『立委協助、政策建議、問題反映』；流程為提交→受理確認→分配服務處→承辦回覆，一般案件標示約7–14個工作天，可附佐證資料。建議案件訴求寫成『請轉交立法院黨團研議第103條之1修法』。"
    - name: "台灣民眾黨中央黨部"
      role: "追蹤／確認收件"
      url: "https://www.tpp.org.tw/"
      notes: "官方網站列中央黨部電話02-27520806、02-77020806，傳真02-87730001；可在送出線上建議後以電話確認轉交政策／黨團窗口。"
    - name: "立法院內政委員會"
      role: "法案實質審查的目標委員會"
      url: "https://www.ly.gov.tw/Pages/List.aspx?nodeid=152"
      notes: "公職人員選舉罷免法修正案由內政委員會審查；實際提案仍需由立委或黨團提出。"

