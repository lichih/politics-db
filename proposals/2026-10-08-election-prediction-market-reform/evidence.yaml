notes:
  - "對外提案時應避免使用『政府在做Minority Report』作為主論證；可作為直覺比喻，但正式法律論證應集中在保護法益、刑法謙抑、最後手段、罪刑均衡、比例原則與新型prediction market分類。"
  - "第一階段不必先寫死具體條文；先要求黨團提出修法研究／公聽會，通常比直接指定單一版本更容易進入政策流程。"
